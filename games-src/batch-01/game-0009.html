<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Royal Desert Party Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{background:linear-gradient(#fef3c7,#fcd34d 60%,#d97706);font-family:Georgia,serif;min-height:100vh;display:flex;flex-direction:column;overflow:hidden}
#top{text-align:center;padding:8px;color:#78350f;font-size:.95rem}
#top b{color:#b45309}
#arena{flex:1;display:flex;position:relative}
.half{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer}
#h1{background:rgba(180,83,9,.14)}
#h2{background:rgba(120,53,15,.14)}
.p{font-size:3rem;font-weight:800;color:#78350f}
.l{font-size:.85rem;color:#92400e;margin-top:6px}
#center{position:fixed;top:44%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:4}
@media(max-width:480px){#cmd{font-size:1.15rem}.p{font-size:2.2rem}}
#cmd{font-size:1.6rem;font-weight:800;color:#7c2d12;text-shadow:0 2px 8px #fff;min-height:2.2rem}
#sub{font-size:.85rem;color:#9a3412}
#ov{position:fixed;inset:0;background:rgba(254,243,199,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#78350f;padding:20px;z-index:9}
button{background:#b45309;color:#fff;border:none;font-family:inherit;font-weight:700;padding:13px 34px;border-radius:26px;font-size:1rem;cursor:pointer;margin-top:14px}
</style>
</head>
<body>
<div id="top">🏜️ ROYAL DESERT PARTY — <span id="st">Wait for the command…</span> &nbsp;|&nbsp; Round <b id="r">1</b>/5 &nbsp;|&nbsp; P1 <b id="s1">0</b> — <b id="s2">0</b> P2</div>
<div id="arena">
<div class="half" id="h1"><div class="p">🤴</div><div class="l">P1 — Tap left / press Q</div></div>
<div class="half" id="h2"><div class="p">👸</div><div class="l">P2 — Tap right / press P</div></div>
</div>
<div id="center"><div id="cmd"></div><div id="sub"></div></div>
<div id="ov"><h2>🏜️ ROYAL DESERT PARTY</h2><p id="od">2 players. When the royal command appears, tap FIRST to win the point. Some commands are traps — tap on a trap and you lose a point! 5 rounds.</p><button id="btn">BEGIN</button></div>
<script>
"use strict";
let s1,s2,round,phase,phaseTO,playing;let bst=+localStorage.getItem('rd_best')||0;
const CMDS=[{t:'🐪 TAP NOW!',ok:true},{t:'🏺 TAP NOW!',ok:true},{t:'👑 TAP NOW!',ok:true},{t:'🦂 TRAP — DO NOT TAP!',ok:false},{t:'🌵 TRAP — DO NOT TAP!',ok:false},{t:'🔥 TRAP — DO NOT TAP!',ok:false}];
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.08,t='square'){if(!playing)return;const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=.1;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
const cmd=document.getElementById('cmd');
function next(){if(round>5)return finish();
document.getElementById('r').textContent=round;
document.getElementById('st').textContent='Wait for the command…';cmd.textContent='…';
const wait=1200+Math.random()*1800;
phaseTO=setTimeout(()=>{const c=CMDS[(Math.random()*CMDS.length)|0];phase=c;cmd.textContent=c.t;
document.getElementById('st').textContent=c.ok?'⚡ TAP!':'😈 Hold back…';
if(!c.ok){phaseTO=setTimeout(()=>{phase=null;cmd.textContent='Phew…';round++;setTimeout(next,600);},1400);}
else{phaseTO=setTimeout(()=>{phase=null;cmd.textContent='Too slow!';round++;setTimeout(next,700);},1500);}},wait);}
function tap(p){if(!playing)return;
if(phase&&phase.ok){if(p===1)s1++;else s2++;beep(p===1?600:800,.1,'triangle');cmd.textContent='👑 P'+p+' scores!';upd();}
else if(phase&&!phase.ok){if(p===1)s1=Math.max(0,s1-1);else s2=Math.max(0,s2-1);beep(120,.2,'sawtooth');cmd.textContent='💀 P'+p+' fell for the trap!';upd();}
else{cmd.textContent='False start! No point.';beep(200,.1,'sawtooth');}
phase=null;clearTimeout(phaseTO);round++;setTimeout(next,700);}
function upd(){document.getElementById('s1').textContent=s1;document.getElementById('s2').textContent=s2;}
function finish(){playing=false;const m=Math.max(s1,s2);if(m>bst){bst=m;localStorage.setItem('rd_best',bst);}
const w=s1===s2?'A TIE!':('👑 PLAYER '+(s1>s2?1:2)+' WINS '+Math.max(s1,s2)+'—'+Math.min(s1,s2)+'!');
document.getElementById('od').innerHTML='<b style="font-size:1.3rem">'+w+'</b>';
document.getElementById('btn').textContent='PLAY AGAIN';document.getElementById('ov').style.display='flex';beep(880,.3,'triangle');}
document.getElementById('h1').addEventListener('pointerdown',()=>{audio.resume();tap(1);});
document.getElementById('h2').addEventListener('pointerdown',()=>{audio.resume();tap(2);});
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='q')tap(1);if(k==='p')tap(2);});
document.getElementById('btn').onclick=()=>{audio.resume();s1=0;s2=0;round=1;playing=true;upd();document.getElementById('ov').style.display='none';next();};
</script>
</body>
</html>
