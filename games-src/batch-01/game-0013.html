<script>
"use strict";
const $=id=>document.getElementById(id);
const W=360,H=520,GOAL=300,cvs=$('c'),ctx=cvs.getContext('2d');
function emit(t,x){try{if(typeof pnEmit==='function')pnEmit(t,x||{})}catch(e){}}
let SV={best:0,wins:0,kills:0};
try{Object.assign(SV,JSON.parse(localStorage.getItem('zs_save')||'{}'))}catch(e){}
function save(){try{localStorage.setItem('zs_save',JSON.stringify(SV))}catch(e){}}
/* ---------- audio ---------- */
let AC=null,NB=null,lastT=0;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended'){try{AC.resume()}catch(e){}}return AC}
function tone(f,d,type,v,delay,slide){const a=ac();if(!a)return;try{const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.06,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function noise(d,v,lp){const a=ac();if(!a)return;try{if(!NB){NB=a.createBuffer(1,a.sampleRate*.5,a.sampleRate);const D=NB.getChannelData(0);for(let i=0;i<D.length;i++)D[i]=Math.random()*2-1}const s=a.createBufferSource(),g=a.createGain(),f=a.createBiquadFilter();s.buffer=NB;f.type='lowpass';f.frequency.value=lp||900;g.gain.setValueAtTime(v||.12,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);s.connect(f);f.connect(g);g.connect(a.destination);s.start();s.stop(a.currentTime+d)}catch(e){}}
const th=(f)=>{const n=performance.now();if(n-lastT<40)return;lastT=n;f()};
const sfx={throw(){th(()=>tone(500,.06,'triangle',.04,0,250))},hit(){th(()=>tone(150,.05,'square',.04))},kill(){th(()=>{noise(.1,.08,600)})},gem(){th(()=>tone(1100,.05,'sine',.04))},hurt(){noise(.2,.15,500);tone(110,.2,'sawtooth',.07,0,-40)},lvl(){[523,659,784,1047].forEach((f,i)=>tone(f,.16,'triangle',.09,i*.07))},thunder(){noise(.4,.2,1800);tone(70,.3,'sawtooth',.09,0,200)},boss(){[110,98,87].forEach((f,i)=>tone(f,.4,'sawtooth',.1,i*.25))},win(){[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.22,'triangle',.1,i*.09))},die(){[330,262,196,147].forEach((f,i)=>tone(f,.3,'sawtooth',.09,i*.16))},heal(){[500,650,800].forEach((f,i)=>tone(f,.1,'sine',.07,i*.06))}};
/* ---------- layout ---------- */
let css=1,dprR=1;
function resize(){css=Math.max(.45,Math.min((innerWidth-12)/W,(innerHeight-70)/H));dprR=Math.min(devicePixelRatio||1,2)*css;cvs.width=Math.round(W*dprR);cvs.height=Math.round(H*dprR);cvs.style.width=Math.round(W*css)+'px';cvs.style.height=Math.round(H*css)+'px'}
addEventListener('resize',resize);resize();
/* ---------- state ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1));
let state='menu',P,zs=[],gems=[],proj=[],parts=[],floats=[],bolts=[],pick=[],t=0,time=0,kills=0,lvl=1,xp=0,need=6,shake=0,flash=0,spawnT=0,bossT=120,cam={x:0,y:0},keys={},joy=null,cd=0,thT=3,orbA=0,hitFx=[],ups={};
const UP=[
{id:'multi',i:'🏈',n:'More balls',d:'Throw +1 ball per volley',max:4},
{id:'rate',i:'⚡',n:'Quick hands',d:'Throw 18% faster',max:6},
{id:'dmg',i:'💪',n:'Power arm',d:'+30% ball damage',max:6},
{id:'pierce',i:'🎯',n:'Piercing throw',d:'Balls pass through +1 zombie',max:4},
{id:'speed',i:'👟',n:'Fast shoes',d:'+12% move speed',max:5},
{id:'magnet',i:'🧲',n:'Magnet',d:'Pick up gems from farther',max:5},
{id:'hp',i:'❤',n:'Vitamins',d:'+25 max HP and heal 40',max:5},
{id:'orbit',i:'🏀',n:'Orbiting balls',d:'Balls circle you and smash zombies',max:5},
{id:'thunder',i:'⛈',n:'Thunder strike',d:'Lightning hits random zombies',max:5}];
function lv(id){return ups[id]||0}
function reset(){P={x:0,y:0,hp:100,mhp:100,sp:112,face:1,inv:0,anim:0};zs=[];gems=[];proj=[];parts=[];floats=[];bolts=[];t=0;kills=0;lvl=1;xp=0;need=6;spawnT=0;bossT=120;thT=3;cd=0;orbA=0;ups={};cam={x:0,y:0};hitFx=[]}
function start(){ac();reset();state='play';$('ov').classList.add('hide');hud()}
function hud(){const s=Math.floor(t);$('tm').textContent='⏱ '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+' / 5:00';$('hp').textContent=Math.max(0,Math.ceil(P.hp));$('lv').textContent=lvl;$('kl').textContent=kills;const b=SV.best;$('bs').textContent=Math.floor(b/60)+':'+String(b%60).padStart(2,'0')}
/* ---------- spawning ---------- */
function spawnZ(type){const a=Math.random()*6.283,d=290,x=P.x+Math.cos(a)*d,y=P.y+Math.sin(a)*d;const sc=1+t/150;const T={walk:{hp:12,sp:34,r:9,dm:8,c:'#6fbf5a'},run:{hp:8,sp:62,r:8,dm:6,c:'#c8d94a'},tank:{hp:70,sp:24,r:14,dm:14,c:'#4a8a6a'},boss:{hp:900,sp:30,r:26,dm:25,c:'#8a3fb0'}}[type];zs.push({x,y,type,hp:T.hp*sc*(type==='boss'?1+t/200:1),mhp:T.hp*sc*(type==='boss'?1+t/200:1),sp:T.sp*(1+Math.min(.5,t/400)),r:T.r,dm:T.dm,c:T.c,fl:0,ph:Math.random()*6,hitCd:0});if(type==='boss')sfx.boss()}
function levelUp(){state='pick';lvl++;xp-=need;need=Math.round(need*1.28+3);sfx.lvl();const pool=UP.filter(u=>lv(u.id)<u.max);pool.sort(()=>Math.random()-.5);pick=pool.slice(0,3);if(!pick.length){state='play';return}
$('ov').innerHTML='<h2>⬆ LEVEL '+lvl+'</h2><p>Choose an upgrade:</p>'+pick.map((u,i)=>'<button class="card" data-i="'+i+'"><span class="ic">'+u.i+'</span><span><b>'+u.n+'</b> <small>Lv '+lv(u.id)+' → '+(lv(u.id)+1)+'</small><small>'+u.d+'</small></span></button>').join('');$('ov').classList.remove('hide');
$('ov').querySelectorAll('.card').forEach(b=>b.onclick=()=>choose(+b.dataset.i))}
function choose(i){const u=pick[i];if(!u)return;ups[u.id]=lv(u.id)+1;if(u.id==='hp'){P.mhp+=25;P.hp=Math.min(P.mhp,P.hp+40)}$('ov').classList.add('hide');state='play';sfx.heal();hud()}
function hurt(d){if(P.inv>0)return;P.hp-=d;P.inv=.35;shake=6;flash=.2;sfx.hurt();if(P.hp<=0){P.hp=0;die()}hud()}
function die(){state='over';sfx.die();const s=Math.floor(t);if(s>SV.best)SV.best=s;SV.kills+=kills;save();emit('GAME_SCORE_UPDATED',{score:kills*10+s});emit('GAME_LOST',{});hud();setTimeout(()=>{$('ov').innerHTML='<h2>🧟 Overrun!</h2><p>You survived <b>'+Math.floor(s/60)+':'+String(s%60).padStart(2,'0')+'</b><br>Zombies thrown out: <b>'+kills+'</b> · Level '+lvl+'<br>Best '+Math.floor(SV.best/60)+':'+String(SV.best%60).padStart(2,'0')+'</p><button class="btn" id="rt">RUN AGAIN</button>';$('ov').classList.remove('hide');$('rt').onclick=start},900)}
function win(){state='over';sfx.win();SV.wins++;SV.best=Math.max(SV.best,GOAL);SV.kills+=kills;save();emit('GAME_SCORE_UPDATED',{score:kills*10+GOAL*2});emit('GAME_LEVEL_COMPLETED',{level:SV.wins});hud();setTimeout(()=>{$('ov').innerHTML='<h2>🌅 DAWN! You survived!</h2><p>5 minutes of horror — the sun is up.<br>Zombies thrown out: <b>'+kills+'</b> · Level '+lvl+'<br>Victories: '+SV.wins+'</p><button class="btn" id="rt">PLAY AGAIN</button>';$('ov').classList.remove('hide');$('rt').onclick=start},900)}
function menu(){state='menu';$('ov').innerHTML='<h2>🏈 THUNDER SPORTS</h2><p>You are the last sportstar! <b>Survive 5 minutes</b> until dawn. Move with <b>WASD / arrows</b> or <b>drag</b> anywhere. You throw footballs at the nearest zombie <b>automatically</b>.</p><p>Collect 💎 to level up and pick upgrades: 🏀 orbiting balls, ⛈ thunder, 🧲 magnet… A boss walks in every 2 minutes!</p><button class="btn" id="go">KICK OFF</button>';$('ov').classList.remove('hide');$('go').onclick=start}
/* ---------- update ---------- */
function update(dt){if(state!=='play')return;t+=dt;time+=dt;P.inv=Math.max(0,P.inv-dt);flash=Math.max(0,flash-dt*2);shake=Math.max(0,shake-dt*20);
let mx=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),my=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0);if(joy){const dx=joy.x-joy.sx,dy=joy.y-joy.sy,l=Math.hypot(dx,dy);if(l>8){mx=dx/Math.max(l,40);my=dy/Math.max(l,40)}}
const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml}const sp=P.sp*(1+lv('speed')*.12);P.x+=mx*sp*dt;P.y+=my*sp*dt;if(mx)P.face=mx>0?1:-1;P.anim+=dt*(ml?12:3);
/* spawn */
const rate=.9+t/60*.55;spawnT-=dt;if(spawnT<=0){spawnT=Math.max(.12,1/rate);const n=1+Math.floor(t/70);for(let i=0;i<n;i++){const r=Math.random();spawnZ(t>90&&r<.14?'tank':t>35&&r<.4?'run':'walk')}}
bossT-=dt;if(bossT<=0){bossT=120;spawnZ('boss');floats.push({x:P.x,y:P.y-60,t:'⚠ BOSS!',c:'#ff6bff',l:1.6,s:22})}
/* weapons: thrown footballs */
cd-=dt;const rateMul=Math.pow(.82,lv('rate'));if(cd<=0&&zs.length){let best=null,bd=1e9;for(const z of zs){const d=(z.x-P.x)**2+(z.y-P.y)**2;if(d<bd){bd=d;best=z}}if(best&&bd<300*300){cd=1.05*rateMul;const n=1+lv('multi'),a0=Math.atan2(best.y-P.y,best.x-P.x);for(let i=0;i<n;i++){const a=a0+(i-(n-1)/2)*.2;proj.push({x:P.x,y:P.y,vx:Math.cos(a)*300,vy:Math.sin(a)*300,dmg:9*(1+lv('dmg')*.3),pierce:1+lv('pierce'),life:1.3,hit:new Set(),rot:0})}sfx.throw()}}
for(const p of proj){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;p.rot+=dt*14;for(const z of zs){if(z.hp<=0||p.hit.has(z))continue;if((z.x-p.x)**2+(z.y-p.y)**2<(z.r+5)**2){p.hit.add(z);dmgZ(z,p.dmg);p.pierce--;if(p.pierce<=0){p.life=0;break}}}}
proj=proj.filter(p=>p.life>0);
/* orbiting balls */
const on=lv('orbit')>0?1+lv('orbit'):0;orbA+=dt*2.6;for(let i=0;i<on;i++){const a=orbA+i*6.283/on,ox=P.x+Math.cos(a)*(46+lv('orbit')*3),oy=P.y+Math.sin(a)*(46+lv('orbit')*3);for(const z of zs){if(z.hp<=0)continue;if((z.x-ox)**2+(z.y-oy)**2<(z.r+8)**2&&(z.orbCd||0)<=0){z.orbCd=.35;dmgZ(z,7*(1+lv('dmg')*.3))}}}
/* thunder */
if(lv('thunder')>0){thT-=dt;if(thT<=0){thT=Math.max(1.2,4.2-lv('thunder')*.5);const n=lv('thunder')+1,cands=zs.filter(z=>(z.x-P.x)**2+(z.y-P.y)**2<260*260).sort(()=>Math.random()-.5).slice(0,n);if(cands.length){sfx.thunder();flash=.12;for(const z of cands){bolts.push({x:z.x,y:z.y,l:.3});dmgZ(z,40+lv('thunder')*10);for(let k=0;k<8;k++)parts.push({x:z.x,y:z.y,vx:rnd(-90,90),vy:rnd(-90,90),l:.5,r:2,c:'#fff7a0'})}}}}
/* zombies */
for(const z of zs){if(z.hp<=0)continue;z.orbCd=(z.orbCd||0)-dt;z.fl-=dt;z.hitCd-=dt;const dx=P.x-z.x,dy=P.y-z.y,d=Math.hypot(dx,dy)||1;z.x+=dx/d*z.sp*dt;z.y+=dy/d*z.sp*dt;z.ph+=dt*8;
if(d<z.r+9){hurt(z.dm);if(z.type!=='boss'){z.x-=dx/d*8;z.y-=dy/d*8}}}
/* separation (cheap) */
for(let i=0;i<zs.length;i++){const a=zs[i];if(a.hp<=0)continue;for(let j=i+1;j<Math.min(zs.length,i+12);j++){const b=zs[j];if(b.hp<=0)continue;const dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy,m=a.r+b.r-2;if(d2<m*m&&d2>.01){const d=Math.sqrt(d2),o=(m-d)*.35;a.x-=dx/d*o;a.y-=dy/d*o;b.x+=dx/d*o;b.y+=dy/d*o}}}
zs=zs.filter(z=>z.hp>0&&(z.x-P.x)**2+(z.y-P.y)**2<700*700);
/* gems */
const mr=60+lv('magnet')*38;for(const g of gems){const dx=P.x-g.x,dy=P.y-g.y,d=Math.hypot(dx,dy);if(d<mr||g.pull){g.pull=true;g.x+=dx/d*260*dt;g.y+=dy/d*260*dt}if(d<12){g.dead=true;xp+=g.v;sfx.gem();if(g.heal){P.hp=Math.min(P.mhp,P.hp+25);sfx.heal();hud()}}}
gems=gems.filter(g=>!g.dead&&(g.x-P.x)**2+(g.y-P.y)**2<900*900);
while(xp>=need&&state==='play')levelUp();
parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt*2});parts=parts.filter(p=>p.l>0);floats.forEach(f=>{f.y-=24*dt;f.l-=dt});floats=floats.filter(f=>f.l>0);bolts.forEach(b=>b.l-=dt);bolts=bolts.filter(b=>b.l>0);
if(Math.floor(t)!==Math.floor(t-dt))hud();if(t>=GOAL)win()}
function dmgZ(z,d){z.hp-=d;z.fl=.08;sfx.hit();if(d>=1)floats.push({x:z.x,y:z.y-z.r,t:Math.round(d),c:'#fff',l:.5,s:10});if(z.hp<=0){kills++;sfx.kill();for(let i=0;i<6;i++)parts.push({x:z.x,y:z.y,vx:rnd(-60,60),vy:rnd(-60,60),l:.6,r:2.5,c:z.c});const n=z.type==='boss'?20:z.type==='tank'?4:1;for(let i=0;i<n;i++)gems.push({x:z.x+rnd(-8,8),y:z.y+rnd(-8,8),v:z.type==='boss'?3:z.type==='tank'?2:1});if(Math.random()<.025||z.type==='boss')gems.push({x:z.x,y:z.y,v:0,heal:true});hud()}}
/* ---------- render ---------- */
function draw(dt){ctx.setTransform(dprR,0,0,dprR,0,0);ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
if(P){cam.x+=(P.x-cam.x)*Math.min(1,dt*8);cam.y+=(P.y-cam.y)*Math.min(1,dt*8)}const ox=W/2-cam.x,oy=H/2-cam.y;
const dawn=Math.max(0,Math.min(1,(t-220)/80));ctx.fillStyle=mixc([8,22,16],[70,110,70],dawn);ctx.fillRect(-10,-10,W+20,H+20);
ctx.strokeStyle='rgba(255,255,255,'+(.05+dawn*.05)+')';ctx.lineWidth=1;const gs=48,gx=((ox%gs)+gs)%gs,gy=((oy%gs)+gs)%gs;for(let x=gx-gs;x<W+gs;x+=gs){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=gy-gs;y<H+gs;y+=gs){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
for(let i=0;i<30;i++){const hx=(i*733+Math.floor(cam.x/300)*17)%1000,x=((i*173)%360-cam.x*.9%360+360)%360,y=((i*97)%520-cam.y*.9%520+520)%520;ctx.fillStyle='rgba(120,200,120,.08)';ctx.fillRect(x,y,3,3)}
gems.forEach(g=>{const x=g.x+ox,y=g.y+oy;if(x<-10||x>W+10||y<-10||y>H+10)return;ctx.save();ctx.translate(x,y);ctx.rotate(Math.PI/4);ctx.fillStyle=g.heal?'#ff7a7a':g.v>1?'#c18bff':'#5cf2ff';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=8;ctx.fillRect(-3.5,-3.5,7,7);ctx.restore();if(g.heal){ctx.font='12px "Apple Color Emoji","Segoe UI Emoji",sans-serif';ctx.textAlign='center';ctx.fillText('🍖',x,y+4)}});
zs.forEach(z=>{const x=z.x+ox,y=z.y+oy;if(x<-30||x>W+30||y<-30||y>H+30)return;ctx.save();ctx.translate(x,y);ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(0,z.r*.8,z.r,z.r*.4,0,0,6.283);ctx.fill();const wob=Math.sin(z.ph)*.12;ctx.rotate(wob);ctx.fillStyle=z.fl>0?'#fff':z.c;ctx.beginPath();ctx.arc(0,0,z.r,0,6.283);ctx.fill();ctx.fillStyle=z.fl>0?'#ddd':shade(z.c);ctx.beginPath();ctx.arc(0,z.r*.2,z.r*.7,0,3.14);ctx.fill();
const dir=P.x>z.x?1:-1;ctx.strokeStyle=z.fl>0?'#fff':z.c;ctx.lineWidth=z.r*.28;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,z.r*.1);ctx.lineTo(dir*z.r*1.4,-z.r*.2+Math.sin(z.ph)*2);ctx.moveTo(0,z.r*.1);ctx.lineTo(dir*z.r*1.2,z.r*.5+Math.cos(z.ph)*2);ctx.stroke();
ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-z.r*.32,-z.r*.2,z.r*.24,0,6.283);ctx.arc(z.r*.32,-z.r*.2,z.r*.24,0,6.283);ctx.fill();ctx.fillStyle='#d11';ctx.beginPath();ctx.arc(-z.r*.32+dir*z.r*.08,-z.r*.2,z.r*.11,0,6.283);ctx.arc(z.r*.32+dir*z.r*.08,-z.r*.2,z.r*.11,0,6.283);ctx.fill();
