<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Viking Farming Sim Adventure</title>
<script>window.__pnNoPad=true;</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#0e1d2a;font-family:'Segoe UI',system-ui,Arial,sans-serif;color:#f4f1e6;display:flex;flex-direction:column;align-items:center;overflow:hidden;padding:max(6px,env(safe-area-inset-top)) 6px max(6px,env(safe-area-inset-bottom))}
#hud{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;font-size:.82rem;margin:2px 0 5px}
#hud span{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:3px 11px;white-space:nowrap}
#hud b{color:#ffd23f;font-variant-numeric:tabular-nums}
#box{position:relative;touch-action:none}
canvas{display:block;border-radius:14px;touch-action:none}
#tabs{display:flex;gap:5px;width:min(100%,380px);margin-top:7px}
#tabs button{flex:1;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#f4f1e6;border-radius:10px;padding:7px 2px;font-size:.78rem;font-weight:700;cursor:pointer}
#tabs button.on{background:linear-gradient(180deg,#d9a441,#a8741c);color:#2a1a00;border-color:#ffd23f}
#list{width:min(100%,380px);margin-top:6px;max-height:152px;overflow-y:auto;display:flex;flex-direction:column;gap:5px;padding-right:2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:6px 10px;font-size:.8rem;text-align:left;color:#f4f1e6;cursor:pointer;width:100%}
.row.sel{border-color:#ffd23f;background:rgba(255,210,63,.15)}.row:disabled{opacity:.45}.row small{display:block;opacity:.8;font-size:.7rem}.row b{color:#ffd23f;white-space:nowrap}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,20,30,.93);border-radius:14px;text-align:center;padding:14px;z-index:5;gap:6px}
.ov.hide{display:none}.ov h2{font-size:1.5rem;color:#ffd23f}.ov p{font-size:.86rem;line-height:1.4;max-width:320px;opacity:.93}
.btn{background:linear-gradient(180deg,#ffd23f,#ff9a1a);color:#2a1500;border:none;padding:11px 28px;border-radius:24px;font-size:1rem;font-weight:800;cursor:pointer;margin-top:6px;min-width:180px}
</style>
</head>
<body>
<div id="hud"><span>🪙 <b id="co">0</b></span><span>⚡ <b id="ps">0</b>/s</span><span>ᚱ <b id="ru">0</b></span><span>Total <b id="tt">0</b></span></div>
<div id="box"><canvas id="c"></canvas><div class="ov" id="ov"></div></div>
<div id="tabs"><button data-t="seeds" class="on">🌱 Seeds</button><button data-t="up">🛠 Upgrades</button><button data-t="an">🐔 Animals</button><button data-t="val">⚔ Valhalla</button></div>
<div id="list"></div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const W=360,H=400,cvs=$('c'),ctx=cvs.getContext('2d');
function emit(t,x){try{if(typeof pnEmit==='function')pnEmit(t,x||{})}catch(e){}}
const CROPS=[{n:'Wheat',e:'🌾',seed:2,grow:6,sell:5,unl:0},{n:'Barley',e:'🌿',seed:5,grow:12,sell:13,unl:40},{n:'Turnip',e:'🥔',seed:12,grow:24,sell:34,unl:250},{n:'Pumpkin',e:'🎃',seed:32,grow:50,sell:95,unl:1200},{n:'Golden Apple',e:'🍎',seed:90,grow:100,sell:300,unl:6000}];
const ANI=[{n:'Chickens',e:'🐔',cost:60,gr:1.5,inc:.5,max:8},{n:'Cows',e:'🐄',cost:400,gr:1.6,inc:3,max:6},{n:'Sheep',e:'🐑',cost:1500,gr:1.7,inc:12,max:5}];
const UPS=[{k:'plow',n:'Plow',e:'⛏',d:'Crops grow +10% faster',cost:40,gr:1.7,max:12},{k:'sickle',n:'Sickle',e:'🔪',d:'+15% harvest value',cost:50,gr:1.8,max:12},{k:'mill',n:'Windmill',e:'🌬',d:'+20% sell price',cost:120,gr:2,max:8},{k:'help',n:'Thrall helper',e:'🧔',d:'Auto harvest + replant',cost:100,gr:2.1,max:8}];
let S={coins:10,life:0,runes:0,plots:4,pl:[],sel:0,lv:{plow:0,sickle:0,mill:0,help:0},an:[0,0,0],ts:Date.now(),best:0,vals:0};
for(let i=0;i<12;i++)S.pl.push(null);
let loaded=false;try{const o=JSON.parse(localStorage.getItem('vk2_save')||'null');if(o&&o.pl){S=Object.assign(S,o);S.lv=Object.assign({plow:0,sickle:0,mill:0,help:0},o.lv||{});loaded=true}}catch(e){}
function save(){S.ts=Date.now();try{localStorage.setItem('vk2_save',JSON.stringify(S))}catch(e){}}
/* ---------- audio ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended'){try{AC.resume()}catch(e){}}return AC}
function tone(f,d,type,v,delay,slide){const a=ac();if(!a)return;try{const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.07,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const sfx={plant(){tone(300,.08,'triangle',.07,0,150)},harv(c){tone(600+Math.min(c,12)*40,.1,'triangle',.08);tone(900+Math.min(c,12)*40,.1,'sine',.05,.05)},buy(){[440,554,659].forEach((f,i)=>tone(f,.12,'triangle',.07,i*.06))},err(){tone(150,.1,'square',.06)},horn(){tone(180,.5,'sawtooth',.06);tone(270,.5,'sawtooth',.04,.15)},up(){[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.08,i*.08))},rain(){tone(2000,.05,'square',.01)}};
/* ---------- helpers ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a);
const cost=(b,g,n)=>Math.round(b*Math.pow(g,n));
const fmt=n=>n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e4?(n/1e3).toFixed(1)+'k':Math.floor(n).toString();
const mulSell=()=>(1+S.lv.mill*.2)*(1+S.runes*.1)*(1+S.lv.sickle*.15);
const growMul=()=>(1+S.lv.plow*.1)*(rain>0?1.5:1);
const crop=i=>CROPS[i];
const unlocked=i=>S.life>=CROPS[i].unl;
function inc(){let s=0;ANI.forEach((a,i)=>s+=S.an[i]*a.inc);return s*(1+S.runes*.1)}
function pos(i){const c=i%3,r=(i/3)|0;return{x:36+c*104,y:150+r*61,w:90,h:54}}
/* ---------- state ---------- */
let time=0,rain=0,rainT=60,ship=null,shipT=40,combo=0,comboT=0,parts=[],floats=[],helpers=[],anim=[],tab='seeds',shake=0,saveT=0,lastUp=0;
function mkHelpers(){while(helpers.length<S.lv.help)helpers.push({x:180,y:130,tgt:-1,wait:rnd(0,2),dir:1});helpers=helpers.slice(0,S.lv.help)}
function mkAnimals(){anim=[];ANI.forEach((a,k)=>{for(let i=0;i<Math.min(S.an[k],6);i++)anim.push({k,x:rnd(20,340),y:rnd(112,142),vx:rnd(-12,12),ph:Math.random()*6})})}
function hud(){$('co').textContent=fmt(S.coins);$('ps').textContent=fmt(inc()+helperRate());$('ru').textContent=S.runes;$('tt').textContent=fmt(S.life)}
function helperRate(){let b=0;for(let i=0;i<CROPS.length;i++)if(unlocked(i))b=i;const c=CROPS[b];return S.lv.help*Math.min(.9,c.sell*mulSell()/(c.grow/growMul()+3))*.6}
function burst(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=rnd(30,120);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-50,life:1,r:rnd(1.5,3.5),c})}}
function ftxt(x,y,t,c,s){floats.push({x,y,t,c:c||'#fff',s:s||13,life:1})}
/* ---------- actions ---------- */
function plant(i,k,free){const c=CROPS[k];if(!free){if(S.coins<c.seed){sfx.err();return false}S.coins-=c.seed}S.pl[i]={k,t:0};const p=pos(i);burst(p.x+45,p.y+30,'#8a5a34',6);sfx.plant();return true}
function harvest(i,auto){const p=S.pl[i];if(!p)return;const c=CROPS[p.k];if(p.t<c.grow/1)return;let m=mulSell();if(ship&&ship.k===p.k)m*=1.6;const v=Math.round(c.sell*m);S.coins+=v;S.life+=v;S.pl[i]=null;const q=pos(i);
combo=comboT>0?Math.min(20,combo+1):1;comboT=2;if(!auto){const bonus=combo>=5?Math.round(v*Math.min(.5,combo*.03)):0;S.coins+=bonus;S.life+=bonus;ftxt(q.x+45,q.y+10,'+'+v+(bonus?' +'+bonus:''),'#ffd23f',13);if(combo>=5)ftxt(q.x+45,q.y-6,'x'+combo+' combo','#ff9a1a',11);sfx.harv(combo)}else ftxt(q.x+45,q.y+10,'+'+v,'#c8f7c5',11);
burst(q.x+45,q.y+26,c.e==='🎃'?'#ff9a1a':'#ffd23f',10);hud();return v}
function buy(kind,key){let c,ok=false;
if(kind==='plot'){c=cost(30,1.9,S.plots-4);if(S.plots<12&&S.coins>=c){S.coins-=c;S.plots++;ok=true}}
else if(kind==='up'){const u=UPS.find(x=>x.k===key);c=cost(u.cost,u.gr,S.lv[key]);if(S.lv[key]<u.max&&S.coins>=c){S.coins-=c;S.lv[key]++;ok=true;if(key==='help')mkHelpers()}}
else if(kind==='an'){const a=ANI[key];c=cost(a.cost,a.gr,S.an[key]);if(S.an[key]<a.max&&S.coins>=c){S.coins-=c;S.an[key]++;ok=true;mkAnimals()}}
if(ok){sfx.buy();hud();renderList()}else sfx.err()}
function valhalla(){if(S.life<3000)return;const r=Math.floor(Math.sqrt(S.life/1000));const gain=Math.max(1,r-S.runes);S.runes+=gain;S.vals++;emit('GAME_SCORE_UPDATED',{score:S.life});emit('GAME_LEVEL_COMPLETED',{level:S.vals});sfx.up();
const keep=S.runes,v=S.vals,b=Math.max(S.best,S.life);S=Object.assign(S,{coins:10,life:0,plots:4,pl:S.pl.map(()=>null),sel:0,lv:{plow:0,sickle:0,mill:0,help:0},an:[0,0,0],runes:keep,vals:v,best:b});mkHelpers();mkAnimals();save();hud();renderList();ftxt(W/2,100,'Valhalla! +'+gain+' ᚱ','#ffd23f',20)}
/* ---------- UI list ---------- */
function renderList(){const L=$('list');let h='';
if(tab==='seeds'){CROPS.forEach((c,i)=>{const u=unlocked(i);h+='<button class="row'+(S.sel===i?' sel':'')+'" data-a="sel" data-i="'+i+'"'+(u?'':' disabled')+'><span>'+c.e+' <b style="color:#fff">'+c.n+'</b><small>'+(u?'Seed '+c.seed+'🪙 · '+c.grow+'s · sells '+Math.round(c.sell*mulSell())+'🪙':'🔒 unlocks at '+fmt(c.unl)+' total coins')+'</small></span><b>'+(S.sel===i?'✔ planting':'select')+'</b></button>'});
if(S.plots<12){const c=cost(30,1.9,S.plots-4);h+='<button class="row" data-a="plot"'+(S.coins<c?' disabled':'')+'><span>➕ <b style="color:#fff">New plot</b><small>'+S.plots+'/12 plots</small></span><b>'+fmt(c)+'🪙</b></button>'}}
else if(tab==='up'){UPS.forEach(u=>{const lv=S.lv[u.k],c=cost(u.cost,u.gr,lv);h+='<button class="row" data-a="up" data-k="'+u.k+'"'+((lv>=u.max||S.coins<c)?' disabled':'')+'><span>'+u.e+' <b style="color:#fff">'+u.n+'</b> Lv'+lv+'<small>'+u.d+'</small></span><b>'+(lv>=u.max?'MAX':fmt(c)+'🪙')+'</b></button>'})}
else if(tab==='an'){ANI.forEach((a,i)=>{const n=S.an[i],c=cost(a.cost,a.gr,n);h+='<button class="row" data-a="an" data-i="'+i+'"'+((n>=a.max||S.coins<c)?' disabled':'')+'><span>'+a.e+' <b style="color:#fff">'+a.n+'</b> ×'+n+'<small>+'+(a.inc*(1+S.runes*.1)).toFixed(1)+' 🪙/s each</small></span><b>'+(n>=a.max?'MAX':fmt(c)+'🪙')+'</b></button>'})}
else{const r=Math.floor(Math.sqrt(S.life/1000)),gain=Math.max(0,r-S.runes);h+='<div class="row" style="cursor:default"><span>⚔ <b style="color:#fff">Valhalla</b><small>Reset your farm to earn runes ᚱ: each gives +10% to everything, forever. Needs 3000 total coins.</small></span></div><button class="row" data-a="val"'+(S.life<3000||gain<1?' disabled':'')+'><span>Ascend now<small>Total '+fmt(S.life)+' · you would gain '+gain+' ᚱ (have '+S.runes+')</small></span><b>'+(gain>0?'+'+gain+' ᚱ':'—')+'</b></button>'}
L.innerHTML=h}
$('list').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;ac();const a=b.dataset.a;if(a==='sel'){S.sel=+b.dataset.i;sfx.plant();renderList()}else if(a==='plot')buy('plot');else if(a==='up')buy('up',b.dataset.k);else if(a==='an')buy('an',+b.dataset.i);else if(a==='val')valhalla()});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));renderList()});
/* ---------- loop ---------- */
function update(dt){time+=dt;comboT-=dt;if(comboT<=0)combo=0;rain=Math.max(0,rain-dt);rainT-=dt;if(rainT<=0){rain=20;rainT=rnd(70,110);ftxt(W/2,90,'🌧 Rain: crops grow faster!','#9be7ff',14);sfx.rain()}
shipT-=dt;if(shipT<=0&&!ship){const ks=[];for(let i=0;i<CROPS.length;i++)if(unlocked(i))ks.push(i);ship={k:ks[(Math.random()*ks.length)|0],t:22,x:-60};shipT=rnd(55,80);sfx.horn();ftxt(W/2,90,'⛵ Trader wants '+CROPS[ship.k].e+' (+60%)','#ffd23f',14)}
if(ship){ship.t-=dt;ship.x=Math.min(W*.5,ship.x+60*dt);if(ship.t<=0)ship=null}
for(let i=0;i<12;i++){const p=S.pl[i];if(p&&i<S.plots)p.t=Math.min(CROPS[p.k].grow,p.t+dt*growMul())}
S.coins+=inc()*dt;S.life+=inc()*dt;
for(const h of helpers){h.wait-=dt;if(h.tgt>=0){const p=pos(h.tgt),tx=p.x+45,ty=p.y+10,dx=tx-h.x,dy=ty-h.y,d=Math.hypot(dx,dy);if(d>6.5){const st=Math.min(d,130*dt);h.x+=dx/d*st;h.y+=dy/d*st;h.dir=dx>0?1:-1;if(st>=d-.01){h.x=tx;h.y=ty}}else{const pl=S.pl[h.tgt];if(pl&&pl.t>=CROPS[pl.k].grow){const k=pl.k;harvest(h.tgt,true);if(S.coins>=CROPS[k].seed)plant(h.tgt,k,false)}h.tgt=-1;h.wait=rnd(.3,1.2)}}
else if(h.wait<=0){let best=-1;for(let i=0;i<S.plots;i++){const p=S.pl[i];if(p&&p.t>=CROPS[p.k].grow&&!helpers.some(o=>o!==h&&o.tgt===i)){best=i;break}}if(best<0){for(let i=0;i<S.plots;i++){if(!S.pl[i]&&S.coins>=CROPS[S.sel].seed&&!helpers.some(o=>o!==h&&o.tgt===i)){plant(i,S.sel,false);break}}h.wait=1.2}else h.tgt=best}}
anim.forEach(a=>{a.x+=a.vx*dt;if(a.x<14||a.x>346)a.vx=-a.vx;if(Math.random()<.01)a.vx=rnd(-14,14)});
parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;p.life-=dt*1.7});parts=parts.filter(p=>p.life>0);floats.forEach(f=>{f.y-=22*dt;f.life-=dt*.9});floats=floats.filter(f=>f.life>0);
lastUp+=dt;if(lastUp>.5){lastUp=0;hud();if(Math.random()<.5)renderListSoft()}saveT+=dt;if(saveT>6){saveT=0;save()}}
let lastHash='';function renderListSoft(){const h=Math.floor(S.coins/ (S.coins>200?10:1))+tab;if(h!==lastHash){lastHash=h;const sc=$('list').scrollTop;renderList();$('list').scrollTop=sc}}
/* ---------- render ---------- */
function draw(){ctx.setTransform(dprR,0,0,dprR,0,0);const day=(Math.sin(time*.05)+1)/2,g=ctx.createLinearGradient(0,0,0,150);g.addColorStop(0,mixc([24,36,80],[110,180,235],day));g.addColorStop(1,mixc([60,70,110],[200,230,250],day));ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
if(day<.5){ctx.fillStyle='rgba(255,255,255,'+(.8-day*1.4)+')';for(let i=0;i<26;i++)ctx.fillRect((i*83)%W,(i*37)%90,1.5,1.5)}
ctx.fillStyle=day>.5?'#fff3b0':'#e8eaff';ctx.beginPath();ctx.arc(300-day*40,38+(1-day)*14,13,0,6.283);ctx.fill();
ctx.fillStyle=mixc([30,40,70],[110,130,160],day);ctx.beginPath();ctx.moveTo(0,112);ctx.lineTo(60,62);ctx.lineTo(105,100);ctx.lineTo(170,48);ctx.lineTo(240,104);ctx.lineTo(300,70);ctx.lineTo(360,112);ctx.fill();
ctx.fillStyle=mixc([20,50,90],[70,150,200],day);ctx.fillRect(0,96,W,22);ctx.fillStyle='rgba(255,255,255,.2)';for(let i=0;i<6;i++)ctx.fillRect(((i*70+time*8)%380)-10,102+(i%3)*5,22,1.6);
if(ship){const sx=ship.x,sy=104+Math.sin(time*2)*1.5;ctx.save();ctx.translate(sx,sy);ctx.fillStyle='#8a5a34';ctx.beginPath();ctx.moveTo(-26,-2);ctx.lineTo(26,-2);ctx.lineTo(18,8);ctx.lineTo(-18,8);ctx.fill();ctx.fillStyle='#c4452e';ctx.fillRect(-1.5,-24,3,24);ctx.fillRect(-14,-24,28,18);ctx.fillStyle='#fff';ctx.fillRect(-14,-18,28,3);ctx.fillStyle='#fff';ctx.font='14px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';ctx.textAlign='center';ctx.fillText(CROPS[ship.k].e,0,-28);ctx.restore()}
const fg=ctx.createLinearGradient(0,118,0,H);fg.addColorStop(0,'#5fae52');fg.addColorStop(1,'#3d8a3c');ctx.fillStyle=fg;ctx.fillRect(0,118,W,H-118);
ctx.fillStyle='rgba(255,255,255,.08)';for(let i=0;i<40;i++)ctx.fillRect((i*47)%W,120+(i*29)%270,3,2);
ctx.fillStyle='#fff';ctx.font='15px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';anim.forEach(a=>{ctx.fillText(ANI[a.k].e,a.x,a.y+Math.sin(time*5+a.ph)*1.2)});
for(let i=0;i<12;i++){const p=pos(i),pl=S.pl[i],ok=i<S.plots;ctx.fillStyle=ok?'#7a4a28':'#5a6a4a';rr(p.x,p.y,p.w,p.h,10);ctx.fill();if(ok){ctx.fillStyle='#8f5b34';rr(p.x+3,p.y+3,p.w-6,p.h-9,8);ctx.fill();ctx.fillStyle='rgba(0,0,0,.15)';for(let k=0;k<5;k++)ctx.fillRect(p.x+10+k*16,p.y+12,10,2.5);ctx.fillStyle='rgba(0,0,0,.1)';ctx.fillRect(p.x,p.y+p.h-6,p.w,6)}
if(!ok){ctx.fillStyle='rgba(0,0,0,.35)';rr(p.x,p.y,p.w,p.h,10);ctx.fill();ctx.fillStyle='#fff';ctx.font='700 11px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🔒',p.x+45,p.y+18);ctx.fillText(i===S.plots?fmt(cost(30,1.9,S.plots-4))+'🪙':'',p.x+45,p.y+38);continue}
if(pl){const c=CROPS[pl.k],f=pl.t/c.grow,rd=f>=1;ctx.save();ctx.translate(p.x+45,p.y+28);const sc=rd?1+Math.sin(time*6)*.06:.35+f*.65;ctx.font=(rd?30:26)*sc+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';if(f<.35){ctx.font='18px "Apple Color Emoji","Segoe UI Emoji",sans-serif';ctx.fillText('🌱',0,2)}else ctx.fillText(c.e,0,0);
if(!rd){ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(-26,20,52,5);ctx.fillStyle='#7bff6a';ctx.fillRect(-26,20,52*f,5)}else{ctx.strokeStyle='rgba(255,230,120,'+(.5+.4*Math.sin(time*6))+')';ctx.lineWidth=2.5;rr(-44,-27,88,52,10);ctx.stroke()}ctx.restore()}
else{ctx.fillStyle='rgba(255,255,255,.35)';ctx.font='700 11px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('tap to plant '+CROPS[S.sel].e,p.x+45,p.y+27)}}
helpers.forEach(h=>{ctx.font='20px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.save();ctx.translate(h.x,h.y+Math.sin(time*10+h.x)*1.5);ctx.scale(h.dir,1);ctx.fillText('🧔',0,0);ctx.restore()});
if(rain>0){ctx.strokeStyle='rgba(180,220,255,.55)';ctx.lineWidth=1.4;for(let i=0;i<70;i++){const x=(i*53+time*60)%W,y=((i*91+time*380)%(H+20))-10;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-3,y+9);ctx.stroke()}ctx.fillStyle='rgba(40,70,110,.15)';ctx.fillRect(0,0,W,H)}
parts.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r*(.4+p.life*.6),0,6.283);ctx.fill()});ctx.globalAlpha=1;
floats.forEach(f=>{ctx.globalAlpha=Math.min(1,f.life*2);ctx.font='800 '+f.s+'px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.strokeText(f.t,f.x,f.y);ctx.fillStyle=f.c;ctx.fillText(f.t,f.x,f.y)});ctx.globalAlpha=1;
if(combo>=3){ctx.font='900 14px system-ui';ctx.textAlign='left';ctx.fillStyle='#ffd23f';ctx.strokeStyle='rgba(0,0,0,.6)';ctx.lineWidth=3;ctx.strokeText('🔥 x'+combo,10,22);ctx.fillText('🔥 x'+combo,10,22)}}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function mixc(a,b,t){return 'rgb('+((a[0]+(b[0]-a[0])*t)|0)+','+((a[1]+(b[1]-a[1])*t)|0)+','+((a[2]+(b[2]-a[2])*t)|0)+')'}
let css=1,dprR=1;
function resize(){css=Math.max(.45,Math.min((innerWidth-12)/W,(innerHeight-290)/H));dprR=Math.min(devicePixelRatio||1,2)*css;cvs.width=Math.round(W*dprR);cvs.height=Math.round(H*dprR);cvs.style.width=Math.round(W*css)+'px';cvs.style.height=Math.round(H*css)+'px'}
addEventListener('resize',resize);resize();
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw()}
/* ---------- input ---------- */
cvs.addEventListener('pointerdown',e=>{ac();const b=cvs.getBoundingClientRect(),x=(e.clientX-b.left)*(W/b.width),y=(e.clientY-b.top)*(H/b.height);
for(let i=0;i<12;i++){const p=pos(i);if(x>=p.x-4&&x<=p.x+p.w+4&&y>=p.y-4&&y<=p.y+p.h+4){if(i>=S.plots){if(i===S.plots)buy('plot');else sfx.err();return}const pl=S.pl[i];if(!pl)plant(i,S.sel,false);else if(pl.t>=CROPS[pl.k].grow)harvest(i,false);hud();renderList();return}}});
addEventListener('visibilitychange',()=>{if(document.hidden)save()});addEventListener('pagehide',save);
/* ---------- offline ---------- */
function welcome(){const el=Math.min(4*3600,Math.max(0,(Date.now()-S.ts)/1000));if(!loaded||el<60)return;const g=Math.floor((inc()+helperRate()+S.plots*.05)*el*.5);if(g<=0)return;S.coins+=g;S.life+=g;
for(let i=0;i<S.plots;i++){const p=S.pl[i];if(p)p.t=CROPS[p.k].grow}
$('ov').innerHTML='<h2>🏠 Welcome back, Jarl!</h2><p>Your farm worked while you were away ('+Math.round(el/60)+' min).<br><b>+'+fmt(g)+' 🪙</b> earned and your crops are ripe.</p><button class="btn" id="ok">COLLECT</button>';$('ov').classList.remove('hide');$('ok').onclick=()=>{$('ov').classList.add('hide');sfx.up();hud()}}
function intro(){$('ov').innerHTML='<h2>🪓 VIKING FARM</h2><p>Tap an empty plot to <b>plant</b>, tap a glowing crop to <b>harvest</b>. Chain harvests for combos! Hire thralls, keep animals, catch the trader ⛵ and ascend to Valhalla for permanent runes.</p><button class="btn" id="ok">START FARMING</button>';$('ov').classList.remove('hide');$('ok').onclick=()=>{ac();$('ov').classList.add('hide');S.ts=Date.now();save()}}
/* ---------- boot ---------- */
mkHelpers();mkAnimals();hud();renderList();if(loaded)welcome();else intro();requestAnimationFrame(loop);
window.__vk={S:()=>S,update,plant,harvest,buy,valhalla,get helpers(){return helpers},pos,renderList,save,setTab(t){tab=t;renderList()},get ship(){return ship},inc,fmt};
</script>
</body>
</html>
