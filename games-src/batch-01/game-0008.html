<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Infinity Party Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{background:#0f172a;font-family:'Segoe UI',Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;overflow:hidden}
#top{color:#e2e8f0;text-align:center;padding:8px;font-size:.95rem}
#top b{color:#fde047}
#arena{flex:1;display:flex;position:relative}
.half{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:filter .1s}
#h1{background:linear-gradient(135deg,#7c3aed,#4c1d95)}
#h2{background:linear-gradient(135deg,#0891b2,#164e63)}
.half:active{filter:brightness(1.3)}
.score{font-size:3.2rem;color:#fff;font-weight:800}
.lbl{color:#e9d5ff;font-size:.85rem;margin-top:6px}
@media(max-width:480px){.score{font-size:2.2rem}#top{font-size:.8rem}}
#msg{position:fixed;top:42%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:2rem;font-weight:800;color:#fde047;text-shadow:0 3px 12px #000;transition:transform .15s;pointer-events:none;z-index:5}
#ov{position:fixed;inset:0;background:rgba(2,6,23,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#e2e8f0;padding:20px;z-index:9}
button{background:#fde047;border:none;color:#0f172a;font-weight:800;padding:14px 36px;border-radius:30px;font-size:1.05rem;cursor:pointer;margin-top:16px}
#rounds{color:#94a3b8;font-size:.85rem;margin-top:8px}
</style>
</head>
<body>
<div id="top">👽 INFINITY PARTY — <span id="who">Tap your color when it glows!</span> &nbsp;|&nbsp; <b id="t">10</b>s &nbsp;|&nbsp; Best streak <b id="bs">0</b></div>
<div id="arena">
<div class="half" id="h1"><div class="score" id="s1">0</div><div class="lbl">PLAYER 1 — Left / A</div></div>
<div class="half" id="h2"><div class="score" id="s2">0</div><div class="lbl">PLAYER 2 — Right / L</div></div>
</div>
<div id="msg"></div>
<div id="ov"><h2 style="color:#a78bfa">👽 INFINITY PARTY GAME</h2><p id="od">2 players. The arena glows <b style="color:#c4b5fd">PURPLE</b> = P1 scores, <b style="color:#67e8f9">CYAN</b> = P2 scores. Tap fast — wrong taps cost a point! 10 second rounds, best of 3.</p><button id="btn">START PARTY</button><div id="rounds"></div></div>
<script>
"use strict";
let s1,s2,time,target,round,scores,playing,tickInt;
let bs=+localStorage.getItem('ip_bs')||0;document.getElementById('bs').textContent=bs;
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.07){if(!playing)return;const o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.value=f;g.gain.value=.09;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
const h1=document.getElementById('h1'),h2=document.getElementById('h2'),msg=document.getElementById('msg');
function flash(t){msg.textContent=t;msg.style.transform='translate(-50%,-50%) scale(1)';setTimeout(()=>msg.style.transform='translate(-50%,-50%) scale(0)',400);}
function setTarget(){const pick=Math.random()<0.5?1:2;target=pick;
h1.style.boxShadow=pick===1?'inset 0 0 120px #fde047':'none';
h2.style.boxShadow=pick===2?'inset 0 0 120px #fde047':'none';
document.getElementById('who').innerHTML=pick===1?'PURPLE glows — <b>P1 TAP!</b>':'CYAN glows — <b>P2 TAP!</b>';}
function tap(p){if(!playing)return;
if(p===target){if(p===1)s1++;else s2++;beep(p===1?500:700,.06);flash(p===1?'+1 P1':'+1 P2');}
else{if(p===1)s1=Math.max(0,s1-1);else s2=Math.max(0,s2-1);beep(140,.15,'sawtooth');flash('WRONG! -1');}
document.getElementById('s1').textContent=s1;document.getElementById('s2').textContent=s2;
if(Math.random()<0.55)setTarget();}
h1.addEventListener('pointerdown',()=>{audio.resume();tap(1);});
h2.addEventListener('pointerdown',()=>{audio.resume();tap(2);});
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='a'||k==='f')tap(1);if(k==='l'||k==='arrowright')tap(2);});
function startRound(){s1=0;s2=0;time=10;playing=true;document.getElementById('s1').textContent=0;document.getElementById('s2').textContent=0;
setTarget();clearInterval(tickInt);
tickInt=setInterval(()=>{time--;document.getElementById('t').textContent=time;if(time<=0)endRound();},1000);}
function endRound(){playing=false;clearInterval(tickInt);h1.style.boxShadow=h2.style.boxShadow='none';
scores.push(s1>s2?0:s2>s1?1:-1);const wins=[scores.filter(x=>x===0).length,scores.filter(x=>x===1).length];
document.getElementById('rounds').textContent='Rounds: P1 '+wins[0]+' — '+wins[1]+' P2';
if(wins[0]>=2||wins[1]>=2||scores.length>=3){const w=wins[0]>wins[1]?1:2;const streak=wins[w-1];
if(streak>bs){bs=streak;localStorage.setItem('ip_bs',bs);document.getElementById('bs').textContent=bs;}
document.getElementById('od').innerHTML='🏆 <b style="color:#fde047">PLAYER '+w+' WINS THE PARTY!</b><br>Final round: '+s1+' — '+s2;
document.getElementById('btn').textContent='PLAY AGAIN';scores=[];}
else{document.getElementById('od').innerHTML='Round '+(scores.length+1)+' coming up…<br>Last round: '+s1+' — '+s2;document.getElementById('btn').textContent='NEXT ROUND';}
document.getElementById('ov').style.display='flex';}
document.getElementById('btn').onclick=()=>{audio.resume();document.getElementById('ov').style.display='none';if(!scores)scores=[];startRound();};
</script>
</body>
</html>
