<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Iron Minimalist Logic Gates</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#fafafa;font-family:'Helvetica Neue',Arial,sans-serif;color:#111;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px}
h1{font-size:1.15rem;font-weight:300;letter-spacing:3px;padding:6px}
#hud{display:flex;gap:14px;font-size:.9rem;color:#555}
@media(max-width:480px){#q{font-size:.95rem}.node,.gate{width:52px;height:52px}}
#q{max-width:560px;text-align:center;margin:14px 0 8px;font-size:1.05rem;line-height:1.6}
#ckt{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;margin:10px 0}
.node{width:64px;height:64px;border:2px solid #111;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;cursor:pointer;user-select:none;background:#fff}
.node.on{background:#111;color:#fff}
.gate{width:72px;height:72px;border:2px solid #111;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700}
.gate small{font-size:.6rem;font-weight:400;color:#666}
.lamp{width:56px;height:56px;border-radius:50%;border:2px solid #111;background:#fff}
.lamp.on{background:#111;box-shadow:0 0 18px #111}
#opts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
#opts button{border:2px solid #111;background:#fff;padding:10px 18px;font-size:.95rem;cursor:pointer;border-radius:6px}
#opts button:hover{background:#111;color:#fff}
#fb{min-height:24px;margin-top:10px;font-weight:600}
#ov{position:fixed;inset:0;background:#fafafa;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:5;color:#111}
#ov button{background:#111;color:#fff;border:none;padding:12px 34px;font-size:1rem;cursor:pointer;margin-top:14px;letter-spacing:2px}
</style>
</head>
<body>
<h1>LOGIC GATES</h1>
<div id="hud"><span>Q <b id="n">1</b>/10</span><span>Score <b id="sc">0</b></span><span>Best <b id="b">0</b></span></div>
<div id="q"></div>
<div id="ckt"></div>
<div id="opts"></div>
<div id="fb"></div>
<div id="ov"><h1 style="letter-spacing:4px">IRON MINIMALIST</h1><p id="od">Pure logic. Toggle the inputs, predict the lamp. Tap TOGGLE to flip inputs, then press your answer: will the lamp be ON or OFF?</p><button id="btn">INITIALIZE</button></div>
<script>
"use strict";
const GATES={AND:(a,b)=>a&&b,OR:(a,b)=>a||b,XOR:(a,b)=>(a^b)===1,NAND:(a,b)=>!(a&&b),NOR:(a,b)=>!(a||b)};
const NAMES=Object.keys(GATES);
let qn,score,a,b,gate,best=+localStorage.getItem('lg_best')||0;document.getElementById('b').textContent=best;
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.07){const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.value=.09;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
function render(){const c=document.getElementById('ckt');c.innerHTML='';
const na=mk(a,'A'),ng=mk2(),nl=document.createElement('div');
nl.className='lamp'+(GATES[gate](a,b)?' on':'');
c.append(na,ng,nl);updateQ();}
function mk(v,l){const d=document.createElement('div');d.className='node'+(v?' on':'');d.textContent=l;d.onclick=()=>{audio.resume();if(l==='A')a=a?0:1;else b=b?0:1;beep(v?300:500);render();};return d;}
function mk2(){const d=document.createElement('div');d.className='gate';d.innerHTML=gate+'<small>2-INPUT</small>';return d;}
function updateQ(){document.getElementById('q').innerHTML='Inputs — <b>A: '+(a?'1':'0')+'</b> · <b>B: '+(b?'1':'0')+'</b> — pass through <b>'+gate+'</b>.<br>Will the lamp be ON or OFF?';}
function ask(){a=Math.random()<0.5?1:0;b=Math.random()<0.5?1:0;gate=NAMES[(Math.random()*NAMES.length)|0];render();
const o=document.getElementById('opts');o.innerHTML='';
[['LAMP ON',1],['LAMP OFF',0]].forEach(([t,v])=>{const btn=document.createElement('button');btn.textContent=t;
btn.onclick=()=>answer(v);o.appendChild(btn);});
document.getElementById('fb').textContent='';document.getElementById('n').textContent=qn+1;}
function answer(v){const right=GATES[gate](a,b)?1:0;const fb=document.getElementById('fb');
if(v===right){score++;beep(700,.12);fb.textContent='✓ Correct.';fb.style.color='#111';}
else{beep(180,.2);fb.textContent='✗ The lamp would be '+(right?'ON':'OFF')+'.';fb.style.color='#b91c1c';}
document.getElementById('sc').textContent=score;
qn++;if(qn>=10){finish();}else setTimeout(ask,1000);}
function finish(){if(score>best){best=score;localStorage.setItem('lg_best',best);document.getElementById('b').textContent=best;}
const r=score>=9?'FLAWLESS LOGIC':score>=7?'CIRCUIT MASTER':score>=5?'COMPILER APPROVED':'SEGMENTATION FAULT';
document.getElementById('od').innerHTML='Score: <b>'+score+'/10</b><br><span style="letter-spacing:3px">'+r+'</span>';
document.getElementById('btn').textContent='REINITIALIZE';document.getElementById('ov').style.display='flex';}
window.addEventListener('keydown',e=>{if(document.getElementById('ov').style.display==='flex')return;const k=e.key.toLowerCase();if(k==='t'){a=a?0:1;render();}if(k==='y'){b=b?0:1;render();}if(k==='o'||k==='x'){const btns=document.querySelectorAll('#opts button');const v=k==='o'?0:1;if(btns[v])btns[v].click();}});
document.getElementById('btn').onclick=()=>{audio.resume();qn=0;score=0;document.getElementById('sc').textContent=0;document.getElementById('ov').style.display='none';ask();};
</script>
</body>
</html>
