<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Crazy Jungle Forest</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#052e16;font-family:Arial,sans-serif;color:#d9f99d;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden}
h1{font-size:1.1rem;color:#a3e635;padding:6px;letter-spacing:1px}
#hud{display:flex;gap:14px;font-size:.9rem;margin-bottom:4px}
canvas{background:#4ade80;border-radius:10px;touch-action:none}
#ov{position:fixed;inset:0;background:rgba(5,46,22,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:5}
button{background:#a3e635;border:none;color:#052e16;font-weight:800;padding:12px 32px;border-radius:24px;font-size:1rem;cursor:pointer;margin-top:14px}
</style>
</head>
<body>
<h1>🌴 CRAZY JUNGLE FOREST</h1>
<div id="hud"><span>Score <b id="s">0</b></span><span>Speed <b id="v">1.0</b>x</span><span>Best <b id="b">0</b></span></div>
<canvas id="c"></canvas>
<div id="ov"><h2 style="color:#a3e635">CRAZY JUNGLE</h2><p id="od">Run the jungle! Jump over logs 🪵 and pits, duck under branches 🌿. Space/↑/tap to jump, ↓/swipe down to duck. Survive as long as you can!</p><button id="btn">RUN!</button></div>
<script>
"use strict";
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');const W=560,H=240;cvs.width=W;cvs.height=H;const GY=H-46;
let dino,obs,score,playing,speed,spawnT,frame,duckT,best=+localStorage.getItem('cj_best')||0;
document.getElementById('b').textContent=best;
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.07,t='square'){if(!playing)return;const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=.09;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
function resize(){const s=Math.min((window.innerWidth-12)/W,(window.innerHeight-140)/H);cvs.style.width=W*s+'px';cvs.style.height=H*s+'px';}
window.addEventListener('resize',resize);resize();
function init(){dino={x:70,y:GY,vy:0,w:26,h:34,onG:true};obs=[];score=0;speed=4.4;spawnT=0;frame=0;duckT=0;playing=true;document.getElementById('s').textContent=0;document.getElementById('v').textContent='1.0';}
function jump(){if(dino.onG){dino.vy=-12.4;dino.onG=false;beep(520,.06);}}
function duck(){duckT=22;beep(240,.05);}
window.addEventListener('keydown',e=>{const k=e.key;if(k===' '||k==='ArrowUp'){e.preventDefault();jump();}if(k==='ArrowDown')duck();});
let touchY=null;
cvs.addEventListener('pointerdown',e=>{audio.resume();touchY=e.clientY;jump();});
cvs.addEventListener('pointerup',e=>{if(touchY!==null&&e.clientY-touchY>40)duck();touchY=null;});
function step(){frame++;score+=0.1;speed=4.4+frame/600;document.getElementById('s').textContent=Math.floor(score);document.getElementById('v').textContent=(speed/4.4).toFixed(1);
dino.vy+=0.62;dino.y+=dino.vy;if(dino.y>=GY){dino.y=GY;dino.vy=0;dino.onG=true;}if(duckT>0)duckT--;
spawnT--;if(spawnT<=0){spawnT=55+Math.random()*50;
if(Math.random()<0.6)obs.push({x:W+20,y:GY-14,w:34,h:14,t:'log'});
else if(Math.random()<0.75)obs.push({x:W+20,y:GY-44,w:16,h:30,t:'bird'});
else obs.push({x:W+20,y:GY,w:26,h:16,t:'pit'});}
obs.forEach(o=>o.x-=speed);
obs=obs.filter(o=>o.x>-60);
const dh=duckT>0?18:dino.h,dy=duckT>0?dino.y-18:dino.y-dino.h;
obs.forEach(o=>{const ow=o.t==='pit'?o.w:o.w,oh=o.t==='pit'?10:o.h,oy=o.t==='pit'?GY-6:o.y;
if(dino.x+dino.w/2>o.x&&dino.x-dino.w/2<o.x+ow&&dy<oy+oh&&dy+dh>oy){die();}});}
function die(){playing=false;const sc=Math.floor(score);if(sc>best){best=sc;localStorage.setItem('cj_best',best);document.getElementById('b').textContent=best;}
document.getElementById('od').innerHTML='You crashed at <b style="color:#fde047">'+Math.floor(score)+'</b> points!';
document.getElementById('btn').textContent='RUN AGAIN';document.getElementById('ov').style.display='flex';beep(140,.4,'sawtooth');}
function draw(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#86efac');g.addColorStop(1,'#4ade80');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.fillStyle='#166534';for(let i=0;i<6;i++){const tx=(i*120-frame*2)% (W+140)-70;ctx.fillRect(tx,GY-60,10,60);ctx.beginPath();ctx.arc(tx+5,GY-60,26,0,7);ctx.fill();}
ctx.fillStyle='#713f12';ctx.fillRect(0,GY,W,H-GY);
obs.forEach(o=>{if(o.t==='log'){ctx.fillStyle='#78350f';ctx.fillRect(o.x,o.y,o.w,o.h);ctx.fillStyle='#92400e';ctx.fillRect(o.x+4,o.y+3,o.w-8,4);}
else if(o.t==='bird'){ctx.fillStyle='#15803d';const f=Math.sin(frame/4)*4;ctx.fillRect(o.x,o.y+f,o.w,o.h);ctx.fillStyle='#fff';ctx.fillRect(o.x+10,o.y+6+f,4,4);}
else{ctx.fillStyle='#052e16';ctx.fillRect(o.x,GY-6,o.w,20);}});
// dino explorer
ctx.fillStyle='#ca8a04';const dh2=duckT>0?18:dino.h;ctx.fillRect(dino.x-dino.w/2,dino.y-dh2,dino.w,dh2);
ctx.fillStyle='#fef08a';ctx.fillRect(dino.x+dino.w/2-8,dino.y-dh2+6,6,6);
ctx.fillStyle='#111';ctx.fillRect(dino.x+dino.w/2-6,dino.y-dh2+8,3,3);}
function loop(){if(playing){step();draw();}requestAnimationFrame(loop);}
document.getElementById('btn').onclick=()=>{audio.resume();init();document.getElementById('ov').style.display='none';};
loop();
</script>
</body>
</html>
