<script>
"use strict";
const $=id=>document.getElementById(id);
const W=360,H=520,cvs=$('c'),ctx=cvs.getContext('2d');

try{Object.assign(SV,JSON.parse(localStorage.getItem('tr_save')||'{}'));SV.best=Math.max(SV.best,+localStorage.getItem('tr_best')||0)}catch(e){}

/* ---------- audio ---------- */

let lastB=0;

/* ---------- layout ---------- */

addEventListener('resize',resize);resize();
/* ---------- state ---------- */

let state='menu',lvl=1,score=0,lives=3,bricks=[],balls=[],pw=[],bolts=[],parts=[],floats=[],paddle,time=0,combo=0,shake=0,tx=null,keys={},flash=0,fx={wide:0,laser:0,slow:0,fire:0},lasT=0,trail=[],bannerT=0,bannerTxt='',left=0,glowT=0;

for(let r=0;r<rows;r++)for(let c=0;c<COLS;c++){if(!pat(r,c))continue;const x=BX+c*BW,y=BY+r*(BH+2);let hp=1,t='n';const roll=Math.random();
if(l>=2&&roll<.12+l*.012)hp=2;if(l>=4&&roll>.93-l*.006)hp=3;if(l>=3&&roll>.96&&r>0){t='boom'}if(l>=5&&(r===rows-1&&c%4===2)){t='steel';hp=6}

/* ---------- flow ---------- */

function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=(sp||1)*rnd(40,220);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,r:rnd(1.5,3.5),c})}}
function ftxt(x,y,t,c,s){floats.push({x,y,t,c:c||'#fff',s:s||13,life:1})}
function dmgBrick(b,d,byFire){if(b.t==='steel'&&!byFire){b.fl=.15;sfx.hard();return false}b.hp-=d;b.fl=.12;if(b.hp<=0){destroy(b);return true}sfx.hard();return false}

if(Math.random()<.15&&b.t!=='steel'){const ks=['multi','wide','laser','slow','fire','life'],wt=[30,22,16,14,12,3];let r=Math.random()*97,k=0;for(;k<ks.length;k++){r-=wt[k];if(r<=0)break}pw.push({x:b.x+b.w/2,y:b.y,k:ks[Math.min(k,5)],vy:110})}
hud()}
function applyPW(k){sfx.pow();const L={multi:'MULTIBALL',wide:'WIDE PADDLE',laser:'LASER',slow:'SLOW-MO',fire:'FIREBALL',life:'+1 LIFE'};ftxt(paddle.x,paddle.y-20,L[k],'#fff',14);
if(k==='multi'){const src=balls.filter(b=>!b.stuck)[0]||balls[0];if(src){for(let i=0;i<2;i++){const a=Math.atan2(src.vy,src.vx)+(i?.5:-.5),s=Math.hypot(src.vx,src.vy)||speedBase();balls.push({x:src.x,y:src.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:5,stuck:false})}}}
else if(k==='wide')fx.wide=14;else if(k==='laser')fx.laser=10;else if(k==='slow')fx.slow=8;else if(k==='fire')fx.fire=7;else if(k==='life'){lives=Math.min(5,lives+1);hud()}}
function loseBall(){fx.fire=0;lives--;sfx.lose();shake=8;hud();if(lives<=0){gameOver();return}resetBall()}
function levelDone(){state='clear';sfx.win();score+=lvl*100;emit('GAME_SCORE_UPDATED',{score});emit('GAME_LEVEL_COMPLETED',{level:lvl});if(lvl+1>SV.lvl)SV.lvl=lvl+1;if(score>SV.best)SV.best=score;save();hud();bannerTxt='LEVEL CLEAR! +'+lvl*100;bannerT=2;flash=.5;burst(W/2,H/2,'#5cf2ff',60,2);setTimeout(()=>{if(state==='clear')startGame(lvl+1)},1900)}
function gameOver(){state='over';sfx.over();emit('GAME_LOST',{});if(score>SV.best)SV.best=score;SV.lvl=1;save();hud();setTimeout(()=>{$('ov').innerHTML='<h2>GAME OVER</h2><p>Reached level <b>'+lvl+'</b><br>Score <b>'+score+'</b> · Best '+SV.best+'</p><button class="btn" id="rt">INSERT COIN</button>';$('ov').classList.remove('hide');$('rt').onclick=()=>startGame(1)},800)}
function menu(){state='menu';$('ov').innerHTML='<h2>⚡ THUNDER RETRO</h2><p>Smash every brick! Move with <b>← →</b> / <b>A D</b> or <b>drag</b>. <b>Space / tap</b> launches the ball and fires lasers.</p><p><span class="pw">⚡ multiball</span><span class="pw">↔ wide</span><span class="pw">🔫 laser</span><span class="pw">🐢 slow</span><span class="pw">🔥 fireball</span></p><p>Explosive bricks 💥 chain-react, steel bricks can only be melted by fire.</p><button class="btn" id="go">START</button>'+(SV.lvl>1?'<button class="btn alt" id="cn">Continue level '+SV.lvl+'</button>':'');$('ov').classList.remove('hide');$('go').onclick=()=>startGame(1);if($('cn'))$('cn').onclick=()=>{score=0;lives=3;startGame(SV.lvl)};hud()}
/* ---------- update ---------- */
function update(dt){time+=dt;shake=Math.max(0,shake-dt*20);flash=Math.max(0,flash-dt*2);bannerT-=dt;for(const k in fx)fx[k]=Math.max(0,fx[k]-dt);
const mv=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0);if(mv){paddle.x+=mv*470*dt;tx=null}else if(tx!==null){const d=tx-paddle.x;paddle.x+=Math.sign(d)*Math.min(Math.abs(d),1500*dt)}
const tw=fx.wide>0?104:64;paddle.w+=(tw-paddle.w)*Math.min(1,dt*10);paddle.x=Math.max(paddle.w/2+4,Math.min(W-paddle.w/2-4,paddle.x));
if(state==='play'){
const sm=fx.slow>0?.62:1;
for(const b of balls){if(b.stuck){b.x=paddle.x;b.y=paddle.y-9;continue}
const steps=3;for(let s=0;s<steps;s++){b.x+=b.vx*dt*sm/steps;b.y+=b.vy*dt*sm/steps;
if(b.x<b.r+4){b.x=b.r+4;b.vx=Math.abs(b.vx);sfx.wall()}if(b.x>W-b.r-4){b.x=W-b.r-4;b.vx=-Math.abs(b.vx);sfx.wall()}if(b.y<b.r+30){b.y=b.r+30;b.vy=Math.abs(b.vy);sfx.wall()}
if(b.vy>0&&b.y+b.r>=paddle.y-paddle.h/2&&b.y-b.r<=paddle.y+paddle.h/2&&Math.abs(b.x-paddle.x)<=paddle.w/2+b.r){const rel=(b.x-paddle.x)/(paddle.w/2),a=-Math.PI/2+rel*1.05,sp=Math.min(520,Math.hypot(b.vx,b.vy)*1.012+1);b.vx=Math.cos(a)*sp;b.vy=Math.sin(a)*sp;b.y=paddle.y-paddle.h/2-b.r;combo=0;sfx.pad();burst(b.x,b.y,'#5cf2ff',5,.6)}
for(const k of bricks){if(k.dead)continue;const cx=Math.max(k.x,Math.min(b.x,k.x+k.w)),cy=Math.max(k.y,Math.min(b.y,k.y+k.h)),dx=b.x-cx,dy=b.y-cy;if(dx*dx+dy*dy<=b.r*b.r){const fire=fx.fire>0;const killed=dmgBrick(k,fire?3:1,fire);if(!fire||(!killed&&k.t==='steel')){const ox=b.r-Math.abs(dx),oy=b.r-Math.abs(dy);if(Math.abs(dx)>Math.abs(dy)||(dx===0&&dy===0&&ox<oy)){b.vx=Math.abs(b.vx)*(dx>=0?1:-1);b.x+=dx>=0?ox*.5:-ox*.5}else{b.vy=Math.abs(b.vy)*(dy>=0?1:-1);b.y+=dy>=0?oy*.5:-oy*.5}}if(!fire)break}}
}
{const sp=Math.hypot(b.vx,b.vy)||1;if(Math.abs(b.vy)<sp*.22){const sg=b.vy>=0?1:-1,vy=sg*sp*.22,vx=Math.sign(b.vx||1)*Math.sqrt(Math.max(0,sp*sp-vy*vy));b.vx=vx;b.vy=vy}}
trail.push({x:b.x,y:b.y,l:1});if(trail.length>40)trail.shift()}
bricks=bricks.filter(k=>!k.dead);balls=balls.filter(b=>b.y<H+20);if(!balls.length)loseBall();
if(left<=0&&state==='play')levelDone();
/* power-ups */
for(const p of pw){p.y+=p.vy*dt;if(p.y>=paddle.y-8&&p.y<=paddle.y+14&&Math.abs(p.x-paddle.x)<=paddle.w/2+10){p.dead=true;applyPW(p.k)}else if(p.y>H+10)p.dead=true}pw=pw.filter(p=>!p.dead);
/* lasers */
if(fx.laser>0){lasT-=dt;if(lasT<=0&&balls.every(b=>!b.stuck)||fx.laser>0&&lasT<=0){lasT=.28;bolts.push({x:paddle.x-paddle.w/2+6,y:paddle.y-8},{x:paddle.x+paddle.w/2-6,y:paddle.y-8});sfx.laser()}}
for(const l of bolts){l.y-=640*dt;for(const k of bricks){if(!k.dead&&l.x>=k.x&&l.x<=k.x+k.w&&l.y>=k.y&&l.y<=k.y+k.h){l.dead=true;dmgBrick(k,1,false);break}}if(l.y<20)l.dead=true}bolts=bolts.filter(l=>!l.dead);bricks=bricks.filter(k=>!k.dead);if(left<=0&&state==='play')levelDone()}
bricks.forEach(k=>{k.fl=Math.max(0,k.fl-dt)});trail.forEach(t=>t.l-=dt*3);trail=trail.filter(t=>t.l>0);

/* ---------- render ---------- */

const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#14062e');g.addColorStop(.6,'#2a0a4a');g.addColorStop(1,'#4a0f5c');ctx.fillStyle=g;ctx.fillRect(-10,-10,W+20,H+20);
/* sun + grid floor */
const sg=ctx.createLinearGradient(0,330,0,H);sg.addColorStop(0,'rgba(255,90,180,.0)');sg.addColorStop(1,'rgba(255,90,180,.25)');ctx.fillStyle=sg;ctx.fillRect(0,330,W,H-330);
ctx.strokeStyle='rgba(255,92,214,.28)';ctx.lineWidth=1;const hz=330,off=(time*30)%40;for(let i=0;i<9;i++){const y=hz+Math.pow((i*40+off)/(H-hz),1.7)*(H-hz)*1;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}for(let i=-8;i<=8;i++){ctx.beginPath();ctx.moveTo(W/2+i*14,hz);ctx.lineTo(W/2+i*70,H);ctx.stroke()}

/* power-ups */
for(const p of pw){const c={multi:'#ffd23f',wide:'#5cf2ff',laser:'#ff5c7a',slow:'#7bff6a',fire:'#ff7a45',life:'#ff5cd6'}[p.k],e={multi:'⚡',wide:'↔',laser:'🔫',slow:'🐢',fire:'🔥',life:'❤'}[p.k];ctx.save();ctx.translate(p.x,p.y);ctx.shadowColor=c;ctx.shadowBlur=12;ctx.fillStyle=c;rr(-14,-9,28,18,9);ctx.fill();ctx.shadowBlur=0;ctx.font='12px "Apple Color Emoji","Segoe UI Emoji",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.fillText(e,0,1);ctx.restore()}
bolts.forEach(l=>{ctx.fillStyle='#ff5c7a';ctx.shadowColor='#ff5c7a';ctx.shadowBlur=10;ctx.fillRect(l.x-1.5,l.y,3,12);ctx.shadowBlur=0});
/* balls */
const fire=fx.fire>0;trail.forEach(t=>{ctx.globalAlpha=Math.max(0,t.l*.35);ctx.fillStyle=fire?'#ff7a45':'#5cf2ff';ctx.beginPath();ctx.arc(t.x,t.y,4*t.l+1,0,6.283);ctx.fill()});ctx.globalAlpha=1;

if(paddle){ctx.save();ctx.shadowColor='#ff5cd6';ctx.shadowBlur=14;const pg=ctx.createLinearGradient(0,paddle.y-6,0,paddle.y+6);pg.addColorStop(0,'#ff9aea');pg.addColorStop(1,'#a21caf');ctx.fillStyle=pg;rr(paddle.x-paddle.w/2,paddle.y-paddle.h/2,paddle.w,paddle.h,6);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='rgba(255,255,255,.5)';ctx.fillRect(paddle.x-paddle.w/2+6,paddle.y-paddle.h/2+2,paddle.w-12,2);if(fx.laser>0){ctx.fillStyle='#ff5c7a';ctx.fillRect(paddle.x-paddle.w/2+2,paddle.y-paddle.h/2-5,5,6);ctx.fillRect(paddle.x+paddle.w/2-7,paddle.y-paddle.h/2-5,5,6)}ctx.restore()}
parts.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r*(.4+p.life*.6),0,6.283);ctx.fill()});ctx.globalAlpha=1;
floats.forEach(f=>{ctx.globalAlpha=Math.min(1,f.life*2);ctx.font='800 '+f.s+'px system-ui';ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.strokeText(f.t,f.x,f.y);ctx.fillStyle=f.c;ctx.fillText(f.t,f.x,f.y)});ctx.globalAlpha=1;
let y=H-8;ctx.font='700 10px system-ui';ctx.textAlign='left';ctx.fillStyle='#fff';[['wide','↔'],['laser','🔫'],['slow','🐢'],['fire','🔥']].forEach(([k,e],i)=>{if(fx[k]>0){ctx.fillText(e+' '+Math.ceil(fx[k])+'s',10+i*54,y)}});
if(combo>=4&&state==='play'){ctx.font='800 13px system-ui';ctx.textAlign='left';ctx.fillStyle='#5cf2ff';ctx.fillText('COMBO '+combo,10,48)}
if(bannerT>0){ctx.globalAlpha=Math.min(1,bannerT*2);ctx.font='900 30px system-ui';ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.shadowColor='#5cf2ff';ctx.shadowBlur=18;ctx.fillStyle='#fff';ctx.fillText(bannerTxt,W/2,H*.62);ctx.shadowBlur=0;ctx.globalAlpha=1}
if(state==='play'&&balls.some(b=>b.stuck)&&bannerT<=0){ctx.font='700 13px system-ui';ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,'+(.5+.4*Math.sin(time*5))+')';ctx.fillText('TAP or SPACE to launch',W/2,H*.62)}
if(flash>0){ctx.fillStyle='rgba(255,255,255,'+flash*.5+')';ctx.fillRect(0,0,W,H)}
ctx.restore();if(scan){ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(scan,0,0)}}
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.033,(now-last)/1000);last=now;if(state==='play'||state==='clear'||state==='over'||state==='menu'){if(paddle)update(dt);else time+=dt}draw()}
/* ---------- input ---------- */
function px(e){const b=cvs.getBoundingClientRect();return(e.clientX-b.left)*(W/b.width)}
cvs.addEventListener('pointerdown',e=>{ac();if(state!=='play')return;tx=px(e);if(balls.some(b=>b.stuck))launch()});
cvs.addEventListener('pointermove',e=>{if(state==='play'&&(e.pointerType==='mouse'||e.buttons))tx=px(e)});
addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;if(['ArrowLeft','ArrowRight','a','d'].includes(k)){keys[k]=true;e.preventDefault()}else if(k===' '||k==='Enter'||k==='ArrowUp'){e.preventDefault();if(state==='play'){if(balls.some(b=>b.stuck))launch()}else if(!$('ov').classList.contains('hide')){const b=$('go')||$('rt');if(b)b.click()}}});
addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false});
/* ---------- boot ---------- */
paddle={x:W/2,y:H-48,w:64,h:12};genLevel(1);balls=[];menu();requestAnimationFrame(loop);
window.__br={get state(){return state},get balls(){return balls},get bricks(){return bricks},get lives(){return lives},get lvl(){return lvl},get score(){return score},get left(){return left},startGame,launch,get paddle(){return paddle},get pw(){return pw},applyPW,SV,get fx(){return fx}};
