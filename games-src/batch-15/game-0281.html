<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Bounce Quest #281</title><style>
body{margin:0;font-family:system-ui;background:#1c1917;color:#fafaf9;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a8a29e;font-size:.78rem}
canvas{background:#292524;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}
#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#1c1917;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>⚽ Desert Bounce Quest</h1><div class="sub">Drag to aim & launch — bounce the ball off walls to hit every target!</div>
<div id="hud"><span>Level <b id="l">1</b></span><span>Shots <b id="s">3</b></span><span>Targets <b id="t">0</b></span></div>
<canvas id="cv" width="440" height="440"></canvas>
<div id="ov"><div style="font-size:3rem">🎯</div><p>Drag anywhere to aim, release to fire.<br>Hit all targets before shots run out!</p><button id="btn">Launch</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440;
let ball=null,targets=[],walls=[],shots=3,level=1,playing=false,drag=null;
function gen(){targets=[];walls=[];
// targets
const nt=2+level;
for(let i=0;i<nt;i++)targets.push({x:60+Math.random()*320,y:60+Math.random()*320,r:16,hit:false});
// walls
const nw=Math.min(4,level);
for(let i=0;i<nw;i++){walls.push({x:60+Math.random()*300,y:80+Math.random()*280,w:60+Math.random()*60,h:12,horiz:Math.random()<0.5});}
ball=null;shots=3;
document.getElementById('l').textContent=level;
document.getElementById('s').textContent=shots;
document.getElementById('t').textContent=nt;draw();}
function launch(vx,vy){if(shots<=0)return;
ball={x:70,y:380,vx:vx*0.12,vy:vy*0.12,r:10};
shots--;document.getElementById('s').textContent=shots;
beep(500,.1);draw();}
cvs.addEventListener('pointerdown',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
drag={x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*W/r.height};});
cvs.addEventListener('pointerup',e=>{if(!drag||!playing)return;const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*W/r.height;
launch(drag.x-x,drag.y-y);drag=null;});
function step(){if(!ball)return;
ball.x+=ball.vx;ball.y+=ball.vy;
// walls bounce
if(ball.x<ball.r){ball.x=ball.r;ball.vx*=-0.9;beep(300,.04);}
if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx*=-0.9;beep(300,.04);}
if(ball.y<ball.r){ball.y=ball.r;ball.vy*=-0.9;beep(300,.04);}
if(ball.y>W-ball.r){ball.y=W-ball.r;ball.vy*=-0.9;beep(300,.04);}
walls.forEach(wl=>{
if(ball.x>wl.x&&ball.x<wl.x+wl.w&&ball.y>wl.y-ball.r&&ball.y<wl.y+wl.h+ball.r){
ball.vy*=-0.9;ball.y=ball.vy>0?wl.y+wl.h+ball.r:wl.y-ball.r;beep(400,.05);}});
// targets
targets.forEach(t=>{if(!t.hit&&Math.hypot(ball.x-t.x,ball.y-t.y)<t.r+ball.r){
t.hit=true;beep(700,.12,'triangle');}});
const remaining=targets.filter(t=>!t.hit).length;
document.getElementById('t').textContent=remaining;
if(remaining===0){playing=false;beep(880,.3,'triangle');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🎉 All targets cleared!<br>Level '+(level+1);
level++;document.getElementById('l').textContent=level;setTimeout(gen,800);return;}
// ball slow → dead
if(Math.abs(ball.vx)<0.2&&Math.abs(ball.vy)<0.2){ball=null;
if(shots<=0){playing=false;beep(130,.3,'sawtooth');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='💥 Out of shots! Level '+level+' — try again.';}}else{
ball.vx*=0.995;ball.vy*=0.995;}}
function draw(){ctx.fillStyle='#292524';ctx.fillRect(0,0,W,W);
walls.forEach(wl=>{ctx.fillStyle='#57534e';ctx.fillRect(wl.x,wl.y,wl.w,wl.h);});
targets.forEach(t=>{ctx.font='24px serif';ctx.textAlign='center';
ctx.fillText(t.hit?'💥':'🎯',t.x,t.y+8);});
if(ball){ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,7);
ctx.fillStyle='#fbbf24';ctx.fill();}
if(drag){ctx.strokeStyle='#fbbf2455';ctx.setLineDash([4,4]);
ctx.beginPath();ctx.moveTo(70,380);ctx.lineTo(drag.x,drag.y);ctx.stroke();ctx.setLineDash([]);}
if(playing){if(ball)step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();gen();};
</script></body></html>
