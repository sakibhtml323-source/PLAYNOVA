<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Royal Number Maze #283</title><style>
body{margin:0;font-family:system-ui;background:#1e1b4b;color:#eef2ff;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a5b4fc;font-size:.78rem}
#grid{display:grid;grid-template-columns:repeat(6,54px);gap:4px;margin:12px}
.c{width:54px;height:54px;background:#312e81;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.15rem;font-weight:800;cursor:pointer}
.c.me{background:#7c3aed;outline:2px solid #fbbf24}
.c.done{background:#14532d;opacity:.7}
.c.next{border:2px solid #fbbf24;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #fbbf2455}50%{box-shadow:0 0 0 8px #fbbf2411}}
#hud{display:flex;gap:14px;font-size:.9rem;margin:4px}
#hud b{color:#fbbf24}
#msg{min-height:1.3em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#fbbf24;color:#1e1b4b;font-weight:700;cursor:pointer;margin:8px}
</style></head><body>
<h1>🔢 Royal Number Maze</h1><div class="sub">Step on numbers in ascending order — 1, 2, 3… Grab them all before your moves run out!</div>
<div id="hud"><span>Need <b id="n">1</b></span><span>Moves <b id="m">30</b></span><span>Level <b id="l">1</b></span></div>
<div id="grid"></div><div id="msg"></div>
<button id="btn">🎲 New Maze</button>
<audio id="au"></audio>
<script>
"use strict";
const AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const R=6,C=6;let grid=[],me={r:0,c:0},next=1,maxN=10,moves=30,level=1,playing=true;
function gen(){grid=[];for(let r=0;r<R;r++){const row=[];for(let c=0;c<C;c++)row.push(0);grid.push(row);}
// place numbers 1..maxN
maxN=Math.min(4+level,10);
const cells=[];for(let r=0;r<R;r++)for(let c=0;c<C;c++)cells.push([r,c]);
cells.sort(()=>Math.random()-.5);
for(let i=1;i<=maxN;i++){const[r,c]=cells[i];grid[r][c]=i;}
me={r:cells[0][0],c:cells[0][1]};
moves=20+level*4;next=1;playing=true;
document.getElementById('m').textContent=moves;
document.getElementById('l').textContent=level;
document.getElementById('n').textContent=1;
render();msg('Grab the numbers in order!');}
function neigh(r,c){const out=[];if(r>0)out.push([r-1,c]);if(r<R-1)out.push([r+1,c]);
if(c>0)out.push([r,c-1]);if(c<C-1)out.push([r,c+1]);return out;}
function tap(r,c){if(!playing)return;
if(Math.abs(r-me.r)+Math.abs(c-me.c)!==1){beep(160,.06,'sawtooth');return;}
me={r,c};moves--;document.getElementById('m').textContent=moves;
const v=grid[r][c];
if(v===next){grid[r][c]=-1;next++;
document.getElementById('n').textContent=next;
beep(500+v*40,.12,'triangle');
if(next>maxN){playing=false;beep(880,.3,'triangle');
msg('🎉 Sequence complete! Level '+(level+1));pnEmit('GAME_LEVEL_COMPLETED',{level:level});level++;
setTimeout(gen,1000);return;}}
else if(v>0){beep(200,.1,'sawtooth');msg('❌ Need '+next+' first!');}
else beep(380,.04);
render();
if(moves<=0){playing=false;beep(130,.3,'sawtooth');msg('💨 Out of moves!');}}
function render(){const g=document.getElementById('grid');g.innerHTML='';
for(let r=0;r<R;r++)for(let c=0;c<C;c++){const d=document.createElement('div');
d.className='c'+(r===me.r&&c===me.c?' me':grid[r][c]===-1?' done':grid[r][c]===next?' next':'');
d.textContent=grid[r][c]>0?grid[r][c]:(r===me.r&&c===me.c?'🤴':'');
d.onclick=()=>{AU.__c=AU.__c||new (window.AudioContext||window.webkitAudioContext)();tap(r,c);};
g.appendChild(d);}}
function msg(t){document.getElementById('msg').textContent=t;}
document.getElementById('btn').onclick=()=>{AU.__c=new (window.AudioContext||window.webkitAudioContext)();gen();};
gen();
</script></body></html>
