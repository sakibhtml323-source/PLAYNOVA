<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crystal Laser Alignment #287</title><style>
body{margin:0;font-family:system-ui;background:#0f172a;color:#e2e8f0;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#94a3b8;font-size:.78rem}
canvas{background:#1e293b;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}
#hud b{color:#facc15}
#msg{min-height:1.3em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#7c3aed;color:#fff;font-weight:700;cursor:pointer;margin:8px}
</style></head><body>
<h1>🔮 Crystal Laser Alignment</h1><div class="sub">Rotate crystals so the beam enters and exits correctly — light all of them!</div>
<div id="hud"><span>Level <b id="l">1</b></span><span>Rotations <b id="m">0</b></span></div>
<canvas id="cv" width="400" height="400"></canvas>
<div id="msg"></div>
<button id="btn">✨ New Alignment</button>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const N=6,CELL=400/N;
// crystal types: 0=straight(H),1=straight(V),2=elbow
let grid=[],laserIn={r:0,c:0,d:1},moves=0,level=1,playing=true;
function gen(){grid=[];
// guaranteed solvable path
const path=[];let r=0,c=0;
path.push([r,c]);let d='D';
while(r<N-1||c<N-1){
if(d==='D'&&r<N-1){r++;path.push([r,c]);if(Math.random()<0.5&&c<N-1)d='R';}
else if(c<N-1){c++;path.push([r,c]);d='D';}}
for(let rr=0;rr<N;rr++){const row=[];for(let cc=0;cc<N;cc++){
const pi=path.findIndex(p=>p[0]===rr&&p[1]===cc);
if(pi>=0){const prev=path[pi-1],next2=path[pi+1];
let t;
if(!prev)t=1;else if(!next2)t=prev[0]===rr?0:1;
else t=(prev[0]===next2[0])?(prev[1]===cc?1:0):(prev[0]===rr?0:1);
// elbows
if(prev&&next2&&((prev[0]===rr&&next2[1]===cc)||(prev[1]===cc&&next2[0]===rr)))t=2;
row.push({t,r:(Math.random()*4)|0});}
else row.push(null);}grid.push(row);}
// rotate randomly
grid.forEach(row=>row.forEach(cell=>{
if(cell&&Math.random()<0.7){cell.r=(cell.r+1+((Math.random()*3)|0))%4;}}));
laserIn={r:0,c:0,d:1};moves=0;playing=true;
document.getElementById('l').textContent=level;
document.getElementById('m').textContent=0;
draw();msg('Align the crystals!');}
function outDir(cell,d){if(cell.t===0)return d===1?3:d===3?1:d===0?2:0;
if(cell.t===1)return d===0?2:d===2?0:d===1?3:1;
// elbow: / 
if(cell.r%2===0)return d===0?1:d===1?0:d===2?3:2;
return d===0?3:d===3?0:d===1?2:1;}
function litSet(){const lit=new Set();const key=(r,c)=>r*N+c;
let r=laserIn.r,c=laserIn.c,d=laserIn.d;
for(let step=0;step<64;step++){
const cell=grid[r]&&grid[r][c];
if(!cell)break;
lit.add(key(r,c));
d=outDir(cell,d);
const dr=[-1,0,1,0][d],dc=[0,1,0,-1][d];
r+=dr;c+=dc;
if(r<0||r>=N||c<0||c>=N)break;}
return{lit,exit:{r,c,d}};}
function tap(r,c){if(!playing||!grid[r][c])return;
grid[r][c].r=(grid[r][c].r+1)%4;moves++;document.getElementById('m').textContent=moves;
beep(440,.06);draw();check();}
function check(){const{lit}=litSet();
// count crystals
let total=0;grid.forEach(row=>row.forEach(cell=>{if(cell)total++;}));
if(lit.size===total){playing=false;beep(880,.3,'triangle');
msg('🔮 All crystals lit in '+moves+' rotations! Level '+(level+1));level++;
setTimeout(gen,1000);}}
function draw(){ctx.fillStyle='#1e293b';ctx.fillRect(0,0,400,400);
const{lit,exit}=litSet();
for(let r=0;r<N;r++)for(let c=0;c<N;c++){const x=c*CELL,y=r*CELL;
ctx.strokeStyle='#334155';ctx.strokeRect(x,y,CELL,CELL);
const cell=grid[r][c];if(!cell)continue;
const isLit=lit.has(r*N+c);
ctx.fillStyle=isLit?'#7c3aed55':'#1e293b';
ctx.fillRect(x+2,y+2,CELL-4,CELL-4);
ctx.save();ctx.translate(x+CELL/2,y+CELL/2);
ctx.rotate(cell.r*Math.PI/2);
ctx.font='22px serif';ctx.textAlign='center';
ctx.fillText(cell.t===0?'━':cell.t===1?'┃':'╋',0,8);
ctx.restore();}
// laser
ctx.strokeStyle='#ef4444';ctx.lineWidth=3;
ctx.beginPath();let r=laserIn.r,c=laserIn.c,d=laserIn.d;
ctx.moveTo(c*CELL+CELL/2,r*CELL+CELL/2);
for(let step=0;step<64;step++){
const cell=grid[r]&&grid[r][c];if(!cell)break;
d=outDir(cell,d);
const dr=[-1,0,1,0][d],dc=[0,1,0,-1][d];
r+=dr;c+=dc;
if(r<0||r>=N||c<0||c>=N){ctx.lineTo(c*CELL+CELL/2,r*CELL+CELL/2);break;}
ctx.lineTo(c*CELL+CELL/2,r*CELL+CELL/2);}
ctx.stroke();ctx.lineWidth=1;
// source
ctx.font='18px serif';ctx.fillText('🔦',20,20);}
cvs.addEventListener('pointerdown',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
const c=Math.floor((e.clientX-r.left)/r.width*N),rr=Math.floor((e.clientY-r.top)/r.height*N);
AU.__c=AU.__c||new (window.AudioContext||window.webkitAudioContext)();tap(rr,c);});
function msg(t){document.getElementById('msg').textContent=t;}
document.getElementById('btn').onclick=()=>{AU.__c=new (window.AudioContext||window.webkitAudioContext)();gen();};
gen();
</script></body></html>
