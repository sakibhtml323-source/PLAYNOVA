<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ninja Target Skipper #293</title><style>
body{margin:0;font-family:system-ui;background:#111827;color:#f9fafb;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#9ca3af;font-size:.78rem}
canvas{background:#1f2937;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}
#hud b{color:#facc15}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#facc15;color:#111827;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🥷 Ninja Target Skipper</h1><div class="sub">Tap exactly when the rope reaches the bottom — perfect timing builds combos. 3 misses and you're out!</div>
<div id="hud"><span>Skips <b id="s">0</b></span><span>Combo <b id="c">×1</b></span><span>Misses <b id="x">0</b>/3</span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="400" height="340"></canvas>
<div id="ov"><div style="font-size:3rem">🪢</div><p>The rope swings faster each level.<br>Tap/Space when it hits the bottom!</p><button id="btn">Skip</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=400,H=340,GY=240;
let skips=0,combo=1,misses=0,playing=false,t=0,level=1,best=+localStorage.getItem('ts_best')||0;
document.getElementById('b').textContent=best;
function ropeY(){const speed=2.2+level*0.25;
return GY-90+Math.abs(Math.sin(t*0.02*speed))*110;}
function tap(){if(!playing)return;
const y=ropeY();const bottom=GY+20;
const diff=Math.abs(y-bottom);
if(diff<18){skips++;combo=Math.min(combo+1,20);
document.getElementById('s').textContent=skips;
document.getElementById('c').textContent='×'+combo;
beep(500+combo*30,.08,'triangle');
if(skips%10===0){level++;beep(880,.2,'triangle');}
if(skips>best){best=skips;localStorage.setItem('ts_best',best);document.getElementById('b').textContent=best;}}
else{misses++;combo=1;document.getElementById('x').textContent=misses;
document.getElementById('c').textContent='×1';beep(150,.2,'sawtooth');
if(misses>=3){playing=false;beep(130,.35,'sawtooth');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🪢 Tripped!<br>Total skips: <b style="color:#facc15">'+skips+'</b> · Reached level '+level;}}}
cvs.addEventListener('pointerdown',tap);
document.addEventListener('keydown',e=>{if(e.code==='Space')tap();});
function draw(){ctx.fillStyle='#1f2937';ctx.fillRect(0,0,W,H);
// ground
ctx.fillStyle='#374151';ctx.fillRect(0,GY+44,W,H-GY-44);
// ninja
ctx.font='34px serif';ctx.textAlign='center';
ctx.fillText('🥷',W/2,GY+38);
// rope holders
ctx.font='24px serif';ctx.fillText('🎋',40,GY+30);ctx.fillText('🎋',W-40,GY+30);
// rope
const y=ropeY();
ctx.strokeStyle='#fbbf24';ctx.lineWidth=3;
ctx.beginPath();ctx.moveTo(40,GY+24);ctx.quadraticCurveTo(W/2,y,W-40,GY+24);ctx.stroke();
// bottom target zone
ctx.fillStyle='#fbbf2433';ctx.fillRect(W/2-50,GY+12,100,16);
if(playing){t++;requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{skips=0;combo=1;misses=0;level=1;t=0;
document.getElementById('s').textContent=0;document.getElementById('c').textContent='×1';
document.getElementById('x').textContent=0;
document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();};
</script></body></html>
