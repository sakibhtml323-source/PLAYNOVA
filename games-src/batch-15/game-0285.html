<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ninja Color Flood #285</title><style>
body{margin:0;font-family:system-ui;background:#111827;color:#f9fafb;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#9ca3af;font-size:.78rem}
#grid{display:grid;grid-template-columns:repeat(8,38px);gap:2px;margin:12px}
.c{width:38px;height:38px;border-radius:6px}
#pal{display:flex;gap:8px;margin:8px}
.p{width:44px;height:44px;border-radius:10px;cursor:pointer;border:3px solid transparent}
.p.sel{border-color:#fff}
#hud{display:flex;gap:14px;font-size:.9rem;margin:4px}
#hud b{color:#facc15}
#msg{min-height:1.3em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#facc15;color:#111827;font-weight:700;cursor:pointer;margin:8px}
</style></head><body>
<h1>🎨 Ninja Color Flood</h1><div class="sub">Pick colors to flood from the top-left. Fill the whole board in as few moves as possible!</div>
<div id="hud"><span>Moves <b id="m">0</b></span><span>Best <b id="b">—</b></span><span>Limit <b id="l">22</b></span></div>
<div id="grid"></div>
<div id="pal"></div>
<div id="msg"></div>
<button id="btn">🌊 New Flood</button>
<audio id="au"></audio>
<script>
"use strict";
const AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const N=8;const COLS=['#ef4444','#f59e0b','#22c55e','#3b82f6','#a855f7','#ec4899'];
let grid=[],moves=0,limit=22,best=+localStorage.getItem('cf_best')||Infinity;
function gen(){grid=[];for(let r=0;r<N;r++){const row=[];for(let c=0;c<N;c++)row.push((Math.random()*COLS.length)|0);grid.push(row);}
moves=0;limit=22;document.getElementById('m').textContent=0;
document.getElementById('l').textContent=limit;
document.getElementById('b').textContent=best<Infinity?best:'—';
buildPal();render();msg('Flood from top-left!');}
function buildPal(){const p=document.getElementById('pal');p.innerHTML='';
COLS.forEach((col,i)=>{const d=document.createElement('div');d.className='p';
d.style.background=col;d.onclick=()=>flood(i);p.appendChild(d);});}
function flood(col){if(moves>=limit){beep(130,.2,'sawtooth');msg('💧 Out of moves!');return;}
const start=grid[0][0];if(start===col)return;
// BFS flood
const q=[[0,0]];const seen=new Set(['0,0']);
while(q.length){const[r,c]=q.pop();
grid[r][c]=col;
[[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([nr,nc])=>{
if(nr>=0&&nr<N&&nc>=0&&nc<N&&!seen.has(nr+','+nc)&&grid[nr][nc]===start){
seen.add(nr+','+nc);q.push([nr,nc]);}});}
moves++;document.getElementById('m').textContent=moves;
beep(400+col*60,.08);render();
if(grid.every(row=>row.every(v=>v===col))){beep(880,.3,'triangle');
if(moves<best){best=moves;localStorage.setItem('cf_best',best);}
msg('🌊 Flooded in '+moves+' moves! Best: '+best);
document.getElementById('b').textContent=best;}}
function render(){const g=document.getElementById('grid');g.innerHTML='';
for(let r=0;r<N;r++)for(let c=0;c<N;c++){const d=document.createElement('div');d.className='c';
d.style.background=COLS[grid[r][c]];g.appendChild(d);}}
function msg(t){document.getElementById('msg').textContent=t;}
document.getElementById('btn').onclick=()=>{AU.__c=new (window.AudioContext||window.webkitAudioContext)();gen();};
gen();
</script></body></html>
