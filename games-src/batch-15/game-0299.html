<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haunted Maze Chase #299</title><style>
body{margin:0;font-family:system-ui;background:#18181b;color:#fafafa;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a1a1aa;font-size:.78rem}
#grid{display:grid;grid-template-columns:repeat(9,38px);gap:1px;margin:10px}
.c{width:38px;height:38px;background:#27272a;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:18px}
.c.wall{background:#3f3f46}
#hud{display:flex;gap:14px;font-size:.9rem;margin:4px}
#hud b{color:#facc15}
#msg{min-height:1.3em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#7c3aed;color:#fff;font-weight:700;cursor:pointer;margin:8px}
</style></head><body>
<h1>👻 Haunted Maze Chase</h1><div class="sub">Reach the exit — the ghost hunts you and gets faster each level!</div>
<div id="hud"><span>Level <b id="l">1</b></span><span>Caught <b id="c">0</b>/3</span><span>Moves <b id="m">0</b></span></div>
<div id="grid"></div><div id="msg"></div>
<button id="btn">🌫️ New Haunt</button>
<audio id="au"></audio>
<script>
"use strict";
const AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const N=9;let grid=[],me={r:1,c:1},ghost={r:7,c:7},exit={r:7,c:7},caught=0,moves=0,level=1,playing=true;
function gen(){grid=[];for(let r=0;r<N;r++){const row=[];for(let c=0;c<N;c++)row.push(r%2===0&&c%2===0&&Math.random()<0.45?1:0);grid.push(row);}
for(let i=0;i<N;i++){grid[0][i]=1;grid[N-1][i]=1;grid[i][0]=1;grid[i][N-1]=1;}
grid[1][1]=0;me={r:1,c:1};
exit={r:N-2,c:N-2};grid[N-2][N-2]=0;
ghost={r:N-2,c:1};grid[N-2][1]=0;moves=0;playing=true;
document.getElementById('m').textContent=0;render();msg('Reach the 🚪 — the 👻 is hunting!');}
function bfsNext(sr,sc,tr,tc){const prev={};const q=[[sr,sc]];const seen=new Set([sr*N+sc]);
while(q.length){const[r,c]=q.shift();
if(r===tr&&c===tc){let k=r*N+c;const path=[];while(k!==undefined&&k!==sr*N+sc){path.push(k);k=prev[k];}
return path.length?path[path.length-1]:null;}
[[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([nr,nc])=>{
if(nr>=0&&nr<N&&nc>=0&&nc<N&&!grid[nr][nc]&&!seen.has(nr*N+nc)){
seen.add(nr*N+nc);prev[nr*N+nc]=r*N+c;q.push([nr,nc]);}});}
return null;}
function move(dr,dc){if(!playing)return;
const r=me.r+dr,c=me.c+dc;
if(r<0||r>=N||c<0||c>=N||grid[r][c]){beep(160,.06,'sawtooth');return;}
me={r,c};moves++;document.getElementById('m').textContent=moves;beep(400,.04);
// ghost moves every turn, speed = 1 + level/3 moves per player move
const gmoves=1+Math.floor(level/3);
for(let g=0;g<gmoves;g++){
const nk=bfsNext(ghost.r,ghost.c,me.r,me.c);
if(nk!==null){ghost={r:(nk/N)|0,c:nk%N};}
if(ghost.r===me.r&&ghost.c===me.c){caught++;document.getElementById('c').textContent=caught;
beep(150,.25,'sawtooth');msg('👻 Caught! Back to start.');
me={r:1,c:1};
if(caught>=3){playing=false;msg('🚨 The ghost claims you!');return;}
break;}}
if(r===exit.r&&c===exit.c){playing=false;beep(880,.3,'triangle');
msg('🚪 Escaped! Level '+(level+1));level++;document.getElementById('l').textContent=level;
setTimeout(gen,1000);return;}
render();}
function render(){const g=document.getElementById('grid');g.innerHTML='';
for(let r=0;r<N;r++)for(let c=0;c<N;c++){const d=document.createElement('div');
d.className='c'+(grid[r][c]?' wall':'');
if(r===me.r&&c===me.c)d.textContent='🏃';
else if(r===ghost.r&&c===ghost.c)d.textContent='👻';
else if(r===exit.r&&c===exit.c)d.textContent='🚪';
d.onclick=()=>{const dr=r-me.r,dc=c-me.c;if(Math.abs(dr)+Math.abs(dc)===1){
AU.__c=AU.__c||new (window.AudioContext||window.webkitAudioContext)();move(dr,dc);}};
g.appendChild(d);}}
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();
if(k==='arrowup')move(-1,0);if(k==='arrowdown')move(1,0);
if(k==='arrowleft')move(0,-1);if(k==='arrowright')move(0,1);});
function msg(t){document.getElementById('msg').textContent=t;}
document.getElementById('btn').onclick=()=>{level=1;caught=0;
document.getElementById('l').textContent=1;document.getElementById('c').textContent=0;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();gen();};
gen();
</script></body></html>
