<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Idle Clicker: Minimalist Edition</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#fff;font-family:'Helvetica Neue',Arial,sans-serif;color:#222;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px;overflow-x:hidden}
h1{font-weight:200;letter-spacing:5px;font-size:.95rem;color:#999;padding:8px}
#stats{display:flex;gap:16px;font-size:.85rem;color:#666}
#dot{width:110px;height:110px;border-radius:50%;background:#111;cursor:pointer;margin:24px 0;transition:transform .08s;user-select:none}
#dot:active{transform:scale(.9)}
#dot i{position:absolute}
main{width:min(460px,94vw);padding-bottom:40px}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid #eee;font-size:.9rem}
.row button{background:#111;color:#fff;border:none;border-radius:20px;padding:8px 18px;cursor:pointer;font-size:.8rem}
.row button:disabled{opacity:.3}
#foot{display:flex;gap:8px;margin-top:14px}
#foot button{background:#eee;color:#333;border:none;border-radius:8px;padding:8px 16px;cursor:pointer;font-size:.8rem}
@media(max-width:420px){#dot{width:88px;height:88px}}
</style>
</head>
<body>
<h1>MINIMAL IDLE</h1>
<div id="stats"><span><b id="c" style="font-size:1.4rem;color:#111">0</b> points</span><span><b id="r">0</b>/s</span><span>best <b id="b">0</b></span></div>
<div id="dot"></div>
<main><div id="shop"></div>
<div id="foot"><button id="save">save</button><button id="reset">reset</button></div></main>
<script>
"use strict";
const ITEMS=[{n:'cursor',d:'+1 /click',c:15,f:S=>S.pc+=1},{n:'auto',d:'+1 /s',c:30,f:S=>S.ps+=1},{n:'boost',d:'+8 /click',c:120,f:S=>S.pc+=8},{n:'farm',d:'+12 /s',c:250,f:S=>S.ps+=12},{n:'singularity',d:'+60 /s',c:1200,f:S=>S.ps+=60}];
let S={c:0,pc:1,ps:0,own:[0,0,0,0,0]};
function load(){try{const d=JSON.parse(localStorage.getItem('mi_save'));if(d)Object.assign(S,d);}catch(e){}}
function save(){localStorage.setItem('mi_save',JSON.stringify(S));let b=+localStorage.getItem('mi_best')||0;if(S.c>b)localStorage.setItem('mi_best',Math.floor(S.c));}
load();document.getElementById('b').textContent=+localStorage.getItem('mi_best')||0;
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.04){const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=.06;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
const dot=document.getElementById('dot');
dot.addEventListener('pointerdown',e=>{audio.resume();S.c+=S.pc;dot.style.transform='scale(.88)';beep(200+Math.random()*100);render();setTimeout(()=>dot.style.transform='',80);});
window.addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();dot.dispatchEvent(new PointerEvent('pointerdown'));}if(e.key>='1'&&e.key<='5'){const b=document.querySelectorAll('.row button')[+e.key-1];if(b&&!b.disabled)b.click();}});
function render(){document.getElementById('c').textContent=Math.floor(S.c);document.getElementById('r').textContent=S.ps;
const sh=document.getElementById('shop');sh.innerHTML='';
ITEMS.forEach((it,i)=>{const row=document.createElement('div');row.className='row';
row.innerHTML='<div><b>'+it.n+'</b> <span style="color:#999;font-size:.75rem">'+it.d+' · ×'+S.own[i]+'</span></div>';
const b=document.createElement('button');b.textContent=it.c;b.disabled=S.c<it.c;
b.onclick=()=>{if(S.c>=it.c){S.c-=it.c;S.own[i]++;it.f(S);beep(440+i*60);render();save();}};
row.appendChild(b);sh.appendChild(row);});}
setInterval(()=>{S.c+=S.ps/10;render();},100);
document.getElementById('save').onclick=()=>{save();beep(880);};
document.getElementById('reset').onclick=()=>{if(confirm('Reset everything?')){S={c:0,pc:1,ps:0,own:[0,0,0,0,0]};localStorage.removeItem('mi_save');render();}};
window.addEventListener('beforeunload',save);
render();
</script>
</body>
</html>
