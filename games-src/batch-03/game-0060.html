<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Horror Neon Forest</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#050505;font-family:Georgia,serif;color:#a1a1aa;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden}
h1{font-size:1.1rem;color:#22d3ee;padding:6px;letter-spacing:2px}
#hud{display:flex;gap:14px;font-size:.9rem;margin-bottom:4px}
canvas{background:#0a0a0a;border-radius:10px;touch-action:none;cursor:crosshair}
#ov{position:fixed;inset:0;background:rgba(5,5,5,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#d4d4d8;padding:20px;z-index:5}
button{background:#22d3ee;border:none;color:#050505;font-weight:800;padding:12px 32px;border-radius:24px;font-size:1rem;cursor:pointer;margin-top:14px;font-family:inherit}
</style>
</head>
<body>
<h1>🌲 HORROR NEON FOREST</h1>
<div id="hud"><span>Night <b id="n">1</b>/10</span><span>Fireflies <b id="f">0</b>/<b id="t">0</b></span><span>❤️ <b id="h">3</b></span><span>Best <b id="b">0</b></span></div>
<canvas id="c"></canvas>
<div id="ov"><h2 style="color:#22d3ee">THE NEON WOODS</h2><p id="od">Catch the glowing fireflies 🟡 to light the dark forest! But beware the red wisps 🔴 — they bite. Tap fireflies before they fade. Light 10 nights to lift the curse!</p><button id="btn">ENTER THE WOODS</button></div>
<script>
"use strict";
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');const W=420,H=460;cvs.width=W;cvs.height=H;
let flies,playing,night,hp,frame,got,best=+localStorage.getItem('nf_best')||0;
document.getElementById('b').textContent=best;
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.06,t='sine'){if(!playing)return;const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=.09;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
function resize(){const s=Math.min((window.innerWidth-12)/W,(window.innerHeight-140)/H);cvs.style.width=W*s+'px';cvs.style.height=H*s+'px';}
window.addEventListener('resize',resize);resize();
function initNight(){flies=[];got=0;
const nF=4+night,nB=Math.min(1+((night/2)|0),5);
document.getElementById('n').textContent=night;document.getElementById('t').textContent=nF;document.getElementById('f').textContent=0;
for(let i=0;i<nF;i++)flies.push(mk(false));
for(let i=0;i<nB;i++)flies.push(mk(true));
document.getElementById('msg')||0;}
function mk(bad){return{x:30+Math.random()*(W-60),y:30+Math.random()*(H-120),vx:(Math.random()-.5)*1.4,vy:(Math.random()-.5)*1.4,
life:280+Math.random()*160,bad,r:bad?13:11};}
function step(){frame++;
flies.forEach(f=>{f.x+=f.vx;f.y+=f.vy;f.life--;
if(f.x<16||f.x>W-16)f.vx*=-1;if(f.y<16||f.y>H-76)f.vy*=-1;
if(f.life<=0){if(f.bad)flies.splice(flies.indexOf(f),1);
else{hp--;document.getElementById('h').textContent=hp;beep(140,.2,'sawtooth');flies.splice(flies.indexOf(f),1);
if(hp<=0)return die();}}});
if(!flies.some(f=>!f.bad)){night++;
if(night>10){win();return;}
hp=Math.min(3,hp+1);document.getElementById('h').textContent=hp;beep(700,.15,'triangle');initNight();}}
let kfx=W/2,kfy=H/2;
window.addEventListener('keydown',e=>{if(!playing)return;const k=e.key;const st2=16;
if(k==='ArrowLeft'||k==='a')kfx-=st2;else if(k==='ArrowRight'||k==='d')kfx+=st2;
else if(k==='ArrowUp'||k==='w')kfy-=st2;else if(k==='ArrowDown'||k==='s')kfy+=st2;
else if(k==='Enter'||k===' '){e.preventDefault();
let hit=null;flies.forEach(f=>{if(Math.hypot(f.x-kfx,f.y-kfy)<f.r+10)hit=f;});
if(hit){if(hit.bad){hp--;document.getElementById('h').textContent=hp;beep(130,.2,'sawtooth');if(hp<=0)return die();}
else{got++;document.getElementById('f').textContent=got;beep(800+got*30,.07,'triangle');}
flies.splice(flies.indexOf(hit),1);}return;}else return;
kfx=Math.max(10,Math.min(W-10,kfx));kfy=Math.max(10,Math.min(H-70,kfy));});
cvs.addEventListener('pointerdown',e=>{if(!playing)return;audio.resume();const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
let hit=null;flies.forEach(f=>{if(Math.hypot(f.x-x,f.y-y)<f.r+10)hit=f;});
if(hit){if(hit.bad){hp--;document.getElementById('h').textContent=hp;beep(130,.2,'sawtooth');
if(hp<=0)return die();}
else{got++;document.getElementById('f').textContent=got;beep(800+got*30,.07,'triangle');}
flies.splice(flies.indexOf(hit),1);}});
function win(){playing=false;if(night-1>best){best=night-1;localStorage.setItem('nf_best',best);document.getElementById('b').textContent=best;}
beep(880,.2,'triangle');setTimeout(()=>beep(1100,.2,'triangle'),150);setTimeout(()=>beep(1320,.3,'triangle'),320);
document.getElementById('od').innerHTML='🌅 <b style="color:#fde047">THE CURSE IS LIFTED!</b><br>You survived all 10 nights of the neon forest.';
document.getElementById('btn').textContent='RE-ENTER THE WOODS';document.getElementById('ov').style.display='flex';}
function die(){playing=false;if(night-1>best){best=night-1;localStorage.setItem('nf_best',best);document.getElementById('b').textContent=best;}
beep(110,.5,'sawtooth');
document.getElementById('od').innerHTML='🌑 The forest keeps its darkness…<br>You lasted '+Math.max(0,night-1)+' nights.';
document.getElementById('btn').textContent='TRY AGAIN';document.getElementById('ov').style.display='flex';}
function draw(){ctx.fillStyle='#0a0a0a';ctx.fillRect(0,0,W,H);
// neon trees
for(let i=0;i<9;i++){const tx=(i*97)%W;
ctx.strokeStyle=['#22d3ee22','#a855f722','#4ade8022'][i%3];ctx.lineWidth=2;
ctx.beginPath();ctx.moveTo(tx,H);ctx.lineTo(tx+Math.sin(frame/40+i)*10,H-200-(i%3)*40);ctx.stroke();}
flies.forEach(f=>{const fade=Math.min(1,f.life/120);
const g2=ctx.createRadialGradient(f.x,f.y,2,f.x,f.y,f.r*2.4);
const col=f.bad?'239,68,68':'250,204,21';
g2.addColorStop(0,'rgba('+col+','+(0.9*fade)+')');g2.addColorStop(1,'rgba('+col+',0)');
ctx.fillStyle=g2;ctx.beginPath();ctx.arc(f.x,f.y,f.r*2.4,0,7);ctx.fill();
ctx.fillStyle=f.bad?'#ef4444':'#fde047';ctx.beginPath();ctx.arc(f.x,f.y,4,0,7);ctx.fill();});}
function loop(){if(playing){step();draw();}requestAnimationFrame(loop);}
document.getElementById('btn').onclick=()=>{audio.resume();night=1;hp=3;playing=true;
document.getElementById('h').textContent=3;initNight();document.getElementById('ov').style.display='none';};
loop();
</script>
<div id="msg"></div>
</body>
</html>
