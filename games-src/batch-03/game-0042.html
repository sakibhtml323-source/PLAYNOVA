<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

<body>
<div id="hud"><span id="hp"></span><span>⬇ Depth <b id="dp">1</b></span><span>🪙 <b id="co">0</b></span><span id="ky">🗝 –</span><span>Best <b id="bs">0</b></span></div>
<div id="box"><canvas id="c"></canvas><div class="ov" id="ov"></div></div>
<div id="panel"><div id="dpad"><span></span><button data-d="0">▲</button><span></span><button data-d="3">◀</button><button data-d="4">⏳</button><button data-d="1">▶</button><span></span><button data-d="2">▼</button><span></span></div><div id="side"><button id="pot">🧪 Potion ×0</button><button id="wait">⏳ Wait a turn</button></div></div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const T=32,VW=11,VH=11,W=VW*T,H=VH*T,MW=28,MH=28,cvs=$('c'),ctx=cvs.getContext('2d');
function emit(t,x){try{if(typeof pnEmit==='function')pnEmit(t,x||{})}catch(e){}}
let best=0;try{best=+localStorage.getItem('dd_best')||0}catch(e){}
/* ---------- audio ---------- */
let AC=null,NB=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended'){try{AC.resume()}catch(e){}}return AC}
function tone(f,d,type,v,delay,slide){const a=ac();if(!a)return;try{const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.07,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function noise(d,v,lp){const a=ac();if(!a)return;try{if(!NB){NB=a.createBuffer(1,a.sampleRate*.4,a.sampleRate);const D=NB.getChannelData(0);for(let i=0;i<D.length;i++)D[i]=Math.random()*2-1}const s=a.createBufferSource(),g=a.createGain(),f=a.createBiquadFilter();s.buffer=NB;f.type='lowpass';f.frequency.value=lp||800;g.gain.setValueAtTime(v||.12,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);s.connect(f);f.connect(g);g.connect(a.destination);s.start();s.stop(a.currentTime+d)}catch(e){}}
const sfx={step(){tone(120+Math.random()*30,.04,'square',.025)},hit(){noise(.12,.15,1200);tone(180,.1,'sawtooth',.06,0,-80)},hurt(){noise(.25,.2,500);tone(110,.25,'sawtooth',.09,0,-40)},coin(){tone(1000,.06,'square',.05);tone(1500,.08,'square',.05,.05)},key(){[700,900,1200,1500].forEach((f,i)=>tone(f,.12,'triangle',.09,i*.06))},potion(){[400,500,650].forEach((f,i)=>tone(f,.12,'sine',.08,i*.07))},spike(){tone(900,.05,'sawtooth',.05,0,-600)},stairs(){[500,400,300,200].forEach((f,i)=>tone(f,.15,'triangle',.08,i*.08))},locked(){tone(150,.12,'square',.07)},die(){[330,262,196,147].forEach((f,i)=>tone(f,.35,'sawtooth',.09,i*.18))},kill(){noise(.2,.15,900);tone(260,.12,'triangle',.07,0,-120)},pick(){tone(700,.1,'triangle',.07,0,300)}};
/* ---------- layout ---------- */
let css=1,dprR=1;
function resize(){css=Math.max(.45,Math.min((innerWidth-12)/W,(innerHeight-240)/H));dprR=Math.min(devicePixelRatio||1,2)*css;cvs.width=Math.round(W*dprR);cvs.height=Math.round(H*dprR);cvs.style.width=Math.round(W*css)+'px';cvs.style.height=Math.round(H*css)+'px'}
addEventListener('resize',resize);resize();
/* ---------- generation ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1));
let map,seen,vis,rooms,ents,items,spikes,P,depth=1,coins=0,kills=0,turn=0,hasKey=false,torch=0,pots=0,dmgB=1,state='menu',parts=[],floats=[],shake=0,flash=0,time=0,hurtT=0,msg='',msgT=0,sandP=[];
function gen(){map=Array.from({length:MH},()=>Array(MW).fill(0));rooms=[];
for(let t=0;t<90&&rooms.length<9;t++){const w=ri(4,7),h=ri(4,7),x=ri(1,MW-w-2),y=ri(1,MH-h-2);if(rooms.some(r=>x<r.x+r.w+2&&x+w+2>r.x&&y<r.y+r.h+2&&y+h+2>r.y))continue;rooms.push({x,y,w,h,cx:x+(w>>1),cy:y+(h>>1)});for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)map[j][i]=1}
for(let i=1;i<rooms.length;i++){let a=rooms[i-1],b=rooms[i],x=a.cx,y=a.cy;while(x!==b.cx){x+=Math.sign(b.cx-x);map[y][x]=1}while(y!==b.cy){y+=Math.sign(b.cy-y);map[y][x]=1}}
seen=Array.from({length:MH},()=>Array(MW).fill(false));vis=Array.from({length:MH},()=>Array(MW).fill(false));
const s=rooms[0];P={x:s.cx,y:s.cy,ax:s.cx,ay:s.cy,hp:P?P.hp:5,mhp:P?P.mhp:5,face:1,bump:0};
/* farthest room for stairs via BFS */
const dist=bfs(P.x,P.y);let far=rooms[1]||rooms[0],fd=-1;rooms.forEach((r,i)=>{if(i===0)return;const d=dist[r.cy][r.cx];if(d>fd){fd=d;far=r}});map[far.cy][far.cx]=2;
ents=[];items=[];spikes=[];const free=(r)=>{for(let k=0;k<30;k++){const x=ri(r.x,r.x+r.w-1),y=ri(r.y,r.y+r.h-1);if(map[y][x]===1&&!(x===r.cx&&y===r.cy)&&!ents.some(e=>e.x===x&&e.y===y)&&!items.some(e=>e.x===x&&e.y===y)&&!spikes.some(e=>e.x===x&&e.y===y)&&!(x===P.x&&y===P.y))return{x,y}}return null};
const others=rooms.slice(1).filter(r=>r!==far),keyRoom=others.length?others[ri(0,others.length-1)]:far;const kp=free(keyRoom)||{x:keyRoom.cx+1,y:keyRoom.cy};items.push({x:kp.x,y:kp.y,k:'key'});
rooms.forEach((r,i)=>{if(i===0)return;const n=Math.min(5,ri(0,1+Math.floor((depth-1)/2))+(r===far&&depth>=2?1:0));for(let k=0;k<n;k++){const p=free(r);if(!p)continue;const roll=Math.random();let t='skel';if(depth>=2&&roll<.3)t='scar';if(depth>=3&&roll>.72)t='mum';const hp={skel:2,scar:1,mum:4}[t]+(depth>6?1:0);ents.push({x:p.x,y:p.y,ax:p.x,ay:p.y,t,hp,mhp:hp,flash:0,sk:0,alert:false})}
if(Math.random()<.55){const n2=ri(2,4);for(let k=0;k<n2;k++){const p=free(r);if(p)spikes.push({x:p.x,y:p.y,ph:(p.x+p.y)%2})}}
if(Math.random()<.6){const p=free(r);if(p){const roll=Math.random();items.push({x:p.x,y:p.y,k:roll<.35?'coin':roll<.7?'potion':roll<.86?'torch':'sword'})}}
if(Math.random()<.5){const p=free(r);if(p)items.push({x:p.x,y:p.y,k:'coin'})}});
hasKey=false;turn=0;calcVis()}
function bfs(sx,sy){const d=Array.from({length:MH},()=>Array(MW).fill(-1));const q=[[sx,sy]];d[sy][sx]=0;while(q.length){const[x,y]=q.shift();for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=MW||ny>=MH||map[ny][nx]===0||d[ny][nx]>=0)continue;d[ny][nx]=d[y][x]+1;q.push([nx,ny])}}return d}
function los(x0,y0,x1,y1){let dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,err=dx-dy,x=x0,y=y0;while(!(x===x1&&y===y1)){if(!(x===x0&&y===y0)&&map[y][x]===0)return false;const e2=2*err;if(e2>-dy){err-=dy;x+=sx}if(e2<dx){err+=dx;y+=sy}}return true}
function calcVis(){const R=torch>0?7:5;for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)vis[y][x]=false;for(let y=P.y-R;y<=P.y+R;y++)for(let x=P.x-R;x<=P.x+R;x++){if(x<0||y<0||x>=MW||y>=MH)continue;if(Math.hypot(x-P.x,y-P.y)>R+.3)continue;if(los(P.x,P.y,x,y)){vis[y][x]=true;seen[y][x]=true}}}
/* ---------- turn logic ---------- */
function hud(){$('hp').innerHTML='❤'.repeat(Math.max(0,P.hp))+'🖤'.repeat(Math.max(0,P.mhp-P.hp));$('dp').textContent=depth;$('co').textContent=coins;$('ky').textContent=hasKey?'🗝 got it!':'🗝 find key';$('bs').textContent=best;$('pot').textContent='🧪 Potion ×'+pots;$('pot').disabled=pots<1||P.hp>=P.mhp}
function say(t){msg=t;msgT=2}
function ftxt(x,y,t,c,s){floats.push({x:x*T+T/2,y:y*T,t,c:c||'#fff',s:s||13,life:1})}
function burst(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=rnd(30,120);parts.push({x:x*T+T/2,y:y*T+T/2,vx:Math.cos(a)*s,vy:Math.sin(a)*s-30,life:1,r:rnd(1.5,3.5),c})}}
const entAt=(x,y)=>ents.find(e=>e.x===x&&e.y===y&&e.hp>0);
const spikeUp=(s)=>((turn+s.ph)%2===0);
function hurtP(d,why){P.hp-=d;hurtT=.3;shake=8;sfx.hurt();flash=.3;ftxt(P.x,P.y,'-'+d,'#ff6b6b',16);hud();if(P.hp<=0)die(why)}
function die(why){state='dead';sfx.die();const score=depth*100+coins*5+kills*10;if(depth>best){best=depth;try{localStorage.setItem('dd_best',best)}catch(e){}}emit('GAME_SCORE_UPDATED',{score});emit('GAME_LOST',{});
setTimeout(()=>{$('ov').innerHTML='<h2>💀 You perished</h2><p>'+why+'</p><p>Depth <b>'+depth+'</b> · 🪙 '+coins+' · ⚔ '+kills+' kills<br>Score <b>'+score+'</b> · Best depth '+best+'</p><button class="btn" id="rt">DESCEND AGAIN</button>';$('ov').classList.remove('hide');$('rt').onclick=newRun},900)}
function act(d){if(state!=='play')return;ac();let nx=P.x,ny=P.y;if(d<4){nx+=[0,1,0,-1][d];ny+=[-1,0,1,0][d];P.face=d===1?1:d===3?-1:P.face}
let acted=true;
if(d<4){if(map[ny][nx]===0){sfx.locked();return}
const e=entAt(nx,ny);
if(e){const dm=dmgB+(Math.random()<.15?1:0);e.hp-=dm;e.flash=.15;P.bump=.2;P.bx=nx-P.x;P.by=ny-P.y;sfx.hit();ftxt(nx,ny,'-'+dm,'#fff',14);burst(nx,ny,'#e8d6a0',6);if(e.hp<=0){kills++;sfx.kill();burst(nx,ny,'#ffd23f',12);if(Math.random()<.3)items.push({x:nx,y:ny,k:'coin'})}}
else if(map[ny][nx]===2&&!hasKey){sfx.locked();say('The stairs are sealed — find the 🗝 key!');return}
else{P.x=nx;P.y=ny;sfx.step()}}
turn++;
/* arrive effects */
const it=items.findIndex(i=>i.x===P.x&&i.y===P.y);if(it>=0){const i=items[it];items.splice(it,1);if(i.k==='coin'){coins++;sfx.coin();ftxt(P.x,P.y,'+1🪙','#ffd23f')}else if(i.k==='key'){hasKey=true;sfx.key();say('You found the key! Head for the stairs ⬇');ftxt(P.x,P.y,'🗝 KEY!','#ffd23f',16)}else if(i.k==='potion'){pots++;sfx.pick();ftxt(P.x,P.y,'🧪 potion','#9be7ff')}else if(i.k==='torch'){torch=40;sfx.pick();ftxt(P.x,P.y,'🔥 torch','#ffb05c');say('Torch lit: you see farther for 40 turns')}else if(i.k==='sword'){dmgB++;sfx.key();ftxt(P.x,P.y,'⚔ +1 dmg','#ffd23f',15);say('A sharper blade! Attack +1')}hud()}
if(map[P.y][P.x]===2&&hasKey){descend();return}
torch=Math.max(0,torch-1);
/* spikes + enemies */
for(const s of spikes)if(s.x===P.x&&s.y===P.y&&spikeUp(s)){sfx.spike();hurtP(1,'Impaled on the desert spikes.');if(state==='dead')return}
for(const e of ents){if(e.hp<=0)continue;if(e.t==='mum'&&turn%2===0)continue;
const dx=P.x-e.x,dy=P.y-e.y,dist=Math.abs(dx)+Math.abs(dy);if(dist===1){hurtP(e.t==='mum'?2:1,{skel:'Cut down by a skeleton.',scar:'Devoured by scarabs.',mum:'Crushed by a mummy.'}[e.t]);e.lunge=.2;e.lx=dx;e.ly=dy;if(state==='dead')return;continue}
let mx=0,my=0;if(dist<=7&&vis[e.y][e.x]||dist<=3){e.alert=true;const opts=Math.abs(dx)>=Math.abs(dy)?[[Math.sign(dx),0],[0,Math.sign(dy)]]:[[0,Math.sign(dy)],[Math.sign(dx),0]];for(const[ox,oy]of opts){if((ox||oy)&&map[e.y+oy][e.x+ox]!==0&&!entAt(e.x+ox,e.y+oy)&&!(e.x+ox===P.x&&e.y+oy===P.y)){mx=ox;my=oy;break}}}
else if(Math.random()<.4){const dd=[[1,0],[-1,0],[0,1],[0,-1]][ri(0,3)];if(map[e.y+dd[1]][e.x+dd[0]]===1&&!entAt(e.x+dd[0],e.y+dd[1])&&!(e.x+dd[0]===P.x&&e.y+dd[1]===P.y)){mx=dd[0];my=dd[1]}}
e.x+=mx;e.y+=my}
for(const e of ents){if(e.hp<=0)continue;const s=spikes.find(s=>s.x===e.x&&s.y===e.y&&spikeUp(s));if(s){e.hp-=1;e.flash=.15;sfx.spike();burst(e.x,e.y,'#ff6b6b',6);ftxt(e.x,e.y,'-1','#ffb0b0',12);if(e.hp<=0){kills++;sfx.kill();ftxt(e.x,e.y,'impaled!','#ffd23f',12)}}}
ents=ents.filter(e=>e.hp>0);
calcVis();hud()}
function usePotion(){if(state!=='play'||pots<1||P.hp>=P.mhp)return;ac();pots--;P.hp=Math.min(P.mhp,P.hp+2);sfx.potion();burst(P.x,P.y,'#7bff6a',14);ftxt(P.x,P.y,'+2❤','#7bff6a',15);hud();turn++;act5()}
function act5(){/* enemies move after potion */const keep=P.hp;const d=4;/* reuse wait */ stepEnemies()}
function stepEnemies(){for(const e of ents){if(e.hp<=0)continue;const dx=P.x-e.x,dy=P.y-e.y;if(Math.abs(dx)+Math.abs(dy)===1&&!(e.t==='mum'&&turn%2===0)){hurtP(e.t==='mum'?2:1,'Slain while drinking a potion.');if(state==='dead')return}}}
function descend(){sfx.stairs();depth++;emit('GAME_LEVEL_COMPLETED',{level:depth-1});if(depth>best){best=depth;try{localStorage.setItem('dd_best',best)}catch(e){}}if(depth%3===1&&P.mhp<8){P.mhp++;P.hp=Math.min(P.mhp,P.hp+2);say('Depth '+depth+' — max HP +1')}else{P.hp=Math.min(P.mhp,P.hp+1);say('Depth '+depth+' — the dungeon grows deadlier')}flash=.6;gen();hud()}
function newRun(){ac();depth=1;coins=0;kills=0;pots=0;dmgB=2;torch=0;P=null;gen();state='play';$('ov').classList.add('hide');say('Find the 🗝, then take the stairs ⬇');hud()}
/* ---------- render ---------- */
let cam={x:0,y:0};
function draw(dt){time+=dt;ctx.setTransform(dprR,0,0,dprR,0,0);ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
ctx.fillStyle='#0b0704';ctx.fillRect(-10,-10,W+20,H+20);if(!map){ctx.restore();return}
P.ax+=(P.x-P.ax)*Math.min(1,dt*16);P.ay+=(P.y-P.ay)*Math.min(1,dt*16);ents.forEach(e=>{e.ax+=(e.x-e.ax)*Math.min(1,dt*14);e.ay+=(e.y-e.ay)*Math.min(1,dt*14);e.flash=Math.max(0,e.flash-dt)});
cam.x=P.ax*T+T/2-W/2;cam.y=P.ay*T+T/2-H/2;cam.x=Math.max(0,Math.min(MW*T-W,cam.x));cam.y=Math.max(0,Math.min(MH*T-H,cam.y));
const x0=Math.floor(cam.x/T),y0=Math.floor(cam.y/T);
for(let y=y0;y<=y0+VH+1;y++)for(let x=x0;x<=x0+VW+1;x++){if(x<0||y<0||x>=MW||y>=MH||!seen[y][x])continue;const sx=x*T-cam.x,sy=y*T-cam.y,v=vis[y][x],t=map[y][x];
if(t===0){ctx.fillStyle=v?'#5a4128':'#2c2014';ctx.fillRect(sx,sy,T,T);ctx.fillStyle=v?'#7a5a38':'#3a2a1a';ctx.fillRect(sx,sy,T,T*.45);ctx.fillStyle='rgba(0,0,0,.2)';ctx.fillRect(sx,sy+T*.45,T,3);ctx.strokeStyle='rgba(0,0,0,.25)';ctx.strokeRect(sx+.5,sy+.5,T-1,T-1)}
else{ctx.fillStyle=((x+y)%2?'#d9bd86':'#d1b47c');ctx.fillRect(sx,sy,T,T);ctx.fillStyle='rgba(120,80,30,.12)';ctx.fillRect(sx+4+(x*7%9),sy+6+(y*5%11),6,2);if(t===2){ctx.fillStyle='#3a2a18';ctx.fillRect(sx+3,sy+3,T-6,T-6);for(let k=0;k<4;k++){ctx.fillStyle=hasKey?'#e8c878':'#5a4a30';ctx.fillRect(sx+6+k*3,sy+6+k*5,T-12-k*6,4)}if(!hasKey){ctx.fillStyle='#fff';ctx.font='13px "Apple Color Emoji","Segoe UI Emoji",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🔒',sx+T/2,sy+T/2)}}}
if(!v){ctx.fillStyle='rgba(8,5,2,.62)';ctx.fillRect(sx,sy,T,T)}}
/* spikes */
spikes.forEach(s=>{if(!seen[s.y][s.x])return;const sx=s.x*T-cam.x,sy=s.y*T-cam.y,up=spikeUp(s);ctx.fillStyle='#3a2a18';ctx.fillRect(sx+5,sy+5,T-10,T-10);for(let i=0;i<3;i++)for(let j=0;j<3;j++){const px=sx+9+i*7,py=sy+9+j*7;if(up){ctx.fillStyle='#e8e8f0';ctx.beginPath();ctx.moveTo(px-2.5,py+3);ctx.lineTo(px,py-6);ctx.lineTo(px+2.5,py+3);ctx.fill()}else{ctx.fillStyle='#6a5a48';ctx.fillRect(px-1.5,py,3,3)}}if(!vis[s.y][s.x]){ctx.fillStyle='rgba(8,5,2,.6)';ctx.fillRect(sx,sy,T,T)}});
