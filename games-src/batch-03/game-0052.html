<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ninja Hotseat Strategy Battle</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(#0f172a,#1e293b);font-family:Georgia,serif;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px;overflow-x:hidden}
h1{font-size:1.1rem;color:#f43f5e;padding:6px;letter-spacing:1px;text-align:center}
#hud{display:flex;gap:14px;font-size:.85rem;margin-bottom:6px;flex-wrap:wrap;justify-content:center}
#board{display:grid;gap:3px;background:#0f172a;padding:8px;border-radius:12px;border:2px solid #334155;touch-action:none}
.cell{width:42px;height:42px;border-radius:6px;background:#1e293b;display:flex;align-items:center;justify-content:center;font-size:1rem;cursor:pointer;position:relative}
@media(max-width:400px){.cell{width:34px;height:34px;font-size:.85rem}}
.cell.sel::after{content:'';position:absolute;inset:2px;border:2px dashed #fbbf24;border-radius:5px}
#tip{text-align:center;font-size:.82rem;color:#94a3b8;margin-top:8px;min-height:2.2em;padding:0 8px}
#ov{position:fixed;inset:0;background:rgba(15,23,42,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#e2e8f0;padding:20px;z-index:5}
button{background:#f43f5e;border:none;color:#fff;font-family:inherit;font-weight:700;padding:12px 32px;border-radius:24px;font-size:1rem;cursor:pointer;margin-top:14px}
</style>
</head>
<body>
<h1>🥷 NINJA HOTSEAT BATTLE</h1>
<div id="hud"><span style="color:#f43f5e">CLAN CRIMSON <b id="a1">0</b></span><span>Turn <b id="t">1</b></span><span style="color:#38bdf8">CLAN AZURE <b id="a2">0</b></span></div>
<div id="board"></div>
<div id="tip"></div>
<div id="ov"><h2 style="color:#f43f5e">SHADOW WAR</h2><p id="od">2-player hotseat tactics on a small grid! Ninjas strike adjacent enemies and capture their tile. Traps 💣 damage whoever steps in. Eliminate the rival clan to win!</p><button id="btn">DECLARE WAR</button></div>
<script>
"use strict";
const S=7;let grid,cur,sel,turn,playing;let nw=+localStorage.getItem('nb_w1')||0,nw2=+localStorage.getItem('nb_w2')||0;
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.08,t='sine'){if(!playing)return;const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=.09;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
function init(){grid=[];for(let i=0;i<S*S;i++)grid.push({o:0,trap:Math.random()<0.12});
// clear traps near spawns
[[0,0],[1,0],[0,1],[S-1,S-1],[S-2,S-1],[S-1,S-2]].forEach(([c,r])=>grid[r*S+c].trap=false);
grid[0]={o:1,hp:3,trap:false};grid[1]={o:1,hp:3,trap:false};grid[S]={o:1,hp:3,trap:false};
grid[S*S-1]={o:2,hp:3,trap:false};grid[S*S-2]={o:2,hp:3,trap:false};grid[S*S-1-S]={o:2,hp:3,trap:false};
cur=1;turn=1;sel=null;playing=true;document.getElementById('t').textContent=1;render();}
function neigh(i){const r=(i/S)|0,c=i%S,o=[];if(r>0)o.push(i-S);if(r<S-1)o.push(i+S);if(c>0)o.push(i-1);if(c<S-1)o.push(i+1);return o;}
function render(){const b=document.getElementById('board');b.style.gridTemplateColumns='repeat('+S+',42px)';b.innerHTML='';
grid.forEach((g,i)=>{const c=document.createElement('div');c.className='cell'+(sel===i?' sel':'');
c.style.background=g.o===1?'#4c0519':g.o===2?'#082f49':'#1e293b';
c.innerHTML=(g.o?('🥷'+g.hp):'')+(g.trap&&g.revealed?'💣':'');
c.onclick=()=>tap(i);b.appendChild(c);});
document.getElementById('a1').textContent=grid.filter(g=>g.o===1).reduce((a,g)=>a+g.hp,0);
document.getElementById('a2').textContent=grid.filter(g=>g.o===2).reduce((a,g)=>a+g.hp,0);
document.getElementById('tip').textContent=playing?(cur===1?'🔴 CRIMSON':'🔵 AZURE')+' — tap a ninja, then an adjacent tile to move or strike.':'Battle over.';}
function tap(i){if(!playing)return;const g=grid[i];
if(g.o===cur){sel=i;beep(600,.05);render();return;}
if(sel!==null&&neigh(sel).includes(i)){
const mover=grid[sel];
if(g.o&&g.o!==cur){ // strike
g.hp--;mover.hp-=1;beep(220,.1,'sawtooth');
if(g.hp<=0){grid[i]={o:0,trap:g.trap,revealed:g.revealed};}
if(mover.hp<=0)grid[sel]={o:0,trap:mover.trap,revealed:mover.revealed};
}
else if(!g.o){ // move
grid[i]={o:cur,hp:mover.hp,trap:g.trap,revealed:g.revealed};
if(g.trap&&!g.revealed){grid[i].revealed=true;grid[i].hp-=2;beep(140,.2,'sawtooth');
if(grid[i].hp<=0)grid[i]={o:0,trap:true,revealed:true};}
grid[sel]={o:0,trap:grid[sel].trap,revealed:grid[sel].revealed};}
sel=null;render();check();if(playing){cur=cur===1?2:1;if(cur===1){turn++;document.getElementById('t').textContent=turn;render();}}}
else{sel=null;render();}}
function check(){const a=grid.some(g=>g.o===1),b=grid.some(g=>g.o===2);
if(!a||!b){playing=false;
localStorage.setItem('nb_w'+(a?1:2),(a?nw:nw2)+1);
document.getElementById('od').innerHTML='🏆 <b style="color:#fde047">'+(a?'CLAN CRIMSON':'CLAN AZURE')+' ERASES THE RIVAL!</b><br>in '+turn+' turns';
document.getElementById('btn').textContent='NEW WAR';document.getElementById('ov').style.display='flex';beep(880,.3,'triangle');}}
window.addEventListener('keydown',e=>{if(!playing)return;const k=e.key;
if(k==='ArrowUp'||k==='ArrowDown'||k==='ArrowLeft'||k==='ArrowRight'||k==='Enter'||k===' '){
e.preventDefault();
const own=grid.map((g,i)=>g.o===cur?i:-1).filter(i=>i>=0);
if(!own.length)return;
if(k==='Enter'||k===' '){if(sel!==null)tap(sel);else{sel=own[0];render();}return;}
sel=sel===null?own[0]:sel;
const r=(sel/S)|0,c=sel%S;
if(k==='ArrowUp'&&r>0)sel-=S;if(k==='ArrowDown'&&r<S-1)sel+=S;
if(k==='ArrowLeft'&&c>0)sel--;if(k==='ArrowRight'&&c<S-1)sel++;
if(grid[sel].o!==cur)sel=own[0];
render();}});
document.getElementById('btn').onclick=()=>{audio.resume();init();document.getElementById('ov').style.display='none';};
</script>
</body>
</html>
