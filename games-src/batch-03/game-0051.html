<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Watercolor Tales</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#faf5ff;font-family:Georgia,serif;color:#581c87;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden}
h1{font-size:1.1rem;color:#7e22ce;padding:6px}
#hud{display:flex;gap:14px;font-size:.9rem;margin-bottom:4px}
canvas{border-radius:12px;touch-action:none;box-shadow:0 8px 30px rgba(126,34,206,.15)}
#ov{position:fixed;inset:0;background:rgba(250,245,255,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#581c87;padding:20px;z-index:5}
button{background:#a855f7;border:none;color:#fff;font-weight:700;padding:12px 32px;border-radius:24px;font-size:1rem;cursor:pointer;margin-top:14px;font-family:inherit}
</style>
</head>
<body>
<h1>🖌️ WATERCOLOR TALES</h1>
<div id="hud"><span>Story <b id="p">1</b></span><span>Pigment <b id="pg">0</b></span><span>❤️ <b id="h">3</b></span><span>Best <b id="b">0</b></span></div>
<canvas id="c"></canvas>
<div id="ov"><h2 style="color:#7e22ce">WATERCOLOR TALES</h2><p id="od">Paint the tale! Catch falling pigment drops 🎨 to complete each story panel, but dodge the muddy blots 🟤. Fill the palette bar to turn the page. 8 pages make the book!</p><button id="btn">OPEN THE BOOK</button></div>
<script>
"use strict";
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');const W=420,H=480;cvs.width=W;cvs.height=H;
const PALS=['#a855f7','#ec4899','#f97316','#eab308','#22c55e','#0ea5e9'];
let me,drops,page,pigment,hp,playing,keys,best=+localStorage.getItem('wt_best')||0;
document.getElementById('b').textContent=best;
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.07,t='sine'){if(!playing)return;const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=.09;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
function resize(){const s=Math.min((window.innerWidth-12)/W,(window.innerHeight-140)/H);cvs.style.width=W*s+'px';cvs.style.height=H*s+'px';}
window.addEventListener('resize',resize);resize();
function init(){me={x:W/2,y:H-56,w:56};drops=[];page=1;pigment=0;hp=3;keys={};playing=true;
document.getElementById('p').textContent=1;document.getElementById('pg').textContent=0;document.getElementById('h').textContent=3;}
window.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let drag=null;
cvs.addEventListener('pointerdown',e=>{audio.resume();const r=cvs.getBoundingClientRect();drag=(e.clientX-r.left)/r.width*W;});
cvs.addEventListener('pointermove',e=>{if(drag===null)return;const r=cvs.getBoundingClientRect();drag=(e.clientX-r.left)/r.width*W;});
window.addEventListener('pointerup',()=>drag=null);
function step(){if(keys['arrowleft']||keys['a'])me.x-=5.4;if(keys['arrowright']||keys['d'])me.x+=5.4;
if(drag!==null)me.x=drag;
me.x=Math.max(me.w/2,Math.min(W-me.w/2,me.x));
if(Math.random()<0.028+page*0.003){const bad=Math.random()<0.28;
drops.push({x:14+Math.random()*(W-28),y:-12,vy:2+page*0.25,bad,c:bad?'#78716c':PALS[(Math.random()*PALS.length)|0]});}
drops.forEach(d=>{d.y+=d.vy;
if(d.y>H-64&&Math.abs(d.x-me.x)<me.w/2+8){
if(d.bad){hp--;document.getElementById('h').textContent=hp;beep(140,.2,'sawtooth');}
else{pigment++;document.getElementById('pg').textContent=pigment;beep(600+pigment*15,.06,'triangle');}
drops.splice(drops.indexOf(d),1);
if(hp<=0)return over();
if(pigment>=12*page)return nextPage();}});
drops=drops.filter(d=>d.y<H+14);}
function nextPage(){page++;drops=[];
if(page>8){win();return;}
beep(880,.15,'triangle');setTimeout(()=>beep(1100,.15,'triangle'),140);
document.getElementById('p').textContent=page;}
function win(){playing=false;if(pigment>best){best=pigment;localStorage.setItem('wt_best',best);document.getElementById('b').textContent=best;}
document.getElementById('od').innerHTML='📖 <b style="color:#7e22ce">THE TALE IS COMPLETE!</b><br>All 8 pages painted with '+pigment+' drops of pigment.';
document.getElementById('btn').textContent='NEW TALE';document.getElementById('ov').style.display='flex';}
function over(){playing=false;if(pigment>best){best=pigment;localStorage.setItem('wt_best',best);document.getElementById('b').textContent=best;}
document.getElementById('od').innerHTML='A muddy blot ruined the page…<br>Story reached: page '+page+' · pigment '+pigment;
document.getElementById('btn').textContent='REWRITE';document.getElementById('ov').style.display='flex';}
function draw(){ctx.fillStyle='#faf5ff';ctx.fillRect(0,0,W,H);
for(let i=0;i<6;i++){const g2=ctx.createRadialGradient((i*173)%W,(i*97)%H,4,(i*173)%W,(i*97)%H,60);
g2.addColorStop(0,PALS[i%6]+'1e');g2.addColorStop(1,'transparent');ctx.fillStyle=g2;ctx.fillRect(0,0,W,H);}
drops.forEach(d=>{ctx.fillStyle=d.c;ctx.globalAlpha=.9;ctx.beginPath();ctx.ellipse(d.x,d.y,7,9,0,0,7);ctx.fill();ctx.globalAlpha=1;});
// brush
ctx.fillStyle='#7c3aed';ctx.fillRect(me.x-me.w/2,me.y,me.w,10);ctx.fillStyle='#c084fc';ctx.fillRect(me.x-me.w/2,me.y,me.w,3);
ctx.fillStyle='#ddd6fe';ctx.beginPath();ctx.moveTo(me.x-8,me.y);ctx.lineTo(me.x+8,me.y);ctx.lineTo(me.x,me.y-14);ctx.fill();
// palette bar
ctx.fillStyle='#ede9fe';ctx.fillRect(10,10,W-20,12);
ctx.fillStyle='#a855f7';ctx.fillRect(10,10,(W-20)*Math.min(1,pigment/(12*page)),12);
ctx.strokeStyle='#7c3aed';ctx.strokeRect(10,10,W-20,12);}
function loop(){if(playing){step();draw();}requestAnimationFrame(loop);}
document.getElementById('btn').onclick=()=>{audio.resume();init();document.getElementById('ov').style.display='none';};
loop();
</script>
</body>
</html>
