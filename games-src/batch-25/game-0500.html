<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Royal Crown Finale #0500</title><style>
body{margin:0;font-family:system-ui;background:#111827;color:#f9fafb;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#9ca3af;font-size:.78rem}
canvas{background:#1f2937;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#facc15}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#facc15;color:#111827;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>Royal Crown Finale</h1><div class="sub">Assemble the crown — place each jewel in its matching slot!</div>
<div id="hud"><span>Placed <b id="p">0</b>/6</span><span>⏱️ <b id="t">60</b>s</span></div>
<canvas id="cv" width="400" height="380"></canvas>
<div id="ov"><div style="font-size:3rem">👑</div><p>Drag each jewel to its matching slot!</p><button id="btn">Start</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
function msg(t){document.getElementById('msg').textContent=t;}
function end(w){if(!playing)return;playing=false;beep(w?880:130,.3,w?'triangle':'sawtooth');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML=w?WIN[0]:LOSE[0];}
const WIN=['🏆 Victory!'];const LOSE=['💥 Game over!'];
const W=400,H=380;const JEWELS=[['❤️','#dc2626'],['💙','#3b82f6'],['💚','#22c55e'],['💛','#eab308'],['💜','#a855f7'],['🧡','#f97316']];
let jewels=[],slots=[],placed=0,playing=false,time=60,timer=null,drag=null;
function gen(){jewels=[];slots=[];placed=0;playing=true;time=60;drag=null;
document.getElementById('p').textContent=0;document.getElementById('t').textContent=60;
JEWELS.forEach(([e,c],i)=>{const a=Math.PI*(0.15+0.7*i/5);
slots.push({x:W/2+Math.cos(a)*120,y:120+Math.sin(a)*-70,i});
jewels.push({x:50+Math.random()*300,y:200+Math.random()*140,i,e});});
AU.__c=new (window.AudioContext||window.webkitAudioContext)();
clearInterval(timer);timer=setInterval(()=>{time--;document.getElementById('t').textContent=time;
if(time<=0){playing=false;clearInterval(timer);
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='👑 '+placed+'/6 jewels placed!';}},1000);draw();}
cvs.addEventListener('pointerdown',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
drag=jewels.find(j=>Math.hypot(j.x-x,j.y-y)<18&&!j.placed);
if(drag)beep(400,.05);});
cvs.addEventListener('pointermove',e=>{if(!drag)return;const r=cvs.getBoundingClientRect();
drag.x=(e.clientX-r.left)*W/r.width;drag.y=(e.clientY-r.top)*H/r.height;draw();});
cvs.addEventListener('pointerup',()=>{if(!drag)return;
const s=slots.find(s=>Math.hypot(s.x-drag.x,s.y-drag.y)<22);
if(s&&s.i===drag.i){drag.placed=true;drag.x=s.x;drag.y=s.y;placed++;
document.getElementById('p').textContent=placed;
beep(600+placed*80,.12,'triangle');
if(placed>=6){playing=false;clearInterval(timer);beep(880,.4,'triangle');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='👑 THE CROWN IS COMPLETE! Game #500!';}}
else{beep(150,.1,'sawtooth');}
drag=null;draw();});
function draw(){ctx.fillStyle='#1f2937';ctx.fillRect(0,0,W,H);
// crown base
ctx.fillStyle='#7c3aed';
ctx.beginPath();ctx.moveTo(W/2-130,120);ctx.lineTo(W/2,60);ctx.lineTo(W/2+130,120);
ctx.lineTo(W/2+100,120);ctx.lineTo(W/2,75);ctx.lineTo(W/2-100,120);ctx.fill();
slots.forEach(s=>{const j=jewels.find(j=>j.i===s.i&&j.placed);
ctx.beginPath();ctx.arc(s.x,s.y,14,0,7);
ctx.strokeStyle=JEWELS[s.i][1];ctx.lineWidth=2;ctx.stroke();ctx.lineWidth=1;});
jewels.forEach(j=>{ctx.font='22px serif';ctx.textAlign='center';
ctx.globalAlpha=j.placed?1:0.9;
ctx.fillText(JEWELS[j.i][0],j.x,j.y+8);ctx.globalAlpha=1;});
if(playing)requestAnimationFrame(draw);}
</script><div id="msg"></div>
<script>document.getElementById('btn').addEventListener('click',function(){document.getElementById('ov').style.display='none';gen();});</script>
</body></html>
