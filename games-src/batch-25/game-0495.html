<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haunted Grave Dig #0495</title><style>
body{margin:0;font-family:system-ui;background:#111827;color:#f9fafb;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#9ca3af;font-size:.78rem}
canvas{background:#1f2937;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#facc15}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#facc15;color:#111827;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>Haunted Grave Dig</h1><div class="sub">Dig up bones — but cursed soil drains your health. The map hints where!</div>
<div id="hud"><span>❤️ <b id="h">10</b></span><span>Bones <b id="bo">0</b></span><span>⏱️ <b id="t">40</b>s</span></div>
<canvas id="cv" width="400" height="380"></canvas>
<div id="ov"><div style="font-size:3rem">🦴</div><p>Tap to dig — bones good, cursed spots bad!</p><button id="btn">Start</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
function msg(t){document.getElementById('msg').textContent=t;}
function end(w){if(!playing)return;playing=false;beep(w?880:130,.3,w?'triangle':'sawtooth');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML=w?WIN[0]:LOSE[0];}
const WIN=['🏆 Victory!'];const LOSE=['💥 Game over!'];
const N=6,CELL=64;let cells=[],hp=10,bones=0,playing=false,time=40,timer=null,flash=[];
function gen(){cells=[];hp=10;bones=0;playing=true;time=40;flash=[];
document.getElementById('h').textContent=10;document.getElementById('bo').textContent=0;document.getElementById('t').textContent=40;
for(let r=0;r<N;r++){const row=[];for(let c=0;c<N;c++)row.push(Math.random()<0.22?'curse':Math.random()<0.35?'bone':'empty');cells.push(row);}
AU.__c=new (window.AudioContext||window.webkitAudioContext)();
clearInterval(timer);timer=setInterval(()=>{time--;document.getElementById('t').textContent=time;
if(time<=0){playing=false;clearInterval(timer);beep(880,.3,'triangle');
msg('🌅 Dig over! Bones: '+bones);}},1000);render();}
function tap(r,c){if(!playing)return;const cell=cells[r][c];
if(cell==='dug')return;
if(cell==='curse'){hp-=2;document.getElementById('h').textContent=Math.max(0,hp);
beep(150,.2,'sawtooth');flash.push({r,c,a:1});
if(hp<=0){playing=false;clearInterval(timer);end(false);return;}}
else if(cell==='bone'){bones++;document.getElementById('bo').textContent=bones;
beep(600,.1,'triangle');}
else beep(300,.04);
cells[r][c]='dug';render();}
function render(){const g=document.getElementById('cv');ctx.fillStyle='#1f2937';ctx.fillRect(0,0,N*CELL+20,N*CELL+20);
for(let r=0;r<N;r++)for(let c=0;c<N;c++){const x=20+c*CELL,y=20+r*CELL;
ctx.fillStyle='#312e81';ctx.fillRect(x,y,CELL-4,CELL-4);
const cell=cells[r][c];
ctx.font='26px serif';ctx.textAlign='center';
if(cell==='dug'){ctx.fillText(cells&&cell==='dug'?(cell==='dug'&&flash.some(f=>f.r===r&&f.c===c)?'💀':'🕳️'):'',x+CELL/2,y+CELL/2+10);
if(flash.some(f=>f.r===r&&f.c===c))ctx.fillText('💀',x+CELL/2,y+CELL/2+10);}
else{ctx.fillText('❓',x+CELL/2,y+CELL/2+10);}}
flash.forEach(f=>f.a-=0.02);flash=flash.filter(f=>a=>a>0);}
</script><div id="msg"></div>
<script>document.getElementById('btn').addEventListener('click',function(){document.getElementById('ov').style.display='none';gen();});</script>
</body></html>
