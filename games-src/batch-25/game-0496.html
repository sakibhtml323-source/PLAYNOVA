<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Royal Coin Sort #0496</title><style>
body{margin:0;font-family:system-ui;background:#111827;color:#f9fafb;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#9ca3af;font-size:.78rem}
canvas{background:#1f2937;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#facc15}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#facc15;color:#111827;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>Royal Coin Sort</h1><div class="sub">Sort the treasure — drag each coin to its matching chest!</div>
<div id="hud"><span>Sorted <b id="s">0</b>/<b id="st">0</b></span><span>⏱️ <b id="t">45</b>s</span></div>
<canvas id="cv" width="400" height="380"></canvas>
<div id="ov"><div style="font-size:3rem">🪙</div><p>Tap a coin, then tap its matching chest!</p><button id="btn">Start</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
function msg(t){document.getElementById('msg').textContent=t;}
function end(w){if(!playing)return;playing=false;beep(w?880:130,.3,w?'triangle':'sawtooth');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML=w?WIN[0]:LOSE[0];}
const WIN=['🏆 Victory!'];const LOSE=['💥 Game over!'];
const W=400,H=380;const COINS=[['🥇','Gold'],['🥈','Silver'],['🥉','Bronze']];
let coins=[],chests=[],sel=null,sorted=0,playing=false,time=45,timer=null;
function gen(){coins=[];chests=[];sel=null;sorted=0;playing=true;time=45;
document.getElementById('t').textContent=45;
for(let i=0;i<3;i++){chests.push({x:70+i*130,y:H-60,type:i});}
for(let i=0;i<9;i++){coins.push({x:40+Math.random()*320,y:60+Math.random()*200,
type:(Math.random()*3)|0});}
document.getElementById('s').textContent=0;document.getElementById('st').textContent=9;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();
clearInterval(timer);timer=setInterval(()=>{time--;document.getElementById('t').textContent=time;
if(time<=0){playing=false;clearInterval(timer);beep(880,.3,'triangle');
msg('🏦 Vault closes! Sorted: '+sorted+'/9');}},1000);draw();}
cvs.addEventListener('pointerdown',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
if(sel===null){const c=coins.find(c=>Math.hypot(c.x-x,c.y-y)<20);
if(c){sel=c;beep(400,.06);}return;}
const ch=chests.find(ch=>Math.hypot(ch.x-x,ch.y-y)<40);
if(ch){if(ch.type===sel.type){coins=coins.filter(c=>c!==sel);sorted++;
document.getElementById('s').textContent=sorted;beep(700,.1,'triangle');
if(sorted>=9){playing=false;clearInterval(timer);end(true);}}
else{beep(150,.15,'sawtooth');}
sel=null;draw();}});
function draw(){ctx.fillStyle='#1f2937';ctx.fillRect(0,0,W,H);
chests.forEach(ch=>{ctx.fillStyle='#7c3aed';ctx.fillRect(ch.x-34,ch.y-24,68,44);
ctx.font='24px serif';ctx.textAlign='center';ctx.fillText(['🥇','🥈','🥉'][ch.type],ch.x,ch.y+8);});
coins.forEach(c=>{ctx.globalAlpha=c===sel?1:0.85;
ctx.fillText(['🥇','🥈','🥉'][c.type],c.x,c.y+6);ctx.globalAlpha=1;
if(c===sel){ctx.strokeStyle='#facc15';ctx.beginPath();ctx.arc(c.x,c.y,16,0,7);ctx.stroke();}});}
</script><div id="msg"></div>
<script>document.getElementById('btn').addEventListener('click',function(){document.getElementById('ov').style.display='none';gen();});</script>
</body></html>
