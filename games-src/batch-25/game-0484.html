<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haunted Attic Drop #484</title><style>
body{margin:0;font-family:system-ui;background:#18181b;color:#fafafa;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a1a1aa;font-size:.78rem}
canvas{background:#27272a;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#facc15}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#7c3aed;color:#fff;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>📦 Haunted Attic Drop</h1><div class="sub">The chest slides back and forth — drop the items in. Beat the ghost's speed!</div>
<div id="hud"><span>In <b id="i">0</b>/8</span><span>Missed <b id="m">0</b>/3</span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="400" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">🧸</div><p>Tap to drop the item into the sliding chest.<br>8 items — don't miss 3!</p><button id="btn">Drop</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=400,H=400;let chest={x:W/2,sp:3},item={y:40},dropping=false,inCount=0,missed=0,playing=false,best=0,items=['🧸','📕','🏺','🎩','🪞','🕰️','🧣','🎁'];
document.getElementById('b').textContent=best;
cvs.addEventListener('pointerdown',()=>{if(!playing||dropping)return;dropping=true;});
function gen(){chest={x:W/2,sp:2.5};inCount=0;missed=0;playing=true;dropping=false;
document.getElementById('i').textContent=0;document.getElementById('m').textContent=0;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();msg('Tap to drop!');}
function step(){chest.x+=chest.sp;
if(chest.x<W/2-130||chest.x>W/2+130)chest.sp*=-1;
if(dropping){item.y+=6;
if(item.y>=H-70){
dropping=false;
if(Math.abs(item.x-chest.x)<40){inCount++;document.getElementById('i').textContent=inCount;
beep(600+inCount*40,.1,'triangle');
if(inCount>=8){playing=false;beep(880,.3,'triangle');
if(inCount>best){best=inCount;document.getElementById('b').textContent=best;}
msg('🎉 Attic organized!');return;}
chest.sp=2.5+inCount*0.4;item={y:40,x:W/2};}
else{missed++;document.getElementById('m').textContent=missed;
beep(150,.15,'sawtooth');
if(missed>=3){playing=false;
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='👻 The ghost tidies first!<br>In: '+inCount+'/8';return;}
item={y:40,x:W/2};}}}}
function msg(t){const el=document.createElement('div');
el.style.cssText='position:fixed;bottom:60px;left:50%;transform:translateX(-50%);color:#facc15;font-weight:700';
el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),1500);}
function draw(){ctx.fillStyle='#27272a';ctx.fillRect(0,0,W,H);
// chest
ctx.fillStyle='#7c3aed';ctx.fillRect(chest.x-44,H-60,88,40);
ctx.strokeStyle='#a78bfa';ctx.strokeRect(chest.x-44,H-60,88,40);
ctx.font='20px serif';ctx.textAlign='center';ctx.fillText('🧰',chest.x,H-34);
// item
if(!dropping)item.x=W/2;
ctx.font='30px serif';ctx.fillText(items[Math.min(inCount,7)],item.x||W/2,item.y);
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{gen();
document.getElementById('ov').style.display='none';};
</script></body></html>
