<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Royal Crown Slide #0492</title><style>
body{margin:0;font-family:system-ui;background:#111827;color:#f9fafb;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#9ca3af;font-size:.78rem}
canvas{background:#1f2937;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#facc15}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#facc15;color:#111827;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>Royal Crown Slide</h1><div class="sub">TWO crowns slide in OPPOSITE directions — both must reach their thrones!</div>
<div id="hud"><span>Moves <b id="m">0</b></span><span>Best <b id="b">0</b></span><span>Level <b id="l">1</b></span></div>
<canvas id="cv" width="400" height="380"></canvas>
<div id="ov"><div style="font-size:3rem">👑</div><p>Tap an arrow direction — the crown slides!</p><button id="btn">Start</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
function msg(t){document.getElementById('msg').textContent=t;}
function end(w){if(!playing)return;playing=false;beep(w?880:130,.3,w?'triangle':'sawtooth');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML=w?WIN[0]:LOSE[0];}
const WIN=['🏆 Victory!'];const LOSE=['💥 Game over!'];
const W=400,N=6,CELL=W/N;let grid=[],me={r:0,c:0},me2={r:5,c:5},goal={r:5,c:5},moves=0,level=1,playing=true,best=999;
function gen(){grid=[];me={r:0,c:0};me2={r:5,c:5};goal={r:5,c:5};moves=0;playing=true;
for(let r=0;r<N;r++){const row=[];for(let c=0;c<N;c++)row.push(0);grid.push(row);}
const nw=4+level;
for(let i=0;i<nw;i++){const r=(Math.random()*N)|0,c=(Math.random()*N)|0;
if((r===0&&c===0)||(r===5&&c===5)||(r===0&&c===5)||(r===5&&c===0))continue;grid[r][c]=1;}
grid[0][0]=0;grid[5][5]=0;grid[0][5]=0;grid[5][0]=0;
document.getElementById('l').textContent=level;document.getElementById('m').textContent=0;draw();}
cvs.addEventListener('pointerdown',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*W/r.height;
const dx=x-(me.c*CELL+CELL/2),dy=y-(me.r*CELL+CELL/2);
if(Math.abs(dx)>Math.abs(dy))slide(dx>0?1:-1,0);else slide(0,dy>0?1:-1);});
function slide(dr,dc){let st=0;
[[me,dr,dc],[me2,-dr,-dc]].forEach(([m,ddr,ddc])=>{
let r=m.r,c=m.c;
while(true){const nr=r+ddr,nc=c+ddc;
if(nr<0||nr>=N||nc<0||nc>=N)break;if(grid[nr][nc])break;
r=nr;c=nc;st++;break;}
m.r=r;m.c=c;});
if(!st){beep(160,.06,'sawtooth');return;}
moves++;document.getElementById('m').textContent=moves;
beep(400+st*40,.08);draw();
if(me.r===goal.r&&me.c===goal.c&&me2.r===0&&me2.c===0){playing=false;beep(880,.3,'triangle');
if(moves<best){best=moves;document.getElementById('b').textContent=best;}
msg('👑👑 Both delivered in '+moves+'! Level '+(level+1));level++;
setTimeout(gen,1000);}}
function draw(){ctx.fillStyle='#1f2937';ctx.fillRect(0,0,W,W);
for(let r=0;r<N;r++)for(let c=0;c<N;c++){const x=c*CELL+3,y=r*CELL+3;
ctx.fillStyle=grid[r][c]?'#0a0a0a':'#312e81';ctx.fillRect(x,y,CELL-6,CELL-6);
if(r===me.r&&c===me.c){ctx.font='28px serif';ctx.textAlign='center';ctx.fillText('👑',x+CELL/2,y+CELL/2+10);}
else if(r===me2.r&&c===me2.c){ctx.font='28px serif';ctx.textAlign='center';ctx.fillText('🫅',x+CELL/2,y+CELL/2+10);}
else if((r===5&&c===5)||(r===0&&c===0)){ctx.fillText('🪑',x+CELL/2,y+CELL/2+10);}
else if(grid[r][c]){ctx.fillText('🧱',x+CELL/2,y+CELL/2+10);}}}
</script><div id="msg"></div>
<script>document.getElementById('btn').addEventListener('click',function(){document.getElementById('ov').style.display='none';gen();});</script>
</body></html>
