<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Sand Timer Duel #0498</title><style>
body{margin:0;font-family:system-ui;background:#111827;color:#f9fafb;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#9ca3af;font-size:.78rem}
canvas{background:#1f2937;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#facc15}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#facc15;color:#111827;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>Desert Sand Timer Duel</h1><div class="sub">Flip your timer faster than the ghost flips theirs — first to empty the opponent wins!</div>
<div id="hud"><span>You <b id="y">50</b></span><span>👻 <b id="g">50</b></span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="400" height="380"></canvas>
<div id="ov"><div style="font-size:3rem">⏳</div><p>Tap to flip your sand — drain the ghost first!</p><button id="btn">Start</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
function msg(t){document.getElementById('msg').textContent=t;}
function end(w){if(!playing)return;playing=false;beep(w?880:130,.3,w?'triangle':'sawtooth');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML=w?WIN[0]:LOSE[0];}
const WIN=['🏆 Victory!'];const LOSE=['💥 Game over!'];
const W=400,H=380;let you=50,ghost=50,yFlip=false,gFlip=false,playing=false,wins=0,best=0,timer=null;
cvs.addEventListener('pointerdown',()=>{if(!playing)return;yFlip=!yFlip;beep(500,.07);});
function gen(){you=50;ghost=50;yFlip=false;gFlip=false;playing=true;
document.getElementById('y').textContent=50;document.getElementById('g').textContent=50;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();
clearInterval(timer);timer=setInterval(()=>{
const yr=yFlip?-1.2:1.2,gr=gFlip?-1:1;
you=Math.max(0,Math.min(100,you+yr));
ghost=Math.max(0,Math.min(100,ghost+gr));
// ghost AI flips to chase balance
if(ghost<25)gFlip=true;if(ghost>75)gFlip=false;
if(Math.random()<0.03)gFlip=!gFlip;
document.getElementById('y').textContent=Math.round(you);
document.getElementById('g').textContent=Math.round(ghost);
if(you<=0){playing=false;clearInterval(timer);beep(130,.3,'sawtooth');
msg('⏳ Your time runs out!');return;}
if(ghost<=0){playing=false;clearInterval(timer);wins++;beep(880,.3,'triangle');
msg('👻 The ghost empties first! Wins: '+wins);}},100);draw();}
function draw(){ctx.fillStyle='#1f2937';ctx.fillRect(0,0,W,H);
[[you,'You',W/4],[ghost,'👻',3*W/4]].forEach(([v,who,x])=>{
ctx.fillStyle='#312e81';ctx.fillRect(x-40,60,80,260);
ctx.fillStyle=who==='You'?'#38bdf8':'#a78bfa';
const h=v/100*240;
ctx.fillRect(x-32,60+240-h+10,64,h);
ctx.font='16px system-ui';ctx.textAlign='center';ctx.fillText(who,x,340);});
if(playing)requestAnimationFrame(draw);}
function msg(t){const el=document.createElement('div');
el.style.cssText='position:fixed;bottom:60px;left:50%;transform:translateX(-50%);color:#facc15;font-weight:700';
el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),1600);}
</script><div id="msg"></div>
<script>document.getElementById('btn').addEventListener('click',function(){document.getElementById('ov').style.display='none';gen();});</script>
</body></html>
