<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Sun Race #482</title><style>
body{margin:0;font-family:system-ui;background:#451a03;color:#fef3c7;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#fde68a;font-size:.78rem}
canvas{background:#78350f;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#451a03;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🏃 Desert Sun Race</h1><div class="sub">Race to the oasis before the sun sets — tap to sprint, but stamina is limited!</div>
<div id="hud"><span>Dist <b id="d">0</b>m</span><span>Sun <b id="s">☀️</b></span><span>Stamina <b id="st">100</b></span></div>
<canvas id="cv" width="440" height="320"></canvas>
<div id="ov"><div style="font-size:3rem">🏝️</div><p>Tap to sprint — the sun sinks steadily!<br>Reach the oasis (800m) before dark.</p><button id="btn">Race</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=320,GOAL=800;let dist=0,stam=100,sun=0,playing=false,lastTap=0;
cvs.addEventListener('pointerdown',()=>{if(!playing)return;
const now=Date.now();
if(now-lastTap>220&&stam>5){dist+=9;stam=Math.max(0,stam-8);beep(500,.06);}
lastTap=now;});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&playing&&stam>5){dist+=9;stam=Math.max(0,stam-8);beep(500,.06);}});
function step(){sun+=0.016;
dist+=0.35;stam=Math.min(100,stam+0.9);
document.getElementById('d').textContent=Math.floor(dist);
document.getElementById('st').textContent=Math.round(stam);
const icons=['☀️','🌤️','⛅','🌥️','🌇','🌆','🌃'];
document.getElementById('s').textContent=icons[Math.min(6,Math.floor(sun/0.16))];
if(dist>=GOAL){playing=false;beep(880,.3,'triangle');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🏝️ Made it with daylight to spare!';}
else if(sun>=1.05){playing=false;beep(130,.35,'sawtooth');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🌌 Night falls… '+Math.floor(dist)+'m of '+GOAL+'m';}}
function draw(){ctx.fillStyle='#78350f';ctx.fillRect(0,0,W,H);
// sun arc
const sunA=Math.PI*(0.1+sun*0.8);
const sx=Math.cos(sunA)*-1*(W/2)+W/2,sy=H-Math.sin(sunA)*H*0.8;
ctx.font='34px serif';ctx.textAlign='center';ctx.fillText('☀️',sx,sy+10);
// sky darkens
ctx.fillStyle='rgba(10,10,30,'+(sun*0.6)+')';ctx.fillRect(0,0,W,H);
// ground
ctx.fillStyle='#92400e';ctx.fillRect(0,H-50,W,50);
// runner & oasis
const rx=40+(dist/GOAL)*(W-100);
ctx.font='28px serif';ctx.fillText('🏃',rx,H-20);
ctx.fillText('🏝️',W-30,H-24);
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{dist=0;stam=100;sun=0;playing=true;
document.getElementById('d').textContent=0;document.getElementById('st').textContent=100;
document.getElementById('ov').style.display='none';
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();};
</script></body></html>
