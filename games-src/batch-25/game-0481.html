<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ninja Smoke Maze #481</title><style>
body{margin:0;font-family:system-ui;background:#111827;color:#f9fafb;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#9ca3af;font-size:.78rem}
#grid{display:grid;grid-template-columns:repeat(7,44px);gap:2px;margin:12px}
.c{width:44px;height:44px;background:#1f2937;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px}
.c.wall{background:#0a0a0a}
.c.trail{background:#374151}
.c.me{background:#7c3aed;outline:2px solid #facc15}
.c.goal{background:#14532d}
#hud{display:flex;gap:14px;font-size:.9rem;margin:4px}#hud b{color:#facc15}
#msg{min-height:1.3em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#facc15;color:#111827;font-weight:700;cursor:pointer;margin:8px}
</style></head><body>
<h1>💨 Ninja Smoke Maze</h1><div class="sub">Your smoke trail fades fast — memorize the maze before the path disappears!</div>
<div id="hud"><span>Level <b id="l">1</b></span><span>Steps <b id="s">0</b></span><span>Trail <b id="tr">5</b></span></div>
<div id="grid"></div><div id="msg"></div>
<button id="btn">🥷 New Smoke</button>
<audio id="au"></audio>
<script>
"use strict";
const AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const N=7;let grid=[],me={r:0,c:0},goal={r:6,c:6},trail=[],steps=0,level=1,playing=true;
function gen(){grid=[];me={r:0,c:0};goal={r:6,c:6};trail=[];steps=0;playing=true;
for(let r=0;r<N;r++){const row=[];for(let c=0;c<N;c++)row.push(r%2===0&&c%2===0&&Math.random()<0.42?1:0);grid.push(row);}
for(let i=0;i<N;i++){grid[0][i]=0;grid[N-1][i]=0;grid[i][0]=0;grid[i][N-1]=0;}
grid[0][0]=0;grid[6][6]=0;
// ensure path
let pr=0,pc=0;grid[0][0]=0;
while(pr<6||pc<6){if(pr<6&&(pc>=6||Math.random()<0.5))pr++;else pc++;grid[pr][pc]=0;}
document.getElementById('l').textContent=level;
document.getElementById('s').textContent=0;
render();msg('Memorize the walls — they fade!');}
function tap(r,c){if(!playing||Math.abs(r-me.r)+Math.abs(c-me.c)!==1)return;
if(grid[r][c]){beep(150,.12,'sawtooth');msg('🧱 A wall!');return;}
me={r,c};steps++;document.getElementById('s').textContent=steps;
trail.push({r,c,t:5});
beep(400,.04);
if(r===goal.r&&c===goal.c){playing=false;beep(880,.3,'triangle');
msg('🏯 Through the smoke! Level '+(level+1));level++;
setTimeout(gen,1000);return;}
render();}
function render(){const g=document.getElementById('grid');g.innerHTML='';
// fade trail
trail.forEach(t=>t.t--);
trail=trail.filter(t=>t.t>0);
const trSet=new Set(trail.map(t=>t.r*N+t.c));
document.getElementById('tr').textContent=trail.length;
for(let r=0;r<N;r++)for(let c=0;c<N;c++){const d=document.createElement('div');
const showWall=grid[r][c]&&trail.some(t=>Math.abs(t.r-r)+Math.abs(t.c-c)<=1);
d.className='c'+(grid[r][c]?' wall':'')+(trSet.has(r*N+c)?' trail':'');
if(r===me.r&&c===me.c){d.classList.add('me');d.textContent='🥷';}
else if(r===goal.r&&c===goal.c){d.classList.add('goal');d.textContent='🏯';}
else if(grid[r][c]&&trail.length===0)d.textContent='?';
d.onclick=()=>{AU.__c=AU.__c||new (window.AudioContext||window.webkitAudioContext)();tap(r,c);};
g.appendChild(d);}}
function msg(t){document.getElementById('msg').textContent=t;}
document.getElementById('btn').onclick=()=>{level=1;AU.__c=new (window.AudioContext||window.webkitAudioContext)();gen();};
gen();
</script></body></html>
