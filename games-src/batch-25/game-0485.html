<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ninja Wall Run #485</title><style>
body{margin:0;font-family:system-ui;background:#111827;color:#f9fafb;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#9ca3af;font-size:.78rem}
canvas{background:#1f2937;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#facc15}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#facc15;color:#111827;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🧗 Ninja Wall Run</h1><div class="sub">Run along the walls — tap to flip gravity at the corners. Spikes everywhere!</div>
<div id="hud"><span>Dist <b id="d">0</b></span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="400" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">🥷</div><p>Tap/Space to switch walls.<br>Dodge the spikes — distance is your score!</p><button id="btn">Run</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=400,H=400,M=26;let side=0,pos=0,sp=3.2,dist=0,playing=false,spikes=[],best=+localStorage.getItem('nwr_best')||0;
document.getElementById('b').textContent=best;
function flip(){if(!playing)return;side=(side+1)%4;beep(500,.07);}
cvs.addEventListener('pointerdown',flip);
document.addEventListener('keydown',e=>{if(e.code==='Space')flip();});
function gen(){side=0;pos=0;dist=0;playing=true;spikes=[];
document.getElementById('d').textContent=0;draw();}
function spawn(){const s=(Math.random()*4)|0;
spikes.push({s,d:pos+W,sp:0});}
function step(){dist+=sp/6;document.getElementById('d').textContent=Math.floor(dist);
if(Math.random()<0.02+dist*0.0002)spawn();
spikes.forEach(s=>{s.d-=sp;});
spikes=spikes.filter(s=>s.d>pos-40);
// player position on square
let px,py;
const per=pos%(W*4);
if(side===0){px=M+per;py=M;}
else if(side===1){px=W-M;py=M+per;}
else if(side===2){px=W-M-per;py=H-M;}
else{px=M;py=H-M-per;}
// spike collision
spikes.forEach(s=>{let sx,sy;
const sd=s.d%(W*4);
if(s.s===0){sx=M+sd;sy=M;}
else if(s.s===1){sx=W-M;sy=M+sd;}
else if(s.s===2){sx=W-M-sd;sy=H-M;}
else{sx=M;sy=H-M-sd;}
if(Math.hypot(px-sx,py-sy)<16){die();}});
pos+=sp;
sp=Math.min(6,3.2+dist*0.004);}
function die(){playing=false;beep(130,.35,'sawtooth');
const d=Math.floor(dist);
if(d>best){best=d;localStorage.setItem('nwr_best',best);document.getElementById('b').textContent=best;}
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🗡️ Impaled at '+d+'m!';}
function draw(){ctx.fillStyle='#1f2937';ctx.fillRect(0,0,W,H);
// walls
ctx.strokeStyle='#4b5563';ctx.lineWidth=8;
ctx.strokeRect(M-6,M-6,W-2*M+12,H-2*M+12);ctx.lineWidth=1;
// spikes
spikes.forEach(s=>{let sx,sy;
const sd=s.d%(W*4);
if(s.s===0){sx=M+sd;sy=M;}
else if(s.s===1){sx=W-M;sy=M+sd;}
else if(s.s===2){sx=W-M-sd;sy=H-M;}
else{sx=M;sy=H-M-sd;}
ctx.font='18px serif';ctx.textAlign='center';ctx.fillText('🗡️',sx,sy+6);});
// player
let px,py;
const per=pos%(W*4);
if(side===0){px=M+per;py=M;}
else if(side===1){px=W-M;py=M+per;}
else if(side===2){px=W-M-per;py=H-M;}
else{px=M;py=H-M-per;}
ctx.font='24px serif';ctx.fillText('🥷',px,py+8);
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{gen();
document.getElementById('ov').style.display='none';
AU.__c=new (window.AudioContext||window.webkitAudioContext)();};
</script></body></html>
