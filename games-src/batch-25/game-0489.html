<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haunted Chime Order #0489</title><style>
body{margin:0;font-family:system-ui;background:#111827;color:#f9fafb;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#9ca3af;font-size:.78rem}
canvas{background:#1f2937;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#facc15}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#facc15;color:#111827;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>Haunted Chime Order</h1><div class="sub">The chimes sound in order — tap them back. They sway faster each round!</div>
<div id="hud"><span>Round <b id="r">1</b></span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="400" height="380"></canvas>
<div id="ov"><div style="font-size:3rem">🎐</div><p>Watch the order, then repeat!</p><button id="btn">Start</button></div>
<audio id="au"></audio>
<script>var p5safe={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};</script>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
function msg(t){document.getElementById('msg').textContent=t;}
function end(w){if(!playing)return;playing=false;beep(w?880:130,.3,w?'triangle':'sawtooth');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML=w?WIN[0]:LOSE[0];}
const WIN=['🏆 Victory!'];const LOSE=['💥 Game over!'];
const W=400;const H=380;const F=[330,392,494,587,659];const NX=[70,140,210,280,350];
let seq=[],idx=0,round=1,best=+p5safe.get('hco')||0,accepting=false,lit=-1;
document.getElementById('b').textContent=best;
function tone(i){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type='sine';os.frequency.value=F[i];g.gain.setValueAtTime(.14,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+.4);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+.4);}catch(e){}}
function gen(){seq=[];const n=Math.min(3+round,6);
for(let i=0;i<n;i++)seq.push((Math.random()*5)|0);
idx=0;document.getElementById('r').textContent=round;show();}
async function show(){accepting=false;msg('👻 Listen…');
for(const i of seq){await wait(Math.max(260,440-round*14));lit=i;tone(i);draw();await wait(180);lit=-1;draw();}
idx=0;accepting=true;msg('🫵 Repeat!');}
function wait(ms){return new Promise(r=>setTimeout(r,ms));}
cvs.addEventListener('pointerdown',e=>{if(!accepting)return;const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)*W/r.width;
let bi=-1,bd=1e9;NX.forEach((nx,i)=>{const d=Math.abs(nx-x);if(d<bd){bd=d;bi=i;}});
if(bd>34)return;tone(bi);
if(bi!==seq[idx]){accepting=false;beep(130,.3,'sawtooth');
msg('💥 Wrong! Round '+round);
if(round>best){best=round;p5safe.set('hco',best);document.getElementById('b').textContent=best;}return;}
idx++;if(idx>=seq.length){accepting=false;msg('✅ Round '+(round+1));round++;document.getElementById('r').textContent=round;
setTimeout(gen,900);}});
function draw(){ctx.fillStyle='#1f2937';ctx.fillRect(0,0,W,H);
ctx.strokeStyle='#38bdf8';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(40,50);ctx.lineTo(360,50);ctx.stroke();ctx.lineWidth=1;
NX.forEach((nx,i)=>{const sw=Math.sin(Date.now()/300+i)*(i===lit?8:3);
ctx.strokeStyle='#7dd3fc';ctx.beginPath();ctx.moveTo(nx,50);ctx.lineTo(nx+sw,110);ctx.stroke();
ctx.font='26px serif';ctx.textAlign='center';ctx.globalAlpha=i===lit?1:0.7;
ctx.fillText('🔔',nx+sw,136);ctx.globalAlpha=1;
if(i===lit){ctx.strokeStyle='#facc15';ctx.beginPath();ctx.arc(nx+sw,120,24,0,7);ctx.stroke();}});}
</script><div id="msg"></div>
<script>document.getElementById('btn').addEventListener('click',function(){document.getElementById('ov').style.display='none';gen();});</script>
</body></html>
