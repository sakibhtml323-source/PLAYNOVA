<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Ant Hill #0491</title><style>
body{margin:0;font-family:system-ui;background:#111827;color:#f9fafb;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#9ca3af;font-size:.78rem}
canvas{background:#1f2937;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#facc15}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#facc15;color:#111827;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>Desert Ant Hill</h1><div class="sub">Invaders march on the ant hill — tap them before they breach!</div>
<div id="hud"><span>Hill ❤️ <b id="h">10</b></span><span>Stopped <b id="s">0</b></span><span>Wave <b id="w">1</b></span></div>
<canvas id="cv" width="400" height="380"></canvas>
<div id="ov"><div style="font-size:3rem">🐜</div><p>Tap invaders before they reach the hill!</p><button id="btn">Start</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
function msg(t){document.getElementById('msg').textContent=t;}
function end(w){if(!playing)return;playing=false;beep(w?880:130,.3,w?'triangle':'sawtooth');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML=w?WIN[0]:LOSE[0];}
const WIN=['🏆 Victory!'];const LOSE=['💥 Game over!'];
const W=400,H=380;let invaders=[],hill={x:W/2,y:H/2},hp=10,stopped=0,wave=1,playing=false,spawnT=0;
cvs.addEventListener('pointerdown',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
let bi=-1,bd=1e9;
invaders.forEach((iv,i)=>{const d=Math.hypot(iv.x-x,iv.y-y);if(d<bd){bd=d;bi=i;}});
if(bi>=0&&bd<22){stopped++;document.getElementById('s').textContent=stopped;
beep(600,.08);invaders.splice(bi,1);}
else beep(180,.06,'sawtooth');});
function spawn(){const a=Math.random()*Math.PI*2;
invaders.push({x:hill.x+Math.cos(a)*200,y:hill.y+Math.sin(a)*180,
sp:0.8+wave*0.1+Math.random()*0.4});}
function gen(){invaders=[];hp=10;stopped=0;wave=1;spawnT=0;playing=true;
document.getElementById('h').textContent=10;document.getElementById('s').textContent=0;document.getElementById('w').textContent=1;draw();}
function step(){spawnT++;if(spawnT>Math.max(40,85-wave*6)){spawnT=0;spawn();}
invaders.forEach(iv=>{const dx=hill.x-iv.x,dy=hill.y-iv.y,d=Math.hypot(dx,dy)||1;
iv.x+=dx/d*iv.sp;iv.y+=dy/d*iv.sp;
if(d<26){hp--;document.getElementById('h').textContent=Math.max(0,hp);
beep(150,.15,'sawtooth');iv.dead=true;
if(hp<=0){playing=false;
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🐜 The hill falls!<br>Wave '+wave;}}});
invaders=invaders.filter(i=>!i.dead);
if(!invaders.length&&spawnT>30){wave++;document.getElementById('w').textContent=wave;}}
function draw(){ctx.fillStyle='#1f2937';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#78350f';ctx.beginPath();ctx.arc(hill.x,hill.y,28,0,7);ctx.fill();
ctx.font='30px serif';ctx.textAlign='center';ctx.fillText('🐜',hill.x,hill.y+10);
invaders.forEach(iv=>{ctx.fillText('🐛',iv.x,iv.y+8);});
if(playing){step();requestAnimationFrame(draw);}}
</script><div id="msg"></div>
<script>document.getElementById('btn').addEventListener('click',function(){document.getElementById('ov').style.display='none';gen();});</script>
</body></html>
