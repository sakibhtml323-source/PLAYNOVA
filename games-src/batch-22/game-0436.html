<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crystal Tide Pool #436</title><style>
body{margin:0;font-family:system-ui;background:#0c4a6e;color:#e0f2fe;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#7dd3fc;font-size:.78rem}
canvas{background:#075985;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#38bdf8;color:#0c4a6e;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🌊 Crystal Tide Pool</h1><div class="sub">Tap-hold to raise the tide, release to lower — float the fish to the ocean gate!</div>
<div id="hud"><span>Tide <b id="t">50</b></span><span>⏱️ <b id="tm">0</b>s</span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="440" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">🐟</div><p>Hold = tide rises, release = falls.<br>Carry the fish over rocks to the sea!</p><button id="btn">Flow</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=400;let tide=50,fish={x:40,y:200},rocks=[],gate={x:W-40,y:200},holding=false,playing=false,startT=0,best=0;
document.getElementById('b').textContent=best;
function gen(){tide=50;fish={x:40,y:200};holding=false;playing=true;startT=Date.now();
rocks=[];for(let i=0;i<4;i++){rocks.push({x:110+i*80,y:120+Math.random()*160,r:22});}
document.getElementById('t').textContent=50;draw();}
cvs.addEventListener('pointerdown',()=>{holding=true;});
cvs.addEventListener('pointerup',()=>{holding=false;});
document.addEventListener('keydown',e=>{if(e.code==='Space')holding=true;});
document.addEventListener('keyup',e=>{if(e.code==='Space')holding=false;});
function step(){tide=Math.max(0,Math.min(100,tide+(holding?0.8:-0.8)));
document.getElementById('t').textContent=Math.round(tide);
const waterY=H-tide*2.2;
// fish floats to water level
fish.y+=((waterY-16)-fish.y)*0.05;
fish.x+=0.6;
// rock collision
rocks.forEach(r=>{if(Math.hypot(fish.x-r.x,fish.y-r.y)<r.r+10){
if(tide<45){// beached on rock
beep(150,.1,'sawtooth');fish.x-=1.4;}
}});
fish.x=Math.max(30,Math.min(W-20,fish.x));
document.getElementById('tm').textContent=((Date.now()-startT)/1000).toFixed(1);
if(fish.x>=gate.x-20){playing=false;beep(880,.3,'triangle');
const t=((Date.now()-startT)/1000).toFixed(1);
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🌊 The fish is free!<br>'+t+'s';
if(+t<(+best||999)||best===0){best=t;document.getElementById('b').textContent=best;}}}
function draw(){ctx.fillStyle='#075985';ctx.fillRect(0,0,W,H);
// rocks
rocks.forEach(r=>{ctx.font='26px serif';ctx.textAlign='center';ctx.fillText('🪨',r.x,r.y+8);});
// gate
ctx.font='28px serif';ctx.fillText('🌊',gate.x,gate.y+8);
// fish
ctx.fillText('🐟',fish.x,fish.y);
// water
const waterY=H-tide*2.2;
ctx.fillStyle='#0ea5e955';
ctx.fillRect(0,waterY,W,H-waterY);
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{gen();
document.getElementById('ov').style.display='none';
AU.__c=new (window.AudioContext||window.webkitAudioContext)();};
</script></body></html>
