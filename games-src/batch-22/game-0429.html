<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Oasis Guard #429</title><style>
body{margin:0;font-family:system-ui;background:#0c4a6e;color:#e0f2fe;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#7dd3fc;font-size:.78rem}
canvas{background:#075985;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#38bdf8;color:#0c4a6e;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🛡️ Desert Oasis Guard</h1><div class="sub">Bandits charge from every direction — rotate your shield to block them!</div>
<div id="hud"><span>Oasis ❤️ <b id="h">10</b></span><span>Blocked <b id="b">0</b></span><span>Wave <b id="w">1</b></span></div>
<canvas id="cv" width="440" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">🏝️</div><p>Drag around the oasis to aim your shield.<br>Only the shield's arc blocks!</p><button id="btn">Guard</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=400,CX=W/2,CY=H/2;let shieldA=0,attackers=[],hp=10,blocked=0,wave=1,playing=false,spawnT=0;
function spawn(){const a=Math.random()*Math.PI*2;
attackers.push({a,sp:1.2+wave*0.15+Math.random()*0.5,d:190});}
cvs.addEventListener('pointermove',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
shieldA=Math.atan2(y-CY,x-CX);});
function step(){spawnT++;if(spawnT>Math.max(35,80-wave*6)){spawnT=0;spawn();}
attackers.forEach(at=>{at.d-=at.sp;
if(at.d<34){
// blocked if shield faces attacker
let da=Math.abs(((at.a-shieldA)%(Math.PI*2)+Math.PI*3)%(Math.PI*2)-Math.PI);
if(da<0.6){blocked++;document.getElementById('b').textContent=blocked;
beep(600,.1,'triangle');at.dead=true;}
else{hp--;document.getElementById('h').textContent=Math.max(0,hp);
beep(150,.2,'sawtooth');at.dead=true;
if(hp<=0){playing=false;
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🏝️ Oasis overrun!<br>Wave '+wave+' · Blocked '+blocked;}}}});
attackers=attackers.filter(a=>!a.dead&&a.d>20);
if(!attackers.length&&spawnT>30){wave++;document.getElementById('w').textContent=wave;}}
function draw(){ctx.fillStyle='#075985';ctx.fillRect(0,0,W,H);
// oasis
ctx.font='34px serif';ctx.textAlign='center';ctx.fillText('🏝️',CX,CY+12);
// shield arc
ctx.strokeStyle='#fbbf24';ctx.lineWidth=8;
ctx.beginPath();ctx.arc(CX,CY,44,shieldA-0.6,shieldA+0.6);ctx.stroke();ctx.lineWidth=1;
// attackers
attackers.forEach(at=>{const x=CX+Math.cos(at.a)*at.d,y=CY+Math.sin(at.a)*at.d;
ctx.font='22px serif';ctx.fillText('🏴‍☠️',x,y+8);});
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{attackers=[];hp=10;blocked=0;wave=1;spawnT=0;shieldA=0;
document.getElementById('h').textContent=10;document.getElementById('b').textContent=0;
document.getElementById('w').textContent=1;document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();};
</script></body></html>
