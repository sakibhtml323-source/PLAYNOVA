<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Sun Dial #422</title><style>
body{margin:0;font-family:system-ui;background:#451a03;color:#fef3c7;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#fde68a;font-size:.78rem}
canvas{background:#78350f;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#msg{min-height:1.3em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#fbbf24;color:#451a03;font-weight:800;cursor:pointer;margin:8px}
</style></head><body>
<h1>☀️ Desert Sun Dial</h1><div class="sub">Read the shadow, then rotate your dial to the same hour — the sun keeps moving!</div>
<div id="hud"><span>Round <b id="r">1</b></span><span>Score <b id="s">0</b></span><span>Streak <b id="st">0</b></span></div>
<canvas id="cv" width="360" height="360"></canvas>
<div id="msg"></div>
<button id="btn">🏜️ New Day</button>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=360,CX=W/2,CY=W/2;let sunA=0,dialA=0,round=1,score=0,streak=0,dragging=false;
function newRound(){sunA=Math.random()*Math.PI*2;
dialA=Math.random()*Math.PI*2;
document.getElementById('r').textContent=round;
draw();msg('Rotate your dial to match the sun shadow!');}
cvs.addEventListener('pointerdown',e=>{dragging=true;drag(e);});
cvs.addEventListener('pointermove',e=>{if(dragging)drag(e);});
cvs.addEventListener('pointerup',()=>{dragging=false;check();});
function drag(e){const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*W/r.height;
dialA=Math.atan2(y-CY,x-CX);draw();}
function angD(a,b){let d=Math.abs(a-b)%(Math.PI*2);return Math.min(d,Math.PI*2-d);}
function check(){const off=angD(sunA,dialA);
if(off<0.12){score+=Math.round((0.12-off)*400)+60;streak++;
document.getElementById('s').textContent=score;document.getElementById('st').textContent=streak;
beep(880,.25,'triangle');msg('🌅 Perfect reading! +'+Math.round((0.12-off)*400+60));round++;
document.getElementById('r').textContent=round;
setTimeout(newRound,900);}
else{streak=0;document.getElementById('st').textContent=0;
beep(200,.15,'sawtooth');msg('⏳ Off by '+Math.round(off*180/Math.PI)+'° — the sun drifts…');}}
function draw(){ctx.fillStyle='#78350f';ctx.fillRect(0,0,W,W);
// dial plate
ctx.beginPath();ctx.arc(CX,CY,130,0,7);ctx.fillStyle='#92400e';ctx.fill();
ctx.strokeStyle='#b45309';ctx.lineWidth=5;ctx.stroke();
// hour marks
for(let h=0;h<12;h++){const a=h/12*Math.PI*2-Math.PI/2;
ctx.fillStyle='#fde68a';ctx.font='13px serif';ctx.textAlign='center';
ctx.fillText(h===0?12:h,CX+Math.cos(a)*108,CY+Math.sin(a)*108+4);}
// sun shadow (target)
ctx.save();ctx.translate(CX,CY);ctx.rotate(sunA);
ctx.strokeStyle='#451a03';ctx.lineWidth=8;ctx.lineCap='round';
ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(90,0);ctx.stroke();
ctx.font='22px serif';ctx.fillText('☀️',96,8);ctx.restore();
// player dial hand
ctx.save();ctx.translate(CX,CY);ctx.rotate(dialA);
ctx.strokeStyle='#fbbf24';ctx.lineWidth=4;
ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(80,0);ctx.stroke();
ctx.beginPath();ctx.arc(0,0,8,0,7);ctx.fillStyle='#fbbf24';ctx.fill();
ctx.restore();}
function msg(t){document.getElementById('msg').textContent=t;}
document.getElementById('btn').onclick=()=>{round=1;score=0;streak=0;
document.getElementById('s').textContent=0;document.getElementById('st').textContent=0;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();newRound();};
newRound();
</script></body></html>
