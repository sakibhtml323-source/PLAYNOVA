<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crystal Flood Gate #425</title><style>
body{margin:0;font-family:system-ui;background:#0c4a6e;color:#e0f2fe;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#7dd3fc;font-size:.78rem}
canvas{background:#075985;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#38bdf8;color:#0c4a6e;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🚪 Crystal Flood Gate</h1><div class="sub">Tap the gates to open or close them — route the flood to the reservoir, not the village!</div>
<div id="hud"><span>Level <b id="l">1</b></span><span>Saved <b id="s">0</b></span><span>Flooded <b id="f">0</b></span></div>
<canvas id="cv" width="440" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">🌊</div><p>Water flows down — toggle the gates to send it to 🏺.<br>If it reaches the village 🏘️, you lose!</p><button id="btn">Flood</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=400;const NODES=[[W/2,30],[110,110],[330,110],[110,210],[330,210],[110,310],[330,310],[W/2,370]];
const EDGES={0:[1,2],1:[3,4],2:[4,5],3:[6],4:[6,7],5:[7]};
let gates={},water={node:0,t:0},level=1,saved=0,flooded=0,playing=false;
function gen(){gates={};water={node:0,t:0};saved=0;flooded=0;playing=true;
document.getElementById('l').textContent=level;
document.getElementById('s').textContent=0;document.getElementById('f').textContent=0;
draw();msg('Send the flood to the reservoir!');}
function nodeXY(n){return NODES[n];}
function chosen(a,b){return gates[a+'-'+b]===false?null:(gates[a+'-'+b]||b);}
cvs.addEventListener('pointerdown',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
Object.keys(EDGES).forEach(k=>{const opts=EDGES[k];
if(opts.length>1){const[xn,yn]=nodeXY(+k);
if(Math.hypot(xn-x,yn-y)<30){const cur=gates[k+'-'+opts[0]];
const other=opts.find(o=>o!==cur);
gates[k+'-'+cur]=false;gates[k+'-'+other]=other;
beep(400,.08);}}});
draw();});
function step(){water.t+=0.025+level*0.004;
const from=nodeXY(water.node);
const nxt=EDGES[water.node]?(chosen(water.node,EDGES[water.node][0])||water.node):water.node;
const to=nodeXY(nxt);
if(water.t>=1){water.node=chosen(water.node,EDGES[water.node][0])||water.node;
// arrived
if(water.node===7){saved++;document.getElementById('s').textContent=saved;beep(700,.15,'triangle');
if(saved>=3){win();return;}
water={node:0,t:0};}
else if(water.node===6){flooded++;document.getElementById('f').textContent=flooded;
beep(150,.25,'sawtooth');
if(flooded>=1){playing=false;
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🏘️ The village floods!<br>Level '+level;
return;}
water={node:0,t:0};}
else{water.t=0;}}}
function win(){playing=false;beep(880,.3,'triangle');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🏺 Reservoir filled!<br>Level '+(level+1);
level++;setTimeout(gen,1200);}
function draw(){ctx.fillStyle='#075985';ctx.fillRect(0,0,W,H);
// edges
ctx.strokeStyle='#0c4a6e';ctx.lineWidth=14;ctx.lineCap='round';
Object.keys(EDGES).forEach(k=>{const opts=EDGES[k];
const cur=chosen(+k,opts[0])||opts[0];
const[a,b]=[nodeXY(+k),nodeXY(cur)];
ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();});
ctx.lineWidth=1;
// gates
Object.keys(EDGES).forEach(k=>{const opts=EDGES[k];if(opts.length>1){
const[x,y]=nodeXY(+k);
const open=gates[k+'-'+opts[0]]!==false;
ctx.fillStyle=open?'#22c55e':'#dc2626';
ctx.fillRect(x-12,y-8,24,16);
ctx.font='10px serif';ctx.textAlign='center';ctx.fillStyle='#fff';
ctx.fillText(open?'OPEN':'SHUT',x,y+4);}});
// icons
ctx.font='24px serif';
ctx.fillText('🌧️',NODES[0][0],NODES[0][1]+8);
ctx.fillText('🏘️',NODES[6][0],NODES[6][1]+8);
ctx.fillText('🏺',NODES[7][0],NODES[7][1]+8);
// water
const from=nodeXY(water.node);
const nxt2=EDGES[water.node]?(chosen(water.node,EDGES[water.node][0])||water.node):water.node;
const to=nodeXY(nxt2);
const wx=from[0]+(to[0]-from[0])*water.t,wy=from[1]+(to[1]-from[1])*water.t;
ctx.beginPath();ctx.arc(wx,wy,9,0,7);ctx.fillStyle='#38bdf8';ctx.fill();
if(playing){step();requestAnimationFrame(draw);}}
function msg(t){const el=document.createElement('div');
el.style.cssText='position:fixed;bottom:60px;left:50%;transform:translateX(-50%);color:#fbbf24;font-weight:700';
el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),1500);}
document.getElementById('btn').onclick=()=>{level=1;gen();
document.getElementById('ov').style.display='none';
AU.__c=new (window.AudioContext||window.webkitAudioContext)();};
gen();
</script></body></html>
