<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haunted Painting Find #431</title><style>
body{margin:0;font-family:system-ui;background:#18181b;color:#fafafa;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a1a1aa;font-size:.78rem}
canvas{background:#27272a;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#facc15}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#7c3aed;color:#fff;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🖼️ Haunted Painting Find</h1><div class="sub">The portrait's eyes wander — tap ONLY when both eyes look straight at you!</div>
<div id="hud"><span>Round <b id="r">1</b></span><span>Lives <b id="h">3</b></span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="360" height="360"></canvas>
<div id="ov"><div style="font-size:3rem">👁️</div><p>Eyes drift around. When they're both centered, tap!<br>Too early or late and the ghost laughs…</p><button id="btn">Watch</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=360,CX=W/2,CY=W/2;let ex=0,ey=0,phase='drift',round=1,lives=3,lockT=0,best=+localStorage.getItem('hpf_best')||0,t=0;
document.getElementById('b').textContent=best;
function newRound(){ex=Math.random()*2-1;ey=Math.random()*2-1;
phase='drift';t=0;document.getElementById('r').textContent=round;}
function step(){t++;
if(phase==='drift'){ex+= (Math.random()*2-1)*0.06;ey+=(Math.random()*2-1)*0.06;
ex=Math.max(-1,Math.min(1,ex));ey=Math.max(-1,Math.min(1,ey));
// occasionally lock gaze
if(t>60+Math.random()*120&&Math.abs(ex)<0.2&&Math.abs(ey)<0.2){phase='lock';lockT=Math.round(24-Math.min(14,round));}}
else if(phase==='lock'){lockT--;
if(lockT<=0){phase='drift';beep(200,.1,'sawtooth');}}}
cvs.addEventListener('pointerdown',()=>{
const aligned=Math.abs(ex)<0.22&&Math.abs(ey)<0.22;
if(phase==='lock'&&aligned){round++;beep(880,.25,'triangle');
if(round>best){best=round;localStorage.setItem('hpf_best',best);document.getElementById('b').textContent=best;}
newRound();}
else{lives--;document.getElementById('h').textContent=lives;
beep(150,.2,'sawtooth');
if(lives<=0){phase='over';
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🖼️ The ghost laughs!<br>Reached round '+round;}}});
function draw(){ctx.fillStyle='#27272a';ctx.fillRect(0,0,W,W);
ctx.strokeStyle='#57534e';ctx.lineWidth=8;ctx.strokeRect(12,12,W-24,W-24);ctx.lineWidth=1;
// face
ctx.fillStyle='#3f3f46';ctx.beginPath();ctx.arc(CX,CY,110,0,7);ctx.fill();
// eyes whites
const eo=38;
[[-eo],[eo]].forEach(([ox])=>{ctx.fillStyle='#e5e7eb';
ctx.beginPath();ctx.arc(CX+ox,CY-20,20,0,7);ctx.fill();});
// pupils
[[-eo],[eo]].forEach(([ox])=>{ctx.fillStyle='#111';
ctx.beginPath();ctx.arc(CX+ox+ex*9,CY-20+ey*9,8,0,7);ctx.fill();});
// mouth
ctx.strokeStyle='#111';ctx.lineWidth=3;
ctx.beginPath();ctx.arc(CX,CY+40,20,0.2,Math.PI-0.2);ctx.stroke();ctx.lineWidth=1;
// lock indicator
if(phase==='lock'){ctx.strokeStyle='#facc15';ctx.lineWidth=3;
ctx.beginPath();ctx.arc(CX,CY,120,0,7);ctx.stroke();ctx.lineWidth=1;}
if(phase!=='over'){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{round=1;lives=3;
document.getElementById('r').textContent=1;document.getElementById('h').textContent=3;
document.getElementById('ov').style.display='none';
AU.__c=new (window.AudioContext||window.webkitAudioContext)();newRound();draw();};
newRound();
</script></body></html>
