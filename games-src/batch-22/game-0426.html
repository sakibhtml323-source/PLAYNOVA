<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Royal Fan Fare #426</title><style>
body{margin:0;font-family:system-ui;background:#1e1b4b;color:#eef2ff;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a5b4fc;font-size:.78rem}
canvas{background:#312e81;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#1e1b4b;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🪭 Royal Fan Fare</h1><div class="sub">Swipe fast across the screen to fan the flames — keep the royal cauldron blazing!</div>
<div id="hud"><span>Heat <b id="h">50</b></span><span>Time <b id="t">30</b>s</span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="440" height="380"></canvas>
<div id="ov"><div style="font-size:3rem">🔥</div><p>Swipe left-right FAST to fan.<br>Heat drops constantly — don't let it freeze!</p><button id="btn">Fan</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=380;let heat=50,playing=false,time=30,timer=null,lastX=null,lastT=0,fanFx=[],best=+localStorage.getItem('rff_best')||0;
document.getElementById('b').textContent=best;
cvs.addEventListener('pointermove',e=>{if(!playing)return;
const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)*W/r.width;
const now=Date.now();
if(lastX!==null){const dx=Math.abs(x-lastX);const dt=Math.max(1,now-lastT);
const speed=dx/dt;
if(speed>0.5){heat=Math.min(100,heat+speed*3);
fanFx.push({x,y:(e.clientY-r.top)*H/r.height,a:1});
if(fanFx.length>20)fanFx.shift();
if(Math.random()<0.1)beep(400+speed*200,.03);}}
lastX=x;lastT=now;});
cvs.addEventListener('pointerleave',()=>{lastX=null;});
function step(){time--;document.getElementById('t').textContent=time;
heat=Math.max(0,heat-0.5);
fanFx.forEach(f=>f.a-=0.04);
fanFx=fanFx.filter(f=>f.a>0);
document.getElementById('h').textContent=Math.round(heat);
if(heat<=0){playing=false;clearInterval(timer);beep(130,.35,'sawtooth');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='❄️ The fire froze!<br>Time left: '+time+'s';return;}
if(time<=0){playing=false;clearInterval(timer);beep(880,.3,'triangle');
const sc=Math.round(heat);
if(sc>best){best=sc;localStorage.setItem('rff_best',best);document.getElementById('b').textContent=best;}
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🎺 Fanfare complete!<br>Final heat: <b style="color:#fbbf14">'+sc+'</b>';}}
function draw(){ctx.fillStyle='#312e81';ctx.fillRect(0,0,W,H);
// cauldron
ctx.fillStyle='#4338ca';
ctx.beginPath();ctx.ellipse(W/2,H-70,120,60,0,0,7);ctx.fill();
// flames scale with heat
const fh=heat*1.4;
for(let i=0;i<5;i++){const fx=W/2-60+i*30;
ctx.globalAlpha=0.5+0.5*Math.sin(Date.now()/100+i);
ctx.fillStyle=i%2?'#f59e0b':'#ef4444';
ctx.beginPath();ctx.moveTo(fx-14,H-100);
ctx.quadraticCurveTo(fx,H-100-fh-20*Math.sin(Date.now()/90+i),fx+14,H-100);
ctx.fill();ctx.globalAlpha=1;}
// fan streaks
fanFx.forEach(f=>{ctx.globalAlpha=f.a;
ctx.strokeStyle='#93c5fd';ctx.lineWidth=2;
ctx.beginPath();ctx.moveTo(f.x-24,f.y);ctx.lineTo(f.x+24,f.y-6);ctx.stroke();ctx.globalAlpha=1;});
ctx.lineWidth=1;
if(playing){requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{heat=50;time=30;fanFx=[];lastX=null;playing=true;
document.getElementById('h').textContent=50;document.getElementById('t').textContent=30;
document.getElementById('ov').style.display='none';
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();
clearInterval(timer);timer=setInterval(step,1000);};
</script></body></html>
