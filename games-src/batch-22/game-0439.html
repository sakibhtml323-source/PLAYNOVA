<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Sun Catch #439</title><style>
body{margin:0;font-family:system-ui;background:#451a03;color:#fef3c7;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#fde68a;font-size:.78rem}
canvas{background:#78350f;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#451a03;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🪞 Desert Sun Catch</h1><div class="sub">Drag the mirror — keep the reflected sunbeam on the moving scarabs to roast them!</div>
<div id="hud"><span>Roasted <b id="r">0</b></span><span>⏱️ <b id="t">45</b>s</span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="440" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">☀️</div><p>Drag the mirror at the bottom.<br>The beam goes where the mirror faces — track the scarabs!</p><button id="btn">Shine</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=400;let mirror={x:W/2,y:H-40,a:-Math.PI/2},sun={x:60,y:50},scarabs=[],roasted=0,playing=false,time=45,timer=null,best=+localStorage.getItem('dsc_best')||0;
document.getElementById('b').textContent=best;
function spawn(){scarabs.push({x:80+Math.random()*(W-160),y:80+Math.random()*160,
vx:(Math.random()*2-1)*1.5,vy:(Math.random()*2-1)*1.5,heat:0});}
function gen(){scarabs=[];roasted=0;playing=true;time=45;
document.getElementById('r').textContent=0;document.getElementById('t').textContent=45;
spawn();spawn();spawn();
AU.__c=new (window.AudioContext||window.webkitAudioContext)();
clearInterval(timer);timer=setInterval(()=>{time--;document.getElementById('t').textContent=time;
if(time<=0){playing=false;clearInterval(timer);
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🌇 Sunset!<br>Roasted: <b style="color:#fbbf14">'+roasted+'</b>';}},1000);draw();}
cvs.addEventListener('pointermove',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
mirror.x=(e.clientX-r.left)*W/r.width;
mirror.a=Math.atan2((e.clientY-r.top)*H/r.height-mirror.y,(e.clientX-r.left)*W/r.width-mirror.x);});
function step(){scarabs.forEach(s=>{s.x+=s.vx;s.y+=s.vy;
if(s.x<60||s.x>W-60)s.vx*=-1;if(s.y<70||s.y>H-140)s.vy*=-1;
// beam check: distance from scarab to mirror beam line
const bx=Math.cos(mirror.a),by=Math.sin(mirror.a);
const dx=s.x-mirror.x,dy=s.y-mirror.y;
const t=Math.max(0,dx*bx+dy*by);
const px=mirror.x+bx*t,py=mirror.y+by*t;
if(Math.hypot(s.x-px,s.y-py)<18&&t>10){s.heat+=2;
if(s.heat>=40){s.dead=true;roasted++;document.getElementById('r').textContent=roasted;
beep(700,.15,'triangle');
if(roasted>best){best=roasted;localStorage.setItem('dsc_best',best);document.getElementById('b').textContent=best;}
if(scarabs.filter(x=>!x.dead).length<3)spawn();}}
else{s.heat=Math.max(0,s.heat-1);}});
scarabs=scarabs.filter(s=>!s.dead);}
function draw(){ctx.fillStyle='#78350f';ctx.fillRect(0,0,W,H);
// sun
ctx.font='34px serif';ctx.textAlign='center';ctx.fillText('☀️',sun.x,sun.y+10);
// beam
ctx.strokeStyle='#fde68a88';ctx.lineWidth=3;
ctx.beginPath();ctx.moveTo(mirror.x,mirror.y);
ctx.lineTo(mirror.x+Math.cos(mirror.a)*300,mirror.y+Math.sin(mirror.a)*300);ctx.stroke();ctx.lineWidth=1;
// scarabs
scarabs.forEach(s=>{ctx.font='22px serif';ctx.fillText('🪲',s.x,s.y+8);
if(s.heat>0){ctx.fillStyle='#ef4444';
ctx.fillRect(s.x-12,s.y-16,24*s.heat/40,3);}});
// mirror
ctx.save();ctx.translate(mirror.x,mirror.y);ctx.rotate(mirror.a);
ctx.fillStyle='#e5e7eb';ctx.fillRect(0,-4,26,8);
ctx.restore();
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{gen();
document.getElementById('ov').style.display='none';};
</script></body></html>
