<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haunted Ballroom #470</title><style>
body{margin:0;font-family:system-ui;background:#18181b;color:#fafafa;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a1a1aa;font-size:.78rem}
canvas{background:#0f0f0f;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#facc15}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#7c3aed;color:#fff;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>💃 Haunted Ballroom</h1><div class="sub">Dance with the ghost — tap the glowing floor tiles ON the beat!</div>
<div id="hud"><span>Steps <b id="s">0</b></span><span>Combo <b id="c">×0</b></span><span>⏱️ <b id="t">30</b>s</span></div>
<canvas id="cv" width="400" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">🕺</div><p>Tiles light up on the beat — tap them as they glow!<br>Build your dance combo!</p><button id="btn">Dance</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=400,N=4,CELL=W/N;
const BPM=100,BEAT=60/BPM;
let tiles=[],steps=0,combo=0,playing=false,time=30,timer=null,beatT=0,lastBeat=-1;
function gen(){tiles=[];steps=0;combo=0;playing=true;time=30;beatT=0;lastBeat=-1;
document.getElementById('s').textContent=0;document.getElementById('c').textContent='×0';
document.getElementById('t').textContent=30;
for(let i=0;i<N*N;i++)tiles.push({on:false,deadline:0});
AU.__c=new (window.AudioContext||window.webkitAudioContext)();
clearInterval(timer);timer=setInterval(()=>{time--;document.getElementById('t').textContent=time;
if(time<=0){playing=false;clearInterval(timer);beep(880,.3,'triangle');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🎻 The music stops!<br>Steps: <b style="color:#facc15">'+steps+'</b> · Best combo ×'+combo;}},1000);loop();}
function loop(){if(!playing)return;
beatT+=1/60;
if(beatT-lastBeat>=BEAT){lastBeat=beatT;
// light a random tile
const i=(Math.random()*N*N)|0;
tiles[i].on=true;tiles[i].deadline=beatT+BEAT*0.9;
beep(440,.05);}
tiles.forEach(t=>{if(t.on&&beatT>t.deadline){t.on=false;}});
requestAnimationFrame(loop);draw();}
cvs.addEventListener('pointerdown',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
const c=Math.floor((e.clientX-r.left)/r.width*N),rr=Math.floor((e.clientY-r.top)/r.height*N);
const t=tiles[rr*N+c];
if(t.on){t.on=false;steps++;combo++;
document.getElementById('s').textContent=steps;
document.getElementById('c').textContent='×'+combo;
beep(600+combo*30,.08,'triangle');}
else{combo=0;document.getElementById('c').textContent='×0';
beep(200,.08,'sawtooth');}
draw();});
function draw(){ctx.fillStyle='#0f0f0f';ctx.fillRect(0,0,W,W);
for(let r=0;r<N;r++)for(let c=0;c<N;c++){const t=tiles[r*N+c];
ctx.fillStyle=t.on?'#7c3aed':'#1f2937';
ctx.fillRect(c*CELL+3,r*CELL+3,CELL-6,CELL-6);
if(t.on){ctx.strokeStyle='#facc15';ctx.lineWidth=2;
ctx.strokeRect(c*CELL+5,r*CELL+5,CELL-10,CELL-10);ctx.lineWidth=1;}}}
document.getElementById('btn').onclick=()=>{gen();
document.getElementById('ov').style.display='none';};
</script></body></html>
