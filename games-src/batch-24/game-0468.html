<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Hawk Dive #468</title><style>
body{margin:0;font-family:system-ui;background:#451a03;color:#fef3c7;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#fde68a;font-size:.78rem}
canvas{background:#78350f;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#451a03;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🦅 Desert Hawk Dive</h1><div class="sub">Dive to snatch the lizard — pull up before you hit the sand!</div>
<div id="hud"><span>Caught <b id="c">0</b></span><span>⏱️ <b id="t">45</b>s</span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="440" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">🦎</div><p>Tap & hold to dive, release to pull up.<br>Snatch lizards mid-dive!</p><button id="btn">Hunt</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=400,GY=H-40;let hawk={x:80,y:80,vy:0},lizards=[],caught=0,playing=false,time=45,timer=null,spawnT=0,holding=false,best=+localStorage.getItem('dhd_best')||0;
document.getElementById('b').textContent=best;
function spawn(){lizards.push({x:W+20,y:GY-8,vx:-(1.5+Math.random())});}
cvs.addEventListener('pointerdown',()=>{holding=true;});
cvs.addEventListener('pointerup',()=>{holding=false;});
document.addEventListener('keydown',e=>{if(e.code==='Space')holding=true;});
document.addEventListener('keyup',e=>{if(e.code==='Space')holding=false;});
function gen(){hawk={x:80,y:80,vy:0};lizards=[];caught=0;playing=true;time=45;spawnT=0;holding=false;
document.getElementById('c').textContent=0;document.getElementById('t').textContent=45;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();
clearInterval(timer);timer=setInterval(()=>{time--;document.getElementById('t').textContent=time;
if(time<=0){playing=false;clearInterval(timer);beep(880,.3,'triangle');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🌅 Hunting ends!<br>Caught: <b style="color:#fbbf14">'+caught+'</b>';
if(caught>best){best=caught;localStorage.setItem('dhd_best',best);document.getElementById('b').textContent=best;}}},1000);draw();}
function step(){hawk.vy+=holding?0.5:-0.65;
hawk.y+=hawk.vy;
hawk.y=Math.max(40,Math.min(GY-14,hawk.y));
if(hawk.y>=GY-14&&hawk.vy>2){crash();return;}
spawnT++;if(spawnT>Math.max(50,90-caught*3)){spawnT=0;spawn();}
lizards.forEach(l=>l.x+=l.vx);
lizards=lizards.filter(l=>{if(Math.hypot(l.x-hawk.x,l.y-hawk.y)<20){
caught++;document.getElementById('c').textContent=caught;
beep(600+caught*20,.09);return false;}
return l.x>-20;});}
function crash(){playing=false;clearInterval(timer);beep(130,.35,'sawtooth');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='💥 Crashed into the dunes!<br>Caught: '+caught;}
function draw(){ctx.fillStyle='#78350f';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#92400e';ctx.fillRect(0,GY,W,H-GY);
// sun
ctx.font='30px serif';ctx.textAlign='center';ctx.fillText('☀️',W-60,60);
lizards.forEach(l=>{ctx.font='20px serif';ctx.fillText('🦎',l.x,l.y+6);});
ctx.save();ctx.translate(hawk.x,hawk.y);ctx.rotate(hawk.vy*0.04);
ctx.font='26px serif';ctx.fillText('🦅',0,0);ctx.restore();
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{gen();
document.getElementById('ov').style.display='none';};
</script></body></html>
