<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Fire Dance #475</title><style>
body{margin:0;font-family:system-ui;background:#451a03;color:#fef3c7;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#fde68a;font-size:.78rem}
canvas{background:#78350f;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#451a03;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🔥 Desert Fire Dance</h1><div class="sub">Dance through the flames — collect 💧 water orbs, dodge 🔥 fire spirits!</div>
<div id="hud"><span>Water <b id="w">0</b></span><span>❤️ <b id="h">3</b></span><span>⏱️ <b id="t">40</b>s</span></div>
<canvas id="cv" width="440" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">💧</div><p>Drag to move.<br>Blue orbs heal & score, red spirits burn!</p><button id="btn">Dance</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=400;let me={x:W/2,y:H/2},orbs=[],spirits=[],water=0,hp=3,playing=false,time=40,timer=null,spawnT=0,target=null;
function gen(){me={x:W/2,y:H/2};orbs=[];spirits=[];water=0;hp=3;playing=true;time=40;spawnT=0;target=null;
document.getElementById('w').textContent=0;document.getElementById('h').textContent=3;document.getElementById('t').textContent=40;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();
clearInterval(timer);timer=setInterval(()=>{time--;document.getElementById('t').textContent=time;
if(time<=0){playing=false;clearInterval(timer);beep(880,.3,'triangle');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🌅 The dance ends!<br>Water: <b style="color:#fbbf14">'+water+'</b>';}},1000);draw();}
cvs.addEventListener('pointermove',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
target={x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};});
function step(){spawnT++;if(spawnT>30){spawnT=0;
if(Math.random()<0.55){orbs.push({x:20+Math.random()*(W-40),y:-14,vy:1.4+Math.random()});}
else{spirits.push({x:20+Math.random()*(W-40),y:-14,vy:1.6+Math.random()*1.2,
wob:Math.random()*6});}}
if(target){const dx=target.x-me.x,dy=target.y-me.y,d=Math.hypot(dx,dy);
if(d>4){me.x+=dx/d*3.4;me.y+=dy/d*3.4;}}
me.x=Math.max(16,Math.min(W-16,me.x));me.y=Math.max(16,Math.min(H-16,me.y));
orbs.forEach(o=>o.y+=o.vy);
spirits.forEach(s=>{s.y+=s.vy;s.wob+=0.08;s.x+=Math.sin(s.wob)*1.4;});
orbs=orbs.filter(o=>{if(Math.hypot(o.x-me.x,o.y-me.y)<20){water++;
document.getElementById('w').textContent=water;beep(600,.09,'triangle');return false;}
return o.y<H+20;});
spirits=spirits.filter(s=>{if(Math.hypot(s.x-me.x,s.y-me.y)<20){hp--;
document.getElementById('h').textContent=Math.max(0,hp);
beep(150,.2,'sawtooth');
if(hp<=0){playing=false;clearInterval(timer);
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🔥 Burned!<br>Water: '+water;}
return false;}
return s.y<H+20;});}
function draw(){ctx.fillStyle='#78350f';ctx.fillRect(0,0,W,H);
orbs.forEach(o=>{ctx.font='18px serif';ctx.textAlign='center';ctx.fillText('💧',o.x,o.y);});
spirits.forEach(s=>{ctx.fillText('🔥',s.x,s.y);});
ctx.font='26px serif';ctx.fillText('💃',me.x,me.y+8);
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{gen();
document.getElementById('ov').style.display='none';};
</script></body></html>
