<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ninja Wind Blade Dance #478</title><style>
body{margin:0;font-family:system-ui;background:#111827;color:#f9fafb;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#9ca3af;font-size:.78rem}
#cue{font-size:2.6rem;margin:10px;min-height:3.4rem}
canvas{background:#1f2937;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:4px}#hud b{color:#facc15}
#msg{min-height:1.3em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#facc15;color:#111827;font-weight:700;cursor:pointer;margin:8px}
</style></head><body>
<h1>🍃 Ninja Wind Blade Dance</h1><div class="sub">Leaves fly in with an arrow — swipe that direction to cut them. Wrong cut breaks your combo!</div>
<div id="hud"><span>Cut <b id="c">0</b></span><span>Combo <b id="co">×0</b></span><span>⏱️ <b id="t">40</b>s</span><span>Best <b id="b">0</b></span></div>
<div id="cue">?</div>
<canvas id="cv" width="400" height="340"></canvas>
<div id="msg"></div>
<button id="btn">🥷 New Dance</button>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=400,H=340;const DIRS=[['←',-1,0],['→',1,0],['↑',0,-1],['↓',0,1]];
let leaves=[],cut=0,combo=0,playing=false,time=40,timer=null,spawnT=0,best=0,drag=null;
function gen(){leaves=[];cut=0;combo=0;playing=true;time=40;spawnT=0;drag=null;
document.getElementById('c').textContent=0;document.getElementById('co').textContent='×0';
document.getElementById('t').textContent=40;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();
clearInterval(timer);timer=setInterval(()=>{time--;document.getElementById('t').textContent=time;
if(time<=0){playing=false;clearInterval(timer);beep(880,.3,'triangle');
document.getElementById('ov')&&0;
msg('🎋 Dance ends! Cut: '+cut+' · Best combo ×'+combo);
if(cut>best){best=cut;}}},1000);draw();}
function spawn(){const d=(Math.random()*4)|0;
const side=Math.random()<0.5;
leaves.push({x:side?-16:W+16,y:40+Math.random()*(H-80),
vx:(side?1:-1)*(1.6+Math.random()*1.2+combo*0.02),vy:(Math.random()*2-1)*0.8,d});}
cvs.addEventListener('pointerdown',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
drag={x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};});
cvs.addEventListener('pointerup',e=>{if(!drag)return;const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
const dx=x-drag.x,dy=y-drag.y;
drag=null;
if(Math.hypot(dx,dy)<24)return;
let sd=-1,bm=0.5;
DIRS.forEach(([e2,vx,vy],i)=>{const m=(dx*vx+dy*vy)/Math.hypot(dx,dy);
if(m>bm){bm=m;sd=i;}});
if(sd<0)return;
// find nearest matching leaf
let bi=-1,bd=1e9;
leaves.forEach((l,i)=>{if(l.d!==sd)return;const d=Math.hypot(l.x-W/2,l.y-H/2);
if(d<bd){bd=d;bi=i;}});
if(bi>=0&&bd<170){leaves.splice(bi,1);cut++;combo++;
document.getElementById('c').textContent=cut;
document.getElementById('co').textContent='×'+combo;
document.getElementById('cue').textContent='✂️';
beep(600+combo*30,.08,'triangle');setTimeout(()=>document.getElementById('cue').textContent='?',300);}
else{combo=0;document.getElementById('co').textContent='×0';
document.getElementById('cue').textContent='❌';
beep(200,.1,'sawtooth');setTimeout(()=>document.getElementById('cue').textContent='?',300);}});
function step(){spawnT++;if(spawnT>Math.max(30,65-cut*0.4)){spawnT=0;spawn();}
leaves.forEach(l=>{l.x+=l.vx;l.y+=l.vy;});
leaves=leaves.filter(l=>l.x>-40&&l.x<W+40&&l.y>0&&l.y<H);
document.getElementById('cue').textContent=leaves.length?DIRS[leaves[0].d][0]:'?';}
function draw(){ctx.fillStyle='#1f2937';ctx.fillRect(0,0,W,H);
leaves.forEach(l=>{ctx.save();ctx.translate(l.x,l.y);
ctx.rotate(Math.atan2(l.vy,l.vx));
ctx.font='24px serif';ctx.textAlign='center';ctx.fillText('🍃',0,0);ctx.restore();
ctx.font='16px serif';ctx.fillText(DIRS[l.d][0],l.x,l.y-20);});
if(playing){step();requestAnimationFrame(draw);}}
function msg(t){const el=document.createElement('div');
el.style.cssText='position:fixed;bottom:60px;left:50%;transform:translateX(-50%);color:#facc15;font-weight:700';
el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),1600);}
document.getElementById('btn').onclick=()=>{gen();
document.getElementById('ov2')&&document.getElementById('ov2').remove();};
</script><div id="ov2" style="display:none"></div>
<div id="ov" style="display:none"></div>
</body></html>
