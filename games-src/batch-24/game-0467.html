<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ninja Star Trace #467</title><style>
body{margin:0;font-family:system-ui;background:#111827;color:#f9fafb;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#9ca3af;font-size:.78rem}
canvas{background:#1f2937;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:4px}#hud b{color:#facc15}
#msg{min-height:1.3em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#facc15;color:#111827;font-weight:700;cursor:pointer;margin:8px}
</style></head><body>
<h1>⭐ Ninja Star Trace</h1><div class="sub">Trace the star in ONE stroke — hit every point, don't lift early!</div>
<div id="hud"><span>Progress <b id="p">0</b>%</span><span>Lives <b id="h">3</b></span></div>
<canvas id="cv" width="400" height="400"></canvas>
<div id="msg"></div>
<button id="btn">🥷 New Star</button>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=400,CX=W/2,CY=W/2;let pts=[],trail=[],lives=3,drawing=false;
function gen(){pts=[];trail=[];lives=3;
document.getElementById('h').textContent=3;
// 5-point star
for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2;
const r=i%2===0?140:56;
pts.push({x:CX+Math.cos(a)*r,y:CY+Math.sin(a)*r,hit:false});}
draw();msg('Trace the star — one continuous stroke!');}
cvs.addEventListener('pointerdown',e=>{drawing=true;trail=[];addPt(e);});
cvs.addEventListener('pointermove',e=>{if(drawing)addPt(e);});
cvs.addEventListener('pointerup',()=>{if(!drawing)return;drawing=false;
const n=pts.filter(p=>p.hit).length;
if(n>=pts.length){beep(880,.3,'triangle');msg('🌟 Perfect star!');}
else{lives--;document.getElementById('h').textContent=lives;
beep(150,.2,'sawtooth');
if(lives<=0)msg('💨 The ink fades… try a new star.');
else msg('🖐️ Lifted too early! ('+n+'/'+pts.length+')');}
pts.forEach(p=>p.hit=false);draw();});
function addPt(e){const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*W/r.height;
trail.push({x,y});
pts.forEach(p=>{if(!p.hit&&Math.hypot(p.x-x,p.y-y)<16){p.hit=true;beep(500,.05);}});
draw();check();}
function check(){document.getElementById('p').textContent=Math.round(pts.filter(p=>p.hit).length/pts.length*100);}
function draw(){ctx.fillStyle='#1f2937';ctx.fillRect(0,0,W,W);
// trail
if(trail.length>1){ctx.strokeStyle='#facc15';ctx.lineWidth=3;ctx.lineCap='round';
ctx.beginPath();trail.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));ctx.stroke();ctx.lineWidth=1;}
// star outline
ctx.strokeStyle='#4b5563';ctx.setLineDash([4,6]);
ctx.beginPath();pts.forEach((p,i)=>i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
ctx.closePath();ctx.stroke();ctx.setLineDash([]);
pts.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,p.hit?5:4,0,7);
ctx.fillStyle=p.hit?'#22c55e':'#9ca3af';ctx.fill();});}
function msg(t){document.getElementById('msg').textContent=t;}
document.getElementById('btn').onclick=()=>{AU.__c=new (window.AudioContext||window.webkitAudioContext)();gen();};
gen();
</script></body></html>
