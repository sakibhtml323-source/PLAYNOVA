<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Night Patrol #464</title><style>
body{margin:0;font-family:system-ui;background:#0a0a1a;color:#e2e8f0;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#94a3b8;font-size:.78rem}
canvas{background:#111122;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#0a0a1a;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🏮 Desert Night Patrol</h1><div class="sub">Thieves creep toward the campfire along three paths — intercept them with your lantern!</div>
<div id="hud"><span>Camp ❤️ <b id="h">10</b></span><span>Caught <b id="c">0</b></span><span>Wave <b id="w">1</b></span></div>
<canvas id="cv" width="440" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">🔥</div><p>Tap a path to flash your lantern — thieves on it are caught!<br>You can only patrol one path at a time.</p><button id="btn">Patrol</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=400;const PATHS=[H/2-110,H/2,H/2+110];
let thieves=[],lantern=-1,hp=10,caught=0,wave=1,playing=false,spawnT=0,lanternCd=0;
function spawn(){const p=(Math.random()*3)|0;
thieves.push({p,d:190,sp:0.8+wave*0.12+Math.random()*0.4});}
cvs.addEventListener('pointerdown',e=>{if(!playing||lanternCd>0)return;const r=cvs.getBoundingClientRect();
const y=(e.clientY-r.top)*H/r.height;
let best=-1,bd=1e9;
PATHS.forEach((py,i)=>{const d=Math.abs(py-y);if(d<bd){bd=d;best=i;}});
lantern=best;lanternCd=50;beep(500,.1);});
function step(){spawnT++;if(spawnT>Math.max(40,85-wave*6)){spawnT=0;spawn();}
if(lanternCd>0){lanternCd--;if(lanternCd===0)lantern=-1;}
thieves.forEach(t=>{t.d-=t.sp;
if(t.d<30){if(t.p===lantern){caught++;document.getElementById('c').textContent=caught;
beep(600,.1,'triangle');t.dead=true;}
else{hp--;document.getElementById('h').textContent=Math.max(0,hp);
beep(150,.2,'sawtooth');t.dead=true;
if(hp<=0){playing=false;
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🔥 The camp is robbed!<br>Wave '+wave+' · Caught '+caught;}}}});
thieves=thieves.filter(t=>!t.dead&&t.d>-20);
if(!thieves.length&&spawnT>30){wave++;document.getElementById('w').textContent=wave;}}
function draw(){ctx.fillStyle='#111122';ctx.fillRect(0,0,W,H);
// paths
PATHS.forEach((py,i)=>{ctx.strokeStyle=i===lantern?'#fbbf24':'#334155';
ctx.lineWidth=14;ctx.lineCap='round';
ctx.beginPath();ctx.moveTo(W-20,py);ctx.lineTo(60,py);ctx.stroke();ctx.lineWidth=1;});
// campfire
ctx.font='32px serif';ctx.textAlign='center';ctx.fillText('🔥',40,H/2+10);
// thieves
thieves.forEach(t=>{const x=60+(t.d/190)*(W-80);
ctx.font='24px serif';ctx.fillText('🦹',x,PATHS[t.p]+8);});
// lantern
if(lantern>=0){ctx.font='26px serif';ctx.fillText('🏮',W/2,PATHS[lantern]-24);}
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{thieves=[];lantern=-1;hp=10;caught=0;wave=1;spawnT=0;lanternCd=0;
document.getElementById('h').textContent=10;document.getElementById('c').textContent=0;
document.getElementById('w').textContent=1;document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();};
</script></body></html>
