<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Sun Dial Run #471</title><style>
body{margin:0;font-family:system-ui;background:#451a03;color:#fef3c7;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#fde68a;font-size:.78rem}
canvas{background:#78350f;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#451a03;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🏃 Desert Sun Dial Run</h1><div class="sub">The sundial shadow chases you around the circle — don't let it catch you!</div>
<div id="hud"><span>Time <b id="t">0.0</b>s</span><span>Shadow speed <b id="s">1×</b></span><span>Best <b id="b">0.0</b>s</span></div>
<canvas id="cv" width="400" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">☀️</div><p>Hold left/right side to run around the dial.<br>Outrun the shadow as long as you can!</p><button id="btn">Run</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=400,CX=W/2,CY=W/2,R=150;let me={a:0},shadow={a:Math.PI},playing=false,startT=0,dir=0,best=+localStorage.getItem('dsdr_best')||0;
document.getElementById('b').textContent=best.toFixed(1);
cvs.addEventListener('pointerdown',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
dir=(e.clientX-r.left)<r.width/2?-1:1;});
cvs.addEventListener('pointerup',()=>{dir=0;});
document.addEventListener('keydown',e=>{if(!playing)return;
if(e.key==='ArrowLeft')dir=-1;if(e.key==='ArrowRight')dir=1;});
document.addEventListener('keyup',()=>{dir=0;});
function step(){me.a+=dir*0.03;
const spd=0.012+((Date.now()-startT)/1000)*0.0004;
shadow.a+=spd*(Math.sin((Date.now()-startT)/900)>0?1:-1)*0.7;
// catch check
let d=Math.abs(me.a-shadow.a)%(Math.PI*2);d=Math.min(d,Math.PI*2-d);
document.getElementById('t').textContent=((Date.now()-startT)/1000).toFixed(1);
document.getElementById('s').textContent=(1+((Date.now()-startT)/1000)*0.03).toFixed(2)+'×';
if(d<0.12){caught();}}
function caught(){playing=false;beep(130,.35,'sawtooth');
const t=((Date.now()-startT)/1000);
if(t>best){best=t;localStorage.setItem('dsdr_best',best);document.getElementById('b').textContent=best.toFixed(1);}
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🌑 The shadow catches you!<br>Survived <b style="color:#fbbf14">'+t.toFixed(1)+'s</b>';}
function draw(){ctx.fillStyle='#78350f';ctx.fillRect(0,0,W,W);
// dial
ctx.strokeStyle='#b45309';ctx.lineWidth=6;
ctx.beginPath();ctx.arc(CX,CY,R,0,7);ctx.stroke();ctx.lineWidth=1;
for(let h=0;h<12;h++){const a=h/12*Math.PI*2;
ctx.fillStyle='#fde68a';
ctx.beginPath();ctx.arc(CX+Math.cos(a)*R,CY+Math.sin(a)*R,4,0,7);ctx.fill();}
// shadow
const sx=CX+Math.cos(shadow.a)*R,sy=CY+Math.sin(shadow.a)*R;
ctx.strokeStyle='#1c191755';ctx.lineWidth=16;ctx.lineCap='round';
ctx.beginPath();ctx.moveTo(CX,CY);ctx.lineTo(sx,sy);ctx.stroke();ctx.lineWidth=1;
// runner
const mx=CX+Math.cos(me.a)*R,my=CY+Math.sin(me.a)*R;
ctx.font='24px serif';ctx.textAlign='center';ctx.fillText('🏃',mx,my+8);
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{me={a:0};shadow={a:Math.PI};playing=true;startT=Date.now();dir=0;
document.getElementById('ov').style.display='none';
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();};
</script></body></html>
