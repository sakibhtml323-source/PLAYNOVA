<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Royal Feast Balance #480</title><style>
body{margin:0;font-family:system-ui;background:#1e1b4b;color:#eef2ff;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a5b4fc;font-size:.78rem}
canvas{background:#312e81;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#1e1b4b;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🍽️ Royal Feast Balance</h1><div class="sub">Carry the swaying tray to the throne — tilt to keep the dishes from sliding off!</div>
<div id="hud"><span>Delivered <b id="d">0</b></span><span>Dishes <b id="di">3</b></span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="400" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">👑</div><p>The tray tilts as you move. Counter-tilt with the mouse!<br>Deliver all 3 dishes.</p><button id="btn">Serve</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=400,H=400;let tray={x:60,y:H-60,tilt:0},dishes=[],throne={x:W-60,y:60},delivered=0,playing=false,target=null,best=0;
document.getElementById('b').textContent=best;
function gen(){tray={x:60,y:H-60,tilt:0};delivered=0;playing=true;target=null;
dishes=[];for(let i=0;i<3;i++){dishes.push({off:(i-1)*20,slide:0,lost:false});}
document.getElementById('d').textContent=0;document.getElementById('di').textContent=3;
draw();msg('Deliver the feast!');}
cvs.addEventListener('pointermove',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
target={x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};});
function step(){if(target){const dx=target.x-tray.x,dy=target.y-tray.y,d=Math.hypot(dx,dy);
if(d>4){tray.x+=dx/d*2.6;tray.y+=dy/d*2.6;
tray.tilt=(dx/d)*0.3;}}
tray.tilt*=0.95;
// dishes slide opposite to tilt
dishes.forEach(d2=>{if(d2.lost)return;
d2.slide+=(-tray.tilt)*1.6;
d2.slide*=0.94;
if(Math.abs(d2.slide)>34){d2.lost=true;
document.getElementById('di').textContent=dishes.filter(x=>!x.lost).length;
beep(150,.2,'sawtooth');
if(dishes.every(x=>x.lost)){playing=false;
document.getElementById('ov2')&&document.getElementById('ov2').remove();
const el=document.createElement('div');el.id='ov2';
el.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5';
el.innerHTML='<div style="font-size:3rem">💥</div><p>All dishes crashed!</p>';
document.body.appendChild(el);}}});
if(Math.hypot(tray.x-throne.x,tray.y-throne.y)<40){
const ok=dishes.filter(d2=>!d2.lost).length;
delivered=ok;document.getElementById('d').textContent=ok;
playing=false;beep(880,.3,'triangle');
if(ok>best){best=ok;document.getElementById('b').textContent=best;}
document.getElementById('ov2')&&document.getElementById('ov2').remove();
const el=document.createElement('div');el.id='ov2';
el.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5';
el.innerHTML='<div style="font-size:3rem">👑</div><p>'+(ok===3?'Perfect feast!':ok+' dishes delivered…')+'</p>';
document.body.appendChild(el);}}
function draw(){ctx.fillStyle='#312e81';ctx.fillRect(0,0,W,H);
// throne
ctx.font='32px serif';ctx.textAlign='center';ctx.fillText('👑',throne.x,throne.y+10);
ctx.strokeStyle='#fbbf2455';ctx.setLineDash([4,6]);
ctx.beginPath();ctx.arc(throne.x,throne.y,36,0,7);ctx.stroke();ctx.setLineDash([]);
// tray
ctx.save();ctx.translate(tray.x,tray.y);ctx.rotate(tray.tilt);
ctx.fillStyle='#4338ca';ctx.fillRect(-40,-5,80,10);
dishes.forEach(d2=>{if(!d2.lost){ctx.font='18px serif';ctx.fillText('🍽️',d2.off+d2.slide,-8);}});
ctx.restore();
if(playing){step();requestAnimationFrame(draw);}}
function msg(t){const el=document.createElement('div');
el.style.cssText='position:fixed;bottom:60px;left:50%;transform:translateX(-50%);color:#fbbf24;font-weight:700';
el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),1500);}
document.getElementById('btn').onclick=()=>{gen();
document.getElementById('ov2')&&document.getElementById('ov2').remove();
AU.__c=new (window.AudioContext||window.webkitAudioContext)();};
</script><div id="ov2" style="display:none"></div>
</body></html>
