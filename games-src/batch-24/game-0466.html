<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Oasis Rope #466</title><style>
body{margin:0;font-family:system-ui;background:#0c4a6e;color:#e0f2fe;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#7dd3fc;font-size:.78rem}
canvas{background:#075985;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#38bdf8;color:#0c4a6e;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🪣 Desert Oasis Rope</h1><div class="sub">Pull the rope rhythmically — pull too fast and it slips, too slow and you tire!</div>
<div id="hud"><span>Bucket <b id="b">0</b>%</span><span>Tired <b id="t">0</b>%</span><span>Slips <b id="s">0</b>/3</span></div>
<canvas id="cv" width="360" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">🏺</div><p>Tap rhythmically to pull — steady pace is best!<br>Raise the bucket to the top.</p><button id="btn">Pull</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=360,H=400;let bucket=0,tired=0,slips=0,playing=false,lastTap=0,ropeY=60;
cvs.addEventListener('pointerdown',()=>{if(!playing)return;
const now=Date.now();
const gap=now-lastTap;
if(gap<180){// too fast - slip!
slips++;document.getElementById('s').textContent=slips;
beep(150,.15,'sawtooth');
if(slips>=3){playing=false;
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🪢 The rope slips away!<br>Bucket at '+Math.round(bucket)+'%';}
return;}
if(gap>2500){tired=Math.min(100,tired+10);
document.getElementById('t').textContent=Math.round(tired);
if(tired>=100){playing=false;
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='😓 Too tired to continue!<br>Bucket at '+Math.round(bucket)+'%';}
return;}
bucket=Math.min(100,bucket+7);
tired=Math.max(0,tired-6);
document.getElementById('b').textContent=Math.round(bucket);
document.getElementById('t').textContent=Math.round(tired);
ropeY=60+(bucket/100)*(H-160);
beep(400+bucket*3,.07);
lastTap=now;
if(bucket>=100){playing=false;beep(880,.3,'triangle');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🏺 Fresh water! Well done!';}});
function gen(){bucket=0;tired=0;slips=0;playing=true;lastTap=0;ropeY=60;
document.getElementById('b').textContent=0;document.getElementById('t').textContent=0;
document.getElementById('s').textContent=0;draw();}
function draw(){ctx.fillStyle='#075985';ctx.fillRect(0,0,W,H);
// well
ctx.fillStyle='#334155';ctx.fillRect(W/2-70,H-70,140,70);
ctx.strokeStyle='#94a3b8';ctx.lineWidth=6;
ctx.beginPath();ctx.moveTo(W/2-60,H-70);ctx.lineTo(W/2-60,H-150);
ctx.moveTo(W/2+60,H-70);ctx.lineTo(W/2+60,H-150);
ctx.moveTo(W/2-70,H-150);ctx.lineTo(W/2+70,H-150);ctx.stroke();ctx.lineWidth=1;
// rope
ctx.strokeStyle='#d6b98a';
ctx.beginPath();ctx.moveTo(W/2,H-150);ctx.lineTo(W/2,ropeY);ctx.stroke();
// bucket
ctx.font='26px serif';ctx.textAlign='center';ctx.fillText('🪣',W/2,ropeY+18);
// hint
if(playing){ctx.font='14px system-ui';
ctx.fillText('steady taps!',W/2,40);}
if(playing)requestAnimationFrame(draw);}
document.getElementById('btn').onclick=()=>{gen();
document.getElementById('ov').style.display='none';
AU.__c=new (window.AudioContext||window.webkitAudioContext)();};
</script></body></html>
