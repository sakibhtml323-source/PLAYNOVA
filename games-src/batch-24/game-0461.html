<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ninja Leaf Sweep #461</title><style>
body{margin:0;font-family:system-ui;background:#111827;color:#f9fafb;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#9ca3af;font-size:.78rem}
canvas{background:#1f2937;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#facc15}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#facc15;color:#111827;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🍂 Ninja Leaf Sweep</h1><div class="sub">Sweep the leaves into the corner pile — the autumn wind keeps scattering them!</div>
<div id="hud"><span>Swept <b id="s">0</b>%</span><span>⏱️ <b id="t">40</b>s</span></div>
<canvas id="cv" width="440" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">🧹</div><p>Drag the broom — leaves flee from it.<br>Push 80% into the glowing corner!</p><button id="btn">Sweep</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=400;let leaves=[],broom={x:W/2,y:H/2},wind=0,windT=0,playing=false,time=40,timer=null,pile={x:W-50,y:H-50,r:60};
function gen(){leaves=[];for(let i=0;i<50;i++){leaves.push({x:30+Math.random()*(W-140),y:30+Math.random()*(H-140),vx:0,vy:0,swept:false});}
wind=0;windT=0;playing=true;time=40;
document.getElementById('s').textContent=0;document.getElementById('t').textContent=40;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();
clearInterval(timer);timer=setInterval(()=>{time--;document.getElementById('t').textContent=time;
if(time<=0){playing=false;clearInterval(timer);
const pct=Math.round(leaves.filter(l=>l.swept).length/leaves.length*100);
beep(pct>=80?880:130,.3,pct>=80?'triangle':'sawtooth');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML=(pct>=80?'🏆 Yard clean!':'🍂 Time up!')+'<br>Swept: <b style="color:#facc15">'+pct+'%</b>';}},1000);draw();}
cvs.addEventListener('pointermove',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
broom.x=(e.clientX-r.left)*W/r.width;broom.y=(e.clientY-r.top)*H/r.height;});
function step(){windT++;if(windT>90){windT=0;wind=(Math.random()*2-1)*0.5;}
leaves.forEach(l=>{if(l.swept)return;
// flee broom
const dx=l.x-broom.x,dy=l.y-broom.y,d=Math.hypot(dx,dy);
if(d<60){l.vx+=dx/d*0.9;l.vy+=dy/d*0.9;}
l.vx+=wind*0.05;l.vy*=0.96;l.vx*=0.96;
l.x+=l.vx;l.y+=l.vy;
l.x=Math.max(10,Math.min(W-10,l.x));l.y=Math.max(10,Math.min(H-10,l.y));
// in pile?
if(Math.hypot(l.x-pile.x,l.y-pile.y)<pile.r){l.swept=true;beep(500,.04);}});
document.getElementById('s').textContent=Math.round(leaves.filter(l=>l.swept).length/leaves.length*100);}
function draw(){ctx.fillStyle='#1f2937';ctx.fillRect(0,0,W,H);
// pile zone
ctx.strokeStyle='#facc15';ctx.setLineDash([5,5]);
ctx.beginPath();ctx.arc(pile.x,pile.y,pile.r,0,7);ctx.stroke();ctx.setLineDash([]);
ctx.font='22px serif';ctx.textAlign='center';ctx.fillText('🗑️',pile.x,pile.y+8);
leaves.forEach(l=>{if(!l.swept){ctx.font='14px serif';ctx.fillText('🍂',l.x,l.y);}});
ctx.font='26px serif';ctx.fillText('🧹',broom.x,broom.y+8);
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{gen();
document.getElementById('ov').style.display='none';};
</script></body></html>
