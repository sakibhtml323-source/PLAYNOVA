<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Royal Tapestry #469</title><style>
body{margin:0;font-family:system-ui;background:#1e1b4b;color:#eef2ff;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a5b4fc;font-size:.78rem}
#loom{display:flex;flex-direction:column;gap:3px;margin:12px}
.row{display:flex;gap:3px}
.st{width:40px;height:30px;background:#312e81;border-radius:6px;cursor:pointer}
.st.done{background:linear-gradient(90deg,#7c3aed,#a78bfa)}
.st.cur{outline:2px solid #fbbf24;animation:pul 1s infinite}
@keyframes pul{0%,100%{box-shadow:0 0 0 0 #fbbf1500}50%{box-shadow:0 0 0 5px #fbbf1533}}
#hud{display:flex;gap:14px;font-size:.9rem;margin:4px}#hud b{color:#fbbf24}
#msg{min-height:1.3em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#fbbf24;color:#1e1b4b;font-weight:700;cursor:pointer;margin:8px}
</style></head><body>
<h1>🧵 Royal Tapestry</h1><div class="sub">Weave row by row — but only the GLOWING row accepts the thread!</div>
<div id="hud"><span>Rows <b id="r">0</b>/<b id="rt">0</b></span><span>Mistakes <b id="m">0</b>/3</span></div>
<div id="loom"></div>
<div id="msg"></div>
<button id="btn">🎨 New Tapestry</button>
<audio id="au"></audio>
<script>
"use strict";
const AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const ROWS=6,COLS=8;let cur=0,done=[],mistakes=0;
function gen(){cur=0;done=Array.from({length:ROWS},()=>Array(COLS).fill(false));mistakes=0;
document.getElementById('m').textContent=0;
document.getElementById('r').textContent=0;document.getElementById('rt').textContent=ROWS;
const loom=document.getElementById('loom');loom.innerHTML='';
for(let r=0;r<ROWS;r++){const row=document.createElement('div');row.className='row';
for(let c=0;c<COLS;c++){const d=document.createElement('div');d.className='st';
d.onclick=()=>tap(r,c);row.appendChild(d);}
loom.appendChild(row);}
render();msg('Weave the glowing row!');}
function tap(r,c){if(done[r][c])return;
if(r!==cur){mistakes++;document.getElementById('m').textContent=mistakes;
beep(150,.15,'sawtooth');
if(mistakes>=3){msg('🧶 The tapestry tangles! Restart.');setTimeout(gen,900);return;}
msg('❌ Only the glowing row!');return;}
done[r][c]=true;beep(400+c*30,.05);render();
if(done[r].every(x=>x)){cur++;beep(600+cur*50,.1);
if(cur>=ROWS){beep(880,.3,'triangle');msg('👑 Tapestry complete!');}
else msg('✅ Row '+(cur+1)+' now!');}}
function render(){const rows=document.querySelectorAll('.row');
rows.forEach((row,r)=>{const sts=row.querySelectorAll('.st');
sts.forEach((st,c)=>{st.classList.toggle('done',done[r][c]);
st.classList.toggle('cur',r===cur&&!done[r][c]);});});
document.getElementById('r').textContent=cur;}
function msg(t){document.getElementById('msg').textContent=t;}
document.getElementById('btn').onclick=()=>{AU.__c=new (window.AudioContext||window.webkitAudioContext)();gen();};
gen();
</script></body></html>
