<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Oasis Ring #479</title><style>
body{margin:0;font-family:system-ui;background:#0c4a6e;color:#e0f2fe;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#7dd3fc;font-size:.78rem}
canvas{background:#075985;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#38bdf8;color:#0c4a6e;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>💍 Desert Oasis Ring</h1><div class="sub">Flick rings onto the moving pegs — the further the peg, the more points!</div>
<div id="hud"><span>Rings <b id="r">8</b></span><span>Score <b id="s">0</b></span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="440" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">🎪</div><p>Flick toward a peg.<br>Land a ring on it to score!</p><button id="btn">Toss</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=400;let rings=[],pegs=[],ringsLeft=8,score=0,best=+localStorage.getItem('dor_best')||0,playing=true;
document.getElementById('b').textContent=best;
function gen(){rings=[];pegs=[];ringsLeft=8;score=0;playing=true;
for(let i=0;i<3;i++){pegs.push({x:140+i*110,y:120+Math.sin(i*2)*30,ph:i*2,r:14,hits:0});}
document.getElementById('r').textContent=8;document.getElementById('s').textContent=0;
draw();msg('Flick to toss!');}
let flick=null;
cvs.addEventListener('pointerdown',e=>{if(!playing||ringsLeft<=0)return;const r=cvs.getBoundingClientRect();
flick={x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};});
cvs.addEventListener('pointerup',e=>{if(!flick)return;const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
rings.push({x:W/2,y:H-30,vx:(flick.x-x)*0.09,vy:(flick.y-y)*0.09,r:12});
ringsLeft--;document.getElementById('r').textContent=ringsLeft;
beep(500,.07);flick=null;
if(ringsLeft<=0)setTimeout(()=>{if(playing)end();},4000);});
function step(){pegs.forEach(p=>{p.ph+=0.04;p.x=140+((p.ph*40)%220)+p.hits*10;});
rings.forEach(r=>{r.vy+=0.16;r.x+=r.vx;r.y+=r.vy;
pegs.forEach(p=>{if(Math.hypot(r.x-p.x,r.y-p.y)<p.r+8&&Math.abs(r.vy)>0.5){
p.hits++;score+=10+p.hits*10;
document.getElementById('s').textContent=score;
beep(700+p.hits*50,.12,'triangle');
if(score>best){best=score;localStorage.setItem('dor_best',best);document.getElementById('b').textContent=best;}
r.dead=true;}});});
rings=rings.filter(r=>!r.dead&&r.y<H+30&&r.x>-30&&r.x<W+30);}
function end(){playing=false;
document.getElementById('msg')?0:0;
const el=document.createElement('div');
el.style.cssText='position:fixed;bottom:60px;left:50%;transform:translateX(-50%);color:#fbbf24;font-weight:700';
el.textContent='🎪 Game over! Score: '+score;
document.body.appendChild(el);setTimeout(()=>el.remove(),2000);}
function draw(){ctx.fillStyle='#075985';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#166534';ctx.fillRect(0,H-26,W,26);
pegs.forEach(p=>{ctx.fillStyle='#d6b98a';
ctx.fillRect(p.x-3,p.y,6,H-26-p.y);
ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.strokeStyle='#fbbf24';ctx.lineWidth=3;ctx.stroke();ctx.lineWidth=1;});
rings.forEach(r=>{ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,7);
ctx.strokeStyle='#f472b6';ctx.lineWidth=4;ctx.stroke();ctx.lineWidth=1;});
if(flick){ctx.strokeStyle='#fbbf2455';ctx.setLineDash([4,4]);
ctx.beginPath();ctx.moveTo(W/2,H-30);ctx.lineTo(flick.x,flick.y);ctx.stroke();ctx.setLineDash([]);}
if(playing){step();requestAnimationFrame(draw);}}
function msg(t){const el=document.createElement('div');
el.style.cssText='position:fixed;bottom:60px;left:50%;transform:translateX(-50%);color:#fbbf24;font-weight:700';
el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),1500);}
document.getElementById('btn').onclick=()=>{gen();
document.getElementById('ov2')&&document.getElementById('ov2').remove();
AU.__c=new (window.AudioContext||window.webkitAudioContext)();};
</script><div id="ov2" style="display:none"></div>
<div id="msg"></div>
</body></html>
