<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Focus Trainer: Comic Book Edition</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#fef08a;font-family:'Comic Sans MS','Segoe UI',cursive;color:#111;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px}
h1{font-size:1.15rem;color:#dc2626;padding:6px;text-shadow:2px 2px #fff}
#hud{display:flex;gap:14px;font-size:.9rem;margin-bottom:10px}
#panel{width:min(540px,96vw);background:#fff;border:4px solid #111;border-radius:6px;padding:16px;box-shadow:6px 6px 0 #111;min-height:300px;position:relative}
#panel::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,#00000008,transparent 60%);pointer-events:none}
#q{font-size:1.15rem;text-align:center;margin-bottom:14px;font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts button{background:#fff;border:3px solid #111;border-radius:6px;padding:12px;font-family:inherit;font-size:1rem;cursor:pointer;box-shadow:3px 3px 0 #111}
.opts button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #111}
.opts button.ok{background:#4ade80}.opts button.bad{background:#f87171}
#fb{text-align:center;font-weight:700;min-height:1.6em;margin-top:10px}
#prog{height:10px;background:#eee;border:2px solid #111;border-radius:6px;overflow:hidden;margin-bottom:12px}
#prog i{display:block;height:100%;background:#dc2626;width:0}
#ov{position:fixed;inset:0;background:rgba(254,240,138,.98);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#111;padding:20px;z-index:5}
button.big{background:#dc2626;color:#fff;border:3px solid #111;box-shadow:4px 4px 0 #111;font-family:inherit;font-weight:700;padding:12px 34px;font-size:1rem;cursor:pointer;margin-top:14px}
@media(max-width:480px){.opts button{padding:9px 6px;font-size:.85rem}}
</style>
</head>
<body>
<h1>💥 FOCUS TRAINER: COMIC EDITION</h1>
<div id="hud"><span>Panel <b id="n">1</b>/12</span><span>Score <b id="sc">0</b></span><span>Focus <b id="f">100</b>%</span><span>Best <b id="b">0</b></span></div>
<div id="panel">
<div id="prog"><i id="pb"></i></div>
<div id="q">Press START, hero!</div>
<div class="opts" id="opts"></div>
<div id="fb"></div>
</div>
<div id="ov"><h2 style="color:#dc2626">POW! FOCUS TRAINER</h2><p id="od">12 panels of rapid-fire questions! Answer fast — the focus bar drains while you think. Wrong answers hit hard. Keep focus above zero!</p><button class="big" id="btn">ORIGIN STORY</button></div>
<script>
"use strict";
const QS=[
{q:'2 + 2 × 2 = ?',o:['6','8','4','10'],a:0},
{q:'Which is the ODD color?',o:['Red','Blue','Green','Chair'],a:3},
{q:'First letter of "POW"?',o:['O','P','W','!'],a:1},
{q:'7 − 3 × 2 = ?',o:['8','1','2','4'],a:1},
{q:'Tap the SMALLEST number',o:['0.5','0.25','0.9','2'],a:1},
{q:'How many sides does a comic panel have?',o:['3','5','4','6'],a:2},
{q:'"BAM" backwards is…',o:['MAB','BAM','MAA','BAA'],a:0},
{q:'15 ÷ 3 = ?',o:['3','5','6','12'],a:1},
{q:'Which word is a verb?',o:['Run!','Blue','Loud','Quickly'],a:0},
{q:'9 + 1 × 0 = ?',o:['0','10','9','1'],a:2},
{q:'Opposite of "HERO"?',o:['Zero','Villain','Cape','Pow'],a:1},
{q:'How many letters in "KAPOW"?',o:['4','6','5','3'],a:2}];
let idx,score,focus,timer,playing,best=+localStorage.getItem('ft_best')||0,streak=0;
document.getElementById('b').textContent=best;
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.07,t='square'){const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=.09;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
function ask(){if(idx>=12)return end();
const q=QS[idx];document.getElementById('n').textContent=idx+1;
document.getElementById('q').textContent=q.q;
const o=document.getElementById('opts');o.innerHTML='';
q.o.forEach((opt,i)=>{const b=document.createElement('button');b.textContent=opt;
b.onclick=()=>pick(i);o.appendChild(b);});
document.getElementById('fb').textContent='';clearInterval(timer);
focus=100;updBar();
timer=setInterval(()=>{focus-=2.5;updBar();if(focus<=0){clearInterval(timer);hurt('⏳ Too slow! Focus drained.');}},120);}
function updBar(){document.getElementById('pb').style.width=Math.max(0,focus)+'%';document.getElementById('f').textContent=Math.max(0,Math.round(focus));}
function pick(i){clearInterval(timer);
const q=QS[idx];const ok=i===q.a;
[...document.getElementById('opts').children].forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('ok');else if(j===i&&!ok)b.classList.add('bad');});
if(ok){streak++;const bonus=streak>=3?streak*5:0;score+=Math.round(focus/10)+10+bonus;document.getElementById('sc').textContent=score;beep(700,.1,'triangle');
document.getElementById('fb').textContent='POW! +'+(Math.round(focus/10)+10+bonus)+(streak>=2?' 🔥x'+streak:'');document.getElementById('fb').style.color='#16a34a';}
else {streak=0;hurt('✗ WRONG! Focus -25');}}
function hurt(msg){focus-=25;updBar();beep(150,.2,'sawtooth');
document.getElementById('fb').textContent=msg;document.getElementById('fb').style.color='#dc2626';
if(focus<=0){playing=false;setTimeout(end,700);return;}
idx++;setTimeout(ask,800);}
function end(){playing=false;clearInterval(timer);if(score>best){best=score;localStorage.setItem('ft_best',best);document.getElementById('b').textContent=best;}
const r=score>=120?'🦸 SUPERHERO':score>=80?'🦹 SIDEKICK':score>=40?'🗞️ CIVILIAN':'💤 ASLEEP';
document.getElementById('od').innerHTML=r+'<br>Score: <b style="font-size:1.5rem;color:#dc2626">'+score+'</b>';
document.getElementById('btn').textContent='REBOOT ORIGIN';document.getElementById('ov').style.display='flex';}
window.addEventListener('keydown',e=>{if(document.getElementById('ov').style.display==='flex')return;
const k=e.key;if(k>='1'&&k<='4'){const b=document.querySelectorAll('#opts button')[+k-1];if(b&&!b.disabled)b.click();}});
document.getElementById('btn').onclick=()=>{audio.resume();idx=0;score=0;focus=100;playing=true;
document.getElementById('sc').textContent=0;document.getElementById('f').textContent=100;
document.getElementById('ov').style.display='none';ask();};
</script>
</body>
</html>
