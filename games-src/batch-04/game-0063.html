<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Party Game: Neon Edition</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{background:#05050a;font-family:'Segoe UI',Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;overflow:hidden}
#top{text-align:center;padding:8px;color:#22d3ee;font-size:.9rem}
#top b{color:#f0abfc}
#arena{flex:1;display:flex;position:relative}
.half{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:box-shadow .15s,filter .1s}
#h1{background:radial-gradient(circle,#0ea5e933,transparent)}
#h2{background:radial-gradient(circle,#d946ef33,transparent)}
.score{font-size:3.4rem;font-weight:800;color:#fff}
.lbl{color:#94a3b8;font-size:.8rem;margin-top:4px}
#cmd{position:fixed;top:44%;left:50%;transform:translate(-50%,-50%);font-size:1.9rem;font-weight:800;text-align:center;pointer-events:none;text-shadow:0 0 20px currentColor;z-index:4;min-height:2.4rem}
#ov{position:fixed;inset:0;background:rgba(5,5,10,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#e2e8f0;padding:20px;z-index:9}
button{background:#22d3ee;color:#05050a;border:none;font-weight:800;padding:13px 38px;border-radius:30px;font-size:1.05rem;cursor:pointer;margin-top:16px}
@media(max-width:480px){.score{font-size:2.4rem}#cmd{font-size:1.3rem}}
</style>
</head>
<body>
<div id="top">⚡ NEON PARTY — <span id="who">…</span> | ⏱ <b id="t">10</b>s | P1 <b id="s1">0</b> — <b id="s2">0</b> P2</div>
<div id="arena">
<div class="half" id="h1"><div class="score" id="sc1">0</div><div class="lbl">P1 — tap left · press Q</div></div>
<div class="half" id="h2"><div class="score" id="sc2">0</div><div class="lbl">P2 — tap right · press P</div></div>
</div>
<div id="cmd"></div>
<div id="ov"><h2 style="color:#22d3ee">⚡ NEON PARTY</h2><p id="od">2 players, rapid-fire party chaos! Commands appear — tap your half (or key) when YOUR color flashes. Trap commands punish hasty fingers. Most points in 10 seconds wins the round; best of 3.</p><button id="btn">PLUG IN</button></div>
<script>
"use strict";
let s1,s2,time,playing,cmdTO,tickTO,target,round,scores;let npw=+localStorage.getItem('np_w1')||0,npw2=+localStorage.getItem('np_w2')||0;
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.06,t='square'){if(!playing)return;const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=.09;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
const CMDS=[{t:'⚡ CYAN FLASH!',p:1,ok:1},{t:'💜 PINK FLASH!',p:2,ok:1},{t:'☠️ BLACKOUT — NOBODY TAP!',p:0,ok:0},{t:'🌈 BOTH TAP!',p:3,ok:1}];
const cmd=document.getElementById('cmd'),who=document.getElementById('who');
function setGlow(p){document.getElementById('h1').style.boxShadow=p===1||p===3?'inset 0 0 140px #22d3ee':'none';
document.getElementById('h2').style.boxShadow=p===2||p===3?'inset 0 0 140px #d946ef':'none';}
function next(){const c=CMDS[(Math.random()*CMDS.length)|0];target=c;
cmd.textContent=c.t;cmd.style.color=c.p===1?'#22d3ee':c.p===2?'#f0abfc':c.p===3?'#fde047':'#71717a';
who.textContent=c.ok?(c.p===3?'EVERYONE TAP!':'P'+c.p+' TAP!'):'HOLD!';
setGlow(c.p);
cmdTO=setTimeout(next,900+Math.random()*700);}
function tap(p){if(!playing)return;
if(target&&target.ok&&(target.p===p||target.p===3)){if(p===1){s1++;document.getElementById('sc1').textContent=s1;}else{s2++;document.getElementById('sc2').textContent=s2;}
beep(p===1?620:780,.06);target=null;setGlow(0);}
else if(target&&!target.ok){if(p===1){s1=Math.max(0,s1-1);document.getElementById('sc1').textContent=s1;}else{s2=Math.max(0,s2-1);document.getElementById('sc2').textContent=s2;}
beep(140,.15,'sawtooth');target=null;setGlow(0);cmd.textContent='💀 TRAPPED!';}
else beep(200,.05);}
document.getElementById('h1').addEventListener('pointerdown',()=>{audio.resume();tap(1);});
document.getElementById('h2').addEventListener('pointerdown',()=>{audio.resume();tap(2);});
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='q')tap(1);if(k==='p')tap(2);});
function startRound(){s1=0;s2=0;time=10;playing=true;
document.getElementById('sc1').textContent=0;document.getElementById('sc2').textContent=0;
next();clearInterval(tickTO);
tickTO=setInterval(()=>{time--;document.getElementById('t').textContent=time;
if(time<=0)endRound();},1000);}
function endRound(){playing=false;clearInterval(tickTO);clearTimeout(cmdTO);setGlow(0);cmd.textContent='';
scores.push(s1>s2?0:s2>s1?1:-1);
const w=[scores.filter(x=>x===0).length,scores.filter(x=>x===1).length];
if(w[0]>=2||w[1]>=2){const win=w[0]>w[1]?1:2;
if(win===1){npw++;localStorage.setItem('np_w1',npw);}else{npw2++;localStorage.setItem('np_w2',npw2);}
document.getElementById('od').innerHTML='🏆 <b style="color:#fde047">PLAYER '+win+' LIGHTS UP THE NIGHT!</b>';
document.getElementById('btn').textContent='PLAY AGAIN';scores=[];}
else{document.getElementById('od').innerHTML='Round done — '+s1+' : '+s2+'. Next round!';
document.getElementById('btn').textContent='NEXT ROUND';}
document.getElementById('ov').style.display='flex';}
document.getElementById('btn').onclick=()=>{audio.resume();document.getElementById('ov').style.display='none';if(!scores)scores=[];startRound();};
</script>
</body>
</html>
