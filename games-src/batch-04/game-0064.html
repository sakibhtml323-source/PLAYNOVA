<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>

<script>window.__pnNoPad=true;</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#fde7f1;font-family:'Segoe UI',system-ui,Arial,sans-serif;color:#7a1646;display:flex;flex-direction:column;align-items:center;overflow:hidden;padding:max(6px,env(safe-area-inset-top)) 6px max(6px,env(safe-area-inset-bottom))}
#hud{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;font-size:.82rem;margin:2px 0 6px;color:#7a1646}
#hud span{background:rgba(255,255,255,.75);border:1px solid rgba(190,24,93,.25);border-radius:999px;padding:3px 12px;white-space:nowrap}
#hud b{color:#be185d;font-variant-numeric:tabular-nums}
#wrap{position:relative;touch-action:none;width:100%;display:flex;justify-content:center}
#box{position:relative}
canvas{display:block;border-radius:16px;touch-action:none;box-shadow:0 8px 28px rgba(190,24,93,.25)}
#jump{margin-top:10px;width:min(380px,96%);height:74px;border:none;border-radius:22px;background:linear-gradient(180deg,#ff7eb6,#ec4899);color:#fff;font-size:1.35rem;font-weight:900;letter-spacing:1px;box-shadow:0 8px 20px rgba(236,72,153,.4),inset 0 2px 0 rgba(255,255,255,.4);touch-action:none;cursor:pointer}
#jump:active,#jump.dn{transform:scale(.97);filter:brightness(.95)}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(253,231,241,.94);border-radius:16px;text-align:center;padding:10px;z-index:5;gap:4px;overflow:auto}
.ov.hide{display:none}.ov h2{font-size:1.5rem;color:#be185d}.ov p{font-size:.86rem;line-height:1.35;max-width:340px}
.btn{background:linear-gradient(180deg,#ff7eb6,#ec4899);color:#fff;border:none;padding:11px 30px;border-radius:24px;font-size:1.02rem;font-weight:800;cursor:pointer;margin-top:6px;min-width:170px}
.btn.alt{background:rgba(190,24,93,.12);color:#9d174d;font-weight:700;font-size:.82rem;padding:7px 14px;min-width:0}
.hats{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.hat{background:#fff;border:2px solid rgba(190,24,93,.25);border-radius:12px;padding:5px 9px;font-size:.78rem;font-weight:700;cursor:pointer;color:#7a1646}
.hat.on{border-color:#ec4899;background:#ffe0ef}.hat.lock{opacity:.7}

<body>
<div id="hud"><span>📏 <b id="d">0</b>m</span><span>🍓 <b id="b2">0</b></span><span id="lv">❤❤❤</span><span>Best <b id="b">0</b>m</span></div>
<div id="wrap"><div id="box"><canvas id="c"></canvas><div class="ov" id="ov"></div></div></div>
<button id="jump">⬆ JUMP</button>
<script>
"use strict";
const $=id=>document.getElementById(id);
const W=640,H=420,GY=H-76,BX=150,cvs=$('c'),ctx=cvs.getContext('2d');
function emit(t,x){try{if(typeof pnEmit==='function')pnEmit(t,x||{})}catch(e){}}
let SV={best:0,bank:0,hats:{none:1},hat:'none'};
try{Object.assign(SV,JSON.parse(localStorage.getItem('pk_save')||'{}'));SV.best=Math.max(SV.best,+localStorage.getItem('pk_best')||0)}catch(e){}
function save(){try{localStorage.setItem('pk_save',JSON.stringify(SV));localStorage.setItem('pk_best',SV.best)}catch(e){}}
const HATS=[['none','No hat',0],['bow','🎀 Bow',40],['cap','🧢 Cap',100],['flower','🌸 Flower',180],['crown','👑 Crown',350]];
/* ---------- audio ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended'){try{AC.resume()}catch(e){}}return AC}
function tone(f,d,type,v,delay,slide){const a=ac();if(!a)return;try{const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.1,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const sfx={jump(){tone(380,.14,'triangle',.1,0,300)},dbl(){tone(560,.14,'triangle',.1,0,420)},berry(c){tone(900+Math.min(c,12)*50,.08,'square',.05);tone(1300+Math.min(c,12)*50,.09,'square',.04,.05)},land(){tone(120,.06,'sine',.08)},stomp(){tone(300,.12,'square',.09,0,250);tone(520,.12,'triangle',.08,.06)},hurt(){tone(200,.3,'sawtooth',.1,0,-120)},pow(){[600,800,1000,1300].forEach((f,i)=>tone(f,.1,'triangle',.09,i*.05))},fall(){tone(500,.5,'sine',.1,0,-420)},over(){[392,330,262,196].forEach((f,i)=>tone(f,.3,'sawtooth',.09,i*.14))},mile(){[523,659,784].forEach((f,i)=>tone(f,.16,'triangle',.1,i*.08))}};
/* ---------- layout ---------- */
let css=1,dprR=1;
function resize(){css=Math.max(.4,Math.min((innerWidth-12)/W,(innerHeight-140)/H));dprR=Math.min(devicePixelRatio||1,2)*css;cvs.width=Math.round(W*dprR);cvs.height=Math.round(H*dprR);cvs.style.width=Math.round(W*css)+'px';cvs.style.height=Math.round(H*css)+'px'}
addEventListener('resize',resize);resize();
/* ---------- helpers ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1));
const hx=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
function mix(a,b,t){const A=hx(a),B=hx(b);return 'rgb('+((A[0]+(B[0]-A[0])*t)|0)+','+((A[1]+(B[1]-A[1])*t)|0)+','+((A[2]+(B[2]-A[2])*t)|0)+')'}
/* biome: skyTop, skyBot, hillFar, hillNear, grass, soil, sun */
const BIO=[['#8fd3ff','#e8f7ff','#b9e3c4','#7cc98f','#6fd36b','#a8754a','#fff3a0'],['#ff9a76','#ffe0a8','#e8a0a8','#c76f8a','#8ccf6a','#9a5a48','#fff0b0'],['#1a1f4a','#4a3a7a','#3a3f7a','#2a2f5c','#4aa86a','#4a3a5a','#e8eaff'],['#ffb6e1','#fff0f8','#f5c2e0','#e89cc8','#8fe39a','#b87a8a','#fff'],['#bfe6ff','#f2fbff','#d8ecf8','#b4d6ee','#e8f6ff','#9fb6c8','#fff8c0']];
const bioAt=d=>{const k=Math.floor(d/500),t=Math.max(0,Math.min(1,(d%500-440)/60)),a=BIO[k%5],b=BIO[(k+1)%5];return a.map((c,i)=>mix(c,b[i],t*t*(3-2*t)))};
/* ---------- state ---------- */
let state='menu',P,segs,plats,stumps,chicks,items,parts,floats,clouds,sc=0,genX=0,dist=0,berries=0,lives=3,speed=260,time=0,shake=0,msg=null,lastMile=0,combo=0,comboT=0,jumpHeld=false,buf=0,coyote=0,held=0,curY=GY,flashT=0;
clouds=Array.from({length:7},()=>({x:Math.random()*W*1.4,y:rnd(20,130),s:rnd(.6,1.4)}));
function reset(){P={y:GY,vy:0,g:true,jumps:2,inv:0,shield:0,magnet:0,boost:0,anim:0,sq:0};segs=[];plats=[];stumps=[];chicks=[];items=[];parts=[];floats=[];sc=0;genX=-200;dist=0;berries=0;lives=3;speed=260;shake=0;lastMile=0;combo=0;curY=GY;segs.push({x0:-300,x1:420,y:GY});genX=420;gen()}
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=(sp||1)*rnd(30,170);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,life:1,r:rnd(1.5,3.8),c})}}
function ftxt(x,y,t,c,s){floats.push({x,y,t,c:c||'#fff',s:s||15,life:1})}
/* ---------- level generation ---------- */
function berryArc(x,y,n,h){for(let i=0;i<n;i++){const t=n>1?i/(n-1):.5;items.push({x:x+i*34,y:y-Math.sin(t*3.14)*h,t:'b'})}}
function gen(){while(genX<sc+W+500){const d=Math.min(1,dist/2500),r=Math.random();let len;
if(r<.30||genX<500){len=ri(300,520);segs.push({x0:genX,x1:genX+len,y:curY});berryArc(genX+60,curY-40,ri(4,7),ri(0,50));if(r>.18&&d>0)stumps.push({x:genX+len*rnd(.45,.8),y:curY,w:34,h:34});genX+=len}
else if(r<.52){const gap=ri(90,110+d*110);segs.push({x0:genX,x1:genX+260,y:curY});berryArc(genX+170,curY-50,5,70);genX+=260;berryArc(genX+gap*.1,curY-60,Math.max(3,(gap/34)|0),100);genX+=gap}
else if(r<.66){const n=ri(2,3);for(let i=0;i<n;i++){const len=ri(150,200);segs.push({x0:genX,x1:genX+len,y:curY});if(i<n-1){const ny=Math.max(GY-50,Math.min(GY+8,curY+ri(-30,24)));plats.push({x:genX+len+20,w:90,y:ny-40-ri(0,30)});genX+=len+ri(140,170);curY=ny}else genX+=len}}
else if(r<.80){len=ri(380,560);segs.push({x0:genX,x1:genX+len,y:curY});const nc=1+(d>.3?1:0);for(let i=0;i<nc;i++)chicks.push({x:genX+120+i*170,y:curY,x0:genX+10,x1:genX+len-10,vx:-ri(36,60),ph:Math.random()*6,dead:false});berryArc(genX+100,curY-70,6,60);genX+=len}
else if(r<.90){len=ri(480,640);segs.push({x0:genX,x1:genX+len,y:curY});stumps.push({x:genX+140,y:curY,w:34,h:34});stumps.push({x:genX+len-170,y:curY,w:34,h:34});if(d>.4)stumps.push({x:genX+len/2,y:curY,w:34,h:34});berryArc(genX+60,curY-110,8,30);genX+=len}
else{len=ri(300,420);segs.push({x0:genX,x1:genX+len,y:curY});items.push({x:genX+len/2,y:curY-60,t:['m','s','c'][ri(0,2)]});berryArc(genX+60,curY-45,ri(4,6),30);genX+=len}}
const lim=sc-300;segs=segs.filter(s=>s.x1>lim);plats=plats.filter(p=>p.x+p.w>lim);stumps=stumps.filter(s=>s.x>lim);chicks=chicks.filter(c=>c.x>lim);items=items.filter(i=>i.x>lim)}
const groundAt=x=>{for(const s of segs)if(x>=s.x0&&x<s.x1)return s.y;return null};
function supportAt(wx){let g=groundAt(wx);if(g===null)g=groundAt(wx+11);if(g===null)g=groundAt(wx-11);return g}
/* ---------- flow ---------- */
function start(){ac();reset();state='play';$('ov').classList.add('hide');hud()}
function hud(){$('d').textContent=Math.floor(dist);$('b2').textContent=berries;$('b').textContent=Math.max(SV.best,Math.floor(dist));$('lv').textContent='❤'.repeat(Math.max(0,lives))+'🖤'.repeat(Math.max(0,3-lives))}
function hurt(){if(P.inv>0||P.boost>0)return;if(P.shield>0){P.shield=0;P.inv=.8;burst(BX,P.y-20,'#7ab8ff',20,1.2);sfx.pow();return}
lives--;P.inv=1.4;shake=9;sfx.hurt();burst(BX,P.y-20,'#ff6b81',18,1.2);combo=0;hud();if(lives<=0)over()}
function fall(){lives--;sfx.fall();shake=8;combo=0;hud();if(lives<=0){over();return}
let nx=null;for(const s of segs)if(s.x0>sc+BX+40&&(nx===null||s.x0<nx.x0))nx=s;if(!nx){gen();nx=segs[segs.length-1]}sc=nx.x0+60-BX;P.y=nx.y-320;P.vy=0;P.g=false;P.jumps=2;P.inv=1.6;stumps=stumps.filter(s=>s.x<sc+BX-40||s.x>sc+BX+260);chicks=chicks.filter(c=>c.x<sc+BX-40||c.x>sc+BX+260)}
function over(){if(state!=='play')return;state='over';sfx.over();const d=Math.floor(dist);SV.bank+=berries;const nb=d>SV.best;if(nb)SV.best=d;save();emit('GAME_SCORE_UPDATED',{score:d});emit('GAME_LOST',{});hud();
setTimeout(()=>{menu(true,d,nb)},900)}
function hatRow(){let h='<div class="hats">';HATS.forEach(([id,name,cost])=>{const own=SV.hats[id],on=SV.hat===id;h+='<button class="hat'+(on?' on':'')+(own?'':' lock')+'" data-h="'+id+'">'+name+(own?'':' · 🍓'+cost)+'</button>'});return h+'</div>'}
function menu(after,d,nb){state='menu';const t=after?'<h2>'+(nb?'🏆 New best!':'Tumble!')+'</h2><p>Ran <b>'+d+'m</b> · 🍓 +'+berries+' · Best '+SV.best+'m</p>':'<h2>🐰 PARKOUR: CUTE ANIMALS</h2><p>Hop forever, little bun! Jump over gaps and stumps, stomp the 🐥 chicks to bounce, grab 🍓 berries and power-ups.</p>';
$('ov').innerHTML=t+'<p>🍓 Bank: <b>'+SV.bank+'</b> — spend on hats!</p>'+hatRow()+'<button class="btn" id="go">'+(after?'RUN AGAIN':'HOP TO IT')+'</button>';$('ov').classList.remove('hide');$('go').onclick=start;
$('ov').querySelectorAll('.hat').forEach(b=>b.onclick=()=>{ac();const id=b.dataset.h,cost=HATS.find(h=>h[0]===id)[2];if(SV.hats[id]){SV.hat=id;save();sfx.berry(2);menu(after,d,nb)}else if(SV.bank>=cost){SV.bank-=cost;SV.hats[id]=1;SV.hat=id;save();sfx.pow();menu(after,d,nb)}else sfx.hurt()})}
/* ---------- update ---------- */
function jump(){if(state!=='play')return;if(P.g||coyote>0){P.vy=-800;P.g=false;P.jumps=1;coyote=0;sfx.jump();burst(BX,P.y,'#fff',6,.6);P.sq=-.25;held=.2}else if(P.jumps>0){P.vy=-720;P.jumps--;sfx.dbl();burst(BX,P.y,'#ffd6ec',10,.9);P.sq=-.25;held=.15}}
function update(dt){time+=dt;const d=Math.floor(dist);const sp0=260+Math.min(280,dist*.13);speed=P.boost>0?sp0*1.5:sp0;sc+=speed*dt;dist=sc/10;gen();
buf-=dt;coyote-=dt;if(buf>0&&(P.g||coyote>0||P.jumps>0)){jump();buf=0}
P.inv-=dt;P.shield-=dt;P.magnet-=dt;P.boost-=dt;P.anim+=dt*speed*.045;P.sq*=Math.pow(.001,dt);
const wx=sc+BX;
if(P.boost>0){P.vy=0;P.y+=((GY-130)-P.y)*Math.min(1,dt*5);if(Math.random()<.6)parts.push({x:BX-18,y:P.y-12,vx:-120,vy:rnd(-20,20),life:.6,r:rnd(2,4),c:'#ffb020'})}
else{const gr=(held>0&&jumpHeld&&P.vy<0)?1100:2200;held-=dt;P.vy+=gr*dt;const py=P.y;P.y+=P.vy*dt;
if(P.vy>=0){let gy=supportAt(wx),land=null;if(gy!==null&&py<=gy+14&&P.y>=gy)land=gy;
for(const p of plats){if(wx+10>p.x&&wx-10<p.x+p.w&&py<=p.y+10&&P.y>=p.y&&(land===null||p.y<land))land=p.y}
if(land!==null){if(!P.g){sfx.land();burst(BX,land,'#e8d6b8',5,.5);P.sq=.2}P.y=land;P.vy=0;P.g=true;P.jumps=2}else{if(P.g)coyote=.1;P.g=false}}else P.g=false;
if(P.y>H+80)fall()}
/* items */
const mag=P.magnet>0?170:(P.boost>0?120:26);
for(const it of items){if(it.got)continue;const ix=it.x-sc,iy=it.y;if(it.t==='b'&&mag>30&&Math.hypot(ix-BX,iy-(P.y-24))<mag){it.x+=(BX+sc-it.x)*Math.min(1,dt*9);it.y+=((P.y-24)-it.y)*Math.min(1,dt*9)}
if(Math.hypot(ix-BX,iy-(P.y-24))<28){it.got=true;if(it.t==='b'){berries++;combo++;comboT=1.5;sfx.berry(combo);if(combo%5===0)ftxt(BX+30,P.y-56,'🍓 x'+combo,'#ff4d8d',15);burst(ix,iy,'#ff6b81',6,.7);hud()}
else{sfx.pow();P.inv=Math.max(P.inv,.3);if(it.t==='m'){P.magnet=9;msg={t:'🧲 MAGNET',l:1.2}}if(it.t==='s'){P.shield=12;msg={t:'🛡 SHIELD',l:1.2}}if(it.t==='c'){P.boost=3.2;msg={t:'🥕 CARROT RUSH!',l:1.4}}burst(ix,iy,'#ffe066',18,1.2)}}}
comboT-=dt;if(comboT<=0)combo=0;
/* stumps */
for(const s of stumps){const sx=s.x-sc;if(Math.abs(sx-BX)<26&&P.y>s.y-s.h+6&&P.y-34<s.y)hurt()}
/* chicks */
for(const c of chicks){if(c.dead)continue;c.x+=c.vx*dt;if(c.x<c.x0){c.x=c.x0;c.vx=Math.abs(c.vx)}if(c.x>c.x1){c.x=c.x1;c.vx=-Math.abs(c.vx)}c.ph+=dt*8;const cx=c.x-sc;
if(Math.abs(cx-BX)<26&&P.y>c.y-30&&P.y-34<c.y){if(P.vy>0&&P.y<c.y-10||P.boost>0){c.dead=true;P.vy=-900;P.g=false;P.jumps=1;sfx.stomp();shake=3;burst(cx,c.y-14,'#ffe066',16,1.2);ftxt(cx,c.y-34,'+25 BOUNCE!','#ff9a1a',14);berries+=2;hud()}else hurt()}}
if(P.inv<=0&&P.boost<=0){}
parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=380*dt;p.life-=dt*1.7});parts=parts.filter(p=>p.life>0);
floats.forEach(f=>{f.y-=34*dt;f.life-=dt*1.1});floats=floats.filter(f=>f.life>0);if(msg){msg.l-=dt;if(msg.l<=0)msg=null}
if(Math.floor(dist/500)>lastMile){lastMile=Math.floor(dist/500);msg={t:'🌈 '+Math.floor(dist/100)*100+'m!',l:2};sfx.mile();emit('GAME_LEVEL_COMPLETED',{level:lastMile})}
if(Math.floor(dist)!==d)hud();shake=Math.max(0,shake-dt*22)}
/* ---------- render ---------- */
function bunny(x,y,t){const run=P.g?Math.sin(P.anim*2)*8:0,air=!P.g,sq=P.sq;ctx.save();ctx.translate(x,y);if(P.inv>0&&((time*14)|0)%2&&P.boost<=0)ctx.globalAlpha=.4;
ctx.fillStyle='rgba(0,0,0,.18)';ctx.beginPath();ctx.ellipse(0,0,16,5,0,0,6.283);ctx.fill();
ctx.scale(1-sq*.5,1+sq*.5);const tilt=air?Math.max(-.35,Math.min(.35,P.vy/2400)):0;ctx.rotate(tilt);
if(P.shield>0){ctx.strokeStyle='rgba(122,184,255,'+(.6+.3*Math.sin(time*8))+')';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,-24,32,0,6.283);ctx.stroke()}
ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-18,-16,7,0,6.283);ctx.fill();
ctx.fillStyle='#f6dce8';ctx.beginPath();ctx.ellipse(-4+run*.4,-3,8,4,0,0,6.283);ctx.ellipse(8-run*.4,-3,8,4,0,0,6.283);ctx.fill();
ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(0,-20,17,15,0,0,6.283);ctx.fill();
const ea=air?(P.vy<0?-.1:.5):.1+Math.sin(P.anim*2)*.15;ctx.save();ctx.translate(2,-34);ctx.rotate(-ea-.25);ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(-2,-14,5,15,0,0,6.283);ctx.fill();ctx.fillStyle='#ffc0da';ctx.beginPath();ctx.ellipse(-2,-14,2.4,11,0,0,6.283);ctx.fill();ctx.restore();
ctx.save();ctx.translate(9,-33);ctx.rotate(-ea+.1);ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(0,-13,5,14,0,0,6.283);ctx.fill();ctx.fillStyle='#ffc0da';ctx.beginPath();ctx.ellipse(0,-13,2.4,10,0,0,6.283);ctx.fill();ctx.restore();
ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(8,-33,13,0,6.283);ctx.fill();
ctx.fillStyle='#2a1a3a';ctx.beginPath();ctx.arc(13,-35,2.6,0,6.283);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(14,-36,.9,0,6.283);ctx.fill();ctx.fillStyle='#ff8fb8';ctx.beginPath();ctx.arc(19,-31,2.2,0,6.283);ctx.fill();ctx.fillStyle='rgba(255,140,180,.45)';ctx.beginPath();ctx.arc(9,-29,3.4,0,6.283);ctx.fill();
const h=SV.hat;if(h==='bow'){ctx.fillStyle='#ff4d8d';ctx.beginPath();ctx.moveTo(2,-45);ctx.lineTo(-6,-52);ctx.lineTo(-6,-38);ctx.fill();ctx.beginPath();ctx.moveTo(2,-45);ctx.lineTo(10,-52);ctx.lineTo(10,-38);ctx.fill();ctx.beginPath();ctx.arc(2,-45,3,0,6.283);ctx.fill()}
if(h==='cap'){ctx.fillStyle='#3b82f6';ctx.beginPath();ctx.arc(7,-40,11,Math.PI,0);ctx.fill();ctx.fillRect(7,-41,16,3)}
if(h==='flower'){ctx.fillStyle='#ffd23f';for(let k=0;k<5;k++){ctx.beginPath();ctx.arc(14+Math.cos(k*1.256)*5,-44+Math.sin(k*1.256)*5,3.4,0,6.283);ctx.fill()}ctx.fillStyle='#ff7eb6';ctx.beginPath();ctx.arc(14,-44,3,0,6.283);ctx.fill()}
if(h==='crown'){ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.moveTo(-1,-44);ctx.lineTo(0,-54);ctx.lineTo(5,-47);ctx.lineTo(9,-55);ctx.lineTo(13,-47);ctx.lineTo(18,-54);ctx.lineTo(19,-44);ctx.fill()}
ctx.restore()}
function chickDraw(x,y,ph){ctx.save();ctx.translate(x,y-Math.abs(Math.sin(ph))*5);ctx.fillStyle='rgba(0,0,0,.15)';ctx.beginPath();ctx.ellipse(0,Math.abs(Math.sin(ph))*5,12,4,0,0,6.283);ctx.fill();ctx.fillStyle='#ffe066';ctx.beginPath();ctx.arc(0,-14,14,0,6.283);ctx.fill();ctx.fillStyle='#ffb020';ctx.beginPath();ctx.moveTo(-14,-14);ctx.lineTo(-22,-11);ctx.lineTo(-14,-9);ctx.fill();ctx.fillStyle='#2a1a3a';ctx.beginPath();ctx.arc(-6,-18,2.2,0,6.283);ctx.fill();ctx.strokeStyle='#ffb020';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-3,-1);ctx.lineTo(-3+Math.sin(ph)*3,3);ctx.moveTo(4,-1);ctx.lineTo(4-Math.sin(ph)*3,3);ctx.stroke();ctx.restore()}
function berry(x,y,t){ctx.save();ctx.translate(x,y+Math.sin(t*4+x*.02)*2.5);ctx.shadowColor='#ff4d6d';ctx.shadowBlur=8;ctx.fillStyle='#ff4d6d';ctx.beginPath();ctx.moveTo(0,10);ctx.bezierCurveTo(-12,2,-10,-9,0,-8);ctx.bezierCurveTo(10,-9,12,2,0,10);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#4cc95a';ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(-5,-12);ctx.lineTo(0,-10);ctx.lineTo(5,-12);ctx.fill();ctx.fillStyle='#ffe3a0';ctx.fillRect(-3,-1,1.5,1.5);ctx.fillRect(2,1,1.5,1.5);ctx.fillRect(-1,4,1.5,1.5);ctx.restore()}
function draw(dt){ctx.setTransform(dprR,0,0,dprR,0,0);ctx.save();if(shake>0)ctx.translate(rnd(-shake,shake)/2,rnd(-shake,shake)/2);
const B=bioAt(dist),night=Math.floor(dist/500)%5===2;
const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,B[0]);g.addColorStop(1,B[1]);ctx.fillStyle=g;ctx.fillRect(-10,-10,W+20,H+20);
if(night||dist%2500>1050&&dist%2500<1500){for(let i=0;i<40;i++){ctx.globalAlpha=.4+.5*Math.abs(Math.sin(time+i));ctx.fillStyle='#fff';ctx.fillRect((i*97)%W,(i*53)%170,1.6,1.6)}ctx.globalAlpha=1}
ctx.fillStyle=B[6];ctx.beginPath();ctx.arc(520,70,28,0,6.283);ctx.fill();
clouds.forEach(c=>{c.x-=speed*.05*dt*(.6+c.s*.3);if(c.x<-120)c.x=W+100;ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.ellipse(c.x,c.y,40*c.s,13*c.s,0,0,6.283);ctx.ellipse(c.x+24*c.s,c.y-7*c.s,26*c.s,12*c.s,0,0,6.283);ctx.fill()});
function hills(par,col,amp,base,fq){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=10)ctx.lineTo(x,base+Math.sin((x+sc*par)*fq)*amp+Math.sin((x+sc*par)*fq*2.3)*amp*.4);ctx.lineTo(W,H);ctx.fill()}
hills(.12,B[2],34,GY-70,.006);hills(.28,B[3],26,GY-34,.011);
/* ground */
segs.forEach(s=>{const x0=s.x0-sc,x1=s.x1-sc;if(x1<-20||x0>W+20)return;const a=Math.max(-20,x0),w=Math.min(W+20,x1)-a;ctx.fillStyle=B[5];ctx.fillRect(a,s.y,w,H-s.y);ctx.fillStyle='rgba(0,0,0,.08)';for(let x=Math.floor(a/40)*40;x<a+w;x+=40)ctx.fillRect(x+((x*7)%13),s.y+16+((x*3)%20),10,5);ctx.fillStyle=B[4];ctx.fillRect(a,s.y,w,11);ctx.fillStyle='rgba(255,255,255,.22)';ctx.fillRect(a,s.y,w,3);
for(let x=Math.floor((a+sc)/26)*26;x<a+w+sc;x+=26){const hh=(x*2654435761>>>0)%100;if(hh<22){const px=x-sc;ctx.fillStyle=['#ff7eb6','#fff3a0','#fff'][hh%3];ctx.beginPath();ctx.arc(px,s.y-3,2.4,0,6.283);ctx.fill()}}
if(x0>-20){ctx.fillStyle=B[5];ctx.fillRect(x0-6,s.y,6,H)}});
plats.forEach(p=>{const x=p.x-sc;if(x<-120||x>W+20)return;ctx.fillStyle='#8a5a34';ctx.fillRect(x,p.y,p.w,12);ctx.fillStyle=B[4];ctx.fillRect(x-3,p.y-4,p.w+6,8);ctx.fillStyle='rgba(255,255,255,.2)';ctx.fillRect(x-3,p.y-4,p.w+6,2)});
stumps.forEach(s=>{const x=s.x-sc;if(x<-40||x>W+40)return;ctx.fillStyle='#8a5a34';ctx.fillRect(x-16,s.y-s.h,32,s.h);ctx.fillStyle='#c48a55';ctx.beginPath();ctx.ellipse(x,s.y-s.h,16,6,0,0,6.283);ctx.fill();ctx.strokeStyle='#8a5a34';ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(x,s.y-s.h,9,3.2,0,0,6.283);ctx.stroke()});
chicks.forEach(c=>{if(!c.dead){const x=c.x-sc;if(x>-30&&x<W+30)chickDraw(x,c.y,c.ph)}});
items.forEach(it=>{if(it.got)return;const x=it.x-sc;if(x<-30||x>W+30)return;if(it.t==='b')berry(x,it.y,time);else{ctx.save();ctx.translate(x,it.y+Math.sin(time*3)*4);const c={m:'#7ab8ff',s:'#5cf2a0',c:'#ff9a1a'}[it.t];ctx.shadowColor=c;ctx.shadowBlur=16;ctx.fillStyle=c;ctx.beginPath();ctx.arc(0,0,15,0,6.283);ctx.fill();ctx.shadowBlur=0;ctx.font='17px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#fff';ctx.fillText({m:'🧲',s:'🛡️',c:'🥕'}[it.t],0,1);ctx.restore()}});
if(state!=='menu'||true)bunny(BX,P?P.y:GY,time);
parts.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r*(.4+p.life*.6),0,6.283);ctx.fill()});ctx.globalAlpha=1;
floats.forEach(f=>{ctx.globalAlpha=Math.min(1,f.life*2);ctx.font='800 '+f.s+'px system-ui,sans-serif';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='rgba(120,20,70,.6)';ctx.strokeText(f.t,f.x,f.y);ctx.fillStyle=f.c;ctx.fillText(f.t,f.x,f.y)});ctx.globalAlpha=1;
if(msg){ctx.globalAlpha=Math.min(1,msg.l*2);ctx.font='900 30px system-ui,sans-serif';ctx.textAlign='center';ctx.lineWidth=5;ctx.strokeStyle='rgba(120,20,70,.65)';ctx.strokeText(msg.t,W/2,80);ctx.fillStyle='#fff';ctx.fillText(msg.t,W/2,80);ctx.globalAlpha=1}
if(combo>=5){ctx.font='800 15px system-ui';ctx.textAlign='left';ctx.fillStyle='#ff4d8d';ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.strokeText('🍓 COMBO '+combo,12,26);ctx.fillText('🍓 COMBO '+combo,12,26)}
if(P){let y=44;ctx.font='700 12px system-ui';ctx.textAlign='left';ctx.fillStyle='#7a1646';if(P.magnet>0){ctx.fillText('🧲 '+Math.ceil(P.magnet)+'s',12,y);y+=16}if(P.shield>0){ctx.fillText('🛡 '+Math.ceil(P.shield)+'s',12,y);y+=16}if(P.boost>0)ctx.fillText('🥕 '+P.boost.toFixed(1)+'s',12,y)}
ctx.restore()}
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.033,(now-last)/1000);last=now;if(state==='play')update(dt);else{time+=dt;parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=380*dt;p.life-=dt*1.7});parts=parts.filter(p=>p.life>0);if(state==='menu'||state==='over'){clouds.forEach(c=>{c.x-=12*dt})}}draw(dt)}
/* ---------- input ---------- */
function press(){ac();if(state!=='play')return;jumpHeld=true;buf=.12;if(P.g||coyote>0||P.jumps>0){jump();buf=0}}
function release(){jumpHeld=false}
cvs.addEventListener('pointerdown',e=>{e.preventDefault();press()});cvs.addEventListener('pointerup',release);cvs.addEventListener('pointercancel',release);
const jb=$('jump');jb.addEventListener('pointerdown',e=>{e.preventDefault();jb.classList.add('dn');press()});['pointerup','pointercancel','pointerleave'].forEach(t=>jb.addEventListener(t,()=>{jb.classList.remove('dn');release()}));
addEventListener('keydown',e=>{if(e.key===' '||e.key==='ArrowUp'||e.key==='w'||e.key==='W'){e.preventDefault();if(!e.repeat){if(state==='play')press();else if(!$('ov').classList.contains('hide'))$('go').click()}}});
addEventListener('keyup',e=>{if(e.key===' '||e.key==='ArrowUp'||e.key==='w'||e.key==='W')release()});
/* ---------- boot ---------- */
reset();menu(false);hud();requestAnimationFrame(loop);
window.__pk={get state(){return state},get lives(){return lives},get dist(){return dist},get berries(){return berries},P:()=>P,start,press,release,get segs(){return segs},get stumps(){return stumps},get chicks(){return chicks},get sc(){return sc},SV};
</script>
