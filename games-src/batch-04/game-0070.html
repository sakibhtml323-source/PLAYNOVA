<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Royal Gradient Traffic Control</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(135deg,#667eea,#764ba2,#f093fb);font-family:'Segoe UI',Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px;overflow:hidden}
h1{font-size:1.05rem;color:#fff;padding:6px;text-shadow:0 2px 8px rgba(0,0,0,.3)}
#hud{display:flex;gap:12px;font-size:.85rem;margin-bottom:8px;flex-wrap:wrap;justify-content:center}
#hud span{background:rgba(255,255,255,.25);backdrop-filter:blur(8px);border-radius:12px;padding:4px 12px;color:#fff;border:1px solid rgba(255,255,255,.35)}
canvas{border-radius:12px;touch-action:none;box-shadow:0 8px 30px rgba(0,0,0,.3)}
#ov{position:fixed;inset:0;background:rgba(102,126,234,.94);backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:20px;z-index:5}
button{background:rgba(255,255,255,.92);color:#667eea;border:none;font-weight:800;padding:12px 36px;border-radius:26px;font-size:1rem;cursor:pointer;margin-top:14px}
</style>
</head>
<body>
<h1>🚦 ROYAL GRADIENT TRAFFIC</h1>
<div id="hud"><span>⏱ <b id="t">0</b>s</span><span>🚗 Passed <b id="p">0</b></span><span>💥 Crashes <b id="c">0</b>/3</span><span>🔥 Flow <b id="f">0</b>%</span><span>Best <b id="b">0</b></span></div>
<canvas id="cv"></canvas>
<div id="ov"><h2>GRADIENT CROSSING</h2><p id="od">Tap the lights to switch them! Cars flow from all four directions — green lets them pass, red holds them. Cars that wait too long lose patience. Three crashes and the royal road closes!</p><button id="btn">TAKE THE POST</button></div>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d');const W=440,H=440;cvs.width=W;cvs.height=H;
const CX=W/2,CY=H/2;
let cars,lights,playing,time,passed,crashes,flow,best=+localStorage.getItem('tc2_best')||0;
document.getElementById('b').textContent=best;
const DIRS=[{dx:0,dy:-1,opp:2,col:'#f472b6'},{dx:1,dy:0,opp:3,col:'#60a5fa'},{dx:0,dy:1,opp:0,col:'#4ade80'},{dx:-1,dy:0,opp:1,col:'#fbbf24'}];
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.07,t='sine'){if(!playing)return;const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=.09;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
function resize(){const s=Math.min((window.innerWidth-12)/W,(window.innerHeight-160)/H);cvs.style.width=W*s+'px';cvs.style.height=H*s+'px';}
window.addEventListener('resize',resize);resize();
function init(){cars=[];lights=[false,false,false,false];playing=true;time=0;passed=0;crashes=0;flow=0;
document.getElementById('p').textContent=0;document.getElementById('c').textContent=0;document.getElementById('f').textContent=0;}
function spawn(){const d=(Math.random()*4)|0;
// don't spawn if car already near edge of that lane
if(cars.some(c=>c.dir===d&&c.prog<50))return;
cars.push({dir:d,prog:-20,sp:1.2+Math.random()*0.7,patience:100});}
cvs.addEventListener('pointerdown',e=>{if(!playing)return;audio.resume();const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
// nearest light quadrant
const q=x<CX?(y<CY?0:3):(y<CY?1:2);
lights[q]=!lights[q];beep(lights[q]?700:400,.06);});
window.addEventListener('keydown',e=>{if(!playing)return;const k=e.key;
if(k==='1'||k==='2'||k==='3'||k==='4'){lights[+k-1]=!lights[k];beep(600,.05);}});
function step(){time++;if(time%70===0)spawn();
flow=0;
cars.forEach(c=>{const D=DIRS[c.dir];
const atLight=Math.abs(c.prog)<14;
if(atLight&&lights[c.dir]){ // green: go
c.prog+=c.sp;}
else if(atLight){c.patience-=0.35;flow+=1;
if(c.patience<=0){c.ran=true;c.prog+=c.sp*0.6;}}
else c.prog+=c.sp;
// collision at center
if(Math.abs(c.prog)<10){cars.forEach(o=>{if(o!==c&&Math.abs(o.prog)<10&&o.dir!==c.dir&&DIRS[o.dir].opp!==c.dir){
crashes++;document.getElementById('c').textContent=crashes;cars.splice(cars.indexOf(c),1);cars.splice(cars.indexOf(o),1);
beep(120,.3,'sawtooth');if(crashes>=3)gameOver();}});}
// exit
if(c.prog>260){cars.splice(cars.indexOf(c),1);passed++;document.getElementById('p').textContent=passed;
if(!c.ran)beep(660,.06,'triangle');}});
document.getElementById('f').textContent=Math.min(100,Math.floor(cars.length*8+flow*3));
if(time%600===0&&passed>0){if(passed>best){best=passed;localStorage.setItem('tc2_best',best);document.getElementById('b').textContent=best;}}}
function gameOver(){playing=false;
if(passed>best){best=passed;localStorage.setItem('tc2_best',best);document.getElementById('b').textContent=best;}
document.getElementById('od').innerHTML='💥 Third crash! The royal road closes.<br>Cars delivered: <b style="color:#fde047">'+passed+'</b> in '+(time/60|0)+'s';
document.getElementById('btn').textContent='REOPEN ROAD';document.getElementById('ov').style.display='flex';}
function draw(){ctx.fillStyle='#3b0764';ctx.fillRect(0,0,W,H);
// roads
ctx.fillStyle='#4c1d95';
ctx.fillRect(CX-30,0,60,H);ctx.fillRect(0,CY-30,W,60);
// gradients on roads
const g2=ctx.createLinearGradient(0,0,W,H);g2.addColorStop(0,'#667eea66');g2.addColorStop(1,'#f093fb66');
ctx.fillStyle=g2;ctx.fillRect(CX-30,0,60,H);ctx.fillRect(0,CY-30,W,60);
// lights
[[CX-52,CY-52],[CX+52,CY-52],[CX+52,CY+52],[CX-52,CY+52]].forEach((p,i)=>{
ctx.fillStyle=lights[i]?'#4ade80':'#ef4444';ctx.beginPath();ctx.arc(p[0],p[1],11,0,7);ctx.fill();
ctx.strokeStyle='#fff';ctx.stroke();});
cars.forEach(c=>{const D=DIRS[c.dir];
const x=CX+D.dx*c.prog,y=CY+D.dy*c.prog;
const ang=Math.atan2(D.dy,D.dx);
ctx.save();ctx.translate(x,y);ctx.rotate(ang);
ctx.fillStyle=D.col;ctx.fillRect(-12,-7,24,14);
ctx.fillStyle='#fff';ctx.fillRect(2,-5,5,10);ctx.restore();
if(c.patience<40){ctx.fillStyle='#ef4444';ctx.font='11px serif';ctx.textAlign='center';ctx.fillText('!',x,y-14);}});}
function loop(){if(playing){step();draw();}requestAnimationFrame(loop);}
document.getElementById('btn').onclick=()=>{audio.resume();init();document.getElementById('ov').style.display='none';};
loop();
</script>
</body>
</html>
