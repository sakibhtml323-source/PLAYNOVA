<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Royal Jester Juggle #345</title><style>
body{margin:0;font-family:system-ui;background:#1e1b4b;color:#eef2ff;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a5b4fc;font-size:.78rem}
canvas{background:#312e81;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#1e1b4b;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🤹 Royal Jester Juggle</h1><div class="sub">Tap the balls to keep them airborne — the court demands a show!</div>
<div id="hud"><span>Juggles <b id="j">0</b></span><span>Balls <b id="b">1</b></span><span>Best <b id="be">0</b></span></div>
<canvas id="cv" width="440" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">🎪</div><p>Tap balls to bounce them up.<br>Keep them all in the air!</p><button id="btn">Perform</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=400,GY=H-40;
let balls=[],juggles=0,playing=false,best=+localStorage.getItem('rjj_best')||0;
document.getElementById('be').textContent=best;
const COLS=['#ef4444','#3b82f6','#22c55e','#f59e0b','#a855f7'];
function addBall(){balls.push({x:80+Math.random()*(W-160),y:60,vy:0,r:16,
c:COLS[balls.length%5]});}
function tap(e){if(!playing)return;const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
balls.forEach(b=>{if(Math.hypot(b.x-x,b.y-y)<b.r+12){b.vy=-9;juggles++;
document.getElementById('j').textContent=juggles;
beep(400+juggles*20,.07);
if(juggles>best){best=juggles;localStorage.setItem('rjj_best',best);document.getElementById('be').textContent=best;}
if(juggles%10===0&&balls.length<5){addBall();
document.getElementById('b').textContent=balls.length;}}});}
cvs.addEventListener('pointerdown',tap);
function step(){balls.forEach(b=>{b.vy+=0.4;b.y+=b.vy;
if(b.y>GY-b.r){b.y=GY-b.r;playing=false;beep(130,.35,'sawtooth');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='💔 A ball dropped!<br>Juggles: <b style="color:#fbbf14">'+juggles+'</b>';}});}
function draw(){ctx.fillStyle='#312e81';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#4338ca';ctx.fillRect(0,GY,W,H-GY);
ctx.font='28px serif';ctx.textAlign='center';ctx.fillText('🤹',W/2,GY+30);
balls.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);
ctx.fillStyle=b.c;ctx.fill();ctx.strokeStyle='#fff3';ctx.stroke();});
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{balls=[];juggles=0;addBall();
document.getElementById('j').textContent=0;document.getElementById('b').textContent=1;
document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();};
</script></body></html>
