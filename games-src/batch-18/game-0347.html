<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Rhythm Hop #347</title><style>
body{margin:0;font-family:system-ui;background:#1c1917;color:#fafaf9;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a8a29e;font-size:.78rem}
canvas{background:#292524;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#1c1917;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🥁 Desert Rhythm Hop</h1><div class="sub">Hop the stones on the beat — miss a beat and you fall!</div>
<div id="hud"><span>Stones <b id="s">0</b></span><span>Combo <b id="c">×1</b></span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="440" height="380"></canvas>
<div id="ov"><div style="font-size:3rem">🎵</div><p>Tap/Space on the pulse to hop.<br>Stay on the rhythm path!</p><button id="btn">Hop</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=380,GY=H-60;
const BPM=100,BEAT=60/BPM;
let stones=[],me={x:60,y:GY},beatT=0,lastBeat=-1,score=0,combo=1,playing=false,best=+localStorage.getItem('drh_best')||0;
document.getElementById('b').textContent=best;
function spawnStone(){stones.push({x:W+40,y:GY});}
function hop(){if(!playing)return;
const phase=beatT%BEAT;const off=Math.min(phase,BEAT-phase);
if(off<0.12){combo=Math.min(combo+1,12);beep(600+combo*40,.08,'triangle');
document.getElementById('c').textContent='×'+combo;}
else{combo=1;beep(300,.1,'sawtooth');document.getElementById('c').textContent='×1';}
// move forward one stone
if(stones.length&&stones[0].x<me.x+30){stones.shift();}
me.x+=0;score+=combo;
document.getElementById('s').textContent=score;
if(score>best){best=score;localStorage.setItem('drh_best',best);document.getElementById('b').textContent=best;}}
cvs.addEventListener('pointerdown',hop);
document.addEventListener('keydown',e=>{if(e.code==='Space')hop();});
function step(){beatT+=1/60;
if(beatT-lastBeat>=BEAT){lastBeat=beatT;spawnStone();beep(200,.05);}
// scroll world
me.x-=2.6;stones.forEach(s=>s.x-=2.6);
stones=stones.filter(s=>s.x>-40);
// check on stone
const onStone=stones.some(s=>Math.abs(s.x-me.x)<28);
if(!onStone){die();}}
function die(){if(!playing)return;playing=false;beep(130,.35,'sawtooth');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🌊 Fell off the path!<br>Score: <b style="color:#fbbf14">'+score+'</b>';}
function draw(){ctx.fillStyle='#292524';ctx.fillRect(0,0,W,H);
// beat pulse
const phase=(beatT%BEAT)/BEAT;
ctx.strokeStyle='#fbbf24'+(phase<0.15?'ff':'44');
ctx.beginPath();ctx.arc(me.x,me.y-20,16+phase*12,0,7);ctx.stroke();
stones.forEach(s=>{ctx.fillStyle='#57534e';
ctx.beginPath();ctx.ellipse(s.x,s.y+8,30,12,0,0,7);ctx.fill();});
ctx.font='30px serif';ctx.textAlign='center';ctx.fillText('🐪',me.x,me.y+4);
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{stones=[{x:60,y:GY},{x:140,y:GY},{x:220,y:GY}];
me={x:60,y:GY};beatT=0;lastBeat=-1;score=0;combo=1;
document.getElementById('s').textContent=0;document.getElementById('c').textContent='×1';
document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();};
</script></body></html>
