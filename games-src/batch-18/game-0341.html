<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ninja Wind Blade #341</title><style>
body{margin:0;font-family:system-ui;background:#111827;color:#f9fafb;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#9ca3af;font-size:.78rem}
canvas{background:#1f2937;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#facc15}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#facc15;color:#111827;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>⚔️ Ninja Wind Blade</h1><div class="sub">Slash the falling fruit — but don't touch the 💣 bombs!</div>
<div id="hud"><span>Score <b id="s">0</b></span><span>⏱️ <b id="t">45</b>s</span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="440" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">🥷</div><p>Drag to slash!<br>Fruit = points, bombs = game over!</p><button id="btn">Slash</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=400,FRUITS=['🍎','🍌','🍉','🍇','🍊'];
let items=[],score=0,playing=false,spawnT=0,time=45,timer=null,drag=null,best=+localStorage.getItem('nwb_best')||0;
document.getElementById('b').textContent=best;
function spawn(){const bomb=Math.random()<0.18;
items.push({x:30+Math.random()*(W-60),y:-20,vy:2+Math.random()*2.5,e:bomb?'💣':FRUITS[(Math.random()*FRUITS.length)|0],bomb,rot:0});}
cvs.addEventListener('pointerdown',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
drag={x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};});
cvs.addEventListener('pointermove',e=>{if(!drag||!playing)return;const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
// slash detection: line from drag to current
items=items.filter(it=>{
const d=distToSeg(it.x,it.y,drag.x,drag.y,x,y);
if(d<24){if(it.bomb){die();return false;}
score+=10;beep(600+score*2,.07);return false;}return true;});
document.getElementById('s').textContent=score;
drag={x,y};});
cvs.addEventListener('pointerup',()=>{drag=null;});
function distToSeg(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1;
const t=Math.max(0,Math.min(1,((px-x1)*dx+(py-y1)*dy)/(dx*dx+dy*dy||1)));
return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));}
function step(){spawnT++;if(spawnT>Math.max(20,42-score*0.15)){spawnT=0;spawn();}
items.forEach(it=>{it.y+=it.vy;it.rot+=0.1;});
items=items.filter(it=>it.y<H+30);}
function die(){if(!playing)return;playing=false;clearInterval(timer);beep(130,.35,'sawtooth');
if(score>best){best=score;localStorage.setItem('nwb_best',best);document.getElementById('b').textContent=best;}
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='💥 Bomb slashed!<br>Score: <b style="color:#fbbf14">'+score+'</b>';}
function draw(){ctx.fillStyle='#1f2937';ctx.fillRect(0,0,W,H);
items.forEach(it=>{ctx.save();ctx.translate(it.x,it.y);ctx.rotate(it.rot);
ctx.font='26px serif';ctx.textAlign='center';ctx.fillText(it.e,0,8);ctx.restore();});
if(drag){ctx.fillStyle='#fbbf2455';ctx.beginPath();ctx.arc(drag.x,drag.y,16,0,7);ctx.fill();}
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{items=[];score=0;spawnT=0;time=45;
document.getElementById('s').textContent=0;document.getElementById('t').textContent=45;
document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();
clearInterval(timer);timer=setInterval(()=>{time--;document.getElementById('t').textContent=time;
if(time<=0){playing=false;clearInterval(timer);
if(score>best){best=score;localStorage.setItem('nwb_best',best);document.getElementById('b').textContent=best;}
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🏁 Time!<br>Score: <b style="color:#fbbf14">'+score+'</b>';}},1000);};
</script></body></html>
