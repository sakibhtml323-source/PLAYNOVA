<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crystal Path Defense #343</title><style>
body{margin:0;font-family:system-ui;background:#0f172a;color:#e2e8f0;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#94a3b8;font-size:.78rem}
canvas{background:#1e293b;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#facc15}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#7c3aed;color:#fff;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>⚡ Crystal Path Defense</h1><div class="sub">Enemies march the path — tap them before they reach the crystal!</div>
<div id="hud"><span>❤️ <b id="h">20</b></span><span>Wave <b id="w">1</b></span><span>Zaps <b id="z">0</b></span></div>
<canvas id="cv" width="440" height="340"></canvas>
<div id="ov"><div style="font-size:3rem">💎</div><p>Tap enemies to zap them.<br>Don't let them reach your crystal!</p><button id="btn">Defend</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=340;
const PATH=[{x:0,y:80},{x:200,y:80},{x:200,y:240},{x:440,y:240}];
let foes=[],hp=20,wave=1,zaps=0,playing=false,spawnT=0,timer=null;
function spawn(){const n=2+wave;
for(let i=0;i<n;i++)foes.push({pi:0,off:i*30,hp:8+wave*4,sp:0.8+wave*0.1+Math.random()*0.4,dead:false});}
cvs.addEventListener('pointerdown',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
let hit=false;
foes.forEach(f=>{if(f.dead)return;const p=pathPos(f);
if(Math.hypot(p.x-x,p.y-y)<24){f.hp-=10;hit=true;
if(f.hp<=0){f.dead=true;zaps++;document.getElementById('z').textContent=zaps;
beep(600+zaps*20,.08,'triangle');}}});
if(!hit)beep(180,.06,'sawtooth');});
function pathPos(f){let d=f.pi*1-f.off;
// compute position along path
let seg=0,remain=f.pi*200-f.off;
for(let i=0;i<PATH.length-1;i++){const a=PATH[i],b=PATH[i+1];
const len=Math.hypot(b.x-a.x,b.y-a.y);
if(remain<=len){const t=remain/len;
return{x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t};}
remain-=len;}
return{x:PATH[PATH.length-1].x,y:PATH[PATH.length-1].y};}
function step(){spawnT++;if(spawnT>140){spawnT=0;spawn();}
foes.forEach(f=>{if(f.dead)return;
f.pi+=f.sp;
const p=pathPos(f);
if(p.x>=W-10){hp-=2;f.dead=true;beep(150,.15,'sawtooth');
document.getElementById('h').textContent=Math.max(0,hp);
if(hp<=0){playing=false;clearInterval(timer);beep(130,.35,'sawtooth');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='💎 Crystal shattered on wave '+wave+'<br>Zaps: '+zaps;}}});
foes=foes.filter(f=>!f.dead);
if(!foes.length){wave++;document.getElementById('w').textContent=wave;hp=Math.min(20,hp+4);
document.getElementById('h').textContent=hp;}}
function draw(){ctx.fillStyle='#1e293b';ctx.fillRect(0,0,W,H);
// path
ctx.strokeStyle='#334155';ctx.lineWidth=24;ctx.lineCap='round';ctx.lineJoin='round';
ctx.beginPath();ctx.moveTo(PATH[0].x,PATH[0].y);
PATH.forEach(p=>ctx.lineTo(p.x,p.y));ctx.stroke();
// crystal
ctx.font='34px serif';ctx.textAlign='center';ctx.fillText('💎',W-30,252);
foes.forEach(f=>{const p=pathPos(f);
ctx.font='24px serif';ctx.fillText('👾',p.x,p.y+8);
ctx.fillStyle='#ef4444';ctx.fillRect(p.x-12,p.y-20,24*Math.max(0,f.hp)/(8+wave*4),3);ctx.fillStyle='#e2e8f0';});
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{foes=[];hp=20;wave=1;zaps=0;spawnT=0;
document.getElementById('h').textContent=20;document.getElementById('w').textContent=1;
document.getElementById('z').textContent=0;
document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();spawn();draw();
clearInterval(timer);timer=setInterval(()=>{if(!foes.length&&playing){wave++;
document.getElementById('w').textContent=wave;hp=Math.min(20,hp+4);
document.getElementById('h').textContent=hp;spawn();}},4000);};
</script></body></html>
