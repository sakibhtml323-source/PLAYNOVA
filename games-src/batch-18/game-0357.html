<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Coin Flip #357</title><style>
body{margin:0;font-family:system-ui;background:#1c1917;color:#fafaf9;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a8a29e;font-size:.78rem}
#coin{font-size:5rem;margin:16px;transition:transform .3s}
#coin.flip{transform:rotateX(720deg)}
#hud{display:flex;gap:14px;font-size:.9rem;margin:4px}#hud b{color:#fbbf24}
#bet{display:flex;gap:8px;margin:10px}
.bet{padding:10px 20px;border-radius:10px;border:2px solid #57534e;background:#292524;color:#fff;font-weight:800;cursor:pointer;font-size:1rem}
.bet.sel{border-color:#fbbf24;background:#44403c}
#msg{min-height:1.4em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#fbbf24;color:#1c1917;font-weight:700;cursor:pointer;margin:8px}
</style></head><body>
<h1>🪙 Desert Coin Flip</h1><div class="sub">Call the flip! Win streaks multiply your gold.</div>
<div id="hud"><span>Gold <b id="g">50</b></span><span>Streak <b id="s">×1</b></span><span>Best streak <b id="b">0</b></span></div>
<div id="coin">🪙</div>
<div id="bet">
<button class="bet" data-s="heads">🙂 Heads</button>
<button class="bet" data-s="tails">🐪 Tails</button>
</div>
<div id="msg"></div>
<button id="btn">🎲 New Game</button>
<audio id="au"></audio>
<script>
"use strict";
const AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
let gold=50,streak=1,best=0,bet=null;
function msg(t){document.getElementById('msg').textContent=t;}
document.querySelectorAll('.bet').forEach(b=>b.onclick=()=>{
if(bet)return;
document.querySelectorAll('.bet').forEach(x=>x.classList.remove('sel'));
b.classList.add('sel');bet=b.dataset.s;
const result=Math.random()<0.5?'heads':'tails';
const coin=document.getElementById('coin');
coin.classList.add('flip');
setTimeout(()=>{coin.textContent=result==='heads'?'🙂':'🐪';
coin.classList.remove('flip');},350);
setTimeout(()=>{
if(bet===result){const won=10*streak;gold+=won;streak++;
document.getElementById('g').textContent=gold;
document.getElementById('s').textContent='×'+streak;
if(streak-1>best){best=streak-1;document.getElementById('b').textContent=best;}
beep(700+streak*50,.15,'triangle');msg('🎉 Correct! +'+won+'g (×'+streak+')');}
else{gold-=10;streak=1;
document.getElementById('g').textContent=gold;
document.getElementById('s').textContent='×1';
beep(200,.15,'sawtooth');msg('❌ It was '+result+'. −10g');
if(gold<=0){msg('💸 Bankrupt! Final streak: ×'+best);gold=50;
document.getElementById('g').textContent=50;}}
bet=null;
document.querySelectorAll('.bet').forEach(x=>x.classList.remove('sel'));},600);});
document.getElementById('btn').onclick=()=>{gold=50;streak=1;bet=null;
document.getElementById('g').textContent=50;document.getElementById('s').textContent='×1';
document.getElementById('coin').textContent='🪙';msg('');
AU.__c=new (window.AudioContext||window.webkitAudioContext)();};
</script></body></html>
