<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Royal Crown Tower #349</title><style>
body{margin:0;font-family:system-ui;background:#1e1b4b;color:#eef2ff;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a5b4fc;font-size:.78rem}
canvas{background:#312e81;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#1e1b4b;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>👑 Royal Crown Tower</h1><div class="sub">Crowns fall from the tower — stack them on the pedestal. Tilt your phone/mouse to keep the pile balanced!</div>
<div id="hud"><span>Stacked <b id="c">0</b></span><span>Tilt <b id="tl">0</b></span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="440" height="420"></canvas>
<div id="ov"><div style="font-size:3rem">👑</div><p>Move left/right to aim where the crown lands.<br>Stack 20 without toppling!</p><button id="btn">Build</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=420,PDX=W/2;let aim=W/2,falling=null,stack=[],lean=0,playing=false,best=+localStorage.getItem('rct_best')||0;
document.getElementById('b').textContent=best;
cvs.addEventListener('pointermove',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
aim=(e.clientX-r.left)*W/r.width;});
document.addEventListener('keydown',e=>{if(!playing)return;
if(e.key==='ArrowLeft')aim=Math.max(60,aim-22);if(e.key==='ArrowRight')aim=Math.min(W-60,aim+22);});
function newCrown(){falling={x:W/2,y:30,vx:(Math.random()*2-1)*0.6,vy:1.6+stack.length*0.06,w:64};}
function step(){if(!falling){newCrown();return;}
falling.x+=falling.vx;falling.y+=falling.vy;
if(falling.x<40){falling.x=40;falling.vx*=-1;}
if(falling.x>W-40){falling.x=W-40;falling.vx*=-1;}
// aim pull
falling.x+=(aim-falling.x)*0.04;
// landed on stack top
const topY=H-40-stack.length*14;
if(falling.y>=topY-10){const miss=falling.x-PDX;
stack.push({x:falling.x-PDX});
beep(500+stack.length*25,.08);
// lean physics
lean+=miss*0.02+stack.length*0.15*(miss<0?-1:1)*0.3;
falling=null;
document.getElementById('c').textContent=stack.length;
document.getElementById('tl').textContent=lean.toFixed(1);
if(Math.abs(lean)>30){topple();return;}
if(stack.length>best){best=stack.length;localStorage.setItem('rct_best',best);document.getElementById('b').textContent=best;}
if(stack.length>=20){playing=false;beep(880,.3,'triangle');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🏆 Royal tower complete!<br>20 crowns stacked!';}}}
function topple(){playing=false;beep(130,.35,'sawtooth');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='👑 Tower toppled at <b style="color:#fbbf14">'+stack.length+'</b> crowns!';}
function draw(){ctx.fillStyle='#312e81';ctx.fillRect(0,0,W,H);
// pedestal
ctx.fillStyle='#4338ca';ctx.fillRect(PDX-70,H-40,140,14);
// stack
stack.forEach((s,i)=>{const y=H-42-i*14;
const off=Math.max(-40,Math.min(40,s.x*0.4+lean*(i+1)*0.3));
ctx.save();ctx.translate(PDX+off,y);ctx.rotate(lean*0.01*(i+1));
ctx.font='20px serif';ctx.textAlign='center';ctx.fillText('👑',0,0);ctx.restore();});
// falling
if(falling){ctx.font='26px serif';ctx.textAlign='center';ctx.fillText('👑',falling.x,falling.y);}
// aim line
ctx.strokeStyle='#fbbf2455';ctx.beginPath();ctx.moveTo(aim,10);ctx.lineTo(aim,50);ctx.stroke();
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{stack=[];lean=0;aim=W/2;falling=null;
document.getElementById('c').textContent=0;document.getElementById('tl').textContent=0;
document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();};
</script></body></html>
