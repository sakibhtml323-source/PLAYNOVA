<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beat Bell #354</title><style>
body{margin:0;font-family:system-ui;background:#18181b;color:#fafafa;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a1a1aa;font-size:.78rem}
#bells{display:flex;gap:10px;margin:14px;flex-wrap:wrap;justify-content:center}
.bell{width:86px;height:100px;background:#27272a;border:3px solid #3f3f46;border-radius:50% 50% 12px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:32px;transition:transform .08s}
.bell.on{border-color:#facc15;background:#3f3f46;transform:scale(1.06)}
.bell .n{font-size:.75rem;color:#a1a1aa;margin-top:2px}
#pulse{width:60px;height:60px;border-radius:50%;border:4px solid #fbbf24;display:flex;align-items:center;justify-content:center;font-size:1.6rem;margin:8px}
#hud{display:flex;gap:14px;font-size:.9rem;margin:4px}#hud b{color:#facc15}
#msg{min-height:1.4em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#7c3aed;color:#fff;font-weight:700;cursor:pointer;margin:8px}
</style></head><body>
<h1>🔔 Beat Bell</h1><div class="sub">The bells chime ON the beat — watch, then repeat each toll exactly on the pulse!</div>
<div id="hud"><span>Round <b id="r">1</b></span><span>Perfect <b id="p">0</b></span><span>Best <b id="b">0</b></span></div>
<div id="pulse">💓</div>
<div id="bells"></div>
<div id="msg"></div>
<button id="btn">🎵 Begin</button>
<audio id="au"></audio>
<script>
"use strict";
const AU=document.getElementById('au');
function bell(i){const F=[330,392,494,587,659,784];
try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());
const os=o.createOscillator(),g=o.createGain();
os.type='sine';os.frequency.value=F[i];
g.gain.setValueAtTime(.16,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+.5);
os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+.5);}catch(e){}}
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const N=6,BPM=96,BEAT=60/BPM;
let seq=[],idx=0,round=1,perfect=0,best=0,phase='idle',beatT=0,lastPulse=-1,accepting=false;
function build(){const b=document.getElementById('bells');b.innerHTML='';
for(let i=0;i<N;i++){const d=document.createElement('div');d.className='bell';
d.innerHTML='🔔<span class="n">'+(i+1)+'</span>';
d.onclick=()=>tapBell(i);b.appendChild(d);}}
function flash(i){const el=document.querySelectorAll('.bell')[i];
el.classList.add('on');bell(i);
setTimeout(()=>el.classList.remove('on'),BEAT*400);}
async function show(){phase='show';accepting=false;msg('👀 Watch & listen…');
for(const i of seq){await wait(BEAT*500);flash(i);}
phase='play';idx=0;accepting=true;beatT=0;lastPulse=-1;msg('🫵 Repeat ON the beat!');loop();}
function wait(ms){return new Promise(r=>setTimeout(r,ms));}
function loop(){if(phase!=='play')return;
beatT+=1/60;
if(beatT-lastPulse>=BEAT){lastPulse=beatT;
const p=document.getElementById('pulse');
p.style.transform='scale(1.25)';p.style.borderColor='#22c55e';
beep(220,.05);
setTimeout(()=>{p.style.transform='scale(1)';p.style.borderColor='#fbbf24';},120);}
requestAnimationFrame(loop);}
function tapBell(i){if(!accepting)return;bell(i);
const el=document.querySelectorAll('.bell')[i];
el.classList.add('on');setTimeout(()=>el.classList.remove('on'),150);
if(i!==seq[idx]){accepting=false;phase='idle';beep(130,.3,'sawtooth');
msg('💥 Wrong bell! Round '+round);
if(round>best){best=round;document.getElementById('b').textContent=best;}
return;}
// timing quality
const since=beatT-lastPulse;
const off=Math.min(Math.abs(since),Math.abs(BEAT-since));
if(off<0.14){perfect++;document.getElementById('p').textContent=perfect;beep(700,.08,'triangle');}
idx++;
if(idx>=seq.length){accepting=false;phase='idle';
msg('✅ Round '+round+' clear!');round++;document.getElementById('r').textContent=round;
seq.push((Math.random()*N)|0);
setTimeout(show,900);}}
function msg(t){document.getElementById('msg').textContent=t;}
document.getElementById('btn').onclick=()=>{seq=[(Math.random()*N)|0];idx=0;round=1;perfect=0;
document.getElementById('r').textContent=1;document.getElementById('p').textContent=0;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();show();};
build();
</script></body></html>
