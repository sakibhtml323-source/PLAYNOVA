<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Coin Pusher #342</title><style>
body{margin:0;font-family:system-ui;background:#1c1917;color:#fafaf9;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a8a29e;font-size:.78rem}
canvas{background:#292524;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#1c1917;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🪙 Desert Coin Pusher</h1><div class="sub">Drop coins onto the tray — push the pile over the edge to win them!</div>
<div id="hud"><span>Coins <b id="c">10</b></span><span>Won <b id="w">0</b></span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="440" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">🎰</div><p>Tap to drop a coin.<br>Coins that fall off the front edge are yours!</p><button id="btn">Drop</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=400,EDGE_Y=H-60;
let coins=[],won=0,coinsLeft=10,playing=false,spawned=false,best=+localStorage.getItem('dcp_best')||0;
document.getElementById('b').textContent=best;
cvs.addEventListener('pointerdown',e=>{if(!playing||coinsLeft<=0)return;const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)*W/r.width;
coins.push({x,y:20,vx:(Math.random()*2-1)*0.5,vy:2,r:14});
coinsLeft--;document.getElementById('c').textContent=coinsLeft;
beep(500,.06);if(coinsLeft<=0)setTimeout(endGame,4000);});
function step(){coins.forEach(c=>{
c.vy+=0.15;c.x+=c.vx;c.y+=c.vy;
// pile collision
coins.forEach(o=>{if(o!==c){const d=Math.hypot(o.x-c.x,o.y-c.y);
if(d<28){const a=Math.atan2(c.y-o.y,c.x-o.x);
c.x=o.x+Math.cos(a)*28;c.y=o.y+Math.sin(a)*28;
c.vy*=-0.3;c.vx+=(Math.random()*2-1)*0.3;}}});
// walls
if(c.x<c.r){c.x=c.r;c.vx*=-0.5;}
if(c.x>W-c.r){c.x=W-c.r;c.vx*=-0.5;}
if(c.y<20){c.y=20;c.vy=0;}});
// off the edge
const before=coins.length;
coins=coins.filter(c=>{if(c.y>EDGE_Y){won++;document.getElementById('w').textContent=won;
beep(700,.1,'triangle');return false;}return true;});
if(won>best){best=won;localStorage.setItem('dcp_best',best);document.getElementById('b').textContent=best;}}
function endGame(){if(!playing)return;playing=false;beep(880,.3,'triangle');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🎰 Round over!<br>Won: <b style="color:#fbbf14">'+won+'</b> coins';}
function draw(){ctx.fillStyle='#292524';ctx.fillRect(0,0,W,H);
// tray
ctx.fillStyle='#57534e';ctx.fillRect(0,EDGE_Y,W,H-EDGE_Y);
ctx.fillStyle='#fbbf24';ctx.fillRect(0,EDGE_Y,W,3);
// coins
coins.forEach(c=>{ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,7);
ctx.fillStyle='#eab308';ctx.fill();ctx.strokeStyle='#a16207';ctx.stroke();
ctx.fillStyle='#a16207';ctx.font='10px serif';ctx.textAlign='center';ctx.fillText('$',c.x,c.y+3);});
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{coins=[];won=0;coinsLeft=10;
document.getElementById('c').textContent=10;document.getElementById('w').textContent=0;
document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();};
</script></body></html>
