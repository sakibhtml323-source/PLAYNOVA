<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crystal Puzzle Grid #355</title><style>
body{margin:0;font-family:system-ui;background:#0f172a;color:#e2e8f0;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#94a3b8;font-size:.78rem}
#grid{display:grid;grid-template-columns:repeat(3,90px);gap:4px;margin:12px}
.t{width:90px;height:90px;background:#1e293b;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:34px;cursor:pointer;transition:all .12s}
.t.hole{background:#0f172a;border:2px dashed #334155}
.t.ok{background:#14532d}
#hud{display:flex;gap:14px;font-size:.9rem;margin:4px}#hud b{color:#facc15}
#msg{min-height:1.3em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#7c3aed;color:#fff;font-weight:700;cursor:pointer;margin:8px}
</style></head><body>
<h1>🧩 Crystal Puzzle Grid</h1><div class="sub">Slide the tiles into the empty space — restore the crystal order!</div>
<div id="hud"><span>Moves <b id="m">0</b></span><span>Best <b id="b">—</b></span><span>Level <b id="l">1</b></span></div>
<div id="grid"></div><div id="msg"></div>
<button id="btn">✨ New Puzzle</button>
<audio id="au"></audio>
<script>
"use strict";
const AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const N=3;const GEMS=['💎','🔮','👑','⚜️','🌟','💠','🪩','🔷',''];
let board=[],moves=0,best=+localStorage.getItem('cpg_best')||Infinity,level=1;
document.getElementById('b').textContent=best<Infinity?best:'—';
function gen(){board=GEMS.slice();let hole=8;
for(let i=0;i<80+level*10;i++){
const opts=[];const r=(hole/N)|0,c=hole%N;
if(r>0)opts.push(hole-N);if(r<2)opts.push(hole+N);
if(c>0)opts.push(hole-1);if(c<2)opts.push(hole+1);
const p=opts[(Math.random()*opts.length)|0];
board[hole]=board[p];board[p]='';hole=p;}
moves=0;document.getElementById('m').textContent=0;
document.getElementById('l').textContent=level;
render();msg('Restore the crystal grid!');}
function tap(i){if(board[i]==='')return;
const hole=board.indexOf('');
const r=(i/N)|0,c=i%N,hr=(hole/N)|0,hc=hole%N;
if(Math.abs(r-hr)+Math.abs(c-hc)!==1){beep(160,.06,'sawtooth');return;}
board[hole]=board[i];board[i]='';moves++;document.getElementById('m').textContent=moves;
beep(400+moves*10,.05);render();check();}
function check(){if(board.every((v,i)=>v===GEMS[i])){beep(880,.3,'triangle');
if(moves<best){best=moves;localStorage.setItem('cpg_best',best);document.getElementById('b').textContent=best;}
msg('🎉 Restored in '+moves+'! Level '+(level+1));pnEmit('GAME_LEVEL_COMPLETED',{level:level});level++;
setTimeout(gen,1000);}}
function render(){const g=document.getElementById('grid');g.innerHTML='';
board.forEach((v,i)=>{const d=document.createElement('div');
d.className='t'+(v===''?' hole':v===GEMS[i]?' ok':'');
d.textContent=v;
d.onclick=()=>{AU.__c=AU.__c||new (window.AudioContext||window.webkitAudioContext)();tap(i);};
g.appendChild(d);});}
function msg(t){document.getElementById('msg').textContent=t;}
document.getElementById('btn').onclick=()=>{AU.__c=new (window.AudioContext||window.webkitAudioContext)();gen();};
gen();
</script></body></html>
