<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ninja Scroll Cargo #360</title><style>
body{margin:0;font-family:system-ui;background:#111827;color:#f9fafb;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#9ca3af;font-size:.78rem}
canvas{background:#1f2937;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#facc15}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#facc15;color:#111827;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>📦 Ninja Scroll Cargo</h1><div class="sub">Supplies drop onto your scroll — slide to catch them balanced. Heavy loads tip fast!</div>
<div id="hud"><span>Cargo <b id="c">0</b></span><span>Time <b id="t">0</b>s</span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="400" height="380"></canvas>
<div id="ov"><div style="font-size:3rem">🎒</div><p>Move left/right to catch falling supplies.<br>Every item shifts the balance — don't tip!</p><button id="btn">Deliver</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=400,H=380;let scroll={x:W/2,a:0,va:0},cargo=[],drops=[],playing=false,startT=0,spawnT=0,best=0;
document.getElementById('b').textContent=best;
const ITEMS=[{e:'🍙',w:1},{e:'🗡️',w:2},{e:'🏺',w:3},{e:'🍶',w:1},{e:'📜',w:2}];
cvs.addEventListener('pointermove',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
scroll.x=(e.clientX-r.left)*W/r.width;});
document.addEventListener('keydown',e=>{if(!playing)return;
if(e.key==='ArrowLeft')scroll.x=Math.max(60,scroll.x-20);
if(e.key==='ArrowRight')scroll.x=Math.min(W-60,scroll.x+20);});
function step(){spawnT++;if(spawnT>Math.max(50,110-cargo.length*8)){spawnT=0;
const it=ITEMS[(Math.random()*ITEMS.length)|0];
drops.push({x:30+Math.random()*(W-60),y:-16,e:it.e,w:it.w,vy:2.2});}
drops.forEach(d=>{d.y+=d.vy;
const sy=H-90;
if(d.y>=sy&&Math.abs(d.x-scroll.x)<46&&!d.landed){
d.landed=true;cargo.push({off:d.x-scroll.x,w:d.w,e:d.e});
beep(400+cargo.length*30,.08);
document.getElementById('c').textContent=cargo.length;}});
drops=drops.filter(d=>!d.landed&&d.y<H+20);
// physics: torque from cargo
let torque=0;cargo.forEach(c=>{torque+=c.off*0.00045*c.w;});
scroll.va+=torque;scroll.va*=0.965;scroll.a+=scroll.va;
document.getElementById('t').textContent=Math.floor((Date.now()-startT)/1000);
if(Math.abs(scroll.a)>0.75){dropAll();}}
function dropAll(){playing=false;beep(130,.35,'sawtooth');
const t=Math.floor((Date.now()-startT)/1000);
if(t>best){best=t;document.getElementById('b').textContent=best;}
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='📦 Cargo spilled!<br>Survived <b style="color:#fbbf14">'+t+'s</b> with '+cargo.length+' items';}
function draw(){ctx.fillStyle='#1f2937';ctx.fillRect(0,0,W,H);
const sy=H-90;
// scroll
ctx.save();ctx.translate(scroll.x,sy);ctx.rotate(scroll.a);
ctx.fillStyle='#d6b98a';ctx.fillRect(-70,-6,140,12);
ctx.fillStyle='#92400e';ctx.fillRect(-70,-8,12,16);ctx.fillRect(58,-8,12,16);
// cargo on scroll
cargo.forEach(c=>{const cx=c.off*Math.cos(scroll.a)-10*Math.sin(scroll.a);
const cy=c.off*Math.sin(scroll.a)-10*Math.cos(scroll.a);
ctx.font='16px serif';ctx.textAlign='center';ctx.fillText(c.e,cx,cy);});
ctx.restore();
// falling
drops.forEach(d=>{ctx.font='20px serif';ctx.textAlign='center';ctx.fillText(d.e,d.x,d.y);});
// balance meter
ctx.fillStyle='#1f2937';ctx.fillRect(W/2-60,10,120,10);
ctx.fillStyle=Math.abs(scroll.a)>0.5?'#ef4444':'#22c55e';
ctx.fillRect(W/2-3+scroll.a*60,8,6,14);
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{scroll={x:W/2,a:0,va:0};cargo=[];drops=[];spawnT=0;
document.getElementById('c').textContent=0;document.getElementById('t').textContent=0;
document.getElementById('ov').style.display='none';playing=true;startT=Date.now();
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();};
</script></body></html>
