<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Camel Race #352</title><style>
body{margin:0;font-family:system-ui;background:#1c1917;color:#fafaf9;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a8a29e;font-size:.78rem}
canvas{background:#292524;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#1c1917;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🐪 Desert Camel Race</h1><div class="sub">Tap to gallop — watch your stamina! Rest to recover, sprint to win!</div>
<div id="hud"><span>Dist <b id="d">0</b>m</span><span>Stamina <b id="s">100</b></span><span>Rivals <b id="r">0</b></span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="440" height="300"></canvas>
<div id="ov"><div style="font-size:3rem">🏁</div><p>Tap to gallop (uses stamina).<br>Reach 500m before your rivals!</p><button id="btn">Race</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=300,GY=H-50;
let me={d:0,st:100},rivals=[],dist=0,playing=false,best=+localStorage.getItem('dcr_best')||0;
document.getElementById('b').textContent=best;
function tap(){if(!playing||me.st<10)return;
me.d+=2.2;me.st=Math.max(0,me.st-12);beep(400+me.st*2,.06);
document.getElementById('d').textContent=Math.floor(me.d);
document.getElementById('s').textContent=Math.floor(me.st);
if(me.d>=500){win();}}
function win(){if(!playing)return;playing=false;beep(880,.3,'triangle');
if(Math.floor(me.d)>best){best=Math.floor(me.d);localStorage.setItem('dcr_best',best);document.getElementById('b').textContent=best;}
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🏆 You won the race!<br>Distance: <b style="color:#fbbf14">'+Math.floor(me.d)+'m</b>';}
function step(){// stamina regen
me.st=Math.min(100,me.st+0.8);
document.getElementById('s').textContent=Math.floor(me.st);
// rivals advance
rivals.forEach(r=>{r.d+=r.sp;});
document.getElementById('r').textContent=Math.max(0,...rivals.map(r=>Math.floor(500-r.d)));
// rival wins
if(rivals.some(r=>r.d>=500)){if(!playing)return;playing=false;beep(130,.35,'sawtooth');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🐪 A rival camel wins!<br>You reached '+Math.floor(me.d)+'m';}}
function draw(){ctx.fillStyle='#292524';ctx.fillRect(0,0,W,H);
// dunes
ctx.fillStyle='#44403c';
for(let i=0;i<5;i++)ctx.fillRect(0,60+i*40,W,2);
// finish line
const fx=500-me.d;
if(fx<W&&fx>0){ctx.strokeStyle='#fbbf24';ctx.setLineDash([6,6]);
ctx.beginPath();ctx.moveTo(fx,20);ctx.lineTo(fx,H-20);ctx.stroke();ctx.setLineDash([]);}
// me
ctx.font='32px serif';ctx.textAlign='center';ctx.fillText('🐪',60,GY+10);
// rivals
rivals.forEach((r,i)=>{const rx=60+(r.d-me.d)*0.5;
if(rx>-20&&rx<W+20){ctx.fillText('🐫',rx,GY-20+i*2);}});
// stamina bar
ctx.fillStyle='#1f2937';ctx.fillRect(10,10,120,12);
ctx.fillStyle=me.st>30?'#22c55e':'#ef4444';ctx.fillRect(10,10,120*me.st/100,12);
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{me={d:0,st:100};rivals=[{d:0,sp:0.9},{d:0,sp:1.0},{d:0,sp:1.1}];
document.getElementById('d').textContent=0;document.getElementById('s').textContent=100;
document.getElementById('r').textContent=500;
document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();};
</script></body></html>
