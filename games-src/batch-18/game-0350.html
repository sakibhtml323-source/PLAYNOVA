<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ninja Shadow Step #350</title><style>
body{margin:0;font-family:system-ui;background:#111827;color:#f9fafb;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#9ca3af;font-size:.78rem}
canvas{background:#1f2937;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#facc15}
#msg{min-height:1.3em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#facc15;color:#111827;font-weight:700;cursor:pointer;margin:8px}
</style></head><body>
<h1>🌙 Ninja Shadow Step</h1><div class="sub">Move with the shadows — step into the light and you're spotted!</div>
<div id="hud"><span>Level <b id="l">1</b></span><span>Spotted <b id="s">0</b>/3</span><span>Moves <b id="m">0</b></span></div>
<canvas id="cv" width="440" height="440"></canvas>
<div id="msg"></div>
<button id="btn">🌘 New Night</button>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,N=8,CELL=W/N;
let me={r:0,c:0},goal={r:7,c:7},lights=[],spotted=0,moves=0,level=1,t=0,playing=true;
function gen(){lights=[];me={r:0,c:0};goal={r:7,c:7};spotted=0;moves=0;playing=true;
const nl=Math.min(2+level,6);
for(let i=0;i<nl;i++){lights.push({
r:1+((Math.random()*(N-2))|0),c:1+((Math.random()*(N-2))|0),
dr:[0,1,0,-1][i%4],dc:[1,0,-1,0][i%4],speed:0.4+level*0.08});}
document.getElementById('l').textContent=level;
document.getElementById('s').textContent=0;
document.getElementById('m').textContent=0;
draw();msg('Reach the 🏯 — stay out of the light!');}
function lightCells(){const cells=new Set();
lights.forEach(L=>{for(let k=0;k<3;k++){
const r=L.r+L.dr*k,c=L.c+L.dc*k;
if(r>=0&&r<N&&c>=0&&c<N)cells.add(r*N+c);}});
return cells;}
function stepLights(){t++;lights.forEach(L=>{
if(t%Math.round(20/L.speed)===0){L.r+=L.dr;L.c+=L.dc;
if(L.r<1||L.r>=N-1||L.c<1||L.c>=N-1){L.dr*=-1;L.dc*=-1;L.r+=L.dr*2;L.c+=L.dc*2;}}});}
function tap(r,c){if(!playing||Math.abs(r-me.r)+Math.abs(c-me.c)!==1)return;
me={r,c};moves++;document.getElementById('m').textContent=moves;beep(400,.04);
const lit=lightCells();
if(lit.has(r*N+c)){spotted++;document.getElementById('s').textContent=spotted;
beep(150,.2,'sawtooth');me={r:0,c:0};msg('💡 Spotted! Back to start.');
if(spotted>=3){playing=false;beep(130,.35,'sawtooth');msg('🚨 The guards catch you!');draw();return;}}
else if(r===goal.r&&c===goal.c){playing=false;beep(880,.3,'triangle');
msg('🏯 Reached the castle! Level '+(level+1));level++;
setTimeout(gen,1000);return;}
stepLights();draw();}
function draw(){ctx.fillStyle='#1f2937';ctx.fillRect(0,0,W,W);
const lit=lightCells();
// cells
for(let r=0;r<N;r++)for(let c=0;c<N;c++){
if(lit.has(r*N+c)){ctx.fillStyle='#fbbf2433';
ctx.fillRect(c*CELL,r*CELL,CELL,CELL);}}
// lights
lights.forEach(L=>{ctx.fillStyle='#eab308';
ctx.beginPath();ctx.arc(L.c*CELL+CELL/2,L.r*CELL+CELL/2,10,0,7);ctx.fill();});
// goal
ctx.font='24px serif';ctx.textAlign='center';
ctx.fillText('🏯',goal.c*CELL+CELL/2,goal.r*CELL+CELL/2+8);
// me
ctx.fillText('🥷',me.c*CELL+CELL/2,me.r*CELL+CELL/2+8);}
cvs.addEventListener('pointerdown',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
const c=Math.floor((e.clientX-r.left)/r.width*N),rr=Math.floor((e.clientY-r.top)/r.height*N);
AU.__c=AU.__c||new (window.AudioContext||window.webkitAudioContext)();tap(rr,c);});
function msg(t){document.getElementById('msg').textContent=t;}
document.getElementById('btn').onclick=()=>{level=1;AU.__c=new (window.AudioContext||window.webkitAudioContext)();gen();};
gen();
</script></body></html>
