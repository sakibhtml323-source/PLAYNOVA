<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Epic Pixel Art Tower</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0f0f0f;font-family:'Courier New',monospace;color:#4ade80;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px;overflow-x:hidden}
h1{font-size:1.1rem;color:#facc15;padding:6px;letter-spacing:2px;text-shadow:2px 2px #7c3aed}
#hud{display:flex;gap:14px;font-size:.9rem;margin-bottom:8px}
@media(max-width:420px){.floor{width:140px;height:36px;font-size:.95rem}}
#tower{display:flex;flex-direction:column-reverse;gap:4px;align-items:center;margin-top:4px;min-height:300px}
.floor{width:170px;height:42px;image-rendering:pixelated;border:2px solid #4ade80;background:#1a1a2e;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.1rem;color:#4ade80;transition:transform .12s}
.floor:active{transform:scale(.96)}
.floor.merge{border-color:#facc15;box-shadow:0 0 14px #facc15aa}
#hand{margin-top:12px;font-size:.9rem;color:#4ade80}
#ov{position:fixed;inset:0;background:rgba(15,15,15,.98);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#4ade80;padding:20px;z-index:5}
button{background:#4ade80;border:none;color:#0f0f0f;font-family:inherit;font-weight:800;padding:12px 34px;font-size:1rem;cursor:pointer;margin-top:14px;box-shadow:4px 4px #14532d}
</style>
</head>
<body>
<h1>🗼 PIXEL TOWER</h1>
<div id="hud"><span>Floor <b id="l">1</b></span><span>Tower <b id="t">0</b>/12</span><span>Bits <b id="m">50</b></span><span>Best <b id="b">1</b></span></div>
<div id="tower"></div>
<div id="hand">Tap a block to place it on the pixel tower…</div>
<div id="ov"><h2 style="color:#facc15">STACK THE TOWER</h2><p id="od">Build the epic pixel tower! Place blocks from your hand — two identical adjacent blocks MERGE into the next tier. Reach the rainbow tier 🌈 to win. Too tall and it topples!</p><button id="btn">LAY FOUNDATION</button></div>
<script>
"use strict";
const TIERS=['🧱','🔩','⚙️','💡','📡','🔋','🖥️','🛰️','💠','🌈'];
let tower,hand,bits,playing,level,best=+localStorage.getItem('ept_best')||1;
document.getElementById('b').textContent=best;
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.06,t='sine'){const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=.08;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
function init(){tower=[];bits=50;playing=true;render();}
function newHand(){hand=[ri(),ri(),ri()];}
function ri(){return Math.min((Math.random()*3)|0,TIERS.length-1);}
function render(){const t=document.getElementById('tower');t.innerHTML='';
tower.forEach((v,i)=>{const r=document.createElement('div');r.className='floor';
r.textContent=TIERS[v];
if(tower[i+1]===v||tower[i-1]===v)r.classList.add('merge');
r.onclick=()=>{audio.resume();if(bits<4){beep(160,.1,'sawtooth');return;}
bits-=4;tower[i]=Math.min(v+1,TIERS.length-1);beep(600+v*60,.09);
render();check();};
t.appendChild(r);});
document.getElementById('t').textContent=tower.length;
document.getElementById('m').textContent=bits;document.getElementById('l').textContent=level;
const hd=document.getElementById('hand');hd.innerHTML='';
hand.forEach((v,i)=>{const b=document.createElement('button');
b.style.cssText='margin:0 6px;padding:8px 16px;border:2px solid #4ade80;background:#1a1a2e;color:#4ade80;border-radius:6px;cursor:pointer;font-size:1.1rem;font-family:inherit';
b.textContent=TIERS[v];
b.onclick=()=>{audio.resume();tower.push(v);hand.splice(i,1);if(!hand.length)newHand();
beep(420+tower.length*25,.07);render();check();};
hd.appendChild(b);});
const nb=document.createElement('button');nb.textContent='🎲 New hand (8 bits)';
nb.style.cssText='margin-left:10px;padding:8px 14px;border:none;background:#14532d;color:#fff;border-radius:6px;cursor:pointer;font-size:.8rem';
nb.onclick=()=>{audio.resume();if(bits>=8){bits-=8;newHand();beep(700,.08);render();}};
hd.appendChild(nb);}
function check(){let changed=true;
while(changed){changed=false;
for(let i=0;i<tower.length-1;i++){if(tower[i]===tower[i+1]&&tower[i]<TIERS.length-1){tower.splice(i,2,tower[i]+1);changed=true;break;}}}
render();
if(tower.includes(TIERS.length-1)){win();}
if(tower.length>=14){lose();}}
function win(){playing=false;if(level+1>best){best=level+1;localStorage.setItem('ept_best',best);document.getElementById('b').textContent=best;}
beep(880,.2,'triangle');setTimeout(()=>beep(1100,.2,'triangle'),150);
document.getElementById('od').innerHTML='🌈 <b style="color:#facc15">THE RAINBOW TIER!</b><br>Tower '+level+' complete at '+tower.length+' floors.';
document.getElementById('btn').textContent='NEXT TOWER';level++;bits=50;document.getElementById('ov').style.display='flex';}
function lose(){playing=false;beep(110,.5,'sawtooth');
document.getElementById('od').innerHTML='💥 <b>The tower topples at '+tower.length+' floors!</b><br>Too tall to stand.';
document.getElementById('btn').textContent='REBUILD';document.getElementById('ov').style.display='flex';}
window.addEventListener('keydown',e=>{if(!playing)return;if(e.key>='1'&&e.key<='3'){const b=document.querySelectorAll('#hand button')[+e.key-1];if(b)b.click();}});
document.getElementById('btn').onclick=()=>{audio.resume();tower=[];if(!hand)newHand();playing=true;render();document.getElementById('ov').style.display='none';};
newHand();
</script>
</body>
</html>
