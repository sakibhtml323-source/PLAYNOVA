<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Epic Magic Coloring Book</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(#2e1065,#0f172a);font-family:Georgia,serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:8px}
h1{font-size:1.05rem;color:#c084fc;padding:4px}
#tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:6px}
.sw{width:28px;height:28px;border-radius:50%;border:3px solid #0f172a;box-shadow:0 0 8px currentColor;cursor:pointer}
.sw.sel{border-color:#fff}
#act button{background:#1e1b4b;border:1px solid #7c3aed;border-radius:8px;padding:6px 12px;cursor:pointer;margin-left:6px;font-size:.85rem;color:#e9d5ff}
canvas{background:#1a1a2e;border-radius:12px;touch-action:none;box-shadow:0 0 30px #7c3aed33}
#pages{display:flex;gap:6px;margin-top:6px}
#pages button{border:1px solid #7c3aed;background:#1e1b4b;border-radius:8px;padding:4px 10px;cursor:pointer;font-size:.8rem;color:#e9d5ff}
</style>
</head>
<body>
<h1>🪄 EPIC MAGIC COLORING</h1>
<div id="tools"></div>
<div id="act"><button id="clear">↺ Clear / Reset</button><button id="save">💾 Save</button><button id="wipe">🗑 Reset all</button><button id="prev">◀</button><button id="next">▶</button><span id="pinfo" style="font-size:.8rem;color:#c084fc;margin-left:6px"></span></div>
<canvas id="c"></canvas>
<script>
"use strict";
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
const W=480,H=420;cvs.width=W;cvs.height=H;
const COLORS=['#1a1a2e','#ff0055','#00f0ff','#fcee0a','#9d00ff','#00ff9d','#ff6b00','#ffffff'];
let color=COLORS[1],page=0,drawing=false;
const PAGES=[{n:'Dragon',d:'🐉'},{n:'Phoenix',d:'🔥'},{n:'Unicorn',d:'🦄'},{n:'Wizard',d:'🧙'}];
function resize(){const s=Math.min((window.innerWidth-16)/W,(window.innerHeight-200)/H,1);cvs.style.width=W*s+'px';cvs.style.height=H*s+'px';}
window.addEventListener('resize',resize);resize();
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f){const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=.06;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.06);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.06);}
const tl=document.getElementById('tools');
COLORS.forEach((c2,i)=>{const d=document.createElement('div');d.className='sw'+(i===1?' sel':'');d.style.background=c2;d.style.color=c2;
d.onclick=()=>{color=c2;document.querySelectorAll('.sw').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');audio.resume();beep(440+i*50);};tl.appendChild(d);});
function base(){ctx.fillStyle='#1a1a2e';ctx.fillRect(0,0,W,H);
ctx.strokeStyle='#c084fc';ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';
if(page===0){ // dragon
ctx.beginPath();ctx.moveTo(60,H-80);ctx.quadraticCurveTo(W/2,H/2-60,W-60,H-80);ctx.stroke();
ctx.beginPath();ctx.arc(W-80,H-90,34,0,7);ctx.stroke();
ctx.beginPath();ctx.moveTo(W-100,H-118);ctx.lineTo(W-118,H-150);ctx.lineTo(W-86,H-126);ctx.stroke();
ctx.beginPath();ctx.moveTo(W-66,H-118);ctx.lineTo(W-48,H-150);ctx.lineTo(W-80,H-126);ctx.stroke();
for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(120+i*70,H-95-(i%2)*14);ctx.lineTo(135+i*70,H-125-(i%2)*14);ctx.lineTo(150+i*70,H-95-(i%2)*14);ctx.stroke();}}
else if(page===1){ // phoenix
ctx.beginPath();ctx.arc(W/2,H/2,50,0,7);ctx.stroke();
for(let i=0;i<6;i++){const a=i/6*Math.PI*2;
ctx.beginPath();ctx.moveTo(W/2+Math.cos(a)*50,H/2+Math.sin(a)*50);
ctx.quadraticCurveTo(W/2+Math.cos(a)*95,H/2+Math.sin(a)*95,W/2+Math.cos(a)*75,H/2+Math.sin(a)*75+30);ctx.stroke();}
ctx.beginPath();ctx.arc(W/2-14,H/2-6,6,0,7);ctx.stroke();
ctx.beginPath();ctx.arc(W/2+14,H/2-6,6,0,7);ctx.stroke();}
else if(page===2){ // unicorn
ctx.beginPath();ctx.ellipse(W/2,H/2+30,70,44,0,0,7);ctx.stroke();
ctx.beginPath();ctx.arc(W/2+60,H/2-30,28,0,7);ctx.stroke();
ctx.beginPath();ctx.moveTo(W/2+66,H/2-58);ctx.lineTo(W/2+72,H/2-95);ctx.lineTo(W/2+78,H/2-58);ctx.stroke();
ctx.beginPath();ctx.moveTo(W/2-70,H/2+30);ctx.quadraticCurveTo(W/2-95,H/2+10,W/2-80,H/2-10);ctx.stroke();
for(let i=0;i<4;i++)ctx.strokeRect(W/2-46+i*26,H/2+66,12,34);}
else{ // wizard
ctx.beginPath();ctx.moveTo(W/2,H/2-60);ctx.lineTo(W/2-36,H/2+10);ctx.lineTo(W/2+36,H/2+10);ctx.closePath();ctx.stroke();
ctx.beginPath();ctx.moveTo(W/2-90,H/2+10);ctx.lineTo(W/2+90,H/2+10);ctx.quadraticCurveTo(W/2+80,H/2+60,W/2,H/2+60);ctx.lineTo(W/2-80,H/2+60);ctx.quadraticCurveTo(W/2-90,H/2+10,W/2-90,H/2+10);ctx.stroke();
ctx.beginPath();ctx.arc(W/2,H/2+30,60,0,Math.PI);ctx.stroke();
ctx.beginPath();ctx.moveTo(W/2-90,H/2+10);ctx.quadraticCurveTo(W/2-100,H/2-20,W/2-80,H/2-40);ctx.stroke();}}
function restore(){base();const img=localStorage.getItem('ebm_'+page);if(img){const i2=new Image();i2.onload=()=>ctx.drawImage(i2,0,0);i2.src=img;}}
function pos(e){const r=cvs.getBoundingClientRect();const p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)/r.width*W,y:(p.clientY-r.top)/r.height*H};}
function startD(e){audio.resume();drawing=true;const p=pos(e);ctx.strokeStyle=color;ctx.lineWidth=color==='#1a1a2e'?28:7;
ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+.1,p.y+.1);ctx.stroke();e.preventDefault();}
function moveD(e){if(!drawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault();}
function endD(){drawing=false;}
cvs.addEventListener('pointerdown',startD);cvs.addEventListener('pointermove',moveD);
window.addEventListener('pointerup',endD);
document.getElementById('clear').onclick=()=>{base();localStorage.removeItem('ebm_'+page);beep(220);};
document.getElementById('wipe').onclick=()=>{for(let i=0;i<4;i++)localStorage.removeItem('ebm_'+i);setPage(page);};
document.getElementById('save').onclick=()=>{localStorage.setItem('ebm_'+page,cvs.toDataURL());beep(880);
document.getElementById('pinfo').textContent='Saved ✓';setTimeout(()=>document.getElementById('pinfo').textContent='',1500);};
function setPage(p2){page=(p2+PAGES.length)%PAGES.length;restore();
document.getElementById('pinfo').textContent='Page '+(page+1)+'/'+PAGES.length+' — '+PAGES[page].n+' '+PAGES[page].d;}
document.getElementById('prev').onclick=()=>setPage(page-1);
document.getElementById('next').onclick=()=>setPage(page+1);
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();
if(k>='1'&&k<='8')document.querySelectorAll('.sw')[+k-1].click();
if(k==='c')document.getElementById('clear').click();
if(k==='s')document.getElementById('save').click();
if(k==='arrowleft')setPage(page-1);if(k==='arrowright')setPage(page+1);});
setPage(0);
</script>
</body>
</html>
