<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Coloring Book: Food Edition</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(#fff7ed,#ffedd5);font-family:Georgia,serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:8px}
h1{font-size:1.05rem;color:#c2410c;padding:4px}
#tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:6px}
.sw{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.2);cursor:pointer}
.sw.sel{border-color:#111}
#act button{background:#fff;border:1px solid #fdba74;border-radius:8px;padding:6px 12px;cursor:pointer;margin-left:6px;font-size:.85rem;color:#9a3412}
canvas{background:#fff;border-radius:12px;touch-action:none;box-shadow:0 4px 16px rgba(194,65,12,.15)}
#pages{display:flex;gap:6px;margin-top:6px}
#pages button{border:1px solid #fdba74;background:#fff;border-radius:8px;padding:4px 10px;cursor:pointer;font-size:.8rem;color:#9a3412}
</style>
</head>
<body>
<h1>🍔 FOOD COLORING BOOK</h1>
<div id="tools"></div>
<div id="act"><button id="clear">↺ Clear / Reset</button><button id="save">💾 Save</button><button id="wipe">🗑 Reset all</button><button id="prev">◀</button><button id="next">▶</button><span id="pinfo" style="font-size:.8rem;color:#9a3412;margin-left:6px"></span></div>
<canvas id="c"></canvas>
<script>
"use strict";
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
const W=480,H=420;cvs.width=W;cvs.height=H;
const COLORS=['#7c2d12','#dc2626','#f97316','#facc15','#22c55e','#0ea5e9','#8b5cf6','#ec4899','#a16207'];
let color=COLORS[1],page=0,drawing=false;
const PAGES=[{n:'Burger',d:'🍔'},{n:'Pizza',d:'🍕'},{n:'Ice Cream',d:'🍦'},{n:'Taco',d:'🌮'}];
function resize(){const s=Math.min((window.innerWidth-16)/W,(window.innerHeight-200)/H,1);cvs.style.width=W*s+'px';cvs.style.height=H*s+'px';}
window.addEventListener('resize',resize);resize();
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f){const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=.06;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.06);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.06);}
const tl=document.getElementById('tools');
COLORS.forEach((c2,i)=>{const d=document.createElement('div');d.className='sw'+(i===1?' sel':'');d.style.background=c2;
d.onclick=()=>{color=c2;document.querySelectorAll('.sw').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');audio.resume();beep(440+i*45);};tl.appendChild(d);});
function base(){ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
ctx.strokeStyle='#7c2d12';ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';
if(page===0){ // burger
ctx.beginPath();ctx.arc(W/2,H/2-40,80,Math.PI,0);ctx.stroke();
ctx.fillStyle='#7c2d12';
for(let i=0;i<6;i++){ctx.beginPath();ctx.arc(W/2-50+i*20,H/2-70+(i%2)*10,3,0,7);ctx.stroke();}
ctx.beginPath();ctx.moveTo(W/2-80,H/2-20);ctx.quadraticCurveTo(W/2,H/2+5,W/2+80,H/2-20);ctx.stroke();
ctx.beginPath();ctx.moveTo(W/2-80,H/2+10);ctx.lineTo(W/2+80,H/2+10);ctx.stroke();
ctx.beginPath();ctx.moveTo(W/2-78,H/2+30);ctx.quadraticCurveTo(W/2,H/2+55,W/2+78,H/2+30);ctx.stroke();
ctx.beginPath();ctx.arc(W/2,H/2+48,80,0,Math.PI);ctx.stroke();}
else if(page===1){ // pizza
ctx.beginPath();ctx.moveTo(W/2,70);ctx.lineTo(W/2-150,H-70);ctx.lineTo(W/2+150,H-70);ctx.closePath();ctx.stroke();
ctx.beginPath();ctx.moveTo(W/2,110);ctx.lineTo(W/2-120,H-80);ctx.lineTo(W/2+120,H-80);ctx.closePath();ctx.stroke();
for(let i=0;i<7;i++){ctx.beginPath();ctx.arc(W/2-60+(i*37)%120,140+(i*53)%140,11,0,7);ctx.stroke();}}
else if(page===2){ // ice cream
ctx.beginPath();ctx.arc(W/2-30,H/2-50,42,0,7);ctx.stroke();
ctx.beginPath();ctx.arc(W/2+30,H/2-50,42,0,7);ctx.stroke();
ctx.beginPath();ctx.arc(W/2,H/2-85,44,0,7);ctx.stroke();
ctx.beginPath();ctx.moveTo(W/2-44,H/2-10);ctx.lineTo(W/2,H/2+130);ctx.lineTo(W/2+44,H/2-10);ctx.stroke();
for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(W/2-32+i*22,H/2+16);ctx.lineTo(W/2-16+i*22,H/2+80);ctx.stroke();}}
else{ // taco
ctx.beginPath();ctx.arc(W/2,H/2+60,110,Math.PI,0);ctx.stroke();
ctx.beginPath();ctx.moveTo(W/2-110,H/2+60);ctx.lineTo(W/2+110,H/2+60);ctx.stroke();
for(let i=0;i<6;i++){ctx.beginPath();ctx.arc(W/2-80+i*32,H/2-10+(i%2)*18,12,0,7);ctx.stroke();}}}
function restore(){base();const img=localStorage.getItem('cbf_'+page);if(img){const i2=new Image();i2.onload=()=>ctx.drawImage(i2,0,0);i2.src=img;}}
function pos(e){const r=cvs.getBoundingClientRect();const p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)/r.width*W,y:(p.clientY-r.top)/r.height*H};}
function startD(e){audio.resume();drawing=true;const p=pos(e);ctx.strokeStyle=color;ctx.lineWidth=color==='#a16207'?28:7;
ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+.1,p.y+.1);ctx.stroke();e.preventDefault();}
function moveD(e){if(!drawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault();}
function endD(){drawing=false;}
cvs.addEventListener('pointerdown',startD);cvs.addEventListener('pointermove',moveD);
window.addEventListener('pointerup',endD);
document.getElementById('clear').onclick=()=>{base();localStorage.removeItem('cbf_'+page);beep(220);};
document.getElementById('wipe').onclick=()=>{for(let i=0;i<4;i++)localStorage.removeItem('cbf_'+i);setPage(page);};
document.getElementById('save').onclick=()=>{localStorage.setItem('cbf_'+page,cvs.toDataURL());beep(880);
document.getElementById('pinfo').textContent='Saved ✓';setTimeout(()=>document.getElementById('pinfo').textContent='',1500);};
function setPage(p2){page=(p2+PAGES.length)%PAGES.length;restore();
document.getElementById('pinfo').textContent='Page '+(page+1)+'/'+PAGES.length+' — '+PAGES[page].n+' '+PAGES[page].d;}
document.getElementById('prev').onclick=()=>setPage(page-1);
document.getElementById('next').onclick=()=>setPage(page+1);
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();
if(k>='1'&&k<='9'){const i=+k-1;if(i<COLORS.length)document.querySelectorAll('.sw')[i].click();}
if(k==='c')document.getElementById('clear').click();
if(k==='s')document.getElementById('save').click();
if(k==='arrowleft')setPage(page-1);if(k==='arrowright')setPage(page+1);});
setPage(0);
</script>
</body>
</html>
