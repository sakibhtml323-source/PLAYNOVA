<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Comic Book Chronicles</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#fef08a;font-family:'Comic Sans MS',cursive;color:#111;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden}
h1{font-size:1.05rem;color:#dc2626;padding:6px;text-shadow:2px 2px #fff}
#hud{display:flex;gap:14px;font-size:.9rem;margin-bottom:4px}
canvas{background:#87ceeb;border-radius:6px;border:4px solid #111;touch-action:none;box-shadow:6px 6px 0 #111}
#ov{position:fixed;inset:0;background:rgba(254,240,138,.98);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#111;padding:20px;z-index:5}
button{background:#dc2626;color:#fff;border:3px solid #111;box-shadow:4px 4px 0 #111;font-family:inherit;font-weight:700;padding:12px 34px;font-size:1rem;cursor:pointer;margin-top:14px}
</style>
</head>
<body>
<h1>💥 COMIC BOOK CHRONICLES</h1>
<div id="hud"><span>Page <b id="p">1</b></span><span>Score <b id="s">0</b></span><span>❤️ <b id="h">3</b></span><span>Best <b id="b">0</b></span></div>
<canvas id="c"></canvas>
<div id="ov"><h2 style="color:#dc2626">POW! THE CHRONICLES</h2><p id="od">3-LANE DODGER: switch lanes with Arrow Up/Down (or tap top/bottom half). Run the endless comic strip! Jump crates with Space/↑/tap, slide under speech-bubbles with ↓. Grab 💥 POW icons, dodge the grey ninjas!</p><button id="btn">ZOOM!</button></div>
<script>


"use strict";
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');const W=520,H=260;cvs.width=W;cvs.height=H;const GY=H-42;
let hero,obs,pows,playing,speed,dist,hp,frame,duck,score,best=+localStorage.getItem('cbc_best')||0;
document.getElementById('b').textContent=best;
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.06,t='square'){if(!playing)return;const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=.09;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
function resize(){const s=Math.min((window.innerWidth-12)/W,(window.innerHeight-140)/H);cvs.style.width=W*s+'px';cvs.style.height=H*s+'px';}
window.addEventListener('resize',resize);resize();
function init(){hero={x:80,y:GY,vy:0,w:24,h:30,onG:true,lane:0};obs=[];pows=[];dist=0;speed=4.6;hp=3;frame=0;duck=0;score=0;playing=true;
document.getElementById('s').textContent=0;document.getElementById('h').textContent=3;}
function jump(){if(hero.onG){hero.vy=-11;hero.onG=false;beep(520,.05);}}
function slide(){duck=22;beep(260,.05);}
const LANE=[GY,GY-56,GY-112];function laneUp(){if(hero.lane>0){hero.lane--;beep(600,.05);}}function laneDn(){if(hero.lane<2){hero.lane++;beep(500,.05);}}window.addEventListener('keydown',e=>{const k=e.key;if(k==='ArrowUp'||k==='w'||k==='W'){e.preventDefault();laneUp();}if(k==='ArrowDown'||k==='s'||k==='S'){e.preventDefault();laneDn();}});
cvs.addEventListener('pointerdown',e=>{audio.resume();const r=cvs.getBoundingClientRect();if((e.clientY-r.top)/r.height<0.5)laneUp();else laneDn();});
function step(){frame++;dist+=speed/18;speed=4.6+dist/220;score=Math.floor(dist);document.getElementById('s').textContent=score;document.getElementById('p').textContent=1+Math.floor(dist/300);
const ty=LANE[hero.lane];hero.y+=(ty-hero.y)*0.3;
if(frame%Math.max(26,52-dist/40|0)===0){const r=Math.random();
const ln=(Math.random()*3)|0,ly=LANE[ln];
if(r<0.3)obs.push({x:W+20,y:ly-22,w:30,h:22,t:'crate',lane:ln});
else if(r<0.55)obs.push({x:W+20,y:ly-52,w:44,h:14,t:'bubble',lane:ln});
else if(r<0.78)pows.push({x:W+20,y:ly-10,got:false,lane:ln});
else obs.push({x:W+20,y:ly-30,w:26,h:30,t:'ninja',lane:ln});}
obs.forEach(o=>o.x-=speed);pows.forEach(p=>p.x-=speed);
obs=obs.filter(o=>o.x>-60);pows=pows.filter(p=>p.x>-30&&!p.got);
const hh=duck>0?16:hero.h;
pows.forEach(p=>{if(p.lane!==undefined&&p.lane!==hero.lane)return;if(Math.abs(p.x-hero.x)<26){p.got=true;score+=25;beep(800,.08);}});
obs.forEach(o=>{if(o.lane!==undefined&&o.lane!==hero.lane)return;if(hero.x+hero.w/2>o.x&&hero.x-hero.w/2<o.x+o.w&&hero.y-hh<o.y+o.h&&hero.y>o.y)hit();});}
function hit(){hp--;document.getElementById('h').textContent=hp;beep(140,.25,'sawtooth');
if(hp<=0)die();}
function die(){playing=false;const d=Math.floor(dist);
if(d>best){best=d;localStorage.setItem('cbc_best',best);document.getElementById('b').textContent=best;}
document.getElementById('od').innerHTML='KABLAM! Down at <b style="color:#dc2626">'+d+'m</b>!';
document.getElementById('btn').textContent='TO BE CONTINUED…';document.getElementById('ov').style.display='flex';beep(110,.5,'sawtooth');}
function draw(){ctx.fillStyle='#87ceeb';ctx.fillRect(0,0,W,H);
// halftone
ctx.fillStyle='#11111111';for(let y=0;y<H;y+=12)for(let x=(y/12%2)*6;x<W;x+=12)ctx.fillRect(x,y,2,2);
ctx.fillStyle='#fbbf24';ctx.fillRect(0,GY,W,H-GY);
obs.forEach(o=>{if(o.t==='crate'){ctx.fillStyle='#92400e';ctx.fillRect(o.x,o.y,o.w,o.h);ctx.strokeStyle='#451a03';ctx.strokeRect(o.x,o.y,o.w,o.h);}
else if(o.t==='bubble'){ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(o.x+o.w/2,o.y+7,o.w/2,10,0,0,7);ctx.fill();
ctx.fillStyle='#111';ctx.font='bold 9px Comic Sans MS';ctx.textAlign='center';ctx.fillText('!',o.x+o.w/2,o.y+10);}
else{ctx.fillStyle='#4b5563';ctx.fillRect(o.x,o.y,o.w,o.h);
ctx.fillStyle='#111';ctx.fillRect(o.x+6,o.y+8,5,5);ctx.fillRect(o.x+15,o.y+8,5,5);}});
pows.forEach(p=>{ctx.font='16px serif';ctx.textAlign='center';ctx.fillText('💥',p.x,p.y+5);});
const hh=duck>0?16:hero.h;
ctx.fillStyle='#2563eb';ctx.fillRect(hero.x-hero.w/2,hero.y-hh,hero.w,hh);
ctx.fillStyle='#fcd34d';ctx.fillRect(hero.x-hero.w/2,hero.y-hh,hero.w,7);
ctx.fillStyle='#111';ctx.fillRect(hero.x+4,hero.y-hh+12,4,4);}
function loop(){if(playing){step();draw();}requestAnimationFrame(loop);}
document.getElementById('btn').onclick=()=>{audio.resume();init();document.getElementById('ov').style.display='none';};
loop();


</script>
</body>
</html>
