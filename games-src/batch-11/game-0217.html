<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Token Hunt Slide #217</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(#fefce8,#fef9c3);font-family:Georgia,serif;color:#713f12;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px}
h1{font-size:1.15rem;color:#a16207;padding:6px}
#hud{display:flex;gap:14px;font-size:.9rem;margin-bottom:10px}
#board{display:grid;gap:6px;touch-action:none}
.tok{box-shadow:inset 0 0 0 3px #ffd700}
.tile{width:76px;height:76px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:700;color:#fff;text-shadow:0 1px 4px #0006;cursor:pointer;transition:transform .12s}
.tile:active{transform:scale(.94)}
.tile.hole{background:transparent;box-shadow:inset 0 0 0 2px #fde68a;cursor:default}
#ov{position:fixed;inset:0;background:rgba(254,252,232,.98);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#713f12;padding:20px;z-index:5}
button{background:#a16207;border:none;color:#fff;font-family:inherit;font-weight:700;padding:12px 34px;border-radius:24px;font-size:1rem;cursor:pointer;margin-top:14px}
@media(max-width:420px){.tok{box-shadow:inset 0 0 0 3px #ffd700}
.tile{width:60px;height:60px;font-size:1.2rem}}
</style>
</head>
<body>
<h1>🏜 DESERT PUZZLE ULTIMATE</h1>
<div id="hud"><span>Ruin <b id="l">3×3</b></span><span>Moves <b id="m">0</b></span><span>Best <b id="b">—</b></span></div>
<div id="board"></div>
<div id="ov"><h2 style="color:#a16207">SAND-SLIDE RUINS</h2><p id="od">Slide the ancient tiles into the empty socket to restore the ruin — order the glyphs 1→8. Ruins grow after each solve!</p><button id="btn">EXCAVATE</button></div>
<script>
"use strict";
const PALS=['#ca8a04','#d97706','#b45309','#92400e','#78350f','#f59e0b','#fbbf24','#fde047','#facc15','#eab308','#a16207','#854d0e'];
let size,board,moves,level=0,playing,best=Infinity,tokens;
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.06){const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.value=.08;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
function init(){size=Math.min(3+level,6);const n=size*size;board=[...Array(n).keys()].slice(1).concat(0);
let hole=n-1;for(let i=0;i<n*22;i++){const opts=neigh(hole);const pick=opts[(Math.random()*opts.length)|0];
board[hole]=board[pick];board[pick]=0;hole=pick;}
if(solved()){board[0]=1;board[1]=0;}
tokens=[];const all=[...Array(n).keys()].filter(x=>x!==board.indexOf(0));for(let k=0;k<Math.min(3,Math.max(1,size-1));k++){const idx=(Math.random()*all.length)|0;tokens.push(all.splice(idx,1)[0]);}
moves=0;document.getElementById('m').textContent=0;document.getElementById('l').textContent=size+'×'+size;
best=+localStorage.getItem('dpu_best_'+size)||Infinity;document.getElementById('b').textContent=isFinite(best)?best:'—';
render();}
function neigh(i){const r=(i/size)|0,c=i%size,o=[];if(r>0)o.push(i-size);if(r<size-1)o.push(i+size);if(c>0)o.push(i-1);if(c<size-1)o.push(i+1);return o;}
function solved(){const n=size*size;for(let i=0;i<n-1;i++)if(board[i]!==i+1)return false;return board[n-1]===0;}
function render(){const b=document.getElementById('board');b.style.gridTemplateColumns='repeat('+size+',76px)';b.innerHTML='';
board.forEach((v,i)=>{const t=document.createElement('div');
t.className='tile'+(v===0?' hole':'')+(tokens.includes(i)?' tok':'');
t.style.background=v===0?'':PALS[(v-1)%PALS.length];
t.textContent=v===0?'':(tokens.includes(i)?'⭐':v);
t.onclick=()=>{if(!playing||v===0)return;const hole=board.indexOf(0);
if(!neigh(hole).includes(i)){beep(160,.06);return;}
board[hole]=v;board[i]=0;moves++;document.getElementById('m').textContent=moves;
beep(380+((v*53)%5)*70,.05);render();
if(tokens.includes(board.indexOf(0))){const ti=tokens.indexOf(board.indexOf(0));tokens.splice(ti,1);beep(880,.12,'triangle');document.getElementById('l').textContent=size+'×'+size+' · ⭐ '+tokens.length+' left';
if(tokens.length===0)win();}};
b.appendChild(t);});}
function win(){playing=false;beep(720,.12,'triangle');setTimeout(()=>beep(920,.15,'triangle'),120);
if(moves<best){best=moves;localStorage.setItem('dpu_best_'+size,best);}
document.getElementById('od').innerHTML='🏺 Ruin restored in <b>'+moves+'</b> moves!'+(size<6?'<br>Next: '+(size+1)+'×'+(size+1)+' ruin':'<br>The grandest ruin stands!');
document.getElementById('btn').textContent=size<6?'NEXT RUIN':'EXCAVATE AGAIN';if(size>=6)level=0;level++;document.getElementById('ov').style.display='flex';}
document.getElementById('btn').onclick=()=>{audio.resume();if(level===0)level=1;playing=true;init();document.getElementById('ov').style.display='none';};
window.addEventListener('keydown',e=>{if(!playing)return;const hole=board.indexOf(0);
const r=(hole/size)|0,c=hole%size;const k=e.key;let t=-1;
if(k==='ArrowUp'&&r<size-1)t=hole+size;if(k==='ArrowDown'&&r>0)t=hole-size;
if(k==='ArrowLeft'&&c<size-1)t=hole+1;if(k==='ArrowRight'&&c>0)t=hole-1;
if(t>=0){const bt=document.querySelectorAll('.tile')[t];if(bt)bt.click();}});
</script>
</body>
</html>
