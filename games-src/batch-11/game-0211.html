<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Royal Cooking Party Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{background:linear-gradient(#fef3c7,#fde68a);font-family:Georgia,serif;color:#713f12;min-height:100vh;display:flex;flex-direction:column;overflow:hidden}
#top{text-align:center;padding:8px;color:#78350f;font-size:.9rem}
#top b{color:#b45309}
#arena{flex:1;display:flex;position:relative}
.half{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
#h1{background:rgba(217,119,6,.14)}
#h2{background:rgba(180,83,9,.14)}
.p{font-size:2.8rem;font-weight:800;color:#78350f}
.l{font-size:.8rem;color:#92400e;margin-top:4px}
#cmd{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);font-size:1.7rem;font-weight:800;text-align:center;pointer-events:none;text-shadow:0 2px 8px #fff;z-index:4;min-height:2.4rem;color:#7c2d12}
#ov{position:fixed;inset:0;background:rgba(254,243,199,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#78350f;padding:20px;z-index:9}
button{background:#b45309;color:#fff;border:none;font-family:inherit;font-weight:700;padding:13px 36px;border-radius:26px;font-size:1rem;cursor:pointer;margin-top:14px}
#score{color:#78350f;font-size:.8rem;margin-top:8px}
@media(max-width:480px){#cmd{font-size:1.2rem}.p{font-size:2.1rem}}
</style>
</head>
<body>
<div id="top">👑 ROYAL COOK-OFF — <span id="who">…</span> | P1 <b id="s1">0</b> — <b id="s2">0</b> P2 | Round <b id="r">1</b>/5</div>
<div id="arena">
<div class="half" id="h1"><div class="p">👨‍🍳</div><div class="l">P1 — tap left / press Z</div></div>
<div class="half" id="h2"><div class="p">👩‍🍳</div><div class="l">P2 — tap right / press M</div></div>
</div>
<div id="cmd"></div>
<div id="ov"><h2>👑 ROYAL COOK-OFF</h2><p id="od">2 players race in the royal kitchen! When <b>🔔 ORDER UP!</b> rings, tap first to serve. But when <b>😴 KITCHEN NAP</b> appears, hold still — tapping during a nap costs a point! 5 rounds.</p><button id="btn">HEAT THE OVENS</button><div id="score"></div></div>
<script>
"use strict";
let s1,s2,round,phase,phaseTO,playing,locks={};let rc=+localStorage.getItem('rc_best')||0;
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.08,t='square'){if(!playing)return;const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=.1;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
const cmd=document.getElementById('cmd');
function next(){if(round>5)return finish();
document.getElementById('r').textContent=round;
document.getElementById('who').textContent='Tap EXACTLY when the clock hits 0.00 — closest wins the round!';
locks={};phase='run';
let remain=3000;
cmd.textContent='3.00';
phaseTO=setInterval(()=>{
remain-=50;
cmd.textContent=(remain/1000).toFixed(2);
if(remain<=0){
clearInterval(phaseTO);
phase=null;
if(!locks[1]&&!locks[2]){
cmd.textContent='Nobody tapped!';
round++;
setTimeout(next,700);
}else{
const t1=locks[1]===undefined?1e9:Math.abs(locks[1]);
const t2=locks[2]===undefined?1e9:Math.abs(locks[2]);
if(t1===t2){
cmd.textContent='🤝 Dead even!';
}else{
const w=t1<t2?1:2;
if(w===1)s1++;else s2++;
upd();
cmd.textContent='👑 P'+w+' closer ('+(w===1?t1:t2)+'ms off)!';
}
locks={};
round++;
setTimeout(next,900);
}
}
},50);
}
function tap(p){if(!playing||!phaseTO||locks[p]!==undefined)return;audio.resume();
locks[p]=phase===null?9999:parseFloat(cmd.textContent)*1000-0;
locks[p]=Math.round((parseFloat(cmd.textContent)*1000));
beep(p===1?620:780,.08,'triangle');document.getElementById('who').textContent='P'+p+' locked at '+cmd.textContent;}
function upd(){document.getElementById('s1').textContent=s1;document.getElementById('s2').textContent=s2;}
function finish(){playing=false;const m=Math.max(s1,s2);if(m>rc){rc=m;localStorage.setItem('rc_best',rc);}
const w=s1===s2?'🤝 A CULINARY TIE!':'🏆 PLAYER '+(s1>s2?1:2)+' WINS '+Math.max(s1,s2)+'—'+Math.min(s1,s2)+'!';
document.getElementById('od').innerHTML='<b style="font-size:1.25rem">'+w+'</b>';document.getElementById('btn').textContent='NEW SERVICE';document.getElementById('ov').style.display='flex';beep(880,.3,'triangle');}
document.getElementById('h1').addEventListener('pointerdown',()=>{audio.resume();tap(1);});
document.getElementById('h2').addEventListener('pointerdown',()=>{audio.resume();tap(2);});
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='z')tap(1);if(k==='m')tap(2);});
document.getElementById('btn').onclick=()=>{audio.resume();s1=0;s2=0;round=1;playing=true;upd();document.getElementById('ov').style.display='none';next();};
</script>
</body>
</html>
