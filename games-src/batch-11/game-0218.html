<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Halloween King</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(#1c1917,#0c0a09);font-family:Georgia,serif;color:#fdba74;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px;overflow-x:hidden}
h1{font-size:1.1rem;color:#f97316;padding:6px;letter-spacing:1px}
#hud{display:flex;gap:14px;font-size:.9rem;margin-bottom:8px;flex-wrap:wrap;justify-content:center}
#board{display:grid;gap:3px;background:#0c0a09;padding:8px;border-radius:12px;border:2px solid #7c2d12;touch-action:none}
.cell{width:40px;height:40px;border-radius:8px;background:#292524;display:flex;align-items:center;justify-content:center;font-size:.9rem;cursor:pointer}
@media(max-width:380px){.cell{width:33px;height:33px;font-size:.75rem}}
.cell.m1{background:#450a0a}.cell.m2{background:#082f49}
.cell.sel{outline:3px dashed #fde047}
#tip{text-align:center;font-size:.82rem;color:#a8a29e;margin-top:8px;min-height:2.2em;padding:0 8px}
#ov{position:fixed;inset:0;background:rgba(28,25,23,.98);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fdba74;padding:20px;z-index:5}
button{background:#f97316;border:none;color:#0c0a09;font-family:inherit;font-weight:800;padding:12px 32px;border-radius:24px;font-size:1rem;cursor:pointer;margin-top:14px}
</style>
</head>
<body>
<h1>👑 HALLOWEEN KING</h1>
<div id="hud"><span style="color:#f87171">PUMPKIN <b id="a1">0</b></span><span>Night <b id="t">1</b></span><span style="color:#93c5fd">GHOST <b id="a2">0</b></span></div>
<div id="board"></div>
<div id="tip"></div>
<div id="ov"><h2 style="color:#f97316">CROWN OF FRIGHT</h2><p id="od">Claim the Halloween kingdom! Tap your 🎃/👻, then an adjacent tile to send minions. Cursed tiles 🕸️ double your send. Rule the whole grid!</p><button id="btn">SEIZE THE NIGHT</button></div>
<script>

"use strict";
const S=7;let grid,cur,sel,turn,playing,king;let hk=+localStorage.getItem('hk_w1')||0,hk2=+localStorage.getItem('hk_w2')||0;
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.08,t='sine'){if(!playing)return;const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=.09;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
function init(){grid=[];for(let i=0;i<S*S;i++)grid.push({o:0,curse:Math.random()<0.12});
[[0,0],[1,0],[0,1],[S-1,S-1],[S-2,S-1],[S-1,S-2]].forEach(([c,r])=>grid[r*S+c].curse=false);
grid[0]={o:1,n:14,curse:false};grid[1]={o:1,n:9,curse:false};grid[S]={o:1,n:9,curse:false};
grid[S*S-1]={o:2,n:14,curse:false};
king=[0,S*S-1];grid[S*S-2]={o:2,n:9,curse:false};grid[S*S-1-S]={o:2,n:9,curse:false};
cur=1;turn=1;sel=null;playing=true;document.getElementById('t').textContent=1;render();}
function neigh(i){const r=(i/S)|0,c=i%S,o=[];if(r>0)o.push(i-S);if(r<S-1)o.push(i+S);if(c>0)o.push(i-1);if(c<S-1)o.push(i+1);return o;}
function render(){const b=document.getElementById('board');b.style.gridTemplateColumns='repeat('+S+',40px)';b.innerHTML='';
grid.forEach((g,i)=>{const c=document.createElement('div');c.className='cell'+(g.o===1?' m1':g.o===2?' m2':'')+(sel===i?' sel':'');
if(king.includes(i))c.textContent=(grid[i].o===1?'🎃':'👻')+'👑'+g.n;
else c.textContent=g.o?((g.o===1?'🎃':'👻')+g.n):(g.curse?'🕸️':g.n||'');
c.onclick=()=>tap(i);b.appendChild(c);});
document.getElementById('a1').textContent=grid.filter(g=>g.o===1).reduce((a,g)=>a+g.n,0);
document.getElementById('a2').textContent=grid.filter(g=>g.o===2).reduce((a,g)=>a+g.n,0);
document.getElementById('tip').textContent=playing?(cur===1?'🎃 PUMPKIN KING':'👻 GHOST KING')+' — expand your haunt!':'The night ends.';}
function tap(i){if(!playing)return;const g=grid[i];
if(g.o===cur){sel=i;beep(600,.05);render();return;}
if(sel!==null&&neigh(sel).includes(i)){const send=Math.floor(grid[sel].n/2);
if(send<1){render();return;}
const bonus=g.curse?2:1;
grid[sel].n-=send;
if(g.o===cur){g.n+=send*bonus;}
else if(g.n<send*bonus){g.o=cur;g.n=send*bonus-g.n;g.curse=false;beep(500,.1,'triangle');}
if(king[grid[i].o===1?1:0]===i&&playing){playing=false;beep(150,.7,'sawtooth');document.getElementById('tip').textContent=(grid[i].o===1?'🎃 PUMPKIN KING':'👻 GHOST KING')+' HAS FALLEN! 👑';render();return;}
else{g.n-=send*bonus;}
sel=null;render();check();if(playing){cur=cur===1?2:1;if(cur===1){turn++;document.getElementById('t').textContent=turn;
grid.forEach((c,j)=>{if(c.o)grid[j].n+=1;});render();}}}
else{sel=null;render();}}
function check(){const a=grid.some(g=>g.o===1),b=grid.some(g=>g.o===2);
if(!a||!b){playing=false;
localStorage.setItem('hk_w'+(a?1:2),(a?hk:hk2)+1);
document.getElementById('od').innerHTML='👑 <b style="color:#fde047">'+(a?'THE PUMPKIN KING':'THE GHOST KING')+' RULES HALLOWEEN!</b><br>in '+turn+' nights';
document.getElementById('btn').textContent='NEW NIGHT';document.getElementById('ov').style.display='flex';beep(880,.3,'triangle');}}
window.addEventListener('keydown',e=>{if(!playing)return;const own=grid.map((g,i)=>g.o===cur?i:-1).filter(i=>i>=0);if(!own.length)return;
if(e.key==='Enter'||e.key===' '){e.preventDefault();if(sel===null){sel=own[0];render();}else{const nb=neigh(sel).find(j=>grid[j].o!==cur);if(nb!==undefined)tap(nb);else{sel=null;render();}}}
if(e.key==='ArrowRight'){sel=own[(own.indexOf(sel)+1+own.length)%own.length]||own[0];render();}});
document.getElementById('btn').onclick=()=>{audio.resume();init();document.getElementById('ov').style.display='none';};

</script>
</body>
</html>
