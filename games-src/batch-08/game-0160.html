<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lives & Lens Spotter #160</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(#fef3c7,#fde68a);font-family:Georgia,serif;color:#713f12;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px;overflow-x:hidden}
h1{font-size:1.1rem;color:#b45309;padding:6px}
#hud{display:flex;gap:14px;font-size:.9rem;margin-bottom:6px}
#wrap{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
canvas{background:#fef3c7;border-radius:10px;touch-action:none;border:1px solid #d97706}
#hint{text-align:center;font-size:.85rem;color:#92400e;margin-top:6px;min-height:1.4em}
#ov{position:fixed;inset:0;background:rgba(254,243,199,.98);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#713f12;padding:20px;z-index:5}
button{background:#b45309;border:none;color:#fff;font-weight:700;padding:12px 32px;border-radius:24px;font-size:1rem;cursor:pointer;margin-top:14px}
@media(max-width:760px){h1{font-size:.95rem}}
</style>
</head>
<body>
<h1>🏛 SPOT THE DIFFERENCE: GREEK MYTH</h1>
<div id="hud"><span>Tablet <b id="l">1</b></span><span>Found <b id="f">0</b>/<b id="t">0</b></span><span>⏱ <b id="tm">0</b>s</span><span>❤️ <b id="lv">3</b></span><span>Best <b id="b">1</b></span></div>
<div id="wrap"><canvas id="left"></canvas><canvas id="right"></canvas></div>
<div id="hint">Tap the differences on EITHER tablet.</div>
<div id="ov"><h2 style="color:#b45309">OLYMPUS TABLETS</h2><p id="od">Two marble tablets of Mount Olympus… but they differ! Find all differences before time runs out. Each tablet adds more secrets and less time.</p><button id="btn">READ THE TABLETS</button></div>
<script>
"use strict";
const L=document.getElementById('left'),R=document.getElementById('right');
const W=340,H=300;L.width=R.width=W;L.height=R.height=H;
const lctx=L.getContext('2d'),rctx=R.getContext('2d');
let level,found,diffs,timer,timeLeft,playing,lives=3,best=+localStorage.getItem('sd3_best')||1;
document.getElementById('b').textContent=best;
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.08,t='sine'){if(!playing)return;const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=.09;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
const SPOTS=[[60,240,'bolt'],[150,260,'olive'],[260,230,'column'],[90,120,'owl'],[220,90,'lyre'],[300,160,'urn'],[40,60,'laurel'],[180,200,'helmet'],[290,50,'wing'],[130,40,'sun'],[250,190,'trident'],[70,170,'amphora']];
function drawScene(ctx,alt){ctx.fillStyle='#fef3c7';ctx.fillRect(0,0,W,H);
// marble veins
ctx.strokeStyle='#fde68a';for(let i=0;i<6;i++){ctx.beginPath();ctx.moveTo((i*67)%W,0);
ctx.quadraticCurveTo((i*67+40)%W,150,(i*113)%W,H);ctx.stroke();}
// parthenon
ctx.fillStyle='#d6b25e';ctx.fillRect(20,50,80,180);ctx.fillRect(240,50,80,180);
ctx.fillStyle='#e7d8a9';ctx.fillRect(110,80,120,150);
ctx.strokeStyle='#b45309';for(let i=0;i<4;i++){ctx.strokeRect(118+i*28,90,20,130);}
// pediment
ctx.fillStyle='#d6b25e';ctx.beginPath();ctx.moveTo(100,80);ctx.lineTo(170,30);ctx.lineTo(240,80);ctx.fill();
ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(W-60,40,20,0,7);ctx.globalAlpha=.5;ctx.fill();ctx.globalAlpha=1;
SPOTS.forEach((s,i)=>{if(alt&&diffs.includes(i))return;
const[x,y,t]=s;ctx.font='20px serif';ctx.textAlign='center';
if(t==='bolt')ctx.fillText('⚡',x,y);
if(t==='olive')ctx.fillText('🌿',x,y);
if(t==='column')ctx.fillText('🏛️',x,y);
if(t==='owl')ctx.fillText('🦉',x,y);
if(t==='lyre')ctx.fillText('🎵',x,y);
if(t==='urn')ctx.fillText('🏺',x,y);
if(t==='laurel'){ctx.strokeStyle='#65a30d';ctx.beginPath();ctx.arc(x,y,10,0,7);ctx.stroke();}
if(t==='helmet')ctx.fillText('🪖',x,y);
if(t==='wing')ctx.fillText('🪽',x,y);
if(t==='sun')ctx.fillText('☀️',x,y);
if(t==='trident')ctx.fillText('🔱',x,y);
if(t==='amphora')ctx.fillText('⚱️',x,y);});}
function setup(){const n=Math.min(3+level,SPOTS.length-1);const idx=[...SPOTS.keys()].sort(()=>Math.random()-.5).slice(0,n);
diffs=idx;found=[];lives=3;timeLeft=Math.max(15,40-level*3);
document.getElementById('t').textContent=n;document.getElementById('f').textContent=0;document.getElementById('tm').textContent=timeLeft;document.getElementById('l').textContent=level;document.getElementById('lv').textContent=lives;
drawScene(lctx,false);drawScene(rctx,true);
clearInterval(timer);timer=setInterval(()=>{timeLeft--;document.getElementById('tm').textContent=timeLeft;
if(timeLeft<=0)lose();},1000);}
function check(e,ctx,cvs){if(!playing)return;const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
for(const i of diffs){if(found.includes(i))continue;const s=SPOTS[i];
if(Math.hypot(s[0]-x,s[1]-y)<26){found.push(i);
document.getElementById('f').textContent=found.length;beep(700+found.length*40,.1,'triangle');
ctx.strokeStyle='#16a34a';ctx.lineWidth=3;ctx.beginPath();ctx.arc(s[0],s[1],22,0,7);ctx.stroke();
if(found.length>=diffs.length)win();return;}}
beep(160,.1,'sawtooth');lives--;document.getElementById('lv').textContent=lives;
if(lives<=0){lose();return;}}
[L,R].forEach(c=>{
c.addEventListener('pointerdown',e=>{audio.resume();check(e,c===L?lctx:rctx,c);});
c.addEventListener('pointermove',e=>{if(e.buttons!==1)return;const r=c.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;const ctx=c===L?lctx:rctx;drawScene(ctx,c===R);ctx.save();ctx.beginPath();ctx.arc(x,y,28,0,7);ctx.clip();ctx.drawImage(c,-x,-y,2*W,2*H);ctx.strokeStyle='#facc15';ctx.lineWidth=2;ctx.stroke();ctx.restore();});
c.addEventListener('pointerup',e=>{drawScene(c===L?lctx:rctx,c===R);});
});
window.addEventListener('keydown',e=>{if(e.key==='h'||e.key==='H'){if(playing){const rem=diffs.filter(i=>!found.includes(i));
if(rem.length){const s=SPOTS[rem[0]];lctx.strokeStyle='#dc2626';lctx.setLineDash([4,4]);
lctx.beginPath();lctx.arc(s[0],s[1],26,0,7);lctx.stroke();lctx.setLineDash([]);}}}});
function win(){playing=false;clearInterval(timer);
if(level+1>best){best=level+1;localStorage.setItem('sd3_best',best);document.getElementById('b').textContent=best;}
beep(880,.2,'triangle');setTimeout(()=>beep(1100,.2,'triangle'),150);
document.getElementById('od').innerHTML='🏛 Tablet deciphered with '+timeLeft+'s left!<br>Next tablet: '+(Math.min(3+level+1,SPOTS.length-1))+' differences.';
document.getElementById('btn').textContent='NEXT TABLET';level++;document.getElementById('ov').style.display='flex';}
function lose(){playing=false;clearInterval(timer);beep(140,.4,'sawtooth');
document.getElementById('od').innerHTML='⏰ Time shatters the tablet! You found '+found.length+'/'+diffs.length+'.<br>Tablet reached: <b>'+level+'</b>';
document.getElementById('btn').textContent='TRY AGAIN';document.getElementById('ov').style.display='flex';}
document.getElementById('btn').onclick=()=>{audio.resume();if(document.getElementById('btn').textContent==='TRY AGAIN')level=1;playing=true;setup();document.getElementById('ov').style.display='none';};
</script>
</body>
</html>
