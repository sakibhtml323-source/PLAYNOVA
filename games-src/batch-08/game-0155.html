<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Viking Merge: Watercolor Edition</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(#e0e7ff,#c7d2fe);font-family:Georgia,serif;color:#312e81;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px}
h1{font-size:1.15rem;color:#4338ca;padding:6px}
#hud{display:flex;gap:16px;font-size:.9rem;margin-bottom:10px}
#grid{display:grid;grid-template-columns:repeat(4,74px);gap:8px;touch-action:none}
.tile{width:74px;height:74px;border-radius:14px;background:rgba(255,255,255,.6);backdrop-filter:blur(6px);border:2px solid #a5b4fc;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:transform .1s}
.tile:active{transform:scale(.94)}
.tile .e{font-size:1.5rem}
.tile .v{font-size:.65rem;color:#4338ca}
#msg{text-align:center;font-size:.85rem;color:#6366f1;margin-top:10px;min-height:1.5em}
#ov{position:fixed;inset:0;background:rgba(224,231,255,.98);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#312e81;padding:20px;z-index:5}
button{background:#4f46e5;border:none;color:#fff;font-family:inherit;font-weight:700;padding:13px 36px;border-radius:24px;font-size:1rem;cursor:pointer;margin-top:14px}
@media(max-width:360px){#grid{grid-template-columns:repeat(4,60px)}.tile{width:60px;height:60px}}
</style>
</head>
<body>
<h1>⚔️ VIKING MERGE</h1>
<div id="hud"><span>Silver <b id="s">0</b></span><span>Best relic <b id="b">0</b></span><span>Merges <b id="m">0</b></span></div>
<div id="grid"></div>
<div id="msg">Forge Viking relics! Tap to place, merge equals into greater treasures!</div>
<div id="ov"><h2 style="color:#4338ca">WATERCOLOR FORGE</h2><p id="od">A soft watercolor merge board of Norse relics! Place pieces, merge equals, forge up to the Odin's Eye 👁. The 4×4 board fills fast — plan!</p><button id="btn">LIGHT THE FORGE</button></div>
<script>
"use strict";
const LV=[['🪨',2],['🪙',4],['⚔️',8],['🛡️',16],['🪓',32],['🏹',64],['⚡',128],['🐺',256],['👁',512],['🌈',1024]];
let grid,playing,score,merges,topT,best=+localStorage.getItem('vm_best')||0;
document.getElementById('b').textContent=best;
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.06,t='sine'){const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=.08;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
function init(){grid=Array(16).fill(null);playing=true;score=0;merges=0;topT=0;
spawn();spawn();document.getElementById('s').textContent=0;document.getElementById('m').textContent=0;render();}
function spawn(){const empty=grid.map((v,i)=>v===null?i:-1).filter(i=>i>=0);
if(!empty.length)return false;
grid[empty[(Math.random()*empty.length)|0]]=0;return true;}
function neigh(i){const r=(i/4)|0,c=i%4,o=[];if(r>0)o.push(i-4);if(r<3)o.push(i+4);if(c>0)o.push(i-1);if(c<3)o.push(i+1);return o;}
function render(){const g=document.getElementById('grid');g.innerHTML='';
grid.forEach((v,i)=>{const t=document.createElement('div');t.className='tile';
if(v!==null){t.innerHTML='<span class="e">'+LV[v][0]+'</span><span class="v">'+LV[v][1]+'</span>';}
else{t.innerHTML='<span class="e" style="opacity:.25">＋</span>';}
t.onclick=()=>tap(i);g.appendChild(t);});}
function tap(i){if(!playing||grid[i]!==null)return;audio.resume();
grid[i]=0;beep(420,.05);render();
let changed=true;
while(changed){changed=false;
for(let j=0;j<16;j++){if(grid[j]===null)continue;
const same=neigh(j).filter(k=>grid[k]===grid[j]);
if(same.length){const k=same[0];grid[k]=grid[j]+1;grid[j]=null;
merges++;score+=LV[grid[k]][1];topT=Math.max(topT,grid[k]);changed=true;break;}}}
document.getElementById('s').textContent=score;document.getElementById('m').textContent=merges;render();
if(topT>=9){win();return;}
if(!grid.includes(null)){over();}}
function win(){playing=false;if(score>best){best=score;localStorage.setItem('vm_best',best);document.getElementById('b').textContent=best;}
beep(880,.25,'triangle');setTimeout(()=>beep(1100,.25,'triangle'),180);
document.getElementById('od').innerHTML='👁 <b style="color:#4338ca">ODIN\'S EYE IS FORGED!</b><br>Silver score: '+score;
document.getElementById('btn').textContent='FORGE ANEW';document.getElementById('ov').style.display='flex';}
function over(){playing=false;if(score>best){best=score;localStorage.setItem('vm_best',best);document.getElementById('b').textContent=best;}
beep(120,.4,'sawtooth');
document.getElementById('od').innerHTML='🪨 <b>The forge is full!</b><br>Final silver: '+score+' in '+merges+' merges.';
document.getElementById('btn').textContent='STOKE AGAIN';document.getElementById('ov').style.display='flex';}
window.addEventListener('keydown',e=>{if(!playing)return;if(e.key>='1'&&e.key<='9'){const i=+e.key-1;const t=document.querySelectorAll('.tile')[i];if(t)t.click();}});
document.getElementById('btn').onclick=()=>{audio.resume();init();document.getElementById('ov').style.display='none';};
</script>
</body>
</html>
