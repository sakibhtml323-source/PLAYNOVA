<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Modern Flat Mystic Master</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#f5f5f4;font-family:'Segoe UI',Arial,sans-serif;color:#44403c;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px;overflow-x:hidden}
h1{font-weight:300;letter-spacing:3px;font-size:1.05rem;color:#57534e;padding:8px;text-align:center}
#hud{display:flex;gap:14px;font-size:.85rem;margin-bottom:8px;flex-wrap:wrap;justify-content:center}
#board{display:grid;gap:4px;background:#e7e5e4;padding:10px;border-radius:16px;touch-action:none}
.cell{width:42px;height:42px;border-radius:10px;background:#fafaf9;display:flex;align-items:center;justify-content:center;font-size:1rem;cursor:pointer}
@media(max-width:380px){.cell{width:34px;height:34px;font-size:.85rem}}
.cell.m1{background:#0ea5e9}.cell.m2{background:#f59e0b}
.cell.sel{box-shadow:inset 0 0 0 3px #44403c}
.cell.fog{background:#a8a29e!important;color:#57534e}
#tip{text-align:center;font-size:.82rem;color:#78716c;margin-top:8px;min-height:2.2em;padding:0 8px}
#ov{position:fixed;inset:0;background:rgba(245,245,244,.98);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#44403c;padding:20px;z-index:5}
button{background:#44403c;border:none;color:#fafaf9;font-family:inherit;font-weight:700;padding:12px 34px;border-radius:30px;font-size:1rem;cursor:pointer;margin-top:14px}
</style>
</head>
<body>
<h1>MYSTIC MASTER</h1>
<div id="hud"><span style="color:#0ea5e9">AZURE <b id="a1">0</b></span><span>Round <b id="t">1</b></span><span style="color:#f59e0b">AMBER <b id="a2">0</b></span></div>
<div id="board"></div>
<div id="tip"></div>
<div id="ov"><h2 style="font-weight:300;letter-spacing:3px">FLAT MYSTIC DUEL</h2><p id="od">\u2601\ufe0f FOG OF WAR: enemy cells stay hidden unless adjacent to your territory. 2 players channel the flat elements! Tap your 🔮, then an adjacent tile to convert it. Mystic wells 💧 give double power when captured. Convert the whole grid!</p><button id="btn">CHANNEL</button></div>
<script>
"use strict";
const S=7;let grid,cur,sel,turn,playing;let mf5=+localStorage.getItem('mf_w1')||0,mf52=+localStorage.getItem('mf_w2')||0;
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.08,t='sine'){if(!playing)return;const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=.09;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
function init(){grid=[];for(let i=0;i<S*S;i++)grid.push({o:0,well:Math.random()<0.12});
[[0,0],[1,0],[0,1],[S-1,S-1],[S-2,S-1],[S-1,S-2]].forEach(([c,r])=>grid[r*S+c].well=false);
grid[0]={o:1,n:14,well:false};grid[1]={o:1,n:9,well:false};grid[S]={o:1,n:9,well:false};
grid[S*S-1]={o:2,n:14,well:false};grid[S*S-2]={o:2,n:9,well:false};grid[S*S-1-S]={o:2,n:9,well:false};
cur=1;turn=1;sel=null;playing=true;document.getElementById('t').textContent=1;render();}
function neigh(i){const r=(i/S)|0,c=i%S,o=[];if(r>0)o.push(i-S);if(r<S-1)o.push(i+S);if(c>0)o.push(i-1);if(c<S-1)o.push(i+1);return o;}
function render(){const b=document.getElementById('board');b.style.gridTemplateColumns='repeat('+S+',42px)';b.innerHTML='';
grid.forEach((g,i)=>{const c=document.createElement('div');c.className='cell'+(g.o===1?' m1':g.o===2?' m2':'')+(sel===i?' sel':'');
const vis=g.o===0||g.o===cur||neigh(i).some(n=>grid[n].o===cur);
if(!vis){c.className='cell fog';c.textContent='\u2754';c.onclick=()=>beep(220,.06);b.appendChild(c);return;}
c.textContent=g.o?('🔮'+g.n):(g.well?'💧':g.n||'');
c.onclick=()=>tap(i);b.appendChild(c);});
document.getElementById('a1').textContent=grid.filter(g=>g.o===1).reduce((a,g)=>a+g.n,0);
document.getElementById('a2').textContent=grid.filter(g=>g.o===2).reduce((a,g)=>a+g.n,0);
document.getElementById('tip').textContent=playing?(cur===1?'🔵 AZURE':'🟠 AMBER')+' — tap a 🔮, then an adjacent tile.':'The duel rests.';}
function tap(i){if(!playing)return;const g=grid[i];
if(g.o===cur){sel=i;beep(600,.05);render();return;}
if(sel!==null&&neigh(sel).includes(i)){const send=Math.floor(grid[sel].n/2);
if(send<1){render();return;}
const bonus=g.well?2:1;
grid[sel].n-=send;
if(g.o===cur){g.n+=send*bonus;}
else if(g.n<send*bonus){g.o=cur;g.n=send*bonus-g.n;g.well=false;beep(500,.1,'triangle');}
else{g.n-=send*bonus;}
sel=null;render();check();if(playing){cur=cur===1?2:1;if(cur===1){turn++;document.getElementById('t').textContent=turn;
grid.forEach((c,j)=>{if(c.o)grid[j].n+=1;});render();}}}
else{sel=null;render();}}
function check(){const a=grid.some(g=>g.o===1),b=grid.some(g=>g.o===2);
if(!a||!b){playing=false;
localStorage.setItem('mf_w'+(a?1:2),(a?mf5:mf52)+1);
document.getElementById('od').innerHTML='🏆 <b style="color:#57534e">'+(a?'AZURE':'AMBER')+' BECOMES THE MYSTIC MASTER!</b><br>in '+turn+' rounds';
document.getElementById('btn').textContent='NEW DUEL';document.getElementById('ov').style.display='flex';beep(880,.3,'triangle');}}
window.addEventListener('keydown',e=>{if(!playing)return;const own=grid.map((g,i)=>g.o===cur?i:-1).filter(i=>i>=0);if(!own.length)return;
if(e.key==='Enter'||e.key===' '){e.preventDefault();if(sel===null){sel=own[0];render();}else{const nb=neigh(sel).find(j=>grid[j].o!==cur);if(nb!==undefined)tap(nb);else{sel=null;render();}}}
if(e.key==='ArrowRight'){sel=own[(own.indexOf(sel)+1+own.length)%own.length]||own[0];render();}});
document.getElementById('btn').onclick=()=>{audio.resume();init();document.getElementById('ov').style.display='none';};
</script>
</body>
</html>
