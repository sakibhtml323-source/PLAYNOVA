<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Modern Flat Puzzle: Norse Edition</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#fafaf9;font-family:'Segoe UI',Arial,sans-serif;color:#44403c;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px;overflow-x:hidden}
h1{font-weight:300;letter-spacing:3px;font-size:1.05rem;color:#57534e;padding:8px}
#hud{display:flex;gap:14px;font-size:.9rem;margin-bottom:10px}
#grid{display:grid;gap:5px;touch-action:none}
.tile{width:62px;height:62px;border-radius:12px;background:#e7e5e4;display:flex;align-items:center;justify-content:center;font-size:1.4rem;cursor:pointer;transition:background .15s,transform .1s}
.tile:active{transform:scale(.94)}
.tile.on{background:#44403c;color:#fafaf9}
@media(max-width:400px){.tile{width:50px;height:50px;font-size:1.15rem}}
#msg{text-align:center;font-size:.85rem;color:#78716c;margin-top:8px;min-height:1.5em}
#ov{position:fixed;inset:0;background:rgba(250,250,249,.98);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#44403c;padding:20px;z-index:5}
button{background:#44403c;border:none;color:#fafaf9;font-family:inherit;font-weight:700;padding:12px 34px;border-radius:30px;font-size:1rem;cursor:pointer;margin-top:14px}
</style>
</head>
<body>
<h1>ᚠ MODERN FLAT NORSE</h1>
<div id="hud"><span>Knot <b id="l">1</b></span><span>Taps <b id="m">0</b></span><span>⏱ <b id="t">0</b>s</span><span>Best <b id="b">—</b></span></div>
<div id="grid"></div>
<div id="msg">Illuminate the rune knot! Tap a rune to flip it and its neighbors — light them ALL.</div>
<div id="ov"><h2 style="font-weight:300;letter-spacing:3px">RUNE KNOTS</h2><p id="od">A minimalist Norse lights-out! Tap runes to flip them and their four neighbors. Illuminate every tile before the timer fades. Knots grow larger!</p><button id="btn">TRACE THE KNOT</button></div>
<script>
"use strict";
const RUNES=['ᚠ','ᚢ','ᚦ','ᚨ','ᚱ','ᚲ','ᚷ','ᚹ'];
let size,grid,playing,level,taps,timer,timeLeft,best=Infinity;
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.06,t='sine'){const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=.08;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
function build(){size=Math.min(3+level,6);grid=[];
const total=size*size;
for(let i=0;i<total;i++)grid.push(Math.random()<0.5?0:1);
if(grid.every(v=>v===grid[0]))grid[0]=1-grid[0];
taps=0;timeLeft=Math.max(15,40-level*3);
document.getElementById('l').textContent=level;document.getElementById('m').textContent=0;document.getElementById('t').textContent=timeLeft;
best=+localStorage.getItem('fn_best_'+size)||Infinity;document.getElementById('b').textContent=isFinite(best)?best:'—';
render();clearInterval(timer);
timer=setInterval(()=>{timeLeft--;document.getElementById('t').textContent=timeLeft;
if(timeLeft<=0){playing=false;clearInterval(timer);beep(130,.4,'sawtooth');
document.getElementById('od').innerHTML='🌑 The knot fades into shadow…';
document.getElementById('btn').textContent='RETRACE';document.getElementById('ov').style.display='flex';}},1000);}
function neigh(i){const r=(i/size)|0,c=i%size,o=[i];if(r>0)o.push(i-size);if(r<size-1)o.push(i+size);if(c>0)o.push(i-1);if(c<size-1)o.push(i+1);return o;}
function render(){const g=document.getElementById('grid');g.style.gridTemplateColumns='repeat('+size+',62px)';g.innerHTML='';
grid.forEach((v,i)=>{const t=document.createElement('div');t.className='tile'+(v?' on':'');
t.textContent=RUNES[i%RUNES.length];
t.onclick=()=>{if(!playing)return;audio.resume();
neigh(i).forEach(j=>grid[j]=1-grid[j]);
taps++;document.getElementById('m').textContent=taps;beep(400+v*200,.05);render();
if(grid.every(x=>x===1)){playing=false;clearInterval(timer);
if(taps<best){best=taps;localStorage.setItem('fn_best_'+size,best);}
beep(800,.15,'triangle');setTimeout(()=>beep(1000,.15,'triangle'),140);
document.getElementById('od').innerHTML='☀️ Knot illuminated in <b>'+taps+'</b> taps!'+(size<6?'<br>Next: '+(size+1)+'×'+(size+1)+' knot':'<br>The greatest knot is traced!');
document.getElementById('btn').textContent=size<6?'NEXT KNOT':'KNOT AGAIN';if(size>=6)level=0;level++;document.getElementById('ov').style.display='flex';}};
g.appendChild(t);});}
window.addEventListener('keydown',e=>{if(!playing)return;if(e.key>='1'&&e.key<='9'){const i=+e.key-1;const t=document.querySelectorAll('.tile')[i];if(t)t.click();}});
document.getElementById('btn').onclick=()=>{audio.resume();if(level===0)level=1;playing=true;build();document.getElementById('ov').style.display='none';};
</script>
</body>
</html>
