<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ninja Math Sprint #246</title><style>
body{margin:0;font-family:system-ui;background:#111827;color:#f9fafb;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#9ca3af;font-size:.78rem}
canvas{background:#1f2937;border-radius:12px;touch-action:none;max-width:96vw}
#q{font-size:1.6rem;font-weight:800;margin:8px;color:#facc15}
#ans{display:flex;gap:10px;margin:8px;flex-wrap:wrap;justify-content:center}
.ans{padding:14px 24px;border-radius:12px;border:2px solid #374151;background:#1f2937;color:#f9fafb;font-size:1.2rem;font-weight:800;cursor:pointer}
.ans:hover{border-color:#facc15}
#hud{display:flex;gap:14px;font-size:.9rem;margin:4px}
#hud b{color:#facc15}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#facc15;color:#111827;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🥷 Ninja Math Sprint</h1><div class="sub">Solve to keep running — wrong answers trip you! Chain correct answers for combo speed.</div>
<div id="hud"><span>Dist <b id="d">0</b>m</span><span>Combo <b id="c">×1</b></span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="480" height="260"></canvas>
<div id="q">?</div>
<div id="ans"></div>
<div id="ov"><div style="font-size:3rem">🥷</div><p>Answer the question to keep sprinting.<br>Combos make you faster!</p><button id="btn">Run</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setAtTime?0:g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=480,H=260,GY=H-44;
let me={y:GY,vy:0,onG:true},obs=[],dist=0,combo=1,playing=false,spawnT=0,best=+localStorage.getItem('ms_best')||0;
let qA=0,qAns=0;
document.getElementById('b').textContent=best;
function newQ(){const a=1+((Math.random()*10)|0),b=1+((Math.random()*10)|0);
const op=['+','−','×'][(Math.random()*3)|0];
qA=a;qAns=op==='+'?a+b:op==='−'?a-b:a*b;
document.getElementById('q').textContent=a+' '+op+' '+b+' = ?';
const opts=new Set([qAns]);while(opts.size<4){const d=qAns+((Math.random()*11)|0)-5;if(d>=0)opts.add(d);}
const arr=[...opts].sort(()=>Math.random()-.5);
const box=document.getElementById('ans');box.innerHTML='';
arr.forEach(v=>{const b=document.createElement('button');b.className='ans';b.textContent=v;
b.onclick=()=>answer(v===qAns,b);box.appendChild(b);});}
function answer(ok,btn){if(!playing)return;
if(ok){combo=Math.min(combo+1,10);document.getElementById('c').textContent='×'+combo;
beep(500+combo*60,.09,'triangle');btn.style.borderColor='#22c55e';}
else{combo=1;document.getElementById('c').textContent='×1';me.vy=-7;me.onG=false;
beep(150,.2,'sawtooth');btn.style.borderColor='#ef4444';}
setTimeout(newQ,150);}
function jump(){if(!playing||!me.onG)return;me.vy=-10.5;me.onG=false;beep(500,.06);}
cvs.addEventListener('pointerdown',jump);
document.addEventListener('keydown',e=>{if(e.code==='Space')jump();});
function spawn(){obs.push({x:W+30,y:GY-6,w:20,h:22,e:['🌵','🪨','🔥'][(Math.random()*3)|0]});}
function hit(a,b){return a.x<b.x+b.w&&a.x+24>b.x&&a.y<b.y+b.h&&a.y+28>b.y;}
function step(){dist+=0.05*combo;
me.vy+=0.5;me.y+=me.vy;
if(me.y>=GY){me.y=GY;me.vy=0;me.onG=true;}
spawnT++;if(spawnT>Math.max(40,95-dist*0.03)){spawnT=0;spawn();}
obs.forEach(o=>{o.x-=4.4;});
obs=obs.filter(o=>o.x>-40);
obs.forEach(o=>{if(hit({x:70,y:me.y-28,w:24,h:28},o))die();});}
function die(){if(!playing)return;playing=false;beep(130,.35,'sawtooth');
const d=Math.floor(dist);if(d>best){best=d;localStorage.setItem('ms_best',best);document.getElementById('b').textContent=best;}
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='💀 Tripped at <b style="color:#facc15">'+d+'m</b> · Combo ×'+combo;}
function draw(){ctx.fillStyle='#1f2937';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#374151';ctx.fillRect(0,GY+2,W,H-GY);
ctx.font='30px serif';ctx.textAlign='center';ctx.fillText('🥷',82,me.y+4);
obs.forEach(o=>{ctx.font='24px serif';ctx.fillText(o.e,o.x+o.w/2,o.y+o.h/2+8);});
document.getElementById('d').textContent=Math.floor(dist);
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{me={y:GY,vy:0,onG:true};obs=[];dist=0;combo=1;spawnT=0;
document.getElementById('d').textContent=0;document.getElementById('c').textContent='×1';
document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();newQ();draw();};
</script></body></html>
