<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haunted Merge Blast #250</title><style>
body{margin:0;font-family:system-ui;background:#18181b;color:#fafafa;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a1a1aa;font-size:.78rem}
#grid{display:grid;grid-template-columns:repeat(5,56px);gap:4px;margin:12px}
.g{width:56px;height:56px;background:#27272a;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;user-select:none}
.g.sel{outline:2px solid #facc15}
#hud{display:flex;gap:14px;font-size:.9rem;margin:4px}
#hud b{color:#facc15}
#msg{min-height:1.3em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#7c3aed;color:#fff;font-weight:700;cursor:pointer;margin:8px}
</style></head><body>
<h1>👻 Haunted Merge Blast</h1><div class="sub">Tap an empty cell to summon a ghost (or higher). Two identical touch → merge & blast neighbors!</div>
<div id="hud"><span>Score <b id="s">0</b></span><span>Best <b id="b">0</b></span><span>Top <b id="t">👻</b></span></div>
<div id="grid"></div><div id="msg"></div>
<button id="btn">💀 New Haunt</button>
<audio id="au"></audio>
<script>
"use strict";
const AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const R=5,C=5,GHOULS=['👻','🎃','🦇','🕷️','💀','🧛','👁️','🔮','🌑'];
let grid=[],score=0,best=+localStorage.getItem('hmb_best')||0;
document.getElementById('b').textContent=best;
function build(){grid=Array.from({length:R},()=>Array(C).fill(null));score=0;
document.getElementById('s').textContent=0;render();msg('Tap an empty cell to summon!');}
function neigh(r,c){const out=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
if(!dr&&!dc)continue;const rr=r+dr,cc=c+dc;
if(rr>=0&&rr<R&&cc>=0&&cc<C)out.push([rr,cc]);}return out;}
function tap(r,c){if(grid[r][c]!==null){beep(160,.06,'sawtooth');return;}
// spawn lowest tier (0), sometimes higher
const tier=Math.random()<0.85?0:1;
grid[r][c]=tier;beep(400,.06);render();
resolve(r,c);checkEnd();}
function resolve(r,c){
let changed=true;
while(changed){changed=false;
const v=grid[r][c];if(v===null)return;
const same=neigh(r,c).filter(([rr,cc])=>grid[rr][cc]===v);
if(same.length>0){
// merge: take first same, upgrade current, blast rest + their neighbors
const[sr,sc]=same[0];
grid[r][c]=v+1;grid[sr][sc]=null;
score+=10*(v+1);beep(440+((v+1)*60),.09,'triangle');
same.slice(1).forEach(([rr,cc])=>{grid[rr][cc]=null;score+=5;});
changed=true;}}
document.getElementById('s').textContent=score;
if(score>best){best=score;localStorage.setItem('hmb_best',best);document.getElementById('b').textContent=best;}
const top=Math.max(...grid.flat().filter(x=>x!==null));
document.getElementById('t').textContent=GHOULS[Math.min(top,8)];
render();}
function checkEnd(){if(grid.every(row=>row.every(v=>v!==null))){beep(130,.3,'sawtooth');
msg('💀 Board full! Final score: '+score);}}
function render(){const g=document.getElementById('grid');g.innerHTML='';
for(let r=0;r<R;r++)for(let c=0;c<C;c++){const d=document.createElement('div');d.className='g';
d.textContent=grid[r][c]!==null?GHOULS[grid[r][c]]:'';
d.onclick=()=>{AU.__c=AU.__c||new (window.AudioContext||window.webkitAudioContext)();tap(r,c);};
g.appendChild(d);}}
function msg(t){document.getElementById('msg').textContent=t;}
document.getElementById('btn').onclick=()=>{AU.__c=new (window.AudioContext||window.webkitAudioContext)();build();};
build();
</script></body></html>
