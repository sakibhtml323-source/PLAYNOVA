<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ninja Reflex Duel #256</title><style>
body{margin:0;font-family:system-ui;background:#111827;color:#f9fafb;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#9ca3af;font-size:.78rem}
#cmd{font-size:3rem;margin:16px;min-height:4rem}
#zones{display:flex;gap:20px;margin:12px}
.zone{width:140px;height:90px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem;cursor:pointer;user-select:none}
#z1{background:#7c3aed}#z2{background:#dc2626}
#hud{display:flex;gap:14px;font-size:.9rem;margin:4px}
#hud b{color:#facc15}
#msg{min-height:1.3em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#facc15;color:#111827;font-weight:700;cursor:pointer;margin:8px}
</style></head><body>
<h1>⚡ Ninja Reflex Duel</h1><div class="sub">Tap YOUR zone when ⚡ flashes — but ignore the 💨 fakes! False taps lose points.</div>
<div id="hud"><span>P1 <b id="s1">0</b></span><span>P2 <b id="s2">0</b></span><span>Round <b id="r">1</b>/10</span></div>
<div id="cmd">?</div>
<div id="zones"><div class="zone" id="z1">P1<br>🥷</div><div class="zone" id="z2">P2<br>🥷</div></div>
<div id="msg"></div>
<button id="btn">⚔️ Start Duel</button>
<audio id="au"></audio>
<script>
"use strict";
const AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
let s1=0,s2=0,round=0,phase='wait',TO=null,playing=false;
const CMDS=['⚡','💨','⚡','⚡','💨'];
function next(){if(round>=10){end();return;}
round++;document.getElementById('r').textContent=round;
phase='wait';document.getElementById('cmd').textContent='👀';
const delay=600+Math.random()*1600;
TO=setTimeout(()=>{const c=CMDS[(Math.random()*CMDS.length)|0];phase=c;
document.getElementById('cmd').textContent=c;
if(c==='💨'){TO=setTimeout(()=>{phase='wait';next();},600);}
else{TO=setTimeout(()=>{phase='wait';document.getElementById('cmd').textContent='⏰ Too slow!';next();},900);}},delay);}
function tap(p){if(!playing)return;
if(phase==='⚡'){clearTimeout(TO);
if(p===1){s1++;document.getElementById('s1').textContent=s1;}else{s2++;document.getElementById('s2').textContent=s2;}
beep(p===1?620:440,.1,'triangle');document.getElementById('cmd').textContent='⚡ Point!';
phase='wait';setTimeout(next,500);}
else if(phase==='💨'){clearTimeout(TO);
if(p===1)s1=Math.max(0,s1-1);else s2=Math.max(0,s2-1);
document.getElementById('s1').textContent=s1;document.getElementById('s2').textContent=s2;
beep(150,.15,'sawtooth');document.getElementById('cmd').textContent='💨 Fake! −1';
phase='wait';setTimeout(next,600);}
else{beep(180,.08,'sawtooth');}}
function end(){playing=false;clearTimeout(TO);
const w=s1>s2?'🥷 P1 wins!':s2>s1?'🥷 P2 wins!':'🤝 Tie!';
document.getElementById('cmd').textContent='🏁';
document.getElementById('msg').textContent=w+'  '+s1+'–'+s2;
beep(880,.25,'triangle');}
document.getElementById('z1').addEventListener('pointerdown',()=>tap(1));
document.getElementById('z2').addEventListener('pointerdown',()=>tap(2));
document.getElementById('btn').onclick=()=>{s1=0;s2=0;round=0;
document.getElementById('s1').textContent=0;document.getElementById('s2').textContent=0;
document.getElementById('msg').textContent='';
AU.__c=new (window.AudioContext||window.webkitAudioContext)();playing=true;next();};
</script></body></html>
