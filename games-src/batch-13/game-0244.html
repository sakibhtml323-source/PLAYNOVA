<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haunted Calculator #244</title><style>
body{margin:0;font-family:system-ui;background:#18181b;color:#fafafa;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a1a1aa;font-size:.78rem;max-width:320px;text-align:center}
#display{font-size:2.6rem;font-weight:800;background:#27272a;padding:12px 30px;border-radius:14px;margin:10px;min-width:180px;text-align:center}
#target{font-size:1.1rem;color:#facc15;font-weight:700;margin:4px}
#ops{display:flex;gap:8px;margin:10px;flex-wrap:wrap;justify-content:center}
.op{padding:14px 20px;border-radius:12px;border:none;background:#7c3aed;color:#fff;font-size:1.2rem;font-weight:800;cursor:pointer}
.op:disabled{opacity:.35}
#hud{display:flex;gap:14px;font-size:.9rem;margin:4px}
#hud b{color:#facc15}
#msg{min-height:1.4em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#facc15;color:#18181b;font-weight:700;cursor:pointer;margin:8px}
</style></head><body>
<h1>👻 Haunted Calculator</h1>
<div class="sub">Use each operation key EXACTLY ONCE to reach the target number!</div>
<div id="hud"><span>Level <b id="l">1</b></span><span>Moves <b id="m">0</b></span><span>Best <b id="b">—</b></span></div>
<div id="display">0</div>
<div id="target">🎯 Target: ?</div>
<div id="ops">
<button class="op" data-op="+" id="op+">+7</button>
<button class="op" data-op="*" id="op*">×2</button>
<button class="op" data-op="-" id="op-">−3</button>
<button class="op" data-op="/" id="op/">÷2</button>
<button class="op" data-op="sq" id="opsq">x²</button>
</div>
<div id="msg"></div>
<button id="btn">🔮 New Curse</button>
<audio id="au"></audio>
<script>
"use strict";
const AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
let cur=0,target=0,level=1,moves=0,used={},best=+localStorage.getItem('hc_best')||Infinity;
function rand(){return 1+((Math.random()*9)|0);}
function newGame(){cur=0;moves=0;used={};
// generate solvable: apply random op chain
const ops=['+','*','-','/','sq'];const usedOps=[];let v=0;
const picks=ops.slice().sort(()=>Math.random()-.5).slice(0,3);
picks.forEach(op=>{usedOps.push(op);
if(op==='+')v+=7;if(op==='*')v*=2;if(op==='-')v=Math.max(1,v-3);if(op==='/')v=Math.floor(v/2);if(op==='sq')v=v*v;});
target=v;document.getElementById('target').textContent='🎯 Target: '+target;
document.getElementById('display').textContent=cur;
document.getElementById('l').textContent=level;document.getElementById('m').textContent=0;
ops.forEach(o=>{document.getElementById('op'+o).disabled=false;});
msg('Use 3 cursed operations to reach '+target+'!');}
function apply(op){if(used[op]){beep(160,.08,'sawtooth');return;}
used[op]=true;document.getElementById('op'+op).disabled=true;
if(op==='+')cur+=7;if(op==='*')cur*=2;if(op==='-')cur=Math.max(0,cur-3);
if(op==='/')cur=Math.floor(cur/2);if(op==='sq')cur=cur*cur;
moves++;document.getElementById('m').textContent=moves;
document.getElementById('display').textContent=cur;beep(500+moves*60,.08,'triangle');
const usedCount=Object.keys(used).length;
if(cur===target&&usedCount>=3){beep(880,.25,'triangle');
if(moves<best){best=moves;localStorage.setItem('hc_best',best);document.getElementById('b').textContent=best;}
msg('🎉 Curse broken in '+moves+' moves! Level '+(level+1));
level++;setTimeout(newGame,1100);return;}
if(usedCount>=3){msg('😱 All curses used… press 🔮 to retry.');beep(200,.2,'sawtooth');return;}}
function msg(t){document.getElementById('msg').textContent=t;}
document.querySelectorAll('.op').forEach(b=>b.addEventListener('click',()=>{AU.__c=AU.__c||new (window.AudioContext||window.webkitAudioContext)();apply(b.dataset.op);}));
document.getElementById('btn').onclick=()=>{AU.__c=new (window.AudioContext||window.webkitAudioContext)();newGame();};
newGame();
</script></body></html>
