<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haunted Tower Stack #260</title><style>
body{margin:0;font-family:system-ui;background:#18181b;color:#fafafa;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a1a1aa;font-size:.78rem}
canvas{background:#27272a;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}
#hud b{color:#facc15}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#7c3aed;color:#fff;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>👻 Haunted Tower Stack</h1><div class="sub">Tap to drop the block — the tower sways more with each floor. Keep it balanced!</div>
<div id="hud"><span>Floors <b id="s">0</b></span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="400" height="480"></canvas>
<div id="ov"><div style="font-size:3rem">🗼</div><p>Blocks swing left-right.<br>Tap to drop — stack the haunted tower!</p><button id="btn">Build</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=400,H=480,BW=96,BH=22;
let stack=[],sway=0,playing=false,best=+localStorage.getItem('hts_best')||0;
document.getElementById('b').textContent=best;
const FLOORS=['🧱','🪦','🎃','👻','🦇'];
function draw(){ctx.fillStyle='#27272a';ctx.fillRect(0,0,W,H);
const baseY=H-40;
ctx.fillStyle='#3f3f46';ctx.fillRect(80,baseY,240,12);
// stack with progressive sway lean
let lean=0;const leanPer=Math.min(2.2,0.18+stack.length*0.03);
stack.forEach((b,i)=>{const y=baseY-12-i*BH;
const offset=lean;lean+=leanPer*(b.x<200?-1:1);
ctx.fillStyle=['#57534e','#44403c','#52525b','#3f3f46','#4b5563'][i%5];
ctx.fillRect(200-b.w/2+offset,y,b.w,BH-2);
ctx.font='14px serif';ctx.textAlign='center';
ctx.fillText(FLOORS[i%5],200+offset,y+BH-6);});
// swinging block
if(playing){const sy=50;
const amp=Math.max(30,140-stack.length*4);
const sx=200+Math.sin(sway*0.05)*amp;
const bw=Math.max(56,BW-stack.length*2);
ctx.fillStyle='#a78bfa';
ctx.fillRect(sx-bw/2,sy,bw,BH);
ctx.font='16px serif';ctx.fillText('🆕',sx,sy+BH-4);
ctx.strokeStyle='#71717a';ctx.beginPath();ctx.moveTo(200,18);ctx.lineTo(sx,sy-4);ctx.stroke();}
if(playing)requestAnimationFrame(tick);}
function tick(){sway++;draw();}
cvs.addEventListener('pointerdown',()=>{if(!playing)return;
const amp=Math.max(30,140-stack.length*4);
const sx=200+Math.sin(sway*0.05)*amp;
const bw=Math.max(56,BW-stack.length*2);
const miss=Math.abs(sx-200);
if(miss>70){fail();return;}
const newW=Math.max(40,bw-miss*0.5);
stack.push({x:sx,w:newW});
beep(440+stack.length*25,.08,'triangle');
document.getElementById('s').textContent=stack.length;
if(stack.length>best){best=stack.length;localStorage.setItem('hts_best',best);document.getElementById('b').textContent=best;}});
function fail(){playing=false;beep(130,.35,'sawtooth');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🌑 The tower crumbles at <b style="color:#facc15">'+stack.length+'</b> floors!';}
document.getElementById('btn').onclick=()=>{stack=[];sway=0;
document.getElementById('s').textContent=0;
document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();};
</script></body></html>
