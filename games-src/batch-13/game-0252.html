<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ninja Quiz Blitz #252</title><style>
body{margin:0;font-family:system-ui;background:#111827;color:#f9fafb;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#9ca3af;font-size:.78rem;max-width:320px;text-align:center}
#q{font-size:1.3rem;font-weight:800;margin:12px;color:#facc15;text-align:center;max-width:340px}
#opts{display:flex;flex-direction:column;gap:8px;width:300px;max-width:92vw}
.opt{padding:12px;border-radius:10px;border:2px solid #374151;background:#1f2937;color:#f9fafb;font-weight:700;cursor:pointer;text-align:left}
.opt:hover{border-color:#facc15}
#hud{display:flex;gap:14px;font-size:.9rem;margin:4px}
#hud b{color:#facc15}
#msg{min-height:1.4em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#facc15;color:#111827;font-weight:700;cursor:pointer;margin:8px}
</style></head><body>
<h1>🥷 Ninja Quiz Blitz</h1>
<div class="sub">10 questions, 3 lives. Wrong answers cost a life — and your streak!</div>
<div id="hud"><span>Q <b id="q">1</b>/10</span><span>❤️ <b id="h">3</b></span><span>Streak <b id="c">0</b></span><span>Score <b id="s">0</b></span></div>
<div id="qq">?</div>
<div id="opts"></div>
<div id="msg"></div>
<button id="btn">📝 Start Blitz</button>
<audio id="au"></audio>
<script>
"use strict";
const AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const QS=[
{q:'Capital of Japan?',o:['Tokyo','Kyoto','Osaka','Nara'],a:0},
{q:'2 + 2 × 3 = ?',o:['8','12','10','6'],a:0},
{q:'Which is a prime?',o:['9','11','15','21'],a:1},
{q:'Ninja are from…?',o:['China','Korea','Japan','Thailand'],a:2},
{q:'Fastest land animal?',o:['Lion','Cheetah','Horse','Leopard'],a:1},
{q:'H2O is…?',o:['Oxygen','Salt','Water','Hydrogen'],a:2},
{q:'10 − 4 × 2 = ?',o:['12','2','8','6'],a:1},
{q:'Sun rises in the…?',o:['West','North','South','East'],a:3},
{q:'Largest planet?',o:['Mars','Earth','Jupiter','Venus'],a:2},
{q:'5² − 5 = ?',o:['15','25','20','30'],a:2}];
let idx=0,lives=3,streak=0,score=0,playing=false;
function ask(){if(idx>=10){end(true);return;}
const q=QS[idx];
document.getElementById('qq').textContent='Q'+(idx+1)+': '+q.q;
const box=document.getElementById('opts');box.innerHTML='';
q.o.forEach((opt,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=opt;
b.onclick=()=>answer(i===q.a,b);box.appendChild(b);});
document.getElementById('qq').textContent=q.q;
msg('');}
function answer(ok,btn){if(!playing)return;
if(ok){streak++;score+=100+streak*25;
document.getElementById('s').textContent=score;document.getElementById('c').textContent=streak;
beep(500+streak*60,.09,'triangle');btn.style.borderColor='#22c55e';
msg('✅ Streak ×'+streak+'! +'+(100+streak*25));}
else{lives--;streak=0;document.getElementById('h').textContent=lives;document.getElementById('c').textContent=0;
beep(150,.2,'sawtooth');btn.style.borderColor='#ef4444';msg('💔 Wrong! Answer: '+QS[idx].o[QS[idx].a]);
if(lives<=0){end(false);return;}}
idx++;setTimeout(ask,700);}
function end(win){playing=false;beep(win?880:200,.25,win?'triangle':'sawtooth');
msg(win?'🏆 Blitz complete! Score: '+score:'💀 Out of lives! Score: '+score);}
function msg(t){document.getElementById('msg').textContent=t;}
document.getElementById('btn').onclick=()=>{idx=0;lives=3;streak=0;score=0;playing=true;
document.getElementById('h').textContent=3;document.getElementById('c').textContent=0;document.getElementById('s').textContent=0;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();ask();};
ask();playing=true;
</script></body></html>
