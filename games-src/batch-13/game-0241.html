<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Mega Hero #241</title><style>
body{margin:0;font-family:system-ui;background:#1c1917;color:#fafaf9;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a8a29e;font-size:.78rem}
canvas{background:#292524;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}
#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#1c1917;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🦸 Desert Mega Hero</h1><div class="sub">Your hero auto-battles — tap to cast a sandstorm blast. Don't let raiders cross!</div>
<div id="hud"><span>Wave <b id="w">1</b></span><span>HP <b id="h">100</b></span><span>Kills <b id="k">0</b></span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="460" height="300"></canvas>
<div id="ov"><div style="font-size:3rem">🦸</div><p>Tap anywhere: sandstorm blast (stuns + damages).<br>Survive the raider waves!</p><button id="btn">Defend</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=460,H=300,LANE=[70,150,230];
let me={x:60,hp:100},foes=[],wave=1,kills=0,blastCd=0,playing=false,best=+localStorage.getItem('mh_best')||0;
document.getElementById('b').textContent=best;
function spawnWave(){const n=3+wave;for(let i=0;i<n;i++){
const lane=(Math.random()*3)|0;
foes.push({x:W+20+i*36,y:LANE[lane],lane,hp:12+wave*4,sp:0.9+wave*0.09+Math.random()*0.3,stun:0});}}
function blast(){if(!playing||blastCd>0)return;blastCd=180;beep(220,.2,'sawtooth');
foes.forEach(f=>{if(Math.abs(f.x-me.x)<190){f.hp-=22;f.stun=55;}});
setTimeout(()=>{},0);}
cvs.addEventListener('pointerdown',blast);
document.addEventListener('keydown',e=>{if(e.code==='Space')blast();});
function hit(a,b){return Math.abs(a.x-b.x)<20&&Math.abs(a.y-b.y)<26;}
function step(){blastCd=Math.max(0,blastCd-1);
// hero targets nearest foe in range
let tgt=null,bd=1e9;foes.forEach(f=>{const d=Math.hypot(f.x-me.x,f.y-me.y);if(d<bd){bd=d;tgt=f;}});
if(tgt&&bd<240){me.cd=(me.cd||0)+1;if(me.cd>=22){me.cd=0;tgt.hp-=8;beep(700,.05,'triangle');
ctx.beginPath();ctx.moveTo(me.x+14,me.y-8);ctx.lineTo(tgt.x,tgt.y);ctx.strokeStyle='#fbbf24';ctx.lineWidth=2;ctx.stroke();}}
foes.forEach(f=>{if(f.stun>0){f.stun--;return;}
f.x-=f.sp;
if(f.x<40){me.hp-=10;f.hp=0;beep(150,.15,'sawtooth');}});
foes=foes.filter(f=>f.hp>0);
const dead=kills;foes.forEach(f=>{}); 
foes.forEach(f=>{if(f.hp<=0)kills++;});
// recount kills properly
if(foes.length===0&&playing){wave++;document.getElementById('w').textContent=wave;
me.hp=Math.min(100,me.hp+18);setTimeout(spawnWave,700);}
document.getElementById('h').textContent=me.hp;
document.getElementById('k').textContent=kills;}
function die(){if(!playing)return;playing=false;beep(130,.35,'sawtooth');
if(wave>best){best=wave;localStorage.setItem('mh_best',best);document.getElementById('b').textContent=best;}
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='💀 Overwhelmed on wave <b style="color:#fbbf24">'+wave+'</b> · Kills: '+kills;}
function draw(){ctx.fillStyle='#292524';ctx.fillRect(0,0,W,H);
LANE.forEach(y=>{ctx.strokeStyle='#44403c';ctx.beginPath();ctx.moveTo(0,y+18);ctx.lineTo(W,y+18);ctx.stroke();});
ctx.font='32px serif';ctx.textAlign='center';ctx.fillText('🦸',me.x,me.y+10);
foes.forEach(f=>{ctx.globalAlpha=f.stun>0?0.5:1;ctx.font='26px serif';ctx.fillText(f.stun>0?'💫':'🏴‍☠️',f.x,f.y+8);ctx.globalAlpha=1;});
if(blastCd>150){ctx.strokeStyle='#fbbf24';ctx.beginPath();ctx.arc(me.x,me.y,190*(1-blastCd/180+0.4),0,7);ctx.stroke();}
if(playing){if(me.hp<=0){die();return;}step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{me={x:60,hp:100};foes=[];wave=1;kills=0;blastCd=0;
document.getElementById('w').textContent=1;document.getElementById('h').textContent=100;document.getElementById('k').textContent=0;
document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();spawnWave();draw();};
</script></body></html>
