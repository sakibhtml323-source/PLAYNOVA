<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crystal Ball Sort #245</title><style>
body{margin:0;font-family:system-ui;background:#0f172a;color:#e2e8f0;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#94a3b8;font-size:.78rem}
#tubes{display:flex;gap:10px;margin:12px;flex-wrap:wrap;justify-content:center;max-width:420px}
.tube{display:flex;flex-direction:column-reverse;justify-content:flex-start;width:46px;height:150px;background:#1e293b;border:2px solid #334155;border-radius:0 0 22px 22px;cursor:pointer;padding:3px}
.tube.sel{border-color:#facc15}
.ball{width:38px;height:38px;border-radius:50%;margin:1px auto;display:flex;align-items:center;justify-content:center;font-size:17px}
#hud{display:flex;gap:14px;font-size:.9rem;margin:4px}
#hud b{color:#facc15}
#msg{min-height:1.3em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#7c3aed;color:#fff;font-weight:700;cursor:pointer;margin:8px}
</style></head><body>
<h1>🔮 Crystal Ball Sort</h1><div class="sub">Tap a tube to lift its top ball, tap another to drop. Sort each color into its own tube!</div>
<div id="hud"><span>Moves <b id="m">0</b></span><span>Best <b id="b">—</b></span></div>
<div id="tubes"></div><div id="msg"></div>
<button id="btn">✨ New Arrangement</button>
<audio id="au"></audio>
<script>
"use strict";
const AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const BALLS=['💜','❤️','💙','💚','💛','🧡'];
const CAP=4;let tubes=[],sel=null,moves=0,best=+localStorage.getItem('bs_best')||Infinity;
function newGame(){const nc=Math.min(3+((moves>0)?1:0),6);
// tubes = nc color tubes + 2 empty
const n=nc;tubes=[];
const all=[];for(let c=0;c<nc;c++)for(let k=0;k<CAP;k++)all.push(c);
// shuffle
for(let i=all.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[all[i],all[j]]=[all[j],all[i]];}
for(let t=0;t<nc+2;t++)tubes.push([]);
for(let t=0;t<nc;t++)for(let k=0;k<CAP;k++)tubes[t].push(all[t*CAP+k]);
// extra shuffle safety: if already solved, swap two
moves=0;sel=null;document.getElementById('m').textContent=0;render();msg('Sort the crystal balls!');}
function tap(i){const T=tubes[i];
if(sel===null){if(!T.length){beep(160,.06,'sawtooth');return;}
sel=i;render();return;}
if(sel===i){sel=null;render();return;}
const from=tubes[sel];
if(T.length>=CAP){beep(160,.06,'sawtooth');return;}
// only allow if target empty or same color on top
const b=from[from.length-1];
if(T.length&&T[T.length-1]!==b){beep(160,.06,'sawtooth');return;}
T.push(from.pop());sel=null;moves++;document.getElementById('m').textContent=moves;
beep(440+moves*20,.06);render();check();}
function check(){if(tubes.every(T=>!T.length||T.every(b=>b===T[0]))){beep(880,.25,'triangle');
if(moves<best){best=moves;localStorage.setItem('bs_best',best);}
msg('🎉 All sorted in '+moves+' moves!');document.getElementById('b').textContent=best;}}
function render(){const el=document.getElementById('tubes');el.innerHTML='';
tubes.forEach((T,i)=>{const d=document.createElement('div');
d.className='tube'+(sel===i?' sel':'');
T.forEach(b=>{const ball=document.createElement('div');ball.className='ball';
ball.style.background=['#7c3aed22','#dc262622','#2563eb22','#16a34a22','#eab30822','#ea580c22'][b];
ball.textContent=BALLS[b];d.appendChild(ball);});
d.onclick=()=>{AU.__c=AU.__c||new (window.AudioContext||window.webkitAudioContext)();tap(i);};
el.appendChild(d);});}
function msg(t){document.getElementById('msg').textContent=t;}
document.getElementById('btn').onclick=()=>{AU.__c=new (window.AudioContext||window.webkitAudioContext)();newGame();};
newGame();
</script></body></html>
