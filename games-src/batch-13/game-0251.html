<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crystal Balance #251</title><style>
body{margin:0;font-family:system-ui;background:#0f172a;color:#e2e8f0;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#94a3b8;font-size:.78rem}
canvas{background:#1e293b;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}
#hud b{color:#facc15}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#7c3aed;color:#fff;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🔮 Crystal Balance</h1><div class="sub">Tilt with arrow keys / drag — roll the orb into the crystal portal. Don't hit the spikes!</div>
<div id="hud"><span>Level <b id="l">1</b></span><span>Deaths <b id="d">0</b></span><span>Time <b id="t">0</b>s</span></div>
<canvas id="cv" width="440" height="440"></canvas>
<div id="ov"><div style="font-size:3rem">🔮</div><p>Guide the orb to the portal.<br>Arrow keys or drag to tilt!</p><button id="btn">Begin</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=440;
let me={x:60,y:60,vx:0,vy:0},goal={x:380,y:380},spikes=[],walls=[],level=1,deaths=0,playing=false,startT=0;
const tilt={x:0,y:0};
function build(){walls=[];spikes=[];
const n=2+level;
for(let i=0;i<n;i++){const horiz=Math.random()<0.5;
walls.push(horiz?{x:80+Math.random()*280,y:80+i*70,w:120,h:12}:{x:80+i*70,y:80+Math.random()*280,w:12,h:120});}
for(let i=0;i<level+1;i++){spikes.push({x:100+Math.random()*240,y:100+Math.random()*240,r:10});}
me={x:40,y:40,vx:0,vy:0};document.getElementById('l').textContent=level;}
function step(dt){me.vx+=tilt.x*0.28;me.vy+=tilt.y*0.28;
me.vx*=0.94;me.vy*=0.94;me.x+=me.vx;me.y+=me.vy;
if(me.x<14){me.x=14;me.vx=0;}if(me.x>W-14){me.x=W-14;me.vx=0;}
if(me.y<14){me.y=14;me.vy=0;}if(me.y>H-14){me.y=H-14;me.vy=0;}
walls.forEach(wl=>{if(me.x>wl.x-12&&me.x<wl.x+wl.w+12&&me.y>wl.y-12&&me.y<wl.y+wl.h+12){
const dl=Math.abs(me.x-(wl.x-12)),dr=Math.abs((wl.x+wl.w+12)-me.x);
const dtp=Math.abs(me.y-(wl.y-12)),db=Math.abs((wl.y+wl.h+12)-me.y);
const m=Math.min(dl,dr,dtp,db);
if(m===dl){me.x=wl.x-12;me.vx=0;}else if(m===dr){me.x=wl.x+wl.w+12;me.vx=0;}
else if(m===dtp){me.y=wl.y-12;me.vy=0;}else{me.y=wl.y+wl.h+12;me.vy=0;}}});
spikes.forEach(s=>{if(Math.hypot(me.x-s.x,me.y-s.y)<s.r+11){die();}});
if(Math.hypot(me.x-goal.x,me.y-goal.y)<24){beep(880,.25,'triangle');level++;document.getElementById('l').textContent=level;build();}}
function die(){deaths++;document.getElementById('d').textContent=deaths;beep(130,.25,'sawtooth');me={x:40,y:40,vx:0,vy:0};}
function draw(){ctx.fillStyle='#1e293b';ctx.fillRect(0,0,W,H);
walls.forEach(wl=>{ctx.fillStyle='#475569';ctx.fillRect(wl.x,wl.y,wl.w,wl.h);});
spikes.forEach(s=>{ctx.font='20px serif';ctx.textAlign='center';ctx.fillText('🔺',s.x,s.y+7);});
ctx.font='28px serif';ctx.fillText('🌀',goal.x,goal.y+10);
ctx.beginPath();ctx.arc(me.x,me.y,11,0,7);ctx.fillStyle='#7c3aed';ctx.fill();
ctx.strokeStyle='#c4b5fd';ctx.stroke();
document.getElementById('t').textContent=((Date.now()-startT)/1000).toFixed(0);
if(playing){step(1/60);requestAnimationFrame(draw);}}
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();
tilt.x=k==='arrowleft'||k==='a'?-1:k==='arrowright'||k==='d'?1:0;
tilt.y=k==='arrowup'||k==='w'?-1:k==='arrowdown'||k==='s'?1:0;});
let drag=null;
cvs.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};});
cvs.addEventListener('pointermove',e=>{if(!drag)return;
tilt.x=Math.max(-1,Math.min(1,(e.clientX-drag.x)/60));
tilt.y=Math.max(-1,Math.min(1,(e.clientY-drag.y)/60));});
cvs.addEventListener('pointerup',()=>{drag=null;tilt.x=0;tilt.y=0;});
document.getElementById('btn').onclick=()=>{level=1;deaths=0;document.getElementById('d').textContent=0;build();
document.getElementById('ov').style.display='none';playing=true;startT=Date.now();
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();};
</script></body></html>
