<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haunted Library #395</title><style>
body{margin:0;font-family:system-ui;background:#18181b;color:#fafafa;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a1a1aa;font-size:.78rem}
#shelf{display:flex;gap:5px;margin:14px;background:#27272a;border:3px solid #3f3f46;border-radius:10px;padding:10px;min-height:90px}
.book{width:44px;height:70px;border-radius:4px;cursor:pointer;transition:transform .12s;border:2px solid #0006}
.book.sel{transform:translateY(-14px) scale(1.08);border-color:#facc15}
#hud{display:flex;gap:14px;font-size:.9rem;margin:4px}#hud b{color:#facc15}
#msg{min-height:1.3em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#7c3aed;color:#fff;font-weight:700;cursor:pointer;margin:8px}
</style></head><body>
<h1>📚 Haunted Library</h1><div class="sub">Arrange the books by color — but the ghost tilts the shelf as you sort!</div>
<div id="hud"><span>Moves <b id="m">0</b></span><span>Level <b id="l">1</b></span></div>
<div id="shelf"></div>
<div id="msg"></div>
<button id="btn">👻 New Shelf</button>
<audio id="au"></audio>
<script>
"use strict";
const AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const COLORS=['#dc2626','#ea580c','#eab308','#22c55e','#3b82f6','#7c3aed'];
let books=[],sel=null,moves=0,level=1,tilt=0;
function gen(){const n=Math.min(4+level,6);books=[];sel=null;moves=0;
const cols=COLORS.slice(0,n);
for(let i=0;i<n;i++)books.push({c:cols[i]});
// shuffle
for(let i=books.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;
[books[i],books[j]]=[books[j],books[i]];}
tilt=(Math.random()*8-4);applyTilt();
document.getElementById('l').textContent=level;
render();msg('Sort the books!');}
function applyTilt(){const s=document.getElementById('shelf');
s.style.transform='rotate('+tilt+'deg)';}
function tap(i){if(sel===null){sel=i;render();return;}
if(sel===i){sel=null;render();return;}
[books[sel],books[i]]=[books[i],books[sel]];
sel=null;moves++;document.getElementById('m').textContent=moves;
tilt=Math.max(-8,Math.min(8,tilt+(Math.random()*4-2)));applyTilt();
beep(400,.06);render();check();}
function check(){const ok=books.every((b,i)=>i===0||books[i-1].c.localeCompare(b.c)<0||COLORS.indexOf(books[i-1].c)<COLORS.indexOf(b.c));
const sorted=books.every((b,i)=>i===0||COLORS.indexOf(books[i-1].c)<=COLORS.indexOf(b.c));
if(sorted){beep(880,.3,'triangle');msg('📚 Shelf sorted! Level '+(level+1));level++;
setTimeout(gen,1000);}}
function render(){const s=document.getElementById('shelf');s.innerHTML='';
books.forEach((b,i)=>{const d=document.createElement('div');d.className='book'+(sel===i?' sel':'');
d.style.background=b.c;
d.onclick=()=>{AU.__c=AU.__c||new (window.AudioContext||window.webkitAudioContext)();tap(i);};
s.appendChild(d);});}
function msg(t){document.getElementById('msg').textContent=t;}
document.getElementById('btn').onclick=()=>{level=1;AU.__c=new (window.AudioContext||window.webkitAudioContext)();gen();};
gen();
</script></body></html>
