<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Moon Phase #399</title><style>
body{margin:0;font-family:system-ui;background:#0c1445;color:#e0e7ff;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#93c5fd;font-size:.78rem}
#sky{display:flex;gap:10px;margin:14px;flex-wrap:wrap;justify-content:center}
.moon{width:76px;height:76px;background:#111936;border:2px solid #334155;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:38px;cursor:pointer;transition:transform .1s}
.moon.sel{outline:3px solid #fbbf24;transform:scale(1.1)}
#hud{display:flex;gap:14px;font-size:.9rem;margin:4px}#hud b{color:#fbbf24}
#msg{min-height:1.3em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#fbbf24;color:#0c1445;font-weight:800;cursor:pointer;margin:8px}
</style></head><body>
<h1>🌙 Desert Moon Phase</h1><div class="sub">The moon phases are scrambled — arrange them in the correct lunar order!</div>
<div id="hud"><span>Correct <b id="c">0</b>/8</span><span>Moves <b id="m">0</b></span><span>Streak <b id="s">0</b></span></div>
<div id="sky"></div>
<div id="msg"></div>
<button id="btn">✨ New Night</button>
<audio id="au"></audio>
<script>
"use strict";
const AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const PHASES=['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'];
let moons=[],sel=null,moves=0,streak=0;
function gen(){moons=PHASES.map((e,i)=>({e,correct:i})).sort(()=>Math.random()-.5);
sel=null;moves=0;
document.getElementById('m').textContent=0;
render();msg('Order the moon phases!');}
function tap(i){if(sel===null){sel=i;render();return;}
if(sel===i){sel=null;render();return;}
[moons[sel],moons[i]]=[moons[i],moons[sel]];
sel=null;moves++;document.getElementById('m').textContent=moves;
beep(400,.06);render();check();}
function check(){const n=moons.filter((m,i)=>m.correct===i).length;
document.getElementById('c').textContent=n;
if(n>=8){streak++;document.getElementById('s').textContent=streak;
beep(880,.3,'triangle');msg('🌕 Lunar cycle complete in '+moves+'! Streak '+streak);}}
function render(){const s=document.getElementById('sky');s.innerHTML='';
moons.forEach((m,i)=>{const d=document.createElement('div');d.className='moon'+(sel===i?' sel':'');
d.textContent=m.e;
d.onclick=()=>{AU.__c=AU.__c||new (window.AudioContext||window.webkitAudioContext)();tap(i);};
s.appendChild(d);});}
function msg(t){document.getElementById('msg').textContent=t;}
document.getElementById('btn').onclick=()=>{streak=0;document.getElementById('s').textContent=0;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();gen();};
gen();
</script></body></html>
