<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ninja Storm Dodge #400</title><style>
body{margin:0;font-family:system-ui;background:#0f172a;color:#e2e8f0;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#94a3b8;font-size:.78rem}
canvas{background:#1e293b;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#0f172a;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>⛈️ Ninja Storm Dodge</h1><div class="sub">Lightning flashes reveal safe tiles — then you must move there from memory!</div>
<div id="hud"><span>Round <b id="r">1</b></span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="440" height="440"></canvas>
<div id="ov"><div style="font-size:3rem">⚡</div><p>Watch the flash — it shows SAFE tiles.<br>Then the lights go out: tap a remembered safe tile!</p><button id="btn">Survive</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const N=5,CELL=440/N;let safe=[],phase='flash',round=1,best=+localStorage.getItem('nsd_best')||0,timer=null;
document.getElementById('b').textContent=best;
function newRound(){const n=Math.max(1,5-Math.floor(round/3));
safe=[];const cells=[];
for(let r=0;r<N;r++)for(let c=0;c<N;c++)cells.push(r*N+c);
cells.sort(()=>Math.random()-.5);
for(let i=0;i<n;i++)safe.push(cells[i]);
phase='flash';document.getElementById('r').textContent=round;
draw();
timer=setTimeout(()=>{phase='dark';draw();
setTimeout(()=>{phase='pick';msgShow('Tap a safe tile!');},400);},700+round*80);}
function msgShow(t){const el=document.createElement('div');
el.style.cssText='position:fixed;bottom:60px;left:50%;transform:translateX(-50%);color:#fbbf24;font-weight:700';
el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),1500);}
cvs.addEventListener('pointerdown',e=>{if(phase!=='pick')return;const r=cvs.getBoundingClientRect();
const c=Math.floor((e.clientX-r.left)/r.width*N),rr=Math.floor((e.clientY-r.top)/r.height*N);
const cell=rr*N+c;
if(safe.includes(cell)){beep(700,.15,'triangle');msgShow('✅ Safe! Round '+(round+1));round++;
if(round>best){best=round;localStorage.setItem('nsd_best',best);document.getElementById('b').textContent=best;}
setTimeout(newRound,700);}
else{beep(150,.3,'sawtooth');msgShow('⚡ STRUCK! Round '+round);
phase='over';draw();}});
function draw(){ctx.fillStyle='#1e293b';ctx.fillRect(0,0,440,440);
for(let r=0;r<N;r++)for(let c=0;c<N;c++){const i=r*N+c;
let fill='#334155';
if(phase==='flash'&&safe.includes(i))fill='#fbbf24';
if(phase==='over'&&safe.includes(i))fill='#22c55e';
if(phase==='over'&&!safe.includes(i))fill='#7f1d1d';
ctx.fillStyle=fill;
ctx.fillRect(c*CELL+3,r*CELL+3,CELL-6,CELL-6);}}
document.getElementById('btn').onclick=()=>{round=1;
document.getElementById('ov').style.display='none';
AU.__c=new (window.AudioContext||window.webkitAudioContext)();newRound();};
</script></body></html>
