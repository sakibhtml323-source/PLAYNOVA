<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ninja Lantern Catch #389</title><style>
body{margin:0;font-family:system-ui;background:#0a0a1a;color:#e2e8f0;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#94a3b8;font-size:.78rem}
canvas{background:#111122;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#0a0a1a;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🏮 Ninja Lantern Catch</h1><div class="sub">Firelights drift on the night wind — catch them in your lantern!</div>
<div id="hud"><span>Caught <b id="c">0</b></span><span>⏱️ <b id="t">40</b>s</span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="440" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">🌙</div><p>Drag the lantern.<br>Firelights drift with the wind!</p><button id="btn">Catch</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=400;let lantern={x:W/2,y:H-60},lights=[],caught=0,playing=false,spawnT=0,time=40,timer=null,best=+localStorage.getItem('nlc_best')||0;
document.getElementById('b').textContent=best;
function spawn(){lights.push({x:20+Math.random()*(W-40),y:-16,
vx:(Math.random()*2-1)*0.8,vy:0.8+Math.random()*0.8,ph:Math.random()*6});}
cvs.addEventListener('pointermove',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
lantern.x=(e.clientX-r.left)*W/r.width;lantern.y=(e.clientY-r.top)*H/r.height;});
document.addEventListener('keydown',e=>{if(!playing)return;
if(e.key==='ArrowLeft')lantern.x=Math.max(24,lantern.x-22);
if(e.key==='ArrowRight')lantern.x=Math.min(W-24,lantern.x+22);
if(e.key==='ArrowUp')lantern.y=Math.max(30,lantern.y-22);
if(e.key==='ArrowDown')lantern.y=Math.min(H-20,lantern.y+22);});
function step(){spawnT++;if(spawnT>Math.max(28,55-caught*0.5)){spawnT=0;spawn();}
lights.forEach(l=>{l.ph+=0.04;
l.x+=l.vx+Math.sin(l.ph)*0.6;l.y+=l.vy;
if(l.x<10||l.x>W-10)l.vx*=-1;});
lights=lights.filter(l=>{if(Math.hypot(l.x-lantern.x,l.y-lantern.y)<26){
caught++;document.getElementById('c').textContent=caught;
beep(600+caught*15,.08);
if(caught>best){best=caught;localStorage.setItem('nlc_best',best);document.getElementById('b').textContent=best;}
return false;}
return l.y<H+20;});}
function draw(){ctx.fillStyle='#111122';ctx.fillRect(0,0,W,H);
for(let i=0;i<25;i++){ctx.fillStyle='#ffffff15';ctx.fillRect((i*89)%W,(i*61)%W,2,2);}
// lantern glow
const g2=ctx.createRadialGradient(lantern.x,lantern.y,6,lantern.x,lantern.y,50);
g2.addColorStop(0,'#fbbf2455');g2.addColorStop(1,'#fbbf2400');
ctx.fillStyle=g2;ctx.beginPath();ctx.arc(lantern.x,lantern.y,50,0,7);ctx.fill();
ctx.font='28px serif';ctx.textAlign='center';ctx.fillText('🏮',lantern.x,lantern.y+8);
lights.forEach(l=>{ctx.font='16px serif';ctx.fillText('✨',l.x,l.y);
ctx.globalAlpha=0.3;ctx.beginPath();ctx.arc(l.x,l.y,8,0,7);
ctx.fillStyle='#fbbf24';ctx.fill();ctx.globalAlpha=1;});
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{lights=[];caught=0;spawnT=0;time=40;
document.getElementById('c').textContent=0;document.getElementById('t').textContent=40;
document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();
clearInterval(timer);timer=setInterval(()=>{time--;document.getElementById('t').textContent=time;
if(time<=0){playing=false;clearInterval(timer);
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🌅 Dawn breaks!<br>Caught: <b style="color:#fbbf14">'+caught+'</b>';}},1000);};
</script></body></html>
