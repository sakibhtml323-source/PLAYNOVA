<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Scarab Maze #396</title><style>
body{margin:0;font-family:system-ui;background:#451a03;color:#fef3c7;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#fde68a;font-size:.78rem}
#grid{display:grid;grid-template-columns:repeat(6,56px);gap:3px;margin:12px}
.c{width:56px;height:56px;background:#78350f;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px}
.c.wall{background:#451a03}
.c.me{background:#b45309;outline:2px solid #fbbf24}
.c.goal{background:#166534}
#pad{display:grid;grid-template-columns:repeat(3,52px);gap:4px;margin:8px}
.pd{width:52px;height:42px;border-radius:10px;border:none;background:#92400e;color:#fff;font-size:1.1rem;cursor:pointer}
#hud{display:flex;gap:14px;font-size:.9rem;margin:4px}#hud b{color:#fbbf24}
#msg{min-height:1.3em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#fbbf24;color:#451a03;font-weight:800;cursor:pointer;margin:8px}
</style></head><body>
<h1>🪲 Desert Scarab Maze</h1><div class="sub">The scarab rolls until it hits a wall — plan the route to the dung ball!</div>
<div id="hud"><span>Moves <b id="m">0</b></span><span>Level <b id="l">1</b></span><span>Best <b id="b">—</b></span></div>
<div id="grid"></div>
<div id="pad"><div></div><button class="pd" data-d="u">⬆</button><div></div>
<button class="pd" data-d="l">⬅</button><button class="pd" data-d="d">⬇</button><button class="pd" data-d="r">➡</button></div>
<div id="msg"></div>
<button id="btn">🏜️ New Dune</button>
<audio id="au"></audio>
<script>
"use strict";
const AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const N=6;let grid=[],me={r:0,c:0},goal={r:5,c:5},moves=0,level=1,playing=true,best=+localStorage.getItem('dsm_best')||Infinity;
document.getElementById('b').textContent=best<Infinity?best:'—';
function gen(){grid=[];for(let r=0;r<N;r++){const row=[];for(let c=0;c<N;c++)row.push(0);grid.push(row);}
const nw=4+level;
for(let i=0;i<nw;i++){const r=(Math.random()*N)|0,c=(Math.random()*N)|0;
if((r===0&&c===0)||(r===5&&c===5))continue;grid[r][c]=1;}
me={r:0,c:0};goal={r:5,c:5};moves=0;playing=true;
document.getElementById('m').textContent=0;document.getElementById('l').textContent=level;
render();msg('Roll to the dung ball!');}
function roll(dr,dc){if(!playing)return;
let r=me.r,c=me.c,steps=0;
while(true){const nr=r+dr,nc=c+dc;
if(nr<0||nr>=N||nc<0||nc>=N)break;
if(grid[nr][nc])break;
r=nr;c=nc;steps++;
if(r===goal.r&&c===goal.c)break;}
if(!steps){beep(160,.06,'sawtooth');return;}
me={r,c};moves++;document.getElementById('m').textContent=moves;
beep(400+steps*40,.08);render();
if(r===goal.r&&c===goal.c){playing=false;beep(880,.3,'triangle');
if(moves<best){best=moves;localStorage.setItem('dsm_best',best);document.getElementById('b').textContent=best;}
msg('🪲 Found it in '+moves+'! Level '+(level+1));level++;
setTimeout(gen,1000);}}
function render(){const g=document.getElementById('grid');g.innerHTML='';
for(let r=0;r<N;r++)for(let c=0;c<N;c++){const d=document.createElement('div');
d.className='c'+(grid[r][c]?' wall':'');
if(r===me.r&&c===me.c){d.classList.add('me');d.textContent='🪲';}
else if(r===goal.r&&c===goal.c){d.classList.add('goal');d.textContent='⚽';}
else if(grid[r][c])d.textContent='🌵';
g.appendChild(d);}}
document.querySelectorAll('.pd').forEach(b=>b.addEventListener('pointerdown',()=>{
AU.__c=AU.__c||new (window.AudioContext||window.webkitAudioContext)();
const d=b.dataset.d;
if(d==='u')roll(-1,0);if(d==='d')roll(1,0);if(d==='l')roll(0,-1);if(d==='r')roll(0,1);}));
function msg(t){document.getElementById('msg').textContent=t;}
document.getElementById('btn').onclick=()=>{AU.__c=new (window.AudioContext||window.webkitAudioContext)();gen();};
gen();
</script></body></html>
