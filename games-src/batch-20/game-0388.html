<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Oasis Hop #388</title><style>
body{margin:0;font-family:system-ui;background:#0c4a6e;color:#e0f2fe;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#7dd3fc;font-size:.78rem}
canvas{background:#075985;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#38bdf8;color:#0c4a6e;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🐸 Desert Oasis Hop</h1><div class="sub">Tap to hop — the lily pads SHRINK! Land before they vanish.</div>
<div id="hud"><span>Hops <b id="h">0</b></span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="440" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">🪷</div><p>Tap anywhere to hop toward it.<br>Pads shrink fast — keep moving!</p><button id="btn">Hop</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=400;let me={x:W/2,y:H/2},pads=[],hops=0,playing=false,best=+localStorage.getItem('doh_best')||0,target=null;
document.getElementById('b').textContent=best;
function spawnPad(){const a=Math.random()*Math.PI*2,d=90+Math.random()*70;
pads.push({x:Math.max(50,Math.min(W-50,me.x+Math.cos(a)*d)),
y:Math.max(50,Math.min(H-50,me.y+Math.sin(a)*d)),r:34,max:34,life:1});}
function gen(){me={x:W/2,y:H/2};pads=[];hops=0;playing=true;target=null;
spawnPad();spawnPad();spawnPad();
document.getElementById('h').textContent=0;draw();}
cvs.addEventListener('pointerdown',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
target={x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};});
cvs.addEventListener('pointermove',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
target={x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};});
function step(){// shrink pads
pads.forEach(p=>{p.r-=0.12+p.max*0.002;});
const dead=pads.find(p=>p.r<8);
if(dead){// check if player on it
if(Math.hypot(me.x-dead.x,me.y-dead.y)<dead.r+6){fall();return;}
pads=pads.filter(p=>p!==dead);spawnPad();}
// move
if(target){const dx=target.x-me.x,dy=target.y-me.y,d=Math.hypot(dx,dy);
if(d>6){me.x+=dx/d*3.4;me.y+=dy/d*3.4;}}
me.x=Math.max(16,Math.min(W-16,me.x));me.y=Math.max(16,Math.min(H-16,me.y));
// landing on pad
let onPad=false;
pads.forEach(p=>{if(Math.hypot(me.x-p.x,me.y-p.y)<p.r*0.8){
if(!p.landed){p.landed=true;hops++;document.getElementById('h').textContent=hops;
beep(500+hops*20,.08);
if(hops>best){best=hops;localStorage.setItem('doh_best',best);document.getElementById('b').textContent=best;}}
onPad=true;}});
if(!onPad){// drift down
}}
function fall(){playing=false;beep(130,.35,'sawtooth');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='💦 Splash!<br>Hops: <b style="color:#fbbf14">'+hops+'</b>';}
function draw(){ctx.fillStyle='#075985';ctx.fillRect(0,0,W,H);
pads.forEach(p=>{ctx.beginPath();ctx.ellipse(p.x,p.y,p.r,p.r*0.55,0,0,7);
ctx.fillStyle=p.landed?'#16a34a':'#22c55e';ctx.fill();
ctx.strokeStyle='#86efac';ctx.lineWidth=2;ctx.stroke();ctx.lineWidth=1;});
ctx.font='26px serif';ctx.textAlign='center';ctx.fillText('🐸',me.x,me.y+8);
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{gen();
document.getElementById('ov').style.display='none';
AU.__c=new (window.AudioContext||window.webkitAudioContext)();};
</script></body></html>
