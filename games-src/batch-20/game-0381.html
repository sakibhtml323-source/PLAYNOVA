<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ninja Leaf Glide #381</title><style>
body{margin:0;font-family:system-ui;background:#14532d;color:#f0fdf4;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#bbf7d0;font-size:.78rem}
canvas{background:#166534;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#14532d;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🍂 Ninja Leaf Glide</h1><div class="sub">Glide the falling leaf — steer with the wind, land on the shrine target!</div>
<div id="hud"><span>Level <b id="l">1</b></span><span>Wind <b id="w">→</b></span><span>Landed <b id="d">0</b></span></div>
<canvas id="cv" width="440" height="460"></canvas>
<div id="ov"><div style="font-size:3rem">🍃</div><p>Tap/hold left or right side to steer.<br>Land on the 🎯 as close to center as you can!</p><button id="btn">Glide</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=460;let leaf={x:W/2,y:30,vy:1.2},wind=0,windT=0,playing=false,level=1,landed=0,holdDir=0;
function newDrop(){leaf={x:W/2,y:30,vy:1.1+level*0.1};wind=0;windT=0;playing=true;draw();}
function targetX(){return 80+((level*137)%280);}
cvs.addEventListener('pointerdown',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
holdDir=(e.clientX-r.left)<r.width/2?-1:1;});
cvs.addEventListener('pointerup',()=>{holdDir=0;});
document.addEventListener('keydown',e=>{if(!playing)return;
if(e.key==='ArrowLeft')holdDir=-1;if(e.key==='ArrowRight')holdDir=1;});
document.addEventListener('keyup',()=>{holdDir=0;});
function step(){windT++;if(windT>90){windT=0;wind=(Math.random()*2-1)*1.2;
document.getElementById('w').textContent=wind>0?'→':'←';}
leaf.x+=wind+holdDir*1.8;
leaf.y+=leaf.vy;
leaf.x=Math.max(20,Math.min(W-20,leaf.x));
if(leaf.y>H-70){land();}}
function land(){playing=false;
const tx=targetX();const miss=Math.abs(leaf.x-tx);
let pts=0,msg2='';
if(miss<20){pts=100;msg2='🎯 Bullseye!';beep(880,.3,'triangle');}
else if(miss<50){pts=50;msg2='👍 Close!';beep(600,.15,'triangle');}
else{pts=10;msg2='💨 Off target…';beep(200,.15,'sawtooth');}
landed+=pts;document.getElementById('d').textContent=landed;
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML=msg2+'<br>+'+pts+' · Level '+(level+1);
level++;}
function draw(){ctx.fillStyle='#166534';ctx.fillRect(0,0,W,H);
// wind streaks
ctx.fillStyle='#86efac33';
for(let i=0;i<6;i++)ctx.fillRect((Date.now()/6+i*70)%W,50+i*60,wind*18,2);
// target
const tx=targetX();
ctx.strokeStyle='#fbbf24';ctx.lineWidth=3;
ctx.beginPath();ctx.arc(tx,H-56,26,0,7);ctx.stroke();
ctx.beginPath();ctx.arc(tx,H-56,12,0,7);ctx.stroke();
ctx.fillStyle='#4338ca';ctx.fillRect(0,H-40,W,40);
ctx.font='30px serif';ctx.textAlign='center';
ctx.fillText('🍂',leaf.x,leaf.y+6);
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{level=1;landed=0;
document.getElementById('l').textContent=1;document.getElementById('d').textContent=0;
document.getElementById('ov').style.display='none';
AU.__c=new (window.AudioContext||window.webkitAudioContext)();newDrop();};
document.getElementById('l').textContent=1;
</script></body></html>
