<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Royal Card Castle #387</title><style>
body{margin:0;font-family:system-ui;background:#1e1b4b;color:#eef2ff;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a5b4fc;font-size:.78rem}
canvas{background:#312e81;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#1e1b4b;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🃏 Royal Card Castle</h1><div class="sub">Tap to place cards on the tower — the wider the base, the higher you build!</div>
<div id="hud"><span>Floors <b id="f">0</b></span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="400" height="480"></canvas>
<div id="ov"><div style="font-size:3rem">🏰</div><p>Tap to drop a card.<br>Keep the tower balanced — 20 floors wins!</p><button id="btn">Build</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=400,H=480,CW=110,CH=16;let stack=[],sway=0,playing=false,best=+localStorage.getItem('rcc2_best')||0;
document.getElementById('b').textContent=best;
function draw(){ctx.fillStyle='#312e81';ctx.fillRect(0,0,W,H);
const baseY=H-36;
ctx.fillStyle='#4338ca';ctx.fillRect(70,baseY,260,12);
let lean=0;const leanPer=Math.min(2,0.25+stack.length*0.06);
stack.forEach((c,i)=>{const y=baseY-12-i*CH;
lean+=leanPer*(c.x<200?-1:1);
ctx.save();ctx.translate(200+lean,y);ctx.rotate(lean*0.008);
ctx.fillStyle=['#f8fafc','#eef2ff','#e0e7ff'][i%3];
ctx.fillRect(-CW/2,-CH+2,CW,CH-2);
ctx.strokeStyle='#4f46e5';ctx.strokeRect(-CW/2,-CH+2,CW,CH-2);
ctx.font='9px serif';ctx.textAlign='center';ctx.fillText('A♠',0,-CH/2+4);
ctx.restore();});
if(playing){const sy=60;
const sx=200+Math.sin(sway*0.05)*Math.max(30,130-stack.length*4);
ctx.fillStyle='#f8fafc';ctx.fillRect(sx-CW/2,sy,CW,CH);
ctx.strokeStyle='#fbbf24';ctx.strokeRect(sx-CW/2,sy,CW,CH);
requestAnimationFrame(tick);}}
function tick(){sway++;draw();}
cvs.addEventListener('pointerdown',()=>{if(!playing)return;
const sx=200+Math.sin(sway*0.05)*Math.max(30,130-stack.length*4);
stack.push({x:sx});
beep(440+stack.length*25,.08);
document.getElementById('f').textContent=stack.length;
if(stack.length>best){best=stack.length;localStorage.setItem('rcc2_best',best);document.getElementById('b').textContent=best;}
// balance check: average offset
if(stack.length>3){const avg=stack.reduce((a,c)=>a+(c.x-200),0)/stack.length;
if(Math.abs(avg)>28){collapse();}
else if(stack.length>=20){playing=false;beep(880,.3,'triangle');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🏰 Castle complete!<br>20 floors!';}
else if(stack.length%5===0){beep(600,.1,'triangle');}}});
function collapse(){playing=false;beep(130,.35,'sawtooth');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🃏 The castle falls at <b style="color:#fbbf14">'+stack.length+'</b> floors!';}
document.getElementById('btn').onclick=()=>{stack=[];sway=0;
document.getElementById('f').textContent=0;
document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();};
</script></body></html>
