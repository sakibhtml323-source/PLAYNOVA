<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haunted Echo #384</title><style>
body{margin:0;font-family:system-ui;background:#18181b;color:#fafafa;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a1a1aa;font-size:.78rem}
#cave{display:flex;gap:8px;margin:14px;max-width:94vw;flex-wrap:wrap;justify-content:center}
.echo{width:64px;height:64px;border-radius:14px;background:#27272a;border:3px solid #3f3f46;display:flex;align-items:center;justify-content:center;font-size:2rem;cursor:pointer;transition:all .1s}
.echo.lit{background:#7c3aed;border-color:#a78bfa}
.echo .glyph{opacity:0}
.echo.reveal .glyph{opacity:1}
#hud{display:flex;gap:14px;font-size:.9rem;margin:4px}#hud b{color:#facc15}
#msg{min-height:1.4em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#7c3aed;color:#fff;font-weight:700;cursor:pointer;margin:8px}
</style></head><body>
<h1>👻 Haunted Echo</h1><div class="sub">The cave shows an echo — then it fades! Repeat before it vanishes from memory.</div>
<div id="hud"><span>Round <b id="r">1</b></span><span>Best <b id="b">0</b></span></div>
<div id="cave"></div>
<div id="msg"></div>
<button id="btn">🕯️ Enter Cave</button>
<audio id="au"></audio>
<script>
"use strict";
const AU=document.getElementById('au');
function beep(f,d=.1,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.13,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const N=5;let seq=[],idx=0,round=1,best=+localStorage.getItem('hec_best')||0,accepting=false;
document.getElementById('b').textContent=best;
const Glyphs=['🦇','🕷️','💀','🎃','👁️'];
function build(){const c=document.getElementById('cave');c.innerHTML='';
for(let i=0;i<N;i++){const d=document.createElement('div');d.className='echo';
d.innerHTML='<span class="glyph">'+Glyphs[i]+'</span>';
d.onclick=()=>pick(i);c.appendChild(d);}}
function revealAll(ms){document.querySelectorAll('.echo').forEach(e=>e.classList.add('reveal'));
setTimeout(()=>{if(!accepting)document.querySelectorAll('.echo').forEach(e=>e.classList.remove('reveal'));},ms);}
function flash(i){const el=document.querySelectorAll('.echo')[i];
el.classList.add('lit');beep(300+i*80,.12);
setTimeout(()=>el.classList.remove('lit'),350);}
async function show(){accepting=false;msg('👀 Watch the echo…');
revealAll(600+N*250);
for(const i of seq){await wait(450);flash(i);}
await wait(400);
document.querySelectorAll('.echo').forEach(e=>e.classList.remove('reveal'));
idx=0;accepting=true;msg('🫵 Repeat it from memory!');}
function wait(ms){return new Promise(r=>setTimeout(r,ms));}
function pick(i){if(!accepting)return;beep(300+i*80,.1);
if(i!==seq[idx]){accepting=false;beep(130,.3,'sawtooth');
msg('💥 The echo dies… Round '+round);
if(round>best){best=round;localStorage.setItem('hec_best',best);document.getElementById('b').textContent=best;}
return;}
idx++;
if(idx>=seq.length){accepting=false;msg('✅ Echo repeated! Round '+(round+1));round++;
document.getElementById('r').textContent=round;
seq.push((Math.random()*N)|0);
setTimeout(show,900);}}
function msg(t){document.getElementById('msg').textContent=t;}
document.getElementById('btn').onclick=()=>{seq=[(Math.random()*N)|0];idx=0;round=1;
document.getElementById('r').textContent=1;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();build();show();};
build();
</script></body></html>
