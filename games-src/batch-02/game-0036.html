<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Super Christmas Blast</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(#e0f2fe,#f0f9ff);font-family:'Segoe UI',Arial,sans-serif;color:#0c4a6e;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden}
h1{font-size:1.1rem;color:#dc2626;padding:6px}
#hud{display:flex;gap:14px;font-size:.9rem;margin-bottom:4px}
canvas{background:#f0f9ff;border-radius:10px;border:2px solid #bae6fd;touch-action:none}
#ov{position:fixed;inset:0;background:rgba(240,249,255,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#0c4a6e;padding:20px;z-index:5}
button{background:#dc2626;color:#fff;border:none;font-weight:800;padding:12px 32px;border-radius:24px;font-size:1rem;cursor:pointer;margin-top:14px}
#ctrl{position:fixed;bottom:8px;display:flex;justify-content:space-between;width:100%;padding:0 12px;z-index:4}
.cb{width:60px;height:60px;border-radius:50%;background:#bae6fddd;border:2px solid #7dd3fc;color:#075985;font-size:1.4rem;display:flex;align-items:center;justify-content:center;user-select:none;touch-action:none}
</style>
</head>
<body>
<h1>❄️ SUPER CHRISTMAS BLAST</h1>
<div id="hud"><span>🟥 <b id="h1">5</b></span><span>Round <b id="r">1</b></span><span>🟦 <b id="h2">5</b></span></div>
<canvas id="c"></canvas>
<div id="ctrl"><div style="display:flex;gap:8px"><div class="cb" id="l1">◀</div><div class="cb" id="r1">▶</div><div class="cb" id="s1">❄</div></div>
<div style="display:flex;gap:8px"><div class="cb" id="s2">❄</div><div class="cb" id="l2">◀</div><div class="cb" id="r2">▶</div></div></div>
<div id="ov"><h2 style="color:#dc2626">SNOWBALL SHOWDOWN</h2><p id="od">2 players! 🟥 moves with A/D, throws with W. 🟦 moves with ←/→, throws with ↑. On touch, use the corner buttons. First to win 3 rounds!</p><button id="btn">SNOWBALLS READY</button></div>
<script>
"use strict";
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');const W=520,H=280;cvs.width=W;cvs.height=H;const G=H-30;
let ps,balls,playing,round,wins,keys;let s6=+localStorage.getItem('cb_w1')||0,s62=+localStorage.getItem('cb_w2')||0;
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.07,t='square'){if(!playing)return;const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=.09;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
function resize(){const s=Math.min((window.innerWidth-12)/W,(window.innerHeight-200)/H);cvs.style.width=W*s+'px';cvs.style.height=H*s+'px';}
window.addEventListener('resize',resize);resize();
function mkP(x,c2,dir){return{x,y:G,hp:5,c:c2,dir,cd:0,w:22,h:30};}
function init(r){ps=[mkP(70,'#dc2626',1),mkP(W-70,'#2563eb',-1)];balls=[];keys={};playing=true;round=r;document.getElementById('r').textContent=r;}
window.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const touch={l1:0,r1:0,s1:0,l2:0,r2:0,s2:0};
[['l1'],['r1'],['s1'],['l2'],['r2'],['s2']].forEach(([id])=>{const el=document.getElementById(id);
el.addEventListener('pointerdown',e=>{e.preventDefault();audio.resume();touch[id]=1;});
['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,()=>touch[id]=0));});
function throwBall(p,i){if(p.cd>0)return;p.cd=26;balls.push({x:p.x+p.dir*16,y:p.y-14,vx:p.dir*5.5,vy:-2,own:i});beep(400,.06);}
function step(){ps.forEach((p,i)=>{p.cd--;
const ct=i===0?{l:keys['a']||touch.l1,r:keys['d']||touch.r1,s:keys['w']||touch.s1}:{l:keys['arrowleft']||touch.l2,r:keys['arrowright']||touch.r2,s:keys['arrowup']||touch.s2};
if(ct.l){p.x-=3;p.dir=-1;}else if(ct.r){p.x+=3;p.dir=1;}
p.x=Math.max(26,Math.min(W-26,p.x));
if(ct.s)throwBall(p,i);});
balls.forEach(b=>{b.vy+=0.18;b.x+=b.vx;b.y+=b.vy;
ps.forEach((p,i)=>{if(i!==b.own&&Math.abs(b.x-p.x)<18&&b.y>p.y-p.h&&b.y<p.y+4){
p.hp--;balls.splice(balls.indexOf(b),1);beep(150,.15,'sawtooth');upd();
if(p.hp<=0)roundEnd(1-i);}});});
balls=balls.filter(b=>b.x>-20&&b.x<W+20&&b.y<H+20);}
function upd(){document.getElementById('h1').textContent=ps[0].hp;document.getElementById('h2').textContent=ps[1].hp;}
function roundEnd(w){playing=false;wins[w]++;beep(w===0?660:440,.2,'triangle');
const names=['🟥 RED ELF','🟦 BLUE ELF'];
if(wins[w]>=3){if(w===0){s6++;localStorage.setItem('cb_w1',s6);}else{s62++;localStorage.setItem('cb_w2',s62);}
document.getElementById('od').innerHTML='🏆 <b>'+names[w]+' WINS THE BLAST '+wins[w]+'—'+wins[1-w]+'!</b><br><small>Series trophies — 🟥 '+s6+' : '+s62+' 🟦</small>';
document.getElementById('btn').textContent='SNOWBALL REMATCH';wins=[0,0];}
else{document.getElementById('od').innerHTML=names[w]+' takes round '+round+'!<br>Score: '+wins[0]+' — '+wins[1];
document.getElementById('btn').textContent='NEXT ROUND';}
document.getElementById('ov').style.display='flex';}
function draw(){ctx.fillStyle='#f0f9ff';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#fff';for(let i=0;i<30;i++)ctx.fillRect((i*97)%W,(i*61)%H,3,3);
ctx.fillStyle='#e2e8f0';ctx.fillRect(0,G+10,W,H-G-10);
// forts
ctx.fillStyle='#cbd5e1';ctx.fillRect(20,G-40,36,40);ctx.fillRect(W-56,G-40,36,40);
ps.forEach(p=>{ctx.fillStyle=p.c;ctx.fillRect(p.x-p.w/2,p.y-p.h,p.w,p.h);
ctx.fillStyle='#fcd34d';ctx.fillRect(p.x-7,p.y-p.h-6,14,6);
ctx.fillStyle='#111';const ex=p.dir>0?p.x+4:p.x-7;ctx.fillRect(ex,p.y-p.h+12,3,3);});
balls.forEach(b=>{ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,5,0,7);ctx.fill();ctx.strokeStyle='#bae6fd';ctx.stroke();});}
function loop(){if(playing){step();draw();}requestAnimationFrame(loop);}
document.getElementById('btn').onclick=()=>{audio.resume();if(!wins)wins=[0,0];init(round||1);upd();document.getElementById('ov').style.display='none';};
loop();
</script>
</body>
</html>
