<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Turbo Christmas Ball Bounce</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#14532d;font-family:'Segoe UI',Arial,sans-serif;color:#dcfce7;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden}
h1{font-size:1.1rem;color:#4ade80;padding:6px;letter-spacing:1px}
#hud{display:flex;gap:14px;font-size:.9rem;margin-bottom:4px}
canvas{background:#052e16;border-radius:10px;border:2px solid #166534;touch-action:none}
#ov{position:fixed;inset:0;background:rgba(5,46,22,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:5}
button{background:#fbbf24;border:none;color:#14532d;font-weight:800;padding:12px 32px;border-radius:24px;font-size:1rem;cursor:pointer;margin-top:14px}
</style>
</head>
<body>
<h1>🎄 TURBO CHRISTMAS BALL BOUNCE</h1>
<div id="hud"><span>Score <b id="s">0</b></span><span>Lives <b id="l">3</b></span><span>Turbo <b id="tb">1.0</b>x</span><span>Best <b id="b">0</b></span></div>
<canvas id="c"></canvas>
<div id="ov"><h2 style="color:#4ade80">TURBO CHRISTMAS</h2><p id="od">Keep the ornament bouncing! Move the candy paddle (← → / A D / drag or tilt-tap sides). Smash the gift blocks — the ball gets TURBO every level!</p><button id="btn">JINGLE BALLS</button></div>
<script>
"use strict";
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');const W=420,H=520;cvs.width=W;cvs.height=H;
let pad,balls,bricks,score,lives,turbo,playing,keys,best=+localStorage.getItem('tc_best')||0;
document.getElementById('b').textContent=best;
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.06,t='square'){if(!playing)return;const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=.08;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
function resize(){const s=Math.min((window.innerWidth-12)/W,(window.innerHeight-140)/H);cvs.style.width=W*s+'px';cvs.style.height=H*s+'px';}
window.addEventListener('resize',resize);resize();
const GIFT=['🎁','🔔','⭐','🧦','🎀'];
function build(lv){bricks=[];const rows=Math.min(3+lv,7);for(let r=0;r<rows;r++)for(let c=0;c<7;c++)if(Math.random()<0.85)bricks.push({x:12+c*57,y:40+r*26,w:52,h:20,g:GIFT[(Math.random()*GIFT.length)|0]});}
function init(lv){pad={x:W/2,w:76};balls=[{x:W/2,y:H-60,vx:3,vy:-5,stuck:true}];score=0;lives=3;turbo=1+lv*0.15;keys={};playing=true;build(lv);document.getElementById('s').textContent=0;document.getElementById('l').textContent=3;document.getElementById('tb').textContent=turbo.toFixed(1);}
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' ')e.preventDefault();});
let dragX=null;
cvs.addEventListener('pointerdown',e=>{audio.resume();balls.forEach(b=>b.stuck=false);const r=cvs.getBoundingClientRect();dragX=(e.clientX-r.left)/r.width*W;});
cvs.addEventListener('pointermove',e=>{if(dragX===null)return;const r=cvs.getBoundingClientRect();dragX=(e.clientX-r.left)/r.width*W;});
window.addEventListener('pointerup',()=>dragX=null);
function step(){if(keys['arrowleft']||keys['a'])pad.x-=6*turbo;if(keys['arrowright']||keys['d'])pad.x+=6*turbo;
if(dragX!==null)pad.x=dragX;pad.x=Math.max(pad.w/2,Math.min(W-pad.w/2,pad.x));
balls.forEach(b=>{if(b.stuck){b.x=pad.x;b.y=H-34;return;}
b.x+=b.vx*turbo;b.y+=b.vy*turbo;
if(b.x<6||b.x>W-6){b.vx*=-1;beep(220);}
if(b.y<26){b.vy*=-1;beep(220);}
if(b.vy>0&&b.y>H-38&&b.y<H-26&&Math.abs(b.x-pad.x)<pad.w/2+6){const a=(b.x-pad.x)/(pad.w/2);b.vx=a*5*turbo;b.vy=-Math.abs(b.vy)-0.1;beep(330);}
bricks.forEach(br=>{if(b.x>br.x&&b.x<br.x+br.w&&b.y>br.y&&b.y<br.y+br.h){bricks.splice(bricks.indexOf(br),1);b.vy*=-1;score+=15;document.getElementById('s').textContent=score;beep(520,.08,'triangle');}});});
balls=balls.filter(b=>b.y<H+16);
if(!balls.length){lives--;document.getElementById('l').textContent=lives;
if(lives<=0)over();else balls.push({x:pad.x,y:H-60,vx:3,vy:-5,stuck:true});}
if(!bricks.length){turbo+=0.2;document.getElementById('tb').textContent=turbo.toFixed(1);build(Math.round((turbo-1)/0.15));balls.push({x:pad.x,y:H-60,vx:3,vy:-5,stuck:true});}}
function draw(){ctx.fillStyle='#052e16';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#14532d';for(let i=0;i<W;i+=30)ctx.fillRect(i,0,2,H);
bricks.forEach(br=>{ctx.fillStyle='#166534';ctx.fillRect(br.x,br.y,br.w,br.h);ctx.font='15px serif';ctx.textAlign='center';ctx.fillText(br.g,br.x+br.w/2,br.y+15);});
ctx.fillStyle='#dc2626';ctx.fillRect(pad.x-pad.w/2,H-28,pad.w,12);ctx.fillStyle='#fff';ctx.fillRect(pad.x-pad.w/2,H-28,pad.w,3);
balls.forEach(b=>{ctx.fillStyle='#fde047';ctx.beginPath();ctx.arc(b.x,b.y,6,0,7);ctx.fill();ctx.fillStyle='#f59e0b';ctx.beginPath();ctx.arc(b.x-2,b.y-2,2,0,7);ctx.fill();});}
function over(){playing=false;if(score>best){best=score;localStorage.setItem('tc_best',best);document.getElementById('b').textContent=best;}
document.getElementById('od').innerHTML='The ornaments shattered…<br>Score: <b style="color:#fde047">'+score+'</b>';
document.getElementById('btn').textContent='BOUNCE AGAIN';document.getElementById('ov').style.display='flex';}
function loop(){if(playing){step();draw();}requestAnimationFrame(loop);}
document.getElementById('btn').onclick=()=>{audio.resume();init(1);document.getElementById('ov').style.display='none';};
loop();
</script>
</body>
</html>
