<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Samurai Zombie Survival Blast</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#111;font-family:Georgia,serif;color:#fecaca;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden}
h1{font-size:1.05rem;color:#f87171;padding:6px;letter-spacing:1px}
#hud{display:flex;gap:14px;font-size:.9rem;margin-bottom:4px}
canvas{background:#1c1917;border-radius:10px;border:1px solid #7f1d1d;touch-action:none}
#ov{position:fixed;inset:0;background:rgba(17,17,17,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:5}
button{background:#dc2626;border:none;color:#fff;font-weight:800;padding:12px 32px;border-radius:24px;font-size:1rem;cursor:pointer;margin-top:14px;font-family:inherit}
</style>
</head>
<body>
<h1>🗡️ SAMURAI ZOMBIE SURVIVAL BLAST</h1>
<div id="hud"><span>Kills <b id="k">0</b></span><span>HP <b id="h">100</b></span><span>Wave <b id="w">1</b></span><span>Best <b id="b">0</b></span></div>
<canvas id="c"></canvas>
<div id="ov"><h2 style="color:#f87171">BLAST OF THE BLADE</h2><p id="od">The dead walk the Edo roads. Move with WASD/arrows or drag. Your katana slashes automatically — get close, stay alive. Waves grow stronger. Grab ❤ to heal.</p><button id="btn">DRAW KATANA</button></div>
<script>
"use strict";
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');const W=480,H=440;cvs.width=W;cvs.height=H;
let me,zoms,hp,kills,wave,playing,keys,frame,best=+localStorage.getItem('sz_best')||0;
document.getElementById('b').textContent=best;
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.07,t='square'){if(!playing)return;const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=.09;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
function resize(){const s=Math.min((window.innerWidth-12)/W,(window.innerHeight-140)/H);cvs.style.width=W*s+'px';cvs.style.height=H*s+'px';}
window.addEventListener('resize',resize);resize();
function init(){me={x:W/2,y:H/2,r:12,cd:0};zoms=[];hp=100;kills=0;wave=1;keys={};frame=0;playing=true;document.getElementById('k').textContent=0;document.getElementById('h').textContent=100;document.getElementById('w').textContent=1;}
window.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let drag=null;
cvs.addEventListener('pointerdown',e=>{audio.resume();const r=cvs.getBoundingClientRect();drag={x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};});
cvs.addEventListener('pointermove',e=>{if(!drag)return;const r=cvs.getBoundingClientRect();drag={x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};});
window.addEventListener('pointerup',()=>drag=null);
function spawnWave(){const n=2+wave;for(let i=0;i<n;i++){const a=Math.random()*7;
zoms.push({x:W/2+Math.cos(a)*280,y:H/2+Math.sin(a)*280,hp:1+((wave/3)|0),sp:0.75+wave*0.09,hot:0});}}
function step(){frame++;const sp=3.2;
if(keys['w']||keys['arrowup'])me.y-=sp;if(keys['s']||keys['arrowdown'])me.y+=sp;
if(keys['a']||keys['arrowleft'])me.x-=sp;if(keys['d']||keys['arrowright'])me.x+=sp;
if(drag){const dx=drag.x-me.x,dy=drag.y-me.y,d=Math.hypot(dx,dy);if(d>5){me.x+=dx/d*sp;me.y+=dy/d*sp;}}
me.x=Math.max(14,Math.min(W-14,me.x));me.y=Math.max(14,Math.min(H-14,me.y));
me.cd--;
// slash nearest in range
if(me.cd<=0){let nz=null,nd=1e9;zoms.forEach(z=>{const d=Math.hypot(z.x-me.x,z.y-me.y);if(d<nd){nd=d;nz=z;}});
if(nz&&nd<52){me.cd=16;nz.hp--;nz.hot=6;beep(300+Math.random()*100,.07,'sawtooth');
if(nz.hp<=0){zoms.splice(zoms.indexOf(nz),1);kills++;document.getElementById('k').textContent=kills;
if(Math.random()<0.18)zoms.push({x:nz.x,y:nz.y,hp:0,sp:0,hot:0,heart:true});}}}
zoms.forEach(z=>{if(z.heart)return;
const a=Math.atan2(me.y-z.y,me.x-z.x);z.x+=Math.cos(a)*z.sp;z.y+=Math.sin(a)*z.sp;if(z.hot>0)z.hot--;
if(Math.hypot(z.x-me.x,z.y-me.y)<z.r+me.r-2){hp-=0.8;document.getElementById('h').textContent=Math.max(0,Math.round(hp));if(hp<=0)die();}});
// hearts heal
zoms.filter(z=>z.heart).forEach(z=>{if(Math.hypot(z.x-me.x,z.y-me.y)<20){hp=Math.min(100,hp+20);document.getElementById('h').textContent=Math.round(hp);zoms.splice(zoms.indexOf(z),1);beep(880,.07);}});
if(!zoms.filter(z=>!z.heart).length){wave++;document.getElementById('w').textContent=wave;hp=Math.min(100,hp+10);spawnWave();beep(440,.12,'triangle');}}
function die(){playing=false;if(kills>best){best=kills;localStorage.setItem('sz_best',best);document.getElementById('b').textContent=best;}
document.getElementById('od').innerHTML='Your blade falls on wave <b>'+wave+'</b>.<br>Kills: <b style="color:#fde047">'+kills+'</b>';
document.getElementById('btn').textContent='HONORABLE REMATCH';document.getElementById('ov').style.display='flex';beep(120,.5,'sawtooth');}
function draw(){ctx.fillStyle='#1c1917';ctx.fillRect(0,0,W,H);
ctx.strokeStyle='#292524';for(let x=0;x<W;x+=48)ctx.strokeRect(x,0,48,48);
ctx.strokeStyle='#7f1d1d33';ctx.beginPath();ctx.arc(W/2,H/2,120,0,7);ctx.stroke();
zoms.forEach(z=>{if(z.heart){ctx.font='16px serif';ctx.textAlign='center';ctx.fillText('❤',z.x,z.y+5);return;}
ctx.fillStyle=z.hot>0?'#fca5a5':'#65a30d';ctx.beginPath();ctx.arc(z.x,z.y,11,0,7);ctx.fill();
ctx.fillStyle='#111';ctx.fillRect(z.x-5,z.y-3,3,3);ctx.fillRect(z.x+2,z.y-3,3,3);});
// slash arc when cd high
if(me.cd>12){ctx.strokeStyle='#fecaca';ctx.lineWidth=2;ctx.beginPath();ctx.arc(me.x,me.y,52,frame/5,frame/5+2.2);ctx.stroke();}
ctx.fillStyle='#f87171';ctx.beginPath();ctx.arc(me.x,me.y,me.r,0,7);ctx.fill();
ctx.fillStyle='#111';ctx.fillRect(me.x-5,me.y-4,3,4);ctx.fillRect(me.x+2,me.y-4,3,4);
ctx.strokeStyle='#e5e7eb';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(me.x+8,me.y-8);ctx.lineTo(me.x+20,me.y-22);ctx.stroke();}
function loop(){if(playing){step();draw();}requestAnimationFrame(loop);}
document.getElementById('btn').onclick=()=>{audio.resume();init();spawnWave();document.getElementById('ov').style.display='none';};
loop();
</script>
</body>
</html>
