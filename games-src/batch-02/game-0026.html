<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Greek Myth Endless Runner Fury</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#1c1917;font-family:Georgia,serif;color:#fde68a;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden}
h1{font-size:1.1rem;color:#fbbf24;padding:6px;letter-spacing:1px}
#hud{display:flex;gap:14px;font-size:.9rem;margin-bottom:4px}
canvas{background:linear-gradient(#fef3c7,#fcd34d);border-radius:10px;touch-action:none}
#ov{position:fixed;inset:0;background:rgba(28,25,23,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;z-index:5}
button{background:#fbbf24;border:none;color:#1c1917;font-weight:800;padding:12px 32px;border-radius:24px;font-size:1rem;cursor:pointer;margin-top:14px;font-family:inherit}
</style>
</head>
<body>
<h1>🏛️ GREEK MYTH ENDLESS RUNNER FURY</h1>
<div id="hud"><span>Distance <b id="d">0</b>m</span><span>Coins <b id="c">0</b></span><span>Fury <b id="f">0</b></span><span>Best <b id="b">0</b>m</span></div>
<canvas id="cv"></canvas>
<div id="ov"><h2 style="color:#fbbf24">MYTHIC FURY</h2><p id="od">Outrun the wrath of the gods! Jump columns with Space/↑/tap, slide under arrows with ↓. Collect 🪙 drachmas — 10 drachmas = +1 Fury (extra speed & score).</p><button id="btn">BEGIN THE RUN</button></div>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d');const W=560,H=240;cvs.width=W;cvs.height=H;const GY=H-40;
let hero,obs,coinsArr,playing,speed,dist,score,fury,frame,touchY,best=+localStorage.getItem('gr_best')||0;
document.getElementById('b').textContent=best;
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.07,t='square'){if(!playing)return;const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=.09;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
function resize(){const s=Math.min((window.innerWidth-12)/W,(window.innerHeight-140)/H);cvs.style.width=W*s+'px';cvs.style.height=H*s+'px';}
window.addEventListener('resize',resize);resize();
function init(){hero={x:70,y:GY,vy:0,w:24,h:36,onG:true,slide:0};obs=[];coinsArr=[];dist=0;score=0;fury=0;speed=5;frame=0;playing=true;document.getElementById('d').textContent=0;document.getElementById('c').textContent=0;document.getElementById('f').textContent=0;}
function jump(){if(hero.onG){hero.vy=-12;hero.onG=false;beep(540,.06);}}
function slide(){hero.slide=24;beep(260,.05);}
window.addEventListener('keydown',e=>{const k=e.key;if(k===' '||k==='ArrowUp'){e.preventDefault();jump();}if(k==='ArrowDown')slide();});
cvs.addEventListener('pointerdown',e=>{audio.resume();touchY=e.clientY;jump();});
cvs.addEventListener('pointerup',e=>{if(touchY!==null&&e.clientY-touchY>40)slide();touchY=null;});
function step(){frame++;dist+=speed/20;speed=5+dist/300+fury*0.3;score=Math.floor(dist)+fury*50;
document.getElementById('d').textContent=Math.floor(dist);document.getElementById('c').textContent=Math.floor(dist);document.getElementById('f').textContent=fury;
hero.vy+=0.62;hero.y+=hero.vy;if(hero.y>=GY){hero.y=GY;hero.vy=0;hero.onG=true;}if(hero.slide>0)hero.slide--;
if(frame%Math.max(30,60-dist/40|0)===0){const r=Math.random();
if(r<0.45)obs.push({x:W+20,y:GY-30,w:20,h:30,t:'col'});
else if(r<0.7)obs.push({x:W+20,y:GY-58,w:34,h:12,t:'arrow'});
else if(r<0.85)coinsArr.push({x:W+20,y:GY-70});
else obs.push({x:W+20,y:GY-16,w:30,h:16,t:'rock'});}
obs.forEach(o=>o.x-=speed);coinsArr.forEach(c=>c.x-=speed);
obs=obs.filter(o=>o.x>-60);coinsArr=coinsArr.filter(c=>c.x>-30);
const hh=hero.slide>0?20:hero.h,hy=hero.y-hh;
coinsArr.forEach(c=>{if(Math.abs(c.x-hero.x)<22&&Math.abs((c.y)-(hy+hh/2))<30){coinsArr.splice(coinsArr.indexOf(c),1);score+=5;beep(900,.05);
if(Math.floor(score/50)>fury){fury=Math.floor(score/50);beep(660,.12,'triangle');}}});
obs.forEach(o=>{if(hero.x+hero.w/2>o.x&&hero.x-hero.w/2<o.x+o.w&&hy<o.y+o.h&&hy+hh>o.y)die();});}
function die(){playing=false;const sc=Math.floor(dist);if(sc>best){best=sc;localStorage.setItem('gr_best',best);document.getElementById('b').textContent=best;}
document.getElementById('od').innerHTML='The gods claim you at <b style="color:#fde047">'+Math.floor(dist)+'m</b>! Fury: '+fury;
document.getElementById('btn').textContent='DEFY THEM AGAIN';document.getElementById('ov').style.display='flex';beep(140,.4,'sawtooth');}
function draw(){ctx.clearRect(0,0,W,H);
ctx.fillStyle='#d6b25e';ctx.fillRect(0,GY,W,H-GY);
ctx.fillStyle='#b45309';for(let i=0;i<W;i+=46)ctx.fillRect((i-frame*2)%(W+46)-23,GY,4,H-GY);
// columns background
ctx.fillStyle='#f3e3b3';ctx.fillRect(0,0,W,GY);
obs.forEach(o=>{if(o.t==='col'){ctx.fillStyle='#d4a373';ctx.fillRect(o.x,o.y,o.w,o.h);ctx.fillStyle='#b08968';ctx.fillRect(o.x-3,o.y,o.w+6,5);}
else if(o.t==='arrow'){ctx.fillStyle='#9a3412';ctx.beginPath();ctx.moveTo(o.x,o.y+12);ctx.lineTo(o.x+o.w/2,o.y);ctx.lineTo(o.x+o.w,o.y+12);ctx.fill();}
else{ctx.fillStyle='#78716c';ctx.beginPath();ctx.arc(o.x+o.w/2,o.y+o.h/2,o.h/2,0,7);ctx.fill();}});
coinsArr.forEach(c=>{ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(c.x,c.y,7,0,7);ctx.fill();ctx.fillStyle='#92400e';ctx.font='bold 8px Georgia';ctx.textAlign='center';ctx.fillText('Δ',c.x,c.y+3);});
// hero: hoplite
ctx.fillStyle=hero.slide>0?'#b45309':'#9a3412';ctx.fillRect(hero.x-hero.w/2,hero.y-(hero.slide>0?20:hero.h),hero.w,hero.slide>0?20:hero.h);
ctx.fillStyle='#fcd34d';ctx.fillRect(hero.x-hero.w/2,hero.y-(hero.slide>0?20:hero.h),hero.w,7);
ctx.fillStyle='#111';ctx.fillRect(hero.x+5,hero.y-(hero.slide>0?20:hero.h)+10,4,4);}
function loop(){if(playing){step();draw();}requestAnimationFrame(loop);}
document.getElementById('btn').onclick=()=>{audio.resume();init();document.getElementById('ov').style.display='none';};
loop();
</script>
</body>
</html>
