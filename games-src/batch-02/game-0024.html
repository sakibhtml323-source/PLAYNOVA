<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lightning Ladder: Storm Reflexes #24</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{background:linear-gradient(#0c4a6e,#e0f2fe);font-family:'Segoe UI',Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;overflow:hidden}
#top{text-align:center;padding:8px;color:#0c4a6e;font-size:.95rem}
#top b{color:#0369a1}
#arena{flex:1;display:flex;position:relative}
.half{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
#h1{background:rgba(14,165,233,.25)}
#h2{background:rgba(255,255,255,.45)}
.p{font-size:3rem;font-weight:800;color:#075985}
.l{font-size:.8rem;color:#0c4a6e;margin-top:4px}
#center{position:fixed;top:42%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;z-index:4}
#cmd{font-size:1.7rem;font-weight:800;color:#075985;text-shadow:0 2px 8px #fff;min-height:2.4rem}
#sub{color:#075985;font-size:.85rem}
#ov{position:fixed;inset:0;background:rgba(224,242,254,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#075985;padding:20px;z-index:9}
button{background:#0284c7;color:#fff;border:none;font-weight:800;padding:13px 36px;border-radius:26px;font-size:1rem;cursor:pointer;margin-top:14px}
#score{color:#075985;font-size:.8rem;margin-top:8px}
@media(max-width:480px){#cmd{font-size:1.15rem}.p{font-size:2.1rem}}
</style>
</head>
<body>
<div id="top">🌨️ STORM ARCTIC PARTY — <span id="st">Wait for the storm signal…</span> | P1 <b id="s1">0</b> — <b id="s2">0</b> P2 | Round <b id="r">1</b>/7</div>
<div id="arena">
<div class="half" id="h1"><div class="p">🐧</div><div class="l">P1 — tap left / press Z</div></div>
<div class="half" id="h2"><div class="p">🦭</div><div class="l">P2 — tap right / press M</div></div>
</div>
<div id="center"><div id="cmd"></div><div id="sub"></div></div>
<div id="ov"><h2>🌨️ STORM ARCTIC PARTY</h2><p id="od">2 players. When <b>❄️ STORM!</b> appears, tap first to score. Beware <b>🌞 CALM</b> — tapping in calm loses a point! Best after 7 rounds.</p><button id="btn">ENTER THE STORM</button><div id="score"></div></div>
<script>

"use strict";
let s1,s2,round,phase,phaseTO,playing;let sb=+localStorage.getItem('sa_best')||0;
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.08,t='square'){if(!playing)return;const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=.1;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
const cmd=document.getElementById('cmd');
function next(){if(round>7)return finish();
document.getElementById('r').textContent=round;document.getElementById('st').textContent='Wait for the lightning…';cmd.textContent='☁️';
const win=Math.max(550,1450-round*115);
const realStorm=()=>{phase='storm';cmd.textContent='⚡ LIGHTNING!';
document.getElementById('st').textContent='⚡ TAP — window '+Math.round(win)+'ms!';
phaseTO=setTimeout(()=>{phase=null;cmd.textContent='Too slow! Window shrinks each round…';round++;setTimeout(next,650);},win);};
phaseTO=setTimeout(()=>{
if(Math.random()<0.38){phase='fake';cmd.textContent='⚡ LIGHTNING!';document.getElementById('st').textContent='⚡ TAP!';beep(400,.08,'sawtooth');phaseTO=setTimeout(()=>{if(phase!=='fake')return;realStorm();},330);}
else realStorm();},900+Math.random()*1600);}
function tap(p){if(!playing)return;
if(phase==='storm'){if(p===1)s1++;else s2++;beep(p===1?620:780,.1,'triangle');cmd.textContent='🐧 P'+p+' strikes first!';upd();}
else if(phase==='calm'){if(p===1)s1=Math.max(0,s1-1);else s2=Math.max(0,s2-1);beep(130,.2,'sawtooth');cmd.textContent='💥 P'+p+' slipped on calm ice! -1';upd();}
else if(phase==='fake'){if(p===1)s1=Math.max(0,s1-1);else s2=Math.max(0,s2-1);beep(130,.25,'sawtooth');cmd.textContent='💀 FAKE FLASH! P'+p+' −1';upd();phase=null;clearTimeout(phaseTO);round++;setTimeout(next,650);upd();return;}
else{cmd.textContent='Antsy! No signal yet.';beep(200,.08,'sawtooth');}
phase=null;clearTimeout(phaseTO);round++;setTimeout(next,700);}
function upd(){document.getElementById('s1').textContent=s1;document.getElementById('s2').textContent=s2;}
function finish(){playing=false;const m=Math.max(s1,s2);if(m>sb){sb=m;localStorage.setItem('sa_best',sb);}
const w=s1===s2?'🤝 A FROZEN TIE!':'🏆 PLAYER '+(s1>s2?1:2)+' WINS '+Math.max(s1,s2)+'—'+Math.min(s1,s2)+'!';
document.getElementById('od').innerHTML='<b style="font-size:1.25rem">'+w+'</b>';document.getElementById('btn').textContent='REMATCH';document.getElementById('ov').style.display='flex';beep(880,.3,'triangle');}
document.getElementById('h1').addEventListener('pointerdown',()=>{audio.resume();tap(1);});
document.getElementById('h2').addEventListener('pointerdown',()=>{audio.resume();tap(2);});
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='z')tap(1);if(k==='m')tap(2);});
document.getElementById('btn').onclick=()=>{audio.resume();s1=0;s2=0;round=1;playing=true;upd();document.getElementById('ov').style.display='none';next();};

</script>
</body>
</html>
