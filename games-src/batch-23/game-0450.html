<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Echo Shout #450</title><style>
body{margin:0;font-family:system-ui;background:#451a03;color:#fef3c7;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#fde68a;font-size:.78rem}
canvas{background:#78350f;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#451a03;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>📣 Desert Echo Shout</h1><div class="sub">Hold to shout — the echo reveals the canyon walls. Find the exit before echoes run out!</div>
<div id="hud"><span>Echoes <b id="e">8</b></span><span>Time <b id="t">0</b>s</span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="440" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">🏜️</div><p>Hold to shout — walls flash where the echo returns.<br>8 echoes to find the 🚪 exit!</p><button id="btn">Shout</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=400;let me={x:60,y:200},exit={x:W-50,y:60},walls=[],echoes=8,playing=false,flash=[],holding=false,startT=0,best=0;
document.getElementById('b').textContent=best;
function gen(){me={x:60,y:200};exit={x:W-50,y:60};echoes=8;playing=true;flash=[];holding=false;startT=Date.now();
walls=[];for(let i=0;i<6;i++){const horiz=Math.random()<0.5;
walls.push(horiz?{x:80+Math.random()*280,y:60+Math.random()*280,w:90+Math.random()*60,h:14}
:{x:80+Math.random()*280,y:60+Math.random()*280,w:14,h:90+Math.random()*60});}
document.getElementById('e').textContent=8;draw();}
cvs.addEventListener('pointerdown',e=>{if(!playing||echoes<=0)return;holding=true;
const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
// reveal walls near the tap
walls.forEach(w=>{if(x>w.x-30&&x<w.x+w.w+30&&y>w.y-30&&y<w.y+w.h+30){
flash.push({x:w.x,y:w.y,w:w.w,h:w.h,a:1});}});
flash.push({x:x-20,y:y-20,w:40,h:40,a:1});
echoes--;document.getElementById('e').textContent=echoes;
beep(300,.15,'triangle');
if(echoes<=0)setTimeout(()=>{if(playing)end(false);},2500);});
cvs.addEventListener('pointerup',()=>{holding=false;});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&playing&&echoes>0){holding=true;
walls.forEach(w=>flash.push({x:w.x,y:w.y,w:w.w,h:w.h,a:1}));
echoes--;document.getElementById('e').textContent=echoes;beep(300,.15);}});
document.addEventListener('keyup',e=>{if(e.code==='Space')holding=false;});
function end(won){playing=false;
if(won){const t=((Date.now()-startT)/1000).toFixed(1);
if(!best||+t<+best){best=t;document.getElementById('b').textContent=best;}
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🚪 Escaped the canyon!<br>'+t+'s · Echoes left: '+echoes;}
else{document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🔇 Out of echoes!<br>Lost in the canyon…';}}
function step(){document.getElementById('t').textContent=((Date.now()-startT)/1000).toFixed(1);
flash.forEach(f=>f.a-=0.02);
flash=flash.filter(f=>f.a>0);}
function draw(){ctx.fillStyle='#78350f';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#92400e';
for(let i=0;i<15;i++)ctx.fillRect((i*97)%W,(i*53)%H,4,3);
// wall flashes
flash.forEach(f=>{ctx.globalAlpha=f.a*0.6;
ctx.fillStyle='#fde68a';ctx.fillRect(f.x,f.y,f.w,f.h);ctx.globalAlpha=1;});
// exit shimmer (very faint)
ctx.globalAlpha=0.15+0.1*Math.sin(Date.now()/300);
ctx.font='26px serif';ctx.textAlign='center';ctx.fillText('🚪',exit.x,exit.y+8);ctx.globalAlpha=1;
// player
ctx.fillText('🚶',me.x,me.y+8);
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{gen();
document.getElementById('ov').style.display='none';
AU.__c=new (window.AudioContext||window.webkitAudioContext)();};
</script></body></html>
