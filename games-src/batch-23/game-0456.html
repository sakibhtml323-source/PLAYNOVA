<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ninja Star Pin #456</title><style>
body{margin:0;font-family:system-ui;background:#111827;color:#f9fafb;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#9ca3af;font-size:.78rem}
canvas{background:#1f2937;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#facc15}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#facc15;color:#111827;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🌟 Ninja Star Pin</h1><div class="sub">Flick throwing stars to topple every target — mind the wind!</div>
<div id="hud"><span>Stars <b id="s">5</b></span><span>Down <b id="d">0</b>/<b id="dt">0</b></span><span>Level <b id="l">1</b></span></div>
<canvas id="cv" width="440" height="360"></canvas>
<div id="ov"><div style="font-size:3rem">🎯</div><p>Flick toward the targets.<br>Topple them all with limited stars!</p><button id="btn">Throw</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=360;let targets=[],stars=[],down=0,starsLeft=5,level=1,wind=0,playing=true;
function gen(){targets=[];stars=[];down=0;playing=true;
const n=Math.min(3+level,6);starsLeft=n+2;
document.getElementById('s').textContent=starsLeft;
document.getElementById('d').textContent=0;document.getElementById('dt').textContent=n;
document.getElementById('l').textContent=level;
for(let i=0;i<n;i++){targets.push({x:280+Math.random()*140,y:H-30-Math.random()*40,vx:0,vy:0,rot:0,down:false});}
wind=(Math.random()*2-1)*0.08;
draw();msg('Flick to throw!');}
let flick=null;
cvs.addEventListener('pointerdown',e=>{if(!playing||starsLeft<=0)return;const r=cvs.getBoundingClientRect();
flick={x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};});
cvs.addEventListener('pointerup',e=>{if(!flick)return;const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
stars.push({x:flick.x,y:flick.y,vx:(flick.x-x)*0.12,vy:(flick.y-y)*0.12,rot:0});
starsLeft--;document.getElementById('s').textContent=starsLeft;
beep(500,.07);flick=null;
if(starsLeft<=0)setTimeout(()=>{if(down<targets.length)end(false);},3000);});
function step(){stars.forEach(s=>{s.vy+=0.1;s.vx+=wind;s.x+=s.vx;s.y+=s.vy;s.rot+=0.3;});
targets.forEach(t=>{if(t.down){t.vy+=0.2;t.x+=t.vx;t.y+=t.vy;t.rot+=0.1;}});
stars=stars.filter(s=>s.y<H+20);
// hit detection
stars.forEach(s=>{targets.forEach(t=>{if(!t.down&&Math.hypot(s.x-t.x,s.y-t.y)<20){
t.down=true;down++;document.getElementById('d').textContent=down;
t.vx=s.vx*0.6;t.vy=s.vy*0.6-1;
beep(600+down*40,.1);
if(down>=targets.length){end(true);}}});});}
function end(won){playing=false;
beep(won?880:130,.3,won?'triangle':'sawtooth');
document.getElementById('msg').textContent=won?'🎉 All targets down! Level '+(level+1):'💨 Out of stars!';
if(won){level++;setTimeout(gen,1000);}}
function draw(){ctx.fillStyle='#1f2937';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#374151';ctx.fillRect(0,H-16,W,16);
// wind
ctx.fillStyle='#93c5fd44';
for(let i=0;i<5;i++)ctx.fillRect((Date.now()/8+i*80)%W,40+i*50,wind*160,2);
targets.forEach(t=>{ctx.save();ctx.translate(t.x,t.y);ctx.rotate(t.rot);
ctx.font='26px serif';ctx.textAlign='center';ctx.fillText('🎯',0,0);ctx.restore();});
stars.forEach(s=>{ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.rot);
ctx.font='18px serif';ctx.fillText('🌟',0,0);ctx.restore();});
if(flick){ctx.strokeStyle='#facc1555';ctx.setLineDash([4,4]);
ctx.beginPath();ctx.moveTo(flick.x,flick.y);ctx.lineTo(flick.x+(flick.x-(flick.lx||flick.x)),flick.y);ctx.stroke();ctx.setLineDash([]);}
if(playing){step();requestAnimationFrame(draw);}}
function msg(t){const el=document.createElement('div');
el.style.cssText='position:fixed;bottom:60px;left:50%;transform:translateX(-50%);color:#facc15;font-weight:700';
el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),1500);}
document.getElementById('btn').onclick=()=>{level=1;gen();
document.getElementById('ov').style.display='none';
AU.__c=new (window.AudioContext||window.webkitAudioContext)();};
</script><div id="msg"></div>
</body></html>
