<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haunted Organ #444</title><style>
body{margin:0;font-family:system-ui;background:#18181b;color:#fafafa;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a1a1aa;font-size:.78rem}
#keys{display:flex;gap:5px;margin:14px;max-width:94vw}
.key{width:44px;height:96px;background:#f8fafc;border:2px solid #3f3f46;border-radius:0 0 8px 8px;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-weight:800;font-size:.8rem;color:#111}
.key:active,.key.lit{background:#7c3aed;color:#fff}
#hud{display:flex;gap:14px;font-size:.9rem;margin:4px}#hud b{color:#facc15}
#msg{min-height:1.4em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#7c3aed;color:#fff;font-weight:700;cursor:pointer;margin:8px}
</style></head><body>
<h1>🎹 Haunted Organ</h1><div class="sub">The ghost plays a melody on the organ — repeat it note for note!</div>
<div id="hud"><span>Round <b id="r">1</b></span><span>Best <b id="b">0</b></span></div>
<div id="keys"></div>
<div id="msg"></div>
<button id="btn">🎼 Play</button>
<audio id="au"></audio>
<script>
"use strict";
const AU=document.getElementById('au');
function tone(i){const F=[262,294,330,349,392,440,494,523];
try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());
const os=o.createOscillator(),g=o.createGain();
os.type='triangle';os.frequency.value=F[i];
g.gain.setValueAtTime(.16,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+.5);
os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+.5);}catch(e){}}
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const NAMES=['C','D','E','F','G','A','B','C5'];
let seq=[],idx=0,round=1,best=+localStorage.getItem('hor_best')||0,accepting=false;
document.getElementById('b').textContent=best;
function build(){const k=document.getElementById('keys');k.innerHTML='';
NAMES.forEach((n,i)=>{const d=document.createElement('div');d.className='key';
d.textContent=n;d.onclick=()=>playKey(i);k.appendChild(d);});}
function flash(i){const el=document.querySelectorAll('.key')[i];
el.classList.add('lit');tone(i);
setTimeout(()=>el.classList.remove('lit'),320);}
async function show(){accepting=false;msg('👻 The ghost plays…');
for(const i of seq){await wait(430);flash(i);}
idx=0;accepting=true;msg('🫵 Your turn!');}
function wait(ms){return new Promise(r=>setTimeout(r,ms));}
function playKey(i){if(!accepting)return;tone(i);
if(i!==seq[idx]){accepting=false;beep(130,.3,'sawtooth');
msg('💥 Dissonance! Round '+round);
if(round>best){best=round;localStorage.setItem('hor_best',best);document.getElementById('b').textContent=best;}
return;}
idx++;
if(idx>=seq.length){accepting=false;msg('🎼 Beautiful! Round '+(round+1));round++;
document.getElementById('r').textContent=round;
seq.push((Math.random()*8)|0);
setTimeout(show,900);}}
function msg(t){document.getElementById('msg').textContent=t;}
document.getElementById('btn').onclick=()=>{seq=[(Math.random()*8)|0];idx=0;round=1;
document.getElementById('r').textContent=1;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();build();show();};
build();
</script></body></html>
