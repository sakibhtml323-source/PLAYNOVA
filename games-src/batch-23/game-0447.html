<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Wind Ladder #447</title><style>
body{margin:0;font-family:system-ui;background:#451a03;color:#fef3c7;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#fde68a;font-size:.78rem}
canvas{background:#78350f;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#451a03;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🪜 Desert Wind Ladder</h1><div class="sub">Climb the rope ladder — but HOLD ON when the wind gusts!</div>
<div id="hud"><span>Height <b id="h">0</b>m</span><span>Grips <b id="g">3</b></span><span>⏱️ <b id="t">0</b>s</span></div>
<canvas id="cv" width="360" height="440"></canvas>
<div id="ov"><div style="font-size:3rem">🌪️</div><p>Tap to climb.<br>When ⚠️ GUST warning shows, HOLD (press & hold) or you'll be blown off!</p><button id="btn">Climb</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=360,H=440;let climber={y:H-40},height=0,grips=3,phase='calm',gustT=0,holding=false,playing=false,startT=0,wind=0;
function gen(){climber={y:H-40};height=0;grips=3;phase='calm';gustT=0;holding=false;playing=true;startT=Date.now();
document.getElementById('h').textContent=0;document.getElementById('g').textContent=3;draw();}
cvs.addEventListener('pointerdown',()=>{holding=true;
if(phase==='calm'&&playing){climber.y-=26;height=Math.min(100,Math.round((H-40-climber.y)/(H-80)*100));
document.getElementById('h').textContent=height;
beep(400+height*3,.06);
if(height>=100){win();return;}
if(Math.random()<0.22+height*0.002){phase='warn';gustT=26;beep(300,.12,'sawtooth');}}});
cvs.addEventListener('pointerup',()=>{holding=false;});
function step(){document.getElementById('t').textContent=((Date.now()-startT)/1000).toFixed(1);
if(phase==='warn'){gustT--;
if(gustT<=0){phase='gust';gustT=40;beep(200,.2,'sawtooth');}}
else if(phase==='gust'){gustT--;wind=Math.sin(Date.now()/40)*4;
if(!holding){blown();return;}
if(gustT<=0){phase='calm';wind=0;}}
if(phase==='calm'&&Math.random()<0.004){phase='warn';gustT=26;beep(300,.12,'sawtooth');}}
function blown(){playing=false;grips--;document.getElementById('g').textContent=grips;
beep(130,.35,'sawtooth');
if(grips<=0){document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🌪️ Blown away!<br>Height reached: '+height+'m';}
else{climber={y:H-40};height=0;document.getElementById('h').textContent=0;
phase='calm';msg('😵 Grabbed a ledge! Grips left: '+grips);}}
function win(){playing=false;beep(880,.3,'triangle');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🏁 Summit! '+((Date.now()-startT)/1000).toFixed(1)+'s';}
function msg(t){const el=document.createElement('div');
el.style.cssText='position:fixed;bottom:60px;left:50%;transform:translateX(-50%);color:#fbbf24;font-weight:700';
el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),1600);}
function draw(){ctx.fillStyle='#78350f';ctx.fillRect(0,0,W,H);
// ladder
ctx.strokeStyle='#d6b98a';ctx.lineWidth=4;
for(let y=30;y<H-20;y+=28){ctx.beginPath();ctx.moveTo(W/2-30,y);ctx.lineTo(W/2+30,y);ctx.stroke();}
ctx.lineWidth=1;
// climber
ctx.font='28px serif';ctx.textAlign='center';
ctx.fillText('🧗',W/2+wind,climber.y);
// gust indicator
if(phase==='warn'){ctx.fillStyle='#eab308';ctx.font='bold 20px system-ui';
ctx.fillText('⚠️ GUST INCOMING — HOLD!',W/2,40);}
if(phase==='gust'){ctx.fillStyle='#ef4444';ctx.font='bold 20px system-ui';
ctx.fillText('🌪️ HOLDING...',W/2,40);}
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{gen();
document.getElementById('ov').style.display='none';
AU.__c=new (window.AudioContext||window.webkitAudioContext)();};
</script></body></html>
