<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Scarab Push #445</title><style>
body{margin:0;font-family:system-ui;background:#451a03;color:#fef3c7;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#fde68a;font-size:.78rem}
canvas{background:#78350f;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#451a03;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🪲 Desert Scarab Push</h1><div class="sub">Tap behind the ball to push it — momentum carries it! Get it into the burrow.</div>
<div id="hud"><span>Pushes <b id="p">10</b></span><span>Level <b id="l">1</b></span></div>
<canvas id="cv" width="440" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">⚽</div><p>Tap on the side opposite to where you want the ball to go.<br>Each push adds momentum — 10 pushes only!</p><button id="btn">Push</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=400;let ball={x:W/2,y:H/2,vx:0,vy:0},burrow={},pushes=10,level=1,playing=true,rocks=[];
function gen(){ball={x:W/2,y:H/2,vx:0,vy:0};playing=true;
burrow={x:60+Math.random()*(W-120),y:60+Math.random()*(H-120),r:22};
// not too close to ball
if(Math.hypot(burrow.x-ball.x,burrow.y-ball.y)<140)burrow={x:W/2,y:80,r:22};
rocks=[];const nr=2+level;
for(let i=0;i<nr;i++){const r={x:60+Math.random()*(W-120),y:60+Math.random()*(H-120),r:16};
if(Math.hypot(r.x-ball.x,r.y-ball.y)>60)rocks.push(r);}
pushes=10+level;document.getElementById('p').textContent=pushes;
document.getElementById('l').textContent=level;
draw();msg('Push the ball into the burrow!');}
cvs.addEventListener('pointerdown',e=>{if(!playing||pushes<=0)return;const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
// push direction: away from tap point
const dx=ball.x-x,dy=ball.y-y,d=Math.hypot(dx,dy)||1;
ball.vx+=dx/d*2.4;ball.vy+=dy/d*2.4;
pushes--;document.getElementById('p').textContent=pushes;
beep(400,.08);
if(pushes<=0)setTimeout(()=>{if(playing)end(false);},3500);});
function step(){ball.x+=ball.vx;ball.y+=ball.vy;
ball.vx*=0.985;ball.vy*=0.985;
// walls
if(ball.x<20){ball.x=20;ball.vx*=-0.7;}
if(ball.x>W-20){ball.x=W-20;ball.vx*=-0.7;}
if(ball.y<20){ball.y=20;ball.vy*=-0.7;}
if(ball.y>H-20){ball.y=H-20;ball.vy*=-0.7;}
// rocks
rocks.forEach(r=>{const d=Math.hypot(ball.x-r.x,ball.y-r.y);
if(d<r.r+14){const a=Math.atan2(ball.y-r.y,ball.x-r.x);
ball.x=r.x+Math.cos(a)*(r.r+14);ball.y=r.y+Math.sin(a)*(r.r+14);
const dot=ball.vx*Math.cos(a)+ball.vy*Math.sin(a);
ball.vx-=2*dot*Math.cos(a);ball.vy-=2*dot*Math.sin(a);
beep(300,.05);}});
// burrow
if(Math.hypot(ball.x-burrow.x,ball.y-burrow.y)<burrow.r){end(true);}}
function end(won){playing=false;
beep(won?880:130,.3,won?'triangle':'sawtooth');
document.getElementById('msg')?0:0;
if(won){msg('🪺 Home! Level '+(level+1));level++;
setTimeout(gen,1000);}
else{msg('😩 Out of pushes!');level=Math.max(1,level-1);
setTimeout(gen,1200);}}
function draw(){ctx.fillStyle='#78350f';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#92400e';
for(let i=0;i<20;i++)ctx.fillRect((i*97)%W,(i*53)%H,4,3);
// burrow
ctx.font='26px serif';ctx.textAlign='center';ctx.fillText('🕳️',burrow.x,burrow.y+8);
// rocks
rocks.forEach(r=>{ctx.fillText('🌵',r.x,r.y+8);});
// ball
ctx.beginPath();ctx.arc(ball.x,ball.y,14,0,7);ctx.fillStyle='#d6b98a';ctx.fill();
ctx.strokeStyle='#92400e';ctx.stroke();
ctx.fillStyle='#78350f';ctx.font='10px serif';ctx.fillText('★',ball.x,ball.y+3);
if(playing){step();requestAnimationFrame(draw);}}
function msg(t){const el=document.createElement('div');
el.style.cssText='position:fixed;bottom:60px;left:50%;transform:translateX(-50%);color:#fbbf24;font-weight:700';
el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),1600);}
document.getElementById('btn').onclick=()=>{level=1;gen();
document.getElementById('ov').style.display='none';
AU.__c=new (window.AudioContext||window.webkitAudioContext)();};
</script><div id="msg"></div>
</body></html>
