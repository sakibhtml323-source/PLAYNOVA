<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Snake Charmer #454</title><style>
body{margin:0;font-family:system-ui;background:#451a03;color:#fef3c7;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#fde68a;font-size:.78rem}
#pit{display:flex;gap:8px;margin:14px;align-items:flex-end;min-height:200px}
.col{width:52px;background:#92400e;border-radius:8px 8px 0 0;position:relative;transition:height .25s}
.col .s{position:absolute;top:-26px;left:50%;transform:translateX(-50%);font-size:22px}
#flute{display:flex;gap:8px;margin:10px}
.note{width:52px;height:52px;background:#b45309;border:2px solid #d97706;border-radius:10px;cursor:pointer;font-size:22px}
.note:hover{border-color:#fbbf24}
#hud{display:flex;gap:14px;font-size:.9rem;margin:4px}#hud b{color:#fbbf24}
#msg{min-height:1.3em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#fbbf24;color:#451a03;font-weight:800;cursor:pointer;margin:8px}
</style></head><body>
<h1>🐍 Desert Snake Charmer</h1><div class="sub">Watch the snake rise — then play notes from TALLEST rise to shortest!</div>
<div id="hud"><span>Round <b id="r">1</b></span><span>Best <b id="b">0</b></span></div>
<div id="pit"></div>
<div id="flute"></div>
<div id="msg"></div>
<button id="btn">🎵 New Song</button>
<audio id="au"></audio>
<script>
"use strict";
const AU=document.getElementById('au');
function note(i){const F=[330,392,494,587,659];
try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());
const os=o.createOscillator(),g=o.createGain();
os.type='sine';os.frequency.value=F[i];
g.gain.setValueAtTime(.14,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+.4);
os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+.4);}catch(e){}}
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const N=5;let snake=[],seq=[],idx=0,round=1,best=+localStorage.getItem('dsc2_best')||0;
document.getElementById('b').textContent=best;
const EMO=['🐍','🎵','⭐','🔥','💫'];
function build(){const pit=document.getElementById('pit');pit.innerHTML='';
for(let i=0;i<N;i++){const d=document.createElement('div');d.className='col';
d.style.height='30px';d.innerHTML='<span class="s">'+EMO[i]+'</span>';pit.appendChild(d);}
const fl=document.getElementById('flute');fl.innerHTML='';
for(let i=0;i<N;i++){const d=document.createElement('div');d.className='note';
d.textContent=['🫳','🫲','🫱','👆','✋'][i];
d.onclick=()=>play(i);fl.appendChild(d);}}
function show(){snake=[];const n=Math.min(3+round,N);
for(let i=0;i<n;i++)snake.push((Math.random()*N)|0);
seq=snake.slice();idx=0;
document.getElementById('r').textContent=round;
// animate snake rising
const cols=document.querySelectorAll('.col');
cols.forEach(c=>c.style.height='30px');
snake.forEach((s,k)=>{setTimeout(()=>{const c=cols[s];
c.style.height=(60+k*22)+'px';note(s);},400+k*380);});
// player must answer sorted by height (tallest first), not show order
seq=snake.map((s,k)=>({s,h:k})).sort((a,b)=>b.h-a.h).map(o=>o.s);
setTimeout(()=>{msg('🎵 Tallest first!');},400+snake.length*380);}
function play(i){note(i);
if(i!==seq[idx]){beep(150,.2,'sawtooth');
msg('🐍 The snake rears! Round '+round);
if(round>best){best=round;localStorage.setItem('dsc2_best',best);document.getElementById('b').textContent=best;}
return;}
idx++;
if(idx>=seq.length){beep(880,.25,'triangle');msg('✅ Charmed! Round '+(round+1));round++;
document.getElementById('r').textContent=round;
setTimeout(show,900);}}
function msg(t){document.getElementById('msg').textContent=t;}
document.getElementById('btn').onclick=()=>{round=1;document.getElementById('r').textContent=1;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();build();show();};
build();
</script></body></html>
