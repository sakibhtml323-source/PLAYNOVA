<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crystal Pool Dive #452</title><style>
body{margin:0;font-family:system-ui;background:#0c4a6e;color:#e0f2fe;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#7dd3fc;font-size:.78rem}
canvas{background:#075985;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#38bdf8;color:#0c4a6e;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🤿 Crystal Pool Dive</h1><div class="sub">Pearls drift across the pool — dive when one is directly below!</div>
<div id="hud"><span>Pearls <b id="p">0</b></span><span>⏱️ <b id="t">45</b>s</span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="440" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">🦪</div><p>Pearls drift left-right.<br>Tap to dive — catch them at the right moment!</p><button id="btn">Dive</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=400,SURF=80,POOLB=H-40;let pearls=[],diver={x:W/2,y:SURF,state:'surface'},pearlsGot=0,playing=false,time=45,timer=null,spawnT=0,best=+localStorage.getItem('cpd_best')||0;
document.getElementById('b').textContent=best;
function spawn(){pearls.push({x:40+Math.random()*(W-80),y:POOLB-20-Math.random()*60,
ph:Math.random()*6,vx:(Math.random()<0.5?-1:1)*(0.5+Math.random())});}
cvs.addEventListener('pointerdown',()=>{if(!playing)return;
if(diver.state==='surface'){diver.state='diving';beep(500,.08);}});
function step(){time--;document.getElementById('t').textContent=time;
if(time<=0){playing=false;clearInterval(timer);beep(880,.3,'triangle');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🌅 Dive over!<br>Pearls: <b style="color:#fbbf14">'+pearlsGot+'</b>';
if(pearlsGot>best){best=pearlsGot;localStorage.setItem('cpd_best',best);document.getElementById('b').textContent=best;}return;}
spawnT++;if(spawnT>55){spawnT=0;spawn();}
pearls.forEach(p=>{p.ph+=0.04;p.x+=p.vx+Math.sin(p.ph)*0.4;
if(p.x<30||p.x>W-30)p.vx*=-1;});
// diver physics
if(diver.state==='diving'){diver.y+=5;
if(diver.y>=POOLB-10){diver.state='rising';}}
else if(diver.state==='rising'){diver.y-=4.5;
if(diver.y<=SURF){diver.y=SURF;diver.state='surface';}}
// catch
if(diver.state!=='surface'){
pearls=pearls.filter(p=>{if(Math.hypot(p.x-diver.x,p.y-diver.y)<22){
pearlsGot++;document.getElementById('p').textContent=pearlsGot;
beep(600+pearlsGot*20,.09);return false;}return true;});}}
function draw(){ctx.fillStyle='#075985';ctx.fillRect(0,0,W,H);
// water
ctx.fillStyle='#0ea5e966';ctx.fillRect(0,SURF,W,H-SURF);
// surface line
ctx.strokeStyle='#7dd3fc';
ctx.beginPath();ctx.moveTo(0,SURF);
for(let x=0;x<W;x+=16)ctx.lineTo(x,SURF+Math.sin(x*0.05+Date.now()/200)*3);
ctx.stroke();
pearls.forEach(p=>{ctx.font='18px serif';ctx.textAlign='center';ctx.fillText('🦪',p.x,p.y+6);});
ctx.font='26px serif';ctx.fillText('🤿',diver.x,diver.y+8);
if(playing){requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{pearls=[];diver={x:W/2,y:SURF,state:'surface'};
pearlsGot=0;spawnT=0;time=45;playing=true;
document.getElementById('p').textContent=0;document.getElementById('t').textContent=45;
document.getElementById('ov').style.display='none';
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();
clearInterval(timer);timer=setInterval(()=>{if(playing)step();},1000);};
</script></body></html>
