<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Royal Bell Tower #451</title><style>
body{margin:0;font-family:system-ui;background:#1e1b4b;color:#eef2ff;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a5b4fc;font-size:.78rem}
#tower{display:flex;flex-direction:column-reverse;gap:4px;margin:14px}
.lvl{display:flex;gap:6px;align-items:center}
.lvl .ln{width:90px;text-align:right;font-size:.7rem;color:#a5b4fc;padding-right:8px}
.bell{width:58px;height:44px;background:#4338ca;border:2px solid #6366f1;border-radius:10px 10px 18px 18px;cursor:pointer;font-size:20px;transition:transform .08s}
.bell.ring{transform:scale(1.12);background:#7c3aed;border-color:#fbbf24}
.bell.done{background:#14532d;border-color:#22c55e}
#hud{display:flex;gap:14px;font-size:.9rem;margin:4px}#hud b{color:#fbbf24}
#msg{min-height:1.4em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#fbbf24;color:#1e1b4b;font-weight:700;cursor:pointer;margin:8px}
</style></head><body>
<h1>🎵 Royal Bell Tower</h1><div class="sub">Ring the tower bells bottom-to-top — the melody must be PERFECT or the tower resets!</div>
<div id="hud"><span>Level <b id="l">1</b></span><span>Sequence <b id="s">?</b></span></div>
<div id="tower"></div>
<div id="msg"></div>
<button id="btn">👑 New Tower</button>
<audio id="au"></audio>
<script>
"use strict";
const AU=document.getElementById('au');
function bell(i){const F=[262,330,392,494,587,698];
try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());
const os=o.createOscillator(),g=o.createGain();
os.type='sine';os.frequency.value=F[i];
g.gain.setValueAtTime(.15,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+.5);
os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+.5);}catch(e){}}
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const N=6;let seq=[],idx=0,level=1;
function gen(){const n=Math.min(3+level,N);
seq=[];for(let i=0;i<n;i++)seq.push((Math.random()*3)|0);
idx=0;document.getElementById('l').textContent=level;
document.getElementById('s').textContent=seq.map(s=>'♪'.repeat(s+1)).join('·');
const t=document.getElementById('tower');t.innerHTML='';
for(let row=0;row<n;row++){const lvl=document.createElement('div');lvl.className='lvl';
const ln=document.createElement('span');ln.className='ln';ln.textContent='Bell '+(row+1);lvl.appendChild(ln);
for(let b=0;b<3;b++){const d=document.createElement('div');d.className='bell';
d.textContent='🔔';
d.onclick=()=>ring(row,b);lvl.appendChild(d);}
t.appendChild(lvl);}
msg('Ring the pattern on each bell!');}
function flash(row,col){const bells=document.querySelectorAll('.lvl')[row].querySelectorAll('.bell');
bells[col].classList.add('ring');bell(col);
setTimeout(()=>bells[col].classList.remove('ring'),200);}
function ring(row,col){if(row!==idx){beep(160,.06,'sawtooth');msg('Bottom bell first!');return;}
if(col!==seq[idx]){beep(150,.2,'sawtooth');msg('❌ Wrong note! Tower resets…');
idx=0;render();return;}
flash(row,col);
document.querySelectorAll('.lvl')[row].querySelectorAll('.bell').forEach(b=>b.classList.add('done'));
idx++;beep(500+idx*60,.08);
if(idx>=seq.length){beep(880,.3,'triangle');msg('🎵 The tower sings! Level '+(level+1));level++;
setTimeout(gen,1000);return;}
render();msg('✅ Next bell up!');}
function render(){}
function msg(t){document.getElementById('msg').textContent=t;}
document.getElementById('btn').onclick=()=>{level=1;AU.__c=new (window.AudioContext||window.webkitAudioContext)();gen();};
gen();
</script></body></html>
