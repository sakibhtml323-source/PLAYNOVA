<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Royal Crown Catch #460</title><style>
body{margin:0;font-family:system-ui;background:#1e1b4b;color:#eef2ff;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a5b4fc;font-size:.78rem}
canvas{background:#312e81;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#1e1b4b;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>👑 Royal Crown Catch</h1><div class="sub">The crown's jewels fall — catch them in ROYAL ORDER: ruby, emerald, sapphire!</div>
<div id="hud"><span>Order <b id="o">💎?</b></span><span>⏱️ <b id="t">60</b>s</span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="440" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">💎</div><p>Catch jewels in the shown order — wrong jewels clutter the crown!<br>Move with mouse/keys.</p><button id="btn">Catch</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=400;const JEWELS=[{e:'♦️',n:'Ruby',c:'#dc2626'},{e:'💚',n:'Emerald',c:'#22c55e'},{e:'💙',n:'Sapphire',c:'#3b82f6'}];
let order=[],idx=0,falling=[],crown={x:W/2},sets=0,playing=false,time=60,timer=null,spawnT=0,best=+localStorage.getItem('rcc2_best')||0;
document.getElementById('b').textContent=best;
function newOrder(){order=[0,1,2].sort(()=>Math.random()-.5);idx=0;
document.getElementById('o').textContent=order.map(i=>JEWELS[i].e).join('→');}
function gen(){falling=[];sets=0;playing=true;time=60;spawnT=0;
document.getElementById('t').textContent=60;newOrder();
AU.__c=new (window.AudioContext||window.webkitAudioContext)();
clearInterval(timer);timer=setInterval(()=>{time--;document.getElementById('t').textContent=time;
if(time<=0){playing=false;clearInterval(timer);beep(880,.3,'triangle');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🏰 The ceremony ends!<br>Sets: <b style="color:#fbbf14">'+sets+'</b>';
if(sets>best){best=sets;localStorage.setItem('rcc2_best',best);document.getElementById('b').textContent=best;}}},1000);draw();}
cvs.addEventListener('pointermove',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
crown.x=(e.clientX-r.left)*W/r.width;});
document.addEventListener('keydown',e=>{if(!playing)return;
if(e.key==='ArrowLeft')crown.x=Math.max(40,crown.x-24);
if(e.key==='ArrowRight')crown.x=Math.min(W-40,crown.x+24);});
function step(){spawnT++;if(spawnT>Math.max(30,60-sets*3)){spawnT=0;
// 70% spawn the needed jewel
const need=order[idx];
const j=Math.random()<0.7?need:(Math.random()*3)|0;
falling.push({x:30+Math.random()*(W-60),y:-16,vy:2+Math.random()*1.5+sets*0.1,j});}
falling.forEach(f=>f.y+=f.vy);
falling=falling.filter(f=>{if(f.y>H-56){if(Math.abs(f.x-crown.x)<36){
if(f.j===order[idx]){idx++;
beep(600+idx*100,.1);
if(idx>=3){sets++;beep(880,.2,'triangle');newOrder();}}
else{beep(200,.1,'sawtooth');// wrong jewel = clutter, lose time
time=Math.max(0,time-2);document.getElementById('t').textContent=time;}
return false;}}
return f.y<H+20;});}
function draw(){ctx.fillStyle='#312e81';ctx.fillRect(0,0,W,H);
// crown at bottom
ctx.font='36px serif';ctx.textAlign='center';ctx.fillText('👑',crown.x,H-20);
falling.forEach(f=>{ctx.font='22px serif';ctx.fillText(JEWELS[f.j].e,f.x,f.y);});
// progress
ctx.font='16px serif';
ctx.fillText(order.map((j,i)=>i<idx?'✓':JEWELS[j].e).join(' '),W/2,36);
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{gen();
document.getElementById('ov').style.display='none';};
</script></body></html>
