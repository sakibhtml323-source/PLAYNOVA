<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crystal Gem Grid #446</title><style>
body{margin:0;font-family:system-ui;background:#0f172a;color:#e2e8f0;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#94a3b8;font-size:.78rem}
#pattern{display:flex;gap:8px;margin:10px;font-size:1.7rem;min-height:36px}
#pattern span{opacity:.35}
#pattern span.done{opacity:1}
#grid{display:grid;grid-template-columns:repeat(5,58px);gap:4px;margin:10px}
.c{width:58px;height:58px;background:#1e293b;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer}
.c.mined{background:#312e81}
#hud{display:flex;gap:14px;font-size:.9rem;margin:4px}#hud b{color:#fbbf24}
#msg{min-height:1.3em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#7c3aed;color:#fff;font-weight:700;cursor:pointer;margin:8px}
</style></head><body>
<h1>⛏️ Crystal Gem Grid</h1><div class="sub">The vein shows a pattern — mine the gems in that exact order!</div>
<div id="hud"><span>Round <b id="r">1</b></span><span>⏱️ <b id="t">30</b>s</span><span>Score <b id="s">0</b></span></div>
<div id="pattern"></div>
<div id="grid"></div>
<div id="msg"></div>
<button id="btn">💎 New Vein</button>
<audio id="au"></audio>
<script>
"use strict";
const AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const GEMS=[['💎','#7c3aed'],['🔷','#3b82f6'],['💠','#22d3ee'],['👑','#eab308'],['💜','#a855f7']];
let cells=[],pattern=[],idx=0,round=1,score=0,time=30,timer=null,playing=false;
function newRound(){const n=5;
cells=[];pattern=[];idx=0;
for(let i=0;i<n;i++)for(let j=0;j<n;j++)cells.push({g:(Math.random()*GEMS.length)|0,mined:false,shown:false});
// pattern of 4-6
const pn=Math.min(3+round,6);
for(let i=0;i<pn;i++)pattern.push((Math.random()*GEMS.length)|0);
// ensure pattern gems exist
pattern.forEach(g=>{if(!cells.some(c=>c.g===g&&!c.shown)){
const c=cells.find(x=>!x.shown);if(c){c.g=g;}}});
// mark which cells are pattern targets (first match per gem)
const need={};pattern.forEach(g=>need[g]=(need[g]||0)+1);
cells.forEach(c=>{if(need[c.g]>0){c.shown=true;need[c.g]--;}});
document.getElementById('r').textContent=round;
const pd=document.getElementById('pattern');pd.innerHTML='';
pattern.forEach((g,i)=>{const s=document.createElement('span');s.textContent=GEMS[g][0];pd.appendChild(s);});
time=30;document.getElementById('t').textContent=30;playing=true;
render();msg('Mine in pattern order!');
clearInterval(timer);timer=setInterval(()=>{time--;document.getElementById('t').textContent=time;
if(time<=0){playing=false;clearInterval(timer);beep(130,.3,'sawtooth');msg('⏰ The vein collapses! Score: '+score);}},1000);}
function tap(i){if(!playing)return;
const c=cells[i];
if(c.mined||!c.shown)return;
if(c.g!==pattern[idx]){beep(150,.15,'sawtooth');msg('❌ Wrong gem! Restart pattern.');
idx=0;renderPattern();return;}
c.mined=true;idx++;renderPattern();
beep(400+idx*80,.08);render();
if(idx>=pattern.length){score+=pattern.length*20;document.getElementById('s').textContent=score;
beep(880,.25,'triangle');msg('💎 Vein cleared! Round '+(round+1));round++;
setTimeout(newRound,1000);}}
function renderPattern(){const pd=document.getElementById('pattern');
[...pd.children].forEach((s,i)=>{s.classList.toggle('done',i<idx);});}
function render(){const g=document.getElementById('grid');g.innerHTML='';
cells.forEach((c,i)=>{const d=document.createElement('div');
d.className='c'+(c.mined?' mined':'');
if(c.shown&&!c.mined)d.textContent=GEMS[c.g][0];
else if(c.shown)d.style.background=GEMS[c.g][1]+'33';
d.onclick=()=>{AU.__c=AU.__c||new (window.AudioContext||window.webkitAudioContext)();tap(i);};
g.appendChild(d);});}
function msg(t){document.getElementById('msg').textContent=t;}
document.getElementById('btn').onclick=()=>{round=1;score=0;
document.getElementById('s').textContent=0;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();newRound();};
newRound();
</script></body></html>
