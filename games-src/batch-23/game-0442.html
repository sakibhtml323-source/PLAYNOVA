<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Star Fall #442</title><style>
body{margin:0;font-family:system-ui;background:#0c1445;color:#e0e7ff;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#93c5fd;font-size:.78rem}
canvas{background:#111936;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#0c1445;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>⭐ Desert Star Fall</h1><div class="sub">Stars fall from the night sky — tap them before they touch the dunes!</div>
<div id="hud"><span>Caught <b id="c">0</b></span><span>Missed <b id="m">0</b>/5</span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="440" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">🌠</div><p>Tap stars before they land.<br>5 misses and the night ends!</p><button id="btn">Catch</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=400;let stars=[],caught=0,missed=0,playing=false,spawnT=0,best=+localStorage.getItem('dsf_best')||0;
document.getElementById('b').textContent=best;
function spawn(){stars.push({x:20+Math.random()*(W-40),y:-16,vy:2+Math.random()*2+caught*0.03,
r:12+Math.random()*8,tw:Math.random()*6});}
cvs.addEventListener('pointerdown',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
let bi=-1,bd=1e9;
stars.forEach((s,i)=>{const d=Math.hypot(s.x-x,s.y-y);if(d<bd){bd=d;bi=i;}});
if(bi>=0&&bd<stars[bi].r+10){caught++;document.getElementById('c').textContent=caught;
beep(600+caught*12,.08);stars.splice(bi,1);
if(caught>best){best=caught;localStorage.setItem('dsf_best',best);document.getElementById('b').textContent=best;}}
else beep(180,.06,'sawtooth');});
function step(){spawnT++;if(spawnT>Math.max(25,55-caught*0.4)){spawnT=0;spawn();}
stars.forEach(s=>{s.y+=s.vy;s.tw+=0.1;});
stars=stars.filter(s=>{if(s.y>H-16){missed++;document.getElementById('m').textContent=missed;
beep(150,.12,'sawtooth');
if(missed>=5){playing=false;
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🌅 Dawn breaks!<br>Caught: <b style="color:#fbbf14">'+caught+'</b>';return false;}}
return s.y<H+20;});}
function draw(){ctx.fillStyle='#111936';ctx.fillRect(0,0,W,H);
for(let i=0;i<30;i++){ctx.fillStyle='#ffffff18';ctx.fillRect((i*89)%W,(i*61)%W,2,2);}
// dunes
ctx.fillStyle='#1e3a8a';ctx.beginPath();ctx.moveTo(0,H);
ctx.quadraticCurveTo(W/3,H-30,2*W/3,H-6);ctx.quadraticCurveTo(5*W/6,H+6,W,H-14);
ctx.lineTo(W,H);ctx.fill();
stars.forEach(s=>{ctx.globalAlpha=0.6+0.4*Math.sin(s.tw);
ctx.font=s.r*1.6+'px serif';ctx.textAlign='center';
ctx.fillText('⭐',s.x,s.y);ctx.globalAlpha=1;});
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{stars=[];caught=0;missed=0;spawnT=0;
document.getElementById('c').textContent=0;document.getElementById('m').textContent=0;
document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();};
</script></body></html>
