<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haunted Tower Stack #449</title><style>
body{margin:0;font-family:system-ui;background:#18181b;color:#fafafa;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a1a1aa;font-size:.78rem}
canvas{background:#27272a;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#facc15}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#7c3aed;color:#fff;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>👻 Haunted Tower Stack</h1><div class="sub">Tap to stack bricks — but the ghost breathes! Time your taps between gusts.</div>
<div id="hud"><span>Height <b id="h">0</b></span><span>Stability <b id="s">100</b></span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="400" height="440"></canvas>
<div id="ov"><div style="font-size:3rem">🧱</div><p>The ghost's breath rocks the tower.<br>Tap when the sway is centered!</p><button id="btn">Build</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=400,H=440,BW=90,BH=20;let stack=[],sway=0,stab=100,playing=false,best=+localStorage.getItem('hts_best')||0;
document.getElementById('b').textContent=best;
cvs.addEventListener('pointerdown',()=>{if(!playing)return;
const off=Math.sin(sway*0.05)*Math.max(6,26-stack.length);
const miss=Math.abs(off);
stack.push({off});
beep(440+stack.length*20,.07);
if(miss>22){stab-=22;}else{stab=Math.min(100,stab+4);}
document.getElementById('h').textContent=stack.length;
document.getElementById('s').textContent=Math.max(0,Math.round(stab));
if(stab<=0){collapse();return;}
if(stack.length>best){best=stack.length;localStorage.setItem('hts_best',best);document.getElementById('b').textContent=best;}
if(stack.length>=25){playing=false;beep(880,.3,'triangle');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🏰 Tower complete! 25 bricks!';}});
function collapse(){playing=false;beep(130,.35,'sawtooth');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='💥 Ghost wins at height '+stack.length+'!';}
function draw(){ctx.fillStyle='#27272a';ctx.fillRect(0,0,W,H);
const baseY=H-36;
ctx.fillStyle='#3f3f46';ctx.fillRect(80,baseY,240,12);
let cum=0;
stack.forEach((b,i)=>{const y=baseY-12-i*BH;
cum+=b.off*0.4;
ctx.save();ctx.translate(W/2+cum,y);ctx.rotate(cum*0.004);
ctx.fillStyle=['#57534e','#44403c','#52525b'][i%3];
ctx.fillRect(-BW/2,-BH+2,BW,BH-2);
ctx.strokeStyle='#713f12';ctx.strokeRect(-BW/2,-BH+2,BW,BH-2);
ctx.restore();});
// current sway indicator
if(playing){const off=Math.sin(sway*0.05)*Math.max(6,26-stack.length);
const sy=60;
ctx.fillStyle=Math.abs(off)<22?'#22c55e':'#ef4444';
ctx.fillRect(W/2+off-BW/2,sy,BW,BH);
ctx.font='13px serif';ctx.textAlign='center';
ctx.fillText('tap when centered',W/2,sy-8);}
// ghost
ctx.font='36px serif';ctx.fillText('👻',60+Math.sin(sway*0.02)*10,70);
if(playing){sway++;requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{stack=[];sway=0;stab=100;
document.getElementById('h').textContent=0;document.getElementById('s').textContent=100;
document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();};
</script></body></html>
