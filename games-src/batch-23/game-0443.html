<script>
"use strict";
const $=id=>document.getElementById(id);
const W=360,H=396,T=36,VW=10,VH=11,MW=28,MH=28,cvs=$('c'),ctx=cvs.getContext('2d');
function emit(t,x){try{if(typeof pnEmit==='function')pnEmit(t,x||{})}catch(e){}}
const TN=['Flame','Leaf','Wave','Normal'],TE=['🔥','🌿','💧','⭐'],TC=['#ff7a45','#5fd16a','#4aa8ff','#c9c2d8'];
const RN=['Common','Rare','Epic','Legendary'],RC=['#d7dee9','#4cc9f0','#b388ff','#ffd23f'];
/* name,type,rar,body,belly,shape,ears,horn,wings,tail,ant */
const SP=[['Pip',3,0,'#ffb3c6','#ffe5ec',0,1,0,0,1,0],['Mochi',3,0,'#f4f1ff','#ffffff',2,1,0,0,0,0],['Bubu',2,0,'#9be7ff','#e0f8ff',0,0,0,0,1,1],['Nubbin',0,0,'#ffd8a8','#fff0dc',1,2,0,0,1,0],['Fluff',1,0,'#d9f99d','#f4ffd9',2,1,0,0,0,1],['Ziggy',3,0,'#fde68a','#fff7cc',0,2,0,0,1,0],
['Sprout',1,1,'#86efac','#d9ffe6',0,1,1,0,1,1],['Ember',0,1,'#ff9a6c','#ffe0cf',1,2,1,0,1,0],['Drizzle',2,1,'#7cc4ff','#d9eeff',2,0,0,1,1,1],['Gale',3,1,'#c4b5fd','#ece7ff',0,2,0,1,0,0],['Pebble',1,1,'#b8b3a8','#e7e3da',2,1,1,0,1,0],
['Nova',0,2,'#ff7bd5','#ffd6f1',1,2,1,1,1,1],['Shade',3,2,'#7a6bd6','#c9c2ff',0,2,1,1,1,0],['Lumi',2,2,'#5ee6c8','#c8fff3',2,1,0,1,1,1],
['Solaris',0,3,'#ffc53d','#fff1b8',1,2,1,1,1,1],['Eclipse',3,3,'#4b3a8f','#a99cff',2,2,1,1,1,1]];
const MV=[['Ember',0],['Vine Whip',1],['Splash',2],['Swift',3]];
/* ---------- save ---------- */
let SV={owned:[],coins:20,orbs:5,zone:1,seed:777,x:2,y:2,seen:{},steps:0,wins:0};
try{const o=JSON.parse(localStorage.getItem('cq_save')||'null');if(o&&o.owned)SV=Object.assign(SV,o)}catch(e){}

/* ---------- audio ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended'){try{AC.resume()}catch(e){}}return AC}
function tone(f,d,type,v,delay,slide){const a=ac();if(!a)return;try{const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.1,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const sfx={step(){tone(140,.04,'square',.02)},hit(e){tone(e>1?260:e<1?120:190,.14,'sawtooth',.1,0,-80)},enc(){[330,392,330,440,523].forEach((f,i)=>tone(f,.1,'square',.07,i*.07))},orb(){tone(500,.08,'triangle',.1,0,300)},caught(){[523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.12,i*.09))},lvl(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,.18,'triangle',.11,i*.07))},faint(){tone(300,.5,'sawtooth',.1,0,-220)},heal(){[392,523,659].forEach((f,i)=>tone(f,.2,'sine',.1,i*.1))},win(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.22,'triangle',.12,i*.1))},err(){tone(160,.12,'square',.07)}};
/* ---------- layout ---------- */
let css=1,dprR=1;
function resize(){css=Math.max(.45,Math.min((innerWidth-12)/W,(innerHeight-250)/H));dprR=Math.min(devicePixelRatio||1,2)*css;cvs.width=Math.round(W*dprR);cvs.height=Math.round(H*dprR);cvs.style.width=Math.round(W*css)+'px';cvs.style.height=Math.round(H*css)+'px'}
addEventListener('resize',resize);resize();
/* ---------- critter drawing ---------- */
function shade(hex,k){const n=parseInt(hex.slice(1),16),r=Math.max(0,Math.min(255,(n>>16)*k)),g=Math.max(0,Math.min(255,((n>>8)&255)*k)),b=Math.max(0,Math.min(255,(n&255)*k));return 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')'}
function critter(c,x,y,s,sp,t,flip){const [nm,ty,rar,c1,c2,shape,ears,horn,wings,tail,ant]=sp,rx=s*[.5,.42,.6][shape],ry=s*[.48,.62,.42][shape];c.save();c.translate(x,y+Math.sin(t*3)*s*.025);if(flip)c.scale(-1,1);
if(rar>=2){const g=c.createRadialGradient(0,0,s*.2,0,0,s*1.05);g.addColorStop(0,RC[rar]+'88');g.addColorStop(1,RC[rar]+'00');c.fillStyle=g;c.beginPath();c.arc(0,0,s*1.05,0,6.283);c.fill()}
if(wings){c.fillStyle='rgba(255,255,255,.75)';const f=Math.sin(t*9)*.25;c.save();c.rotate(-.5+f);c.beginPath();c.ellipse(-rx-s*.12,-ry*.1,s*.28,s*.14,0,0,6.283);c.fill();c.restore();c.save();c.rotate(.5-f);c.beginPath();c.ellipse(rx+s*.12,-ry*.1,s*.28,s*.14,0,0,6.283);c.fill();c.restore()}
if(tail){c.strokeStyle=c1;c.lineWidth=s*.12;c.lineCap='round';c.beginPath();c.moveTo(rx*.8,ry*.5);c.quadraticCurveTo(rx*1.5,ry*.6+Math.sin(t*5)*s*.1,rx*1.35,ry*.05);c.stroke();c.fillStyle=c2;c.beginPath();c.arc(rx*1.35,ry*.05,s*.09,0,6.283);c.fill()}
c.fillStyle=c1;
if(ears===1){c.beginPath();c.arc(-rx*.62,-ry*.78,s*.17,0,6.283);c.arc(rx*.62,-ry*.78,s*.17,0,6.283);c.fill()}
if(ears===2){c.beginPath();c.moveTo(-rx*.85,-ry*.45);c.lineTo(-rx*.5,-ry*1.22);c.lineTo(-rx*.1,-ry*.8);c.fill();c.beginPath();c.moveTo(rx*.85,-ry*.45);c.lineTo(rx*.5,-ry*1.22);c.lineTo(rx*.1,-ry*.8);c.fill()}
if(ant){c.strokeStyle=c1;c.lineWidth=s*.05;c.beginPath();c.moveTo(0,-ry*.95);c.quadraticCurveTo(s*.1,-ry*1.3,s*.04,-ry*1.42);c.stroke();c.fillStyle=TC[ty];c.beginPath();c.arc(s*.04,-ry*1.42,s*.07,0,6.283);c.fill()}
if(horn){c.fillStyle=rar>=3?'#fff2a8':'#fff';c.beginPath();c.moveTo(-s*.07,-ry*.9);c.lineTo(0,-ry*1.32);c.lineTo(s*.07,-ry*.9);c.fill()}
const g=c.createLinearGradient(0,-ry,0,ry);g.addColorStop(0,c1);g.addColorStop(1,shade(c1,.78));c.fillStyle=g;c.beginPath();c.ellipse(0,0,rx,ry,0,0,6.283);c.fill();
c.fillStyle=c2;c.beginPath();c.ellipse(0,ry*.3,rx*.62,ry*.55,0,0,6.283);c.fill();
const ey=-ry*.12,ex=rx*.38,er=s*.115;c.fillStyle='#fff';c.beginPath();c.arc(-ex,ey,er,0,6.283);c.arc(ex,ey,er,0,6.283);c.fill();
c.fillStyle='#2a1a3a';c.beginPath();c.arc(-ex,ey+1,er*.62,0,6.283);c.arc(ex,ey+1,er*.62,0,6.283);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(-ex-er*.2,ey-er*.2,er*.22,0,6.283);c.arc(ex-er*.2,ey-er*.2,er*.22,0,6.283);c.fill();
c.fillStyle='rgba(255,120,150,.45)';c.beginPath();c.arc(-rx*.62,ey+er*1.3,s*.07,0,6.283);c.arc(rx*.62,ey+er*1.3,s*.07,0,6.283);c.fill();
c.strokeStyle='#2a1a3a';c.lineWidth=s*.03;c.lineCap='round';c.beginPath();c.arc(0,ey+er*1.5,s*.07,.15,Math.PI-.15);c.stroke();c.restore()}
/* ---------- critters / stats ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1));
const mhpOf=(id,lv)=>30+lv*7+SP[id][2]*5;
function mk(id,lv){const c={id,lv,xp:0,hp:0};c.hp=mhpOf(id,lv);c.dh=c.hp;c.pp=8;return c}
const alive=c=>c.hp>0,mhp=c=>mhpOf(c.id,c.lv),spOf=c=>SP[c.id];
function eff(a,d){if(a===3||d===3)return 1;if((a===0&&d===1)||(a===1&&d===2)||(a===2&&d===0))return 1.6;if((a===1&&d===0)||(a===2&&d===1)||(a===0&&d===2))return .65;return 1}
function calcDmg(att,def,pow,ty){const A=att.lv*1.2+spOf(att)[2]*3+8,D=def.lv+spOf(def)[2]*3+8,e=eff(ty,spOf(def)[1]);return{d:Math.max(1,Math.floor(((A/D)*pow*.55+2)*e*rnd(.9,1.1))),e}}
/* ---------- map ---------- */
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
let map=[];
function genMap(seed){const R=rng(seed),m=Array.from({length:MH},()=>Array(MW).fill(0));
for(let k=0;k<26;k++){const cx=R()*MW,cy=R()*MH,r=2+R()*3.2;for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(Math.hypot(x-cx,y-cy)<r)m[y][x]=1}
for(let k=0;k<7;k++){const cx=R()*MW,cy=R()*MH,r=1.5+R()*2.4;for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)if(Math.hypot(x-cx,y-cy)<r)m[y][x]=3}
for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){if(x===0||y===0||x===MW-1||y===MH-1)m[y][x]=2;else if(m[y][x]===0&&R()<.1)m[y][x]=2;else if(m[y][x]===0&&R()<.06)m[y][x]=4}
const tx=MW-3,ty=MH-3;let x=2,y=2;m[y][x]=8;while(x!==tx||y!==ty){if(R()<.5&&x!==tx)x+=Math.sign(tx-x);else if(y!==ty)y+=Math.sign(ty-y);else x+=Math.sign(tx-x);m[y][x]=8}
for(let yy=1;yy<=5;yy++)for(let xx=1;xx<=5;xx++)if(m[yy][xx]!==8)m[yy][xx]=0;
m[2][4]=5;m[4][2]=6;m[ty][tx]=7;if(m[ty-1][tx]===2)m[ty-1][tx]=8;return m}
const walk=t=>t!==2&&t!==3;
/* ---------- state ---------- */
let state='over',P={x:2,y:2,px:2,py:2,t:1,dir:2,step:0},cam={x:0,y:0},time=0,keyDir=null,dpadDir=null,B=null,flash=0,shake=0,msg='',busy=false,parts=[],floats=[],noEnc=3,tr=null;
function zoneLv(x,y){return Math.max(2,3+(SV.zone-1)*6+Math.floor((x+y)*.2))}
function lead(){return SV.owned.find(alive)}
function hud(){$('zone').textContent=SV.zone;$('coins').textContent=SV.coins;$('orbs').textContent=SV.orbs;$('dex').textContent=Object.keys(SV.seen).filter(k=>SV.seen[k]===2).length}
function healAll(){SV.owned.forEach(c=>{c.hp=mhp(c);c.dh=c.hp;c.pp=8})}
function burst(x,y,col,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=(sp||1)*rnd(40,200);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-50,life:1,r:rnd(1.5,4),c:col})}}
function ftxt(x,y,t,c,s){floats.push({x,y,t,c:c||'#fff',s:s||15,life:1})}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function tween(ms,fn){return new Promise(res=>{const t0=performance.now();(function st(){const t=Math.min(1,(performance.now()-t0)/ms);fn(t);if(t<1)requestAnimationFrame(st);else res()})()})}
/* ---------- panel ---------- */
function panel(h){$('panel').innerHTML=h}
function overPanel(){panel('<div id="dpad"><span></span><button data-d="0">▲</button><span></span><button data-d="3">◀</button><span></span><button data-d="1">▶</button><span></span><button data-d="2">▼</button><span></span></div><div id="side"><button class="pb" data-a="party">🎒 Party & Album</button><button class="pb" data-a="heal">🍎 Rest<small>heals at fountain ⛲</small></button></div>');
$('panel').querySelectorAll('#dpad button').forEach(b=>{const d=+b.dataset.d;b.addEventListener('pointerdown',e=>{e.preventDefault();ac();dpadDir=d});['pointerup','pointercancel','pointerleave'].forEach(t=>b.addEventListener(t,()=>{if(dpadDir===d)dpadDir=null}))})}
$('panel').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;ac();act(b.dataset.a,b.dataset.i)});
function catchP(e){return Math.max(.08,Math.min(.92,(1-e.hp/mhp(e))*.55+.3-spOf(e)[2]*.09-Math.max(0,e.lv-(lead()||e).lv)*.015))}
function mainPanel(){const c=B.p,orbBtn=B.trainer?'<button class="pb" disabled>⚪ Orb<small>can\'t catch trainer\'s</small></button>':'<button class="pb" data-a="orb"'+(SV.orbs<1?' disabled':'')+'>⚪ Catch<small>'+SV.orbs+' orbs · chance '+(catchP(B.e)<.3?'low':catchP(B.e)<.55?'medium':'high')+'</small></button>';
panel('<button class="pb f" data-a="fight">⚔ Fight</button>'+orbBtn+'<button class="pb" data-a="switch">🔁 Switch</button><button class="pb" data-a="run"'+(B.trainer?' disabled':'')+'>🏃 Run</button>')}
function fightPanel(){const c=B.p,ty=spOf(c)[1];panel('<button class="pb n" data-a="mv" data-i="0">Tackle<small>⭐ 40 · ∞</small></button><button class="pb '+['f','l','w','n'][ty]+'" data-a="mv" data-i="1"'+(c.pp<1?' disabled':'')+'>'+MV[ty][0]+'<small>'+TE[ty]+' 65 · PP '+c.pp+'</small></button><button class="pb l" data-a="mv" data-i="2"'+(c.pp<1?' disabled':'')+'>Mend<small>heal 30% · PP '+c.pp+'</small></button><button class="pb" data-a="back">◀ Back</button>')}
function switchPanel(forced){let h='';SV.owned.slice(0,4).forEach((c,i)=>{h+='<button class="pb" data-a="sw" data-i="'+i+'"'+((!alive(c)||c===B.p)?' disabled':'')+'>'+spOf(c)[0]+' L'+c.lv+'<small>'+Math.max(0,Math.ceil(c.hp))+'/'+mhp(c)+'</small></button>'});if(!forced)h+='<button class="pb" data-a="back">◀ Back</button>';panel(h)}
function act(a,i){if(state==='battle'){if(busy)return;if(a==='fight')fightPanel();else if(a==='back')mainPanel();else if(a==='switch')switchPanel(false);else if(a==='mv')playerMove(+i);else if(a==='orb')throwOrb();else if(a==='run')runAway();else if(a==='sw')doSwitch(+i,false)}
else if(state==='over'){if(a==='party')partyScreen();else if(a==='heal'){const t=map[P.y][P.x];if(t===5){healAll();sfx.heal();ftxt(P.px*T-cam.x+T/2,P.py*T-cam.y,'Healed!','#7bff6a',16);save()}else sfx.err()}}}
/* ---------- overworld ---------- */
function tileAt(x,y){return(x<0||y<0||x>=MW||y>=MH)?2:map[y][x]}
function tryMove(d){if(P.moving||state!=='over')return;const dx=[0,1,0,-1][d],dy=[-1,0,1,0][d];P.dir=d;const nx=P.x+dx,ny=P.y+dy;if(!walk(tileAt(nx,ny)))return;P.moving=true;P.fx=P.x;P.fy=P.y;P.x=nx;P.y=ny;P.mt=0}
async function arrive(){sfx.step();const t=map[P.y][P.x];SV.x=P.x;SV.y=P.y;SV.steps++;if(SV.steps%12===0)save();
if(t===5){healAll();sfx.heal();ftxt(P.x*T-cam.x+T/2,P.y*T-cam.y,'Party healed ⛲','#7bff6a',14);save()}
else if(t===6){await shop();return}
else if(t===7){await bossFight();return}
else if(t===1){noEnc--;if(noEnc<=0&&Math.random()<.16)await wild()}}
function wildSpecies(){const r=Math.random(),far=P.x+P.y;let rar=r<.7?0:r<.94?1:r<.995?2:3;if(rar===2&&far<20)rar=1;if(rar===3&&far<35)rar=2;const pool=SP.map((s,i)=>i).filter(i=>SP[i][2]===rar);return pool[ri(0,pool.length-1)]}
async function wild(){state='enc';sfx.enc();flash=1;shake=6;await wait(650);const lv=Math.max(2,zoneLv(P.x,P.y)+ri(-1,1)),id=wildSpecies();SV.seen[id]=SV.seen[id]||1;await battle([mk(id,lv)],false)}
async function bossFight(){if(SV.beaten===SV.zone){return}state='enc';sfx.enc();flash=1;await wait(650);const L=Math.max(...SV.owned.map(c=>c.lv))+1,team=[mk(ri(11,13),L),mk(ri(6,10),L+1),mk(ri(14,15),L+2)];team.forEach(c=>SV.seen[c.id]=SV.seen[c.id]||1);await battle(team,true)}
