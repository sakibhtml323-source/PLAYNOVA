<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Cactus Guard #457</title><style>
body{margin:0;font-family:system-ui;background:#14532d;color:#f0fdf4;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#bbf7d0;font-size:.78rem}
canvas{background:#166534;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#14532d;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🌵 Desert Cactus Guard</h1><div class="sub">Hold to pour water — release in the green zone. Too much or too little and the cactus suffers!</div>
<div id="hud"><span>Health <b id="h">100</b></span><span>Round <b id="r">1</b></span><span>Perfect <b id="p">0</b></span></div>
<canvas id="cv" width="360" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">🌵</div><p>Hold to pour — the meter fills.<br>Release inside the GOLD zone!</p><button id="btn">Water</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=360,H=400;let health=100,round=1,perfect=0,water=0,holding=false,zs=0.3,zw=0.22,playing=true;
function newRound(){zs=0.15+Math.random()*0.55;zw=Math.max(0.08,0.24-round*0.01);
water=0;document.getElementById('r').textContent=round;draw();msg('Release in the gold zone!');}
cvs.addEventListener('pointerdown',()=>{if(!playing)return;holding=true;});
cvs.addEventListener('pointerup',()=>{if(!holding)return;holding=false;release();});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&playing)holding=true;});
document.addEventListener('keyup',e=>{if(e.code==='Space'){holding=false;release();}});
function step(){if(holding){water=Math.min(1,water+0.014);}
health=Math.max(0,health-0.06);
document.getElementById('h').textContent=Math.round(health);
if(health<=0){playing=false;beep(130,.35,'sawtooth');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🥀 The cactus withers!<br>Survived to round '+round;}}
function release(){if(water>=zs&&water<=zs+zw){perfect++;document.getElementById('p').textContent=perfect;
health=Math.min(100,health+8);beep(880,.25,'triangle');
msg('💧 Perfect! Round '+(round+1));round++;
document.getElementById('r').textContent=round;
setTimeout(newRound,800);}
else{health-=14;beep(150,.2,'sawtooth');
msg(water<zs?'🌵 Too little!':'🌊 Too much!');
if(health<=0){playing=false;
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🥀 The cactus withers!<br>Round '+round;}
water=0;}}
function draw(){ctx.fillStyle='#166534';ctx.fillRect(0,0,W,H);
// meter
ctx.fillStyle='#1f2937';ctx.fillRect(30,40,40,300);
ctx.fillStyle='#fbbf2455';ctx.fillRect(30,40+300*(1-zs-zw),40,300*zw);
ctx.fillStyle='#38bdf8';ctx.fillRect(30,40+300*(1-water),40,300*water);
// cactus
const hp=health/100;
ctx.font='70px serif';ctx.textAlign='center';
ctx.globalAlpha=0.4+0.6*hp;
ctx.fillText(hp>0.4?'🌵':'🥀',W/2+60,H/2+30);ctx.globalAlpha=1;
ctx.font='14px system-ui';
ctx.fillText('health '+Math.round(health),W/2+60,H/2+60);
if(playing){step();requestAnimationFrame(draw);}}
function msg(t){const el=document.createElement('div');
el.style.cssText='position:fixed;bottom:60px;left:50%;transform:translateX(-50%);color:#fbbf24;font-weight:700';
el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),1500);}
document.getElementById('btn').onclick=()=>{health=100;round=1;perfect=0;water=0;playing=true;
document.getElementById('h').textContent=100;document.getElementById('p').textContent=0;
document.getElementById('ov').style.display='none';
AU.__c=new (window.AudioContext||window.webkitAudioContext)();newRound();};
</script></body></html>
