<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haunted Attic Stack #453</title><style>
body{margin:0;font-family:system-ui;background:#18181b;color:#fafafa;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a1a1aa;font-size:.78rem}
canvas{background:#27272a;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#facc15}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#7c3aed;color:#fff;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>📦 Haunted Attic Stack</h1><div class="sub">Drop the swinging boxes BIGGEST-first — build a pyramid! Small boxes can't hold big ones.</div>
<div id="hud"><span>Stacked <b id="h">0</b></span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="400" height="440"></canvas>
<div id="ov"><div style="font-size:3rem">📦</div><p>Tap to drop — BIGGEST boxes at the bottom!<br>8 boxes make the pyramid.</p><button id="btn">Stack</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=400,H=440,BW=80,BH=22;let stack=[],sway=0,playing=false,best=+localStorage.getItem('has_best')||0;
document.getElementById('b').textContent=best;
let boxSizes=[4,4,3,3,2,2,1,1].sort(()=>Math.random()-.5);
cvs.addEventListener('pointerdown',()=>{if(!playing)return;
const sx=200+Math.sin(sway*0.05)*Math.max(30,140-stack.length*4);
const size=boxSizes[stack.length]||1;
const bw=BW*size/4;
const miss=Math.abs(sx-200);
if(stack.length>0&&size>stack[stack.length-1].size){topple();return;}
if(stack.length>2&&miss>30){topple();return;}
stack.push({x:sx,size});
beep(440+stack.length*25,.08);
document.getElementById('h').textContent=stack.length;
if(stack.length>best){best=stack.length;localStorage.setItem('has_best',best);document.getElementById('b').textContent=best;}
if(stack.length>=8){playing=false;beep(880,.3,'triangle');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🏠 Pyramid complete!';}});
function topple(){playing=false;beep(130,.35,'sawtooth');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='💥 Crashed at '+stack.length+'!';}
function draw(){ctx.fillStyle='#27272a';ctx.fillRect(0,0,W,H);
const baseY=H-36;
ctx.fillStyle='#3f3f46';ctx.fillRect(70,baseY,260,12);
stack.forEach((b,i)=>{const y=baseY-12-i*BH;
const cumSway=Math.sin(sway*0.03)*i*1.4;
const bw=BW*b.size/4;
ctx.save();ctx.translate(b.x+cumSway,y);ctx.rotate(cumSway*0.01);
ctx.fillStyle=['#57534e','#44403c','#52525b'][i%3];
ctx.fillRect(-bw/2,-BH+2,bw,BH-2);
ctx.strokeStyle='#713f12';ctx.strokeRect(-bw/2,-BH+2,bw,BH-2);
ctx.restore();});
if(playing){const sy=50;
const sx=200+Math.sin(sway*0.05)*Math.max(30,140-stack.length*4);
const size=boxSizes[stack.length]||1;
const bw=BW*size/4;
ctx.fillStyle='#6b7280';
ctx.fillRect(sx-bw/2,sy,bw,BH);
ctx.strokeStyle='#facc15';ctx.strokeRect(sx-bw/2,sy,bw,BH);
ctx.font='12px serif';ctx.textAlign='center';ctx.fillText('📦'.repeat(size),sx,sy-4);
requestAnimationFrame(tick);}}
function tick(){sway++;draw();}
document.getElementById('btn').onclick=()=>{stack=[];sway=0;
document.getElementById('h').textContent=0;
document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();};
</script></body></html>
