<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ninja Fog Walk #441</title><style>
body{margin:0;font-family:system-ui;background:#111827;color:#f9fafb;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#9ca3af;font-size:.78rem}
#grid{display:grid;grid-template-columns:repeat(6,56px);gap:4px;margin:12px}
.c{width:56px;height:56px;background:#1f2937;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer}
.c.pit{background:#0a0a0a}
.c.fog{background:#374151}
.c.me{background:#7c3aed;outline:2px solid #facc15}
.c.goal{background:#14532d}
#hud{display:flex;gap:14px;font-size:.9rem;margin:4px}#hud b{color:#facc15}
#msg{min-height:1.3em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#facc15;color:#111827;font-weight:700;cursor:pointer;margin:8px}
</style></head><body>
<h1>🌫️ Ninja Fog Walk</h1><div class="sub">Lightning flashes reveal the pits — walk through the fog from memory!</div>
<div id="hud"><span>Level <b id="l">1</b></span><span>Falls <b id="f">0</b>/3</span><span>⚡ <b id="t">6</b>s</span></div>
<div id="grid"></div><div id="msg"></div>
<button id="btn">🥷 New Mist</button>
<audio id="au"></audio>
<script>
"use strict";
const AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const N=6;let grid=[],me={r:0,c:0},goal={r:5,c:5},falls=0,level=1,phase='flash',t=0;
function gen(){grid=[];me={r:0,c:0};goal={r:5,c:5};falls=0;
for(let r=0;r<N;r++){const row=[];for(let c=0;c<N;c++)row.push(Math.random()<0.3);grid.push(row);}
grid[0][0]=false;grid[5][5]=false;
let pr=0,pc=0;
while(pr<5||pc<5){if(pr<5&&(pc>=5||Math.random()<0.5))pr++;else pc++;grid[pr][pc]=false;}
document.getElementById('l').textContent=level;document.getElementById('f').textContent=0;
phase='flash';t=Math.max(2,6-level);document.getElementById('t').textContent=t;
render();
setTimeout(()=>{phase='fog';render();msg('Walk from memory!');},t*1000);}
function render(){const g=document.getElementById('grid');g.innerHTML='';
for(let r=0;r<N;r++)for(let c=0;c<N;c++){const d=document.createElement('div');
const show=phase==='flash';
d.className='c'+(show?(grid[r][c]?' pit':'')+'':' fog');
if(r===me.r&&c===me.c){d.classList.add('me');d.textContent='🥷';}
else if(r===goal.r&&c===goal.c){d.classList.add('goal');d.textContent='🏯';}
else if(show&&grid[r][c])d.textContent='🕳️';
d.onclick=()=>{AU.__c=AU.__c||new (window.AudioContext||window.webkitAudioContext)();tap(r,c);};
g.appendChild(d);}}
function tap(r,c){if(phase!=='fog')return;
if(Math.abs(r-me.r)+Math.abs(c-me.c)!==1)return;
me={r,c};
if(grid[r][c]){falls++;document.getElementById('f').textContent=falls;
beep(150,.2,'sawtooth');msg('🕳️ You stumble into a pit!');
if(falls>=3){msg('💀 Lost in the fog forever…');phase='over';render();return;}
me={r:0,c:0};}
else beep(400,.04);
if(r===goal.r&&c===goal.c){phase='over';beep(880,.3,'triangle');
msg('🏯 Through the fog! Level '+(level+1));level++;
setTimeout(gen,1000);return;}
render();}
function msg(t){document.getElementById('msg').textContent=t;}
document.getElementById('btn').onclick=()=>{level=1;AU.__c=new (window.AudioContext||window.webkitAudioContext)();gen();};
gen();
</script></body></html>
