<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Memory Sequence: Isometric Edition</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(#1e1b4b,#312e81);font-family:Georgia,serif;color:#e0e7ff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px}
h1{font-size:1.1rem;color:#a5b4fc;padding:6px}
#hud{display:flex;gap:14px;font-size:.9rem;margin-bottom:10px}
#stage{width:440px;height:300px;position:relative;max-width:96vw}
.tile{position:absolute;width:74px;height:74px;border-radius:12px;background:#3730a3;border:2px solid #4f46e5;display:flex;align-items:center;justify-content:center;font-size:1.8rem;cursor:pointer;transition:all .2s}
.tile.lit{background:#818cf8;transform:scale(1.08);box-shadow:0 0 20px #818cf8}
.tile.wrong{background:#ef4444}
#msg{text-align:center;font-size:.9rem;color:#a5b4fc;margin:10px 0;min-height:1.6em}
#ov{position:fixed;inset:0;background:rgba(30,27,75,.98);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#e0e7ff;padding:20px;z-index:5}
button{background:#818cf8;border:none;color:#1e1b4b;font-family:inherit;font-weight:700;padding:12px 34px;border-radius:24px;font-size:1rem;cursor:pointer;margin-top:14px}
@media(max-width:460px){.tile{width:60px;height:60px;font-size:1.5rem}}
</style>
</head>
<body>
<h1>🔷 ISO MEMORY SEQUENCE</h1>
<div id="hud"><span>Level <b id="l">1</b></span><span>Streak <b id="st">0</b></span><span>Best <b id="b">1</b></span></div>
<div id="stage"></div>
<div id="msg">Watch the iso tiles light up… then repeat!</div>
<div id="ov"><h2 style="color:#a5b4fc">ISOMETRIC MEMORY</h2><p id="od">A floating grid of iso tiles! Watch the sequence, tap it back in order. Each level adds a tile. The iso perspective makes it trickier!</p><button id="btn">ASCEND</button></div>
<script>
"use strict";
const ICONS=['🧊','🔥','🌟','🌿','💧','⚡','🪨','🌙'];
const POS=[[20,20],[130,20],[240,20],[350,20],[75,110],[185,110],[295,110],[75,200],[295,200]];
let seq,inp,playing,level,streak,best=+localStorage.getItem('im_best')||1;
document.getElementById('b').textContent=best;
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.08,t='sine'){const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=.09;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
function render(litIdx){const s=document.getElementById('stage');s.innerHTML='';
ICONS.forEach((ic,i)=>{const d=document.createElement('div');d.className='tile'+(litIdx===i?' lit':'');
d.style.left=POS[i][0]+'px';d.style.top=POS[i][1]+'px';d.style.transform='skewY(-6deg)';
d.textContent=ic;d.onclick=()=>pick(i);s.appendChild(d);});
document.getElementById('l').textContent=level;document.getElementById('st').textContent=streak;}
function show(){seq=[];for(let i=0;i<level+2;i++)seq.push((Math.random()*9)|0);inp=[];playing=false;
document.getElementById('msg').textContent='Watch…';
let i=0;const iv=setInterval(()=>{
if(i>=seq.length){clearInterval(iv);render(-1);playing=true;
document.getElementById('msg').textContent='Your turn!';return;}
{const k=i;setTimeout(()=>{render(seq[k]);beep(400+seq[k]*60,.15,'triangle');},60);} i++; /* FIX (PLAYNOVA repair): i was already incremented when the timer fired, so the wrong item was shown and the last one was undefined */},680);}
function pick(i){if(!playing)return;audio.resume();
const idx=inp.length;
if(seq[idx]!==i){streak=0;beep(150,.2,'sawtooth');
document.getElementById('msg').textContent='✗ Sequence broken! (level '+level+')';
if(level>best){best=level;localStorage.setItem('im_best',best);document.getElementById('b').textContent=best;}
playing=false;
document.getElementById('od').innerHTML='💔 <b>The iso sequence shatters at level '+level+'.</b>';
document.getElementById('btn').textContent='REBUILD';document.getElementById('ov').style.display='flex';return;}
inp.push(i);beep(600+i*50,.09,'triangle');render(-1);
if(inp.length>=seq.length){streak++;if(level+1>best){best=level+1;localStorage.setItem('im_best',best);document.getElementById('b').textContent=best;}
level++;document.getElementById('msg').textContent='✓ Perfect! Level '+level+'…';
setTimeout(show,800);}}
window.addEventListener('keydown',e=>{if(!playing)return;if(e.key>='1'&&e.key<='9')pick(+e.key-1);});
document.getElementById('btn').onclick=()=>{audio.resume();level=1;streak=0;document.getElementById('ov').style.display='none';show();};
</script>
</body>
</html>
