<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Glassmorphism Realm</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(135deg,#667eea,#764ba2,#f093fb);font-family:Georgia,serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px}
h1{font-size:1.15rem;color:#fff;padding:6px;text-shadow:0 2px 8px rgba(0,0,0,.3)}
#hud{display:flex;gap:14px;font-size:.9rem;margin-bottom:12px;color:#fff}
#grid{display:grid;grid-template-columns:repeat(3,92px);gap:12px;touch-action:none}
.pane{width:92px;height:92px;border-radius:18px;background:rgba(255,255,255,.18);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-size:2rem;cursor:pointer;transition:all .2s}
.pane.lit{background:rgba(255,255,255,.7);transform:scale(1.06)}
.pane.wrong{background:rgba(239,68,68,.5)}
#msg{text-align:center;font-size:.9rem;color:rgba(255,255,255,.9);margin:14px 0;min-height:1.6em}
#ov{position:fixed;inset:0;background:rgba(102,126,234,.95);backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:20px;z-index:5}
button{background:rgba(255,255,255,.92);color:#667eea;border:none;font-weight:700;padding:12px 36px;border-radius:26px;font-size:1rem;cursor:pointer;margin-top:14px}
@media(max-width:340px){#grid{grid-template-columns:repeat(3,74px)}.pane{width:74px;height:74px;font-size:1.6rem}}
</style>
</head>
<body>
<h1>🔮 GLASSMORPHISM REALM</h1>
<div id="hud"><span>Level <b id="l">1</b></span><span>Streak <b id="st">0</b></span><span>Best <b id="b">1</b></span></div>
<div id="grid"></div>
<div id="msg">Watch the panes light up… then repeat it BACKWARDS!</div>
<div id="ov"><h2>THE GLASS REALM</h2><p id="od">A memory of frosted glass! Watch the sequence of lit panes, then tap them in REVERSE order (last pane first). Each level adds one more pane. How deep does your memory go?</p><button id="btn">ENTER THE REALM</button></div>
<script>
"use strict";
const ICONS=['🌙','⭐','🌸','🔮','💎','🌊','🔥','🍃','⚡'];
let seq,inp,playing,level,streak,best=+localStorage.getItem('gr_best')||1;
document.getElementById('b').textContent=best;
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.08,t='sine'){const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=.09;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
function buildSeq(){seq=[];for(let i=0;i<level+2;i++)seq.push((Math.random()*9)|0);}
function render(litIdx){const g=document.getElementById('grid');g.innerHTML='';
ICONS.forEach((ic,i)=>{const d=document.createElement('div');d.className='pane'+(litIdx===i?' lit':'');
d.textContent=ic;d.onclick=()=>pick(i);g.appendChild(d);});
document.getElementById('l').textContent=level;document.getElementById('st').textContent=streak;}
function show(){buildSeq();playing=false;
document.getElementById('msg').textContent='Watch…';
let i=0;const iv=setInterval(()=>{
if(i>=seq.length){clearInterval(iv);render(-1);playing=true;
document.getElementById('msg').textContent='Your turn — BACKWARDS!';inp=[];return;}
{const k=i;setTimeout(()=>{render(seq[k]);beep(400+seq[k]*60,.15,'triangle');},60);} i++; /* FIX (PLAYNOVA repair): i was already incremented when the timer fired, so the wrong item was shown and the last one was undefined */},650);}
function pick(i){if(!playing)return;audio.resume();
const idx=inp.length;
if(seq[seq.length-1-idx]!==i){streak=0;beep(150,.2,'sawtooth');
document.getElementById('msg').textContent='✗ The realm shatters! (level '+level+')';
const g=document.getElementById('grid').children[i];g.classList.add('wrong');
if(level>best){best=level;localStorage.setItem('gr_best',best);document.getElementById('b').textContent=best;}
playing=false;
document.getElementById('od').innerHTML='💔 <b>The glass realm shatters at level '+level+'.</b>';
document.getElementById('btn').textContent='REBUILD';document.getElementById('ov').style.display='flex';return;}
inp.push(i);beep(600+i*50,.09,'triangle');render(-1);
if(inp.length>=seq.length){streak++;if(level+1>best){best=level+1;localStorage.setItem('gr_best',best);document.getElementById('b').textContent=best;}
level++;document.getElementById('msg').textContent='✓ Perfect! Level '+level+'…';
setTimeout(show,800);}}
window.addEventListener('keydown',e=>{if(!playing)return;if(e.key>='1'&&e.key<='9')pick(+e.key-1);});
document.getElementById('btn').onclick=()=>{audio.resume();level=1;streak=0;document.getElementById('ov').style.display='none';show();};
</script>
</body>
</html>
