<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Watercolor Physics Sandbox</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#fdf4ff;font-family:Georgia,serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden}
h1{font-size:1.05rem;color:#7c3aed;padding:8px}
#tools{display:flex;gap:8px;margin:6px;flex-wrap:wrap;justify-content:center}
#tools button{border:1px solid #d8b4fe;background:#fff;border-radius:20px;padding:6px 14px;cursor:pointer;font-size:.85rem;color:#7c3aed}
#tools button.sel{background:#7c3aed;color:#fff;border-color:#7c3aed}
canvas{background:#fff;border-top:1px solid #e9d5ff;touch-action:none;cursor:crosshair}
#tip{font-size:.75rem;color:#a855f7;padding:4px}
#ov{position:fixed;inset:0;background:rgba(253,244,255,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#581c87;padding:20px;z-index:5}
button.big{background:#7c3aed;color:#fff;border:none;font-weight:700;padding:12px 34px;border-radius:24px;font-size:1rem;cursor:pointer;margin-top:14px}
</style>
</head>
<body>
<h1>🎨 WATERCOLOR PHYSICS</h1>
<div id="tools">
<button class="sel" data-m="drop">💧 Drop</button><button data-m="blob">🟣 Blob</button>
<button data-m="wall">▬ Wall</button><button data-m="erase">✖ Erase</button>
<button id="grav">🌍 Gravity: ON</button><button id="clear">↺ Clear</button>
</div>
<canvas id="c"></canvas>
<div id="tip">Tap to paint with physics! Watercolor drops bleed and blend.</div>
<div id="ov"><h1 style="font-size:1.3rem;color:#7c3aed">WATERCOLOR PHYSICS</h1><p id="od">A liquid painting sandbox! Drops fall and bleed, blobs wobble, walls stand. Turn gravity off to paint floating nebulas. Autosaves your masterpiece.</p><button class="big" id="btn">WET THE CANVAS</button></div>
<script>
"use strict";
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
let W=innerWidth,H=innerHeight-100;
cvs.width=W;cvs.height=H;
let bodies=[],mode='drop',gravity=true;
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.04){const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.value=.05;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
document.querySelectorAll('#tools [data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('#tools [data-m]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');});
document.getElementById('grav').onclick=e=>{gravity=!gravity;e.target.textContent='🌍 Gravity: '+(gravity?'ON':'OFF');};
document.getElementById('clear').onclick=()=>{bodies=[];localStorage.removeItem('wp2_save');};
function resize(){W=innerWidth;H=Math.max(200,innerHeight-100);cvs.width=W;cvs.height=H;}
window.addEventListener('resize',resize);
function pos(e){const r=cvs.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
cvs.addEventListener('pointerdown',e=>{audio.resume();const p=pos(e);
if(mode==='drop'){bodies.push({t:'d',x:p.x,y:p.y,vx:(Math.random()-.5)*2,vy:0,r:4+Math.random()*6,
c:'hsl('+((Math.random()*360)|0)+',70%,60%)',life:400});beep(500+Math.random()*300);}
else if(mode==='blob'){bodies.push({t:'b',x:p.x,y:p.y,vx:0,vy:0,r:10+Math.random()*16,
c:'hsl('+((Math.random()*360)|0)+',70%,55%)',ph:Math.random()*7});beep(400);}
else if(mode==='wall'){bodies.push({t:'w',x:p.x-20,y:p.y-8,w:40,h:16});beep(300);}
else if(mode==='erase'){bodies=bodies.filter(b=>{if(b.t==='w')return !(p.x>b.x&&p.x<b.x+b.w&&p.y>b.y&&p.y<b.y+b.h);
return Math.hypot(b.x-p.x,b.y-p.y)>(b.r||30);});}
save();});
function save(){try{localStorage.setItem('wp2_save',JSON.stringify(bodies.slice(-140)));}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem('wp2_save'));if(d)bodies=d;}catch(e){}}
load();
function step(){bodies.forEach(b=>{
if(b.t==='w')return;
if(b.t==='d'){b.vy+=gravity?0.12:0;b.x+=b.vx;b.y+=b.vy;b.r+=0.06;b.life--;
if(b.y>H-b.r/2||b.life<=0)bodies.splice(bodies.indexOf(b),1);}
else if(b.t==='b'){b.ph+=0.03;b.x+=Math.sin(b.ph)*0.3;b.y+=Math.cos(b.ph*0.7)*0.3;
if(gravity)b.y+=0.02;b.r+=Math.sin(b.ph*2)*0.02;
b.x=Math.max(b.r,Math.min(W-b.r,b.x));b.y=Math.max(b.r,Math.min(H-b.r,b.y));}});}
function draw(){ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
bodies.forEach(b=>{
if(b.t==='w'){ctx.fillStyle='#d8b4fe';ctx.fillRect(b.x,b.y,b.w,b.h);return;}
const alpha=b.t==='d'?Math.max(0,b.life/400)*0.5:0.4;
const g2=ctx.createRadialGradient(b.x,b.y,1,b.x,b.y,b.r*2.2);
g2.addColorStop(0,b.c);g2.addColorStop(1,(b.c.indexOf('hsl(')===0)?b.c.replace('hsl(','hsla(').replace(/\)$/,',0)'):b.c+'00'); /* FIX (PLAYNOVA repair): hsl(..)+'00' is not a valid colour and threw on every frame */
ctx.globalAlpha=alpha;ctx.fillStyle=g2;
ctx.beginPath();ctx.arc(b.x,b.y,b.r*2.2,0,7);ctx.fill();ctx.globalAlpha=1;});}
function loop(){step();draw();requestAnimationFrame(loop);}
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();
if(k==='d')document.querySelector('[data-m=drop]').click();
if(k==='b')document.querySelector('[data-m=blob]').click();
if(k==='w')document.querySelector('[data-m=wall]').click();
if(k==='e')document.querySelector('[data-m=erase]').click();
if(k==='g')document.getElementById('grav').click();
if(k==='c')document.getElementById('clear').click();});
document.getElementById('btn').onclick=()=>{audio.resume();document.getElementById('ov').style.display='none';};
loop();
</script>
</body>
</html>
