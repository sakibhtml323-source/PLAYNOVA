<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cosmic Magic Riddle Solver</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse at top,#1e1b4b,#0f0f23);font-family:Georgia,serif;color:#c7d2fe;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px}
h1{font-size:1.15rem;color:#a78bfa;padding:6px;letter-spacing:1px}
#hud{display:flex;gap:14px;font-size:.9rem;margin-bottom:10px}
#card{width:min(540px,96vw);background:#0f0f23ee;border:1px solid #4c1d95;border-radius:16px;padding:18px;text-align:center}
#rid{font-size:1.15rem;line-height:1.6;margin:10px 0;min-height:3em}
#inp{width:100%;padding:12px;border:1px solid #4c1d95;border-radius:10px;background:#0f0f10;color:#fafafa;font-size:1.05rem;font-family:inherit;text-align:center;outline:none}
#inp:focus{border-color:#a78bfa}
#opts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
#opts button{background:#1e1b4b;color:#c7d2fe;border:1px solid #4c1d95;border-radius:10px;padding:10px 18px;cursor:pointer;font-family:inherit;font-size:.95rem}
#opts button:hover{border-color:#a78bfa}
#fb{min-height:1.6em;margin-top:10px;font-weight:600}
#heat{width:100%;height:6px;background:#27272a;border-radius:3px;margin-top:10px;overflow:hidden}
#heat i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#eab308,#ef4444)}
#ov{position:fixed;inset:0;background:rgba(15,15,35,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#c7d2fe;padding:20px;z-index:5}
button.big{background:#7c3aed;color:#fff;border:none;font-family:inherit;font-weight:700;padding:12px 34px;border-radius:24px;font-size:1rem;cursor:pointer;margin-top:14px}
@media(max-width:480px){#rid{font-size:1rem}}
</style>
</head>
<body>
<h1>🌌 COSMIC RIDDLE SOLVER</h1>
<div id="hud"><span>Riddle <b id="n">1</b>/10</span><span>Solved <b id="c">0</b></span><span>Void heat <b id="hd">0</b>%</span><span>Best <b id="b">0</b></span></div>
<div id="card">
<div id="rid">The void awaits your mind…</div>
<input id="inp" placeholder="Type your answer…" autocomplete="off">
<div id="opts"></div>
<div id="fb"></div>
<div id="heat"><i id="hb" style="width:0%"></i></div>
</div>
<div id="ov"><h2 style="color:#a78bfa">TEN VOID RIDDLES</h2><p id="od">Answer from memory — type or tap. Wrong answers feed the void's heat (+10%). At 100%, the cosmos swallows you. Solve all 10 to claim the star-hoard!</p><button class="big" id="btn">FACE THE VOID</button></div>
<script>
"use strict";
const RID=[
['I have cities but no houses, rivers but no water. What am I?',['map','a map']],
['The more you share me, the more I grow. What am I?',['love','knowledge','happiness']],
['I am always in front of you but cannot be seen.',['future','the future']],
['What has a neck but no head?',['bottle','a bottle']],
['What gets bigger the more you take away?',['hole','a hole']],
['What can fill a room but takes up no space?',['light','darkness']],
['What has a heart of stone and moves without feet?',['planet','a planet','earth','the earth']],
['I speak in silence and fall without sound.',['snow','rain','leaves']],
['What is always coming but never arrives?',['tomorrow']],
['What has one eye but cannot see?',['needle','a needle','storm']]];
let idx,solved,heat,playing,best=+localStorage.getItem('cr_best')||0;
document.getElementById('b').textContent=best;
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.08,t='sine'){const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=.09;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
const inp=document.getElementById('inp');
function ask(){if(idx>=10)return win();
const r=RID[idx];document.getElementById('n').textContent=idx+1;
document.getElementById('rid').textContent='"'+r[0]+'"';
const o=document.getElementById('opts');o.innerHTML='';
const wrongs=RID.filter((_,i)=>i!==idx).map(x=>x[1][0]).sort(()=>Math.random()-.5).slice(0,2);
const opts=[...wrongs,r[1][0]].sort(()=>Math.random()-.5);
opts.forEach(a2=>{const b=document.createElement('button');b.textContent=a2;
b.onclick=()=>submit(a2);o.appendChild(b);});
inp.value='';inp.focus();document.getElementById('fb').textContent='';}
function submit(ans){const r=RID[idx];const ok=r[1].includes(ans.trim().toLowerCase());
if(ok){solved++;document.getElementById('c').textContent=solved;beep(660,.12,'triangle');document.getElementById('fb').textContent='✓ The void nods. Correct!';document.getElementById('fb').style.color='#4ade80';}
else{heat+=10;document.getElementById('hd').textContent=heat;document.getElementById('hb').style.width=heat+'%';
beep(140,.2,'sawtooth');document.getElementById('fb').textContent='✗ Wrong! The void hungers… (+10%)';document.getElementById('fb').style.color='#f87171';
if(heat>=100)return swallowed();}
idx++;setTimeout(ask,900);}
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&inp.value.trim())submit(inp.value);});
function win(){playing=false;if(solved>best){best=solved;localStorage.setItem('cr_best',best);document.getElementById('b').textContent=best;}
const r=solved>=10?'🌟 VOIDWALKER':solved>=7?'☄️ STAR MIND':solved>=4?'🪐 ORBITER':'🕳️ LOST';
document.getElementById('od').innerHTML='🌌 <b style="color:#fde047">THE VOID BOWS.</b><br>You solved <b style="font-size:1.4rem">'+solved+'/10</b> riddles.<br>'+r;
document.getElementById('btn').textContent='CHALLENGE AGAIN';document.getElementById('ov').style.display='flex';
beep(880,.25,'triangle');setTimeout(()=>beep(1175,.25,'triangle'),200);}
function swallowed(){playing=false;beep(80,.6,'sawtooth');
document.getElementById('od').innerHTML='🕳️ <b style="color:#ef4444">SWALLOWED BY THE VOID.</b><br>Solved before the end: '+solved+'/10.';
document.getElementById('btn').textContent='RE-EMERGE';document.getElementById('ov').style.display='flex';}
document.getElementById('btn').onclick=()=>{audio.resume();idx=0;solved=0;heat=0;playing=true;
document.getElementById('c').textContent=0;document.getElementById('hd').textContent=0;document.getElementById('hb').style.width='0%';
document.getElementById('ov').style.display='none';ask();};
</script>
</body>
</html>
