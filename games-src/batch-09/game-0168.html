<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Overtime Trivia #168</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(#f0fdf4,#dcfce7);font-family:Georgia,serif;color:#14532d;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px}
h1{font-size:1.15rem;color:#16a34a;padding:6px}
#hud{display:flex;gap:14px;font-size:.9rem;margin-bottom:12px}
#q{font-size:1.25rem;text-align:center;margin:14px 0;min-height:2.4em;line-height:1.5}
#opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(480px,94vw)}
#opts button{background:#fff;border:3px solid #86efac;border-radius:14px;padding:14px;font-family:inherit;font-size:.95rem;cursor:pointer;color:#14532d}
#opts button:hover{background:#f0fdf4}
#opts button.ok{background:#bbf7d0;border-color:#16a34a}
#opts button.bad{background:#fecaca;border-color:#dc2626}
#fb{text-align:center;min-height:1.6em;margin-top:12px;font-weight:700}
#ov{position:fixed;inset:0;background:rgba(240,253,244,.98);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#14532d;padding:20px;z-index:5}
button.big{background:#16a34a;color:#fff;border:none;font-family:inherit;font-weight:700;padding:12px 36px;border-radius:24px;font-size:1rem;cursor:pointer;margin-top:14px}
</style>
</head>
<body>
<h1>🏆 SPORTS HERO</h1>
<div id="hud"><span>Question <b id="n">1</b>/12</span><span>Score <b id="sc">0</b></span><span>⏱ <b id="t">15</b>s</span><span id="ot" style="color:#f59e0b;font-weight:700"></span><span>Best <b id="b">0</b></span></div>
<div id="q">Prove you're the hero of the arena!</div>
<div id="opts"></div>
<div id="fb"></div>
<div id="ov"><h2 style="color:#16a34a">SPORTS HERO</h2><p id="od">12 questions of sporting glory! Answer before the whistle — every second counts for bonus points. Claim the golden boot!</p><button class="big" id="btn">TAKE THE FIELD</button></div>
<script>

"use strict";
const QS=[
{q:'How many players per football (soccer) team on the pitch?',o:['10','11','12','9'],a:1},
{q:'A basketball hoop is how high?',o:['9 ft','10 ft','11 ft','12 ft'],a:1},
{q:'In tennis, "love" means…?',o:['15','30','0','40'],a:2},
{q:'The Olympics are held every…?',o:['2 years','3 years','4 years','5 years'],a:2},
{q:'How many rings on the Olympic flag?',o:['4','5','6','7'],a:1},
{q:'A marathon is approximately…?',o:['26 miles','20 miles','30 miles','15 miles'],a:0},
{q:'In golf, scoring one under par is a…?',o:['Eagle','Birdie','Bogey','Albatross'],a:1},
{q:'Which sport uses a shuttlecock?',o:['Tennis','Squash','Badminton','Table tennis'],a:2},
{q:'How many points for a touchdown in American football?',o:['5','6','7','8'],a:1},
{q:'The Tour de France is a…?',o:['Running race','Swim race','Cycling race','Sailing race'],a:2},
{q:'In cricket, a "wicket" is…?',o:['A run','A dismissal/target','A ball','A player'],a:1},
{q:'Boxing rounds traditionally last…?',o:['2 minutes','3 minutes','5 minutes','4 minutes'],a:1}];
let idx,score,timer,playing,timeLeft,best=+localStorage.getItem('sh_best')||0;
document.getElementById('b').textContent=best;
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.07,t='sine'){const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=.09;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
const OT=3;
function ask(){if(idx>=12){if(idx<12+OT){/* overtime round: 5s each, worth double */
document.getElementById('ot').textContent='⚡ OT '+(idx-11)+'/'+OT+' (2× points, 5s)';
const q=QS[idx];document.getElementById('n').textContent=idx+1;document.getElementById('q').textContent='⚡ '+q.q;
const o=document.getElementById('opts');o.innerHTML='';
q.o.forEach((opt,i)=>{const b=document.createElement('button');b.textContent=opt;
b.onclick=()=>{clearInterval(timer);if(i===q.a){score+=100;document.getElementById('sc').textContent=score;beep(880,.12,'triangle');}else{beep(150,.2,'sawtooth');}
idx++;ask();};o.appendChild(b);});
timeLeft=5;document.getElementById('t').textContent=timeLeft;clearInterval(timer);
timer=setInterval(()=>{timeLeft--;document.getElementById('t').textContent=timeLeft;
if(timeLeft<=0){clearInterval(timer);idx++;ask();}},1000);return;}
return end();}
const PIC=[{q:'\ud83c\udfc0 \u2014 name the sport',o:['Basketball','Soccer','Tennis'],a:0},{q:'\ud83c\udfc6 \u2014 what do you win?',o:['A trophy','A medal','A cup'],a:0},{q:'\ud83c\udfb8 \u2014 name the instrument',o:['Guitar','Drum','Flute'],a:0}];
let q=QS[idx];
if((idx+1)%5===0){q=PIC[((((idx+1)/5)|0)-1)%3];}
document.getElementById('n').textContent=idx+1;document.getElementById('q').textContent=q.q;
const o=document.getElementById('opts');o.innerHTML='';
q.o.forEach((opt,i)=>{const b=document.createElement('button');b.textContent=opt;
b.onclick=()=>pick(i);o.appendChild(b);});
timeLeft=15;document.getElementById('t').textContent=timeLeft;clearInterval(timer);
if(idx>=12){/* overtime */return end();}
timer=setInterval(()=>{timeLeft--;document.getElementById('t').textContent=timeLeft;
if(timeLeft<=0){clearInterval(timer);
if(idx>=12){document.getElementById('fb').textContent='⏰ OT over!';end();return;}
skip();}},1000);}
function pick(i){clearInterval(timer);const q=QS[idx];
[...document.getElementById('opts').children].forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('ok');else if(j===i)b.classList.add('bad');});
if(i===q.a){score+=timeLeft*2;document.getElementById('sc').textContent=score;beep(660,.1,'triangle');
document.getElementById('fb').textContent='✓ GOAL! +'+timeLeft*2;document.getElementById('fb').style.color='#16a34a';}
else{beep(150,.2,'sawtooth');document.getElementById('fb').textContent='✗ The answer was: '+q.o[q.a];document.getElementById('fb').style.color='#dc2626';}
idx++;setTimeout(ask,1100);}
function skip(){const q=QS[idx];beep(140,.15,'sawtooth');
document.getElementById('fb').textContent='⏰ Whistle! It was: '+q.o[q.a];document.getElementById('fb').style.color='#dc2626';
idx++;setTimeout(ask,1100);}
function end(){playing=false;if(score>best){best=score;localStorage.setItem('sh_best',best);document.getElementById('b').textContent=best;}
const r=score>=200?'🏆 GOLDEN BOOT':score>=120?'🥇 ALL-STAR':score>=60?'🎽 ATHLETE':'🫧 WATER BOY';
document.getElementById('od').innerHTML=r+'<br>Score: <b style="font-size:1.5rem;color:#16a34a">'+score+'</b>';
document.getElementById('btn').textContent='REMATCH';document.getElementById('ov').style.display='flex';}
window.addEventListener('keydown',e=>{if(document.getElementById('ov').style.display==='flex')return;
if(e.key>='1'&&e.key<='4'){const b=document.querySelectorAll('#opts button')[+e.key-1];if(b&&!b.disabled)b.click();}});
document.getElementById('btn').onclick=()=>{audio.resume();idx=0;score=0;playing=true;
document.getElementById('sc').textContent=0;document.getElementById('fb').textContent='';
document.getElementById('ov').style.display='none';ask();};

</script>
</body>
</html>
