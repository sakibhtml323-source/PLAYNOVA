<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Cute Animals Rise</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(#fce7f3,#fbcfe8);font-family:Georgia,serif;color:#831843;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden}
h1{font-size:1.1rem;color:#be185d;padding:6px}
#hud{display:flex;gap:14px;font-size:.9rem;margin-bottom:4px}
canvas{background:#fdf2f8;border-radius:12px;touch-action:none}
#ov{position:fixed;inset:0;background:rgba(252,231,243,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#831843;padding:20px;z-index:5}
button{background:#ec4899;border:none;color:#fff;font-weight:800;padding:12px 32px;border-radius:24px;font-size:1rem;cursor:pointer;margin-top:14px}
</style>
</head>
<body>
<h1>🐱 CUTE ANIMALS RISE</h1>
<div id="hud"><span>Height <b id="h">0</b>m</span><span>❤️ <b id="hp">3</b></span><span>Combo <b id="cb">0</b></span><span>Best <b id="b">0</b>m</span></div>
<canvas id="c"></canvas>
<div id="ov"><h2 style="color:#be185d">KITTEN ASCENT</h2><p id="od">Help the kitten climb the endless cozy tower! Auto-jump — steer with ← → / A D or drag. Land on pillows, dodge the yarn spikes 🧶, grab 🐟 snacks. Falling to the bottom ends the climb!</p><button id="btn">PUURFECT START</button></div>
<script>


"use strict";
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');const W=360,H=480;cvs.width=W;cvs.height=H;
let plats=[],snacks=[],spikes=[],me={x:0,y:0,vy:0,onG:false},playing,keys,height,best=+localStorage.getItem('car_best')||0,camY;
document.getElementById('b').textContent=best;
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.06,t='square'){if(!playing)return;const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=.09;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
function resize(){const s=Math.min((window.innerWidth-12)/W,(window.innerHeight-140)/H);cvs.style.width=W*s+'px';cvs.style.height=H*s+'px';}
window.addEventListener('resize',resize);resize();
function init(){plats=[];snacks=[];spikes=[];me={x:W/2,y:0,vy:-6,onG:false};camY=0;height=0;keys={};playing=true;
for(let i=0;i<14;i++)addPlat(-i*38);
document.getElementById('h').textContent=0;document.getElementById('hp').textContent=3;document.getElementById('cb').textContent=0;}
function addPlat(y){const w=48+Math.random()*36;
plats.push({x:20+Math.random()*(W-40-w),y,w,h:10});
if(Math.random()<0.3)snacks.push({x:20+Math.random()*(W-40),y:y-30,got:false});
if(Math.random()<0.25)spikes.push({x:20+Math.random()*(W-40),y:y-14});}
window.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let drag=null;
cvs.addEventListener('pointerdown',e=>{audio.resume();const r=cvs.getBoundingClientRect();drag=(e.clientX-r.left)/r.width*W;});
cvs.addEventListener('pointermove',e=>{if(drag===null)return;const r=cvs.getBoundingClientRect();drag=(e.clientX-r.left)/r.width*W;});
window.addEventListener('pointerup',()=>drag=null);
function step(){const sp=3.6;
if(keys['arrowleft']||keys['a'])me.x-=sp;if(keys['arrowright']||keys['d'])me.x+=sp;
if(drag!==null)me.x+=(drag-me.x)*0.2;
me.vy+=0.42;me.y+=me.vy;
me.x=Math.max(10,Math.min(W-10,me.x));
if(me.vy>0){plats.forEach(p=>{if(me.x>p.x-4&&me.x<p.x+p.w+4&&me.y>p.y-2&&me.y<p.y+10){me.y=p.y;me.vy=-8.6;beep(440,.05);}});}
height=Math.max(height,-me.y/10);document.getElementById('h').textContent=Math.floor(height);
camY=Math.min(camY,me.y-H/2);
plats=plats.filter(p=>p.y<me.y+H);snacks=snacks.filter(g=>g.y<me.y+H);spikes=spikes.filter(s=>s.y<me.y+H);
while(plats.length<14){const top=Math.min(...plats.map(p=>p.y));addPlat(top-34-Math.random()*22);}
snacks.forEach(g=>{if(!g.got&&Math.hypot(g.x-me.x,g.y-me.y)<18){g.got=true;document.getElementById('cb').textContent=+document.getElementById('cb').textContent+1;beep(900,.06);}});
spikes.forEach(s=>{if(Math.abs(s.x-me.x)<12&&Math.abs(s.y-me.y)<14){me.vy=-7;hit();}});}
function hit(){const h=+document.getElementById('hp').textContent-1;document.getElementById('hp').textContent=h;beep(140,.2,'sawtooth');
if(h<=0)die();}
function die(){playing=false;const ht=Math.floor(height);
if(ht>best){best=ht;localStorage.setItem('car_best',best);document.getElementById('b').textContent=best;}
document.getElementById('od').innerHTML='The kitten tumbles at <b style="color:#be185d">'+ht+'m</b>!';
document.getElementById('btn').textContent='NINE MORE LIVES';document.getElementById('ov').style.display='flex';beep(110,.5,'sawtooth');}
function draw(){ctx.fillStyle='#fdf2f8';ctx.fillRect(0,0,W,H);
ctx.strokeStyle='#fbcfe855';for(let y=0;y<H;y+=20)ctx.strokeRect(0,y,W,1);
const off=-camY;
plats.forEach(p=>{ctx.fillStyle='#f9a8d4';ctx.fillRect(p.x,p.y+off,p.w,p.h);
ctx.fillStyle='#be185d';ctx.fillRect(p.x,p.y+off,p.w,3);});
snacks.forEach(g=>{if(!g.got){ctx.fillStyle='#67e8f9';ctx.fillRect(g.x-5,g.y+off-5,10,10);}});
spikes.forEach(s=>{ctx.fillStyle='#e11d48';ctx.beginPath();ctx.moveTo(s.x-10,s.y+off);ctx.lineTo(s.x,s.y+off-14);ctx.lineTo(s.x+10,s.y+off);ctx.fill();});
// kitten
ctx.fillStyle='#fdba74';ctx.fillRect(me.x-8,me.y+off-16,16,16);
ctx.fillStyle='#f9a8d4';ctx.fillRect(me.x-8,me.y+off-16,16,5);
ctx.fillStyle='#111';ctx.fillRect(me.x-4,me.y+off-12,3,3);ctx.fillRect(me.x+2,me.y+off-12,3,3);
ctx.fillStyle='#fdba74';ctx.fillRect(me.x-10,me.y+off-20,4,6);ctx.fillRect(me.x+6,me.y+off-20,4,6);
ctx.fillStyle='#e11d4888';ctx.fillRect(0,H-8+Math.min(0,me.y+off-H+80),W,8);}
function loop(){if(playing){step();if(me.y-camY>H+60)die();}draw();requestAnimationFrame(loop);}
document.getElementById('btn').onclick=()=>{audio.resume();init();document.getElementById('ov').style.display='none';};
loop();


</script>
</body>
</html>
