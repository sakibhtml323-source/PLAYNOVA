<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Gravity Flip #240</title><style>
body{margin:0;font-family:system-ui;background:#1c1917;color:#fafaf9;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a8a29e;font-size:.78rem}
canvas{background:#292524;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}
#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#1c1917;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🌵 Desert Gravity Flip</h1><div class="sub">Tap to flip gravity — run on floor OR ceiling. Dodge obstacles on both!</div>
<div id="hud"><span>Dist <b id="d">0</b>m</span><span>Flips <b id="f">0</b></span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="480" height="280"></canvas>
<div id="ov"><div style="font-size:3rem">🌵</div><p>Tap/Space to flip gravity.<br>Obstacles on floor AND ceiling!</p><button id="btn">Run</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=480,H=280,GY=H-46,CY=46;
let me={y:GY,vy:0,g:1},obs=[],dist=0,flips=0,playing=false,spawnT=0,best=+localStorage.getItem('gf_best')||0;
document.getElementById('b').textContent=best;
function spawn(){const onFloor=Math.random()<0.5;
obs.push({x:W+30,y:onFloor?GY-6:CY-18,w:22,h:onFloor?24:24,e:onFloor?'🌵':'🦅'});}
function flip(){if(!playing)return;me.g*=-1;flips++;document.getElementById('f').textContent=flips;beep(600,.07,'triangle');}
cvs.addEventListener('pointerdown',flip);
document.addEventListener('keydown',e=>{if(e.code==='Space')flip();});
function hit(a,b){return a.x<b.x+b.w&&a.x+24>b.x&&a.y<b.y+b.h&&a.y+28>b.y;}
function step(){dist+=0.08;
me.vy+=me.g*0.8;me.y+=me.vy;
if(me.g===1&&me.y>=GY){me.y=GY;me.vy=0;}
if(me.g===-1&&me.y<=CY){me.y=CY;me.vy=0;}
spawnT++;if(spawnT>Math.max(38,80-dist*0.02)){spawnT=0;spawn();}
obs.forEach(o=>{o.x-=4.6+dist*0.002;});
obs=obs.filter(o=>o.x>-50);
obs.forEach(o=>{if(hit({x:70,y:me.y-24,w:24,h:24},o))die();});}
function die(){if(!playing)return;playing=false;beep(130,.35,'sawtooth');
const d=Math.floor(dist);if(d>best){best=d;localStorage.setItem('gf_best',best);document.getElementById('b').textContent=best;}
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='💀 Sandstorm got you!<br>Distance: <b style="color:#fbbf24">'+d+'m</b> · Flips: '+flips;}
function draw(){ctx.fillStyle='#292524';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#44403c';ctx.fillRect(0,GY+12,W,H-GY);
ctx.fillRect(0,0,W,CY-12);
// gravity portals visual
ctx.fillStyle=me.g===1?'#65a30d':'#a855f7';ctx.fillRect(0,me.g===1?GY+2:CY-14,W,4);
obs.forEach(o=>{ctx.font='24px serif';ctx.textAlign='center';ctx.fillText(o.e,o.x+o.w/2,o.y+o.h/2+8);});
ctx.font='28px serif';ctx.fillText('🏃',82,me.y+4);
document.getElementById('d').textContent=Math.floor(dist);
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{me={y:GY,vy:0,g:1};obs=[];dist=0;flips=0;spawnT=0;
document.getElementById('d').textContent=0;document.getElementById('f').textContent=0;
document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();};
</script></body></html>
