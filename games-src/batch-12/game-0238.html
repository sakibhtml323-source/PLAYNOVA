<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ninja Reaction #238</title><style>
body{margin:0;font-family:system-ui;background:#111827;color:#f9fafb;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#9ca3af;font-size:.78rem}
canvas{background:#1f2937;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}
#hud b{color:#facc15}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#facc15;color:#111827;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🎯 Ninja Reaction</h1><div class="sub">Targets shrink fast — tap them before they vanish. 3 misses and you're out!</div>
<div id="hud"><span>⏱️ <b id="t">30</b>s</span><span>Hits <b id="h">0</b></span><span>Misses <b id="x">0</b>/3</span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="400" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">🎯</div><p>Tap the shrinking targets.<br>Small targets = more points!</p><button id="btn">Start</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.06,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.1,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=400,H=400;
let tgt=null,time=30,hits=0,misses=0,playing=false,timer=null,spawnT=0,best=+localStorage.getItem('rx_best')||0;
document.getElementById('b').textContent=best;
function spawn(){const size=22+Math.random()*22;
tgt={x:40+Math.random()*(W-80),y:40+Math.random()*(H-80),r:size,max:size,life:1.6+Math.random()};}
function step(dt){if(tgt){tgt.r-=dt*14;tgt.life-=dt;
if(tgt.r<=0||tgt.life<=0){tgt=null;misses++;document.getElementById('x').textContent=misses;beep(150,.15,'sawtooth');
if(misses>=3)end();}}}
function tap(e){if(!playing||!tgt)return;const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
const d=Math.hypot(x-tgt.x,y-tgt.y);
if(d<=tgt.r+6){const pts=Math.round(30-tgt.r);hits+=pts;document.getElementById('h').textContent=hits;
beep(500+pts*20,.08,'triangle');tgt=null;}else{beep(200,.08,'sawtooth');}}
function end(){playing=false;clearInterval(timer);
if(hits>best){best=hits;localStorage.setItem('rx_best',best);document.getElementById('b').textContent=best;}
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='⏱️ Time! Score: <b style="color:#facc15">'+hits+'</b>';}
function draw(){ctx.fillStyle='#1f2937';ctx.fillRect(0,0,W,H);
if(tgt){const ratio=tgt.r/tgt.max;
ctx.beginPath();ctx.arc(tgt.x,tgt.y,tgt.r,0,7);
ctx.fillStyle=ratio>0.6?'#22c55e':ratio>0.3?'#f59e0b':'#ef4444';ctx.fill();
ctx.strokeStyle='#f9fafb';ctx.lineWidth=2;ctx.stroke();}
if(playing)requestAnimationFrame(draw);}
cvs.addEventListener('pointerdown',tap);
let last=0;
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
spawnT+=dt;if(spawnT>0.55){spawnT=0;if(!tgt)spawn();}
step(dt);draw();if(playing)requestAnimationFrame(loop);}
document.getElementById('btn').onclick=()=>{hits=0;misses=0;time=30;tgt=null;spawnT=0;
document.getElementById('h').textContent=0;document.getElementById('x').textContent=0;document.getElementById('t').textContent=30;
document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();
clearInterval(timer);timer=setInterval(()=>{time--;document.getElementById('t').textContent=time;if(time<=0)end();},1000);
requestAnimationFrame(loop);};
</script></body></html>
