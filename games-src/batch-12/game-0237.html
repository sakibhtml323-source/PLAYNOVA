<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Idle Pharaoh #237</title><style>
body{margin:0;font-family:system-ui;background:#1c1917;color:#fafaf9;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a8a29e;font-size:.78rem}
#c{font-size:2rem;font-weight:800;color:#fbbf24;margin:8px}
#r{color:#a8a29e;font-size:.85rem}
#tap{font-size:76px;cursor:pointer;user-select:none;margin:12px;transition:transform .08s}
#tap:active{transform:scale(.92)}
#mon{font-size:2.4rem;margin:4px;min-height:3rem}
#monBar{width:280px;max-width:90vw;height:10px;background:#292524;border-radius:5px;overflow:hidden;margin:4px}
#monBar i{display:block;height:100%;background:linear-gradient(90deg,#f59e0b,#fbbf24);width:0}
#shop{display:flex;flex-direction:column;gap:6px;width:300px;max-width:92vw;margin:8px}
.row{display:flex;justify-content:space-between;align-items:center;background:#292524;border-radius:10px;padding:8px 12px}
.row button{padding:6px 14px;border-radius:8px;border:none;background:#57534e;color:#fff;font-weight:700;cursor:pointer}
.row button:disabled{opacity:.4}
.row small{color:#a8a29e;display:block}
</style></head><body>
<h1>👑 Idle Pharaoh</h1><div class="sub">Collect gold — raise monuments to the gods!</div>
<div id="c">0</div><div id="r">0 per second</div>
<div id="tap">🪙</div>
<div id="mon">🏗️</div>
<div id="monBar"><i></i></div>
<div id="shop"></div>
<audio id="au"></audio>
<script>
"use strict";
const AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.1,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
let S={c:0,own:[0,0,0,0],pc:1,monument:0,progress:0};
const MON=[{e:'🦅',n:'Falcon Shrine',c:500},{e:'🐈',n:'Cat Temple',c:2500},{e:'🔺',n:'Pyramid of Khufu',c:12000},{e:'🦁',n:'Sphinx Monument',c:60000}];
const IT=[{n:'👷 Laborer',r:.8,c:20},{n:'⛏️ Quarryman',r:4,c:90},{n:'🏺 Artisan',r:18,c:400},{n:'📜 Scribe',r:80,c:1800}];
function rate(){return IT.reduce((a,v,i)=>a+v.r*S.own[i],0);}
function render(){document.getElementById('c').textContent=Math.floor(S.c);
document.getElementById('r').textContent=rate().toFixed(1)+' per second';
const mon=MON[S.monument];
if(mon){document.getElementById('mon').textContent=mon.e+' '+mon.n;
document.getElementById('monBar').querySelector('i').style.width=Math.min(100,S.progress/mon.c*100)+'%';}
else{document.getElementById('mon').textContent='🎉 All monuments raised!';document.getElementById('monBar').querySelector('i').style.width='100%';}
const sh=document.getElementById('shop');sh.innerHTML='';
IT.forEach((it,i)=>{const row=document.createElement('div');row.className='row';
const info=document.createElement('div');info.innerHTML='<b>'+it.n+'</b> <small>'+it.r+'/s each</small>';
const b=document.createElement('button');const cost=Math.round(it.c*Math.pow(1.18,S.own[i]));
b.textContent=cost+' 🪙';b.disabled=S.c<cost;
b.onclick=()=>{if(S.c>=cost){S.c-=cost;S.own[i]++;beep(660,.09);render();}};
row.appendChild(info);row.appendChild(b);sh.appendChild(row);});}
document.getElementById('tap').addEventListener('pointerdown',()=>{S.c+=S.pc;beep(500+Math.random()*200,.05);render();});
setInterval(()=>{const earn=rate()/10;S.c+=earn;
if(MON[S.monument]){S.progress+=earn;
if(S.progress>=MON[S.monument].c){beep(880,.25,'triangle');S.progress=0;S.monument++;}}
render();},100);
render();
</script></body></html>
