<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haunted Obby Run #230</title><style>
body{margin:0;font-family:system-ui;background:#111827;color:#f9fafb;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#9ca3af;font-size:.78rem}
canvas{background:#1f2937;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}
#hud b{color:#facc15}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#facc15;color:#111827;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🎃 Haunted Obby Run</h1><div class="sub">Space/tap to jump — dodge the haunted spikes and rolling pumpkins!</div>
<div id="hud"><span>Wave <b id="w">1</b></span><span>Time <b id="t">0.0</b>s</span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="480" height="280"></canvas>
<div id="ov"><div style="font-size:3rem">🎃</div><p>Jump over spikes and pumpkins.<br>Survive as long as you can!</p><button id="btn">Start Running</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=480,H=280,GY=H-50;
let me={x:80,y:GY,vy:0,onG:true},obs=[],time=0,wave=1,playing=false,spawnT=0,best=+localStorage.getItem('ob_best')||0;
document.getElementById('b').textContent=best;
function spawn(){const r=Math.random();let o;
if(r<0.45)o={x:W+30,y:GY,w:16,h:30+Math.random()*25,e:'🔺',type:'spike'};
else if(r<0.8)o={x:W+30,y:GY-8,w:26,h:26,e:'🎃',type:'roll',vx:-(2.2+wave*0.25+Math.random())};
else o={x:W+30,y:GY-44,w:20,h:20,e:'👻',type:'fly',ph:Math.random()*6};
obs.push(o);}
function jump(){if(!playing)return;if(me.onG){me.vy=-11.5;me.onG=false;beep(500,.07);}}
cvs.addEventListener('pointerdown',jump);
document.addEventListener('keydown',e=>{if(e.code==='Space')jump();});
function hit(a,b){return a.x<b.x+b.w&&a.x+26>b.x&&a.y<b.y+b.h&&a.y+32>b.y;}
function step(){time+=1/60;
spawnT++;if(spawnT>Math.max(50,110-wave*7)){spawnT=0;spawn();}
me.vy+=0.55;me.y+=me.vy;
if(me.y>=GY){me.y=GY;me.vy=0;me.onG=true;}
obs.forEach(o=>{if(o.type==='roll')o.x+=o.vx;if(o.type==='fly'){o.x-=2.6;o.y=GY-44+Math.sin(time*3+o.ph)*18;}else if(o.type==='spike')o.x-=4.2+wave*0.15;});
obs=obs.filter(o=>o.x>-60);
obs.forEach(o=>{if(hit({x:me.x,y:me.y-32,w:26,h:32},o))die();});
if(time>wave*12){wave++;document.getElementById('w').textContent=wave;}}
function die(){if(!playing)return;playing=false;beep(130,.35,'sawtooth');
const t=time.toFixed(1);if(time>best){best=time;localStorage.setItem('ob_best',best);document.getElementById('b').textContent=best.toFixed(1);}
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='💀 The haunted course claims you!<br>Survived: <b style="color:#facc15">'+t+'s</b> · Wave '+wave;}
function draw(){ctx.fillStyle='#1f2937';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#374151';ctx.fillRect(0,GY+2,W,H-GY);
ctx.font='30px serif';ctx.textAlign='center';ctx.fillText('🥷',me.x+13,me.y+4);
obs.forEach(o=>{ctx.font='26px serif';ctx.fillText(o.e,o.x+o.w/2,o.y+o.h/2+9);});
document.getElementById('t').textContent=time.toFixed(1);
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{me={x:80,y:GY,vy:0,onG:true};obs=[];time=0;wave=1;spawnT=0;
document.getElementById('w').textContent=1;document.getElementById('t').textContent='0.0';
document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();};
</script></body></html>
