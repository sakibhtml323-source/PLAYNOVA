<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crystal Match Blast #236</title><style>
body{margin:0;font-family:system-ui;background:#0f172a;color:#e2e8f0;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#94a3b8;font-size:.78rem}
#grid{display:grid;grid-template-columns:repeat(7,44px);gap:2px;margin:10px}
.g{width:44px;height:44px;background:#1e293b;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;user-select:none}
.g.sel{outline:2px solid #facc15}
#hud{display:flex;gap:14px;font-size:.9rem;margin:4px}
#hud b{color:#facc15}
#msg{min-height:1.3em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#7c3aed;color:#fff;font-weight:700;cursor:pointer;margin:8px}
</style></head><body>
<h1>💎 Crystal Match Blast</h1><div class="sub">Swap adjacent crystals — match 3+. Chain matches within 3s for combo multipliers!</div>
<div id="hud"><span>Score <b id="s">0</b></span><span>Combo <b id="c">×1</b></span><span>Moves <b id="m">30</b></span></div>
<div id="grid"></div><div id="msg"></div>
<button id="btn">💥 New Board</button>
<audio id="au"></audio>
<script>
function msg(t){document.getElementById('msg').textContent=t;} /* FIX (PLAYNOVA repair): was declared inside another function, so every other call failed with 'msg is not a function' */
"use strict";
const AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const R=7,C=7,GEMS=['💜','❤️','💙','💚','💛'];
let grid=[],sel=null,score=0,combo=1,comboTO=null,moves=30;
function build(){grid=[];for(let r=0;r<R;r++){const row=[];for(let c=0;c<C;c++)row.push((Math.random()*5)|0);grid.push(row);}
moves=30;score=0;combo=1;sel=null;
document.getElementById('s').textContent=0;document.getElementById('m').textContent=30;document.getElementById('c').textContent='×1';
render();msg('Swap two adjacent crystals!');}
function findMatches(){const m=new Set();
for(let r=0;r<R;r++){let run=1;for(let c=1;c<=C;c++){
if(c<C&&grid[r][c]===grid[r][c-1])run++;
else{if(run>=3)for(let k=c-run;k<c;k++)m.add(r*C+k);run=1;}}}
for(let c=0;c<C;c++){let run=1;for(let r=1;r<=R;r++){
if(r<R&&grid[r][c]===grid[r-1][c])run++;
else{if(run>=3)for(let k=r-run;k<r;k++)m.add(k*C+c);run=1;}}}
return m;}
function applyGravity(){for(let c=0;c<C;c++){let write=R-1;
for(let r=R-1;r>=0;r--){if(grid[r][c]!==null){grid[write][c]=grid[r][c];if(write!==r)grid[r][c]=null;write--;}}
for(let r=write;r>=0;r--)grid[r][c]=(Math.random()*5)|0;}}
function tap(r,c){if(moves<=0)return;
if(sel&&sel.r===r&&sel.c===c){sel=null;render();return;}
if(!sel){sel={r,c};render();return;}
const adj=Math.abs(sel.r-r)+Math.abs(sel.c-c)===1;
if(!adj){sel={r,c};render();return;}
const t=grid[sel.r][sel.c];grid[sel.r][sel.c]=grid[r][c];grid[r][c]=t;
const m=findMatches();
if(!m.size){grid[r][c]=grid[sel.r][sel.c];grid[sel.r][sel.c]=t;beep(160,.08,'sawtooth');sel=null;render();msg('No match — swap back!');return;}
moves--;document.getElementById('m').textContent=moves;
combo=comboTO?Math.min(combo+1,8):1;
clearTimeout(comboTO);comboTO=setTimeout(()=>{combo=1;document.getElementById('c').textContent='×1';},3000);
document.getElementById('c').textContent='×'+combo;
let gained=0,chain=true;
while(chain){const mm=findMatches();if(!mm.size)break;
gained+=mm.size*10*combo;
mm.forEach(i=>{grid[(i/C)|0][i%C]=null;});
applyGravity();}
score+=gained;document.getElementById('s').textContent=score;
beep(500+combo*80,.12,'triangle');msg('💥 +'+gained+'!');
sel=null;render();
if(moves<=0){msg('🏁 Final score: '+score+(score>=1000?' — Crystal Master!':''));beep(880,.25,'triangle');}}
function render(){const g=document.getElementById('grid');g.innerHTML='';
for(let r=0;r<R;r++)for(let c=0;c<C;c++){const d=document.createElement('div');
d.className='g'+(sel&&sel.r===r&&sel.c===c?' sel':'');
d.textContent=GEMS[grid[r][c]]||'';
d.onclick=()=>tap(r,c);g.appendChild(d);}}
document.getElementById('btn').onclick=()=>{AU.__c=new (window.AudioContext||window.webkitAudioContext)();build();};
build();
</script></body></html>
