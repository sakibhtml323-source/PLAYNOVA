<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ninja Coin Tower #225</title><style>
body{margin:0;font-family:system-ui;background:#0f172a;color:#f8fafc;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#94a3b8;font-size:.78rem}
canvas{background:#1e293b;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}
#hud b{color:#facc15}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#facc15;color:#0f172a;font-weight:700;cursor:pointer;margin:8px;font-size:1rem}
</style></head><body>
<h1>🪙 Ninja Coin Tower</h1><div class="sub">Tap to drop the coin on the swaying tower — keep the balance!</div>
<div id="hud"><span>Stack <b id="s">0</b></span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="400" height="480"></canvas>
<div id="ov"><div style="font-size:3rem">🪙</div><p>Coins swing left-right.<br>Tap anywhere to drop — stack as high as you can!</p><button id="btn">Start Stacking</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.08,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.12,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=400,H=480;const COINS=['🪙','🍥','⭐','🍡'];
let stack=[],sway=0,dropX=200,stackH=0,playing=false,best=+localStorage.getItem('ct2_best')||0;
document.getElementById('b').textContent=best;
function draw(){ctx.fillStyle='#1e293b';ctx.fillRect(0,0,W,H);
const baseY=H-40;
// pedestal
ctx.fillStyle='#475569';ctx.fillRect(120,baseY,160,12);
// stack
stack.forEach((c,i)=>{const y=baseY-12-i*14;
const off=Math.max(-30,Math.min(30,(c.x-200)*0.06*(i+1)*0.15));
ctx.font='20px serif';ctx.textAlign='center';ctx.fillText(c.e,200+off,y+8);});
// swinging coin
if(playing){const sy=60;const sx=200+Math.sin(sway*0.045)*(150-stackH*3);
ctx.font='24px serif';ctx.fillText(COINS[stack.length%4],sx,sy);
ctx.strokeStyle='#64748b';ctx.beginPath();ctx.moveTo(200,20);ctx.lineTo(sx,sy-12);ctx.stroke();}
if(playing)requestAnimationFrame(tick);}
function tick(){sway++;stackH=stack.length;draw();}
cvs.addEventListener('pointerdown',()=>{if(!playing)return;
const sx=200+Math.sin(sway*0.045)*(150-stack.length*3);
const wobble=Math.abs(sx-200);
if(wobble>62){fail();return;}
stack.push({x:sx,e:COINS[stack.length%4]});
beep(440+stack.length*30,.08,'triangle');
if(stack.length>best){best=stack.length;localStorage.setItem('ct2_best',best);document.getElementById('b').textContent=best;}
document.getElementById('s').textContent=stack.length;});
function fail(){playing=false;beep(130,.35,'sawtooth');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🌀 Tower toppled at <b style="color:#facc15">'+stack.length+'</b> coins!';}
document.getElementById('btn').onclick=()=>{stack=[];sway=0;document.getElementById('s').textContent=0;
document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();};
</script></body></html>
