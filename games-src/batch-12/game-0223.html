<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Egyptian Gate Traffic #223</title><style>
body{margin:0;font-family:system-ui;background:#1c1917;color:#fafaf9;display:flex;flex-direction:column;align-items:center}
h1{font-size:1.1rem;margin:10px 0 2px}
canvas{background:#292524;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.85rem;margin:6px}
#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
#btn{padding:12px 26px;border-radius:999px;border:none;background:#fbbf24;color:#1c1917;font-weight:700;font-size:1rem;cursor:pointer}
</style></head><body>
<h1>🏺 Egyptian Gate Traffic</h1>
<div id="hud"><span>Passed <b id="p">0</b></span><span>Crashes <b id="c">0</b></span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="420" height="420"></canvas>
<div id="ov"><div style="font-size:3rem">🏺</div><p>Tap the gate to open/close it.<br>Let chariots through — never let them meet!</p><button id="btn">Start</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.08,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.12,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=420,H=420,CX=W/2,CY=H/2;
const DIRS=[{dx:1,dy:0,c:'#f59e0b',e:'🐫'},{dx:-1,dy:0,c:'#f59e0b',e:'🐫'},{dx:0,dy:1,c:'#e11d48',e:'🏺'},{dx:0,dy:-1,c:'#e11d48',e:'🏺'}];
let cars=[],gate=false,passed=0,crashes=0,time=0,playing=false,best=+localStorage.getItem('gt_best')||0;
document.getElementById('b').textContent=best;
function spawn(){const D=DIRS[(Math.random()*4)|0];cars.push({dir:DIRS.indexOf(D),prog:-30,sp:1.4+Math.random()*0.9+passed*0.015,ph:Math.random()*6});}
function crash(x,y){crashes++;document.getElementById('c').textContent=crashes;beep(120,.3,'sawtooth');
if(crashes>=3){playing=false;document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='💥 Three crashes!<br>Passed: <b style="color:#fbbf24">'+passed+'</b>';
if(passed>best){best=passed;localStorage.setItem('gt_best',best);document.getElementById('b').textContent=best;}}}
function step(){time++;if(time%Math.max(28,80-passed)===0)spawn();
const near=cars.filter(c=>Math.abs(c.prog)<20);
if(near.length>1){for(let i=0;i<near.length;i++)for(let j=i+1;j<near.length;j++){
 const a=near[i],b=near[j];if(a.dir!==b.dir){crash(CX,CY);
 cars=cars.filter(c=>c!==a&&c!==b);return;}}}
cars.forEach(c=>{const blocked=gate&&Math.abs(c.prog)<12&&Math.abs(c.prog)>-8;
 if(!blocked)c.prog+=c.sp;
 if(c.prog>235){passed++;document.getElementById('p').textContent=passed;beep(700,.08,'triangle');}});
cars=cars.filter(c=>c.prog<240);}
function draw(){ctx.fillStyle='#292524';ctx.fillRect(0,0,W,H);
ctx.strokeStyle='#44403c';ctx.lineWidth=18;ctx.strokeRect(CX-90,CY-90,180,180);
ctx.fillStyle=gate?'#65a30d':'#b91c1c';ctx.fillRect(CX-90,CY-8,180,16);
ctx.font='20px serif';ctx.textAlign='center';ctx.fillText(gate?'OPEN':'CLOSED',CX,CY-16);
cars.forEach(c=>{const D=DIRS[c.dir];const x=CX+D.dx*c.prog,y=CY+D.dy*c.prog;
ctx.font='22px serif';ctx.fillText(D.e,x,y+8);});
if(playing)requestAnimationFrame(()=>{step();draw();});}
cvs.addEventListener('pointerdown',e=>{if(!playing)return;gate=!gate;beep(gate?520:260,.08);});
document.getElementById('btn').onclick=()=>{cars=[];gate=false;passed=0;crashes=0;time=0;
document.getElementById('p').textContent=0;document.getElementById('c').textContent=0;
document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();};
</script></body></html>
