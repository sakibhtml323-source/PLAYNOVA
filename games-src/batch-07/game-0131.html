<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Villager Escort #131</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(#fce7f3,#fbcfe8);font-family:Georgia,serif;color:#831843;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden}
h1{font-size:1.05rem;color:#be185d;padding:6px}
#hud{display:flex;gap:14px;font-size:.9rem;margin-bottom:4px}
canvas{background:#f9a8d4;border-radius:12px;touch-action:none}
#ov{position:fixed;inset:0;background:rgba(252,231,243,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#831843;padding:20px;z-index:5}
button{background:#ec4899;border:none;color:#fff;font-weight:800;padding:12px 32px;border-radius:24px;font-size:1rem;cursor:pointer;margin-top:14px}
</style>
</head>
<body>
<h1>🐹 CUTE ZOMBIE SURVIVAL</h1>
<div id="hud"><span>Score <b id="s">0</b></span><span>❤️ <b id="h">100</b></span><span>Wave <b id="w">1</b></span><span>Best <b id="b">0</b></span></div>
<canvas id="c"></canvas>
<div id="ov"><h2 style="color:#be185d">HAMSTER VS ZOMBIES</h2><p id="od">The cutest apocalypse! Your hamster auto-throws sunflower seeds 🌻 at the zombie hamsters 🧟. Move with WASD/arrows or drag. Grab 🥕 for health. Survive the waves!</p><button id="btn">LOAD THE SEEDS</button></div>
<script>
"use strict";
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');const W=440,H=440;cvs.width=W;cvs.height=H;
let me,zoms,shots,pickups,hp,score,wave,playing,keys,frame,best=+localStorage.getItem('cz_best')||0,npc={x:200,y:200,hp:60};
document.getElementById('b').textContent=best;
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.06,t='sine'){if(!playing)return;const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=.09;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
function resize(){const s=Math.min((window.innerWidth-12)/W,(window.innerHeight-140)/H);cvs.style.width=W*s+'px';cvs.style.height=H*s+'px';}
window.addEventListener('resize',resize);resize();
function init(){me={x:W/2,y:H/2,r:12,cd:0};zoms=[];shots=[];pickups=[];hp=100;score=0;wave=1;keys={};frame=0;playing=true;npc={x:W/2+40,y:H/2,hp:60};
document.getElementById('s').textContent=0;document.getElementById('h').textContent=100;document.getElementById('w').textContent=1;}
window.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let drag=null;
cvs.addEventListener('pointerdown',e=>{audio.resume();const r=cvs.getBoundingClientRect();drag={x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};});
cvs.addEventListener('pointermove',e=>{if(!drag)return;const r=cvs.getBoundingClientRect();drag={x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};});
window.addEventListener('pointerup',()=>drag=null);
function spawnWave(){const n=2+wave;for(let i=0;i<n;i++){const a=Math.random()*7;
zoms.push({x:W/2+Math.cos(a)*280,y:H/2+Math.sin(a)*280,hp:1+((wave/3)|0),sp:0.7+wave*0.1});}}
function step(){frame++;const sp=3.2;
if(keys['w']||keys['arrowup'])me.y-=sp;if(keys['s']||keys['arrowdown'])me.y+=sp;
if(keys['a']||keys['arrowleft'])me.x-=sp;if(keys['d']||keys['arrowright'])me.x+=sp;
npc.x+=(me.x-npc.x)*0.035;npc.y+=(me.y-npc.y)*0.035;
if(drag){const dx=drag.x-me.x,dy=drag.y-me.y,d=Math.hypot(dx,dy);if(d>5){me.x+=dx/d*sp;me.y+=dy/d*sp;}}
me.x=Math.max(14,Math.min(W-14,me.x));me.y=Math.max(14,Math.min(H-14,me.y));
me.cd--;
if(me.cd<=0){let nz=null,nd=1e9;zoms.forEach(z=>{const d=Math.hypot(z.x-me.x,z.y-me.y);if(d<nd){nd=d;nz=z;}});
if(nz&&nd<200){me.cd=20;const a=Math.atan2(nz.y-me.y,nz.x-me.x);
shots.push({x:me.x,y:me.y,vx:Math.cos(a)*5,vy:Math.sin(a)*5});beep(600,.04);}}
shots.forEach(s=>{s.x+=s.vx;s.y+=s.vy;zoms.forEach(z=>{if(Math.hypot(z.x-s.x,z.y-s.y)<z.r+4){z.hp--;shots.splice(shots.indexOf(s),1);beep(300,.07,'triangle');
if(z.hp<=0){zoms.splice(zoms.indexOf(z),1);score+=20;document.getElementById('s').textContent=score;
if(Math.random()<0.22)pickups.push({x:z.x,y:z.y});}}});});
shots=shots.filter(s=>s.x>-10&&s.x<W+10&&s.y>-10&&s.y<H+10);
zoms.forEach(z=>{const a=Math.atan2(me.y-z.y,me.x-z.x);z.x+=Math.cos(a)*z.sp;z.y+=Math.sin(a)*z.sp;
if(Math.hypot(z.x-npc.x,z.y-npc.y)<z.r+16){npc.hp-=0.5;if(npc.hp<=0){die('npc');}}if(Math.hypot(z.x-me.x,z.y-me.y)<z.r+me.r-2){hp-=0.8;document.getElementById('h').textContent=Math.max(0,Math.round(hp));if(hp<=0)die();}});
pickups.forEach(p=>{if(Math.hypot(p.x-me.x,p.y-me.y)<20){hp=Math.min(100,hp+20);document.getElementById('h').textContent=Math.round(hp);
pickups.splice(pickups.indexOf(p),1);beep(880,.07);}});
if(!zoms.length){wave++;document.getElementById('w').textContent=wave;hp=Math.min(100,hp+10);spawnWave();beep(440,.12,'triangle');}}
function die(reason){playing=false;if(reason==='npc'){document.getElementById('od').innerHTML='💀 The villager was slain on wave <b>'+wave+'</b>!<br>Escort failed…';document.getElementById('ov').style.display='flex';return;}if(score>best){best=score;localStorage.setItem('cz_best',best);document.getElementById('b').textContent=best;}
document.getElementById('od').innerHTML='The cute horde wins on wave <b>'+wave+'</b>…<br>Score: <b style="color:#be185d">'+score+'</b>';
document.getElementById('btn').textContent='RE-SQUEAK';document.getElementById('ov').style.display='flex';beep(110,.5,'sawtooth');}
function draw(){ctx.fillStyle='#f9a8d4';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#fbcfe8';for(let x=0;x<W;x+=40)for(let y=0;y<H;y+=40)ctx.fillRect(x+2,y+2,36,36);
pickups.forEach(p=>{ctx.font='15px serif';ctx.textAlign='center';ctx.fillText('🥕',p.x,p.y+5);});
ctx.font='16px serif';ctx.fillText('🧑‍🌾',npc.x,npc.y+5);
ctx.fillStyle='#dc2626';ctx.fillRect(npc.x-14,npc.y-16,28*Math.max(0,npc.hp)/60,3);ctx.fillStyle='#fbcfe8';
shots.forEach(s=>{ctx.fillStyle='#fde047';ctx.beginPath();ctx.arc(s.x,s.y,4,0,7);ctx.fill();});
zoms.forEach(z=>{ctx.fillStyle='#86efac';ctx.beginPath();ctx.arc(z.x,z.y,z.r,0,7);ctx.fill();
ctx.fillStyle='#111';ctx.fillRect(z.x-5,z.y-3,3,3);ctx.fillRect(z.x+2,z.y-3,3,3);
ctx.font='10px serif';ctx.fillText('🧟',z.x-6,z.y+4);});
ctx.fillStyle='#fdba74';ctx.beginPath();ctx.arc(me.x,me.y,me.r,0,7);ctx.fill();
ctx.fillStyle='#111';ctx.fillRect(me.x-4,me.y-4,3,3);ctx.fillRect(me.x+2,me.y-4,3,3);
ctx.fillStyle='#fff';ctx.fillRect(me.x-8,me.y+8,16,3);}
function loop(){if(playing){step();draw();}requestAnimationFrame(loop);}
document.getElementById('btn').onclick=()=>{audio.resume();init();spawnWave();document.getElementById('ov').style.display='none';};
loop();
</script>
</body>
</html>
