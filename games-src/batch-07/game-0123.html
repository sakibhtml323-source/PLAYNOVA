<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Robot World</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0f172a;font-family:'Courier New',monospace;color:#67e8f9;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px;overflow-x:hidden}
h1{font-size:1.1rem;color:#22d3ee;padding:6px;letter-spacing:2px}
#hud{display:flex;gap:14px;font-size:.9rem;margin-bottom:10px}
#board{display:grid;gap:3px;background:#082f49;border:2px solid #164e63;border-radius:12px;padding:10px;touch-action:none}
.cell{width:44px;height:44px;border-radius:8px;background:#0c4a6e;display:flex;align-items:center;justify-content:center;font-size:1.3rem;cursor:pointer}
@media(max-width:400px){.cell{width:36px;height:36px;font-size:1.05rem}}
.cell.wire{background:#155e75}
.cell.on{background:#0891b2}
.cell.sel{outline:3px solid #fbbf24}
#msg{text-align:center;font-size:.85rem;color:#a5f3fc;margin-top:8px;max-width:440px;min-height:2.2em}
#ov{position:fixed;inset:0;background:rgba(8,47,73,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#e0f2fe;padding:20px;z-index:5}
button{background:#22d3ee;color:#082f49;border:none;font-family:inherit;font-weight:800;padding:12px 32px;border-radius:8px;font-size:1rem;cursor:pointer;margin-top:14px}
</style>
</head>
<body>
<h1>🤖 ROBOT WORLD</h1>
<div id="hud"><span>Grid <b id="l">1</b></span><span>Bots online <b id="o">0</b>/<b id="t">0</b></span><span>Moves <b id="m">0</b></span></div>
<div id="board"></div>
<div id="msg">Rotate the circuit tiles to power every robot!</div>
<div id="ov"><h2 style="color:#22d3ee">CIRCUIT WORLD</h2><p id="od">The factory floor is a circuit grid! Tap tiles to rotate wires and route power ⚡ from the reactor to every robot 🤖. Robots beyond the wire stay offline…</p><button id="btn">POWER UP</button></div>
<script>



"use strict";
const TYPES=['','─','│','┌','┐','└','┘','┬','┴','├','┤','┼'];
let size,grid,playing,level,moves,src,bots,best=Infinity;
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.06,t='sine'){const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=.08;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
// each type: set of open sides (0=up,1=right,2=down,3=left)
const OPEN={'─':[1,3],'│':[0,2],'┌':[1,2],'┐':[2,3],'└':[0,1],'┘':[0,3],'┬':[0,1,3],'┴':[1,2,3],'├':[0,1,2],'┤':[0,2,3],'┼':[0,1,2,3]};
function build(){size=Math.min(5+level,9);grid=[];src=null;bots=[];
const total=size*size;
// random spanning path from center
const start=Math.floor(size/2)*size+Math.floor(size/2);
const path=[start];const used=new Set([start]);
while(path.length<Math.min(total*0.7,8+level*4)){const last=path[path.length-1];const r=(last/size)|0,c=last%size;const opts=[];
if(r>0&&!used.has(last-size))opts.push(last-size);if(r<size-1&&!used.has(last+size))opts.push(last+size);
if(c>0&&!used.has(last-1))opts.push(last-1);if(c<size-1&&!used.has(last+1))opts.push(last+1);
if(!opts.length)break;const n=opts[(Math.random()*opts.length)|0];used.add(n);path.push(n);}
for(let i=0;i<total;i++){const inP=used.has(i);
if(!inP){grid.push({t:'',rot:0,bot:false});continue;}
const pi=path.indexOf(i);let t;
if(pi===0){t=dirTile(i,path[1]);src=i;}
else if(pi===path.length-1){t=dirTile(i,path[pi-1]);bots.push(i);}
else t=junctionTile(i,path[pi-1],path[pi+1]);
grid.push({t,rot:0,bot:false});}
// rotate randomly
grid.forEach(c=>{if(c.t)c.rot=(Math.random()*4)|0;});
// set bots
bots.forEach(b=>{if(grid[b])grid[b].bot=true;});
moves=0;document.getElementById('m').textContent=0;document.getElementById('l').textContent=level;
document.getElementById('t').textContent=bots.length;render();}
function dirOf(a,b){if(b===a-size)return 0;if(b===a+1)return 1;if(b===a+size)return 2;return 3;}
function dirTile(a,b){const d=dirOf(a,b);return[{t:'│',r:0},[{t:'─',r:0}],{t:'│',r:0},[{t:'─',r:0}]][d][0]?(d%2?'─':'│'):'─';}
function junctionTile(a,p,n){const d1=dirOf(a,p),d2=dirOf(a,n);const set=new Set([d1,d2]);
if(set.has(0)&&set.has(2))return'─';if(set.has(1)&&set.has(3))return'─';
if(set.has(0)&&set.has(1))return'┘';if(set.has(1)&&set.has(2))return'└';
if(set.has(2)&&set.has(3))return'┌';if(set.has(0)&&set.has(3))return'┐';return'┼';}
function opens(c){if(!c.t)return[];
const base=OPEN[c.t];const out=new Set();
base.forEach(d=>out.add((d+c.rot)%4));return[...out];}
function powered(){if(!grid||!grid.length||src==null||grid[src]===undefined)return new Set();const on=new Set([src]);const q=[src];
while(q.length){const cur=q.pop();const c=grid[cur];
opens(c).forEach(d=>{let n=-1;const r=(cur/size)|0,cc=cur%size;
if(d===0&&r>0)n=cur-size;if(d===1&&cc<size-1)n=cur+1;if(d===2&&r<size-1)n=cur+size;if(d===3&&cc>0)n=cur-1;
if(n>=0&&n<grid.length&&opens(grid[n]).includes((d+2)%4)&&!on.has(n)){on.add(n);q.push(n);}});}
return on;}
function render(){const on=powered();const b=document.getElementById('board');
b.style.gridTemplateColumns='repeat('+size+',44px)';b.innerHTML='';
let online=0;
grid.forEach((c,i)=>{const d=document.createElement('div');
d.className='cell'+(c.t?(on.has(i)?' on':' wire'):'');
d.style.transform='rotate('+(c.rot*90)+'deg)';
d.textContent=c.bot?(on.has(i)?'🤖':'🤖'):(i===src?'⚡':c.t);
if(c.bot&&on.has(i))online++;
d.onclick=()=>{if(!playing||!c.t)return;audio.resume();c.rot=(c.rot+1)%4;
moves++;document.getElementById('m').textContent=moves;beep(400+c.rot*80,.05);render();
if(bots.every(bt=>on.has(bt)))win();};
b.appendChild(d);});
document.getElementById('o').textContent=online;}
function win(){playing=false;beep(800,.15,'triangle');setTimeout(()=>beep(1000,.15,'triangle'),140);
if(moves<best){best=moves;localStorage.setItem('rw_best_'+size,best);}
document.getElementById('od').innerHTML='⚡ All robots online in <b>'+moves+'</b> moves!'+(size<9?'<br>Next: '+(size+1)+'×'+(size+1)+' grid':'<br>The whole robot world hums!');
document.getElementById('btn').textContent=size<9?'NEXT GRID':'REBOOT';if(size>=9)level=0;level++;document.getElementById('ov').style.display='flex';}
window.addEventListener('keydown',e=>{if(!playing)return;if(e.key==='Enter'){const t=document.querySelectorAll('.cell')[src+1]||document.querySelectorAll('.cell')[0];if(t)t.click();}});
document.getElementById('btn').onclick=()=>{audio.resume();if(level===0)level=1;playing=true;build();document.getElementById('ov').style.display='none';};



</script>
</body>
</html>
