<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Air Hockey: Pirate Theme</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(#082f49,#0c4a6e);font-family:Georgia,serif;color:#e0f2fe;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden}
h1{font-size:1.1rem;color:#fbbf24;padding:6px}
#hud{display:flex;gap:16px;font-size:.9rem;margin-bottom:4px}
canvas{background:#0c4a6e;border-radius:12px;border:3px solid #fbbf24;touch-action:none}
#ov{position:fixed;inset:0;background:rgba(8,47,73,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#e0f2fe;padding:20px;z-index:5}
button{background:#fbbf24;border:none;color:#082f49;font-weight:800;padding:12px 32px;border-radius:24px;font-size:1rem;cursor:pointer;margin-top:14px}
</style>
</head>
<body>
<h1>🏴‍☠️ PIRATE AIR HOCKEY</h1>
<div id="hud"><span>⚓ You <b id="s1">0</b></span><span>First to 5 goals</span><span>💀 CPU <b id="s2">0</b></span></div>
<canvas id="c"></canvas>
<div id="ov"><h2 style="color:#fbbf24">DECK HOCKEY</h2><p id="od">Air hockey on the pirate deck! Drag your mallet (bottom). Sink the skull puck in the CPU's goal. First to 5 claims the treasure!</p><button id="btn">SET SAIL</button></div>
<script>
"use strict";
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');const W=420,H=560;cvs.width=W;cvs.height=H;
let puck,p1,p2,playing,s1,s2,best5=+localStorage.getItem('ah_best')||0;
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.07,t='sine'){if(!playing)return;const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=.09;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
function resize(){const s=Math.min((window.innerWidth-12)/W,(window.innerHeight-140)/H);cvs.style.width=W*s+'px';cvs.style.height=H*s+'px';}
window.addEventListener('resize',resize);resize();
function reset(dir){puck={x:W/2,y:H/2,vx:2.2*dir,vy:1.5*dir};
p1={x:W/2,y:H-60};p2={x:W/2,y:60};}
function init(){playing=true;s1=0;s2=0;document.getElementById('s1').textContent=0;document.getElementById('s2').textContent=0;reset(Math.random()<0.5?1:-1);}
let drag=null;
cvs.addEventListener('pointerdown',e=>{audio.resume();const r=cvs.getBoundingClientRect();
drag={x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};});
cvs.addEventListener('pointermove',e=>{if(!drag)return;const r=cvs.getBoundingClientRect();
drag={x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};});
window.addEventListener('pointerup',()=>drag=null);
window.addEventListener('keydown',e=>{const k=e.key;if(!playing)return;
if(k==='ArrowLeft')p1.x-=24;if(k==='ArrowRight')p1.x+=24;
if(k==='ArrowUp')p1.y-=24;if(k==='ArrowDown')p1.y+=24;
p1.x=Math.max(26,Math.min(W-26,p1.x));p1.y=Math.max(H/2+20,Math.min(H-26,p1.y));});
function collide(m){const d=Math.hypot(puck.x-m.x,puck.y-m.y);const min=26;
if(d<min){const a=Math.atan2(puck.y-m.y,puck.x-m.x);
puck.x=m.x+Math.cos(a)*min;puck.y=m.y+Math.sin(a)*min;
const sp=Math.min(9,Math.hypot(puck.vx,puck.vy)+0.5);
puck.vx=Math.cos(a)*sp;puck.vy=Math.sin(a)*sp;beep(500,.05);}}
function step(){
if(drag){p1.x+= (drag.x-p1.x)*0.3;p1.y+=(drag.y-p1.y)*0.3;
p1.x=Math.max(26,Math.min(W-26,p1.x));p1.y=Math.max(H/2+20,Math.min(H-26,p1.y));}
// CPU AI
const dx=puck.x-p2.x,dy=puck.y-p2.y;
if(puck.y<H/2||dy<0){p2.x+=dx*0.06;p2.y+=dy*0.06;}
else{p2.x+=(W/2-p2.x)*0.04;p2.y+=(60-p2.y)*0.04;}
p2.x=Math.max(26,Math.min(W-26,p2.x));p2.y=Math.max(26,Math.min(H/2-20,p2.y));
puck.x+=puck.vx;puck.y+=puck.vy;puck.vx*=0.995;puck.vy*=0.995;
if(puck.x<14){puck.x=14;puck.vx*=-1;}if(puck.x>W-14){puck.x=W-14;puck.vx*=-1;}
collide(p1);collide(p2);
// goals
if(puck.y<8){s1++;beep(880,.2,'triangle');document.getElementById('s1').textContent=s1;
if(s1>=5)return matchEnd(1);reset(1);}
if(puck.y>H-8){s2++;beep(160,.25,'sawtooth');document.getElementById('s2').textContent=s2;
if(s2>=5)return matchEnd(2);reset(-1);}}
function matchEnd(w){playing=false;
if(w===1&&s1>best5){best5=s1;localStorage.setItem('ah_best',best5);}
document.getElementById('od').innerHTML=w===1?'🏆 <b style="color:#fde047">YOU CLAIM THE TREASURE '+s1+'—'+s2+'!</b>':'💀 <b>The CPU takes the deck '+s2+'—'+s1+'…</b>';
document.getElementById('btn').textContent='REMATCH';document.getElementById('ov').style.display='flex';}
function draw(){ctx.fillStyle='#0c4a6e';ctx.fillRect(0,0,W,H);
// deck planks
ctx.strokeStyle='#164e6355';for(let y=0;y<H;y+=34)ctx.strokeRect(0,y,W,34);
ctx.strokeStyle='#fbbf24';ctx.setLineDash([8,8]);ctx.beginPath();ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);ctx.stroke();ctx.setLineDash([]);
ctx.strokeStyle='#fbbf24';ctx.beginPath();ctx.arc(W/2,H/2,40,0,7);ctx.stroke();
// goals
ctx.fillStyle='#fbbf24';ctx.fillRect(W/2-50,0,100,6);ctx.fillRect(W/2-50,H-6,100,6);
// puck
ctx.fillStyle='#e0f2fe';ctx.beginPath();ctx.arc(puck.x,puck.y,11,0,7);ctx.fill();
ctx.fillStyle='#082f49';ctx.font='bold 9px Georgia';ctx.textAlign='center';ctx.fillText('💀',puck.x,puck.y+3);
// mallets
ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(p1.x,p1.y,22,0,7);ctx.fill();
ctx.fillStyle='#ef4444';ctx.beginPath();ctx.arc(p2.x,p2.y,22,0,7);ctx.fill();}
function loop(){if(playing){step();draw();}requestAnimationFrame(loop);}
document.getElementById('btn').onclick=()=>{audio.resume();init();document.getElementById('ov').style.display='none';};
loop();
</script>
</body>
</html>
