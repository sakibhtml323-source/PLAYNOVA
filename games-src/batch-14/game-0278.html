<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Royal Deck Duel #278</title><style>
body{margin:0;font-family:system-ui;background:#1e1b4b;color:#eef2ff;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a5b4fc;font-size:.78rem}
#field{display:flex;gap:20px;margin:12px;align-items:center}
.card{width:90px;height:120px;background:#312e81;border:3px solid #4f46e5;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:2rem;font-weight:800;cursor:pointer;transition:transform .2s}
.card:hover{transform:translateY(-6px)}
.card.back{background:#4338ca;font-size:1.5rem}
.card .suit{font-size:1.2rem}
#hud{display:flex;gap:14px;font-size:.9rem;margin:4px}
#hud b{color:#fbbf24}
#hand{display:flex;gap:8px;margin:8px;flex-wrap:wrap;justify-content:center}
#msg{min-height:1.4em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#fbbf24;color:#1e1b4b;font-weight:700;cursor:pointer;margin:8px}
</style></head><body>
<h1>🃏 Royal Deck Duel</h1><div class="sub">Play a card — higher value wins the round. First to 10 round-wins takes the duel!</div>
<div id="hud"><span>You <b id="s1">0</b></span><span>AI <b id="s2">0</b></span><span>Round <b id="r">1</b></span><span>Hand <b id="h">5</b></span></div>
<div id="field">
<div class="card back" id="aiCard">🎴</div>
<div style="font-size:1.6rem">VS</div>
<div class="card" id="myCard">?</div>
</div>
<div id="hand"></div>
<div id="msg"></div>
<button id="btn">🔄 New Duel</button>
<audio id="au"></audio>
<script>
"use strict";
const AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const SUITS=['♠','♥','♦','♣'];
let deck=[],hand=[],s1=0,s2=0,round=1,playing=true;
function newDeck(){deck=[];
for(let v=2;v<=14;v++)SUITS.forEach(s=>deck.push({v,s}));
deck.sort(()=>Math.random()-.5);}
function draw(n){const out=[];for(let i=0;i<n&&deck.length;i++)out.push(deck.pop());return out;}
function newDuel(){newDeck();hand=draw(5);s1=0;s2=0;round=1;playing=true;
document.getElementById('s1').textContent=0;document.getElementById('s2').textContent=0;
document.getElementById('r').textContent=1;msg('Pick a card to duel!');render();}
function playCard(i){if(!playing||!hand[i])return;
const my=hand[i];hand.splice(i,1);
const ai=deck.pop()||{v:2+((Math.random()*12)|0),s:SUITS[(Math.random()*4)|0]};
document.getElementById('aiCard').innerHTML=ai.s+'<br>'+face(ai.v);
document.getElementById('aiCard').classList.remove('back');
document.getElementById('myCard').innerHTML=my.s+'<br>'+face(my.v);
if(my.v>ai.v){s1++;beep(660,.12,'triangle');msg('✅ You win the round!');}
else if(ai.v>my.v){s2++;beep(300,.12,'sawtooth');msg('❌ AI takes the round!');}
else{beep(440,.1);msg('🤝 Tie round!');}
document.getElementById('s1').textContent=s1;document.getElementById('s2').textContent=s2;
hand=hand.concat(draw(1));
document.getElementById('h').textContent=hand.length;
document.getElementById('r').textContent=++round;
if(s1>=10||s2>=10||!deck.length){playing=false;
const w=s1>s2?'👑 You win the duel!':s2>s1?'🤖 AI wins the duel…':'🤝 Draw!';
msg(w+'  '+s1+'–'+s2);beep(s1>=s2?880:200,.3,s1>=s2?'triangle':'sawtooth');return;}
setTimeout(render,400);}
function face(v){return v===14?'A':v===13?'K':v===12?'Q':v===11?'J':v;}
function render(){const hd=document.getElementById('hand');hd.innerHTML='';
hand.forEach((c,i)=>{const d=document.createElement('div');d.className='card';
d.innerHTML='<span class="suit">'+c.s+'</span>'+face(c.v);
d.onclick=()=>{AU.__c=AU.__c||new (window.AudioContext||window.webkitAudioContext)();playCard(i);};
hd.appendChild(d);});}
function msg(t){document.getElementById('msg').textContent=t;}
document.getElementById('btn').onclick=()=>{AU.__c=new (window.AudioContext||window.webkitAudioContext)();newDuel();};
newDuel();
</script></body></html>
