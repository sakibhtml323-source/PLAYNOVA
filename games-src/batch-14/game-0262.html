<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Dual Defense #262</title><style>
body{margin:0;font-family:system-ui;background:#1c1917;color:#fafaf9;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a8a29e;font-size:.78rem}
canvas{background:#292524;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}
#hud b{color:#fbbf24}
#build{display:flex;gap:6px;margin:6px}
.b{padding:8px 14px;border-radius:10px;border:2px solid #57534e;background:#292524;color:#fff;font-weight:700;cursor:pointer;font-size:.85rem}
.b.sel{border-color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#1c1917;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🏜️ Desert Dual Defense</h1><div class="sub">Co-op 2P: P1 clicks left half, P2 clicks right half to build. Protect both gates!</div>
<div id="hud"><span>Wave <b id="w">1</b></span><span>P1 ❤️ <b id="h1">20</b></span><span>P2 ❤️ <b id="h2">20</b></span><span>Gold <b id="g">60</b></span></div>
<canvas id="cv" width="520" height="360"></canvas>
<div id="build">
<button class="b" data-t="0">🎯 Arrow 30</button>
<button class="b" data-t="1">💥 Cannon 60</button>
<button class="b" data-t="2">❄️ Frost 45</button>
</div>
<div id="ov"><div style="font-size:3rem">🏰</div><p>2P co-op defense!<br>P1 builds on left half, P2 on right. Survive together!</p><button id="btn">Defend</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=520,H=360;
const DEFS=[{n:'Arrow',c:30,d:6,r:110,e:'🎯',rate:28},{n:'Cannon',c:60,d:14,r:90,e:'💥',rate:50},{n:'Frost',c:45,d:3,r:100,e:'❄️',rate:35,slow:true}];
let towers=[],foes=[],gold=60,wave=1,h1=20,h2=20,playing=false,selT=0;
const PATH1=[{x:0,y:80},{x:260,y:80},{x:260,y:280},{x:0,y:280}];
const PATH2=[{x:520,y:80},{x:260,y:80},{x:260,y:280},{x:520,y:280}];
document.querySelectorAll('.b').forEach(b=>b.addEventListener('click',()=>{
document.querySelectorAll('.b').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');selT=+b.dataset.t;}));
function spawn(){const right=Math.random()<0.5;
const path=right?PATH2:PATH1;
foes.push({path,pi:0,x:path[0].x,y:path[0].y,hp:18+wave*6,sp:1+wave*0.08+Math.random()*0.3,gold:right?2:1,side:right?2:1,slowT:0});}
cvs.addEventListener('pointerdown',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
const mx=(e.clientX-r.left)*W/r.width,my=(e.clientY-r.top)*H/r.height;
// can't build on path
const nearPath=[...PATH1,...PATH2].some(p=>Math.hypot(p.x-mx,p.y-my)<36);
if(nearPath||towers.some(t=>Math.hypot(t.x-mx,t.y-my)<30)){beep(160,.06,'sawtooth');return;}
if(gold<DEFS[selT].c){beep(160,.06,'sawtooth');return;}
gold-=DEFS[selT].c;towers.push({x:mx,y:my,type:selT,cd:0});
document.getElementById('g').textContent=gold;beep(620,.08);});
function step(){towers.forEach(t=>{t.cd++;
if(t.cd>=DEFS[t.type].rate){const D=DEFS[t.type];
let tgt=null,bd=1e9;foes.forEach(f=>{const d=Math.hypot(f.x-t.x,f.y-t.y);if(d<D.r&&d<bd){bd=d;tgt=f;}});
if(tgt){t.cd=0;tgt.hp-=D.d;beep(700,.04,'triangle');
if(D.slow)tgt.slowT=40;
ctx.beginPath();ctx.moveTo(t.x,t.y);ctx.lineTo(tgt.x,tgt.y);ctx.strokeStyle=D.slow?'#67e8f9':'#fbbf24';ctx.lineWidth=1.5;ctx.stroke();}}});
foes.forEach(f=>{if(f.slowT>0){f.slowT--;f.x+=(f.tx||0)*0.4;return;}
const path=f.path;const tgt=path[f.pi+1];
if(!tgt){if(f.side===1)h1-=f.gold;else h2-=f.gold;
document.getElementById('h1').textContent=Math.max(0,h1);document.getElementById('h2').textContent=Math.max(0,h2);
f.hp=0;beep(150,.15,'sawtooth');return;}
const dx=tgt.x-f.x,dy=tgt.y-f.y,d=Math.hypot(dx,dy);
if(d<6){f.pi++;}else{f.x+=dx/d*f.sp;f.y+=dy/d*f.sp;}});
const before=foes.length;
foes=foes.filter(f=>f.hp>0);
const kills=before-foes.length;if(kills>0)gold+=kills*8;
document.getElementById('g').textContent=gold;
if(foes.length===0&&playing){wave++;document.getElementById('w').textContent=wave;
gold+=30;for(let i=0;i<3+wave;i++)setTimeout(spawn,i*400);}}
function die(){if(!playing)return;playing=false;beep(130,.35,'sawtooth');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='💥 A gate has fallen on wave <b style="color:#fbbf24">'+wave+'</b>!';}
function draw(){ctx.fillStyle='#292524';ctx.fillRect(0,0,W,H);
// paths
ctx.strokeStyle='#57534e';ctx.lineWidth=20;ctx.lineCap='round';
[PATH1,PATH2].forEach(p=>{ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);for(let i=1;i<p.length;i++)ctx.lineTo(p[i].x,p[i].y);ctx.stroke();});
// midline
ctx.strokeStyle='#7c3aed';ctx.setLineDash([6,6]);ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();ctx.setLineDash([]);
towers.forEach(t=>{ctx.font='22px serif';ctx.textAlign='center';ctx.fillText(DEFS[t.type].e,t.x,t.y+8);});
foes.forEach(f=>{ctx.font='22px serif';ctx.fillText(f.slowT>0?'🥶':'👹',f.x,f.y+8);
ctx.fillStyle='#ef4444';ctx.fillRect(f.x-10,f.y-18,20*Math.max(0,f.hp)/(18+wave*6),3);});
if(playing){if(h1<=0||h2<=0){die();return;}step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{towers=[];foes=[];gold=60;wave=1;h1=20;h2=20;
document.getElementById('w').textContent=1;document.getElementById('h1').textContent=20;
document.getElementById('h2').textContent=20;document.getElementById('g').textContent=60;
document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();
document.querySelectorAll('.b')[0].classList.add('sel');
for(let i=0;i<4;i++)setTimeout(spawn,i*500);
draw();};
</script></body></html>
