<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Rhythm Runner #277</title><style>
body{margin:0;font-family:system-ui;background:#1c1917;color:#fafaf9;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a8a29e;font-size:.78rem}
canvas{background:#292524;border-radius:12px;touch-action:none;max-width:96vw}
#beat{font-size:2rem;margin:4px}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}
#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#1c1917;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🥁 Desert Rhythm Runner</h1><div class="sub">Jump ON the beat! Obstacles arrive with the drum — off-beat jumps stumble.</div>
<div id="hud"><span>Dist <b id="d">0</b>m</span><span>Combo <b id="c">×1</b></span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="480" height="280"></canvas>
<div id="beat">🥁</div>
<div id="ov"><div style="font-size:3rem">🎵</div><p>Obstacles arrive on the beat.<br>Tap/Space exactly when the pulse hits!</p><button id="btn">Run</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=480,H=280,GY=H-46;
const BPM=112,BEAT=60/BPM;
let me={y:GY,vy:0,onG:true},obs=[],dist=0,combo=1,playing=false,beatT=0,lastBeat=0,best=+localStorage.getItem('rr_best')||0;
document.getElementById('b').textContent=best;
function spawn(){obs.push({x:W+40,e:['🌵','🪨','🏺'][(Math.random()*3)|0]});}
function jump(){if(!playing)return;
const phase=beatT%BEAT;const off=Math.min(phase,BEAT-phase);
if(me.onG){me.vy=-10.5;me.onG=false;
if(off<0.12){combo=Math.min(combo+1,12);beep(600+combo*40,.1,'triangle');
document.getElementById('c').textContent='×'+combo;}
else{combo=1;beep(300,.1,'sawtooth');document.getElementById('c').textContent='×1';}}}
cvs.addEventListener('pointerdown',jump);
document.addEventListener('keydown',e=>{if(e.code==='Space')jump();});
function hit(o){return o.x<110&&o.x>58&&me.y>GY-30;}
function step(){const dt=1/60;beatT+=dt;
if(beatT-lastBeat>=BEAT){lastBeat=beatT;spawn();beep(200,.05);
document.getElementById('beat').style.transform='scale(1.3)';
setTimeout(()=>document.getElementById('beat').style.transform='scale(1)',80);}
me.vy+=0.55;me.y+=me.vy;
if(me.y>=GY){me.y=GY;me.vy=0;me.onG=true;}
obs.forEach(o=>{o.x-=(4.4+combo*0.08);});
obs=obs.filter(o=>o.x>-40);
obs.forEach(o=>{if(hit(o))die();});
dist+=0.055*combo;}
function die(){if(!playing)return;playing=false;beep(130,.35,'sawtooth');
const d=Math.floor(dist);if(d>best){best=d;localStorage.setItem('rr_best',best);document.getElementById('b').textContent=best;}
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='💀 Tripped at <b style="color:#fbbf24">'+d+'m</b> · Best combo ×'+combo;}
function draw(){ctx.fillStyle='#292524';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#44403c';ctx.fillRect(0,GY+2,W,H-GY);
// beat pulse ring
const phase=(beatT%BEAT)/BEAT;
ctx.strokeStyle='#fbbf24'+(phase<0.15?'ff':'44');
ctx.beginPath();ctx.arc(90,me.y-14,18+phase*10,0,7);ctx.stroke();
ctx.font='30px serif';ctx.textAlign='center';ctx.fillText('🏃',88,me.y+4);
obs.forEach(o=>{ctx.font='26px serif';ctx.fillText(o.e,o.x,GY+6);});
document.getElementById('d').textContent=Math.floor(dist);
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{me={y:GY,vy:0,onG:true};obs=[];dist=0;combo=1;beatT=0;lastBeat=0;
document.getElementById('d').textContent=0;document.getElementById('c').textContent='×1';
document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();};
</script></body></html>
