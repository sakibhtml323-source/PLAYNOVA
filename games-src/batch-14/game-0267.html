<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ninja Ice Slide #267</title><style>
body{margin:0;font-family:system-ui;background:#0c4a6e;color:#e0f2fe;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#7dd3fc;font-size:.78rem}
#grid{display:grid;grid-template-columns:repeat(7,42px);gap:2px;margin:12px}
.c{width:42px;height:42px;background:#075985;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px}
.c.ice{background:#38bdf833}.c.rock{background:#334155}.c.goal{background:#166534}
#hud{display:flex;gap:14px;font-size:.9rem;margin:4px}
#hud b{color:#fbbf24}
#msg{min-height:1.3em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#38bdf8;color:#0c4a6e;font-weight:800;cursor:pointer;margin:8px}
</style></head><body>
<h1>⛸️ Ninja Ice Slide</h1><div class="sub">You slide until you hit a rock! Plan your path to the scroll.</div>
<div id="hud"><span>Level <b id="l">1</b></span><span>Moves <b id="m">0</b></span><span>Best <b id="b">—</b></span></div>
<div id="grid"></div><div id="msg"></div>
<button id="btn">❄️ New Glacier</button>
<audio id="au"></audio>
<script>
"use strict";
const AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const N=7;let grid=[],me={r:0,c:0},goal={r:0,c:0},moves=0,level=1,playing=true,best=+localStorage.getItem('nis_best')||Infinity;
function gen(){grid=[];for(let r=0;r<N;r++){const row=[];for(let c=0;c<N;c++)row.push(0);grid.push(row);}
// scatter rocks
const nr=3+level;for(let i=0;i<nr;i++){const r=(Math.random()*N)|0,c=(Math.random()*N)|0;grid[r][c]=1;}
// ice patches
for(let i=0;i<6;i++){const r=(Math.random()*N)|0,c=(Math.random()*N)|0;if(!grid[r][c])grid[r][c]=2;}
me={r:0,c:0};grid[0][0]=0;
goal={r:N-1,c:N-1};grid[N-1][N-1]=0;moves=0;playing=true;
document.getElementById('m').textContent=0;document.getElementById('l').textContent=level;render();function msg(t){document.getElementById('msg').textContent=t;}
msg('Slide to the scroll!');}
function slide(dr,dc){if(!playing)return;
let r=me.r,c=me.c;let steps=0;
while(true){const nr2=r+dr,nc=c+dc;
if(nr2<0||nr2>=N||nc<0||nc>=N)break;
if(grid[nr2][nc]===1)break; // rock stops
r=nr2;c=nc;steps++;
if(grid[r][c]===2){break;} // ice stops sliding (grip)
if(r===goal.r&&c===goal.c)break;}
if(!steps){beep(160,.06,'sawtooth');return;}
me={r,c};moves++;document.getElementById('m').textContent=moves;
beep(400+steps*30,.08);render();
if(r===goal.r&&c===goal.c){playing=false;beep(880,.25,'triangle');
if(moves<best){best=moves;localStorage.setItem('nis_best',best);document.getElementById('b').textContent=best;}
msg('🎉 Scroll reached in '+moves+' slides! Level '+(level+1));
level++;setTimeout(gen,1000);}}
function render(){const g=document.getElementById('grid');g.innerHTML='';
for(let r=0;r<N;r++)for(let c=0;c<N;c++){const d=document.createElement('div');
d.className='c'+(grid[r][c]===1?' rock':grid[r][c]===2?' ice':'');
if(r===goal.r&&c===goal.c){d.classList.add('goal');d.textContent='📜';}
else if(r===me.r&&c===me.c)d.textContent='🥷';
else if(grid[r][c]===1)d.textContent='🪨';
else if(grid[r][c]===2)d.textContent='🧊';
d.onclick=()=>{const dr=r-me.r,dc=c-me.c;
if(Math.abs(dr)+Math.abs(dc)===1)slide(dr,dc);};g.appendChild(d);}
document.getElementById('b').textContent=best<Infinity?best:'—';}
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();
if(k==='arrowup')slide(-1,0);if(k==='arrowdown')slide(1,0);
if(k==='arrowleft')slide(0,-1);if(k==='arrowright')slide(0,1);});
document.getElementById('btn').onclick=()=>{AU.__c=new (window.AudioContext||window.webkitAudioContext)();gen();};
gen();
</script></body></html>
