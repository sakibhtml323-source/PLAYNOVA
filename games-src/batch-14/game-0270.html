<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ninja Arena King #270</title><style>
body{margin:0;font-family:system-ui;background:#111827;color:#f9fafb;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#9ca3af;font-size:.78rem}
canvas{background:#1f2937;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}
#hud b{color:#facc15}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#facc15;color:#111827;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>👑 Ninja Arena King</h1><div class="sub">Survive the waves — every 5th wave a BOSS appears. Claim the crown!</div>
<div id="hud"><span>Wave <b id="w">1</b></span><span>HP <b id="h">100</b></span><span>Kills <b id="k">0</b></span><span>Crowns <b id="c">0</b></span></div>
<canvas id="cv" width="480" height="380"></canvas>
<div id="ov"><div style="font-size:3rem">⚔️</div><p>WASD/arrows to move — auto-attack nearest foe.<br>Defeat the wave-5 boss to earn a crown!</p><button id="btn">Enter Arena</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=480,H=380;
let me={x:W/2,y:H/2,hp:100,cd:0},foes=[],wave=1,kills=0,crowns=0,playing=false,keys={};
function spawn(){const n=2+wave;
for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2;
foes.push({x:W/2+Math.cos(a)*220,y:H/2+Math.sin(a)*180,hp:10+wave*3,sp:1+wave*0.07,r:12,boss:false});}
if(wave%5===0){foes.push({x:W/2,y:60,hp:120+wave*10,sp:1.3,r:24,boss:true});
beep(200,.3,'sawtooth');msg('👑 BOSS wave!');}}
function msg(t){const el=document.getElementById('ov').querySelector('p');
if(playing){ctx.font='20px serif';ctx.textAlign='center';}}
document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
function step(){const sp=3;
if(keys['w']||keys['arrowup'])me.y-=sp;if(keys['s']||keys['arrowdown'])me.y+=sp;
if(keys['a']||keys['arrowleft'])me.x-=sp;if(keys['d']||keys['arrowright'])me.x+=sp;
me.x=Math.max(14,Math.min(W-14,me.x));me.y=Math.max(14,Math.min(H-14,me.y));
// auto attack
me.cd++;
if(me.cd>=20){me.cd=0;let tgt=null,bd=1e9;
foes.forEach(f=>{const d=Math.hypot(f.x-me.x,f.y-me.y);if(d<bd){bd=d;tgt=f;}});
if(tgt&&bd<160){tgt.hp-=9;beep(700,.05,'triangle');
ctx.beginPath();ctx.moveTo(me.x,me.y);ctx.lineTo(tgt.x,tgt.y);
ctx.strokeStyle='#fbbf24';ctx.lineWidth=2;ctx.stroke();}}
foes.forEach(f=>{const dx=me.x-f.x,dy=me.y-f.y,d=Math.hypot(dx,dy)||1;
f.x+=dx/d*f.sp;f.y+=dy/d*f.sp;
if(d<f.r+14){me.hp-=f.boss?1.2:0.5;}});
foes=foes.filter(f=>f.hp>0);
if(!foes.length&&playing){wave++;document.getElementById('w').textContent=wave;
me.hp=Math.min(100,me.hp+20);spawn();}
document.getElementById('h').textContent=Math.max(0,Math.floor(me.hp));
document.getElementById('k').textContent=kills;}
function die(){if(!playing)return;playing=false;beep(130,.35,'sawtooth');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='💀 Fell on wave <b style="color:#facc15">'+wave+'</b> · '+kills+' kills · '+crowns+' 👑';}
function draw(){ctx.fillStyle='#1f2937';ctx.fillRect(0,0,W,H);
// arena ring
ctx.strokeStyle='#374151';ctx.lineWidth=3;ctx.beginPath();ctx.arc(W/2,H/2,150,0,7);ctx.stroke();
foes.forEach(f=>{ctx.font=(f.boss?'36':'24')+'px serif';ctx.textAlign='center';
ctx.fillText(f.boss?'👹':'👺',f.x,f.y+8);
ctx.fillStyle='#ef4444';ctx.fillRect(f.x-14,f.y-(f.boss?28:20),28*Math.max(0,f.hp)/(f.boss?120+wave*10:10+wave*3),3);ctx.fillStyle='#f9fafb';});
ctx.font='30px serif';ctx.fillText('🥷',me.x,me.y+10);
if(playing){if(me.hp<=0){die();return;}step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{me={x:W/2,y:H/2,hp:100,cd:0};foes=[];wave=1;kills=0;playing=false;
// recount kills
const ki=document.getElementById('k');ki.textContent=0;
document.getElementById('w').textContent=1;document.getElementById('h').textContent=100;
document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();spawn();draw();};
</script></body></html>
