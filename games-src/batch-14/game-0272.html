<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Snake Pit #272</title><style>
body{margin:0;font-family:system-ui;background:#1c1917;color:#fafaf9;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a8a29e;font-size:.78rem}
canvas{background:#292524;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}
#hud b{color:#fbbf24}
#pad{display:grid;grid-template-columns:repeat(3,54px);gap:4px;margin:8px}
.pd{width:54px;height:42px;border-radius:10px;border:none;background:#57534e;color:#fff;font-size:1.1rem;cursor:pointer}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#1c1917;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🐍 Desert Snake Pit</h1><div class="sub">Rival snakes hunt the same scarabs! Out-eat the AI serpents.</div>
<div id="hud"><span>You <b id="s">3</b></span><span>AI1 <b id="a1">3</b></span><span>AI2 <b id="a2">3</b></span><span>⏱️ <b id="t">90</b></span></div>
<canvas id="cv" width="400" height="400"></canvas>
<div id="pad">
<div></div><button class="pd" data-d="u">⬆</button><div></div>
<button class="pd" data-d="l">⬅</button><button class="pd" data-d="d">⬇</button><button class="pd" data-d="r">➡</button>
</div>
<div id="ov"><div style="font-size:3rem">🐍</div><p>Steer with arrows/pad.<br>Eat 🪲 to grow — longest snake wins!</p><button id="btn">Enter the Pit</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToToValueAtTime?0:g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=400,CELL=20,N=20;
let me={body:[{x:10,y:10}],dir:{x:1,y:0},color:'#a855f7'};
let ais=[{body:[{x:5,y:15}],dir:{x:1,y:0},color:'#22d3ee'},{body:[{x:15,y:5}],dir:{x:-1,y:0},color:'#f59e0b'}];
let food=[],playing=false,tick=0,time=90,timer=null;
function spawnFood(){if(food.length<4)food.push({x:(Math.random()*N)|0,y:(Math.random()*N)|0});}
function occupied(x,y){return me.body.some(s=>s.x===x&&s.y===y)||ais.some(a=>a.body.some(s=>s.x===x&&s.y===y));}
function turn(d){if(d==='u'&&me.dir.y!==1)me.dir={x:0,y:-1};if(d==='d'&&me.dir.y!==-1)me.dir={x:0,y:1};
if(d==='l'&&me.dir.x!==1)me.dir={x:-1,y:0};if(d==='r'&&me.dir.x!==-1)me.dir={x:1,y:0};}
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();
if(k==='arrowup')turn('u');if(k==='arrowdown')turn('d');if(k==='arrowleft')turn('l');if(k==='arrowright')turn('r');});
document.querySelectorAll('.pd').forEach(b=>b.addEventListener('pointerdown',()=>turn(b.dataset.d)));
function aiStep(a){const head=a.body[0];
// seek nearest food
let tgt=food[0],bd=1e9;food.forEach(f=>{const d=Math.abs(f.x-head.x)+Math.abs(f.y-head.y);if(d<bd){bd=d;tgt=f;}});
const opts=[[0,-1],[0,1],[-1,0],[1,0]].filter(([dx,dy])=>
!(dx===-a.dir.x&&dy===-a.dir.y)&&
head.x+dx>=0&&head.x+dx<N&&head.y+dy>=0&&head.y+dy<N&&
!occupied(head.x+dx,head.y+dy));
if(!opts.length)return;
let best=opts[0],bs=-1e9;
opts.forEach(([dx,dy])=>{const s=(tgt?(tgt.x-head.x)*dx+(tgt.y-head.y)*dy:0)+Math.random()*0.5;
if(s>bs){bs=s;best=[dx,dy];}});
a.dir={x:best[0],y:best[1]};}
function stepSnek(s,grow){const head={x:s.body[0].x+s.dir.x,y:s.body[0].y+s.dir.y};
if(head.x<0||head.x>=N||head.y<0||head.y>=N||occupied(head.x,head.y))return false;
s.body.unshift(head);
const fi=food.findIndex(f=>f.x===head.x&&f.y===head.y);
if(fi>=0){food.splice(fi,1);spawnFood();beep(600+s.body.length*12,.06);}
else s.body.pop();
return true;}
function step(){tick++;if(tick<7)return;tick=0;
if(!stepSnek(me,true)){end('💀 You crashed!');return;}
ais.forEach(a=>{aiStep(a);stepSnek(a,false);});
document.getElementById('s').textContent=me.body.length;
document.getElementById('a1').textContent=ais[0].body.length;
document.getElementById('a2').textContent=ais[1].body.length;}
function end(w){if(!playing)return;playing=false;clearInterval(timer);beep(130,.35,'sawtooth');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML=w+'<br>You: '+me.body.length+' · AI1: '+ais[0].body.length+' · AI2: '+ais[1].body.length;}
function draw(){ctx.fillStyle='#292524';ctx.fillRect(0,0,W,W);
ctx.fillStyle='#eab30833';food.forEach(f=>ctx.fillRect(f.x*CELL,f.y*CELL,CELL,CELL));
ctx.font='14px serif';ctx.textAlign='center';
food.forEach(f=>ctx.fillText('🪲',f.x*CELL+10,f.y*CELL+14));
ais.forEach(a=>{a.body.forEach((s,i)=>{ctx.fillStyle=i===0?a.color:a.color+'aa';
ctx.beginPath();ctx.roundRect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2,4);ctx.fill();});});
me.body.forEach((s,i)=>{ctx.fillStyle=i===0?'#a855f7':'#a855f7aa';
ctx.beginPath();ctx.roundRect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2,4);ctx.fill();});
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{me={body:[{x:10,y:10}],dir:{x:1,y:0}};
ais=[{body:[{x:5,y:15}],dir:{x:1,y:0},color:'#22d3ee'},{body:[{x:15,y:5}],dir:{x:-1,y:0},color:'#f59e0b'}];
food=[];tick=0;time=90;spawnFood();spawnFood();
document.getElementById('s').textContent=3;document.getElementById('a1').textContent=3;document.getElementById('a2').textContent=3;
document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();
clearInterval(timer);timer=setInterval(()=>{time--;document.getElementById('t').textContent=time;
if(time<=0){const mx=Math.max(me.body.length,ais[0].body.length,ais[1].body.length);
const w=me.body.length===mx?'👑 You rule the pit!':'⏰ Time! The AI serpents out-grew you…';
end(w);}},1000);
draw();};
</script></body></html>
