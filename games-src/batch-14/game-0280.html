<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ninja Mirror Maze #280</title><style>
body{margin:0;font-family:system-ui;background:#0f172a;color:#e2e8f0;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#94a3b8;font-size:.78rem}
canvas{background:#1e293b;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}
#hud b{color:#facc15}
#msg{min-height:1.3em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#38bdf8;color:#0c4a6e;font-weight:800;cursor:pointer;margin:8px}
</style></head><body>
<h1>🪞 Ninja Mirror Maze</h1><div class="sub">Rotate mirrors to guide the light beam to the crystal!</div>
<div id="hud"><span>Level <b id="l">1</b></span><span>Rotations <b id="m">0</b></span><span>Best <b id="b">—</b></span></div>
<canvas id="cv" width="400" height="400"></canvas>
<div id="msg"></div>
<button id="btn">✨ New Chamber</button>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const N=8,CELL=50;
let mirrors=[],laser={r:0,c:0,d:0},goal={r:7,c:7},moves=0,level=1,playing=true,best=+localStorage.getItem('nmm_best')||Infinity;
// mirror types: 0=/, 1=\  ; laser dir: 0=R,1=D,2=L,3=U
function gen(){mirrors=[];for(let i=0;i<N;i++){const row=[];for(let j=0;j<N;j++)row.push(null);mirrors.push(row);}
// scatter mirrors
const nm=4+level;
for(let i=0;i<nm;i++){const r=(Math.random()*N)|0,c=(Math.random()*N)|0;
if((r===0&&c===0)||(r===N-1&&c===N-1))continue;
mirrors[r][c]={t:(Math.random()*2)|0};}
// ensure some mirrors on likely path for solvability (add a guaranteed chain)
for(let k=2;k<N-2;k+=3){if(!mirrors[0][k])mirrors[0][k]={t:0};}
goal={r:N-1,c:N-1};laser={r:0,c:0,d:0};
moves=0;playing=true;document.getElementById('m').textContent=0;document.getElementById('l').textContent=level;
draw();function msg(t){document.getElementById('msg').textContent=t;}
msg('Rotate mirrors — light must reach the crystal!');}
function trace(){let r=laser.r,c=laser.c,d=laser.d;const path=[[r,c]];
for(let step=0;step<64;step++){
const dr=[0,1,0,-1][d],dc=[1,0,-1,0][d];
r+=dr;c+=dc;
if(r<0||r>=N||c<0||c>=N)break;
path.push([r,c]);
const m=mirrors[r][c];
if(m){if(m.t===0){d=d===0?3:d===3?0:d===1?2:1;}
else{d=d===0?1:d===1?0:d===2?3:2;}}
if(r===goal.r&&c===goal.c){return{path,hit:true};}}
return{path,hit:false};}
function tap(r,c){if(!playing||!mirrors[r][c])return;
mirrors[r][c].t=1-mirrors[r][c].t;moves++;document.getElementById('m').textContent=moves;
beep(440+moves*15,.05);draw();
const t=trace();
if(t.hit){playing=false;beep(880,.25,'triangle');
if(moves<best){best=moves;localStorage.setItem('nmm_best',best);document.getElementById('b').textContent=best;}
msg('💎 Crystal charged in '+moves+' rotations! Level '+(level+1));
level++;setTimeout(gen,1000);}}
function draw(){ctx.fillStyle='#1e293b';ctx.fillRect(0,0,N*CELL,N*CELL);
const t=trace();
// grid
ctx.strokeStyle='#334155';
for(let i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,N*CELL);ctx.stroke();
ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(N*CELL,i*CELL);ctx.stroke;}
// laser path
ctx.strokeStyle=t.hit?'#22c55e':'#ef4444';ctx.lineWidth=4;ctx.lineCap='round';
if(t.path.length>1){ctx.beginPath();ctx.moveTo(t.path[0][1]*CELL+CELL/2,t.path[0][0]*CELL+CELL/2);
t.path.forEach(([r,c])=>ctx.lineTo(c*CELL+CELL/2,r*CELL+CELL/2));ctx.stroke();ctx.lineWidth=1;}
// laser source
ctx.fillStyle='#ef4444';ctx.fillRect(0,0,CELL/2,CELL/2);
ctx.font='16px serif';ctx.textAlign='center';ctx.fillText('🔦',CELL/4,CELL/4+5);
// goal
ctx.font='24px serif';ctx.fillText(t.hit?'💎':'🔘',goal.c*CELL+CELL/2,goal.r*CELL+CELL/2+8);
// mirrors
for(let r=0;r<N;r++)for(let c=0;c<N;c++){const m=mirrors[r][c];if(!m)continue;
ctx.save();ctx.translate(c*CELL+CELL/2,r*CELL+CELL/2);
ctx.rotate(m.t===0?-Math.PI/4:Math.PI/4);
ctx.fillStyle='#94a3b8';ctx.fillRect(-16,-4,32,8);ctx.restore();}
document.getElementById('b').textContent=best<Infinity?best:'—';}
cvs.addEventListener('pointerdown',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
const cx=Math.floor((e.clientX-r.left)/r.width*N),cy=Math.floor((e.clientY-r.top)/r.height*N);
AU.__c=AU.__c||new (window.AudioContext||window.webkitAudioContext)();tap(cy,cx);});
document.getElementById('btn').onclick=()=>{AU.__c=new (window.AudioContext||window.webkitAudioContext)();gen();};
gen();
</script></body></html>
