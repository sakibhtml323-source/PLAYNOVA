<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Star Navigate #406</title><style>
body{margin:0;font-family:system-ui;background:#0c1445;color:#e0e7ff;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#93c5fd;font-size:.78rem}
canvas{background:#111936;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#0c1445;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🧭 Desert Star Navigate</h1><div class="sub">The compass glows briefly at the start — memorize the oasis direction, then walk blind!</div>
<div id="hud"><span>Legs <b id="l">0</b>/5</span><span>Water <b id="w">100</b></span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="440" height="420"></canvas>
<div id="ov"><div style="font-size:3rem">⭐</div><p>Watch the compass arrow at each leg start.<br>Drag to walk — your water drains as you move!</p><button id="btn">Navigate</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=420;let me={x:W/2,y:H-60},oasis={x:0,y:0},compassA=0,compassShow=0,legs=0,water=100,playing=false,target=null,best=0;
document.getElementById('b').textContent=best;
function newLeg(){oasis={x:60+Math.random()*(W-120),y:60+Math.random()*(H-160)};
compassA=Math.atan2(oasis.y-me.y,oasis.x-me.x);
compassShow=90;document.getElementById('l').textContent=legs+1;
beep(500,.1);}
function gen(){me={x:W/2,y:H-60};legs=0;water=100;playing=true;target=null;
document.getElementById('w').textContent=100;newLeg();}
cvs.addEventListener('pointerdown',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
target={x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};});
cvs.addEventListener('pointermove',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
target={x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};});
function step(){if(compassShow>0){compassShow--;if(compassShow===0)beep(300,.1);}
if(target){const dx=target.x-me.x,dy=target.y-me.y,d=Math.hypot(dx,dy);
if(d>5){me.x+=dx/d*2.4;me.y+=dy/d*2.4;water=Math.max(0,water-0.25);
document.getElementById('w').textContent=Math.round(water);}}
if(water<=0){playing=false;beep(130,.35,'sawtooth');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🏜️ Perished of thirst!<br>Legs completed: '+legs;
if(legs>best){best=legs;document.getElementById('b').textContent=best;}return;}
if(Math.hypot(me.x-oasis.x,me.y-oasis.y)<28){legs++;beep(700,.15,'triangle');
water=Math.min(100,water+35);
if(legs>=5){playing=false;beep(880,.35,'triangle');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🏝️ Oasis reached! Journey complete!';
if(legs>best){best=legs;document.getElementById('b').textContent=best;}return;}
newLeg();}}
function draw(){ctx.fillStyle='#111936';ctx.fillRect(0,0,W,H);
for(let i=0;i<30;i++){ctx.fillStyle='#ffffff22';ctx.fillRect((i*89)%W,(i*61)%W,2,2);}
// oasis shimmer (very faint until reached)
ctx.globalAlpha=0.25;ctx.font='24px serif';ctx.textAlign='center';
ctx.fillText('🏝️',oasis.x,oasis.y+8);ctx.globalAlpha=1;
// compass
if(compassShow>0){const cx=W-50,cy=50;
ctx.strokeStyle='#fbbf24';ctx.lineWidth=3;
ctx.beginPath();ctx.arc(cx,cy,30,0,7);ctx.stroke();
ctx.beginPath();ctx.moveTo(cx,cy);
ctx.lineTo(cx+Math.cos(compassA)*24,cy+Math.sin(compassA)*24);ctx.stroke();}
ctx.font='26px serif';ctx.fillText('🚶',me.x,me.y+8);
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{gen();
document.getElementById('ov').style.display='none';
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();};
</script></body></html>
