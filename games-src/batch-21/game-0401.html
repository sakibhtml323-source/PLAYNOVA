<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ninja Sand Sprint #401</title><style>
body{margin:0;font-family:system-ui;background:#111827;color:#f9fafb;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#9ca3af;font-size:.78rem}
canvas{background:#1f2937;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#facc15}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#facc15;color:#111827;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🏃 Ninja Sand Sprint</h1><div class="sub">Tap to jump — quick taps hop, hold to leap! The dunes get steeper.</div>
<div id="hud"><span>Dist <b id="d">0</b>m</span><span>Best <b id="b">0</b></span><span>🏅 <b id="m">0</b></span></div>
<canvas id="cv" width="480" height="300"></canvas>
<div id="ov"><div style="font-size:3rem">🏜️</div><p>Tap = short hop · Hold = long leap<br>Grab 🏅 coins, dodge 🌵!</p><button id="btn">Run</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=480,H=300;let me={x:80,y:200,vy:0,onG:true},obs=[],coins=[],dist=0,medals=0,playing=false,spawnT=0,best=+localStorage.getItem('nss_best')||0;
document.getElementById('b').textContent=best;
let holdT=0;
function jump(){if(!playing||!me.onG)return;holdT=0;}
cvs.addEventListener('pointerdown',()=>{if(!playing)return;if(me.onG){me.vy=-8;me.onG=false;holdT=Date.now();}});
cvs.addEventListener('pointerup',()=>{if(!playing)return;const held=(Date.now()-holdT)/1000;
if(!me.onG&&held>0.15){me.vy-=4+held*3;}holdT=0;beep(500,.06);});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&playing&&me.onG){me.vy=-8;me.onG=false;holdT=Date.now();}});
document.addEventListener('keyup',e=>{if(e.code==='Space'&&playing&&!me.onG){const held=(Date.now()-holdT)/1000;
if(held>0.15)me.vy-=4+held*3;holdT=0;}});
function groundY(x){return 220+Math.sin(x*0.02)*24+Math.sin(x*0.007)*16;}
function spawn(){if(Math.random()<0.55){obs.push({x:W+30,e:'🌵'});}
else{coins.push({x:W+30,e:'🏅'});}}
function step(){dist+=0.08;
me.vy+=0.5;me.y+=me.vy;
const gy=groundY(dist*40);
if(me.y>=gy){me.y=gy;me.vy=0;me.onG=true;}
spawnT++;if(spawnT>Math.max(30,70-dist*0.01)){spawnT=0;spawn();}
obs.forEach(o=>o.x-=4.2);coins.forEach(c=>c.x-=4.2);
obs=obs.filter(o=>o.x>-30);coins=coins.filter(c=>c.x>-30);
obs.forEach(o=>{const oy=groundY((dist*40)+(o.x-me.x));
if(o.x<me.x+20&&o.x>me.x-12&&me.y>oy-30){die();}});
coins=coins.filter(c=>{if(c.x<me.x+18&&c.x>me.x-18&&Math.abs(c.y??(groundY(dist*40)+(c.x-me.x))-me.y)<30){
medals++;document.getElementById('m').textContent=medals;beep(700,.07);return false;}return true;});
document.getElementById('d').textContent=Math.floor(dist);}
function die(){if(!playing)return;playing=false;beep(130,.35,'sawtooth');
const d=Math.floor(dist);if(d>best){best=d;localStorage.setItem('nss_best',best);document.getElementById('b').textContent=best;}
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🌵 Ouch! '+d+'m · 🏅'+medals;}
function draw(){ctx.fillStyle='#1f2937';ctx.fillRect(0,0,W,H);
// terrain
ctx.fillStyle='#374151';ctx.beginPath();ctx.moveTo(0,H);
for(let x=0;x<W;x+=8){ctx.lineTo(x,groundY(dist*40+(x-me.x)));}
ctx.lineTo(W,H);ctx.fill();
obs.forEach(o=>{ctx.font='26px serif';ctx.textAlign='center';
ctx.fillText(o.e,o.x,groundY(dist*40+(o.x-me.x))+4);});
coins.forEach(c=>{ctx.font='20px serif';ctx.fillText('🏅',c.x,groundY(dist*40+(c.x-me.x))-18);});
ctx.font='28px serif';ctx.fillText('🏃',me.x,me.y+6);
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{me={x:80,y:200,vy:0,onG:true};obs=[];coins=[];dist=0;medals=0;spawnT=0;
document.getElementById('d').textContent=0;document.getElementById('m').textContent=0;
document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();};
</script></body></html>
