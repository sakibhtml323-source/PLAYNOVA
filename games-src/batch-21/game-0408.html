<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ninja Web Swing #408</title><style>
body{margin:0;font-family:system-ui;background:#111827;color:#f9fafb;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#9ca3af;font-size:.78rem}
canvas{background:#1f2937;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#facc15}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#facc15;color:#111827;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🕸️ Ninja Web Swing</h1><div class="sub">Tap an anchor to shoot a web — release to fly! Swing across the chasm.</div>
<div id="hud"><span>Dist <b id="d">0</b>m</span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="440" height="420"></canvas>
<div id="ov"><div style="font-size:3rem">🥷</div><p>Tap the glowing anchors to web-swing.<br>Release (second tap) to let go and fly!</p><button id="btn">Swing</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=420;let me={x:60,y:200,vx:0,vy:0},web=null,anchors=[],dist=0,playing=false,best=+localStorage.getItem('nws2_best')||0;
document.getElementById('b').textContent=best;
function gen(){me={x:60,y:200,vx:0,vy:0};web=null;dist=0;playing=true;
anchors=[];for(let i=0;i<6;i++){anchors.push({x:150+i*90,y:80+Math.sin(i*1.2)*60,ph:Math.random()*6});}
document.getElementById('d').textContent=0;draw();}
cvs.addEventListener('pointerdown',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
if(web){// release
const dx=me.x-web.x,dy=me.y-web.y,d=Math.hypot(dx,dy)||1;
me.vx=dx/d*9+me.vx*0.3;me.vy=dy/d*9+me.vy*0.3;
web=null;beep(600,.08);}
else{const hit=anchors.find(a=>Math.hypot(a.x-x,a.y-y)<34);
if(hit&&Math.hypot(hit.x-me.x,hit.y-me.y)<200){web=hit;beep(400,.08);}}});
function step(){anchors.forEach(a=>{a.ph+=0.03;});
if(web){// pendulum
const dx=web.x-me.x,dy=web.y-me.y,d=Math.hypot(dx,dy)||1;
const fx=dx/d,fy=dy/d;
me.vx+=fx*0.12;me.vy+=fy*0.12+0.08;
me.vx*=0.995;me.vy*=0.995;
me.x+=me.vx;me.y+=me.vy;
// constrain
const nd=Math.hypot(me.x-web.x,me.y-web.y);
if(nd>160){me.x=web.x+dx/d*160;me.y=web.y+dy/d*160;}}
else{me.vy+=0.14;me.x+=me.vx;me.y+=me.vy;}
me.x=Math.max(16,Math.min(W-16,me.x));
dist=Math.max(dist,me.x-60);document.getElementById('d').textContent=Math.floor(dist);
if(me.y>H-20){playing=false;beep(130,.35,'sawtooth');
if(Math.floor(dist)>best){best=Math.floor(dist);localStorage.setItem('nws2_best',best);document.getElementById('b').textContent=best;}
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🕳️ Fell into the chasm!<br>Distance: <b style="color:#facc15">'+Math.floor(dist)+'m</b>';}
if(me.x>=W-30){playing=false;beep(880,.3,'triangle');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🏁 Across the chasm! '+Math.floor(dist)+'m';}}
function draw(){ctx.fillStyle='#1f2937';ctx.fillRect(0,0,W,H);
// chasm
ctx.fillStyle='#0a0a0a';ctx.fillRect(0,H-16,W,16);
// anchors
anchors.forEach(a=>{const ay=a.y+Math.sin(a.ph)*6;
ctx.beginPath();ctx.arc(a.x,ay,10,0,7);
ctx.strokeStyle='#facc15';ctx.lineWidth=2;ctx.stroke();ctx.lineWidth=1;});
if(web){ctx.strokeStyle='#e5e7eb';ctx.beginPath();ctx.moveTo(me.x,me.y);
ctx.lineTo(web.x,web.y+Math.sin(web.ph)*6);ctx.stroke();}
ctx.font='24px serif';ctx.textAlign='center';ctx.fillText('🥷',me.x,me.y+8);
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{gen();
document.getElementById('ov').style.display='none';
AU.__c=new (window.AudioContext||window.webkitAudioContext)();};
</script></body></html>
