<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crystal Comet Catch #420</title><style>
body{margin:0;font-family:system-ui;background:#0c1445;color:#e0e7ff;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#93c5fd;font-size:.78rem}
canvas{background:#111936;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#0c1445;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>☄️ Crystal Comet Catch</h1><div class="sub">Comets fall in colors — move the matching colored net to catch them!</div>
<div id="hud"><span>Caught <b id="c">0</b></span><span>Missed <b id="x">0</b>/3</span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="440" height="420"></canvas>
<div id="ov"><div style="font-size:3rem">🌠</div><p>Drag the net — press 1/2/3 or tap the color buttons to switch net color!<br>Only same-color comets count.</p><button id="btn">Catch</button></div>
<div id="cols" style="display:flex;gap:8px;margin:6px">
<button class="cb" data-c="0" style="background:#7c3aed;color:#fff;padding:8px 14px;border-radius:8px;border:none">💜</button>
<button class="cb" data-c="1" style="background:#3b82f6;color:#fff;padding:8px 14px;border-radius:8px;border:none">💙</button>
<button class="cb" data-c="2" style="background:#22c55e;color:#fff;padding:8px 14px;border-radius:8px;border:none">💚</button>
</div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=420;const CCOLORS=[['#7c3aed','💜'],['#3b82f6','💙'],['#22c55e','💚']];
let net={x:W/2,y:H-50,c:0},comets=[],caught=0,missed=0,playing=false,spawnT=0,best=+localStorage.getItem('ccc_best')||0;
document.getElementById('b').textContent=best;
function spawn(){comets.push({x:20+Math.random()*(W-40),y:-16,vy:1.6+Math.random()*2+caught*0.04,
c:(Math.random()*3)|0});}
cvs.addEventListener('pointermove',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
net.x=(e.clientX-r.left)*W/r.width;});
document.querySelectorAll('.cb').forEach(b=>b.onclick=()=>{net.c=+b.dataset.c;beep(400+net.c*100,.06);});
document.addEventListener('keydown',e=>{if(!playing)return;
if(e.key==='1')net.c=0;if(e.key==='2')net.c=1;if(e.key==='3')net.c=2;});
function step(){spawnT++;if(spawnT>Math.max(30,60-caught*0.4)){spawnT=0;spawn();}
comets.forEach(c=>c.y+=c.vy);
comets=comets.filter(c=>{if(c.y>H-70){if(Math.abs(c.x-net.x)<44&&c.c===net.c){
caught++;document.getElementById('c').textContent=caught;
beep(600+caught*15,.08);
if(caught>best){best=caught;localStorage.setItem('ccc_best',best);document.getElementById('b').textContent=best;}
return false;}
if(c.c===net.c&&Math.abs(c.x-net.x)<44){// wrong color through net
return c.y<H+20;}
if(c.y>=H-16){missed++;document.getElementById('x').textContent=missed;
beep(150,.15,'sawtooth');
if(missed>=3){playing=false;
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🌌 Comet storm over!<br>Caught: <b style="color:#fbbf14">'+caught+'</b>';}}
return c.y<H+20;}
return true;});}
function draw(){ctx.fillStyle='#111936';ctx.fillRect(0,0,W,H);
for(let i=0;i<25;i++){ctx.fillStyle='#ffffff22';ctx.fillRect((i*89)%W,(i*61)%W,2,2);}
comets.forEach(c=>{ctx.font='22px serif';ctx.textAlign='center';
ctx.fillText(CCOLORS[c.c][1],c.x,c.y);});
// net
ctx.strokeStyle=CCOLORS[net.c][0];ctx.lineWidth=4;
ctx.strokeRect(net.x-44,H-64,88,16);
ctx.font='20px serif';ctx.fillText(CCOLORS[net.c][1],net.x,H-50);
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{comets=[];caught=0;missed=0;spawnT=0;net.c=0;
document.getElementById('c').textContent=0;document.getElementById('x').textContent=0;
document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();};
</script></body></html>
