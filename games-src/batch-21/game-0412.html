<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Royal Joust Duel #412</title><style>
body{margin:0;font-family:system-ui;background:#1e1b4b;color:#eef2ff;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a5b4fc;font-size:.78rem}
canvas{background:#312e81;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#1e1b4b;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🐎 Royal Joust Duel</h1><div class="sub">2P duel: P1 taps left half, P2 taps right half — strike when your lance aligns!</div>
<div id="hud"><span>P1 ❤️ <b id="h1">3</b></span><span>P2 ❤️ <b id="h2">3</b></span><span>Round <b id="r">1</b></span></div>
<canvas id="cv" width="440" height="340"></canvas>
<div id="ov"><div style="font-size:3rem">⚔️</div><p>P1 = tap LEFT half · P2 = tap RIGHT half<br>Tap when your swinging lance points at the ring!</p><button id="btn">Joust</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=340;let a1=0,a2=0,t1=0,t2=0,h1=3,h2=3,round=1,playing=false,cd=0;
function zones(){return[{x:110,y:170},{x:W-110,y:170}];}
cvs.addEventListener('pointerdown',e=>{if(!playing||cd>0)return;const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)*W/r.width;
const zs=zones();const z=x<W/2?zs[0]:zs[1];
const a=x<W/2?a1:a2;
const target=Math.atan2(z.y-(x<W/2?H-60:H-60),z.x-(x<W/2?90:W-90));
const diff=Math.abs(((a-target)%(Math.PI*2)+Math.PI*3)%(Math.PI*2)-Math.PI);
const p=x<W/2?1:2;
if(diff<0.2){if(p===1){h2--;document.getElementById('h2').textContent=h2;}
else{h1--;document.getElementById('h1').textContent=h1;}
beep(700,.15,'triangle');cd=45;}
else{beep(200,.1,'sawtooth');cd=25;}
if(h1<=0||h2<=0){playing=false;
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML=h1>h2?'🫅 P1 unseats P2!':'🤴 P2 unseats P1!';}});
function step(){t1+=0.045+round*0.004;t2+=0.05+round*0.003;
a1=Math.sin(t1)*1.1;a2=Math.sin(t2)*1.1;
if(cd>0)cd--;}
function draw(){ctx.fillStyle='#312e81';ctx.fillRect(0,0,W,H);
ctx.strokeStyle='#fbbf24';ctx.lineWidth=3;
zones().forEach(z=>{ctx.beginPath();ctx.arc(z.x,z.y,24,0,7);ctx.stroke();});
ctx.lineWidth=1;
// knights
const ks=[{x:90,yc:H-60,a:a1,e:'🛡️',c:'#60a5fa'},{x:W-90,yc:H-60,a:a2,e:'⚔️',c:'#f87171'}];
ks.forEach(k=>{ctx.save();ctx.translate(k.x,k.yc);ctx.rotate(k.a);
ctx.strokeStyle=k.c;ctx.lineWidth=4;
ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(80,0);ctx.stroke();ctx.lineWidth=1;
ctx.font='30px serif';ctx.textAlign='center';ctx.fillText('🐎',0,0);ctx.restore();});
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{h1=3;h2=3;round=1;cd=0;playing=true;
document.getElementById('h1').textContent=3;document.getElementById('h2').textContent=3;
document.getElementById('r').textContent=1;document.getElementById('ov').style.display='none';
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();};
</script></body></html>
