<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Royal Torch Run #415</title><style>
body{margin:0;font-family:system-ui;background:#1e1b4b;color:#eef2ff;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a5b4fc;font-size:.78rem}
canvas{background:#312e81;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#1e1b4b;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🔥 Royal Torch Run</h1><div class="sub">Carry the flame through the wind — light every brazier before your torch dies!</div>
<div id="hud"><span>Torch <b id="t">100</b></span><span>Braziers <b id="b">0</b>/4</span><span>⏱️ <b id="tm">0</b>s</span></div>
<canvas id="cv" width="440" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">🕯️</div><p>Drag to move — the WIND blows your flame!<br>Stand still to recover the torch.</p><button id="btn">Run</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=400;let me={x:40,y:H/2},braziers=[],lit=0,fire=100,wind=0,windT=0,playing=false,target=null,startT=0;
function gen(){me={x:40,y:H/2};lit=0;fire=100;wind=0;windT=0;playing=true;target=null;startT=Date.now();
braziers=[];for(let i=0;i<4;i++){braziers.push({x:120+i*90,y:60+Math.random()*(H-120),lit:false});}
document.getElementById('t').textContent=100;document.getElementById('b').textContent=0;document.getElementById('tm').textContent=0;}
cvs.addEventListener('pointermove',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
target={x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};});
function step(){windT++;if(windT>70){windT=0;wind=(Math.random()*2-1)*1.6;}
const moving=!!target;
if(moving){const dx=target.x-me.x,dy=target.y-me.y,d=Math.hypot(dx,dy);
if(d>4){me.x+=dx/d*2.6;me.y+=dy/d*2.6;
fire=Math.max(0,fire-0.35-Math.abs(wind)*0.15);}}
else{fire=Math.min(100,fire+0.3);}
me.x=Math.max(16,Math.min(W-16,me.x+wind*0.4));me.y=Math.max(16,Math.min(H-16,me.y));
document.getElementById('t').textContent=Math.round(fire);
braziers.forEach(b=>{if(!b.lit&&Math.hypot(b.x-me.x,b.y-me.y)<28){b.lit=true;lit++;
document.getElementById('b').textContent=lit;beep(700,.15,'triangle');
if(lit>=4){win();}}});
if(fire<=0){playing=false;beep(130,.35,'sawtooth');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🕯️ Torch out!<br>Lit '+lit+'/4 in '+((Date.now()-startT)/1000).toFixed(1)+'s';return;}
document.getElementById('tm').textContent=((Date.now()-startT)/1000).toFixed(1);}
function win(){playing=false;beep(880,.3,'triangle');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🏰 All braziers lit!<br>'+((Date.now()-startT)/1000).toFixed(1)+'s';}
function draw(){ctx.fillStyle='#312e81';ctx.fillRect(0,0,W,H);
braziers.forEach(b=>{ctx.font='26px serif';ctx.textAlign='center';
ctx.fillText(b.lit?'🔥':'🕯️',b.x,b.y+8);});
// wind streaks
ctx.fillStyle='#93c5fd44';
for(let i=0;i<6;i++)ctx.fillRect((Date.now()/8+i*70)%W,40+i*60,wind*14,2);
ctx.font='28px serif';ctx.fillText('🏃',me.x,me.y+8);}
document.getElementById('btn').onclick=()=>{gen();
document.getElementById('ov').style.display='none';
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();};
</script></body></html>
