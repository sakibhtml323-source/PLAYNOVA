<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ninja Shadow Clone #413</title><style>
body{margin:0;font-family:system-ui;background:#111827;color:#f9fafb;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#9ca3af;font-size:.78rem}
canvas{background:#1f2937;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#facc15}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#facc15;color:#111827;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>👥 Ninja Shadow Clone</h1><div class="sub">The ninja splits into clones — only ONE casts a shadow. Tap the real ninja!</div>
<div id="hud"><span>Round <b id="r">1</b></span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="440" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">👤</div><p>All clones look identical — but the REAL one casts a faint shadow.<br>Tap it before they vanish!</p><button id="btn">Find</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=400;let clones=[],real=0,round=1,phase='show',t=0,best=+localStorage.getItem('nsc_best')||0,life=0;
document.getElementById('b').textContent=best;
function newRound(){const n=Math.min(3+round,8);clones=[];real=(Math.random()*n)|0;
for(let i=0;i<n;i++){clones.push({x:50+Math.random()*(W-100),y:50+Math.random()*(H-100),
dx:(Math.random()*2-1)*1.2,dy:(Math.random()*2-1)*1.2});}
phase='show';t=0;life=Math.max(90,220-round*12);
document.getElementById('r').textContent=round;draw();}
cvs.addEventListener('pointerdown',e=>{if(phase!=='show')return;const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
let bi=-1,bd=1e9;
clones.forEach((c,i)=>{const d=Math.hypot(c.x-x,c.y-y);if(d<bd){bd=d;bi=i;}});
if(bi<0)return;
if(bi===real){beep(880,.25,'triangle');round++;
if(round>best){best=round;localStorage.setItem('nsc_best',best);document.getElementById('b').textContent=best;}
newRound();}
else{beep(150,.2,'sawtooth');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🌫️ That was a clone! Reached round '+round;
phase='over';}});
function step(){t++;clones.forEach(c=>{c.x+=c.dx;c.y+=c.dy;
if(c.x<30||c.x>W-30)c.dx*=-1;if(c.y<30||c.y>H-30)c.dy*=-1;});
life--;
if(life<=0){phase='over';
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='⏰ They vanished! Reached round '+round;
beep(130,.3,'sawtooth');}}
function draw(){ctx.fillStyle='#1f2937';ctx.fillRect(0,0,W,H);
const lightA=t*0.01;
const lx=Math.cos(lightA),ly=Math.sin(lightA)*0.4+0.8;
clones.forEach((c,i)=>{const isReal=i===real;
// shadow only for real one
if(isReal){ctx.globalAlpha=0.35;
ctx.beginPath();ctx.ellipse(c.x-lx*14,c.y+18,10,4,0,0,7);
ctx.fillStyle='#000';ctx.fill();ctx.globalAlpha=1;}
ctx.font='26px serif';ctx.textAlign='center';ctx.fillText('🥷',c.x,c.y+8);});
if(phase==='show'){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{round=1;
document.getElementById('ov').style.display='none';
AU.__c=new (window.AudioContext||window.webkitAudioContext)();newRound();};
</script></body></html>
