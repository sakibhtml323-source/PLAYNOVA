<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crystal Pond Ripple #405</title><style>
body{margin:0;font-family:system-ui;background:#0c4a6e;color:#e0f2fe;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#7dd3fc;font-size:.78rem}
canvas{background:#075985;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#38bdf8;color:#0c4a6e;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🪷 Crystal Pond Ripple</h1><div class="sub">Tap the water to send ripples — push the lotus to the glowing edge!</div>
<div id="hud"><span>Delivered <b id="d">0</b>/3</span><span>Ripples <b id="r">20</b></span></div>
<canvas id="cv" width="440" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">🪷</div><p>Tap anywhere — the ripple pushes the lotus away.<br>Guide it to the glowing ring!</p><button id="btn">Float</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=400;let lotus={x:W/2,y:H/2,vx:0,vy:0},ripples=[],delivered=0,ripplesLeft=20,playing=false,goalA=0;
function newLotus(){lotus={x:W/2,y:H/2,vx:0,vy:0};
goalA=Math.random()*Math.PI*2;}
cvs.addEventListener('pointerdown',e=>{if(!playing||ripplesLeft<=0)return;const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
ripples.push({x,y,r:4,max:120});
ripplesLeft--;document.getElementById('r').textContent=ripplesLeft;
beep(300,.12);});
function step(){ripples.forEach(rp=>{rp.r+=2.5;
// push lotus
const d=Math.hypot(lotus.x-rp.x,lotus.y-rp.y);
if(Math.abs(d-rp.r)<22){const a=Math.atan2(lotus.y-rp.y,lotus.x-rp.x);
lotus.vx+=Math.cos(a)*0.7;lotus.vy+=Math.sin(a)*0.7;}});
ripples=ripples.filter(rp=>rp.r<rp.max);
lotus.vx*=0.95;lotus.vy*=0.95;
lotus.x+=lotus.vx;lotus.y+=lotus.vy;
// goal ring
const gx=W/2+Math.cos(goalA)*170,gy=H/2+Math.sin(goalA)*150;
if(Math.hypot(lotus.x-gx,lotus.y-gy)<26){delivered++;document.getElementById('d').textContent=delivered;
beep(700,.15,'triangle');newLotus();
if(delivered>=3){playing=false;beep(880,.3,'triangle');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🪷 All lotuses delivered!<br>Ripples left: '+ripplesLeft;}}
if(ripplesLeft<=0&&!ripples.length){playing=false;beep(130,.3,'sawtooth');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='💧 Ripples spent!<br>Delivered: '+delivered+'/3';}}
function draw(){ctx.fillStyle='#075985';ctx.fillRect(0,0,W,H);
// goal
const gx=W/2+Math.cos(goalA)*170,gy=H/2+Math.sin(goalA)*150;
ctx.strokeStyle='#fbbf24';ctx.lineWidth=3;ctx.setLineDash([5,5]);
ctx.beginPath();ctx.arc(gx,gy,26,0,7);ctx.stroke();ctx.setLineDash([]);
// ripples
ripples.forEach(rp=>{ctx.strokeStyle='#7dd3fc'+(1-rp.r/rp.max)*0.8;
ctx.lineWidth=2;ctx.beginPath();ctx.arc(rp.x,rp.y,rp.r,0,7);ctx.stroke();});
ctx.lineWidth=1;
ctx.font='28px serif';ctx.textAlign='center';ctx.fillText('🪷',lotus.x,lotus.y+8);
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{ripples=[];delivered=0;ripplesLeft=20;playing=true;
document.getElementById('d').textContent=0;document.getElementById('r').textContent=20;
document.getElementById('ov').style.display='none';newLotus();
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();};
newLotus();
</script></body></html>
