<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Dune Board #411</title><style>
body{margin:0;font-family:system-ui;background:#451a03;color:#fef3c7;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#fde68a;font-size:.78rem}
canvas{background:#78350f;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#451a03;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🏂 Desert Dune Board</h1><div class="sub">Sandboard down the dune — momentum grows! Jump rocks, carve for coins.</div>
<div id="hud"><span>Dist <b id="d">0</b>m</span><span>Coins <b id="c">0</b></span><span>Speed <b id="s">1×</b></span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="440" height="420"></canvas>
<div id="ov"><div style="font-size:3rem">🏜️</div><p>Tap/Space to jump.<br>Move mouse to carve left/right — speed builds!</p><button id="btn">Board</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=420;let me={x:W/2,y:100,vy:0},obs=[],coins=[],dist=0,cn=0,speed=1,playing=false,spawnT=0,best=+localStorage.getItem('ddb_best')||0;
document.getElementById('b').textContent=best;
let targetX=W/2;
cvs.addEventListener('pointermove',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
targetX=(e.clientX-r.left)*W/r.width;});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&playing)jump();});
cvs.addEventListener('pointerdown',()=>{if(playing)jump();});
function jump(){if(me.vy!==0)return;me.vy=-9;beep(500,.06);}
function duneY(x){return 60+Math.sin(x*0.02)*20;}
function spawn(){if(Math.random()<0.6){obs.push({x:20+Math.random()*(W-40),y:H+30,e:'🪨'});}
else{coins.push({x:20+Math.random()*(W-40),y:H+30});}}
function step(){speed=Math.min(3.5,1+dist*0.002);
dist+=speed*0.06;cn=cn;
me.x+=(targetX-me.x)*0.08;
me.vy+=0.4;me.y+=me.vy;
if(me.y>100){me.y=100;me.vy=0;}
spawnT++;if(spawnT>Math.max(20,45-dist*0.008)){spawnT=0;spawn();}
obs.forEach(o=>o.y-=speed*3.2);coins.forEach(c=>c.y-=speed*3.2);
obs=obs.filter(o=>o.y>-30);coins=coins.filter(c=>c.y>-30);
obs.forEach(o=>{if(o.y<me.y+20&&o.y>me.y-24&&Math.abs(o.x-me.x)<24&&me.y>=99){die();}});
coins=coins.filter(c=>{if(c.y<me.y+20&&c.y>me.y-20&&Math.abs(c.x-me.x)<24){cn++;
document.getElementById('c').textContent=cn;beep(700,.07);return false;}return true;});
document.getElementById('d').textContent=Math.floor(dist);
document.getElementById('s').textContent=speed.toFixed(1)+'×';}
function die(){if(!playing)return;playing=false;beep(130,.35,'sawtooth');
const d=Math.floor(dist);if(d>best){best=d;localStorage.setItem('ddb_best',best);document.getElementById('b').textContent=best;}
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🪨 Wipeout at '+d+'m!<br>Coins: '+cn;}
function draw(){ctx.fillStyle='#78350f';ctx.fillRect(0,0,W,H);
// dunes perspective lines
ctx.strokeStyle='#92400e';
for(let i=0;i<6;i++){const y=(dist*3+i*90)%(H+90)-45;
ctx.beginPath();ctx.moveTo(0,y);ctx.quadraticCurveTo(W/2,y+14,W,y);ctx.stroke();}
ctx.font='26px serif';ctx.textAlign='center';
obs.forEach(o=>ctx.fillText(o.e,o.x,o.y));
coins.forEach(c=>{ctx.fillText('🏅',c.x,c.y);});
ctx.font='30px serif';ctx.fillText('🏂',me.x,me.y+8);
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{me={x:W/2,y:100,vy:0};obs=[];coins=[];dist=0;cn=0;speed=1;spawnT=0;
document.getElementById('d').textContent=0;document.getElementById('c').textContent=0;
document.getElementById('s').textContent='1×';
document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();};
</script></body></html>
