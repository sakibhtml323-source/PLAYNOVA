<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Night Watch #402</title><style>
body{margin:0;font-family:system-ui;background:#0a0a1a;color:#e2e8f0;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#94a3b8;font-size:.78rem}
canvas{background:#111122;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#0a0a1a;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🌙 Desert Night Watch</h1><div class="sub">Bandits creep through the dark camp — tap them before they reach the fire!</div>
<div id="hud"><span>Fire ❤️ <b id="h">10</b></span><span>Caught <b id="c">0</b></span><span>Wave <b id="w">1</b></span></div>
<canvas id="cv" width="440" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">🔥</div><p>Bandits are nearly invisible in the dark.<br>Tap their faint outlines before they strike the fire!</p><button id="btn">Watch</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=400;let fire={x:W/2,y:H/2},bandits=[],hp=10,caught=0,wave=1,playing=false,spawnT=0,t=0;
function spawn(){const a=Math.random()*Math.PI*2;
bandits.push({x:W/2+Math.cos(a)*260,y:H/2+Math.sin(a)*240,
sp:0.5+wave*0.12+Math.random()*0.3,ph:Math.random()*6,vis:0.06+Math.random()*0.08});}
cvs.addEventListener('pointerdown',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
let bi=-1,bd=1e9;
bandits.forEach((b,i)=>{const d=Math.hypot(b.x-x,b.y-y);if(d<bd){bd=d;bi=i;}});
if(bi>=0&&bd<26){caught++;document.getElementById('c').textContent=caught;
beep(600+caught*20,.09);bandits.splice(bi,1);}
else beep(180,.06,'sawtooth');});
function step(){t++;spawnT++;if(spawnT>Math.max(50,110-wave*8)){spawnT=0;spawn();}
bandits.forEach(b=>{b.ph+=0.05;
const dx=fire.x-b.x,dy=fire.y-b.y,d=Math.hypot(dx,dy)||1;
b.x+=dx/d*b.sp;b.y+=dy/d*b.sp;
// visibility pulses when near fire
b.vis=Math.min(0.6,b.vis+0.002);
if(d<30){hp--;document.getElementById('h').textContent=Math.max(0,hp);
beep(150,.2,'sawtooth');b.dead=true;
if(hp<=0){playing=false;beep(130,.35,'sawtooth');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🔥 Fire extinguished!<br>Wave '+wave+' · Caught '+caught;}}});
bandits=bandits.filter(b=>!b.dead);
if(!bandits.length&&spawnT>40){wave++;document.getElementById('w').textContent=wave;}}
function draw(){ctx.fillStyle='#111122';ctx.fillRect(0,0,W,H);
// fire glow
const g2=ctx.createRadialGradient(fire.x,fire.y,10,fire.x,fire.y,120);
g2.addColorStop(0,'#fbbf2466');g2.addColorStop(1,'#fbbf2400');
ctx.fillStyle=g2;ctx.beginPath();ctx.arc(fire.x,fire.y,120,0,7);ctx.fill();
ctx.font='28px serif';ctx.textAlign='center';ctx.fillText('🔥',fire.x,fire.y+10);
// tents (static)
ctx.font='20px serif';
[[80,90],[360,90],[80,320],[360,320]].forEach(([x,y])=>ctx.fillText('⛺',x,y));
// bandits: faint shimmer
bandits.forEach(b=>{const shimmer=0.5+0.5*Math.sin(t*0.15+b.ph);
ctx.globalAlpha=b.vis*shimmer+0.05;
ctx.fillStyle='#dc2626';
ctx.beginPath();ctx.arc(b.x,b.y+Math.sin(b.ph)*3,9,0,7);ctx.fill();
ctx.globalAlpha=1;});
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{bandits=[];hp=10;caught=0;wave=1;spawnT=0;
document.getElementById('h').textContent=10;document.getElementById('c').textContent=0;
document.getElementById('w').textContent=1;document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();};
</script></body></html>
