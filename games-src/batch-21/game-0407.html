<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Royal Cannon Aim #407</title><style>
body{margin:0;font-family:system-ui;background:#1e1b4b;color:#eef2ff;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a5b4fc;font-size:.78rem}
canvas{background:#312e81;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#1e1b4b;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🎯 Royal Cannon Aim</h1><div class="sub">Drag back to set angle & power — hit the enemy tower before they hit yours!</div>
<div id="hud"><span>Your ❤️ <b id="h1">10</b></span><span>Enemy ❤️ <b id="h2">10</b></span><span>Round <b id="r">1</b></span></div>
<canvas id="cv" width="440" height="360"></canvas>
<div id="ov"><div style="font-size:3rem">💣</div><p>Drag from your cannon — longer drag = more power.<br>Take turns with the enemy cannon!</p><button id="btn">Fire</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=360,GY=H-40;
let myBase={x:50,y:GY},foeBase={x:W-50,y:GY},ball=null,drag=null,myTurn=true,hp1=10,hp2=10,round=1,playing=false;
cvs.addEventListener('pointerdown',e=>{if(!playing||!myTurn||ball)return;const r=cvs.getBoundingClientRect();
drag={x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};});
cvs.addEventListener('pointerup',e=>{if(!drag||!playing)return;const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
const dx=drag.x-x,dy=drag.y-y;
ball={x:myBase.x,y:myBase.y-20,vx:dx*0.14,vy:dy*0.14,mine:true};
beep(500,.1);drag=null;myTurn=false;});
function step(){if(!ball)return;
ball.vy+=0.22;ball.x+=ball.vx;ball.y+=ball.vy;
// hit ground
if(ball.y>GY){if(ball.mine){const d=Math.abs(ball.x-foeBase.x);
if(d<26){hp2--;document.getElementById('h2').textContent=hp2;
beep(150,.2,'sawtooth');if(hp2<=0)win(true);}
else beep(200,.1,'sawtooth');}
else{const d=Math.abs(ball.x-myBase.x);
if(d<26){hp1--;document.getElementById('h1').textContent=hp1;
beep(150,.2,'sawtooth');if(hp1<=0)win(false);}}
ball=null;
if(playing&&!ball){setTimeout(enemyFire,800);}
return;}
// direct hit in air
const tb=ball.mine?foeBase:myBase;
if(Math.hypot(ball.x-tb.x,ball.y-(tb.y-20))<24){
if(ball.mine){hp2--;document.getElementById('h2').textContent=hp2;if(hp2<=0){win(true);return;}}
else{hp1--;document.getElementById('h1').textContent=hp1;if(hp1<=0){win(false);return;}}
ball=null;if(playing)setTimeout(enemyFire,800);return;}}
function enemyFire(){if(!playing)return;
const a=Math.PI*(0.7+Math.random()*0.2);
const pw=6+round*0.3+Math.random()*2;
ball={x:foeBase.x,y:foeBase.y-20,vx:-Math.cos(a)*pw,vy:-Math.sin(a)*pw,mine:false};
myTurn=true;round++;document.getElementById('r').textContent=round;beep(300,.1);}
function win(mine){playing=false;beep(mine?880:130,.4,mine?'triangle':'sawtooth');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML=(mine?'🏆 You destroyed the enemy tower!':'💥 Your tower fell!')+'<br>Round '+round;}
function draw(){ctx.fillStyle='#312e81';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#4338ca';ctx.fillRect(0,GY,W,H-GY);
// bases
ctx.font='30px serif';ctx.textAlign='center';
ctx.fillText('🏰',myBase.x,GY+4);ctx.fillText('🏯',foeBase.x,GY+4);
if(!myTurn&&!ball){ctx.font='14px serif';ctx.fillText('Enemy aiming…',W/2,30);}
if(drag){ctx.strokeStyle='#fbbf2455';ctx.setLineDash([4,4]);
ctx.beginPath();ctx.moveTo(myBase.x,myBase.y-20);ctx.lineTo(drag.x,drag.y);ctx.stroke();ctx.setLineDash([]);}
if(ball){ctx.beginPath();ctx.arc(ball.x,ball.y,6,0,7);
ctx.fillStyle=ball.mine?'#fbbf24':'#ef4444';ctx.fill();}
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{hp1=10;hp2=10;round=1;ball=null;myTurn=true;playing=true;
document.getElementById('h1').textContent=10;document.getElementById('h2').textContent=10;
document.getElementById('r').textContent=1;document.getElementById('ov').style.display='none';
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();};
</script></body></html>
