<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Party Game: Egyptian Edition</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{background:linear-gradient(#fef3c7,#fde68a);font-family:Georgia,serif;min-height:100vh;display:flex;flex-direction:column;overflow:hidden}
#top{text-align:center;padding:8px;color:#78350f;font-size:.9rem}
#top b{color:#b45309}
#arena{flex:1;display:flex;position:relative}
.half{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
#h1{background:rgba(217,119,6,.15)}
#h2{background:rgba(120,53,15,.15)}
.p{font-size:3rem;font-weight:800;color:#78350f}
.l{font-size:.8rem;color:#92400e;margin-top:4px}
#cmd{position:fixed;top:42%;left:50%;transform:translate(-50%,-50%);font-size:1.8rem;font-weight:800;text-align:center;pointer-events:none;text-shadow:0 2px 8px #fff;z-index:4;min-height:2.4rem;color:#7c2d12}
#ov{position:fixed;inset:0;background:rgba(254,243,199,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#78350f;padding:20px;z-index:9}
button{background:#b45309;color:#fff;border:none;font-family:inherit;font-weight:700;padding:13px 36px;border-radius:26px;font-size:1rem;cursor:pointer;margin-top:14px}
#score{color:#78350f;font-size:.8rem;margin-top:8px}
@media(max-width:480px){#cmd{font-size:1.2rem}.p{font-size:2.2rem}}
</style>
</head>
<body>
<div id="top">🏺 EGYPTIAN PARTY — <span id="who">…</span> | P1 <b id="s1">0</b> — <b id="s2">0</b> P2 | Round <b id="r">1</b>/5</div>
<div id="arena">
<div class="half" id="h1"><div class="p">🐫</div><div class="l">P1 — tap left / press Z</div></div>
<div class="half" id="h2"><div class="p">🐈</div><div class="l">P2 — tap right / press M</div></div>
</div>
<div id="cmd"></div>
<div id="ov"><h2>🏺 PHARAOH'S PARTY</h2><p id="od">2 players! When <b>👁️ BASTET SEES YOU</b>, tap first to score. But if <b>🌑 THE NILE SLEEPS</b> appears, hold still — tapping wakes the curse (-1 point)! 5 rounds.</p><button id="btn">ENTER THE TEMPLE</button><div id="score"></div></div>
<script>
"use strict";
let s1,s2,round,phase,phaseTO,playing;let ep7=+localStorage.getItem('egp_best')||0;
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.08,t='square'){if(!playing)return;const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=.1;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
const cmd=document.getElementById('cmd');
function next(){if(round>5)return finish();
document.getElementById('r').textContent=round;
document.getElementById('who').textContent='Wait for the goddess…';cmd.textContent='𓂀';
phaseTO=setTimeout(()=>{const see=Math.random()<0.6;phase=see?'see':'sleep';
cmd.textContent=see?'👁️ BASTET SEES YOU!':'🌑 THE NILE SLEEPS…';
document.getElementById('who').textContent=see?'⚡ TAP!':'😤 HOLD STILL!';
phaseTO=setTimeout(()=>{phase=null;cmd.textContent=see?'Too slow…':'The Nile rests.';round++;setTimeout(next,650);},see?1300:1500);},1100+Math.random()*1800);}
function tap(p){if(!playing)return;
if(phase==='see'){const pts=round%3===0?2:1;if(p===1)s1+=pts;else s2+=pts;beep(p===1?620:780,.1,'triangle');cmd.textContent=(round%3===0?'👑 BLESSED ROUND +2! ':'🐱 ')+'P'+p+' is blessed!';upd();}
else if(phase==='sleep'){if(p===1)s1=Math.max(0,s1-1);else s2=Math.max(0,s2-1);beep(130,.2,'sawtooth');cmd.textContent='💀 P'+p+' wakes the curse! -1';upd();}
else{cmd.textContent='The sands stir… nothing yet.';beep(200,.08);}
phase=null;clearTimeout(phaseTO);round++;setTimeout(next,700);}
function upd(){document.getElementById('s1').textContent=s1;document.getElementById('s2').textContent=s2;}
function finish(){playing=false;const m=Math.max(s1,s2);if(m>ep7){ep7=m;localStorage.setItem('egp_best',ep7);}
const w=s1===s2?'🤝 THE GODS DECLARE TIE':'🏆 PLAYER '+(s1>s2?1:2)+' WINS '+Math.max(s1,s2)+'—'+Math.min(s1,s2)+'!';
document.getElementById('od').innerHTML='<b style="font-size:1.25rem">'+w+'</b>';document.getElementById('btn').textContent='NEW FESTIVAL';document.getElementById('ov').style.display='flex';beep(880,.3,'triangle');}
document.getElementById('h1').addEventListener('pointerdown',()=>{audio.resume();tap(1);});
document.getElementById('h2').addEventListener('pointerdown',()=>{audio.resume();tap(2);});
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='z')tap(1);if(k==='m')tap(2);});
document.getElementById('btn').onclick=()=>{audio.resume();s1=0;s2=0;round=1;playing=true;upd();document.getElementById('ov').style.display='none';next();};
</script>
</body>
</html>
