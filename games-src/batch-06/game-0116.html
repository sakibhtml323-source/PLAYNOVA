<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Intense 2-Player Strategy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0a0a0a;font-family:Georgia,serif;color:#d4d4d8;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px;overflow-x:hidden}
h1{font-size:1.05rem;color:#facc15;padding:6px;letter-spacing:1px;text-align:center}
#hud{display:flex;gap:14px;font-size:.85rem;margin-bottom:8px;flex-wrap:wrap;justify-content:center}
#board{display:grid;gap:3px;background:#141414;padding:8px;border-radius:12px;border:2px solid #27272a;touch-action:none}
.cell{width:38px;height:38px;border-radius:6px;background:#1c1c1c;border:1px solid #262626;display:flex;align-items:center;justify-content:center;font-size:.9rem;cursor:pointer}
@media(max-width:380px){.cell{width:31px;height:31px;font-size:.75rem}}
#tip{text-align:center;font-size:.8rem;color:#71717a;margin-top:8px;min-height:2.2em;padding:0 8px}
#ov{position:fixed;inset:0;background:rgba(10,10,10,.98);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#d4d4d8;padding:20px;z-index:5}
button{background:#facc15;border:none;color:#0a0a0a;font-family:inherit;font-weight:800;padding:12px 32px;border-radius:24px;font-size:1rem;cursor:pointer;margin-top:14px}
</style>
</head>
<body>
<h1>⚡ INTENSE 2P STRATEGY</h1>
<div id="hud"><span style="color:#f87171">TITAN <b id="a1">0</b></span><span>Move <b id="t">1</b></span><span style="color:#60a5fa">GOD <b id="a2">0</b></span></div>
<div id="board"></div>
<div id="tip"></div>
<div id="ov"><h2 style="color:#facc15">TITAN VS GOD</h2><p id="od">Intense hotseat tactics! Tap your ⚡, then an adjacent tile to send EXACTLY half your power (rounded up!). Equal forces annihilate; greater power captures with the difference. Wipe your rival in 20 moves!</p><button id="btn">CLASH</button></div>
<script>
"use strict";
const S=8,MAXT=20;let grid,cur,sel,turn,playing;let ie6=+localStorage.getItem('ic_w1')||0,ie62=+localStorage.getItem('ic_w2')||0;
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.08,t='sine'){if(!playing)return;const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=.09;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
function init(){grid=[];for(let i=0;i<S*S;i++)grid.push({o:0,n:0});
grid[0]={o:1,n:20};grid[1]={o:1,n:12};grid[S]={o:1,n:12};
grid[S*S-1]={o:2,n:20};grid[S*S-2]={o:2,n:12};grid[S*S-1-S]={o:2,n:12};
cur=1;turn=1;sel=null;playing=true;document.getElementById('t').textContent=1;render();}
function neigh(i){const r=(i/S)|0,c=i%S,o=[];if(r>0)o.push(i-S);if(r<S-1)o.push(i+S);if(c>0)o.push(i-1);if(c<S-1)o.push(i+1);return o;}
function render(){const b=document.getElementById('board');b.style.gridTemplateColumns='repeat('+S+',38px)';b.innerHTML='';
grid.forEach((g,i)=>{const c=document.createElement('div');c.className='cell'+(sel===i?' sel':'');
c.style.background=g.o===1?'#3b0713':g.o===2?'#082038':'#1c1c1c';
c.textContent=g.o?('⚡'+g.n):g.n;
c.onclick=()=>tap(i);b.appendChild(c);});
document.getElementById('a1').textContent=grid.filter(g=>g.o===1).reduce((a,g)=>a+g.n,0);
document.getElementById('a2').textContent=grid.filter(g=>g.o===2).reduce((a,g)=>a+g.n,0);
document.getElementById('tip').textContent=playing?(cur===1?'🔴 TITAN':'🔵 GOD')+' — move '+turn+'/'+MAXT+'. Send half your power!':'The clash ends.';}
function tap(i){if(!playing)return;const g=grid[i];
if(g.o===cur){sel=i;beep(600,.05);render();return;}
if(sel!==null&&neigh(sel).includes(i)){
const send=Math.ceil(grid[sel].n/2);
if(send<1){render();return;}
if(g.o===0){grid[i]={o:cur,n:send};}
else if(g.n===send){grid[i]={o:0,n:0};beep(200,.12,'sawtooth');}
else if(g.n<send){grid[i]={o:cur,n:send-g.n};beep(500,.1,'triangle');}
else{grid[i].n-=g.n;beep(300,.08,'triangle');}
grid[sel].n-=send;
sel=null;render();check();if(playing){cur=cur===1?2:1;if(cur===1){turn++;
if(turn>MAXT)return final();
document.getElementById('t').textContent=turn;
grid.forEach((c,j)=>{if(c.o)grid[j].n+=1;});render();}}}
else{sel=null;render();}}
function check(){const a=grid.some(g=>g.o===1),b=grid.some(g=>g.o===2);
if(!a||!b){playing=false;
localStorage.setItem('ic_w'+(a?1:2),(a?ie6:ie62)+1);
document.getElementById('od').innerHTML='🏆 <b style="color:#fde047">'+(a?'TITAN':'GOD')+' ERASES THE RIVAL</b> in move '+turn+'!';
document.getElementById('btn').textContent='NEW CLASH';document.getElementById('ov').style.display='flex';beep(880,.3,'triangle');}}
function final(){playing=false;
const s1=grid.filter(g=>g.o===1).reduce((a,g)=>a+g.n,0),s2=grid.filter(g=>g.o===2).reduce((a,g)=>a+g.n,0);
document.getElementById('od').innerHTML='⏳ <b>20 MOVES SPENT.</b><br>Power: TITAN '+s1+' : '+s2+' GOD<br>'+(s1===s2?'A PERFECT STALEMATE.':('🏆 '+(s1>s2?'TITAN':'GOD')+' PREVAILS!'));
document.getElementById('btn').textContent='CLASH AGAIN';document.getElementById('ov').style.display='flex';
beep(s1===s2?440:880,.3,'triangle');}
document.getElementById('btn').onclick=()=>{audio.resume();init();document.getElementById('ov').style.display='none';};
window.addEventListener('keydown',e=>{if(!playing)return;const own=grid.map((g,i)=>g.o===cur?i:-1).filter(i=>i>=0);if(!own.length)return;
if(e.key==='Enter'||e.key===' '){e.preventDefault();if(sel===null){sel=own[0];render();}else{const nb=neigh(sel).find(j=>grid[j].o!==cur);if(nb!==undefined)tap(nb);else{sel=null;render();}}}
if(e.key==='ArrowRight'){sel=own[(own.indexOf(sel)+1+own.length)%own.length]||own[0];render();}});
</script>
</body>
</html>
