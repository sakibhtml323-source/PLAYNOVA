<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Vibrant Mega Ocean</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(135deg,#06b6d4,#3b82f6,#8b5cf6);font-family:Georgia,serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px;overflow-x:hidden}
h1{font-size:1.1rem;color:#fff;padding:6px;text-shadow:0 2px 8px rgba(0,0,0,.3)}
#hud{display:flex;gap:14px;font-size:.9rem;margin-bottom:10px;color:#fff}
#grid{display:grid;gap:5px;background:rgba(255,255,255,.2);backdrop-filter:blur(10px);border-radius:16px;padding:12px;border:1px solid rgba(255,255,255,.4);touch-action:none}
.tile{width:52px;height:52px;border-radius:10px;cursor:pointer;border:2px solid rgba(255,255,255,.5);transition:transform .1s,background .2s}
.tile:active{transform:scale(.9)}
#ov{position:fixed;inset:0;background:rgba(59,130,246,.95);backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:20px;z-index:5}
button{background:rgba(255,255,255,.92);color:#2563eb;border:none;font-weight:800;padding:12px 36px;border-radius:26px;font-size:1rem;cursor:pointer;margin-top:14px}
@media(max-width:420px){.tile{width:44px;height:44px}}
</style>
</head>
<body>
<h1>🌊 VIBRANT MEGA OCEAN</h1>
<div id="hud"><span>Reef <b id="r">1</b></span><span>Taps <b id="m">0</b></span><span>Best <b id="b">—</b></span></div>
<div id="grid"></div>
<div id="ov"><h2>MEGA OCEAN</h2><p id="od">Harmonize the reef! Tap a tile to shift its hue to the next color — and its neighbors shift too. Make the WHOLE ocean ONE vibrant color. Reefs get bigger!</p><button id="btn">DIVE</button></div>
<script>
"use strict";
const HUES=['#ef4444','#f97316','#eab308','#22c55e','#06b6d4','#8b5cf6'];
let size,grid,playing,level,taps,best=Infinity;
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.05,t='sine'){const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=.08;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
function build(){size=Math.min(4+level,7);grid=[];
const total=size*size;
for(let i=0;i<total;i++)grid.push((Math.random()*HUES.length)|0);
// ensure mixed
if(grid.every(v=>v===grid[0]))grid[0]=(grid[0]+1)%HUES.length;
taps=0;document.getElementById('m').textContent=0;document.getElementById('r').textContent=level;
best=+localStorage.getItem('vo_best_'+size)||Infinity;document.getElementById('b').textContent=isFinite(best)?best:'—';
render();}
function neigh(i){const r=(i/size)|0,c=i%size,o=[i];if(r>0)o.push(i-size);if(r<size-1)o.push(i+size);if(c>0)o.push(i-1);if(c<size-1)o.push(i+1);return o;}
function render(){const g=document.getElementById('grid');g.style.gridTemplateColumns='repeat('+size+',52px)';g.innerHTML='';
grid.forEach((v,i)=>{const t=document.createElement('div');t.className='tile';t.style.background=HUES[v];
t.onclick=()=>{if(!playing)return;audio.resume();
neigh(i).forEach(j=>grid[j]=(grid[j]+1)%HUES.length);
taps++;document.getElementById('m').textContent=taps;beep(400+(v%6)*70,.05);render();
if(grid.every(x=>x===grid[0]))win();};g.appendChild(t);});}
function win(){playing=false;beep(800,.15,'triangle');setTimeout(()=>beep(1000,.15,'triangle'),140);
if(taps<best){best=taps;localStorage.setItem('vo_best_'+size,best);}
document.getElementById('od').innerHTML='🌊 The reef hums in ONE color — <b>'+taps+'</b> taps!'+(size<7?'<br>Next: '+(size+1)+'×'+(size+1)+' reef':'<br>The entire mega ocean sings!');
document.getElementById('btn').textContent=size<7?'NEXT REEF':'FLOW AGAIN';if(size>=7)level=0;level++;document.getElementById('ov').style.display='flex';}
window.addEventListener('keydown',e=>{if(!playing)return;if(e.key>='1'&&e.key<='9'){const i=+e.key-1;const t=document.querySelectorAll('.tile')[i];if(t)t.click();}});
document.getElementById('btn').onclick=()=>{audio.resume();if(level===0)level=1;playing=true;build();document.getElementById('ov').style.display='none';};
</script>
</body>
</html>
