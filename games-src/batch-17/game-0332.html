<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Royal Music Tiles #332</title><style>
body{margin:0;font-family:system-ui;background:#1e1b4b;color:#eef2ff;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a5b4fc;font-size:.78rem}
canvas{background:#312e81;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#1e1b4b;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🎹 Royal Music Tiles</h1><div class="sub">Tap the tiles as they fall — don't let them reach the bottom!</div>
<div id="hud"><span>Score <b id="s">0</b></span><span>Missed <b id="m">0</b>/3</span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="400" height="480"></canvas>
<div id="ov"><div style="font-size:3rem">🎵</div><p>Tap the gold tiles as they fall.<br>3 misses and the concert ends!</p><button id="btn">Perform</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.12,t='triangle'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.14,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=400,H=480,COLS=4,CW=100;
const NOTES=[262,294,330,392];
let tiles=[],score=0,missed=0,playing=false,spawnT=0,speed=2.2,best=+localStorage.getItem('rmt_best')||0;
document.getElementById('b').textContent=best;
function spawn(){tiles.push({c:(Math.random()*COLS)|0,y:-60,hit:false});}
cvs.addEventListener('pointerdown',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
const c=Math.floor(x/CW);
const t=tiles.find(t=>t.c===c&&y>t.y&&y<t.y+60&&!t.hit);
if(t){t.hit=true;score++;document.getElementById('s').textContent=score;
beep(NOTES[c],.15);speed=Math.min(5,2.2+score*0.04);
if(score>best){best=score;localStorage.setItem('rmt_best',best);document.getElementById('b').textContent=best;}
tiles=tiles.filter(x=>x!==t);}});
function step(){spawnT++;if(spawnT>Math.max(25,55-score*0.4)){spawnT=0;spawn();}
tiles.forEach(t=>t.y+=speed);
tiles=tiles.filter(t=>{if(t.y>H&&!t.hit){missed++;document.getElementById('m').textContent=missed;
beep(150,.2,'sawtooth');
if(missed>=3){playing=false;beep(130,.35,'sawtooth');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🎼 Concert over!<br>Score: <b style="color:#fbbf24">'+score+'</b>';return false;}}
return t.y<H+10;});}
function draw(){ctx.fillStyle='#312e81';ctx.fillRect(0,0,W,H);
for(let c=0;c<COLS;c++){ctx.strokeStyle='#4338ca';
ctx.beginPath();ctx.moveTo(c*CW,0);ctx.lineTo(c*CW,H);ctx.stroke();}
tiles.forEach(t=>{ctx.fillStyle=t.hit?'#22c55e':'#fbbf24';
ctx.fillRect(t.c*CW+4,t.y,CW-8,56);
ctx.strokeStyle='#fff3';ctx.strokeRect(t.c*CW+4,t.y,CW-8,56);});
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{tiles=[];score=0;missed=0;spawnT=0;speed=2.2;
document.getElementById('s').textContent=0;document.getElementById('m').textContent=0;
document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();};
</script></body></html>
