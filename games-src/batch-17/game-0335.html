<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Royal Gate Keeper #335</title><style>
body{margin:0;font-family:system-ui;background:#1e1b4b;color:#eef2ff;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a5b4fc;font-size:.78rem}
canvas{background:#312e81;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#1e1b4b;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🛡️ Royal Gate Keeper</h1><div class="sub">Tap the gate to open/close — let allies 🟢 in, keep enemies 🔴 out!</div>
<div id="hud"><span>Allies <b id="a">0</b></span><span>Enemies in <b id="e">0</b>/3</span><span>Score <b id="s">0</b></span></div>
<canvas id="cv" width="440" height="340"></canvas>
<div id="ov"><div style="font-size:3rem">🏰</div><p>Tap gate: open/close.<br>Allies pass when open, enemies blocked when closed!</p><button id="btn">Keep Gate</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=340,GX=W/2,GY=H/2;
let walkers=[],gateOpen=false,allies=0,enemiesIn=0,score=0,playing=false,spawnT=0;
function spawn(){const friendly=Math.random()<0.6;
walkers.push({x:-20,y:80+Math.random()*180,friendly,sp:1.2+Math.random()*0.8,passed:false});}
cvs.addEventListener('pointerdown',()=>{if(!playing)return;gateOpen=!gateOpen;
beep(gateOpen?500:300,.08);});
function step(){spawnT++;if(spawnT>Math.max(40,90-allies*2)){spawnT=0;spawn();}
walkers.forEach(w=>{w.x+=w.sp;
if(!w.passed&&w.x>GX-14&&w.x<GX+14){w.passed=true;
if(w.friendly&&gateOpen){allies++;score+=10;
document.getElementById('a').textContent=allies;beep(600,.08,'triangle');}
else if(!w.friendly&&!gateOpen){score+=25;
beep(700,.1,'triangle');}
else if(!w.friendly&&gateOpen){enemiesIn++;document.getElementById('e').textContent=enemiesIn;
beep(150,.2,'sawtooth');
if(enemiesIn>=3){playing=false;beep(130,.35,'sawtooth');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🚨 Gate breached!<br>Score: <b style="color:#fbbf24">'+score+'</b> · Allies: '+allies;}}
else if(w.friendly&&!gateOpen){/* ally waits at gate */w.x=GX-14;w.passed=false;}}});
walkers=walkers.filter(w=>w.x<W+30);
document.getElementById('s').textContent=score;}
function draw(){ctx.fillStyle='#312e81';ctx.fillRect(0,0,W,H);
// gate
ctx.fillStyle=gateOpen?'#22c55e':'#dc2626';
ctx.fillRect(GX-8,40,16,H-80);
ctx.font='16px serif';ctx.textAlign='center';
ctx.fillText(gateOpen?'OPEN':'CLOSED',GX,30);
walkers.forEach(w=>{ctx.font='24px serif';
ctx.fillText(w.friendly?'🟢':'🔴',w.x,w.y);});
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{walkers=[];gateOpen=false;allies=0;enemiesIn=0;score=0;spawnT=0;
document.getElementById('a').textContent=0;document.getElementById('e').textContent=0;
document.getElementById('s').textContent=0;
document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();};
</script></body></html>
