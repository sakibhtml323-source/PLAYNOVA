<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crystal Color Chain #323</title><style>
body{margin:0;font-family:system-ui;background:#0f172a;color:#e2e8f0;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#94a3b8;font-size:.78rem}
#grid{display:grid;grid-template-columns:repeat(6,52px);gap:4px;margin:12px}
.c{width:52px;height:52px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:22px;transition:transform .1s}
.c.sel{transform:scale(1.1);outline:2px solid #fff}
#hud{display:flex;gap:14px;font-size:.9rem;margin:4px}#hud b{color:#facc15}
#msg{min-height:1.3em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#7c3aed;color:#fff;font-weight:700;cursor:pointer;margin:6px}
</style></head><body>
<h1>💎 Crystal Color Chain</h1><div class="sub">Drag through same-colored crystals — the longer the chain, the bigger the blast!</div>
<div id="hud"><span>Score <b id="s">0</b></span><span>Moves <b id="m">15</b></span><span>Best <b id="b">0</b></span></div>
<div id="grid"></div><div id="msg"></div>
<button id="btn">✨ New Board</button>
<audio id="au"></audio>
<script>
"use strict";
const AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const N=6,COLORS=['#7c3aed','#ef4444','#22c55e','#eab308','#3b82f6'],EMO=['💜','❤️','💚','💛','💙'];
let grid=[],moves=15,score=0,best=+localStorage.getItem('ccc_best')||0;
document.getElementById('b').textContent=best;
function gen(){grid=[];const nc=Math.min(3+Math.floor(score/300),5);
for(let r=0;r<N;r++){const row=[];for(let c=0;c<N;c++)row.push((Math.random()*nc)|0);grid.push(row);}
moves=15;document.getElementById('m').textContent=15;document.getElementById('s').textContent=score;
render();msg('Chain 3+ same colors!');}
let chain=[],color=-1;
function tap(r,c){const v=grid[r][c];
if(chain.length===0){chain=[r*N+c];color=v;beep(400,.05);render();return;}
if(chain.includes(r*N+c)){chain=chain.slice(0,chain.indexOf(r*N+c));render();return;}
const last=chain[chain.length-1];const lr=(last/N)|0,lc=last%N;
if(Math.abs(lr-r)+Math.abs(lc-c)!==1||v!==color){beep(160,.06,'sawtooth');return;}
chain.push(r*N+c);beep(400+chain.length*40,.05);render();}
document.addEventListener('pointerup',()=>{
if(chain.length>=3){moves--;document.getElementById('m').textContent=moves;
const gained=chain.length*chain.length*10;score+=gained;
document.getElementById('s').textContent=score;
beep(600,.15,'triangle');msg('💥 +'+gained+'!');
chain.forEach(i=>{grid[(i/N)|0][i%C]=null;});
// gravity
for(let c=0;c<N;c++){let w=N-1;
for(let r=N-1;r>=0;r--){if(grid[r][c]!==null){grid[w][c]=grid[r][c];if(w!==r)grid[r][c]=null;w--;}}
for(let r=w;r>=0;r--)grid[r][c]=(Math.random()*Math.min(3+Math.floor(score/300),5))|0;}
if(score>best){best=score;localStorage.setItem('ccc_best',best);document.getElementById('b').textContent=best;}
if(moves<=0){beep(130,.3,'sawtooth');msg('🏁 Final score: '+score);}}
chain=[];color=-1;render();});
function render(){const g=document.getElementById('grid');g.innerHTML='';
for(let r=0;r<N;r++)for(let c=0;c<N;c++){const d=document.createElement('div');d.className='c';
d.style.background=COLORS[grid[r][c]];d.textContent=EMO[grid[r][c]];
if(chain.includes(r*N+c))d.classList.add('sel');
d.onclick=()=>{AU.__c=AU.__c||new (window.AudioContext||window.webkitAudioContext)();tap(r,c);};
g.appendChild(d);}}
function msg(t){document.getElementById('msg').textContent=t;}
document.getElementById('btn').onclick=()=>{AU.__c=new (window.AudioContext||window.webkitAudioContext)();gen();};
gen();
</script></body></html>
