<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ninja Wind Sprint #327</title><style>
body{margin:0;font-family:system-ui;background:#111827;color:#f9fafb;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#9ca3af;font-size:.78rem}
canvas{background:#1f2937;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#facc15}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#facc15;color:#111827;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>💨 Ninja Wind Sprint</h1><div class="sub">Wind gusts push you mid-air — time your jumps between platforms!</div>
<div id="hud"><span>Dist <b id="d">0</b>m</span><span>Wind <b id="w">→</b></span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="480" height="300"></canvas>
<div id="ov"><div style="font-size:3rem">🌀</div><p>Space/tap to jump — wind gusts push you!<br>Land on the platforms.</p><button id="btn">Sprint</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=480,H=300,GY=H-30;
let me={x:60,y:GY,vy:0,onG:true},plats=[{x:0,y:GY,w:200}],wind=0,windT=0,dist=0,playing=false,best=+localStorage.getItem('nws_best')||0;
document.getElementById('b').textContent=best;
function jump(){if(!playing)return;if(me.onG){me.vy=-9;me.onG=false;beep(500,.06);}}
cvs.addEventListener('pointerdown',jump);
document.addEventListener('keydown',e=>{if(e.code==='Space')jump();});
function spawnPlat(){const last=plats[plats.length-1];
const gap=60+Math.random()*80;
const w=80+Math.random()*70;
plats.push({x:last.x+last.w+gap,y:GY-Math.random()*60,w});}
function step(){dist+=0.05;
windT++;if(windT>140){windT=0;wind=(Math.random()*2-1)*1.5;
document.getElementById('w').textContent=wind>0?'→':'←';}
me.vy+=0.5;me.y+=me.vy;
// wind affects airborne
if(!me.onG){me.x+=wind;}
// world scroll
plats.forEach(p=>p.x-=2.8);plats=plats.filter(p=>p.x+p.w>-20);
if(plats.length<5)spawnPlat();
// ground collision
me.onG=false;
plats.forEach(p=>{if(me.x>p.x&&me.x<p.x+p.w&&me.y>=p.y&&me.y<=p.y+18){
me.y=p.y;me.vy=0;me.onG=true;}});
// fell off
if(me.y>H+40){die();return;}
me.x=Math.max(20,Math.min(W-20,me.x));
document.getElementById('d').textContent=Math.floor(dist);}
function die(){if(!playing)return;playing=false;beep(130,.35,'sawtooth');
const d=Math.floor(dist);if(d>best){best=d;localStorage.setItem('nws_best',best);document.getElementById('b').textContent=best;}
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🌀 Swept away at <b style="color:#fbbf14">'+d+'m</b>';}
function draw(){ctx.fillStyle='#1f2937';ctx.fillRect(0,0,W,H);
// wind particles
ctx.fillStyle='#93c5fd44';
for(let i=0;i<8;i++){const px=(Date.now()/8+i*60)%W;
ctx.fillRect(px,30+i*30,wind*12,2);}
plats.forEach(p=>{ctx.fillStyle='#374151';ctx.fillRect(p.x,p.y,p.w,10);});
ctx.font='28px serif';ctx.textAlign='center';ctx.fillText('🥷',me.x,me.y+4);
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{me={x:60,y:GY,vy:0,onG:true};
plats=[{x:0,y:GY,w:200}];wind=0;windT=0;dist=0;
document.getElementById('d').textContent=0;
document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();};
</script></body></html>
