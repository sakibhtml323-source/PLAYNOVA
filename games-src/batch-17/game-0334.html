<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ninja Windmill #334</title><style>
body{margin:0;font-family:system-ui;background:#111827;color:#f9fafb;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#9ca3af;font-size:.78rem}
canvas{background:#1f2937;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#facc15}
#bar{width:300px;max-width:88vw;height:16px;background:#1f2937;border-radius:8px;margin:8px;position:relative;overflow:hidden}
#target{position:absolute;top:0;height:100%;background:#fbbf2455}
#cur{position:absolute;top:0;height:100%;background:#22c55e;width:4px}
#msg{min-height:1.3em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#facc15;color:#111827;font-weight:700;cursor:pointer;margin:8px}
</style></head><body>
<h1>🌀 Ninja Windmill</h1><div class="sub">Hold to spin up, release to coast — land the needle in the gold zone!</div>
<div id="hud"><span>Round <b id="r">1</b></span><span>Score <b id="s">0</b></span><span>⏱️ <b id="t">10</b>s</span></div>
<canvas id="cv" width="320" height="320"></canvas>
<div id="bar"><div id="target"></div><div id="cur"></div></div>
<div id="msg"></div>
<button id="btn">Spin</button>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
let angle=0,spd=0,holding=false,playing=false,round=1,score=0,time=10,timer=null;
let tgtStart=0.4,tgtW=0.2;
function newRound(){tgtStart=0.2+Math.random()*0.5;tgtW=Math.max(0.08,0.2-round*0.008);
document.getElementById('target').style.left=tgtStart*100+'%';
document.getElementById('target').style.width=tgtW*100+'%';
document.getElementById('r').textContent=round;
spd=0;time=10;document.getElementById('t').textContent=10;
clearInterval(timer);timer=setInterval(()=>{time--;
document.getElementById('t').textContent=time;
if(time<=0){clearInterval(timer);playing=false;beep(130,.3,'sawtooth');
msg('⏰ Time! Final score: '+score);}},1000);msg('Hold to spin, release in the zone!');}
cvs.addEventListener('pointerdown',()=>{holding=true;});
cvs.addEventListener('pointerup',()=>{holding=false;});
document.addEventListener('keydown',e=>{if(e.code==='Space')holding=true;});
document.addEventListener('keyup',e=>{if(e.code==='Space')holding=false;});
function msg(t){document.getElementById('msg').textContent=t;}
function step(){spd=Math.max(0,Math.min(1,spd+(holding?0.02:-0.015)));
angle+=spd*0.2;
// needle pos = spd
document.getElementById('cur').style.left=spd*100+'%';
// check zone
if(spd>=tgtStart&&spd<=tgtStart+tgtW){score++;document.getElementById('s').textContent=score;
beep(600+score*20,.08);round++;setTimeout(newRound,600);return;}}
function draw(){ctx.fillStyle='#1f2937';ctx.fillRect(0,0,320,320);
ctx.save();ctx.translate(160,160);ctx.rotate(angle);
for(let i=0;i<4;i++){ctx.rotate(Math.PI/2);
ctx.fillStyle='#7c3aed';
ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(110,-22);ctx.lineTo(110,22);ctx.fill();}
ctx.restore();
ctx.beginPath();ctx.arc(160,160,12,0,7);ctx.fillStyle='#fbbf24';ctx.fill();
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{round=1;score=0;angle=0;spd=0;holding=false;playing=true;
document.getElementById('s').textContent=0;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();newRound();draw();};
</script></body></html>
