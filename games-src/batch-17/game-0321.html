<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ninja Dart Board #321</title><style>
body{margin:0;font-family:system-ui;background:#111827;color:#f9fafb;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#9ca3af;font-size:.78rem}
canvas{background:#1f2937;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#facc15}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#facc15;color:#111827;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🎯 Ninja Dart Board</h1><div class="sub">The board sways and shrinks — tap to throw! Center hits score most.</div>
<div id="hud"><span>Score <b id="s">0</b></span><span>Darts <b id="d">10</b></span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="400" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">🥷</div><p>Tap anywhere to throw a dart.<br>10 darts — make them count!</p><button id="btn">Throw</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=400;let score=0,darts=10,playing=false,t=0,best=+localStorage.getItem('ndb_best')||0,dartsThrown=[];
document.getElementById('b').textContent=best;
function boardPos(){const r=Math.max(50,110-t*0.7);
const x=W/2+Math.sin(t*0.03)*90,y=W/2+Math.cos(t*0.021)*70;
return{x,y,r};}
cvs.addEventListener('pointerdown',e=>{if(!playing||darts<=0)return;const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*W/r.height;
const b=boardPos();const d=Math.hypot(x-b.x,y-b.y);
let pts=0;if(d<b.r*0.2)pts=50;else if(d<b.r*0.5)pts=30;else if(d<b.r*0.8)pts=20;else if(d<b.r)pts=10;
if(pts>0){score+=pts;beep(500+pts*8,.1,'triangle');}
else beep(180,.1,'sawtooth');
dartsThrown.push({x,y,hit:pts>0});
document.getElementById('s').textContent=score;
darts--;document.getElementById('d').textContent=darts;
if(darts<=0){playing=false;beep(130,.3,'sawtooth');
if(score>best){best=score;localStorage.setItem('ndb_best',best);document.getElementById('b').textContent=best;}
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🏁 All darts thrown!<br>Score: <b style="color:#fbbf24">'+score+'</b>';}});
function draw(){ctx.fillStyle='#1f2937';ctx.fillRect(0,0,W,W);
const b=boardPos();
const rings=[[1,'#dc2626'],[0.8,'#f8fafc'],[0.5,'#2563eb'],[0.2,'#facc15']];
rings.forEach(([f,c])=>{ctx.beginPath();ctx.arc(b.x,b.y,b.r*f,0,7);ctx.fillStyle=c;ctx.fill();});
ctx.fillStyle='#1f2937';ctx.beginPath();ctx.arc(b.x,b.y,4,0,7);ctx.fill();
dartsThrown.forEach(d=>{ctx.font='18px serif';ctx.textAlign='center';ctx.fillText(d.hit?'🎯':'✖',d.x,d.y);});
if(playing){t++;requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{score=0;darts=10;t=0;dartsThrown=[];
document.getElementById('s').textContent=0;document.getElementById('d').textContent=10;
document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();};
</script></body></html>
