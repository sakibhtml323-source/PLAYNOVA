<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haunted Grid Crawler #325</title><style>
body{margin:0;font-family:system-ui;background:#18181b;color:#fafafa;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a1a1aa;font-size:.78rem}
#grid{display:grid;grid-template-columns:repeat(7,46px);gap:3px;margin:12px}
.c{width:46px;height:46px;background:#27272a;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer}
.c.seen{background:#3f3f46}.c.me{background:#7c3aed;outline:2px solid #facc15}
#hud{display:flex;gap:14px;font-size:.9rem;margin:4px}#hud b{color:#facc15}
#msg{min-height:1.3em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#7c3aed;color:#fff;font-weight:700;cursor:pointer;margin:8px}
</style></head><body>
<h1>👻 Haunted Grid Crawler</h1><div class="sub">Reveal the grid, grab the treasures — but traps cost you HP!</div>
<div id="hud"><span>❤️ <b id="h">10</b></span><span>💰 <b id="g">0</b></span><span>Treasures <b id="t">0</b>/3</span></div>
<div id="grid"></div><div id="msg"></div>
<button id="btn">🕯️ New Crypt</button>
<audio id="au"></audio>
<script>
"use strict";
const AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const N=7;let grid=[],me={r:3,c:3},hp=10,gold=0,found=0,playing=true;
function gen(){grid=[];for(let r=0;r<N;r++){const row=[];for(let c=0;c<N;c++)row.push({seen:false,type:0});grid.push(row);}
// place 3 treasures, 6 traps
const cells=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)cells.push([r,c]);
cells.sort(()=>Math.random()-.5);
for(let i=0;i<3;i++)grid[cells[i][0]][cells[i][1]].type=1;
for(let i=3;i<9;i++)grid[cells[i][0]][cells[i][1]].type=2;
me={r:3,c:3};hp=10;gold=0;found=0;playing=true;
document.getElementById('h').textContent=10;document.getElementById('g').textContent=0;
document.getElementById('t').textContent=0;reveal(me.r,me.c);render();msg('Find the 3 treasures!');}
function reveal(r,c){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
const rr=r+dr,cc=c+dc;if(rr>=0&&rr<N&&cc>=0&&cc<N)grid[rr][cc].seen=true;}}
function tap(r,c){if(!playing||Math.abs(r-me.r)+Math.abs(c-me.c)!==1)return;
me={r,c};const cell=grid[r][c];
if(cell.type===1){gold+=100;found++;cell.type=3;
document.getElementById('g').textContent=gold;document.getElementById('t').textContent=found;
beep(700+found*60,.15,'triangle');msg('💰 Treasure! +100');
if(found>=3){playing=false;beep(880,.3,'triangle');msg('👑 All treasures found! Gold: '+gold);}}
else if(cell.type===2){hp-=2;cell.type=4;
document.getElementById('h').textContent=Math.max(0,hp);
beep(150,.2,'sawtooth');msg('💥 Trap! −2 HP');
if(hp<=0){playing=false;beep(130,.35,'sawtooth');msg('💀 The crypt claims you…');}}
else beep(400,.04);
reveal(r,c);render();}
function render(){const g=document.getElementById('grid');g.innerHTML='';
for(let r=0;r<N;r++)for(let c=0;c<N;c++){const cell=grid[r][c];const d=document.createElement('div');
d.className='c'+(cell.seen?' seen':'');
if(r===me.r&&c===me.c){d.classList.add('me');d.textContent='🕵️';}
else if(cell.seen){d.textContent=cell.type===1?'💰':cell.type===2?'💥':cell.type===3?'✅':cell.type===4?'✖':'';}
d.onclick=()=>{AU.__c=AU.__c||new (window.AudioContext||window.webkitAudioContext)();tap(r,c);};
g.appendChild(d);}}
function msg(t){document.getElementById('msg').textContent=t;}
document.getElementById('btn').onclick=()=>{AU.__c=new (window.AudioContext||window.webkitAudioContext)();gen();};
gen();
</script></body></html>
