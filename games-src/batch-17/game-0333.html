<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Dot Trail #333</title><style>
body{margin:0;font-family:system-ui;background:#0c1445;color:#e0e7ff;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#93c5fd;font-size:.78rem}
canvas{background:#111936;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#0c1445;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>✨ Desert Dot Trail</h1><div class="sub">Connect the numbered dots in order to reveal the constellation!</div>
<div id="hud"><span>Dots <b id="d">0</b>/<b id="dt">0</b></span><span>Mistakes <b id="m">0</b></span></div>
<canvas id="cv" width="400" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">🌌</div><p>Tap dot 1, then 2, then 3…<br>Connect them all to reveal the image!</p><button id="btn">Connect</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=400;let dots=[],next=1,playing=false,level=1,trail=[],constellation=[];
function gen(){const n=Math.min(4+level,10);dots=[];trail=[];next=1;
for(let i=0;i<n;i++)dots.push({x:40+Math.random()*(W-80),y:40+Math.random()*(W-80),n:i+1,got:false});
document.getElementById('d').textContent=0;document.getElementById('dt').textContent=n;
document.getElementById('m').textContent=0;draw();}
cvs.addEventListener('pointerdown',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*W/r.height;
const hit=dots.findIndex(d=>Math.hypot(d.x-x,d.y-y)<24);
if(hit<0)return;
if(dots[hit].n===next){dots[hit].got=true;trail.push({x:dots[hit].x,y:dots[hit].y});
next++;beep(400+next*60,.1);document.getElementById('d').textContent=next-1;
draw();
if(next>dots.length){playing=false;beep(880,.3,'triangle');
// reveal constellation shape
constellation=trail.slice();
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🌟 Constellation complete!<br>Level '+(level+1);
level++;setTimeout(()=>{document.getElementById('ov').style.display='none';gen();playing=true;},1400);}}
else{beep(180,.12,'sawtooth');
const el=document.getElementById('m');el.textContent=+el.textContent+1;}});
function draw(){ctx.fillStyle='#111936';ctx.fillRect(0,0,W,W);
// stars bg
for(let i=0;i<40;i++){ctx.fillStyle='#ffffff22';
ctx.fillRect((i*97)%W,(i*61)%W,2,2);}
// trail
if(trail.length>1){ctx.strokeStyle='#fbbf24';ctx.lineWidth=2;ctx.lineCap='round';
ctx.beginPath();ctx.moveTo(trail[0].x,trail[0].y);
trail.forEach(p=>ctx.lineTo(p.x,p.y));ctx.stroke();}
dots.forEach(d=>{ctx.beginPath();ctx.arc(d.x,d.y,d.got?6:14,0,7);
ctx.fillStyle=d.got?'#22c55e':d.n===next?'#fbbf24':'#334155';ctx.fill();
if(!d.got){ctx.fillStyle='#fff';ctx.font='bold 12px system-ui';ctx.textAlign='center';
ctx.fillText(d.n,d.x,d.y+4);}});}
document.getElementById('btn').onclick=()=>{level=1;playing=true;
document.getElementById('ov').style.display='none';
AU.__c=new (window.AudioContext||window.webkitAudioContext)();gen();};
</script></body></html>
