<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Scroll Roll #329</title><style>
body{margin:0;font-family:system-ui;background:#1c1917;color:#fafaf9;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a8a29e;font-size:.78rem}
canvas{background:#292524;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#1c1917;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>📜 Desert Scroll Roll</h1><div class="sub">Drag to unroll the ancient scroll — reveal the image without tearing it!</div>
<div id="hud"><span>Revealed <b id="r">0</b>%</span><span>Tears <b id="t">0</b>/3</span></div>
<canvas id="cv" width="400" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">🏺</div><p>Drag right to unroll.<br>Don't drag too fast — the scroll tears!</p><button id="btn">Unroll</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=400;let unrolled=0,playing=false,dragX=null,tears=0,lastX=0,lastT=0,image=[];
function genImage(){image=[];const emo=['🏺','🐪','🔺','🌴','👑','🦂'];
for(let r=0;r<8;r++){const row=[];for(let c=0;c<8;c++)
row.push(Math.random()<0.4?emo[(Math.random()*6)|0]:'');image.push(row);}}
cvs.addEventListener('pointerdown',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
dragX=(e.clientX-r.left)*W/r.width;lastX=dragX;lastT=Date.now();});
cvs.addEventListener('pointermove',e=>{if(dragX===null||!playing)return;const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)*W/r.width;
const dt=Date.now()-lastT;
if(dt>0){const speed=Math.abs(x-lastX)/dt;
if(speed>0.9){tears++;document.getElementById('t').textContent=tears;
beep(150,.2,'sawtooth');dragX=null;
if(tears>=3){playing=false;beep(130,.35,'sawtooth');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='💔 Scroll destroyed!<br>Revealed '+Math.floor(unrolled/W*100)+'%';
return;}return;}}
unrolled=Math.min(W,Math.max(0,x));
lastX=x;lastT=Date.now();
document.getElementById('r').textContent=Math.floor(unrolled/W*100);
draw();
if(unrolled>=W){playing=false;beep(880,.3,'triangle');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🏺 Scroll revealed with '+(3-tears)+' tears left!';}});
cvs.addEventListener('pointerup',()=>{dragX=null;});
function draw(){ctx.fillStyle='#292524';ctx.fillRect(0,0,W,W);
// revealed part
for(let r=0;r<8;r++)for(let c=0;c<8;c++){const x=c*50,y=r*50;
if(x+50<=unrolled){ctx.fillStyle='#d6b98a';ctx.fillRect(x,y,50,50);
if(image[r][c]){ctx.font='28px serif';ctx.textAlign='center';ctx.fillText(image[r][c],x+25,y+34);}}}
// rolled part
ctx.fillStyle='#92400e';
ctx.fillRect(unrolled,0,W-unrolled,W);
ctx.beginPath();ctx.arc(unrolled,W/2,24,0,7);ctx.fillStyle='#78350f';ctx.fill();
// tear lines
ctx.strokeStyle='#ef4444';
for(let i=0;i<tears;i++){ctx.beginPath();ctx.moveTo(20+i*30,20);ctx.lineTo(35+i*30,380);ctx.stroke();}}
document.getElementById('btn').onclick=()=>{unrolled=0;tears=0;dragX=null;
document.getElementById('r').textContent=0;document.getElementById('t').textContent=0;
genImage();document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();};
genImage();
</script></body></html>
