<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crystal Ice Break #336</title><style>
body{margin:0;font-family:system-ui;background:#0c4a6e;color:#e0f2fe;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#7dd3fc;font-size:.78rem}
#grid{display:grid;grid-template-columns:repeat(5,60px);gap:5px;margin:12px}
.b{width:60px;height:60px;background:#38bdf833;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;transition:all .15s}
.b.cracked{background:#7dd3fc55}
#hud{display:flex;gap:14px;font-size:.9rem;margin:4px}#hud b{color:#fbbf24}
#msg{min-height:1.3em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#38bdf8;color:#0c4a6e;font-weight:800;cursor:pointer;margin:8px}
</style></head><body>
<h1>🧊 Crystal Ice Break</h1><div class="sub">Crack the ice in the numbered order — wrong blocks freeze your pick!</div>
<div id="hud"><span>Broken <b id="b2">0</b>/<b id="bt">0</b></span><span>Froze <b id="f">0</b>/3</span><span>Level <b id="l">1</b></span></div>
<div id="grid"></div><div id="msg"></div>
<button id="btn">❄️ New Wall</button>
<audio id="au"></audio>
<script>
"use strict";
const AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const N=5;let blocks=[],next=1,level=1,froze=0;
function gen(){const n=Math.min(5+level,15);blocks=[];next=1;froze=0;
const cells=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)cells.push(r*N+c);
cells.sort(()=>Math.random()-.5);
for(let i=0;i<n;i++)blocks.push({i:cells[i],n:i+1,done:false,cracked:false});
document.getElementById('b2').textContent=0;document.getElementById('bt').textContent=n;
document.getElementById('f').textContent=0;document.getElementById('l').textContent=level;
render();msg('Break them in order!');}
function tap(b){if(b.done)return;
if(b.n===next){b.done=true;next++;beep(500+b.n*30,.1);
document.getElementById('b2').textContent=next-1;
if(next>blocks.length){beep(880,.3,'triangle');msg('🧊 Wall cleared! Level '+(level+1));level++;
setTimeout(gen,1000);}}
else{froze++;document.getElementById('f').textContent=froze;
beep(150,.15,'sawtooth');msg('❄️ Wrong block!');
if(froze>=3){beep(130,.3,'sawtooth');msg('🥶 Pick frozen! Try again.');froze=0;next=1;
blocks.forEach(b=>{b.done=false;});document.getElementById('b2').textContent=0;
document.getElementById('f').textContent=0;}}
render();}
function render(){const g=document.getElementById('grid');g.innerHTML='';
for(let i=0;i<N*N;i++){const d=document.createElement('div');d.className='b';
const b=blocks.find(x=>x.i===i);
if(b){if(b.done){d.textContent='✅';d.style.background='#14532d';}
else{d.textContent=b.n===next?'❔':b.n;d.onclick=()=>{AU.__c=AU.__c||new (window.AudioContext||window.webkitAudioContext)();tap(b);};}}
g.appendChild(d);}}
function msg(t){document.getElementById('msg').textContent=t;}
document.getElementById('btn').onclick=()=>{AU.__c=new (window.AudioContext||window.webkitAudioContext)();gen();};
gen();
</script></body></html>
