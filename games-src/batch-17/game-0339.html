<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ninja Lantern Light #339</title><style>
body{margin:0;font-family:system-ui;background:#111827;color:#f9fafb;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#9ca3af;font-size:.78rem}
#grid{display:grid;grid-template-columns:repeat(7,44px);gap:3px;margin:12px}
.c{width:44px;height:44px;background:#1f2937;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer}
.c.lit{background:#78350f}
.c.me{background:#7c3aed;outline:2px solid #facc15}
.c.goal{background:#14532d}
#hud{display:flex;gap:14px;font-size:.9rem;margin:4px}#hud b{color:#facc15}
#msg{min-height:1.3em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#facc15;color:#111827;font-weight:700;cursor:pointer;margin:8px}
</style></head><body>
<h1>🏮 Ninja Lantern Light</h1><div class="sub">Reach the shrine — every step burns oil. Refill at torches!</div>
<div id="hud"><span>Oil <b id="o">15</b></span><span>Level <b id="l">1</b></span><span>Torches <b id="t">0</b></span></div>
<div id="grid"></div><div id="msg"></div>
<button id="btn">🏮 New Path</button>
<audio id="au"></audio>
<script>
"use strict";
const AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const N=7;let grid=[],me={r:0,c:0},goal={r:6,c:6},oil=15,level=1,torches=[],playing=true;
function gen(){grid=[];for(let r=0;r<N;r++){const row=[];for(let c=0;c<N;c++)row.push(0);grid.push(row);}
const walls=6+level;
for(let i=0;i<walls;i++){const r=(Math.random()*N)|0,c=(Math.random()*N)|0;
if((r===0&&c===0)||(r===6&&c===6))continue;grid[r][c]=1;}
torches=[];const nt=Math.min(1+level,4);
for(let i=0;i<nt;i++){let r,c;do{r=(Math.random()*N)|0;c=(Math.random()*N)|0;}while(grid[r][c]||(r===0&&c===0)||(r===6&&c===6));
torches.push({r,c});}
me={r:0,c:0};oil=15+level*2;playing=true;
document.getElementById('o').textContent=oil;
document.getElementById('l').textContent=level;
document.getElementById('t').textContent=nt;
render();msg('Reach 🏯 with oil to spare!');}
function tap(r,c){if(!playing||Math.abs(r-me.r)+Math.abs(c-me.c)!==1||grid[r][c])return;
me={r,c};oil--;
const t=torches.find(x=>x.r===r&&x.c===c);
if(t){oil=Math.min(oil+8,20);beep(700,.12,'triangle');msg('🔥 Torch! +8 oil');}
else beep(400,.04);
document.getElementById('o').textContent=oil;
render();
if(r===goal.r&&c===goal.c){playing=false;beep(880,.3,'triangle');
msg('🏯 Shrine reached with '+oil+' oil! Level '+(level+1));level++;
setTimeout(gen,1000);return;}
if(oil<=0){playing=false;beep(130,.3,'sawtooth');msg('🌑 Lantern out…');}}
function render(){const g=document.getElementById('grid');g.innerHTML='';
for(let r=0;r<N;r++)for(let c=0;c<N;c++){const d=document.createElement('div');
d.className='c'+(grid[r][c]?' wall lit':'');
if(r===me.r&&c===me.c){d.classList.add('me');d.textContent='🥷';}
else if(r===goal.r&&c===goal.c){d.classList.add('goal');d.textContent='🏯';}
else if(torches.some(t=>t.r===r&&t.c===c))d.textContent='🔥';
else if(grid[r][c])d.textContent='🪨';
d.onclick=()=>{AU.__c=AU.__c||new (window.AudioContext||window.webkitAudioContext)();tap(r,c);};
g.appendChild(d);}}
function msg(t){document.getElementById('msg').textContent=t;}
document.getElementById('btn').onclick=()=>{AU.__c=new (window.AudioContext||window.webkitAudioContext)();gen();};
gen();
</script></body></html>
