/* ---------- flow ---------- */

const sg=ctx.createRadialGradient(180,H-110,10,180,H-110,170);sg.addColorStop(0,'rgba(255,240,190,.9)');sg.addColorStop(1,'rgba(255,240,190,0)');ctx.fillStyle=sg;ctx.fillRect(0,H-300,W,300);
clouds.forEach(c=>{c.x+=c.v*dt;if(c.x>W+60)c.x=-60;ctx.fillStyle='rgba(255,255,255,.16)';ctx.beginPath();ctx.ellipse(c.x,c.y,38*c.s,13*c.s,0,0,6.283);ctx.ellipse(c.x+22*c.s,c.y-6*c.s,24*c.s,12*c.s,0,0,6.283);ctx.fill()});
ctx.fillStyle='#4a2160';ctx.beginPath();ctx.moveTo(60,H-60);ctx.lineTo(60,H-150);ctx.lineTo(80,H-150);ctx.lineTo(80,H-175);ctx.lineTo(92,H-150);ctx.lineTo(115,H-150);ctx.lineTo(115,H-60);ctx.fill();ctx.beginPath();ctx.moveTo(245,H-60);ctx.lineTo(245,H-130);ctx.lineTo(262,H-165);ctx.lineTo(280,H-130);ctx.lineTo(300,H-130);ctx.lineTo(300,H-60);ctx.fill();
ctx.fillStyle='#3a8a4a';ctx.fillRect(0,GROUND,W,H-GROUND);ctx.fillStyle='#4fb35e';ctx.fillRect(0,GROUND,W,6);for(let x=6;x<W;x+=18){ctx.fillStyle='#2f7a3e';ctx.beginPath();ctx.moveTo(x,GROUND+6);ctx.lineTo(x+4,GROUND-4);ctx.lineTo(x+8,GROUND+6);ctx.fill()}}
function basket(L,i){const x=L.bx,y=BY,sq=L.sq;ctx.save();ctx.translate(x,y);ctx.scale(1+sq*.6,1-sq*.5);if(L.stun>0){ctx.rotate(Math.sin(time*40)*.12);ctx.globalAlpha=.7}
const g=ctx.createLinearGradient(0,-8,0,26);g.addColorStop(0,'#ffe27a');g.addColorStop(1,'#d18a12');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-L.hw,-6);ctx.quadraticCurveTo(-L.hw+6,28,0,28);ctx.quadraticCurveTo(L.hw-6,28,L.hw,-6);ctx.closePath();ctx.fill();
ctx.beginPath();ctx.moveTo(-L.hw,-6);ctx.lineTo(-L.hw*.7,-22);ctx.lineTo(-L.hw*.35,-8);ctx.lineTo(0,-26);ctx.lineTo(L.hw*.35,-8);ctx.lineTo(L.hw*.7,-22);ctx.lineTo(L.hw,-6);ctx.closePath();ctx.fillStyle='#ffd23f';ctx.fill();
ctx.fillStyle=mode===2?(i===0?'#ff6b81':'#7aa8ff'):'#ff6b81';ctx.beginPath();ctx.arc(0,8,6,0,6.283);ctx.fill();ctx.fillStyle='rgba(255,255,255,.4)';ctx.beginPath();ctx.ellipse(-12,2,5,2.5,-.4,0,6.283);ctx.fill();
if(mode===2){ctx.fillStyle='#fff';ctx.font='800 11px system-ui';ctx.textAlign='center';ctx.fillText('P'+(i+1),0,40)}ctx.restore()}
function draw(dt){time+=dt;ctx.setTransform(dprR,0,0,dprR,0,0);ctx.save();if(shake>0)ctx.translate(rnd(-shake,shake)/2,rnd(-shake,shake)/2);scene(dt);
if(state==='hatch'){drawHatch(dt)}
else{if(mode===2&&state!=='menu'){ctx.strokeStyle='rgba(255,255,255,.35)';ctx.setLineDash([6,8]);ctx.beginPath();ctx.moveTo(180,0);ctx.lineTo(180,GROUND);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,0,W,6);ctx.fillStyle='#ffd23f';ctx.fillRect(0,0,W*timeLeft/45,6)}
eggs.forEach(e=>egg(ctx,e.x,e.y,e.t,e.rot,1.1));lanes.forEach((L,i)=>basket(L,i));
lanes.forEach((L,i)=>{if(L.combo>=2&&state==='play'){ctx.font='800 14px system-ui';ctx.textAlign=mode===2?'center':'left';ctx.fillStyle='#ffd23f';ctx.strokeStyle='rgba(0,0,0,.6)';ctx.lineWidth=3;const x=mode===2?L.x0+L.w/2:12,m=Math.min(5,1+Math.floor(L.combo/5));ctx.strokeText('COMBO '+L.combo+(m>1?'  x'+m:''),x,28);ctx.fillText('COMBO '+L.combo+(m>1?'  x'+m:''),x,28)}})}
parts.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r*(.4+p.life*.6),0,6.283);ctx.fill()});ctx.globalAlpha=1;
floats.forEach(f=>{ctx.globalAlpha=Math.min(1,f.life*2);ctx.font='800 '+f.s+'px system-ui,sans-serif';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.strokeText(f.t,f.x,f.y);ctx.fillStyle=f.c;ctx.fillText(f.t,f.x,f.y)});ctx.globalAlpha=1;
ctx.restore();shake=Math.max(0,shake-dt*22)}
function drawHatch(dt){hatch.t+=dt;ctx.fillStyle='rgba(15,8,30,.55)';ctx.fillRect(0,0,W,H);const n=lanes.length;
ctx.fillStyle='#fff';ctx.font='800 16px system-ui';ctx.textAlign='center';ctx.fillText('🥚 Hatching…  (tap to skip)',W/2,34);
lanes.forEach((L,i)=>{const cx=L.x0+L.w/2,cy=H*.45,list=hatch.shown[i],it=list[hatch.step],s=n===1?150:84;
if(!list.length){ctx.fillStyle='#fff';ctx.font='700 14px system-ui';ctx.fillText('No eggs caught',cx,cy);return}
if(!it){ctx.fillStyle='#fff';ctx.font='700 14px system-ui';ctx.fillText(mode===2?'✔ done':'',cx,cy);return}
const t=hatch.t;
if(t<.9){const w=Math.sin(t*(14+t*18))*(.05+t*.18);egg(ctx,cx,cy,it.rar===0?0:it.rar,0,n===1?3.2:1.9,w);if(t>.55&&Math.random()<.4)sfx.crack()}
else{if(!hatch.ph[i]){hatch.ph[i]=1;it.rar===3?sfx.legend():sfx.pop(it.rar);burst(cx,cy,RC[it.rar],40,2);shake=it.rar>=2?8:3}
const k=Math.min(1,(t-.9)*3),pop=1+(1-k)*.5*Math.sin(k*3.14);const sp=SP[it.id];
if(it.rar>=2){ctx.save();ctx.translate(cx,cy);ctx.rotate(time*.6);ctx.fillStyle=RC[it.rar]+'33';for(let r=0;r<8;r++){ctx.rotate(.785);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(s*1.3,-14);ctx.lineTo(s*1.3,14);ctx.fill()}ctx.restore()}
critter(ctx,cx,cy,s*pop,sp,time,0);
ctx.textAlign='center';ctx.font='800 '+(n===1?22:15)+'px system-ui';ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.strokeText(sp[0],cx,cy+s*.85);ctx.fillStyle='#fff';ctx.fillText(sp[0],cx,cy+s*.85);
ctx.font='700 '+(n===1?15:12)+'px system-ui';ctx.fillStyle=RC[it.rar];ctx.strokeText(RN[it.rar]+(it.isNew?' · NEW!':''),cx,cy+s*.85+20);ctx.fillText(RN[it.rar]+(it.isNew?' · NEW!':''),cx,cy+s*.85+20);}});
const mx=Math.max(0,...hatch.shown.map(l=>l.length));if(state==='hatch'&&hatch.t>(mx===0?1.2:2.0))nextHatch();ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='700 12px system-ui';ctx.textAlign='center';ctx.fillText(Math.min(hatch.step+1,mx)+' / '+mx,W/2,H-24)}
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;if(state==='play')update(dt);else if(state!=='hatch'){parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=380*dt;p.life-=dt*1.6});parts=parts.filter(p=>p.life>0)}else{parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=380*dt;p.life-=dt*1.6});parts=parts.filter(p=>p.life>0)}draw(dt)}
/* ---------- input ---------- */
function laneAt(e){const b=cvs.getBoundingClientRect(),x=(e.clientX-b.left)*(W/b.width);return{x,l:lanes.length===1?0:(x<180?0:1)}}
cvs.addEventListener('pointerdown',e=>{ac();if(state==='hatch'){if(hatch.t>.9)nextHatch();else hatch.t=.9;return}if(state!=='play')return;const p=laneAt(e);ptr[e.pointerId]=p.l;lanes[p.l].tx=p.x});
cvs.addEventListener('pointermove',e=>{if(state!=='play')return;if(!(e.buttons||e.pointerType==='touch'))return;const b=cvs.getBoundingClientRect(),x=(e.clientX-b.left)*(W/b.width);const l=ptr[e.pointerId];if(l!==undefined&&lanes[l])lanes[l].tx=x});
cvs.addEventListener('pointerup',e=>{delete ptr[e.pointerId]});
addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;if(['a','d','ArrowLeft','ArrowRight'].includes(k)){keys[k]=true;e.preventDefault()}
if(k==='Enter'||k===' '){e.preventDefault();if(state==='hatch'){if(hatch.t>.9)nextHatch();else hatch.t=.9}else if(!$('ov').classList.contains('hide')){const b=$('b1')||$('ag');if(b)b.click()}}});
addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false});
/* ---------- boot ---------- */
mkLanes(1);menu();requestAnimationFrame(loop);
window.__ere={get state(){return state},get lanes(){return lanes},get eggs(){return eggs},get lives(){return lives},start,SV,get hatch(){return hatch}};
