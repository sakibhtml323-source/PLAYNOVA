<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Sand Draw #322</title><style>
body{margin:0;font-family:system-ui;background:#1c1917;color:#fafaf9;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a8a29e;font-size:.78rem}
canvas{background:#d6b98a;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#1c1917;font-weight:800;cursor:pointer;font-size:1rem;margin:4px}
</style></head><body>
<h1>🏜️ Desert Sand Draw</h1><div class="sub">Trace the shape in the sand before the wind erases it!</div>
<div id="hud"><span>Level <b id="l">1</b></span><span>Complete <b id="c">0</b>%</span><span>⏱️ <b id="t">20</b>s</span></div>
<canvas id="cv" width="400" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">🏺</div><p>Draw over the white outline.<br>Cover 80% to pass the level!</p><button id="btn">Draw</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=400;let shape=[],drawing=false,level=1,playing=false,time=20,timer=null,pathSoFar=[];
function genShape(){const type=level%3;shape=[];
if(type===0){for(let a=0;a<=Math.PI*2.01;a+=0.1){shape.push({x:200+100*Math.cos(a),y:200+100*Math.sin(a),done:false});}}
else if(type===1){for(let i=0;i<=20;i++)shape.push({x:100+i*10,y:150,done:false});
for(let i=0;i<=20;i++)shape.push({x:300,y:150+i*5,done:false});
for(let i=0;i<=20;i++)shape.push({x:300-i*10,y:250,done:false});
for(let i=0;i<=20;i++)shape.push({x:100,y:250-i*5,done:false});}
else{for(let i=0;i<=30;i++)shape.push({x:120+i*5.3,y:300-i*5,done:false});
for(let i=0;i<=30;i++)shape.push({x:280-i*5.3,y:150+i*5,done:false});
for(let i=0;i<=30;i++)shape.push({x:120+i*5.3,y:300,done:false});}
document.getElementById('l').textContent=level;draw();}
cvs.addEventListener('pointerdown',e=>{if(!playing)return;drawing=true;});
cvs.addEventListener('pointermove',e=>{if(!drawing||!playing)return;const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*W/r.height;
pathSoFar.push({x,y});
shape.forEach(s=>{if(!s.done&&Math.hypot(s.x-x,s.y-y)<14){s.done=true;}});
check();draw();});
cvs.addEventListener('pointerup',()=>{drawing=false;});
function check(){const done=shape.filter(s=>s.done).length;
const pct=Math.round(done/shape.length*100);
document.getElementById('c').textContent=pct;
if(pct>=80){playing=false;clearInterval(timer);beep(880,.3,'triangle');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🎨 Shape complete!<br>Level '+(level+1);
level++;setTimeout(()=>{document.getElementById('ov').style.display='none';startLevel();},1200);}}
function startLevel(){genShape();time=Math.max(10,20-level);document.getElementById('t').textContent=time;
pathSoFar=[];playing=true;
clearInterval(timer);timer=setInterval(()=>{time--;document.getElementById('t').textContent=time;
if(time<=0){playing=false;clearInterval(timer);beep(130,.3,'sawtooth');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='💨 Wind erased it! Try again.';}},1000);}
function draw(){ctx.fillStyle='#d6b98a';ctx.fillRect(0,0,W,W);
// path so far
if(pathSoFar.length>1){ctx.strokeStyle='#92400e';ctx.lineWidth=8;ctx.lineCap='round';
ctx.beginPath();ctx.moveTo(pathSoFar[0].x,pathSoFar[0].y);
pathSoFar.forEach(p=>ctx.lineTo(p.x,p.y));ctx.stroke();}
// shape outline
shape.forEach(s=>{ctx.beginPath();ctx.arc(s.x,s.y,s.done?2:4,0,7);
ctx.fillStyle=s.done?'#22c55e':'#f8fafc';ctx.fill();});}
document.getElementById('btn').onclick=()=>{level=1;AU.__c=new (window.AudioContext||window.webkitAudioContext)();
document.getElementById('ov').style.display='none';startLevel();};
genShape();
</script></body></html>
