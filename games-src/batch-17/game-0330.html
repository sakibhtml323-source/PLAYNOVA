<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crystal Code Breaker #330</title><style>
body{margin:0;font-family:system-ui;background:#0f172a;color:#e2e8f0;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#94a3b8;font-size:.78rem}
#pegs{display:flex;gap:10px;margin:10px}
.p{width:52px;height:52px;border-radius:50%;background:#1e293b;border:3px solid #334155;cursor:pointer;font-size:22px;display:flex;align-items:center;justify-content:center}
#hist{max-height:160px;overflow-y:auto;width:310px;margin:6px}
.hrow{display:flex;gap:5px;align-items:center;margin:3px;font-size:.8rem}
.fb{display:flex;gap:2px}
.dot{width:16px;height:16px;border-radius:50%;font-size:.6rem;display:flex;align-items:center;justify-content:center;font-weight:800}
#hud{display:flex;gap:14px;font-size:.9rem;margin:4px}#hud b{color:#facc15}
button{padding:10px 22px;border-radius:999px;border:none;background:#7c3aed;color:#fff;font-weight:700;cursor:pointer;margin:6px}
#msg{min-height:1.3em;font-weight:600}
</style></head><body>
<h1>🔮 Crystal Code Breaker</h1><div class="sub">4-symbol code, 8 attempts. 🟢 right place, 🟡 right symbol wrong place.</div>
<div id="hud"><span>Attempts <b id="a">8</b></span><span>Score <b id="s">0</b></span></div>
<div id="pegs"></div>
<button id="try">🔓 Crack It</button>
<div id="hist"></div><div id="msg"></div>
<button id="btn">🎲 New Code</button>
<audio id="au"></audio>
<script>
"use strict";
const AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const SYM=['💎','🔮','👑','⚜️','🌟','🗝️'];let secret=[],cur=[0,0,0,0],attempts=8,score=0,round=1;
function newCode(){secret=[];for(let i=0;i<4;i++)secret.push((Math.random()*SYM.length)|0);
cur=[0,0,0,0];attempts=8;
document.getElementById('a').textContent=8;
document.getElementById('hist').innerHTML='';
build();msg('Crack the crystal code!');}
function build(){const p=document.getElementById('pegs');p.innerHTML='';
cur.forEach((v,i)=>{const d=document.createElement('div');d.className='p';
d.textContent=SYM[v];
d.onclick=()=>{cur[i]=(cur[i]+1)%SYM.length;d.textContent=SYM[cur[i]];beep(400+i*60,.05);};
p.appendChild(d);});}
document.getElementById('try').onclick=()=>{if(attempts<=0)return;
let exact=0,partial=0;const sc={},gc={};
for(let i=0;i<4;i++){if(cur[i]===secret[i])exact++;
else{sc[secret[i]]=(sc[secret[i]]||0)+1;gc[cur[i]]=(gc[cur[i]]||0)+1;}}
Object.keys(gc).forEach(k=>{partial+=Math.min(gc[k],sc[k]||0);});
attempts--;document.getElementById('a').textContent=attempts;
const row=document.createElement('div');row.className='hrow';
cur.forEach(v=>{const d=document.createElement('div');d.className='dot';d.style.background='#334155';
d.textContent=SYM[v];row.appendChild(d);});
const fb=document.createElement('div');fb.className='fb';
for(let i=0;i<exact;i++){const d=document.createElement('div');d.className='dot';d.style.background='#22c55e';d.textContent='✓';fb.appendChild(d);}
for(let i=0;i<partial;i++){const d=document.createElement('div');d.className='dot';d.style.background='#eab308';d.textContent='~';fb.appendChild(d);}
row.appendChild(fb);
document.getElementById('hist').prepend(row);
if(exact===4){score+=attempts*50+100;document.getElementById('s').textContent=score;
beep(880,.3,'triangle');msg('🔓 Cracked! +'+((8-attempts===0?8:attempts)*50+100));
round++;setTimeout(newCode,1200);return;}
beep(200,.1,'sawtooth');
if(attempts<=0){msg('🔒 Sealed! Code: '+secret.map(i=>SYM[i]).join(' '));
setTimeout(newCode,1800);}};
function msg(t){document.getElementById('msg').textContent=t;}
document.getElementById('btn').onclick=()=>{AU.__c=new (window.AudioContext||window.webkitAudioContext)();newCode();};
newCode();
</script></body></html>
