<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ninja Balance Tower #331</title><style>
body{margin:0;font-family:system-ui;background:#111827;color:#f9fafb;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#9ca3af;font-size:.78rem}
canvas{background:#1f2937;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#facc15}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#facc15;color:#111827;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🥷 Ninja Balance Tower</h1><div class="sub">Stack the ninja clan — each one swings wider than the last!</div>
<div id="hud"><span>Stacked <b id="s">0</b></span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="400" height="480"></canvas>
<div id="ov"><div style="font-size:3rem">🗼</div><p>Ninjas swing left-right.<br>Tap to drop — stack them all!</p><button id="btn">Stack</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=400,H=480,NH=44;
let stack=[],sway=0,playing=false,best=+localStorage.getItem('nbt_best')||0;
document.getElementById('b').textContent=best;
const NIN=['🥷','👤','🧑‍🚀','🦸','🧙','🥷'];
function draw(){ctx.fillStyle='#1f2937';ctx.fillRect(0,0,W,H);
const baseY=H-40;
ctx.fillStyle='#374151';ctx.fillRect(100,baseY,200,14);
let lean=0;const leanPer=Math.min(3,0.4+stack.length*0.25);
stack.forEach((n,i)=>{const y=baseY-14-i*NH;
lean+=leanPer*(n.x<200?-1:1);
ctx.save();ctx.translate(lean,y);
ctx.font='36px serif';ctx.textAlign='center';
ctx.fillText(NIN[i%NIN.length],0,-4);
ctx.restore();});
if(playing){const sy=50;const sx=200+Math.sin(sway*0.05)*Math.max(40,150-stack.length*6);
ctx.font='38px serif';ctx.fillText(NIN[stack.length%NIN.length],sx,sy);
ctx.strokeStyle='#6b7280';ctx.beginPath();ctx.moveTo(200,16);ctx.lineTo(sx,sy-24);ctx.stroke();
requestAnimationFrame(tick);}}
function tick(){sway++;draw();}
cvs.addEventListener('pointerdown',()=>{if(!playing)return;
const sx=200+Math.sin(sway*0.05)*Math.max(40,150-stack.length*6);
const miss=Math.abs(sx-200);
if(miss>70){fail();return;}
stack.push({x:sx});
beep(440+stack.length*30,.08);
document.getElementById('s').textContent=stack.length;
if(stack.length>best){best=stack.length;localStorage.setItem('nbt_best',best);document.getElementById('b').textContent=best;}});
function fail(){playing=false;beep(130,.35,'sawtooth');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🌪️ Tower toppled at <b style="color:#fbbf14">'+stack.length+'</b> ninjas!';}
document.getElementById('btn').onclick=()=>{stack=[];sway=0;
document.getElementById('s').textContent=0;
document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();};
</script></body></html>
