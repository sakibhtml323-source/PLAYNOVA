<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Legendary Traffic Control: Food Edition</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(#fff7ed,#ffedd5);font-family:Georgia,serif;color:#7c2d12;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px;overflow:hidden}
h1{font-size:1.05rem;color:#c2410c;padding:6px}
#hud{display:flex;gap:12px;font-size:.85rem;margin-bottom:8px;flex-wrap:wrap;justify-content:center}
#hud span{background:#fff;border:1px solid #fdba74;border-radius:10px;padding:4px 10px}
canvas{background:#fff7ed;border-radius:12px;border:2px solid #fdba74;touch-action:none}
#msg{text-align:center;font-size:.85rem;color:#9a3412;min-height:1.6em;margin-top:6px}
#ov{position:fixed;inset:0;background:rgba(255,247,237,.98);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#7c2d12;padding:20px;z-index:5}
button{background:#c2410c;border:none;color:#fff;font-family:inherit;font-weight:700;padding:12px 34px;border-radius:24px;font-size:1rem;cursor:pointer;margin-top:14px}
</style>
</head>
<body>
<h1>🍔 LEGENDARY FOOD TRAFFIC</h1>
<div id="hud"><span>⏱ <b id="t">0</b>s</span><span>🍕 Passed <b id="p">0</b></span><span>💥 Spills <b id="c">0</b>/3</span><span>Best <b id="b">0</b></span></div>
<canvas id="cv"></canvas>
<div id="msg">Tap a road to toggle its gate. Deliver the food trucks hot and fresh!</div>
<div id="ov"><h2 style="color:#c2410c">DELIVERY CROSSING</h2><p id="od">Food trucks from four kitchens meet at the crossing! Tap to raise/lower gates — green lets trucks pass, red halts. 3 crashes and the food goes cold!</p><button id="btn">START THE RUSH</button></div>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d');const W=440,H=440;cvs.width=W;cvs.height=H;
const CX=W/2,CY=H/2;
let cars,open,playing,time,passed,crashes,best=+localStorage.getItem('lft_best')||0;
document.getElementById('b').textContent=best;
const DIRS=[{dx:0,dy:-1,c:'#fca5a5',n:'🍕'},{dx:1,dy:0,c:'#fdba74',n:'🍔'},{dx:0,dy:1,c:'#86efac',n:'🍜'},{dx:-1,dy:0,c:'#fde68a',n:'🍩'}];
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.07,t='sine'){if(!playing)return;const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=.09;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
function resize(){const s=Math.min((window.innerWidth-12)/W,(window.innerHeight-170)/H);cvs.style.width=W*s+'px';cvs.style.height=H*s+'px';}
window.addEventListener('resize',resize);resize();
function init(){cars=[];open=[true,true,true,true];playing=true;time=0;passed=0;crashes=0;
document.getElementById('p').textContent=0;document.getElementById('c').textContent=0;}
function spawn(){const d=(Math.random()*4)|0;
if(cars.some(c=>c.dir===d&&c.prog<50))return;
cars.push({dir:d,prog:-20,sp:1.1+Math.random()*0.8,patience:100});}
cvs.addEventListener('pointerdown',e=>{if(!playing)return;audio.resume();const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
const q=x<CX?(y<CY?0:3):(y<CY?1:2);
open[q]=!open[q];beep(open[q]?700:400,.06);});
window.addEventListener('keydown',e=>{if(!playing)return;
if(e.key>='1'&&e.key<='4'){open[+e.key-1]=!open[e.key];beep(600,.05);}});
function step(){time++;if(time%60===0)spawn();
cars.forEach(c=>{const atLight=Math.abs(c.prog)<14;
if(atLight&&!open[c.dir]){c.patience-=0.4;if(c.patience<=0){c.ran=true;c.prog+=c.sp*0.5;}}
else c.prog+=c.sp;
if(Math.abs(c.prog)<10){cars.forEach(o=>{if(o!==c&&Math.abs(o.prog)<10&&o.dir!==c.dir&&DIRS[o.dir].dx!==-DIRS[c.dir].dx){
crashes++;document.getElementById('c').textContent=crashes;
cars.splice(cars.indexOf(c),1);cars.splice(cars.indexOf(o),1);beep(120,.3,'sawtooth');
if(crashes>=3)gameOver();}});return;}
if(c.prog>260){cars.splice(cars.indexOf(c),1);passed++;document.getElementById('p').textContent=passed;
if(!c.ran)beep(660,.06,'triangle');}});}
function gameOver(reason){playing=false;if(reason==='pedestrian'){document.getElementById('od').innerHTML='🚨 You hit a PEDESTRIAN!<br>Deliveries: <b style="color:#f97316">'+passed+'</b><br><button onclick="location.reload()">Try again</button>';document.getElementById('ov').style.display='flex';return;}
if(passed>best){best=passed;localStorage.setItem('lft_best',best);document.getElementById('b').textContent=best;}
document.getElementById('od').innerHTML='💥 Third crash! The food goes cold.<br>Deliveries: <b style="color:#fde047">'+passed+'</b>';
document.getElementById('btn').textContent='REOPEN KITCHEN';document.getElementById('ov').style.display='flex';}
function draw(){ctx.fillStyle='#fff7ed';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#ffedd5';ctx.fillRect(CX-28,0,56,H);ctx.fillRect(0,CY-28,W,56);
ctx.strokeStyle='#fdba74';ctx.setLineDash([10,10]);ctx.beginPath();ctx.moveTo(CX,0);ctx.lineTo(CX,H);ctx.moveTo(0,CY);ctx.lineTo(W,CY);ctx.stroke();ctx.setLineDash([]);
// center diner
ctx.fillStyle='#fdba74';ctx.beginPath();ctx.arc(CX,CY,22,0,7);ctx.fill();
ctx.font='18px serif';ctx.textAlign='center';ctx.fillText('🍽️',CX,CY+6);
[[CX-40,CY-40],[CX+40,CY-40],[CX+40,CY+40],[CX-40,CY+40]].forEach((p,i)=>{
ctx.fillStyle=open[i]?'#4ade80':'#ef4444';ctx.beginPath();ctx.arc(p[0],p[1],10,0,7);ctx.fill();
ctx.font='10px serif';ctx.fillText(DIRS[i].n,p[0],p[1]+3);});
cars.forEach(c=>{const D=DIRS[c.dir];const x=CX+D.dx*c.prog,y=CY+D.dy*c.prog;
ctx.fillStyle=D.c;ctx.fillRect(x-11,y-7,22,14);
ctx.font='9px serif';ctx.fillText('🚚',x,y+3);
if(c.patience<40){ctx.fillStyle='#ef4444';ctx.font='bold 12px serif';ctx.fillText('!',x,y-13);}});}
function loop(){if(playing){step();draw();}requestAnimationFrame(loop);}
document.getElementById('btn').onclick=()=>{audio.resume();init();document.getElementById('ov').style.display='none';};
loop();
</script>
</body>
</html>
