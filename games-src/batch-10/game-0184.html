<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Focus Trainer: Pixel Art Edition</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#0f0f0f;font-family:'Courier New',monospace;color:#4ade80;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px}
h1{font-size:1.1rem;color:#facc15;padding:6px;letter-spacing:2px;text-shadow:2px 2px #7c3aed}
#hud{display:flex;gap:14px;font-size:.9rem;margin-bottom:10px}
#panel{width:min(540px,96vw);background:#1a1a1a;border:4px solid #4ade80;border-radius:6px;padding:16px;image-rendering:pixelated;box-shadow:6px 6px 0 #14532d;min-height:280px}
#q{font-size:1.15rem;text-align:center;margin-bottom:14px;font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts button{background:#1a1a1a;border:3px solid #4ade80;border-radius:4px;padding:12px;font-family:inherit;font-size:1rem;cursor:pointer;color:#4ade80}
.opts button.ok{background:#14532d}.opts button.bad{background:#7f1d1d}
#fb{text-align:center;font-weight:700;min-height:1.6em;margin-top:10px}
#prog{height:12px;background:#0f0f0f;border:2px solid #4ade80;border-radius:4px;overflow:hidden;margin-bottom:12px}
#prog i{display:block;height:100%;background:#4ade80;width:0}
#ov{position:fixed;inset:0;background:rgba(15,15,15,.98);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#4ade80;padding:20px;z-index:5}
button.big{background:#4ade80;border:none;color:#0f0f0f;font-family:inherit;font-weight:800;padding:12px 34px;font-size:1rem;cursor:pointer;margin-top:14px;box-shadow:4px 4px #14532d}
@media(max-width:480px){.opts button{padding:9px 6px;font-size:.85rem}}
</style>
</head>
<body>
<h1>🕹 PIXEL FOCUS TRAINER</h1>
<div id="hud"><span>Stage <b id="n">1</b>/12</span><span>Score <b id="sc">0</b></span><span>Focus <b id="f">100</b>%</span><span>❤️ <b id="lv">3</b></span><span>Best <b id="b">0</b></span></div>
<div id="panel">
<div id="prog"><i id="pb"></i></div>
<div id="q">Press START!</div>
<div class="opts" id="opts"></div>
<div id="fb"></div>
</div>
<div id="ov"><h2 style="color:#facc15">STAY FOCUSED!</h2><p id="od">12 stages of rapid-fire pixel questions! The focus bar drains while you think. Wrong answers hit hard. Keep focus above zero!</p><button class="big" id="btn">INSERT COIN</button></div>
<script>

"use strict";
const QS=[
{q:'2 + 3 × 4 = ?',o:['20','14','9','24'],a:1},
{q:'Which is a fruit?',o:['Carrot','Potato','Apple','Onion'],a:2},
{q:'Pixel color of grass?',o:['Red','Blue','Green','Purple'],a:2},
{q:'10 − 4 × 2 = ?',o:['12','2','8','4'],a:1},
{q:'How many bits in a byte?',o:['4','16','8','32'],a:2},
{q:'Square has how many sides?',o:['3','5','4','6'],a:2},
{q:'"1010" in binary = ?',o:['8','12','10','5'],a:2},
{q:'20 ÷ 4 = ?',o:['4','5','6','8'],a:1},
{q:'Which is NOT a shape?',o:['Circle','Blue','Square','Triangle'],a:1},
{q:'8 × 0 + 7 = ?',o:['0','15','7','56'],a:2},
{q:'Opposite of UP?',o:['LEFT','RIGHT','SIDE','DOWN'],a:3},
{q:'First letter of "PIXEL"?',o:['X','P','E','L'],a:1}];
let idx,score,focus,timer,playing,lives=3,best=+localStorage.getItem('pf_best')||0;
document.getElementById('b').textContent=best;
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.07,t='square'){const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=.09;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
function ask(){if(idx>=12)return end();
const q=QS[idx];document.getElementById('n').textContent=idx+1;
document.getElementById('q').textContent=q.q;
const o=document.getElementById('opts');o.innerHTML='';
q.o.forEach((opt,i)=>{const b=document.createElement('button');b.textContent=opt;
b.onclick=()=>pick(i);o.appendChild(b);});
document.getElementById('fb').textContent='';clearInterval(timer);
focus=100;updBar();
timer=setInterval(()=>{focus-=2.5;updBar();if(focus<=0){clearInterval(timer);hurt('⏳ Too slow! Focus drained.');}},120);}
function updBar(){document.getElementById('pb').style.width=Math.max(0,focus)+'%';document.getElementById('f').textContent=Math.max(0,Math.round(focus));}
function pick(i){clearInterval(timer);
const q=QS[idx];const ok=i===q.a;
[...document.getElementById('opts').children].forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add('ok');else if(j===i&&!ok)b.classList.add('bad');});
if(ok){score+=Math.round(focus/10)+10;document.getElementById('sc').textContent=score;beep(700,.1,'triangle');
document.getElementById('fb').textContent='✓ +'+(Math.round(focus/10)+10);document.getElementById('fb').style.color='#4ade80';}
else hurt('✗ WRONG! Focus -25');}
function hurt(msg){focus-=25;updBar();beep(150,.2,'sawtooth');
document.getElementById('fb').textContent=msg;document.getElementById('fb').style.color='#f87171';
if(focus<=0){playing=false;setTimeout(end,700);return;}
idx++;setTimeout(ask,800);}
function end(){playing=false;clearInterval(timer);if(score>best){best=score;localStorage.setItem('pf_best',best);document.getElementById('b').textContent=best;}
const r=score>=120?'🏆 PIXEL MASTER':score>=80?'🎮 1UP':score>=40?'👾 PLAYER':'💤 SLEEP MODE';
document.getElementById('od').innerHTML=r+'<br>Score: <b style="font-size:1.5rem;color:#facc15">'+score+'</b>';
document.getElementById('btn').textContent='RETRY';document.getElementById('ov').style.display='flex';}
window.addEventListener('keydown',e=>{if(document.getElementById('ov').style.display==='flex')return;
const k=e.key;if(k>='1'&&k<='4'){const b=document.querySelectorAll('#opts button')[+k-1];if(b&&!b.disabled)b.click();}});
document.getElementById('btn').onclick=()=>{audio.resume();idx=0;score=0;focus=100;lives=3;playing=true;
document.getElementById('sc').textContent=0;document.getElementById('f').textContent=100;
document.getElementById('ov').style.display='none';ask();};

</script>
</body>
</html>
