<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Coloring Book: Glassmorphism Edition</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(135deg,#a5b4fc,#c4b5fd,#f0abfc);font-family:Georgia,serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:8px}
h1{font-size:1.05rem;color:#312e81;padding:4px}
#tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:6px}
.sw{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.8);box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer}
.sw.sel{border-color:#312e81}
#act button{background:rgba(255,255,255,.7);border:1px solid #fff;border-radius:8px;padding:6px 12px;cursor:pointer;margin-left:6px;font-size:.85rem;color:#312e81}
canvas{background:rgba(255,255,255,.5);backdrop-filter:blur(8px);border-radius:12px;touch-action:none}
#pages{display:flex;gap:6px;margin-top:6px}
#pages button{border:1px solid #fff;background:rgba(255,255,255,.6);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:.8rem;color:#312e81}
</style>
</head>
<body>
<h1>🎨 GLASS COLORING BOOK</h1>
<div id="tools"></div>
<div id="act"><button id="clear">↺ Clear / Reset</button><button id="save">💾 Save</button><button id="wipe">🗑 Reset all</button><button id="prev">◀</button><button id="next">▶</button><span id="pinfo" style="font-size:.8rem;color:#312e81;margin-left:6px"></span></div>
<canvas id="c"></canvas>
<script>
"use strict";
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
const W=480,H=420;cvs.width=W;cvs.height=H;
const COLORS=['#312e81','#ef4444','#f97316','#facc15','#22c55e','#0ea5e9','#8b5cf6','#ec4899','#ffffff'];
let color=COLORS[1],page=0,drawing=false;
const PAGES=[{n:'Crystal',d:'💎'},{n:'Feather',d:'🪶'},{n:'Cloud',d:'☁️'},{n:'Butterfly',d:'🦋'}];
function resize(){const s=Math.min((window.innerWidth-16)/W,(window.innerHeight-200)/H,1);cvs.style.width=W*s+'px';cvs.style.height=H*s+'px';}
window.addEventListener('resize',resize);resize();
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f){const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=.06;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.06);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.06);}
const tl=document.getElementById('tools');
COLORS.forEach((c2,i)=>{const d=document.createElement('div');d.className='sw'+(i===1?' sel':'');d.style.background=c2;
d.onclick=()=>{color=c2;document.querySelectorAll('.sw').forEach(x=>x.classList.remove('sel'));d.classList.add('sel');audio.resume();beep(440+i*45);};tl.appendChild(d);});
function base(){ctx.fillStyle='rgba(255,255,255,.55)';ctx.fillRect(0,0,W,H);
ctx.strokeStyle='#312e81';ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';
if(page===0){ // crystal
ctx.beginPath();ctx.moveTo(W/2,60);ctx.lineTo(W/2+70,H/2+30);ctx.lineTo(W/2,H-60);ctx.lineTo(W/2-70,H/2+30);ctx.closePath();ctx.stroke();
ctx.beginPath();ctx.moveTo(W/2,60);ctx.lineTo(W/2,H-60);ctx.stroke();
ctx.beginPath();ctx.moveTo(W/2-70,H/2+30);ctx.lineTo(W/2+70,H/2+30);ctx.stroke();}
else if(page===1){ // feather
ctx.beginPath();ctx.moveTo(W/2,H-60);ctx.quadraticCurveTo(W/2+50,H/2,W/2,H-140);ctx.stroke();
ctx.beginPath();ctx.moveTo(W/2,H-60);ctx.quadraticCurveTo(W/2-50,H/2,W/2,H-140);ctx.stroke();
for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(W/2,H-100-i*14);ctx.lineTo(W/2+34-i*4,H-112-i*14);ctx.stroke();
ctx.beginPath();ctx.moveTo(W/2,H-100-i*14);ctx.lineTo(W/2-34+i*4,H-112-i*14);ctx.stroke();}}
else if(page===2){ // cloud
ctx.beginPath();ctx.arc(W/2-60,H/2,44,0,7);ctx.stroke();
ctx.beginPath();ctx.arc(W/2,H/2-24,54,0,7);ctx.stroke();
ctx.beginPath();ctx.arc(W/2+60,H/2,44,0,7);ctx.stroke();
ctx.strokeRect(W/2-100,H/2+30,200,20);
for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(80+i*100,H-80,12,0,7);ctx.stroke();}}
else{ // butterfly
ctx.beginPath();ctx.ellipse(W/2-50,H/2-40,42,28,-0.5,0,7);ctx.stroke();
ctx.beginPath();ctx.ellipse(W/2+50,H/2-40,42,28,0.5,0,7);ctx.stroke();
ctx.beginPath();ctx.ellipse(W/2-44,H/2+40,34,22,0.4,0,7);ctx.stroke();
ctx.beginPath();ctx.ellipse(W/2+44,H/2+40,34,22,-0.4,0,7);ctx.stroke();
ctx.beginPath();ctx.ellipse(W/2,H/2,10,50,0,0,7);ctx.stroke();
ctx.beginPath();ctx.moveTo(W/2,H/2-50);ctx.lineTo(W/2-16,H/2-80);ctx.stroke();
ctx.beginPath();ctx.moveTo(W/2,H/2-50);ctx.lineTo(W/2+16,H/2-80);ctx.stroke();}}
function restore(){base();const img=localStorage.getItem('cbg_'+page);if(img){const i2=new Image();i2.onload=()=>ctx.drawImage(i2,0,0);i2.src=img;}}
function pos(e){const r=cvs.getBoundingClientRect();const p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)/r.width*W,y:(p.clientY-r.top)/r.height*H};}
function startD(e){audio.resume();drawing=true;const p=pos(e);ctx.strokeStyle=color;ctx.lineWidth=color==='#ffffff'?28:7;
ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+.1,p.y+.1);ctx.stroke();e.preventDefault();}
function moveD(e){if(!drawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault();}
function endD(){drawing=false;}
cvs.addEventListener('pointerdown',startD);cvs.addEventListener('pointermove',moveD);
window.addEventListener('pointerup',endD);
document.getElementById('clear').onclick=()=>{base();localStorage.removeItem('cbg_'+page);beep(220);};
document.getElementById('wipe').onclick=()=>{for(let i=0;i<4;i++)localStorage.removeItem('cbg_'+i);setPage(page);};
document.getElementById('save').onclick=()=>{localStorage.setItem('cbg_'+page,cvs.toDataURL());beep(880);
document.getElementById('pinfo').textContent='Saved ✓';setTimeout(()=>document.getElementById('pinfo').textContent='',1500);};
function setPage(p2){page=(p2+PAGES.length)%PAGES.length;restore();
document.getElementById('pinfo').textContent='Page '+(page+1)+'/'+PAGES.length+' — '+PAGES[page].n+' '+PAGES[page].d;}
document.getElementById('prev').onclick=()=>setPage(page-1);
document.getElementById('next').onclick=()=>setPage(page+1);
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();
if(k>='1'&&k<='9'){const i=+k-1;if(i<COLORS.length)document.querySelectorAll('.sw')[i].click();}
if(k==='c')document.getElementById('clear').click();
if(k==='s')document.getElementById('save').click();
if(k==='arrowleft')setPage(page-1);if(k==='arrowright')setPage(page+1);});
setPage(0);
</script>
</body>
</html>
