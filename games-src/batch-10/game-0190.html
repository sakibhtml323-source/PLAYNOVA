<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Phoenix Arctic Legend</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(#e0f2fe,#bae6fd);font-family:Georgia,serif;color:#0c4a6e;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden}
h1{font-size:1.1rem;color:#0284c7;padding:6px}
#hud{display:flex;gap:14px;font-size:.9rem;margin-bottom:4px}
canvas{background:#f0f9ff;border-radius:12px;touch-action:none}
#ov{position:fixed;inset:0;background:rgba(240,249,255,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#0c4a6e;padding:20px;z-index:5}
button{background:#0284c7;color:#fff;border:none;font-family:inherit;font-weight:700;padding:12px 32px;border-radius:24px;font-size:1rem;cursor:pointer;margin-top:14px}
</style>
</head>
<body>
<h1>🔥 PHOENIX ARCTIC LEGEND</h1>
<div id="hud"><span>Score <b id="s">0</b></span><span>Heat <b id="ht">100</b>%</span><span>Combo <b id="cb">0</b></span><span>Best <b id="b">0</b></span></div>
<canvas id="c"></canvas>
<div id="ov"><h2 style="color:#0284c7">FROZEN FLAME</h2><p id="od">The phoenix reborn in ice! Glide through the arctic sky — steer with ← → / A D or drag. Collect fire-seeds 🔥 to keep warm, avoid the snow wisps ❄. Heat drains — freeze and fall!</p><button id="btn">REBIRTH</button></div>
<script>
"use strict";
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');const W=420,H=520;cvs.width=W;cvs.height=H;
let me,seeds,foes,playing,keys,heat,score,combo,frame,best=+localStorage.getItem('pal_best')||0;
document.getElementById('b').textContent=best;
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.06,t='sine'){if(!playing)return;const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=.09;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
function resize(){const s=Math.min((window.innerWidth-12)/W,(window.innerHeight-140)/H);cvs.style.width=W*s+'px';cvs.style.height=H*s+'px';}
window.addEventListener('resize',resize);resize();
function init(){me={x:W/2,y:H-70,r:12};seeds=[];foes=[];playing=true;keys={};heat=100;score=0;combo=0;frame=0;
document.getElementById('s').textContent=0;document.getElementById('ht').textContent=100;document.getElementById('cb').textContent=0;}
window.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let dragX=null;
cvs.addEventListener('pointerdown',e=>{audio.resume();const r=cvs.getBoundingClientRect();dragX=(e.clientX-r.left)/r.width*W;});
cvs.addEventListener('pointermove',e=>{if(dragX===null)return;const r=cvs.getBoundingClientRect();dragX=(e.clientX-r.left)/r.width*W;});
window.addEventListener('pointerup',()=>dragX=null);
function step(){frame++;
if(keys['arrowleft']||keys['a'])me.x-=4.8;if(keys['arrowright']||keys['d'])me.x+=4.8;
if(dragX!==null)me.x=dragX;
me.x=Math.max(16,Math.min(W-16,me.x));
heat-=0.1;document.getElementById('ht').textContent=Math.max(0,Math.round(heat));
if(heat<=0)return freeze();
if(frame%20===0){const r=Math.random();
if(r<0.55)seeds.push({x:20+Math.random()*(W-40),y:-14,got:false});
else foes.push({x:20+Math.random()*(W-40),y:-16,wob:Math.random()*7,r:9});}
seeds.forEach(o=>o.y+=2.6);foes.forEach(f=>{f.y+=2.8;f.x+=Math.sin(f.y/28+f.wob)*1.1;});
seeds=seeds.filter(o=>o.y<H+20&&!o.got);foes=foes.filter(f=>f.y<H+20);
seeds.forEach(o=>{if(!o.got&&Math.hypot(o.x-me.x,o.y-me.y)<24){o.got=true;heat=Math.min(100,heat+12);combo++;
score+=10+combo*3;document.getElementById('s').textContent=score;document.getElementById('cb').textContent=combo;document.getElementById('ht').textContent=Math.round(heat);
beep(600+combo*25,.07,'triangle');}});
foes.forEach(f=>{if(Math.hypot(f.x-me.x,f.y-me.y)<f.r+me.r-2){heat-=15;combo=0;
document.getElementById('ht').textContent=Math.max(0,Math.round(heat));document.getElementById('cb').textContent=0;
foes.splice(foes.indexOf(f),1);beep(140,.2,'sawtooth');
if(heat<=0)freeze();}});}
function freeze(){if(!playing)return;playing=false;
if(score>best){best=score;localStorage.setItem('pal_best',best);document.getElementById('b').textContent=best;}
document.getElementById('od').innerHTML='❄ The phoenix freezes at <b style="color:#0284c7">'+score+'</b> points…';
document.getElementById('btn').textContent='REBIRTH AGAIN';document.getElementById('ov').style.display='flex';beep(110,.5,'sawtooth');}
function draw(){ctx.fillStyle='#f0f9ff';ctx.fillRect(0,0,W,H);
// snow
ctx.fillStyle='#fff';for(let i=0;i<20;i++){const y=(i*53+frame*2)%H;const x=(i*97+Math.sin(frame/30+i)*20)%W;
ctx.beginPath();ctx.arc(x,y,1.5+(i%3),0,7);ctx.globalAlpha=.6;ctx.fill();ctx.globalAlpha=1;}
seeds.forEach(o=>{const g2=ctx.createRadialGradient(o.x,o.y,2,o.x,o.y,14);
g2.addColorStop(0,'#fb923c');g2.addColorStop(1,'rgba(251,146,60,0)');
ctx.fillStyle=g2;ctx.beginPath();ctx.arc(o.x,o.y,14,0,7);ctx.fill();
ctx.fillStyle='#ea580c';ctx.beginPath();ctx.arc(o.x,o.y,5,0,7);ctx.fill();});
foes.forEach(f=>{ctx.fillStyle='#bae6fd';ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,7);ctx.fill();
ctx.strokeStyle='#7dd3fc';ctx.beginPath();ctx.arc(f.x,f.y,f.r+3,0,7);ctx.stroke();});
// phoenix
const g3=ctx.createRadialGradient(me.x,me.y,2,me.x,me.y,me.r*2.6);
g3.addColorStop(0,'rgba(251,146,60,.9)');g3.addColorStop(1,'rgba(251,146,60,0)');
ctx.fillStyle=g3;ctx.beginPath();ctx.arc(me.x,me.y,me.r*2.6,0,7);ctx.fill();
ctx.fillStyle='#fb923c';ctx.beginPath();ctx.arc(me.x,me.y,me.r,0,7);ctx.fill();
ctx.fillStyle='#fde047';ctx.beginPath();ctx.arc(me.x+2,me.y-3,me.r*0.5,0,7);ctx.fill();}
function loop(){if(playing){step();draw();}requestAnimationFrame(loop);}
document.getElementById('btn').onclick=()=>{audio.resume();init();document.getElementById('ov').style.display='none';};
loop();
</script>
</body>
</html>
