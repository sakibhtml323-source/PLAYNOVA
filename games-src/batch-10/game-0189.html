<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Medieval Arena</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(#44403c,#292524);font-family:Georgia,serif;color:#fde68a;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden}
h1{font-size:1.1rem;color:#fbbf24;padding:6px;letter-spacing:1px}
#hud{display:flex;gap:14px;font-size:.9rem;margin-bottom:4px}
canvas{background:#57534e;border-radius:10px;touch-action:none}
#ov{position:fixed;inset:0;background:rgba(41,37,36,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fde68a;padding:20px;z-index:5}
button{background:#fbbf24;border:none;color:#292524;font-weight:800;padding:12px 32px;border-radius:24px;font-size:1rem;cursor:pointer;margin-top:14px;font-family:inherit}
</style>
</head>
<body>
<h1>🏰 MEDIEVAL ARENA</h1>
<div id="hud"><span>Score <b id="s">0</b></span><span>❤️ <b id="h">100</b></span><span>Wave <b id="w">1</b></span><span>Best <b id="b">0</b></span></div>
<div id="shop" style="display:none"></div><canvas id="c"></canvas>
<div id="ov"><h2 style="color:#fbbf24">ARENA SURVIVAL</h2><p id="od">You are the last knight of the medieval arena! Your sword auto-swings at the nearest foe. Move with WASD/arrows or drag. Grab 🍗 for health and 💰 for score. Survive the waves!</p><button id="btn">ENTER THE LISTS</button></div>
<script>


"use strict";
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');const W=460,H=440;cvs.width=W;cvs.height=H;
let me,foes,shots,pickups,score,hp,wave,playing,keys,frame,best=+localStorage.getItem('ma_best')||0;
document.getElementById('b').textContent=best;
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.06,t='square'){if(!playing)return;const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=.09;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
function resize(){const s=Math.min((window.innerWidth-12)/W,(window.innerHeight-140)/H);cvs.style.width=W*s+'px';cvs.style.height=H*s+'px';}
window.addEventListener('resize',resize);resize();

let dmg=1,rate=16,spd=2.4;
function openShop(){if(wave%3!==0){hp=Math.min(100,hp+10);spawnWave();beep(440,.12,'triangle');return;} playing=false;const b=document.getElementById('shop');if(!b)return; b.innerHTML='<h3>WAVE '+wave+' SHOP</h3>';[['+Damage',()=>dmg+=1],['+Fire rate',()=>rate=Math.max(4,rate-3)],['+Move speed',()=>spd+=0.5]].forEach(u=>{const bt=document.createElement('button');bt.textContent=u[0];bt.onclick=()=>{u[1]();b.style.display='none';hp=Math.min(100,hp+10);spawnWave();playing=true;beep(660,.1);};b.appendChild(bt);});b.style.display='block';}
function init(){me={x:W/2,y:H/2,r:14,cd:0};foes=[];shots=[];pickups=[];score=0;hp=100;wave=1;keys={};frame=0;playing=true;
document.getElementById('s').textContent=0;document.getElementById('h').textContent=100;document.getElementById('w').textContent=1;}
window.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let drag=null;
cvs.addEventListener('pointerdown',e=>{audio.resume();const r=cvs.getBoundingClientRect();drag={x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};});
cvs.addEventListener('pointermove',e=>{if(!drag)return;const r=cvs.getBoundingClientRect();drag={x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};});
window.addEventListener('pointerup',()=>drag=null);
function spawnWave(){const n=2+wave;for(let i=0;i<n;i++){const a=Math.random()*7;
foes.push({x:W/2+Math.cos(a)*290,y:H/2+Math.sin(a)*290,hp:1+((wave/3)|0),sp:0.75+wave*0.09,e:['🐗','🗡️','🏴'][(Math.random()*3)|0],hot:0});}}
function step(){frame++;const sp=3.2;
if(keys['w']||keys['arrowup'])me.y-=spd;if(keys['s']||keys['arrowdown'])me.y+=spd;
if(keys['a']||keys['arrowleft'])me.x-=spd;if(keys['d']||keys['arrowright'])me.x+=spd;
if(drag){const dx=drag.x-me.x,dy=drag.y-me.y,d=Math.hypot(dx,dy);if(d>5){me.x+=dx/d*spd;me.y+=dy/d*spd;}}
me.x=Math.max(16,Math.min(W-16,me.x));me.y=Math.max(16,Math.min(H-16,me.y));
me.cd--;
if(me.cd<=0){let nf=null,nd=1e9;foes.forEach(f=>{const d=Math.hypot(f.x-me.x,f.y-me.y);if(d<nd){nd=d;nf=f;}});
if(nf&&nd<50){me.cd=rate;nf.hp-=dmg;nf.hot=6;beep(300+Math.random()*80,.07,'sawtooth');
if(nf.hp<=0){foes.splice(foes.indexOf(nf),1);score+=20;document.getElementById('s').textContent=score;
if(Math.random()<0.2)pickups.push({x:nf.x,y:nf.y,t:Math.random()<0.5?'🍗':'💰'});}}}
foes.forEach(f=>{const a=Math.atan2(me.y-f.y,me.x-f.x);f.x+=Math.cos(a)*f.sp;f.y+=Math.sin(a)*f.sp;if(f.hot>0)f.hot--;
if(Math.hypot(f.x-me.x,f.y-me.y)<f.r+me.r-2){hp-=0.8;document.getElementById('h').textContent=Math.max(0,Math.round(hp));if(hp<=0)die();}});
pickups.forEach(p=>{if(Math.hypot(p.x-me.x,p.y-me.y)<22){if(p.t==='🍗')hp=Math.min(100,hp+25);else score+=30;
document.getElementById('s').textContent=score;document.getElementById('h').textContent=Math.round(hp);
pickups.splice(pickups.indexOf(p),1);beep(880,.07);}});
if(!foes.length){wave++;document.getElementById('w').textContent=wave;openShop();}}
function die(){playing=false;if(score>best){best=score;localStorage.setItem('ma_best',best);document.getElementById('b').textContent=best;}
document.getElementById('od').innerHTML='You fall on wave <b>'+wave+'</b>…<br>Score: <b style="color:#fde047">'+score+'</b>';
document.getElementById('btn').textContent='RISE AGAIN';document.getElementById('ov').style.display='flex';beep(110,.5,'sawtooth');}
function draw(){ctx.fillStyle='#57534e';ctx.fillRect(0,0,W,H);
ctx.strokeStyle='#44403c';for(let x=0;x<W;x+=44)ctx.strokeRect(x,0,44,44);
ctx.strokeStyle='#fbbf2433';ctx.beginPath();ctx.arc(W/2,H/2,120,0,7);ctx.stroke();
pickups.forEach(p=>{ctx.font='15px serif';ctx.textAlign='center';ctx.fillText(p.t,p.x,p.y+5);});
foes.forEach(f=>{ctx.font='20px serif';ctx.globalAlpha=f.hot>0?0.7:1;ctx.fillText(f.e,f.x,f.y+7);ctx.globalAlpha=1;});
// knight
ctx.fillStyle='#94a3b8';ctx.beginPath();ctx.arc(me.x,me.y,me.r,0,7);ctx.fill();
ctx.fillStyle='#fbbf24';ctx.fillRect(me.x-8,me.y-4,16,4);
ctx.fillStyle='#111';ctx.fillRect(me.x+3,me.y-4,3,4);
ctx.strokeStyle='#e2e8f0';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(me.x+10,me.y+4);ctx.lineTo(me.x+22,me.y+12);ctx.stroke();}
function loop(){if(playing){step();draw();}requestAnimationFrame(loop);}
document.getElementById('btn').onclick=()=>{audio.resume();init();spawnWave();document.getElementById('ov').style.display='none';};
loop();


</script>
</body>
</html>
