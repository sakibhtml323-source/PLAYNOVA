<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Side-Scroller: Arctic Edition</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(#e0f2fe,#bae6fd);font-family:Georgia,serif;color:#0c4a6e;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden}
h1{font-size:1.05rem;color:#0284c7;padding:6px}
#hud{display:flex;gap:14px;font-size:.9rem;margin-bottom:4px}
canvas{background:#f0f9ff;border-radius:12px;touch-action:none}
#ov{position:fixed;inset:0;background:rgba(240,249,255,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#0c4a6e;padding:20px;z-index:5}
button{background:#0284c7;color:#fff;border:none;font-family:inherit;font-weight:700;padding:12px 32px;border-radius:24px;font-size:1rem;cursor:pointer;margin-top:14px}
</style>
</head>
<body>
<h1>🐧 ARCTIC SIDE-SCROLLER</h1>
<div id="hud"><span>Score <b id="s">0</b></span><span>❤️ <b id="h">3</b></span><span>Distance <b id="d">0</b>m</span><span>Best <b id="b">0</b>m</span></div>
<canvas id="c"></canvas>
<div id="ov"><h2 style="color:#0284c7">PENGUIN DASH</h2><p id="od">🌀 GRAVITY GATES flip you onto the ceiling — dodge pink ceiling spikes! The penguin dashes the endless arctic! Auto-run — tap/Space to jump (double-jump), slide with ↓. Grab 🐟 fish, avoid the ice spikes and seals!</p><button id="btn">WADDLE OUT</button></div>
<script>


"use strict";
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');const W=520,H=260;cvs.width=W;cvs.height=H;const GY=H-42;
let pingu,obs,fish,playing,speed,dist,hp,jumps,frame,duck,flipT=0,best=+localStorage.getItem('ass_best')||0;
document.getElementById('b').textContent=best;
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.06,t='square'){if(!playing)return;const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=.09;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
function resize(){const s=Math.min((window.innerWidth-12)/W,(window.innerHeight-140)/H);cvs.style.width=W*s+'px';cvs.style.height=H*s+'px';}
window.addEventListener('resize',resize);resize();
function init(){pingu={x:80,y:GY,vy:0,w:22,h:26,onG:true,jumps:0};obs=[];fish=[];dist=0;speed=4.6;hp=3;frame=0;duck=0;playing=true;
document.getElementById('s').textContent=0;document.getElementById('h').textContent=3;document.getElementById('d').textContent=0;}
function jump(){const dir=flipT>0?1:-1;if(pingu.onG){pingu.vy=11*dir;pingu.onG=false;pingu.jumps=1;beep(520,.05);}else if(pingu.jumps<2){pingu.vy=9.5*dir;pingu.jumps++;beep(640,.05);}}
function slide(){duck=22;beep(260,.05);}
window.addEventListener('keydown',e=>{const k=e.key;if(k===' '||k==='ArrowUp'){e.preventDefault();jump();}if(k==='ArrowDown')slide();});
cvs.addEventListener('pointerdown',e=>{audio.resume();jump();});
cvs.addEventListener('pointerup',e=>{if(e.clientY&&(e.movementY||0)>40)slide();});
function step(){frame++;dist+=speed/18;speed=4.6+dist/200;
document.getElementById('d').textContent=Math.floor(dist);
if(flipT>0){flipT--;pingu.vy-=0.55;pingu.y+=pingu.vy;if(pingu.y<=34){pingu.y=34;pingu.vy=0;pingu.onG=true;pingu.jumps=0;}}
else{pingu.vy+=0.55;pingu.y+=pingu.vy;if(pingu.y>=GY){pingu.y=GY;pingu.vy=0;pingu.onG=true;pingu.jumps=0;}}
pingu.onG=false;if(duck>0)duck--;
if(frame%Math.max(26,52-dist/40|0)===0){const r=Math.random();
if(r<0.12)obs.push({x:W+20,y:GY-34,w:26,h:34,t:'gate'});
else if(r<0.3)obs.push({x:W+20,y:GY-22,w:30,h:22,t:'spike'});
else if(r<0.55)obs.push({x:W+20,y:GY-48,w:40,h:16,t:'arch'});
else if(r<0.8)fish.push({x:W+20,y:GY-60-Math.random()*30,got:false});
else if(r<0.9)obs.push({x:W+20,y:14,w:30,h:20,t:'cspike'});
else obs.push({x:W+20,y:GY-18,w:26,h:18,t:'seal'});}
obs.forEach(o=>o.x-=speed);fish.forEach(f=>f.x-=speed);
obs=obs.filter(o=>o.x>-60);fish=fish.filter(f=>f.x>-30&&!f.got);
const hh=duck>0?14:pingu.h;
fish.forEach(f=>{if(Math.abs(f.x-pingu.x)<24&&Math.abs(f.y-(pingu.y-hh/2))<32){f.got=true;
const sc=+document.getElementById('s').textContent+15;document.getElementById('s').textContent=sc;beep(800,.06);}});
obs.forEach(o=>{if(o.t==='gate'){if(pingu.x+pingu.w/2>o.x&&pingu.x-pingu.w/2<o.x+o.w){o.x=-999;flipT=240;beep(980,.15,'triangle');}return;}if(o.t==='cspike'){if(flipT>0&&pingu.x+pingu.w/2>o.x&&pingu.x-pingu.w/2<o.x+o.w&&pingu.y<o.y+o.h+4)hit();return;}if(flipT>0)return;if(pingu.x+pingu.w/2>o.x&&pingu.x-pingu.w/2<o.x+o.w&&pingu.y-hh<o.y+o.h&&pingu.y>o.y)hit();});}
function hit(){hp--;document.getElementById('h').textContent=hp;beep(140,.25,'sawtooth');
if(hp<=0)die();}
function die(){playing=false;const d=Math.floor(dist);
if(d>best){best=d;localStorage.setItem('ass_best',best);document.getElementById('b').textContent=best;}
document.getElementById('od').innerHTML='The ice claims the penguin at <b style="color:#0284c7">'+d+'m</b>!';
document.getElementById('btn').textContent='WADDLE AGAIN';document.getElementById('ov').style.display='flex';beep(110,.5,'sawtooth');}
function draw(){ctx.fillStyle='#f0f9ff';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#bae6fd';for(let i=0;i<7;i++)ctx.fillRect((i*173+40)%(W+80)-40,30+(i%3)*20,30,10);
// aurora
const ag=ctx.createLinearGradient(0,0,W,0);
ag.addColorStop(0,'rgba(74,222,128,0)');ag.addColorStop(0.5,'rgba(74,222,128,.2)');ag.addColorStop(1,'rgba(167,139,250,0)');
ctx.fillStyle=ag;ctx.fillRect(0,0,W,60);
ctx.fillStyle='#e0f2fe';ctx.fillRect(0,GY,W,H-GY);
obs.forEach(o=>{if(o.t==='spike'){ctx.fillStyle='#7dd3fc';
for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(o.x+i*10,GY);ctx.lineTo(o.x+i*10+5,GY-18);ctx.lineTo(o.x+i*10+10,GY);ctx.fill();}}
else if(o.t==='arch'){ctx.fillStyle='#bae6fd';ctx.fillRect(o.x,GY-48,10,48);ctx.fillRect(o.x+o.w-10,GY-48,10,48);ctx.fillRect(o.x,GY-48,o.w,10);}
else if(o.t==='gate'){ctx.font='22px serif';ctx.textAlign='center';ctx.fillText('🌀',o.x+o.w/2,GY-8);}
else if(o.t==='cspike'){ctx.fillStyle='#fda4af';for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(o.x+i*10,14);ctx.lineTo(o.x+i*10+5,32);ctx.lineTo(o.x+i*10+10,14);ctx.fill();}}
else{ctx.font='20px serif';ctx.textAlign='center';ctx.fillText('🦭',o.x+o.w/2,o.y+14);}});
fish.forEach(f=>{ctx.font='16px serif';ctx.fillText('🐟',f.x,f.y+5);});
const hh=duck>0?14:pingu.h;
ctx.fillStyle='#1e293b';ctx.fillRect(pingu.x-pingu.w/2,pingu.y-hh,pingu.w,hh);
ctx.fillStyle='#fff';ctx.fillRect(pingu.x-4,pingu.y-hh+4,8,6);
ctx.fillStyle='#fb923c';ctx.beginPath();ctx.moveTo(pingu.x+8,pingu.y-hh+8);ctx.lineTo(pingu.x+13,pingu.y-hh+10);ctx.lineTo(pingu.x+8,pingu.y-hh+12);ctx.fill();
ctx.fillStyle='#1e293b';
ctx.beginPath();ctx.moveTo(pingu.x-6,pingu.y-hh);ctx.lineTo(pingu.x-8,pingu.y-hh-6);ctx.lineTo(pingu.x-3,pingu.y-hh-3);ctx.fill();
ctx.beginPath();ctx.moveTo(pingu.x+6,pingu.y-hh);ctx.lineTo(pingu.x+8,pingu.y-hh-6);ctx.lineTo(pingu.x+3,pingu.y-hh-3);ctx.fill();}
function loop(){if(playing){step();draw();}requestAnimationFrame(loop);}
document.getElementById('btn').onclick=()=>{audio.resume();init();document.getElementById('ov').style.display='none';};
loop();


</script>
</body>
</html>
