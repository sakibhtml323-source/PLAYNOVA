<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crystal Shift Puzzle #306</title><style>
body{margin:0;font-family:system-ui;background:#0f172a;color:#e2e8f0;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#94a3b8;font-size:.78rem}
#wrap{max-width:94vw;flex-wrap:wrap;display:flex;gap:14px;margin:10px}
#g1,#g2{display:grid;grid-template-columns:repeat(4,50px);gap:3px}
.c{width:50px;height:50px;background:#1e293b;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px}
.c.ok{background:#14532d}
.ctl{display:flex;flex-direction:column;gap:2px;justify-content:center}
.ctl button{width:26px;height:26px;font-size:.7rem;padding:0;border-radius:4px;border:none;background:#334155;color:#fff;cursor:pointer}
#hud{display:flex;gap:14px;font-size:.9rem;margin:4px}
#hud b{color:#facc15}
#msg{min-height:1.3em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#7c3aed;color:#fff;font-weight:700;cursor:pointer;margin:8px}
</style></head><body>
<h1>💎 Crystal Shift Puzzle</h1><div class="sub">Shift entire rows left/right — recreate the target crystal pattern!</div>
<div id="hud"><span>Moves <b id="m">0</b></span><span>Level <b id="l">1</b></span></div>
<div id="wrap"><div id="g1"></div><div class="ctl" id="ctl"></div><div id="g2"></div></div>
<div style="font-size:.75rem;color:#94a3b8">TARGET ← your board (use ◀ ▶ to shift rows)</div>
<div id="msg"></div>
<button id="btn">✨ New Puzzle</button>
<audio id="au"></audio>
<script>
"use strict";
const AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const N=4,GEMS=['💜','❤️','💙','💚','💛','🧡'];
let target=[],board=[],moves=0,level=1;
function gen(){target=[];const nc=Math.min(4+level,6);
for(let r=0;r<N;r++){const row=[];for(let c=0;c<N;c++)row.push((Math.random()*nc)|0);target.push(row);}
board=target.map(r=>r.slice());
// scramble with random row shifts
const sh=2+level;
for(let i=0;i<sh;i++){const r=(Math.random()*N)|0,d=Math.random()<0.5?1:-1;
shift(r,d);}
if(board.every((r,ri)=>r.every((v,ci)=>v===target[ri][ci]))){shift(0,1);}
moves=0;document.getElementById('m').textContent=0;
document.getElementById('l').textContent=level;
buildCtl();render();msg('Shift rows to match!');}
function shift(r,d){const row=board[r];
if(d>0)row.unshift(row.pop());else row.push(row.shift());moves++;
document.getElementById('m').textContent=moves;render();check();}
function check(){if(board.every((r,ri)=>r.every((v,ci)=>v===target[ri][ci]))){beep(880,.3,'triangle');
msg('🎉 Matched in '+moves+'! Level '+(level+1));pnEmit('GAME_LEVEL_COMPLETED',{level:level});level++;
setTimeout(gen,1000);}}
function buildCtl(){const c=document.getElementById('ctl');c.innerHTML='';
for(let r=0;r<N;r++){const row=document.createElement('div');
row.style.display='flex';row.style.gap='2px';
const l=document.createElement('button');l.textContent='◀';
l.onclick=()=>{AU.__c=AU.__c||new (window.AudioContext||window.webkitAudioContext)();shift(r,-1);};
const rr=document.createElement('button');rr.textContent='▶';
rr.onclick=()=>{AU.__c=AU.__c||new (window.AudioContext||window.webkitAudioContext)();shift(r,1);};
row.appendChild(l);row.appendChild(rr);c.appendChild(row);}}
function render(){const g=document.getElementById('g1');g.innerHTML='';
board.forEach((row,r)=>row.forEach((v,c)=>{const d=document.createElement('div');
d.className='c'+(v===target[r][c]?' ok':'');d.textContent=GEMS[v];g.appendChild(d);}));
const g2=document.getElementById('g2');g2.innerHTML='';
target.forEach(row=>row.forEach(v=>{const d=document.createElement('div');d.className='c';
d.textContent=GEMS[v];g2.appendChild(d);}));}
function msg(t){document.getElementById('msg').textContent=t;}
document.getElementById('btn').onclick=()=>{AU.__c=new (window.AudioContext||window.webkitAudioContext)();gen();};
gen();
</script></body></html>
