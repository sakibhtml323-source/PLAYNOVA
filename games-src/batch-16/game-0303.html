<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crystal Reflex Grid #303</title><style>
body{margin:0;font-family:system-ui;background:#0f172a;color:#e2e8f0;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#94a3b8;font-size:.78rem}
#grid{display:grid;grid-template-columns:repeat(4,76px);gap:8px;margin:14px}
.hole{width:76px;height:76px;background:#1e293b;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:36px;cursor:pointer;user-select:none;transition:all .1s}
.hole.pop{background:#312e81;transform:scale(1.06)}
#hud{display:flex;gap:14px;font-size:.9rem;margin:4px}
#hud b{color:#facc15}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#7c3aed;color:#fff;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>⚡ Crystal Reflex Grid</h1><div class="sub">Crystals pop up and vanish fast — tap them before they fade! Speed grows each level.</div>
<div id="hud"><span>Score <b id="s">0</b></span><span>Level <b id="l">1</b></span><span>⏱️ <b id="t">45</b>s</span><span>Best <b id="b">0</b></span></div>
<div id="grid"></div>
<div id="ov"><div style="font-size:3rem">💎</div><p>Tap popping crystals!<br>They shrink faster as you level up.</p><button id="btn">Start</button></div>
<audio id="au"></audio>
<script>
"use strict";
const AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const N=16;let holes=[],score=0,level=1,playing=false,timer=null,spawnT=0,time=45,best=+localStorage.getItem('crg_best')||0;
document.getElementById('b').textContent=best;
function build(){const f=document.getElementById('grid');f.innerHTML='';
holes=[];for(let i=0;i<N;i++){const d=document.createElement('div');d.className='hole';
d.onclick=()=>whack(i);f.appendChild(d);holes.push({el:d,cur:null,ttl:0});}}
function pop(i){const e=Math.random()<0.75?'💎':'⭐';
holes[i].cur={e,pts:e==='⭐'?30:10};
const ttl=Math.max(500,1400-level*120);
holes[i].ttl=ttl;
holes[i].el.textContent=e;holes[i].el.classList.add('pop');
setTimeout(()=>{if(holes[i].cur){holes[i].cur=null;holes[i].el.textContent='';
holes[i].el.classList.remove('pop');}},ttl);}
function whack(i){if(!playing||!holes[i].cur)return;
score+=holes[i].cur.pts;
document.getElementById('s').textContent=score;
if(Math.floor(score/150)+1>level){level=Math.floor(score/150)+1;
document.getElementById('l').textContent=level;beep(880,.15,'triangle');}
if(score>best){best=score;localStorage.setItem('crg_best',best);document.getElementById('b').textContent=best;}
beep(500+level*40,.07,'triangle');
holes[i].cur=null;holes[i].el.textContent='';holes[i].el.classList.remove('pop');}
function tick(){if(!playing)return;
spawnT++;const rate=Math.max(12,30-level*2);
if(spawnT>rate){spawnT=0;
const empty=holes.map((h,i)=>i).filter(i=>!holes[i].cur);
if(empty.length)pop(empty[(Math.random()*empty.length)|0]);}
requestAnimationFrame(tick);}
document.getElementById('btn').onclick=()=>{build();score=0;level=1;time=45;spawnT=0;
document.getElementById('s').textContent=0;document.getElementById('l').textContent=1;
document.getElementById('t').textContent=45;
document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();tick();
clearInterval(timer);timer=setInterval(()=>{time--;document.getElementById('t').textContent=time;
if(time<=0){playing=false;clearInterval(timer);
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='⏰ Time!<br>Score: <b style="color:#facc15">'+score+'</b> · Level '+level;}},1000);};
build();
</script></body></html>
