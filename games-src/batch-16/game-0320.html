<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Rhythm Tap #320</title><style>
body{margin:0;font-family:system-ui;background:#1c1917;color:#fafaf9;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a8a29e;font-size:.78rem}
canvas{background:#292524;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#1c1917;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🥁 Desert Rhythm Tap</h1><div class="sub">Tap the circles when they shrink into the ring — on-beat taps build combos!</div>
<div id="hud"><span>Score <b id="s">0</b></span><span>Combo <b id="c">×0</b></span><span>⏱️ <b id="t">30</b>s</span></div>
<canvas id="cv" width="440" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">🎵</div><p>Circles shrink to the beat.<br>Tap when they hit the center ring!</p><button id="btn">Tap Along</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=400,BPM=120,BEAT=60/BPM;
let score=0,combo=0,playing=false,beatT=0,lastBeat=-1,circles=[],timer=null,time=30;
function spawn(){circles.push({x:60+Math.random()*320,y:60+Math.random()*280,r:40,life:BEAT*2});}
cvs.addEventListener('pointerdown',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
let bi=-1,bd=1e9;
circles.forEach((c,i)=>{const d=Math.hypot(c.x-x,c.y-y);if(d<bd){bd=d;bi=i;}});
if(bi>=0&&circles[bi].r<20){score+=10+combo*2;combo++;
circles.splice(bi,1);beep(600+combo*30,.08);document.getElementById('c').textContent='×'+combo;}
else{combo=0;beep(180,.1,'sawtooth');document.getElementById('c').textContent='×0';}
document.getElementById('s').textContent=score;});
function step(){beatT+=1/60;
if(beatT-lastBeat>=BEAT){lastBeat=beatT;spawn();beep(440,.05);}
circles.forEach(c=>{c.r-=0.4;c.life-=1/60;});
circles=circles.filter(c=>c.life>0);}
function draw(){ctx.fillStyle='#292524';ctx.fillRect(0,0,W,H);
circles.forEach(c=>{ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,7);
ctx.strokeStyle=c.r<20?'#22c55e':'#fbbf24';ctx.lineWidth=3;ctx.stroke();
ctx.beginPath();ctx.arc(c.x,c.y,16,0,7);
ctx.strokeStyle='#fbbf2455';ctx.lineWidth=1;ctx.stroke();});
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{score=0;combo=0;beatT=0;lastBeat=-1;circles=[];time=30;
document.getElementById('s').textContent=0;document.getElementById('c').textContent='×0';
document.getElementById('t').textContent=30;
document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();
clearInterval(timer);timer=setInterval(()=>{time--;document.getElementById('t').textContent=time;
if(time<=0){playing=false;clearInterval(timer);
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='⏰ Time!<br>Score: <b style="color:#fbbf24">'+score+'</b>';}},1000);};
</script></body></html>
