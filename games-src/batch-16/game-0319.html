<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crystal Number Drop #319</title><style>
body{margin:0;font-family:system-ui;background:#0f172a;color:#e2e8f0;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#94a3b8;font-size:.78rem}
#grid{display:grid;grid-template-columns:repeat(5,60px);gap:4px;margin:12px}
.c{width:60px;height:60px;background:#1e293b;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:800;cursor:pointer}
#hud{display:flex;gap:14px;font-size:.9rem;margin:4px}#hud b{color:#facc15}
#msg{min-height:1.3em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#7c3aed;color:#fff;font-weight:700;cursor:pointer;margin:8px}
</style></head><body>
<h1>🔢 Crystal Number Drop</h1><div class="sub">Tap a column to drop a number — matching neighbors merge upward!</div>
<div id="hud"><span>Score <b id="s">0</b></span><span>Best <b id="b">0</b></span></div>
<div id="grid"></div><div id="msg"></div>
<button id="btn">✨ New Drop</button>
<audio id="au"></audio>
<script>
"use strict";
const AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const R=6,C=5,COLS=['#7c3aed','#2563eb','#22c55e','#eab308','#ef4444','#f97316','#ec4899','#22d3ee'];
let grid=[],score=0,best=+localStorage.getItem('cnd_best')||0;
document.getElementById('b').textContent=best;
function gen(){grid=Array.from({length:R},()=>Array(C).fill(null));score=0;
document.getElementById('s').textContent=0;render();msg('Tap a column to drop!');}
function tap(c){let r=R-1;while(r>=0&&grid[r][c]!==null)r--;
if(r<0){beep(160,.06);return;}
grid[r][c]=Math.random()<0.8?1:2;beep(400,.06);
let changed=true;while(changed){changed=false;
for(let rr=R-1;rr>=0;rr--)for(let cc=0;cc<C;cc++){
const v=grid[rr][cc];if(v===null)continue;
[[rr-1,cc],[rr,cc-1],[rr,cc+1]].forEach(([nr,nc])=>{
if(nr>=0&&nr<R&&nc>=0&&nc<C&&grid[nr][nc]===v){
grid[rr][cc]=v+1;grid[nr][nc]=null;score+=10*(v+1);
document.getElementById('s').textContent=score;
if(score>best){best=score;localStorage.setItem('cnd_best',best);document.getElementById('b').textContent=best;}
beep(440+v*60,.08);changed=true;}});}}
render();checkEnd();}
function checkEnd(){if(grid[0].every(v=>v!==null)){beep(130,.3,'sawtooth');msg('💀 Full! Final: '+score);}}
function render(){const g=document.getElementById('grid');g.innerHTML='';
for(let r=0;r<R;r++)for(let c=0;c<C;c++){const d=document.createElement('div');d.className='c';
if(grid[r][c]!==null){d.textContent=grid[r][c];d.style.color=COLS[(grid[r][c]-1)%8];}
d.onclick=()=>{AU.__c=AU.__c||new (window.AudioContext||window.webkitAudioContext)();tap(c);};
g.appendChild(d);}}
function msg(t){document.getElementById('msg').textContent=t;}
document.getElementById('btn').onclick=()=>{AU.__c=new (window.AudioContext||window.webkitAudioContext)();gen();};
gen();
</script></body></html>
