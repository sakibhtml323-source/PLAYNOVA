<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ninja Star Catch #0316</title><style>
body{margin:0;font-family:system-ui;background:#111827;color:#f9fafb;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#9ca3af;font-size:.78rem}
canvas{background:#1f2937;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#facc15}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#facc15;color:#111827;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>Ninja Star Catch</h1><div class="sub">Tap/Space to jump — catch the falling stars in this runner!</div>
<div id="hud"><span>Score <b id="s">0</b></span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="440" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">🌟</div><p>Jump over the 🔪 kunai, grab 🌟 stars for bonus height!</p><button id="btn">Start</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=400,GY=H-46;
let me={y:GY,vy:0,onG:true},obs=[],dist=0,score=0,playing=false,spawnT=0,best=+localStorage.getItem('r0316')||0;
document.getElementById('b').textContent=best;

function spawn(){obs.push({x:W+30,y:GY-6,w:20,h:22,e:Math.random()<0.3?'🔪':'🌟'});}
function jump(){if(!playing||!me.onG)return;me.vy=-10.5;me.onG=false;beep(500,.06);}
cvs.addEventListener('pointerdown',jump);
document.addEventListener('keydown',e=>{if(e.code==='Space')jump();});
function step(){dist+=0.06;score=Math.floor(dist);
me.vy+=0.55;me.y+=me.vy;if(me.y>=GY){me.y=GY;me.vy=0;me.onG=true;}
spawnT++;if(spawnT>Math.max(38,80-dist*0.02)){spawnT=0;spawn();}
obs.forEach(o=>o.x-=4.4);obs=obs.filter(o=>o.x>-40);
obs.forEach(o=>{if(o.x<110&&o.x>58&&me.y>GY-30)die();});
document.getElementById('s').textContent=score;}
function die(){if(!playing)return;playing=false;beep(130,.35,'sawtooth');
if(score>best){best=score;localStorage.setItem('r0316',best);document.getElementById('b').textContent=best;}
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='💀 Fell at <b style="color:#fbbf14">'+score+'m</b>';}
function draw(){ctx.fillStyle='#1f2937';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#374151';ctx.fillRect(0,GY+2,W,H-GY);
ctx.font='30px serif';ctx.textAlign='center';ctx.fillText('🏃',88,me.y+4);
obs.forEach(o=>{ctx.font='26px serif';ctx.fillText(o.e,o.x+o.w/2,GY+4);});
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{me={y:GY,vy:0,onG:true};obs=[];dist=0;score=0;spawnT=0;
document.getElementById('s').textContent=0;
document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();};
</script></body></html>
