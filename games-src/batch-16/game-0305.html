let lastP=0;

function genLevel(l){grid=[];const rows=Math.min(9,4+Math.floor(l/2)),cols=Math.min(6,3+Math.floor((l-1)/2));nCol=cols;

for(let r=0;r<16;r++)for(let c=0;c<COLS;c++){const b=grid[r][c];if(!b)continue;let sc=1;const p=pops.find(q=>q.r===r&&q.c===c&&q.b===b);if(b.popping&&p&&p.t<.04)sc=1.15;bubble(cellX(r,c),cellY(r),b,sc)}
fall.forEach(f=>{ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.rot);bubble(0,0,f.b,1);ctx.restore()});
/* aim line */
if(state==='aim'&&cur){let x=LX,y=LY,vx=Math.cos(ang),vy=Math.sin(ang);ctx.fillStyle='rgba(255,255,255,.55)';let len=0,bounced=0;while(len<620){x+=vx*7;y+=vy*7;len+=7;if(x<R){x=R;vx=-vx;bounced++}if(x>W-R){x=W-R;vx=-vx;bounced++}if(y<TOP+topOff+R)break;let hit=false;for(let r=0;r<16&&!hit;r++)for(let c=0;c<COLS;c++)if(grid[r][c]&&Math.hypot(cellX(r,c)-x,cellY(r)-y)<D*.88){hit=true;break}if(hit)break;if(((len/7)|0)%2===0){ctx.beginPath();ctx.arc(x,y,2.2,0,6.283);ctx.fill()}}}

if(flash>0){ctx.fillStyle='rgba(255,255,255,'+flash*.5+')';ctx.fillRect(0,0,W,H)}

/* ---------- input ---------- */
function toAng(e){const b=cvs.getBoundingClientRect(),x=(e.clientX-b.left)*(W/b.width),y=(e.clientY-b.top)*(H/b.height);return{a:Math.atan2(y-LY,x-LX),x,y}}
