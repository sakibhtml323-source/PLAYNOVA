<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crystal Dice Duel #311</title><style>
body{margin:0;font-family:system-ui;background:#0f172a;color:#e2e8f0;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#94a3b8;font-size:.78rem}
#dice{display:flex;gap:10px;margin:12px;flex-wrap:wrap;justify-content:center}
.die{width:56px;height:56px;background:#312e81;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:800;cursor:pointer}
.die.held{background:#14532d;border:2px solid #22c55e}
#hud{display:flex;gap:14px;font-size:.9rem;margin:4px}
#hud b{color:#facc15}
#msg{min-height:1.4em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#7c3aed;color:#fff;font-weight:700;cursor:pointer;margin:6px}
</style></head><body>
<h1>🎲 Crystal Dice Duel</h1><div class="sub">Roll 3 times, hold your best dice — highest total wins the round!</div>
<div id="hud"><span>You <b id="s1">0</b></span><span>AI <b id="s2">0</b></span><span>Round <b id="r">1</b>/5</span><span>Rolls <b id="rl">3</b></span></div>
<div id="dice"></div>
<div id="msg"></div>
<div>
<button id="roll">🎲 Roll</button>
<button id="hold">✋ Hold All & Score</button>
</div>
<audio id="au"></audio>
<script>

"use strict";
const AU=document.getElementById('au');
const msg=t=>{document.getElementById('msg').textContent=t;};
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
let dice=[1,1,1,1,1],held=[false,false,false,false,false],rolls=3,s1=0,s2=0,round=1,playing=true;
function render(){const d=document.getElementById('dice');d.innerHTML='';
dice.forEach((v,i)=>{const el=document.createElement('div');el.className='die'+(held[i]?' held':'');
el.textContent='⚄'.replace('⚄',['⚀','⚁','⚂','⚃','⚄','⚅'][v-1]);
el.onclick=()=>{held[i]=!held[i];beep(300+i*60,.05);render();};
d.appendChild(el);});
document.getElementById('rl').textContent=rolls;
document.getElementById('r').textContent=round;}
document.getElementById('roll').onclick=()=>{if(!playing||rolls<=0)return;
dice=dice.map((v,i)=>held[i]?v:1+((Math.random()*6)|0));
rolls--;beep(400,.1);render();};
document.getElementById('hold').onclick=()=>{if(!playing)return;
const myTotal=dice.reduce((a,b)=>a+b,0);
const aiTotal=Array.from({length:5},()=>1+((Math.random()*6)|0)).reduce((a,b)=>a+b,0);
if(myTotal>aiTotal){s1++;beep(700,.15,'triangle');msg('🎉 '+myTotal+' vs '+aiTotal+' — you win the round!');}
else if(aiTotal>myTotal){s2++;beep(300,.15,'sawtooth');msg('💀 '+myTotal+' vs '+aiTotal+' — AI wins…');}
else{beep(500,.1);msg('🤝 Tie at '+myTotal+'!');}
document.getElementById('s1').textContent=s1;document.getElementById('s2').textContent=s2;
round++;
if(round>5){playing=false;
const w=s1>s2?'👑 You win the duel!':s2>s1?'🤖 AI wins…':'🤝 Draw!';
msg(w+'  '+s1+'–'+s2);return;}
dice=[1,1,1,1,1];held=[false,false,false,false,false];rolls=3;
setTimeout(render,800);};
render();

</script></body></html>
