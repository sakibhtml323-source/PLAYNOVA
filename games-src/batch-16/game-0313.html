<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haunted Spot Pop #313</title><style>
body{margin:0;font-family:system-ui;background:#18181b;color:#fafafa;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a1a1aa;font-size:.78rem}
canvas{background:#27272a;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}
#hud b{color:#facc15}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#7c3aed;color:#fff;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>👻 Haunted Spot Pop</h1><div class="sub">Spots appear briefly — pop them in the order they appeared!</div>
<div id="hud"><span>Round <b id="r">1</b></span><span>Streak <b id="c">0</b></span><span>⏱️ <b id="t">30</b>s</span></div>
<canvas id="cv" width="400" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">👁️</div><p>Watch the spots light up, then pop them in order.<br>Wrong order = streak lost!</p><button id="btn">Start</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=400;
let spots=[],seq=[],phase='show',idx=0,round=1,streak=0,playing=false,time=30,timer=null;
function newRound(){const n=Math.min(3+round,7);
spots=[];seq=[];
for(let i=0;i<n;i++){spots.push({x:40+Math.random()*(W-80),y:40+Math.random()*(W-80),on:false,done:false});
seq.push(i);}
document.getElementById('r').textContent=round;
phase='show';idx=0;draw();
// show sequence
seq.forEach((si,k)=>{setTimeout(()=>{spots[si].on=true;beep(400+k*60,.1);draw();
setTimeout(()=>{spots[si].on=false;draw();},350);},600+k*700);});
setTimeout(()=>{phase='play';msg('Pop them in order!');},600+n*700+100);}
function msg(t){const el=document.createElement('div');el.style.cssText='position:fixed;bottom:60px;left:50%;transform:translateX(-50%);color:#facc15;font-weight:700';
el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),1500);}
cvs.addEventListener('pointerdown',e=>{if(!playing||phase!=='play')return;const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*W/r.height;
const hit=spots.findIndex(s=>Math.hypot(s.x-x,s.y-y)<28);
if(hit<0||spots[hit].done)return;
if(hit===seq[idx]){spots[hit].done=true;idx++;beep(500+idx*60,.08);draw();
if(idx>=seq.length){streak++;document.getElementById('c').textContent=streak;
beep(880,.2,'triangle');msg('✅ Round '+round+' clear!');round++;
setTimeout(newRound,900);}}
else{streak=0;document.getElementById('c').textContent=0;
beep(150,.2,'sawtooth');msg('❌ Wrong order!');phase='show';
setTimeout(newRound,900);}});
function draw(){ctx.fillStyle='#27272a';ctx.fillRect(0,0,W,W);
spots.forEach(s=>{
ctx.beginPath();ctx.arc(s.x,s.y,22,0,7);
if(s.done){ctx.fillStyle='#14532d';}
else if(s.on){ctx.fillStyle='#7c3aed';}
else{ctx.fillStyle='#3f3f46';}
ctx.fill();
if(s.done)ctx.strokeStyle='#22c55e';else if(s.on)ctx.strokeStyle='#a78bfa';else ctx.strokeStyle='#52525b';
ctx.lineWidth=2;ctx.stroke();});}
document.getElementById('btn').onclick=()=>{round=1;streak=0;time=30;
document.getElementById('r').textContent=1;document.getElementById('c').textContent=0;
document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();newRound();
clearInterval(timer);timer=setInterval(()=>{time--;document.getElementById('t').textContent=time;
if(time<=0){playing=false;clearInterval(timer);
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='⏰ Time!<br>Reached round '+round;}},1000);};
</script></body></html>
