<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ninja Orchard Harvest #312</title><style>
body{margin:0;font-family:system-ui;background:#14532d;color:#f0fdf4;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#bbf7d0;font-size:.78rem}
canvas{background:#166534;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}
#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#14532d;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🍎 Ninja Orchard Harvest</h1><div class="sub">Move the basket to catch fruit — avoid the 💣 bombs!</div>
<div id="hud"><span>Score <b id="s">0</b></span><span>⏱️ <b id="t">45</b>s</span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="440" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">🧺</div><p>Drag or use ◀ ▶ to move.<br>Fruit = points, bombs = −3!</p><button id="btn">Harvest</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=400;
const FRUITS=['🍎','🍊','🍐','🍇','🍓'];
let basket={x:W/2},items=[],score=0,playing=false,spawnT=0,time=45,timer=null,best=+localStorage.getItem('oh_best')||0;
document.getElementById('b').textContent=best;
function spawn(){const bomb=Math.random()<0.2;
items.push({x:20+Math.random()*(W-40),y:-20,vy:2+Math.random()*2+score*0.002,e:bomb?'💣':FRUITS[(Math.random()*FRUITS.length)|0],bomb});}
cvs.addEventListener('pointermove',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
basket.x=(e.clientX-r.left)*W/r.width;});
document.addEventListener('keydown',e=>{if(!playing)return;
if(e.key==='ArrowLeft')basket.x=Math.max(30,basket.x-24);
if(e.key==='ArrowRight')basket.x=Math.min(W-30,basket.x+24);});
function step(){spawnT++;if(spawnT>Math.max(20,40-score*0.15)){spawnT=0;spawn();}
items.forEach(it=>{it.y+=it.vy;});
items=items.filter(it=>{if(it.y>H-30&&Math.abs(it.x-basket.x)<34){
if(it.bomb){score=Math.max(0,score-3);beep(150,.2,'sawtooth');}
else{score+=5;beep(500+score*3,.06,'triangle');}
document.getElementById('s').textContent=score;return false;}
return it.y<H+20;});}
function draw(){ctx.fillStyle='#166534';ctx.fillRect(0,0,W,H);
// tree tops
ctx.font='40px serif';
for(let x=40;x<W;x+=110)ctx.fillText('🌳',x,50);
ctx.font='34px serif';ctx.textAlign='center';
ctx.fillText('🧺',basket.x,H-18);
items.forEach(it=>{ctx.font='26px serif';ctx.fillText(it.e,it.x,it.y);});
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{items=[];score=0;spawnT=0;time=45;
document.getElementById('s').textContent=0;document.getElementById('t').textContent=45;
document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();
clearInterval(timer);timer=setInterval(()=>{time--;document.getElementById('t').textContent=time;
if(time<=0){playing=false;clearInterval(timer);
if(score>best){best=score;localStorage.setItem('oh_best',best);document.getElementById('b').textContent=best;}
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🏁 Harvest over!<br>Score: <b style="color:#fbbf24">'+score+'</b>';}},1000);};
</script></body></html>
