<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Top-Down Shooter: Magic Edition</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#1e1b4b;font-family:Georgia,serif;color:#e0e7ff;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow:hidden}
h1{font-size:1.05rem;color:#a78bfa;padding:6px;letter-spacing:1px}
#hud{display:flex;gap:14px;font-size:.9rem;margin-bottom:4px}
canvas{background:#0f0f23;border-radius:10px;border:2px solid #4c1d95;touch-action:none}
#ov{position:fixed;inset:0;background:rgba(30,27,75,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#e0e7ff;padding:20px;z-index:5}
button{background:#a78bfa;border:none;color:#1e1b4b;font-weight:800;padding:12px 32px;border-radius:24px;font-size:1rem;cursor:pointer;margin-top:14px;font-family:inherit}
</style>
</head>
<body>
<h1>🔮 TOP-DOWN SHOOTER: MAGIC</h1>
<div id="hud"><span>Score <b id="s">0</b></span><span>❤️ <b id="h">100</b></span><span>Wave <b id="w">1</b></span><span>Best <b id="b">0</b></span></div>
<canvas id="c"></canvas>
<div id="ov"><h2 style="color:#a78bfa">MAGIC SHOOTER</h2><p id="od">WASD/arrows or drag to move — your wand auto-fires at the nearest monster. Survive the dungeon waves, grab ✨ for score and ❤️ for health. Space/tap casts a nova burst (costs 20 HP… no, 20 mana — just don't spam)!</p><button id="btn">ENTER THE DUNGEON</button></div>
<script>
"use strict";
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');const W=460,H=440;cvs.width=W;cvs.height=H;
let me,foes,shots,pickups,playing,keys,score,hp,wave,frame,nova,best=+localStorage.getItem('ms_best')||0;
document.getElementById('b').textContent=best;
const SPELLS=['#a78bfa','#f472b6','#67e8f9','#fbbf24'];
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.06,t='square'){if(!playing)return;const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=.09;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
function resize(){const s=Math.min((window.innerWidth-12)/W,(window.innerHeight-140)/H);cvs.style.width=W*s+'px';cvs.style.height=H*s+'px';}
window.addEventListener('resize',resize);resize();
function init(){me={x:W/2,y:H/2,cd:0};foes=[];shots=[];pickups=[];score=0;hp=100;wave=1;keys={};frame=0;nova=0;playing=true;
document.getElementById('s').textContent=0;document.getElementById('h').textContent=100;document.getElementById('w').textContent=1;}
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '){e.preventDefault();castNova();}});
window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let drag=null;
cvs.addEventListener('pointerdown',e=>{audio.resume();const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
if(Math.hypot(x-me.x,y-me.y)<50)castNova();else drag={x,y};});
cvs.addEventListener('pointermove',e=>{if(!drag)return;const r=cvs.getBoundingClientRect();
drag={x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};});
window.addEventListener('pointerup',()=>drag=null);
function castNova(){if(nova>0)return;nova=30;beep(900,.2,'sawtooth');
foes.forEach(f=>{if(Math.hypot(f.x-me.x,f.y-me.y)<110)f.hp-=3;});}
function spawnWave(){const n=3+wave*2;for(let i=0;i<n;i++){const a=Math.random()*7;
foes.push({x:W/2+Math.cos(a)*280,y:H/2+Math.sin(a)*280,hp:1+((wave/3)|0),sp:0.8+wave*0.1,e:['👺','🧌','🦇','💀'][(Math.random()*4)|0]});}}
function step(){frame++;const sp=3.3;
if(keys['w']||keys['arrowup'])me.y-=sp;if(keys['s']||keys['arrowdown'])me.y+=sp;
if(keys['a']||keys['arrowleft'])me.x-=sp;if(keys['d']||keys['arrowright'])me.x+=sp;
if(drag){const dx=drag.x-me.x,dy=drag.y-me.y,d=Math.hypot(dx,dy);if(d>6){me.x+=dx/d*sp;me.y+=dy/d*sp;}}
me.x=Math.max(16,Math.min(W-16,me.x));me.y=Math.max(16,Math.min(H-16,me.y));
me.cd--;nova=Math.max(0,nova-1);
if(me.cd<=0){let nf=null,nd=1e9;foes.forEach(f=>{const d=Math.hypot(f.x-me.x,f.y-me.y);if(d<nd){nd=d;nf=f;}});
if(nf&&nd<230){me.cd=16;const a=Math.atan2(nf.y-me.y,nf.x-me.x);
shots.push({x:me.x,y:me.y,vx:Math.cos(a)*5.4,vy:Math.sin(a)*5.4,c:SPELLS[frame%4]});beep(600,.04);}}
shots.forEach(s=>{s.x+=s.vx;s.y+=s.vy;foes.forEach(f=>{if(Math.hypot(f.x-s.x,f.y-s.y)<f.r+4){f.hp--;shots.splice(shots.indexOf(s),1);beep(300,.07,'triangle');
if(f.hp<=0){foes.splice(foes.indexOf(f),1);score+=20;document.getElementById('s').textContent=score;
if(Math.random()<0.22)pickups.push({x:f.x,y:f.y,t:Math.random()<0.3?'❤':'✨'});}}});});
shots=shots.filter(s=>s.x>-10&&s.x<W+10&&s.y>-10&&s.y<H+10);
foes.forEach(f=>{const a=Math.atan2(me.y-f.y,me.x-f.x);f.x+=Math.cos(a)*f.sp;f.y+=Math.sin(a)*f.sp;
if(Math.hypot(f.x-me.x,f.y-me.y)<f.r+12){hp-=0.8;document.getElementById('h').textContent=Math.max(0,Math.round(hp));if(hp<=0)die();}});
pickups.forEach(p=>{if(Math.hypot(p.x-me.x,p.y-me.y)<22){if(p.t==='❤')hp=Math.min(100,hp+25);else score+=30;
document.getElementById('s').textContent=score;document.getElementById('h').textContent=Math.round(hp);
pickups.splice(pickups.indexOf(p),1);beep(880,.07);}});
if(!foes.length){wave++;document.getElementById('w').textContent=wave;hp=Math.min(100,hp+10);spawnWave();beep(440,.13,'triangle');}}
function die(){playing=false;if(score>best){best=score;localStorage.setItem('ms_best',best);document.getElementById('b').textContent=best;}
document.getElementById('od').innerHTML='Your magic fades on wave <b>'+wave+'</b>.<br>Score: <b style="color:#fde047">'+score+'</b>';
document.getElementById('btn').textContent='REWIELD';document.getElementById('ov').style.display='flex';beep(110,.5,'sawtooth');}
function draw(){ctx.fillStyle='#0f0f23';ctx.fillRect(0,0,W,H);
ctx.strokeStyle='#1e1b4b';for(let x=0;x<W;x+=40)ctx.strokeRect(x,0,40,40);
if(nova>20){ctx.strokeStyle='#a78bfa88';ctx.lineWidth=3;ctx.beginPath();ctx.arc(me.x,me.y,110*(30-nova)/10+40,0,7);ctx.stroke();ctx.lineWidth=1;}
pickups.forEach(p=>{ctx.font='15px serif';ctx.textAlign='center';ctx.fillText(p.t,p.x,p.y+5);});
foes.forEach(f=>{ctx.font=(f.r*2)+'px serif';ctx.fillText(f.e,f.x,f.y+f.r/2);});
shots.forEach(s=>{ctx.fillStyle=s.c;ctx.beginPath();ctx.arc(s.x,s.y,4.5,0,7);ctx.fill();});
ctx.fillStyle='#c4b5fd';ctx.beginPath();ctx.arc(me.x,me.y,13,0,7);ctx.fill();
ctx.fillStyle='#111';ctx.fillRect(me.x-5,me.y-4,3,4);ctx.fillRect(me.x+2,me.y-4,3,4);
ctx.strokeStyle='#a78bfa';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(me.x+8,me.y+4);ctx.lineTo(me.x+20,me.y+14);ctx.stroke();ctx.lineWidth=1;}
function loop(){if(playing){step();draw();}requestAnimationFrame(loop);}
document.getElementById('btn').onclick=()=>{audio.resume();init();spawnWave();document.getElementById('ov').style.display='none';};
loop();
</script>
</body>
</html>
