<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Leak Pressure Pipes #83</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(#fef3c7,#fde68a);font-family:Georgia,serif;color:#78350f;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px;overflow-x:hidden}
h1{font-size:1.1rem;color:#b45309;padding:6px}
#hud{display:flex;gap:14px;font-size:.9rem;margin-bottom:10px}
#board{display:grid;gap:5px;background:#92400e33;border:3px solid #d97706;border-radius:14px;padding:12px;touch-action:none}
.tile{width:60px;height:60px;border-radius:8px;background:#fef3c7;border:2px solid #d97706;cursor:pointer;position:relative;overflow:hidden}
.tile svg{position:absolute;inset:0;width:100%;height:100%}
.tile.src{background:#fde047;border-color:#f59e0b}
#ov{position:fixed;inset:0;background:rgba(254,243,199,.98);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#78350f;padding:20px;z-index:5}
button{background:#d97706;color:#fff;border:none;font-family:inherit;font-weight:700;padding:12px 34px;border-radius:24px;font-size:1rem;cursor:pointer;margin-top:14px}
@media(max-width:420px){.tile{width:48px;height:48px}}
</style>
</head>
<body>
<h1>🏺 GOLDEN TILE ROTATION</h1>
<div id="hud"><span>Chamber <b id="l">1</b></span><span>Rotations <b id="m">0</b></span><span>Pressure <b id="pr">100</b>🔋</span><span>Best <b id="b">—</b></span></div>
<div id="board"></div>
<div id="ov"><h2 style="color:#b45309">GOLDEN PIPES</h2><p id="od">The Nile channels are scrambled! Rotate the golden pipes (tap, or arrows + Enter) to carry water from the sun disc ☀ to every corner of the chamber.</p><button id="btn">ENTER THE TOMB</button></div>
<script>
"use strict";
let size,cells,level,moves,playing,focus,best=Infinity,pressure,leakTimer;
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.06,t='sine'){const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=.08;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
function build(){size=Math.min(4+((level-1)/2|0),7);cells=[];const total=size*size;
const src=(Math.random()*total)|0;
const path=[src];const used=new Set([src]);
while(path.length<Math.min(total,6+level*2)){const last=path[path.length-1];const r=(last/size)|0,c=last%size;const opts=[];
if(r>0&&!used.has(last-size))opts.push(last-size);if(r<size-1&&!used.has(last+size))opts.push(last+size);
if(c>0&&!used.has(last-1))opts.push(last-1);if(c<size-1&&!used.has(last+1))opts.push(last+1);
if(!opts.length)break;const n=opts[(Math.random()*opts.length)|0];used.add(n);path.push(n);}
for(let i=0;i<total;i++){const inP=used.has(i);let type='none';
if(inP){const pi=path.indexOf(i);
if(pi===0)type=dirType(i,path[1]);else if(pi===path.length-1)type=dirType(i,path[pi-1]);
else type=twoDir(i,path[pi-1],path[pi+1]);}
cells.push({type,r:Math.random()<0.85?((Math.random()*4)|0):0,src:i===src,lit:false});}
path.forEach((idx,pi)=>{const c=cells[idx];
if(c.type==='straight'){const n1=pi>0?path[pi-1]:path[pi+1];c.r=vert(idx,n1)?0:1;}
else if(c.type==='elbow'){c.r=elbRot(idx,pi>0?path[pi-1]:null,pi<path.length-1?path[pi+1]:null);}
c.r=(c.r+1+((Math.random()*5)|0))%6%4;});
focus=path[0];moves=0;document.getElementById('m').textContent=0;document.getElementById('l').textContent=level;
best=+localStorage.getItem('gt_best_'+size)||Infinity;document.getElementById('b').textContent=isFinite(best)?best:'—';
light();render();}
function vert(a,b){return Math.abs(a-b)>=size;}
function dirOf(a,b){if(b===a-size)return 0;if(b===a+1)return 1;if(b===a+size)return 2;return 3;}
function dirType(a,b){return dirOf(a,b)%2===0?'straight':'elbow';}
function twoDir(a,p,n){return (dirOf(a,p)+2)%4===dirOf(a,n)?'straight':'elbow';}
function elbRot(a,p,n){const d1=p===null?dirOf(a,n):dirOf(a,p);const d2=n===null?dirOf(a,p):dirOf(a,n);
const pair=[Math.min(d1,d2),Math.max(d1,d2)];return({'0,1':0,'1,2':1,'2,3':2,'0,3':3})[pair.join(',')]||0;}
function opens(c){const s=new Set();
if(c.type==='straight'){if(c.r%2===0){s.add(0);s.add(2);}else{s.add(1);s.add(3);}}
else if(c.type==='elbow'){[[0,1],[1,2],[2,3],[0,3]][c.r].forEach(d=>s.add(d));}
return s;}
function light(){const src=cells.findIndex(c=>c.src);cells.forEach(c=>c.lit=false);cells[src].lit=true;
const q=[src];while(q.length){const cur=q.pop();const c=cells[cur];
opens(c).forEach(d=>{let n=-1;const r=(cur/size)|0,cc=cur%size;
if(d===0&&r>0)n=cur-size;if(d===1&&cc<size-1)n=cur+1;if(d===2&&r<size-1)n=cur+size;if(d===3&&cc>0)n=cur-1;
if(n>=0&&opens(cells[n]).has((d+2)%4)&&!cells[n].lit){cells[n].lit=true;q.push(n);}});}}
function render(){const b=document.getElementById('board');b.style.gridTemplateColumns='repeat('+size+',60px)';b.innerHTML='';
cells.forEach((c,i)=>{const t=document.createElement('div');
t.className='tile'+(c.src?' src':'');
const deg=c.r*90;let svg='';
if(c.type==='straight')svg='<line x1="50%" y1="0" x2="50%" y2="100%" stroke="'+(c.lit?'#f59e0b':'#b45309')+'" stroke-width="10" stroke-linecap="round"/>';
else if(c.type==='elbow')svg='<path d="M 30 0 Q 30 30 60 30" fill="none" stroke="'+(c.lit?'#f59e0b':'#b45309')+'" stroke-width="10" stroke-linecap="round"/>';
else if(c.src)svg='<circle cx="50%" cy="50%" r="15" fill="#fbbf24"/>';
t.innerHTML='<svg viewBox="0 0 60 60" style="transform:rotate('+deg+'deg)">'+svg+'</svg>';
if(focus===i)t.style.boxShadow='0 0 0 3px #92400e';
t.onclick=()=>{audio.resume();rot(i);};b.appendChild(t);});}
function rot(i){if(!playing)return;cells[i].r=(cells[i].r+1)%4;moves++;pressure=Math.max(0,pressure-4);document.getElementById('pr').textContent=pressure;document.getElementById('m').textContent=moves;
beep(380+cells[i].r*70,.05);light();render();
if(cells.every(c=>c.lit||c.type==='none'))win();}
function win(){playing=false;clearInterval(leakTimer);beep(720,.12,'triangle');setTimeout(()=>beep(920,.15,'triangle'),120);
if(moves<best){best=moves;localStorage.setItem('gt_best_'+size,best);}
document.getElementById('od').innerHTML='🏺 Water flows! Chamber cleared in <b>'+moves+'</b> rotations!'+(size<7?'<br>Next: '+(size+1)+'×'+(size+1)+' chamber':'<br>The whole tomb is watered!');
document.getElementById('btn').textContent=size<7?'NEXT CHAMBER':'RAID AGAIN';if(size>=7)level=0;level++;document.getElementById('ov').style.display='flex';}
document.getElementById('btn').onclick=()=>{audio.resume();if(level===0)level=1;playing=true;build();pressure=100;document.getElementById('pr').textContent=pressure;clearInterval(leakTimer);leakTimer=setInterval(()=>{if(!playing)return;pressure=Math.max(0,pressure-2);document.getElementById('pr').textContent=pressure;if(pressure<=0){playing=false;clearInterval(leakTimer);beep(110,.4,'sawtooth');document.getElementById('ov').style.display='flex';document.getElementById('od').innerHTML='💧 Pressure lost — pipes flooded!<br><button onclick="location.reload()">Retry</button>';}},800);document.getElementById('ov').style.display='none';};
window.addEventListener('keydown',e=>{if(!playing)return;const r=(focus/size)|0,c=focus%size;const k=e.key;
if(k==='ArrowUp'&&r>0)focus-=size;else if(k==='ArrowDown'&&r<size-1)focus+=size;
else if(k==='ArrowLeft'&&c>0)focus--;else if(k==='ArrowRight'&&c<size-1)focus++;
else if(k==='Enter'||k===' '){e.preventDefault();rot(focus);return;}else return;
render();});
</script>
</body>
</html>
