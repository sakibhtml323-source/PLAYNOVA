<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hero Defense #90</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(#fdf2f8,#fce7f3);font-family:Georgia,serif;color:#9d174d;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px;overflow-x:hidden}
h1{font-size:1.1rem;color:#ec4899;padding:6px}
#hud{display:flex;gap:14px;font-size:.9rem;margin-bottom:6px;flex-wrap:wrap;justify-content:center}
canvas{background:#fbcfe8;border-radius:12px;touch-action:none}
#build{display:flex;gap:8px;margin:8px;flex-wrap:wrap;justify-content:center}
#build button{background:#fff;border:2px solid #f9a8d4;border-radius:12px;padding:8px 14px;font-size:.8rem;cursor:pointer;color:#9d174d}
#build button:disabled{opacity:.4}
#msg{text-align:center;font-size:.82rem;color:#be185d;min-height:1.5em}
#ov{position:fixed;inset:0;background:rgba(253,242,248,.98);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#9d174d;padding:20px;z-index:5}
button.big{background:#ec4899;border:none;color:#fff;font-family:inherit;font-weight:700;padding:12px 34px;border-radius:24px;font-size:1rem;cursor:pointer;margin-top:14px}
</style>
</head>
<body>
<h1>🦸 SUPER PASTEL HERO</h1>
<div id="hud"><span>🍬 Candy <b id="cd">50</b></span><span>Wave <b id="w">1</b></span><span>💗 Heart <b id="h">20</b></span><span>Best <b id="b">0</b></span></div>
<canvas id="c"></canvas>
<div id="build">
<button data-t="gum">🍬 Gumdrop 20</button><button data-t="mint">🌿 Mint 30</button><button data-t="cake">🍰 Cake 45</button>
<button id="go">▶ WAVE</button>
</div>
<div id="msg">Place defenders on the path! They pelt the grey goblins with sweets.</div>
<div id="ov"><h2 style="color:#ec4899">PASTEL DEFENSE</h2><p id="od">The grey goblins march on Candy Kingdom! Build gumdrop shooters, mint chillers and cake mortars on the pink path. Don't let them reach the castle heart!</p><button class="big" id="btn">SAVE THE KINGDOM</button></div>
<script>
"use strict";
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');const W=460,H=340;cvs.width=W;cvs.height=H;
let path,slots,towers,foes,candy,heart,playing,wave,waveOn,selT,best=+localStorage.getItem('ph_best')||0;
document.getElementById('b').textContent=best;
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(f,d=.06,t='square'){if(!playing)return;const o=audio.createOscillator(),g=audio.createGain();o.type=t;o.frequency.value=f;g.gain.value=.08;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
const DEFS={gum:{c:20,r:85,dmg:6,rate:13,e:'🍬',col:'#f472b6'},mint:{c:30,r:80,dmg:3,rate:18,e:'🌿',col:'#4ade80',slow:true},cake:{c:45,r:120,dmg:15,rate:42,e:'🍰',col:'#a855f7',splash:true}};
function resize(){const s=Math.min((window.innerWidth-12)/W,(window.innerHeight-200)/H);cvs.style.width=W*s+'px';cvs.style.height=H*s+'px';}
window.addEventListener('resize',resize);resize();
function buildMap(){path=[[0,1],[1,1],[2,1],[3,1],[3,2],[3,3],[2,3],[1,3],[1,4],[1,5],[2,5],[3,5],[4,5],[5,5],[5,4],[5,3],[6,3],[7,3],[8,3],[9,3],[9,4],[9,5],[10,5],[11,5]];
const onP=k=>path.some(p=>p[0]+','+p[1]===k);
slots=[[2,2],[4,3],[4,4],[3,4],[6,4],[7,4],[8,4],[10,4],[5,2],[7,2]].filter(s=>!onP(s[0]+','+s[1]));
towers=[];foes=[];candy=50;heart=20;wave=0;}
function startWave(){wave++;document.getElementById('w').textContent=wave;waveOn=true;
const n=4+wave*2;for(let i=0;i<n;i++)foes.push({pi:0,off:-i*26,hp:20+wave*6,sp:1+wave*0.08,slowT:0});
beep(500,.12,'triangle');}
let heroCd=0;
function heroAttack(){heroCd++;if(heroCd<25)return;heroCd=0;
let best=null,bd=1e9;const home=path[path.length-1]; /* FIX (PLAYNOVA repair): the hero code used undefined variables (me, f.x, f.y) and threw on every wave; the hero now defends the castle using the foes' real grid position (sx, sy); 130 px = about 3.4 grid cells */ foes.forEach(f=>{if(f.sx===undefined)return;const d=Math.hypot(f.sx-home[0],f.sy-home[1]);if(d<bd){bd=d;best=f;}}); if(best&&bd<3.4){best.hp-=2;beep(700,.05,'triangle');}}
function step(){heroAttack();foes.forEach(e=>{const sp=e.slowT>0?e.sp*0.45:e.sp;e.slowT=Math.max(0,e.slowT-1);
e.off+=sp;if(e.off<0)return; /* FIX (PLAYNOVA repair): enemies spawn with a negative offset (staggered entry); seg became -1 and path[-1] threw every tick */ const seg=Math.floor(e.off/26);
if(seg>=path.length-1){foes.splice(foes.indexOf(e),1);heart--;document.getElementById('h').textContent=heart;beep(130,.2,'sawtooth');
if(heart<=0)over();return;}
e.sx=path[seg][0]+(path[seg+1][0]-path[seg][0])*((e.off%26)/26);
e.sy=path[seg][1]+(path[seg+1][1]-path[seg][1])*((e.off%26)/26);});
towers.forEach(t=>{t.cd--;if(t.cd>0)return;const d=DEFS[t.type];
let nf=null,nd2=1e9;foes.forEach(f=>{const dd=Math.hypot(f.sx-t.x,f.sy-t.y);if(dd<d.r/28&&dd<nd2){nd2=dd;nf=f;}});
if(nf){t.cd=d.rate;nf.hp-=d.dmg;if(d.slow)nf.slowT=30;beep(d.splash?190:560,.04,d.splash?'sawtooth':'square');
if(d.splash)foes.forEach(f2=>{if(f2!==nf&&Math.hypot(f2.sx-nf.sx,f2.sy-nf.sy)<1.4)f2.hp-=7;});
if(nf.hp<=0){foes.splice(foes.indexOf(nf),1);candy+=7;}}});
if(waveOn&&!foes.length){waveOn=false;candy+=25+wave*4;
if(wave>best){best=wave;localStorage.setItem('ph_best',best);document.getElementById('b').textContent=best;}
document.getElementById('msg').textContent='✅ Wave '+wave+' clear! +candy.';beep(700,.14,'triangle');}
document.getElementById('cd').textContent=candy;}
cvs.addEventListener('pointerdown',e=>{if(!playing)return;audio.resume();const r=cvs.getBoundingClientRect();
const mx=(e.clientX-r.left)/r.width*W,my=(e.clientY-r.top)/r.height*H;
let hit=null,hd=1e9;slots.forEach(s=>{const d=Math.hypot(s[0]*38-mx,s[1]*34+10-my);if(d<22&&d<hd&&!towers.some(t=>t.x===s[0]&&t.y===s[1])){hd=d;hit=s;}});
if(hit){const d=DEFS[selT]||{c:Infinity};/* FIX (PLAYNOVA repair): no tower selected yet -> DEFS[...] was undefined and clicking a build spot threw */if(candy>=d.c){candy-=d.c;towers.push({x:hit[0],y:hit[1],type:selT,cd:0});beep(620,.08);}else beep(160,.08,'sawtooth');}});
document.querySelectorAll('#build [data-t]').forEach(b=>b.onclick=()=>{selT=b.dataset.t;});
document.getElementById('go').onclick=()=>{audio.resume();if(playing&&!waveOn)startWave();};
window.addEventListener('keydown',e=>{const k=e.key;if(k>='1'&&k<='3')document.querySelectorAll('#build [data-t]')[+k-1].click();if(k==='Enter'&&playing&&!waveOn)startWave();});
function draw(){ctx.fillStyle='#fbcfe8';ctx.fillRect(0,0,W,H);
path.forEach(p=>{ctx.fillStyle='#f9a8d4';ctx.fillRect(p[0]*38+3,p[1]*34+3,32,28);});
towers.forEach(t=>{ctx.font='17px serif';ctx.textAlign='center';ctx.fillText(DEFS[t.type].e,t.x*38+19,t.y*34+22);});
foes.forEach(e=>{ctx.fillStyle='#78716c';ctx.beginPath();ctx.arc(e.sx*38+19,e.sy*34+17,8,0,7);ctx.fill();});
ctx.fillStyle='#be185d';ctx.font='20px serif';const last=path[path.length-1];ctx.fillText('🏰',last[0]*38+19,last[1]*34+22);}
function loop(){if(playing){step();draw();}requestAnimationFrame(loop);}
function over(){playing=false;beep(110,.5,'sawtooth');
document.getElementById('od').innerHTML='💔 The goblins took the heart on wave <b>'+wave+'</b>.';
document.getElementById('btn').textContent='REBUILD';document.getElementById('ov').style.display='flex';}
document.getElementById('btn').onclick=()=>{audio.resume();buildMap();playing=true;waveOn=false;
document.getElementById('h').textContent=20;document.getElementById('w').textContent=0;
document.getElementById('msg').textContent='Build on pink squares, then press WAVE.';
document.getElementById('ov').style.display='none';};
loop();
</script>
</body>
</html>
