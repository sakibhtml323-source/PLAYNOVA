<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Royal Bee Garden #363</title><style>
body{margin:0;font-family:system-ui;background:#14532d;color:#f0fdf4;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#bbf7d0;font-size:.78rem}
canvas{background:#166534;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#14532d;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🐝 Royal Bee Garden</h1><div class="sub">Drag to steer your bee — pollinate flowers, dodge the hungry bird!</div>
<div id="hud"><span>Pollinated <b id="p">0</b></span><span>❤️ <b id="h">3</b></span><span>⏱️ <b id="t">60</b>s</span></div>
<canvas id="cv" width="440" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">🌸</div><p>Drag anywhere to steer toward your finger.<br>Pollinate 15 flowers before the bird catches you!</p><button id="btn">Fly</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=400;
let bee={x:W/2,y:H/2,vx:0,vy:0},flowers=[],bird={x:-40,y:200,vx:2},pollinated=0,hp=3,playing=false,time=60,timer=null,target=null;
function spawnFlower(){flowers.push({x:30+Math.random()*(W-60),y:30+Math.random()*(H-60),done:false,e:['🌸','🌺','🌼','🌻'][(Math.random()*4)|0]});}
function gen(){flowers=[];for(let i=0;i<8;i++)spawnFlower();
bee={x:W/2,y:H/2,vx:0,vy:0};bird={x:-40,y:200,vx:2};
pollinated=0;hp=3;time=60;target=null;
document.getElementById('p').textContent=0;document.getElementById('h').textContent=3;document.getElementById('t').textContent=60;}
cvs.addEventListener('pointerdown',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
target={x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};});
cvs.addEventListener('pointermove',e=>{if(!playing||!target)return;const r=cvs.getBoundingClientRect();
target={x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};});
cvs.addEventListener('pointerup',()=>{target=null;});
function step(){time--;document.getElementById('t').textContent=time;
if(time<=0){end('⏰ Time!');return;}
// bee steering
if(target){const dx=target.x-bee.x,dy=target.y-bee.y,d=Math.hypot(dx,dy)||1;
bee.vx+=(dx/d)*0.5;bee.vy+=(dy/d)*0.5;}
bee.vx*=0.92;bee.vy*=0.92;
bee.x+=bee.vx;bee.y+=bee.vy;
bee.x=Math.max(14,Math.min(W-14,bee.x));bee.y=Math.max(14,Math.min(H-14,bee.y));
// flowers
flowers.forEach(f=>{if(!f.done&&Math.hypot(f.x-bee.x,f.y-bee.y)<22){
f.done=true;pollinated++;document.getElementById('p').textContent=pollinated;
beep(600+pollinated*30,.1,'triangle');spawnFlower();
if(pollinated>=15){end('🌸 Garden in full bloom!');}}});
// bird hunts
const bd=Math.hypot(bird.x-bee.x,bird.y-bee.y);
if(bd>1){bird.x+=(bee.x-bird.x)/bd*1.6;bird.y+=(bee.y-bird.y)/bd*1.6;}
if(bd<20){hp--;document.getElementById('h').textContent=hp;
beep(150,.2,'sawtooth');bird={x:-40,y:Math.random()*H,vx:2};
if(hp<=0){end('🐦 The bird caught you!');}}}
function end(why){if(!playing)return;playing=false;clearInterval(timer);beep(130,.3,'sawtooth');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML=why+'<br>Pollinated: <b style="color:#fbbf14">'+pollinated+'</b>';}
function draw(){ctx.fillStyle='#166534';ctx.fillRect(0,0,W,H);
flowers.forEach(f=>{ctx.globalAlpha=f.done?0.35:1;
ctx.font='24px serif';ctx.textAlign='center';ctx.fillText(f.done?'🌷':f.e,f.x,f.y+8);
ctx.globalAlpha=1;});
ctx.font='26px serif';ctx.fillText('🐦',bird.x,bird.y+8);
// bee faces movement
const fa=Math.atan2(bee.vy,bee.vx);
ctx.save();ctx.translate(bee.x,bee.y);ctx.rotate(fa+Math.PI/2);
ctx.fillText('🐝',0,0);ctx.restore();
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{gen();
document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();
clearInterval(timer);timer=setInterval(()=>{},1000);};
</script></body></html>
