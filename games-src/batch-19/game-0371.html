<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Royal Chess Knight #371</title><style>
body{margin:0;font-family:system-ui;background:#1e1b4b;color:#eef2ff;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a5b4fc;font-size:.78rem}
#grid{display:grid;grid-template-columns:repeat(6,54px);gap:2px;margin:12px}
.c{width:54px;height:54px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;background:#312e81}
.c.lt{background:#4338ca}
.c.done{background:#14532d;opacity:.8}
.c.me{outline:3px solid #fbbf15}
.c.next{animation:pul 1s infinite}
@keyframes pul{0%,100%{box-shadow:0 0 0 0 #fbbf1500}50%{box-shadow:0 0 0 6px #fbbf1544}}
#hud{display:flex;gap:14px;font-size:.9rem;margin:4px}#hud b{color:#fbbf24}
#msg{min-height:1.3em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#fbbf24;color:#1e1b4b;font-weight:700;cursor:pointer;margin:8px}
</style></head><body>
<h1>♞ Royal Chess Knight</h1><div class="sub">The knight must visit every square once — like a chess knight's tour!</div>
<div id="hud"><span>Visited <b id="v">1</b>/36</span><span>Moves <b id="m">0</b></span></div>
<div id="grid"></div><div id="msg"></div>
<button id="btn">🏰 New Tour</button>
<audio id="au"></audio>
<script>
"use strict";
const AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const N=6;let visited=[],me={r:0,c:0},moves=0,playing=true;
function movesFrom(r,c){const out=[];
[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]].forEach(([dr,dc])=>{
const nr=r+dr,nc=c+dc;
if(nr>=0&&nr<N&&nc>=0&&nc<N&&!visited[nr][nc])out.push([nr,nc]);});
return out;}
function gen(){visited=Array.from({length:N},()=>Array(N).fill(false));
me={r:(Math.random()*N)|0,c:(Math.random()*N)|0};
visited[me.r][me.c]=true;moves=0;playing=true;
document.getElementById('v').textContent=1;document.getElementById('m').textContent=0;
render();msg('Visit all 36 squares!');}
function tap(r,c){if(!playing)return;
const ok=movesFrom(me.r,me.c).some(([nr,nc])=>nr===r&&nc===c);
if(!ok){beep(160,.06,'sawtooth');return;}
me={r,c};visited[r][c]=true;moves++;
const n=visited.flat().filter(x=>x).length;
document.getElementById('v').textContent=n;document.getElementById('m').textContent=moves;
beep(400+n*10,.06);render();
if(n>=N*N){playing=false;beep(880,.3,'triangle');
msg('👑 Knight tour complete in '+moves+' moves!');}}
function render(){const g=document.getElementById('grid');g.innerHTML='';
const opts=movesFrom(me.r,me.c);
for(let r=0;r<N;r++)for(let c=0;c<N;c++){const d=document.createElement('div');
d.className='c '+((r+c)%2?'lt':'')+(visited[r][c]?' done':'');
if(r===me.r&&c===me.c){d.classList.add('me');d.textContent='♞';}
else if(opts.some(([nr,nc])=>nr===r&&nc===c)){d.classList.add('next');d.textContent='·';}
d.onclick=()=>{AU.__c=AU.__c||new (window.AudioContext||window.webkitAudioContext)();tap(r,c);};
g.appendChild(d);}}
function msg(t){document.getElementById('msg').textContent=t;}
document.getElementById('btn').onclick=()=>{AU.__c=new (window.AudioContext||window.webkitAudioContext)();gen();};
gen();
</script></body></html>
