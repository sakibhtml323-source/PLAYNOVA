<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Sand Timer #369</title><style>
body{margin:0;font-family:system-ui;background:#1c1917;color:#fafaf9;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a8a29e;font-size:.78rem}
canvas{background:#292524;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#1c1917;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>⏳ Desert Sand Timer</h1><div class="sub">Tap to flip the hourglass before the sand runs out — keep it flowing!</div>
<div id="hud"><span>Time <b id="t">0.0</b>s</span><span>Best <b id="b">0.0</b>s</span><span>Flips <b id="f">0</b></span></div>
<canvas id="cv" width="360" height="420"></canvas>
<div id="ov"><div style="font-size:3rem">⌛</div><p>Tap anywhere to flip.<br>Never let a chamber run dry!</p><button id="btn">Start</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=360,H=420;let sandTop=100,sandBot=0,flipped=false,playing=false,startT=0,flips=0,best=+localStorage.getItem('dst_best')||0;
document.getElementById('b').textContent=best.toFixed(1);
cvs.addEventListener('pointerdown',()=>{if(!playing)return;
flipped=!flipped;flips++;document.getElementById('f').textContent=flips;
beep(400,.1,'triangle');});
function step(){const rate=0.25+flips*0.004;
if(!flipped){sandTop-=rate;sandBot+=rate;}else{sandBot-=rate;sandTop+=rate;}
if(sandTop<=0||sandBot<=0){playing=false;beep(130,.35,'sawtooth');
const t=(Date.now()-startT)/1000;
if(t>best){best=t;localStorage.setItem('dst_best',best);document.getElementById('b').textContent=best.toFixed(1);}
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='⏳ Sand ran out!<br>Lasted <b style="color:#fbbf14">'+t.toFixed(1)+'s</b> with '+flips+' flips';return;}
document.getElementById('t').textContent=((Date.now()-startT)/1000).toFixed(1);}
function draw(){ctx.fillStyle='#292524';ctx.fillRect(0,0,W,H);
const cx=W/2;
ctx.save();ctx.translate(cx,H/2);ctx.rotate(flipped?Math.PI:0);
// hourglass outline
ctx.strokeStyle='#d6d3d1';ctx.lineWidth=4;
ctx.beginPath();ctx.moveTo(-60,-140);ctx.lineTo(60,-140);
ctx.moveTo(-60,140);ctx.lineTo(60,140);
ctx.moveTo(-60,-140);ctx.quadraticCurveTo(0,-20,60,-140);
ctx.moveTo(-60,140);ctx.quadraticCurveTo(0,20,60,140);
ctx.stroke();
// sand (top half)
const topPct=Math.max(0,Math.min(1,sandTop/100));
ctx.fillStyle='#fbbf24';
ctx.beginPath();ctx.moveTo(-56,-136);
ctx.quadraticCurveTo(0,-136+116*topPct,56,-136);
ctx.closePath();ctx.fill();
ctx.restore();
// bottom sand (drawn unrotated for clarity)
const botPct=Math.max(0,Math.min(1,sandBot/100));
ctx.fillStyle='#fbbf24';
ctx.beginPath();ctx.moveTo(cx-56+0,136+H/2-H/2);
ctx.beginPath();ctx.moveTo(cx-56,H/2+136);
ctx.quadraticCurveTo(cx,H/2+136-116*botPct,cx+56,H/2+136);
ctx.closePath();ctx.fill();
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{sandTop=100;sandBot=0;flipped=false;flips=0;
document.getElementById('f').textContent=0;
document.getElementById('ov').style.display='none';playing=true;startT=Date.now();
AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();};
</script></body></html>
