<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Royal Crown Jewels #380</title><style>
body{margin:0;font-family:system-ui;background:#1e1b4b;color:#eef2ff;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a5b4fc;font-size:.78rem}
canvas{background:#312e81;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#msg{min-height:1.3em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#fbbf24;color:#1e1b4b;font-weight:700;cursor:pointer;margin:8px}
</style></head><body>
<h1>👑 Royal Crown Jewels</h1><div class="sub">Rotate the crown's rings — align the gems so light flows from top to every slot!</div>
<div id="hud"><span>Aligned <b id="a">0</b>/4</span><span>Moves <b id="m">0</b></span><span>Level <b id="l">1</b></span></div>
<canvas id="cv" width="380" height="380"></canvas>
<div id="msg"></div>
<button id="btn">✨ New Crown</button>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=380,CX=W/2,CY=W/2;const RINGS=[60,100,140];
const SLOTS=[[0,'12 o\'clock'],[1,'3 o\'clock'],[2,'6 o\'clock'],[3,'9 o\'clock']];
let rings=[[],[],[]],moves=0,level=1;
function gen(){rings=[[],[],[]];
// each ring has gems at some slots; ring 0 (inner) is source with gem at slot 0 (top)
for(let r=0;r<3;r++){for(let s=0;s<4;s++){
const has=r===0?(s===0):Math.random()<0.55;
rings[r][s]={has,gem:has?['💎','🔷','💠','🟣'][(Math.random()*4)|0]:null};}}
// rotate rings randomly
for(let r=1;r<3;r++){const sh=(Math.random()*4)|0;
for(let k=0;k<sh;k++){rings[r].unshift(rings[r].pop());}}
moves=0;level=1;document.getElementById('m').textContent=0;
document.getElementById('l').textContent=level;
draw();check();msg('Rotate rings so gems line up top-to-bottom!');}
cvs.addEventListener('pointerdown',e=>{const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*W/r.height;
const d=Math.hypot(x-CX,y-CY);
let ring=-1;for(let i=0;i<3;i++){if(d>RINGS[i]-26&&d<RINGS[i]+26)ring=i;}
if(ring<0)return;
AU.__c=AU.__c||new (window.AudioContext||window.webkitAudioContext)();
// rotate: clockwise if right half, ccw if left half
const cw=x>CX;
if(cw)rings[ring].unshift(rings[ring].pop());
else rings[ring].push(rings[ring].shift());
moves++;document.getElementById('m').textContent=moves;
beep(300+ring*100,.07);draw();check();});
function alignedCount(){let n=0;
for(let s=0;s<4;s++){
// column aligned if every ring-with-gem at this slot has one and inner has gem
if(rings[0][s].has&&rings[1][s].has&&rings[2][s].has)n++;
else if(rings[0][s].has&&!rings[1][s].has&&!rings[2][s].has)n++;}
return n;}
function check(){const n=alignedCount();
document.getElementById('a').textContent=n;
// win: all 4 slots either full columns or empty (source-only)
let ok=true;
for(let s=0;s<4;s++){const a=rings[0][s].has,b=rings[1][s].has,c=rings[2][s].has;
if(a&&!(b&&c))ok=false;}
if(ok){beep(880,.3,'triangle');msg('👑 Crown jewels aligned! Level '+(level+1));level++;
document.getElementById('l').textContent=level;
// scramble more
for(let r=1;r<3;r++){const sh=1+((Math.random()*3)|0);
for(let k=0;k<sh;k++){rings[r].unshift(rings[r].pop());}}
draw();}}
function draw(){ctx.fillStyle='#312e81';ctx.fillRect(0,0,W,W);
RINGS.forEach((R,ri)=>{ctx.beginPath();ctx.arc(CX,CY,R,0,7);
ctx.strokeStyle=ri===0?'#fbbf24':'#4f46e5';ctx.lineWidth=18;ctx.stroke();});
rings.forEach((ring,ri)=>{ring.forEach((slot,s)=>{
if(!slot.has)return;
const a=s*Math.PI/2-Math.PI/2;
const x=CX+Math.cos(a)*RINGS[ri],y=CY+Math.sin(a)*RINGS[ri];
ctx.font='20px serif';ctx.textAlign='center';ctx.fillText(slot.gem,x,y+7);});});
// light beam from top when aligned
let lit=0;
for(let s=0;s<4;s++){if(rings[0][s].has&&rings[1][s].has&&rings[2][s].has){lit++;
const a=s*Math.PI/2-Math.PI/2;
ctx.strokeStyle='#fbbf2488';ctx.lineWidth=3;
ctx.beginPath();ctx.moveTo(CX+Math.cos(a)*40,CY+Math.sin(a)*40);
ctx.lineTo(CX+Math.cos(a)*160,CY+Math.sin(a)*160);ctx.stroke();}}
ctx.lineWidth=1;
// center gem
ctx.font='26px serif';ctx.fillText('💎',CX,CY+9);}
function msg(t){document.getElementById('msg').textContent=t;}
document.getElementById('btn').onclick=()=>{AU.__c=new (window.AudioContext||window.webkitAudioContext)();gen();};
gen();
</script></body></html>
