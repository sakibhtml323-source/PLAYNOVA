<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Ant Farm #361</title><style>
body{margin:0;font-family:system-ui;background:#78350f;color:#fef3c7;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#fde68a;font-size:.78rem}
canvas{background:#92400e;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#78350f;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🐜 Desert Ant Farm</h1><div class="sub">Dig tunnels with your finger — guide the ant colony to the sugar!</div>
<div id="hud"><span>Ants fed <b id="f">0</b></span><span>Time <b id="t">60</b>s</span><span>Best <b id="b">0</b></span></div>
<canvas id="cv" width="440" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">🐜</div><p>Drag through the sand to dig.<br>Ants follow your tunnels to the 🍬!</p><button id="btn">Dig</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=400,CELL=20,NX=W/CELL,NY=H/CELL;
let sand=[],ants=[],sugar={},nest={},fed=0,playing=false,time=60,timer=null,digging=false,best=+localStorage.getItem('daf_best')||0;
document.getElementById('b').textContent=best;
function gen(){sand=[];for(let r=0;r<NY;r++){const row=[];for(let c=0;c<NX;c++)row.push(true);sand.push(row);}
nest={x:2,y:2};sand[2][2]=false;sugar={x:NX-3,y:NY-3};
ants=[];for(let i=0;i<5;i++)ants.push({x:2,y:2,tx:NX-3,ty:NY-3,carry:false,ph:Math.random()*6});
fed=0;time=60;document.getElementById('f').textContent=0;document.getElementById('t').textContent=60;
draw();}
cvs.addEventListener('pointerdown',e=>{if(!playing)return;digging=true;dig(e);});
cvs.addEventListener('pointermove',e=>{if(digging&&playing)dig(e);});
cvs.addEventListener('pointerup',()=>{digging=false;});
function dig(e){const r=cvs.getBoundingClientRect();
const c=Math.floor((e.clientX-r.left)/r.width*NX),rr=Math.floor((e.clientY-r.top)/r.height*NY);
for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
const nc=c+dc,nr=rr+dr;
if(nc>=0&&nc<NX&&nr>=0&&nr<NY&&sand[nr][nc]){sand[nr][nc]=false;}}
draw();}
function step(){ants.forEach(a=>{
// follow open path greedily toward target
const opts=[];[[a.x-1,a.y],[a.x+1,a.y],[a.x,a.y-1],[a.x,a.y+1]].forEach(([x,y])=>{
if(x>=0&&x<NX&&y>=0&&y<NY&&!sand[y][x])opts.push({x,y,
d:Math.abs(x-a.tx)+Math.abs(y-a.ty)+Math.random()*0.6});});
if(opts.length){opts.sort((p,q)=>p.d-q.d);a.x=opts[0].x;a.y=opts[0].y;}
// reached target
if(!a.carry&&a.x===sugar.x&&a.y===sugar.y){a.carry=true;a.tx=nest.x;a.ty=nest.y;}
if(a.carry&&a.x===nest.x&&a.y===nest.y){a.carry=false;a.tx=sugar.x;a.ty=sugar.y;
fed++;document.getElementById('f').textContent=fed;beep(500+fed*30,.08);
if(fed>best){best=fed;localStorage.setItem('daf_best',best);document.getElementById('b').textContent=best;}}});
time--;document.getElementById('t').textContent=time;
if(time<=0){playing=false;clearInterval(timer);beep(130,.3,'sawtooth');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='⏰ Shift over!<br>Fed <b style="color:#fbbf14">'+fed+'</b> ant-trips';}}
function draw(){ctx.fillStyle='#92400e';ctx.fillRect(0,0,W,H);
for(let r=0;r<NY;r++)for(let c=0;c<NX;c++){
if(!sand[r][c]){ctx.fillStyle='#451a03';ctx.fillRect(c*CELL+1,r*CELL+1,CELL-2,CELL-2);}}
ctx.font='16px serif';ctx.textAlign='center';
ctx.fillText('🏠',nest.x*CELL+10,nest.y*CELL+14);
ctx.fillText('🍬',sugar.x*CELL+10,sugar.y*CELL+14);
ants.forEach(a=>{ctx.fillStyle=a.carry?'#fbbf24':'#fef3c7';
ctx.beginPath();ctx.arc(a.x*CELL+10,a.y*CELL+10,4,0,7);ctx.fill();});}
document.getElementById('btn').onclick=()=>{gen();
document.getElementById('ov').style.display='none';playing=true;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();
clearInterval(timer);timer=setInterval(()=>{if(playing)step();},400);};
gen();
</script></body></html>
