<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ninja Word Scroll #364</title><style>
body{margin:0;font-family:system-ui;background:#111827;color:#f9fafb;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#9ca3af;font-size:.78rem}
#scroll{max-height:180px;overflow-y:auto;width:330px;margin:8px;border:2px solid #374151;border-radius:10px;padding:8px;background:#1f2937}
.wrow{display:flex;gap:4px;align-items:center;margin:2px;font-size:.9rem}
.wrow .w{background:#7c3aed;border-radius:6px;padding:3px 10px;font-weight:700}
.wrow .lnk{color:#facc15;font-weight:800}
#hud{display:flex;gap:14px;font-size:.9rem;margin:4px}#hud b{color:#facc15}
input{padding:10px 16px;border-radius:10px;border:2px solid #374151;background:#1f2937;color:#f9fafb;font-size:1.05rem;font-weight:700;text-transform:lowercase;text-align:center;width:180px}
#msg{min-height:1.4em;font-weight:600;margin:4px}
button{padding:10px 22px;border-radius:999px;border:none;background:#facc15;color:#111827;font-weight:700;cursor:pointer;margin:8px}
</style></head><body>
<h1>📜 Ninja Word Scroll</h1><div class="sub">Chain words: each new word must start with the last letter. Longer chains, bigger score!</div>
<div id="hud"><span>Chain <b id="c">0</b></span><span>Score <b id="s">0</b></span><span>⏱️ <b id="t">45</b>s</span><span>Best <b id="b">0</b></span></div>
<div id="scroll"></div>
<input id="in" placeholder="next word" maxlength="12">
<div id="msg"></div>
<button id="btn">🥷 New Scroll</button>
<audio id="au"></audio>
<script>
"use strict";
const AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const STARTS=['ninja','katana','shadow','river','flame','moon','stone','wind','tree','gold','ring','star','night','wolf','fire'];
let chain=[],score=0,time=45,timer=null,playing=false,best=+localStorage.getItem('nws_best')||0;
document.getElementById('b').textContent=best;
function newScroll(){chain=[STARTS[(Math.random()*STARTS.length)|0]];score=0;time=45;playing=true;
document.getElementById('c').textContent=1;document.getElementById('s').textContent=0;
document.getElementById('t').textContent=45;document.getElementById('in').value='';
render();msg('Start: "'+chain[0]+'" → next word starts with "'+chain[0].slice(-1)+'"');
clearInterval(timer);timer=setInterval(()=>{time--;document.getElementById('t').textContent=time;
if(time<=0){playing=false;clearInterval(timer);beep(130,.3,'sawtooth');
msg('⏰ Scroll sealed! Chain of '+chain.length+', score '+score);}},1000);}
function submit(){if(!playing)return;const w=document.getElementById('in').value.toLowerCase().trim();
document.getElementById('in').value='';
if(w.length<3){beep(160,.08,'sawtooth');msg('3+ letters!');return;}
const last=chain[chain.length-1];
if(w[0]!==last.slice(-1)){beep(180,.1,'sawtooth');msg('Must start with "'+last.slice(-1)+'"!');return;}
if(chain.includes(w)){beep(180,.1,'sawtooth');msg('Already on the scroll!');return;}
chain.push(w);const pts=w.length*10;score+=pts;
document.getElementById('c').textContent=chain.length;document.getElementById('s').textContent=score;
if(score>best){best=score;localStorage.setItem('nws_best',best);document.getElementById('b').textContent=best;}
beep(400+chain.length*30,.09,'triangle');
time=Math.min(60,time+6);document.getElementById('t').textContent=time;
render();msg('✅ "'+w+'" +'+pts+' — next starts with "'+w.slice(-1)+'"');}
function render(){const s=document.getElementById('scroll');s.innerHTML='';
chain.forEach((w,i)=>{const d=document.createElement('div');d.className='wrow';
d.innerHTML='<span class="w">'+w+'</span>'+(i<chain.length-1?'<span class="lnk">→</span>':'');
s.appendChild(d);});
s.scrollTop=s.scrollHeight;}
document.getElementById('in').addEventListener('keydown',e=>{if(e.key==='Enter'){AU.__c=AU.__c||new (window.AudioContext||window.webkitAudioContext)();submit();}});
function msg(t){document.getElementById('msg').textContent=t;}
document.getElementById('btn').onclick=()=>{AU.__c=new (window.AudioContext||window.webkitAudioContext)();newScroll();};
newScroll();
</script></body></html>
