<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crystal Grid Shift #362</title><style>
body{margin:0;font-family:system-ui;background:#0f172a;color:#e2e8f0;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#94a3b8;font-size:.78rem}
#grid{display:grid;grid-template-columns:repeat(6,50px);gap:4px;margin:12px}
.c{width:50px;height:50px;background:#1e293b;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;user-select:none}
.c.sel{outline:2px solid #facc15}
#rotBtns{display:flex;gap:10px;margin:8px}
#hud{display:flex;gap:14px;font-size:.9rem;margin:4px}#hud b{color:#facc15}
#msg{min-height:1.3em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#7c3aed;color:#fff;font-weight:700;cursor:pointer;margin:4px}
</style></head><body>
<h1>🔄 Crystal Grid Shift</h1><div class="sub">Swap gems to match 3+ — but the whole board ROTATES every 5 swaps, dropping everything!</div>
<div id="hud"><span>Score <b id="s">0</b></span><span>Swaps to rotate <b id="r">5</b></span></div>
<div id="grid"></div>
<div id="rotBtns">
<button id="ccw">⟲ Rotate CCW</button>
<button id="cw">⟳ Rotate CW</button>
</div>
<div id="msg"></div>
<button id="btn">✨ New Board</button>
<audio id="au"></audio>
<script>
"use strict";
const AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const N=6,ICONS=['💎','🔷','💠','🔮','💜','🟦'];
let grid=[],sel=null,score=0,swapsLeft=5;
function build(){grid=[];for(let r=0;r<N;r++){const row=[];for(let c=0;c<N;c++)row.push((Math.random()*6)|0);grid.push(row);}
score=0;swapsLeft=5;sel=null;
document.getElementById('s').textContent=0;document.getElementById('r').textContent=5;
render();msg('Swap adjacent gems!');}
function find(){const m=new Set();
for(let r=0;r<N;r++){let run=1;for(let c=1;c<=N;c++){
if(c<N&&grid[r][c]===grid[r][c-1])run++;
else{if(run>=3)for(let k=c-run;k<c;k++)m.add(r*N+k);run=1;}}}
for(let c=0;c<N;c++){let run=1;for(let r=1;r<=N;r++){
if(r<N&&grid[r][c]===grid[r-1][c])run++;
else{if(run>=3)for(let k=r-run;k<r;k++)m.add(k*N+c);run=1;}}}
return m;}
function grav(){for(let c=0;c<N;c++){let w=N-1;
for(let r=N-1;r>=0;r--){if(grid[r][c]!==null){grid[w][c]=grid[r][c];if(w!==r)grid[r][c]=null;w--;}}
for(let r=w;r>=0;r--)grid[r][c]=(Math.random()*6)|0;}}
function tap(r,c){if(sel&&sel.r===r&&sel.c===c){sel=null;render();return;}
if(!sel){sel={r,c};render();return;}
if(Math.abs(sel.r-r)+Math.abs(sel.c-c)!==1){sel={r,c};render();return;}
[grid[sel.r][sel.c],grid[r][c]]=[grid[r][c],grid[sel.r][sel.c]];
const m=find();
if(!m.size){[grid[sel.r][sel.c],grid[r][c]]=[grid[r][c],grid[sel.r][sel.c]];
beep(160,.08,'sawtooth');sel=null;render();return;}
swapsLeft--;document.getElementById('r').textContent=Math.max(0,swapsLeft);
let gained=0,chain=true;
while(chain){const mm=find();if(!mm.size)break;
gained+=mm.size*20;mm.forEach(i=>{grid[(i/N)|0][i%N]=null;});grav();}
score+=gained;document.getElementById('s').textContent=score;
beep(500,.12,'triangle');sel=null;render();
if(swapsLeft<=0){rotateCW();swapsLeft=5;document.getElementById('r').textContent=5;
msg('🌀 Board rotated!');}
else if(gained>0)msg('💥 +'+gained);}
function rotateCW(){const ng=Array.from({length:N},()=>Array(N).fill(null));
for(let r=0;r<N;r++)for(let c=0;c<N;c++)ng[c][N-1-r]=grid[r][c];
grid=ng;grav();render();}
document.getElementById('cw').onclick=()=>{if(swapsLeft<5)return;rotateCW();swapsLeft=5;
document.getElementById('r').textContent=5;beep(300,.15,'triangle');msg('🌀 Rotated!');};
document.getElementById('ccw').onclick=()=>{if(swapsLeft<5)return;
const ng=Array.from({length:N},()=>Array(N).fill(null));
for(let r=0;r<N;r++)for(let c=0;c<N;c++)ng[N-1-c][r]=grid[r][c];
grid=ng;grav();swapsLeft=5;document.getElementById('r').textContent=5;
render();beep(300,.15,'triangle');msg('🌀 Rotated!');};
function render(){const g=document.getElementById('grid');g.innerHTML='';
for(let r=0;r<N;r++)for(let c=0;c<N;c++){const d=document.createElement('div');
d.className='c'+(sel&&sel.r===r&&sel.c===c?' sel':'');
d.textContent=ICONS[grid[r][c]]||'';
d.onclick=()=>{AU.__c=AU.__c||new (window.AudioContext||window.webkitAudioContext)();tap(r,c);};
g.appendChild(d);}}
function msg(t){document.getElementById('msg').textContent=t;}
document.getElementById('btn').onclick=()=>{AU.__c=new (window.AudioContext||window.webkitAudioContext)();build();};
build();
</script></body></html>
