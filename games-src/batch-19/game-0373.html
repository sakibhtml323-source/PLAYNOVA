<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haunted Mirror Path #373</title><style>
body{margin:0;font-family:system-ui;background:#18181b;color:#fafafa;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a1a1aa;font-size:.78rem}
canvas{background:#27272a;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#facc15}
#msg{min-height:1.3em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#7c3aed;color:#fff;font-weight:700;cursor:pointer;margin:8px}
</style></head><body>
<h1>🪞 Haunted Mirror Path</h1><div class="sub">Rotatable mirrors AND splitter crystals — one beam becomes many!</div>
<div id="hud"><span>Crystals lit <b id="c">0</b></span><span>Mirrors <b id="m">6</b></span><span>Level <b id="l">1</b></span></div>
<canvas id="cv" width="400" height="400"></canvas>
<div id="msg"></div>
<button id="btn">✨ New Chamber</button>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const N=7,CELL=400/N;
let mirrors=[],splitters=[],crystals=[],laser={r:0,c:0,d:0},maxMirrors=6,level=1,playing=true;
function gen(){mirrors=[];splitters=[];crystals=[];maxMirrors=Math.max(3,7-level);
laser={r:0,c:0,d:0};
// crystals to light
const nc=Math.min(1+level,4);
for(let i=0;i<nc;i++){crystals.push({r:(Math.random()*N)|0,c:(Math.random()*N)|0,lit:false});}
// splitters fixed
splitters.push({r:2,c:3},{r:4,c:3});
playing=true;
document.getElementById('m').textContent=maxMirrors;
document.getElementById('l').textContent=level;
draw();msg('Light every crystal!');}
function traceAll(){crystals.forEach(c=>c.lit=false);
const beams=[{r:laser.r,c:laser.c,d:laser.d}];
const seen=new Set();
while(beams.length){const b=beams.pop();
for(let s=0;s<50;s++){const dr=[0,1,0,-1][b.d],dc=[1,0,-1,0][b.d];
b.r+=dr;b.c+=dc;
if(b.r<0||b.r>=N||b.c<0||b.c>=N)break;
crystals.forEach(c=>{if(c.r===b.r&&c.c===b.c)c.lit=true;});
const m=mirrors.find(mm=>mm.r===b.r&&mm.c===b.c);
if(m){b.d=m.t===0?(b.d===0?3:b.d===3?0:b.d===1?2:1):(b.d===0?1:b.d===1?0:b.d===2?3:2);continue;}
const sp=splitters.find(ss=>ss.r===b.r&&ss.c===b.c);
if(sp){// split: continue + perpendicular
beams.push({r:b.r,c:b.c,d:(b.d+1)%4});continue;}
const key=b.r+','+b.c+','+b.d;
if(seen.has(key))break;seen.add(key);}}}
function tap(r,c){if(!playing)return;
if(crystals.some(x=>x.r===r&&x.c===c)||(r===laser.r&&c===laser.c))return;
const sp=splitters.find(s=>s.r===r&&s.c===c);
if(sp){beep(300,.1);return;}
const i=mirrors.findIndex(mm=>mm.r===r&&mm.c===c);
if(i>=0){mirrors.splice(i,1);beep(300,.06);draw();return;}
if(mirrors.length>=maxMirrors){beep(160,.06,'sawtooth');return;}
mirrors.push({r,c,t:0});beep(500,.07);draw();check();}
function tapRotate(r,c){const m=mirrors.find(mm=>mm.r===r&&mm.c===c);
if(m){m.t=1-m.t;beep(450,.06);draw();check();}}
cvs.addEventListener('pointerdown',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
const c=Math.floor((e.clientX-r.left)/r.width*N),rr=Math.floor((e.clientY-r.top)/r.height*N);
AU.__c=AU.__c||new (window.AudioContext||window.webkitAudioContext)();
if(mirrors.some(mm=>mm.r===rr&&mm.c===c))tapRotate(rr,c);else tap(rr,c);});
function check(){traceAll();draw();
document.getElementById('c').textContent=crystals.filter(x=>x.lit).length;
if(crystals.every(x=>x.lit)){playing=false;beep(880,.3,'triangle');
msg('💎 All crystals lit! Level '+(level+1));level++;
setTimeout(gen,1000);}}
function draw(){ctx.fillStyle='#27272a';ctx.fillRect(0,0,N*CELL,N*CELL);
traceAll();
ctx.strokeStyle='#334155';
for(let i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,N*CELL);ctx.stroke();
ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(N*CELL,i*CELL);ctx.stroke;}
// beams
ctx.strokeStyle='#ef4444';ctx.lineWidth=2;
let beams=[{r:laser.r,c:laser.c,d:laser.d,pts:[{r:laser.r,c:laser.c}]}];
const done=new Set();
while(beams.length){const b=beams.pop();
for(let s=0;s<50;s++){const dr=[0,1,0,-1][b.d],dc=[1,0,-1,0][b.d];
b.r+=dr;b.c+=dc;
if(b.r<0||b.r>=N||b.c<0||b.c>=N){b.pts.push({r:b.r,c:b.c});break;}
b.pts.push({r:b.r,c:b.c});
const m=mirrors.find(mm=>mm.r===b.r&&mm.c===b.c);
if(m){b.d=m.t===0?(b.d===0?3:b.d===3?0:b.d===1?2:1):(b.d===0?1:b.d===1?0:b.d===2?3:2);continue;}
const sp=splitters.find(ss=>ss.r===b.r&&ss.c===b.c);
if(sp){beams.push({r:b.r,c:b.c,d:(b.d+1)%4,pts:[{r:b.r,c:b.c}]});continue;}
const key=b.r+','+b.c+','+b.d;
if(done.has(key))break;done.add(key);}
if(b.pts.length>1){ctx.beginPath();
ctx.moveTo(b.pts[0].c*CELL+CELL/2,b.pts[0].r*CELL+CELL/2);
b.pts.forEach(p=>ctx.lineTo(p.c*CELL+CELL/2,p.r*CELL+CELL/2));ctx.stroke();}}
ctx.lineWidth=1;
// laser source
ctx.fillStyle='#ef4444';ctx.fillRect(0,0,CELL/2,CELL/2);
// crystals
crystals.forEach(c=>{ctx.font='22px serif';ctx.textAlign='center';
ctx.fillText(c.lit?'💎':'🔘',c.c*CELL+CELL/2,c.r*CELL+CELL/2+8);});
// splitters
splitters.forEach(s=>{ctx.font='18px serif';ctx.fillText('✨',s.c*CELL+CELL/2,s.r*CELL+CELL/2+6);});
// mirrors
mirrors.forEach(m=>{ctx.save();ctx.translate(m.c*CELL+CELL/2,m.r*CELL+CELL/2);
ctx.rotate(m.t===0?-Math.PI/4:Math.PI/4);
ctx.fillStyle='#94a3b8';ctx.fillRect(-15,-3,30,6);ctx.restore();});}
function msg(t){document.getElementById('msg').textContent=t;}
document.getElementById('btn').onclick=()=>{level=1;AU.__c=new (window.AudioContext||window.webkitAudioContext)();gen();};
gen();
</script></body></html>
