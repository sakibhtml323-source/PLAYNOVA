<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ninja Smoke Bomb #379</title><style>
body{margin:0;font-family:system-ui;background:#111827;color:#f9fafb;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#9ca3af;font-size:.78rem}
canvas{background:#1f2937;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#facc15}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#facc15;color:#111827;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>💨 Ninja Smoke Bomb</h1><div class="sub">Guards patrol with lanterns — throw smoke bombs to blind them and slip past!</div>
<div id="hud"><span>Level <b id="l">1</b></span><span>Bombs <b id="b">5</b></span><span>Spotted <b id="s">0</b>/3</span></div>
<canvas id="cv" width="440" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">💨</div><p>Tap anywhere to drop a smoke bomb.<br>Sneak to the scroll while guards can't see!</p><button id="btn">Sneak</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=400;let me={x:40,y:H/2},goal={x:W-50,y:H/2},guards=[],smokes=[],bombs=5,level=1,spotted=0,playing=true,drag=null;
function gen(){guards=[];const ng=Math.min(2+level,5);
for(let i=0;i<ng;i++){guards.push({x:100+Math.random()*(W-200),y:40+Math.random()*(H-80),
ang:Math.random()*Math.PI*2,sp:0.6+Math.random()*0.4+level*0.08});}
me={x:40,y:H/2};goal={x:W-50,y:H/2};
smokes=[];bombs=5+level;spotted=0;playing=true;drag=null;
document.getElementById('l').textContent=level;
document.getElementById('b').textContent=bombs;
document.getElementById('s').textContent=0;
draw();msgShow('Reach the scroll!');}
function msgShow(t){const el=document.createElement('div');
el.style.cssText='position:fixed;bottom:60px;left:50%;transform:translateX(-50%);color:#fbbf24;font-weight:700';
el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),1500);}
cvs.addEventListener('pointerdown',e=>{if(!playing||bombs<=0)return;const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
smokes.push({x,y,r:10,max:70+level*5});
bombs--;document.getElementById('b').textContent=bombs;
beep(300,.15,'sawtooth');});
// stealth movement: tap-drag sets direction
cvs.addEventListener('pointermove',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
drag={x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};});
function inSmoke(x,y){return smokes.some(s=>Math.hypot(s.x-x,s.y-y)<s.r);}
function step(){smokes.forEach(s=>{s.r=Math.min(s.max,s.r+1.5);});
guards.forEach(g=>{g.x+=Math.cos(g.ang)*g.sp;g.y+=Math.sin(g.ang)*g.sp;
if(g.x<30||g.x>W-30)g.ang=Math.PI-g.ang;
if(g.y<30||g.y>H-30)g.ang=-g.ang;});
// move ninja toward drag
if(drag){const dx=drag.x-me.x,dy=drag.y-me.y,d=Math.hypot(dx,dy);
if(d>4){me.x+=dx/d*2.2;me.y+=dy/d*2.2;}}
me.x=Math.max(16,Math.min(W-16,me.x));me.y=Math.max(16,Math.min(H-16,me.y));
// guards spot ninja unless in smoke or far
guards.forEach(g=>{const d=Math.hypot(g.x-me.x,g.y-me.y);
if(d<46&&!inSmoke(me.x,me.y)){spotted++;document.getElementById('s').textContent=spotted;
beep(150,.2,'sawtooth');me={x:40,y:H/2};
if(spotted>=3){playing=false;beep(130,.35,'sawtooth');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🚨 Spotted three times!<br>Level '+level;}}});
// win
if(Math.hypot(me.x-goal.x,me.y-goal.y)<26){playing=false;beep(880,.3,'triangle');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='📜 Scroll stolen!<br>Level '+(level+1);
level++;setTimeout(gen,1200);}}
function draw(){ctx.fillStyle='#1f2937';ctx.fillRect(0,0,W,H);
// smokes
smokes.forEach(s=>{const g2=ctx.createRadialGradient(s.x,s.y,4,s.x,s.y,s.r);
g2.addColorStop(0,'#e5e7ebcc');g2.addColorStop(1,'#e5e7eb00');
ctx.fillStyle=g2;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();});
// guards
guards.forEach(g=>{ctx.font='22px serif';ctx.textAlign='center';ctx.fillText('🏮',g.x,g.y+8);
ctx.strokeStyle='#eab30833';ctx.beginPath();ctx.arc(g.x,g.y,46,0,7);ctx.stroke();});
// goal
ctx.font='24px serif';ctx.fillText('📜',goal.x,goal.y+8);
// ninja
ctx.fillText('🥷',me.x,me.y+8);
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{level=1;gen();
document.getElementById('ov').style.display='none';
AU.__c=new (window.AudioContext||window.webkitAudioContext)();};
</script></body></html>
