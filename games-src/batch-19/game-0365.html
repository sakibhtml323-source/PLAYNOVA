<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desert Mine Cart #365</title><style>
body{margin:0;font-family:system-ui;background:#1c1917;color:#fafaf9;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a8a29e;font-size:.78rem}
canvas{background:#292524;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#fbbf24;color:#1c1917;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>⛏️ Desert Mine Cart</h1><div class="sub">Tap the track junctions to steer your cart — grab 💎 gems, dodge 🪨 rocks!</div>
<div id="hud"><span>Gems <b id="g">0</b></span><span>❤️ <b id="h">3</b></span><span>Speed <b id="s">1×</b></span></div>
<canvas id="cv" width="440" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">🛒</div><p>Tap junction circles to switch the route.<br>Collect gems, avoid rocks!</p><button id="btn">Ride</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=440,H=400;
// rail segments: junction at index -> next two options
const NODES=[[W/2,20],[120,120],[320,120],[60,230],[220,230],[380,230],[120,340],[320,340]];
const EDGES={0:[1,2],1:[3,4],2:[4,5],3:[6],4:[6,7],5:[7]};
let cart={node:0,next:1,t:0},junctions={},gems=[],hp=3,gemsGot=0,speed=1,playing=false;
function placeItems(){gems=[];const spots=[1,2,3,4,5,6,7];
spots.forEach(n=>{const r=Math.random();
gems.push({node:n,e:r<0.25?'🪨':'💎'});});}
function nodeXY(n){return NODES[n];}
function edgeKey(a,b){return a+'-'+b;}
function chosen(a,b){return junctions[edgeKey(a,b)]||b;}
cvs.addEventListener('pointerdown',e=>{if(!playing)return;const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
// find nearest node with 2+ options
Object.keys(EDGES).forEach(k=>{const opts=EDGES[k];
if(opts.length>1){const[xn,yn]=nodeXY(+k);
if(Math.hypot(xn-x,yn-y)<34){const cur=chosen(+k,opts[0]);
const other=opts.find(o=>o!==cur);
junctions[edgeKey(+k,cur)]=other;junctions[edgeKey(+k,other)]=cur;
beep(400,.08);}}});});
function step(){cart.t+=0.02*speed;
const from=nodeXY(cart.node),to=nodeXY(cart.next);
if(cart.t>=1){cart.node=cart.next;
// arrive: collect or hit
const it=gems.find(g=>g.node===cart.node);
if(it){if(it.e==='💎'){gemsGot++;document.getElementById('g').textContent=gemsGot;
beep(600+gemsGot*30,.1,'triangle');}
else{hp--;document.getElementById('h').textContent=hp;
beep(150,.2,'sawtooth');
if(hp<=0){playing=false;beep(130,.35,'sawtooth');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='💥 Cart wrecked!<br>Gems: '+gemsGot;return;}}
gems=gems.filter(g=>g.node!==cart.node);
speed=Math.min(2.5,1+gemsGot*0.08);document.getElementById('s').textContent=speed.toFixed(1)+'×';}
const opts=EDGES[cart.node]||[7];
if(cart.node===7){playing=false;beep(880,.3,'triangle');
document.getElementById('ov').style.display='flex';
document.getElementById('ov').querySelector('p').innerHTML='🏁 Ride complete!<br>Gems: <b style="color:#fbbf14">'+gemsGot+'</b>';
return;}
cart.next=chosen(cart.node,opts[0]);cart.t=0;}}
function draw(){ctx.fillStyle='#292524';ctx.fillRect(0,0,W,H);
// rails
ctx.strokeStyle='#57534e';ctx.lineWidth=5;ctx.lineCap='round';
Object.keys(EDGES).forEach(k=>{const opts=EDGES[k];
const cur=chosen(+k,opts[0]);
const[a,b]=[nodeXY(+k),nodeXY(cur)];
ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();
// faint alt
if(opts.length>1){const alt=opts.find(o=>o!==cur);const c=nodeXY(alt);
ctx.strokeStyle='#57534e55';ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(c[0],c[1]);ctx.stroke();
ctx.strokeStyle='#57534e';}});
// junctions
Object.keys(EDGES).forEach(k=>{const opts=EDGES[k];if(opts.length>1){
const[x,y]=nodeXY(+k);
ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(x,y,9,0,7);ctx.fill();}});
// items
gems.forEach(g=>{const[x,y]=nodeXY(g.node);
ctx.font='20px serif';ctx.textAlign='center';ctx.fillText(g.e,x,y-14);});
// cart
const from=nodeXY(cart.node),to=nodeXY(cart.next);
const cx=from[0]+(to[0]-from[0])*cart.t,cy=from[1]+(to[1]-from[1])*cart.t;
ctx.font='26px serif';ctx.fillText('🛒',cx,cy+8);
if(playing){step();requestAnimationFrame(draw);}}
document.getElementById('btn').onclick=()=>{cart={node:0,next:1,t:0};junctions={};
gems=[];hp=3;gemsGot=0;speed=1;
document.getElementById('g').textContent=0;document.getElementById('h').textContent=3;
document.getElementById('s').textContent='1×';document.getElementById('ov').style.display='none';playing=true;
placeItems();AU.__c=new (window.AudioContext||window.webkitAudioContext)();draw();};
placeItems();
</script></body></html>
