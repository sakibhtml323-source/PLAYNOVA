<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Royal Soup Stir #368</title><style>
body{margin:0;font-family:system-ui;background:#1e1b4b;color:#eef2ff;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a5b4fc;font-size:.78rem}
canvas{background:#312e81;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#fbbf24}
#msg{min-height:1.4em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#fbbf24;color:#1e1b4b;font-weight:700;cursor:pointer;margin:8px}
</style></head><body>
<h1>🍲 Royal Soup Stir</h1><div class="sub">Trace the stirring pattern in the cauldron — clockwise, wavy, or zigzag!</div>
<div id="hud"><span>Round <b id="r">1</b></span><span>Pattern <b id="p">○</b></span><span>Accuracy <b id="a">0</b>%</span></div>
<canvas id="cv" width="400" height="400"></canvas>
<div id="msg"></div>
<button id="btn">🥄 New Stir</button>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=400,CX=W/2,CY=W/2;
let pattern='circle',trail=[],targets=[],round=1,drawing=false;
function msg(t){document.getElementById('msg').textContent=t;}
function genPattern(){const pats=['circle','wave','zigzag'];
pattern=pats[(Math.random()*3)|0];
document.getElementById('p').textContent=pattern==='circle'?'○ Circle':pattern==='wave'?'〜 Wave':'⚡ Zigzag';
targets=[];
if(pattern==='circle'){for(let a=0;a<Math.PI*2.01;a+=0.15)
targets.push({x:CX+100*Math.cos(a),y:CY+100*Math.sin(a),hit:false});}
if(pattern==='wave'){for(let i=0;i<=40;i++){const x=CX-140+i*7;
targets.push({x,y:CY+50*Math.sin(i/40*Math.PI*3),hit:false});}}
if(pattern==='zigzag'){for(let i=0;i<=40;i++){const x=CX-140+i*7;
targets.push({x,y:CY+(i%8<4?-50:50),hit:false});}}
trail=[];draw();msg('Trace the pattern!');}
cvs.addEventListener('pointerdown',e=>{drawing=true;addPt(e);});
cvs.addEventListener('pointermove',e=>{if(drawing)addPt(e);});
cvs.addEventListener('pointerup',()=>{drawing=false;check();});
function addPt(e){const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*W/r.height;
trail.push({x,y});
targets.forEach(t=>{if(!t.hit&&Math.hypot(t.x-x,t.y-y)<18)t.hit=true;});
beep(300+trail.length*4,.03);draw();}
function check(){const hit=targets.filter(t=>t.hit).length;
const pct=Math.round(hit/targets.length*100);
document.getElementById('a').textContent=pct;
if(pct>=75){beep(880,.3,'triangle');msg('🍲 Perfect stir! Round '+(round+1));round++;
document.getElementById('r').textContent=round;
setTimeout(genPattern,1000);}
else{beep(200,.15,'sawtooth');msg('🥄 '+(75-pct)+'% short — try again!');trail=[];draw();}}
function draw(){ctx.fillStyle='#312e81';ctx.fillRect(0,0,W,W);
// cauldron
ctx.beginPath();ctx.arc(CX,CY,160,0,7);ctx.fillStyle='#1e1b4b';ctx.fill();
ctx.strokeStyle='#4338ca';ctx.lineWidth=6;ctx.stroke();
// pattern
targets.forEach(t=>{ctx.beginPath();ctx.arc(t.x,t.y,t.hit?3:5,0,7);
ctx.fillStyle=t.hit?'#22c55e':'#6366f1';ctx.fill();});
// trail
if(trail.length>1){ctx.strokeStyle='#fbbf24';ctx.lineWidth=3;ctx.lineCap='round';
ctx.beginPath();ctx.moveTo(trail[0].x,trail[0].y);
trail.forEach(p=>ctx.lineTo(p.x,p.y));ctx.stroke();}}
document.getElementById('btn').onclick=()=>{round=1;document.getElementById('r').textContent=1;
AU.__c=new (window.AudioContext||window.webkitAudioContext)();genPattern();};
</script></body></html>
