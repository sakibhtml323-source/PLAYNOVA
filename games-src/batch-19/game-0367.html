<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ninja Ice Flow #367</title><style>
body{margin:0;font-family:system-ui;background:#0c4a6e;color:#e0f2fe;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#7dd3fc;font-size:.78rem}
#grid{display:grid;grid-template-columns:repeat(7,46px);gap:2px;margin:12px}
.c{width:46px;height:46px;background:#075985;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px}
.c.ice{background:#38bdf833}.c.rock{background:#334155}.c.goal{background:#166534}
#pad{display:grid;grid-template-columns:repeat(3,52px);gap:4px;margin:8px}
.pd{width:52px;height:42px;border-radius:10px;border:none;background:#334155;color:#fff;font-size:1.1rem;cursor:pointer}
#hud{display:flex;gap:14px;font-size:.9rem;margin:4px}#hud b{color:#fbbf24}
#msg{min-height:1.3em;font-weight:600}
button{padding:10px 22px;border-radius:999px;border:none;background:#38bdf8;color:#0c4a6e;font-weight:800;cursor:pointer;margin:8px}
</style></head><body>
<h1>⛸️ Ninja Ice Flow</h1><div class="sub">On ice you slide in a straight line until something stops you!</div>
<div id="hud"><span>Level <b id="l">1</b></span><span>Moves <b id="m">0</b></span><span>Best <b id="b">—</b></span></div>
<div id="grid"></div>
<div id="pad"><div></div><button class="pd" data-d="u">⬆</button><div></div>
<button class="pd" data-d="l">⬅</button><button class="pd" data-d="d">⬇</button><button class="pd" data-d="r">➡</button></div>
<div id="msg"></div>
<button id="btn">❄️ New Glacier</button>
<audio id="au"></audio>
<script>
"use strict";
const AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const N=7;let grid=[],me={r:0,c:0},goal={r:6,c:6},moves=0,level=1,playing=true,best=+localStorage.getItem('nif_best')||Infinity;
document.getElementById('b').textContent=best<Infinity?best:'—';
function gen(){grid=[];for(let r=0;r<N;r++){const row=[];for(let c=0;c<N;c++)row.push(0);grid.push(row);}
const nr=5+level;for(let i=0;i<nr;i++){const r=(Math.random()*N)|0,c=(Math.random()*N)|0;
if((r===0&&c===0)||(r===6&&c===6))continue;grid[r][c]=1;}
for(let i=0;i<8;i++){const r=(Math.random()*N)|0,c=(Math.random()*N)|0;
if(!grid[r][c]&&(r||c)&&!(r===6&&c===6))grid[r][c]=2;}
me={r:0,c:0};goal={r:6,c:6};moves=0;playing=true;
document.getElementById('m').textContent=0;document.getElementById('l').textContent=level;
render();msg('Slide to the scroll!');}
function slide(dr,dc){if(!playing)return;
let r=me.r,c=me.c,steps=0;
while(true){const nr2=r+dr,nc=c+dc;
if(nr2<0||nr2>=N||nc<0||nc>=N)break;
if(grid[nr2][nc]===1)break;
r=nr2;c=nc;steps++;
if(grid[r][c]===2)break;
if(r===goal.r&&c===goal.c)break;}
if(!steps){beep(160,.06,'sawtooth');return;}
me={r,c};moves++;document.getElementById('m').textContent=moves;
beep(400+steps*40,.08);render();
if(r===goal.r&&c===goal.c){playing=false;beep(880,.3,'triangle');
if(moves<best){best=moves;localStorage.setItem('nif_best',best);document.getElementById('b').textContent=best;}
msg('🎉 Scroll reached in '+moves+' slides! Level '+(level+1));pnEmit('GAME_LEVEL_COMPLETED',{level:level});level++;
setTimeout(gen,1000);}}
function render(){const g=document.getElementById('grid');g.innerHTML='';
for(let r=0;r<N;r++)for(let c=0;c<N;c++){const d=document.createElement('div');
d.className='c'+(grid[r][c]===1?' rock':grid[r][c]===2?' ice':'');
if(r===me.r&&c===me.c)d.textContent='🥷';
else if(r===goal.r&&c===goal.c)d.textContent='📜';
else if(grid[r][c]===1)d.textContent='🪨';
else if(grid[r][c]===2)d.textContent='🧊';
g.appendChild(d);}}
document.querySelectorAll('.pd').forEach(b=>b.addEventListener('pointerdown',()=>{
AU.__c=AU.__c||new (window.AudioContext||window.webkitAudioContext)();
const d=b.dataset.d;
if(d==='u')slide(-1,0);if(d==='d')slide(1,0);if(d==='l')slide(0,-1);if(d==='r')slide(0,1);}));
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();
if(k==='arrowup')slide(-1,0);if(k==='arrowdown')slide(1,0);
if(k==='arrowleft')slide(0,-1);if(k==='arrowright')slide(0,1);});
function msg(t){document.getElementById('msg').textContent=t;}
document.getElementById('btn').onclick=()=>{AU.__c=new (window.AudioContext||window.webkitAudioContext)();gen();};
gen();
</script></body></html>
