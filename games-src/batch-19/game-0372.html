<!DOCTYPE html>
<html lang="en">
<head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Desert Firefly Catch #372</title>
<script>window.__pnNoPad=true;</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#060a14;font-family:'Segoe UI',system-ui,Arial,sans-serif;color:#e8fff0;display:flex;flex-direction:column;align-items:center;overflow:hidden;padding:max(6px,env(safe-area-inset-top)) 6px max(6px,env(safe-area-inset-bottom))}
#hud{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;font-size:.82rem;margin:2px 0 6px}
#hud span{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:3px 12px;white-space:nowrap}
#hud b{color:#ffe066;font-variant-numeric:tabular-nums}
#wrap{position:relative;touch-action:none}
canvas{display:block;border-radius:18px;touch-action:none}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,9,20,.9);border-radius:18px;text-align:center;padding:18px;z-index:5;gap:6px}
.ov.hide{display:none}
.ov h2{font-size:1.7rem;color:#ffe066;letter-spacing:1px}
.ov p{line-height:1.45;font-size:.92rem;max-width:310px;opacity:.92}
.btn{background:linear-gradient(180deg,#7bffb2,#16a870);color:#032a1a;border:none;padding:13px 30px;border-radius:26px;font-size:1.05rem;font-weight:800;cursor:pointer;margin-top:10px;min-width:170px}
.btn.alt{background:rgba(255,255,255,.14);color:#e8fff0;font-weight:600;font-size:.88rem;padding:8px 18px;min-width:0}
.album{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:min(310px,90%);margin-top:6px}
.sp{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:5px 2px;font-size:1.25rem;line-height:1.1}
.sp small{display:block;font-size:.58rem;opacity:.8;margin-top:2px}
.sp.lock{filter:grayscale(1) brightness(.5)}
</style>
</head>
<body>
<div id="hud"><span>Round <b id="round">1</b></span><span>Score <b id="score">0</b></span><span id="lives">❤❤❤</span><span>Best <b id="best">0</b></span></div>
<div id="wrap"><canvas id="c"></canvas><div class="ov" id="ov"></div></div>
<script>
"use strict";
const $=id=>document.getElementById(id);
const W=360,H=560,cvs=$('c'),ctx=cvs.getContext('2d');
function emit(t,x){try{if(typeof pnEmit==='function')pnEmit(t,x||{})}catch(e){}}
const COL=['#ff4d6d','#4cc9f0','#ffd23f','#7bff6a','#b388ff','#ff9f1c'];
const NOTE=[262,330,392,523,659,784];
const SPECIES=[['Sand Spark','✨',1],['Amber Wisp','🔶',3],['Ruby Ember','🔴',5],['Nile Glimmer','💠',7],['Moon Moth','🦋',9],['Scarab Lantern','🪲',11],['Sphinx Star','⭐',14],['Golden Ra','☀️',17],['Anubis Flame','🔥',20],['Pharaoh Spirit','👑',25]];
let SV={best:0,bestRound:0,games:0};
try{Object.assign(SV,JSON.parse(localStorage.getItem('ff_save')||'{}'));SV.best=Math.max(SV.best,+localStorage.getItem('ff_best')||0)}catch(e){}
function save(){try{localStorage.setItem('ff_save',JSON.stringify(SV));localStorage.setItem('ff_best',SV.best)}catch(e){}}
/* ---------- audio ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended'){try{AC.resume()}catch(e){}}return AC}
function tone(f,d,type,v,delay,slide){const a=ac();if(!a)return;try{const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.14,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03)}catch(e){}}
function note(i,d){tone(NOTE[i],d||.38,'sine',.17);tone(NOTE[i]*2,(d||.38)*.7,'triangle',.05)}
const sfx={bad(){tone(150,.4,'sawtooth',.14,0,-80);tone(110,.4,'square',.07,.05,-50)},
win(){[0,2,3,5].forEach((n,i)=>tone(NOTE[n]*1.5,.25,'triangle',.12,i*.08))},
over(){[392,330,262,196].forEach((f,i)=>tone(f,.4,'sawtooth',.1,i*.18))},
species(){[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.3,'triangle',.12,i*.07))}};
/* ---------- layout ---------- */
let css=1,dprR=1;
function resize(){css=Math.max(.4,Math.min((innerWidth-12)/W,(innerHeight-90)/H));dprR=Math.min(devicePixelRatio||1,2)*css;cvs.width=Math.round(W*dprR);cvs.height=Math.round(H*dprR);cvs.style.width=Math.round(W*css)+'px';cvs.style.height=Math.round(H*css)+'px'}
addEventListener('resize',resize);resize();
/* ---------- state ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
let state='menu',round=1,score=0,lives=3,seq=[],idx=0,nFly=4,flies=[],parts=[],floats=[],combo=1,mistakes=0,shake=0,tint=null,tintA=0,msgT='',msgA=0,time=0,stars=[],dust=[],runId=0;
stars=Array.from({length:80},()=>({x:Math.random()*W,y:Math.random()*H*.55,r:Math.random()*1.4+.3,p:Math.random()*6}));
dust=Array.from({length:26},()=>({x:Math.random()*W,y:Math.random()*H,r:rnd(.6,1.8),s:rnd(6,18),p:Math.random()*6}));
function layout(n){flies=[];for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n,x=W/2+Math.cos(a)*112,y=285+Math.sin(a)*150;flies.push({i,x,y,bx:x,by:y,glow:0,ph:Math.random()*6,wing:Math.random()*6})}}
function hud(){$('round').textContent=round;$('score').textContent=score;$('best').textContent=Math.max(SV.best,score);$('lives').textContent='❤'.repeat(Math.max(0,lives))+'🖤'.repeat(Math.max(0,3-lives))}
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=(sp||1)*rnd(30,150);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,r:rnd(1.5,4),c})}}
function ftxt(x,y,t,c,s){floats.push({x,y,t,c:c||'#fff',s:s||16,life:1})}
function light(i,d){const f=flies[i];f.glow=1;tint=COL[i];tintA=.28;note(i,d);burst(f.x,f.y,COL[i],18,1.1)}
/* ---------- flow ---------- */
function newGame(){runId++;round=1;score=0;lives=3;combo=1;mistakes=0;nFly=4;seq=[];layout(nFly);SV.games++;$('ov').classList.add('hide');hud();nextStep()}
async function nextStep(){const my=runId;if(round===4&&nFly<5){nFly=5;layout(5)}if(round===8&&nFly<6){nFly=6;layout(6)}
if(seq.length===0)for(let k=0;k<3;k++)seq.push((Math.random()*nFly)|0);else seq.push((Math.random()*nFly)|0);
while(seq.length>round+2)seq.shift();
await playSeq(my)}
async function playSeq(my){state='watch';msgT='Round '+round;msgA=1;hud();await wait(900);if(my!==runId)return;msgT='Watch…';msgA=1;await wait(500);
const gap=Math.max(200,520-round*16),dur=Math.max(210,430-round*12);
for(let k=0;k<seq.length;k++){if(my!==runId)return;await wait(gap);light(seq[k],dur/1000*1.1);await wait(dur)}
if(my!==runId)return;await wait(250);idx=0;mistakes=mistakes;state='input';msgT='Your turn!';msgA=1}
async function tap(i){if(state!=='input')return;const my=runId;ac();
if(i===seq[idx]){light(i,.3);const pts=10*combo;score+=pts;ftxt(flies[i].x,flies[i].y-34,'+'+pts,COL[i],17);idx++;hud();
if(idx>=seq.length){state='busy';await roundDone(my)}}
else{state='busy';await wrong(i,my)}}
async function roundDone(my){const perfect=mistakes===0;const bonus=50*round*(perfect?2:1);score+=bonus;if(perfect)combo=Math.min(8,combo+1);else combo=1;
sfx.win();flies.forEach(f=>{f.glow=1;burst(f.x,f.y,COL[f.i],12,1.3)});tint='#ffe066';tintA=.35;
msgT=perfect?'PERFECT! +'+bonus:'Round clear! +'+bonus;msgA=1.4;
if(round>SV.bestRound)SV.bestRound=round;if(score>SV.best)SV.best=score;
const ns=SPECIES.filter(s=>s[2]===round);
if(ns.length){await wait(700);if(my!==runId)return;sfx.species();ftxt(W/2,H*.18,'New species: '+ns[0][1]+' '+ns[0][0],'#ffe066',17);for(let k=0;k<4;k++)burst(rnd(60,300),rnd(120,420),'#ffe066',20,1.6)}
if(round%5===0&&lives<5){lives++;ftxt(W/2,H*.3,'+1 life ❤','#ff7b92',18)}
save();emit('GAME_LEVEL_COMPLETED',{level:round});hud();await wait(1300);if(my!==runId)return;round++;mistakes=0;hud();await nextStep()}
async function wrong(i,my){sfx.bad();shake=10;combo=1;mistakes++;lives--;hud();tint='#ff3040';tintA=.4;const f=flies[i];burst(f.x,f.y,'#ff3040',22,1.4);msgT=lives>0?'Oops! Watch again':'Out of lives';msgA=1.2;
if(lives<=0){await wait(900);if(my!==runId)return;gameOver();return}
await wait(1100);if(my!==runId)return;await playSeq(my)}
function gameOver(){state='over';sfx.over();emit('GAME_SCORE_UPDATED',{score});emit('GAME_LOST',{});if(score>SV.best)SV.best=score;save();hud();
const nu=SPECIES.filter(s=>s[2]<=SV.bestRound).length;
$('ov').innerHTML='<h2>Night is over 🌙</h2><p>Round <b>'+round+'</b> · Score <b>'+score+'</b><br>Best '+SV.best+' · Species '+nu+'/'+SPECIES.length+'</p><button class="btn" id="rt">CATCH AGAIN</button><button class="btn alt" id="mn">Album</button>';$('ov').classList.remove('hide');
$('rt').onclick=()=>{ac();newGame()};$('mn').onclick=()=>{menu()}}
function menu(){state='menu';runId++;let al='';SPECIES.forEach(s=>{const ok=s[2]<=SV.bestRound;al+='<div class="sp'+(ok?'':' lock')+'">'+(ok?s[1]:'❔')+'<small>'+(ok?s[0]:'Round '+s[2])+'</small></div>'});
$('ov').innerHTML='<h2>✨ FIREFLY CATCH</h2><p>Watch the fireflies light up, then tap them in the <b>same order</b>. Each round adds a step. Wrong tap = lose a life. Reach new rounds to discover rare species!</p><div class="album">'+al+'</div><p>Best '+SV.best+' · Best round '+SV.bestRound+'</p><button class="btn" id="pl">PLAY</button>';$('ov').classList.remove('hide');$('pl').onclick=()=>{ac();newGame()}}
/* ---------- render ---------- */
const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#050816');sky.addColorStop(.6,'#14224a');sky.addColorStop(.88,'#3a3a6a');sky.addColorStop(1,'#6a4a5a');
function draw(dt){time+=dt;ctx.setTransform(dprR,0,0,dprR,0,0);ctx.save();if(shake>0)ctx.translate(rnd(-shake,shake)/2,rnd(-shake,shake)/2);
ctx.fillStyle=sky;ctx.fillRect(-10,-10,W+20,H+20);
stars.forEach(s=>{ctx.globalAlpha=.35+.65*Math.abs(Math.sin(time*1.2+s.p));ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill()});ctx.globalAlpha=1;
const mg=ctx.createRadialGradient(60,80,3,60,80,55);mg.addColorStop(0,'rgba(255,246,220,1)');mg.addColorStop(.3,'rgba(255,236,190,.5)');mg.addColorStop(1,'rgba(255,236,190,0)');ctx.fillStyle=mg;ctx.fillRect(0,0,130,150);ctx.fillStyle='#fff6dc';ctx.beginPath();ctx.arc(60,80,15,0,6.283);ctx.fill();
ctx.fillStyle='#1a1838';ctx.beginPath();ctx.moveTo(210,H-90);ctx.lineTo(290,H-175);ctx.lineTo(370,H-90);ctx.fill();ctx.beginPath();ctx.moveTo(130,H-90);ctx.lineTo(180,H-140);ctx.lineTo(230,H-90);ctx.fill();
ctx.fillStyle='#120f2a';ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(0,H-80);for(let x=0;x<=W;x+=12)ctx.lineTo(x,H-80+Math.sin(x*.02+1)*10);ctx.lineTo(W,H);ctx.fill();
dust.forEach(d=>{d.y-=d.s*dt;d.x+=Math.sin(time+d.p)*6*dt;if(d.y<-4){d.y=H+4;d.x=Math.random()*W}ctx.globalAlpha=.25+.25*Math.sin(time*2+d.p);ctx.fillStyle='#ffe9a8';ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,6.283);ctx.fill()});ctx.globalAlpha=1;
if(tint&&tintA>0){ctx.fillStyle=tint;ctx.globalAlpha=tintA*.5;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;tintA-=dt*1.2}
/* fireflies */
flies.forEach(f=>{f.glow=Math.max(0,f.glow-dt*(state==='watch'?2.4:1.8));f.wing+=dt*26;f.x=f.bx+Math.sin(time*1.1+f.ph)*7;f.y=f.by+Math.cos(time*.9+f.ph)*6;
const c=COL[f.i],g=.28+f.glow*.72,r=34+f.glow*10;
const rg=ctx.createRadialGradient(f.x,f.y,2,f.x,f.y,r*1.9);rg.addColorStop(0,c);rg.addColorStop(.35,c+(f.glow>.4?'aa':'44'));rg.addColorStop(1,c+'00');ctx.globalAlpha=g;ctx.fillStyle=rg;ctx.beginPath();ctx.arc(f.x,f.y,r*1.9,0,6.283);ctx.fill();ctx.globalAlpha=1;
ctx.save();ctx.translate(f.x,f.y);ctx.rotate(Math.sin(time+f.ph)*.15);
ctx.fillStyle='rgba(220,240,255,'+(.35+.15*Math.sin(f.wing))+')';ctx.beginPath();ctx.ellipse(-13,-9,13,6+Math.sin(f.wing)*2.5,-.6,0,6.283);ctx.fill();ctx.beginPath();ctx.ellipse(13,-9,13,6+Math.sin(f.wing)*2.5,.6,0,6.283);ctx.fill();
ctx.fillStyle='#2a2438';ctx.beginPath();ctx.ellipse(0,-6,7,10,0,0,6.283);ctx.fill();ctx.beginPath();ctx.arc(0,-17,5.5,0,6.283);ctx.fill();
ctx.fillStyle=c;ctx.shadowColor=c;ctx.shadowBlur=8+f.glow*26;ctx.beginPath();ctx.ellipse(0,9,10,12,0,0,6.283);ctx.fill();ctx.shadowBlur=0;
ctx.fillStyle='rgba(255,255,255,'+(.3+f.glow*.7)+')';ctx.beginPath();ctx.ellipse(-3,6,3,4,0,0,6.283);ctx.fill();
if(state==='input'&&idx===0&&time%2<.1){}
ctx.restore();
ctx.fillStyle='rgba(255,255,255,.75)';ctx.font='700 11px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(f.i+1,f.x,f.y+34)});
/* progress dots */
if(seq.length&&(state==='input'||state==='watch'||state==='busy')){const n=seq.length,w=Math.min(14,(W-60)/n),x0=W/2-(n-1)*w/2;for(let k=0;k<n;k++){ctx.fillStyle=k<idx?'#7bffb2':'rgba(255,255,255,.22)';ctx.beginPath();ctx.arc(x0+k*w,H-34,4,0,6.283);ctx.fill()}}
if(combo>1){ctx.font='800 15px system-ui,sans-serif';ctx.textAlign='left';ctx.fillStyle='#ffe066';ctx.strokeStyle='rgba(0,0,0,.6)';ctx.lineWidth=3;ctx.strokeText('COMBO x'+combo,12,26);ctx.fillText('COMBO x'+combo,12,26)}
parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;p.life-=dt*1.5;ctx.globalCompositeOperation='lighter';ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r*(.4+p.life*.6),0,6.283);ctx.fill()});ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;parts=parts.filter(p=>p.life>0);
floats.forEach(f=>{f.y-=34*dt;f.life-=dt*.9;ctx.globalAlpha=Math.min(1,f.life*2);ctx.font='800 '+f.s+'px system-ui,sans-serif';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.strokeText(f.t,f.x,f.y);ctx.fillStyle=f.c;ctx.fillText(f.t,f.x,f.y)});ctx.globalAlpha=1;floats=floats.filter(f=>f.life>0);
if(msgA>0&&state!=='menu'&&state!=='over'){ctx.globalAlpha=Math.min(1,msgA);ctx.font='800 28px system-ui,sans-serif';ctx.textAlign='center';ctx.lineWidth=5;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.strokeText(msgT,W/2,64);ctx.fillStyle='#ffe066';ctx.fillText(msgT,W/2,64);ctx.globalAlpha=1;if(state!=='input'&&state!=='watch')msgA-=dt*.5;else msgA=Math.max(msgA,.85)}
ctx.restore();shake=Math.max(0,shake-dt*24)}
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;draw(dt)}
/* ---------- input ---------- */
function hit(e){const b=cvs.getBoundingClientRect(),x=(e.clientX-b.left)*(W/b.width),y=(e.clientY-b.top)*(H/b.height);let bi=-1,bd=1e9;flies.forEach(f=>{const d=Math.hypot(f.x-x,f.y-y);if(d<bd){bd=d;bi=f.i}});return bd<52?bi:-1}
cvs.addEventListener('pointerdown',e=>{ac();const i=hit(e);if(i>=0)tap(i)});
addEventListener('keydown',e=>{const n=parseInt(e.key,10);if(n>=1&&n<=flies.length){tap(n-1);return}if((e.key==='Enter'||e.key===' ')&&!$('ov').classList.contains('hide')){const b=$('pl')||$('rt');if(b){e.preventDefault();b.click()}}});
/* ---------- boot ---------- */
layout(4);hud();menu();requestAnimationFrame(loop);
window.__ff={get state(){return state},get seq(){return seq},get idx(){return idx},get lives(){return lives},get round(){return round},get score(){return score},tap,newGame};
</script>
</body>
</html>
