<!DOCTYPE html>
<html lang="en"><head><script src="../../assets/js/pn-bridge.js"></script><script src="../../assets/js/pn-enhance.js"></script>
<meta name="robots" content="noindex,follow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Haunted Painting #366</title><style>
body{margin:0;font-family:system-ui;background:#18181b;color:#fafafa;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{font-size:1.1rem;margin:10px 0 2px}.sub{color:#a1a1aa;font-size:.78rem}
canvas{background:#27272a;border-radius:12px;touch-action:none;max-width:96vw}
#hud{display:flex;gap:14px;font-size:.9rem;margin:6px}#hud b{color:#facc15}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5}
button{padding:11px 26px;border-radius:999px;border:none;background:#7c3aed;color:#fff;font-weight:800;cursor:pointer;font-size:1rem}
</style></head><body>
<h1>🖼️ Haunted Painting</h1><div class="sub">Study the portrait — then it changes! Tap what the ghost altered.</div>
<div id="hud"><span>Level <b id="l">1</b></span><span>⏱️ study <b id="t">5</b>s</span><span>Found <b id="f">0</b>/1</span></div>
<canvas id="cv" width="400" height="400"></canvas>
<div id="ov"><div style="font-size:3rem">👻</div><p>Memorize the portrait.<br>Then tap the ONE thing that changed!</p><button id="btn">Study</button></div>
<audio id="au"></audio>
<script>
"use strict";
const cvs=document.getElementById('cv'),ctx=cvs.getContext('2d'),AU=document.getElementById('au');
function beep(f,d=.07,t='sine'){try{const o=AU.__c||(AU.__c=new (window.AudioContext||window.webkitAudioContext)());const os=o.createOscillator(),g=o.createGain();os.type=t;os.frequency.value=f;g.gain.setValueAtTime(.11,o.currentTime);g.gain.exponentialRampToValueAtTime(.001,o.currentTime+d);os.connect(g);g.connect(o.destination);os.start();os.stop(o.currentTime+d);}catch(e){}}
const W=400;let level=1,phase='study',items=[],changed=-1,timer=null;
const SLOT=[[100,100],[300,100],[100,300],[300,300],[200,200],[200,80],[200,320]];
function drawPortrait(){ctx.fillStyle='#27272a';ctx.fillRect(0,0,W,W);
ctx.strokeStyle='#57534e';ctx.lineWidth=8;ctx.strokeRect(10,10,W-20,W-20);
items.forEach((it,i)=>{ctx.font='40px serif';ctx.textAlign='center';
ctx.fillText(it.e,it.x,it.y+14);});}
function gen(){const pool=[['🎩',0],['👁️',1],['👁️',1],['👃',2],['👄',3],['🕯️',4],['🦇',5],['🌙',6]];
const n=Math.min(4+level,7);
items=[];const used=pool.slice().sort(()=>Math.random()-.5).slice(0,n);
used.forEach(([e,slot],i)=>{items.push({e,slot,x:SLOT[slot][0],y:SLOT[slot][1]});});
// pick one item to swap emoji
changed=(Math.random()*items.length)|0;
document.getElementById('l').textContent=level;
document.getElementById('f').textContent=0;
phase='study';
drawPortrait();
let t=Math.max(2,6-level);
document.getElementById('t').textContent=t;
clearInterval(timer);timer=setInterval(()=>{t--;document.getElementById('t').textContent=t;
if(t<=0){clearInterval(timer);ghostChange();}},1000);}
function ghostChange(){phase='play';
const it=items[changed];
const swaps={'🎩':'👑','👁️':'👁️','👃':'🐽','👄':'🦷','🕯️':'🔥','🦇':'🦉','🌙':'☀️'};
it.e=swaps[it.e]||'❓';
drawPortrait();msgShow('👻 Something changed… tap it!');}
function msgShow(t){const el=document.createElement('div');
el.style.cssText='position:fixed;bottom:70px;left:50%;transform:translateX(-50%);color:#facc15;font-weight:700';
el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),1800);}
cvs.addEventListener('pointerdown',e=>{if(phase!=='play')return;const r=cvs.getBoundingClientRect();
const x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*W/r.height;
let best=-1,bd=1e9;
items.forEach((it,i)=>{const d=Math.hypot(it.x-x,it.y-y);if(d<bd){bd=d;best=i;}});
if(best===changed){beep(880,.3,'triangle');msgShow('✅ Found it! Level '+(level+1));level++;
setTimeout(gen,1000);}
else{beep(150,.2,'sawtooth');msgShow('❌ The ghost laughs…');}});
document.getElementById('btn').onclick=()=>{level=1;AU.__c=new (window.AudioContext||window.webkitAudioContext)();
document.getElementById('ov').style.display='none';gen();};
</script></body></html>
